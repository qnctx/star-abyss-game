<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星渊迷航 STAR ABYSS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

// ============================================================
// CONFIGURATION
// ============================================================
const CFG = {
  WIDTH: 1024,
  HEIGHT: 768,
  BASE_SIZE: 48,
  PLAYER_RADIUS: 12,
  PLAYER_SPEED: 3.5,
  SPRINT_MULT: 1.6,
  OXYGEN_MAX: 180,
  OXYGEN_DRAIN: 1,          // per second
  OXYGEN_SPRINT_DRAIN: 2.5, // per second extra when sprinting
  RESPAWN_OXY_PENALTY: 60,
  BASE_HP: 100,
  BASE_DAMAGE: 10,
  DAY_DURATION: 45,
  NIGHT_DURATION: 25,
  SHOOT_COOLDOWN: 0.15,
  PLAYER_BULLET_SPEED: 8,
  PLAYER_BULLET_DMG: 8,
  PLAYER_BULLET_RANGE: 400,

  // Turret defs: [cost, fireRate, damage, range, bulletSpeed, splashRadius]
  TURRET_MG:     { cost: 10, fireRate: 0.1, dmg: 3,  range: 250, speed: 9,  splash: 0 },
  TURRET_LASER:  { cost: 25, fireRate: 0.6, dmg: 30, range: 350, speed: 12, splash: 0 },
  TURRET_MISSILE:{ cost: 50, fireRate: 1.2, dmg: 20, range: 300, speed: 5,  splash: 60 },
};

const TURRET_TYPES = [CFG.TURRET_MG, CFG.TURRET_LASER, CFG.TURRET_MISSILE];
const TURRET_NAMES = ['Machine Gun', 'Laser', 'Missile'];

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CFG.WIDTH;
canvas.height = CFG.HEIGHT;

// ============================================================
// INPUT
// ============================================================
const keys = {};
const mouse = { x: CFG.WIDTH / 2, y: CFG.HEIGHT / 2, down: false };

document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') {
    if (game.state === 'title') startGame();
  }
  if (e.key.toLowerCase() === 'r' && game.state === 'over') startGame();
  if (e.key === '1') game.selectedTurret = 0;
  if (e.key === '2') game.selectedTurret = 1;
  if (e.key === '3') game.selectedTurret = 2;
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; });
canvas.addEventListener('mouseup', e => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// UTILITIES
// ============================================================
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }
function rndInt(lo, hi) { return Math.floor(rnd(lo, hi + 1)); }

// ============================================================
// PARTICLE SYSTEM
// ============================================================
const particles = [];
function spawnParticles(x, y, color, count, speed, life) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = rnd(0.5, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, maxLife: life, color, size: rnd(1, 3) });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// FLOATING TEXT
// ============================================================
const floatingTexts = [];
function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1.0, maxLife: 1.0 });
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 30 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (const ft of floatingTexts) {
    const alpha = ft.life / ft.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// STARS (background)
// ============================================================
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({ x: Math.random() * CFG.WIDTH, y: Math.random() * CFG.HEIGHT, brightness: rnd(0.2, 1), size: rnd(0.5, 2) });
}

function drawStars(nightAlpha) {
  for (const s of stars) {
    const flicker = 0.7 + 0.3 * Math.sin(Date.now() * 0.001 + s.x);
    ctx.globalAlpha = s.brightness * flicker * nightAlpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// GAME STATE
// ============================================================
let game = {};

function resetGameState() {
  game = {
    state: 'title',   // title | playing | over
    time: 0,
    dayTime: 0,
    isNight: false,
    nightProgress: 0, // 0 = full day, 1 = full night
    wave: 0,
    waveTimer: 0,
    waveSpawnTimer: 0,
    waveEnemiesRemaining: 0,
    waveActive: false,
    score: 0,
    resources: { iron: 0, energy: 0 },
    oxygen: CFG.OXYGEN_MAX,
    shakeX: 0,
    shakeY: 0,
    shakeDuration: 0,
    shakeIntensity: 0,
    selectedTurret: 0,

    player: {
      x: CFG.WIDTH / 2,
      y: CFG.HEIGHT / 2,
      vx: 0,
      vy: 0,
      angle: 0,
      shootTimer: 0,
      hp: 100,
      maxHp: 100,
      trail: [],
      invulnTimer: 0,
      alive: true,
      respawnTimer: 0,
    },

    base: {
      x: CFG.WIDTH / 2,
      y: CFG.HEIGHT / 2,
      hp: CFG.BASE_HP,
      maxHp: CFG.BASE_HP,
      pulsePhase: 0,
    },

    enemies: [],
    bullets: [],
    turrets: [],
    resources_drops: [],
    stars_fog: [],
  };

  // Pre-generate fog patches
  for (let i = 0; i < 12; i++) {
    game.stars_fog.push({
      x: Math.random() * CFG.WIDTH,
      y: Math.random() * CFG.HEIGHT,
      radius: rnd(80, 200),
      drift: rnd(-0.3, 0.3),
      phase: Math.random() * Math.PI * 2,
    });
  }
}

resetGameState();

// ============================================================
// GAME START / RESTART
// ============================================================
function startGame() {
  resetGameState();
  game.state = 'playing';
  game.time = 0;
  game.dayTime = 0;
}

// ============================================================
// SPAWN HELPERS
// ============================================================
function spawnEnemy() {
  const wave = game.wave;
  const side = rndInt(0, 3);
  let x, y;
  if (side === 0) { x = -20; y = rnd(0, CFG.HEIGHT); }
  else if (side === 1) { x = CFG.WIDTH + 20; y = rnd(0, CFG.HEIGHT); }
  else if (side === 2) { x = rnd(0, CFG.WIDTH); y = -20; }
  else { x = rnd(0, CFG.WIDTH); y = CFG.HEIGHT + 20; }

  const speed = rnd(0.6, 1.0) + wave * 0.04;
  const hp = 15 + wave * 5;
  const size = 8 + wave * 0.5;

  game.enemies.push({
    x, y, speed, hp, maxHp: hp, size,
    angle: 0,
    pulsePhase: Math.random() * Math.PI * 2,
    target: 'base', // 'base' or 'player'
    hitTimer: 0,
  });
}

function spawnPlayerBullet(tx, ty) {
  const p = game.player;
  const a = Math.atan2(ty - p.y, tx - p.x);
  game.bullets.push({
    x: p.x, y: p.y,
    vx: Math.cos(a) * CFG.PLAYER_BULLET_SPEED,
    vy: Math.sin(a) * CFG.PLAYER_BULLET_SPEED,
    dmg: CFG.PLAYER_BULLET_DMG,
    range: CFG.PLAYER_BULLET_RANGE,
    traveled: 0,
    owner: 'player',
    color: '#ff0',
    size: 2.5,
  });
}

function spawnTurretBullet(turret, target) {
  const a = angle(turret, target);
  const def = TURRET_TYPES[turret.type];
  const colors = ['#aaa', '#0ff', '#f80'];
  const sizes = [2, 3, 4];
  game.bullets.push({
    x: turret.x, y: turret.y,
    vx: Math.cos(a) * def.speed,
    vy: Math.sin(a) * def.speed,
    dmg: def.dmg,
    range: def.range,
    traveled: 0,
    owner: 'turret',
    color: colors[turret.type],
    size: sizes[turret.type],
    splash: def.splash,
  });
}

function spawnResourceDrop(x, y) {
  const isEnergy = Math.random() < 0.35;
  game.resources_drops.push({
    x: x + rnd(-15, 15),
    y: y + rnd(-15, 15),
    type: isEnergy ? 'energy' : 'iron',
    value: isEnergy ? 5 : 3,
    bobPhase: Math.random() * Math.PI * 2,
    life: 30, // disappears after 30s
  });
}

// ============================================================
// TRIGGER SHAKE
// ============================================================
function triggerShake(intensity, duration) {
  game.shakeIntensity = intensity;
  game.shakeDuration = duration;
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  if (game.state !== 'playing') return;

  game.time += dt;
  const player = game.player;
  const base = game.base;

  // --- Day/Night Cycle ---
  game.dayTime += dt;
  const cycleDuration = CFG.DAY_DURATION + CFG.NIGHT_DURATION;
  const cyclePos = game.dayTime % cycleDuration;
  const wasNight = game.isNight;
  game.isNight = cyclePos >= CFG.DAY_DURATION;

  if (game.isNight) {
    game.nightProgress = Math.min(1, (cyclePos - CFG.DAY_DURATION) / 5); // 5s transition
  } else {
    game.nightProgress = Math.max(0, 1 - cyclePos / 5);
  }

  // Wave management
  if (game.isNight && !wasNight) {
    // Night just started
    game.wave++;
    game.waveActive = true;
    game.waveEnemiesRemaining = 5 + game.wave * 2;
    game.waveTimer = 0;
    game.waveSpawnTimer = 0;
  }
  if (!game.isNight && wasNight) {
    game.waveActive = false;
  }

  // Spawn enemies during night
  if (game.waveActive && game.waveEnemiesRemaining > 0) {
    game.waveSpawnTimer += dt;
    const spawnInterval = Math.max(0.3, 1.5 - game.wave * 0.05);
    if (game.waveSpawnTimer >= spawnInterval) {
      game.waveSpawnTimer -= spawnInterval;
      spawnEnemy();
      game.waveEnemiesRemaining--;
    }
  }

  // --- Oxygen ---
  if (player.alive) {
    let drain = CFG.OXYGEN_DRAIN;
    if (keys['shift']) drain += CFG.OXYGEN_SPRINT_DRAIN;
    game.oxygen -= drain * dt;
    if (game.oxygen <= 0) {
      game.oxygen = 0;
      playerDie();
    }
  } else {
    // Respawn countdown
    player.respawnTimer -= dt;
    if (player.respawnTimer <= 0) {
      player.alive = true;
      player.x = base.x;
      player.y = base.y;
      player.hp = player.maxHp;
      player.invulnTimer = 2;
    }
  }

  // --- Player Movement ---
  if (player.alive) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
    }

    let speed = CFG.PLAYER_SPEED;
    if (keys['shift']) speed *= CFG.SPRINT_MULT;

    player.vx = lerp(player.vx, dx * speed, 0.2);
    player.vy = lerp(player.vy, dy * speed, 0.2);
    player.x += player.vx * dt * 60;
    player.y += player.vy * dt * 60;

    // Clamp to screen
    player.x = clamp(player.x, CFG.PLAYER_RADIUS, CFG.WIDTH - CFG.PLAYER_RADIUS);
    player.y = clamp(player.y, CFG.PLAYER_RADIUS, CFG.HEIGHT - CFG.PLAYER_RADIUS);

    // Aim toward mouse
    player.angle = angle(player, mouse);

    // Trail
    if (Math.abs(player.vx) > 0.3 || Math.abs(player.vy) > 0.3) {
      player.trail.push({ x: player.x, y: player.y, life: 0.4 });
    }
    for (let i = player.trail.length - 1; i >= 0; i--) {
      player.trail[i].life -= dt;
      if (player.trail[i].life <= 0) player.trail.splice(i, 1);
    }

    // Shoot
    player.shootTimer -= dt;
    if (mouse.down && player.shootTimer <= 0) {
      spawnPlayerBullet(mouse.x, mouse.y);
      player.shootTimer = CFG.SHOOT_COOLDOWN;
    }

    // Invulnerability
    if (player.invulnTimer > 0) player.invulnTimer -= dt;

    // Collect resources
    for (let i = game.resources_drops.length - 1; i >= 0; i--) {
      const r = game.resources_drops[i];
      if (dist(player, r) < 20) {
        game.resources[r.type] += r.value;
        game.score += r.value * 10;
        spawnFloatingText(r.x, r.y, `+${r.value} ${r.type}`, r.type === 'iron' ? '#ff0' : '#0af');
        spawnParticles(r.x, r.y, r.type === 'iron' ? '#ff0' : '#0af', 5, 2, 0.3);
        game.resources_drops.splice(i, 1);
      }
    }
  }

  // --- Enemies ---
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];
    e.pulsePhase += dt * 3;
    e.hitTimer = Math.max(0, e.hitTimer - dt);

    // Pick target: if close to player, chase player; else chase base
    const distToBase = dist(e, base);
    const distToPlayer = player.alive ? dist(e, player) : Infinity;
    if (distToPlayer < 120 && player.alive) {
      e.target = 'player';
    } else {
      e.target = 'base';
    }

    const target = e.target === 'player' ? player : base;
    const a = angle(e, target);
    e.angle = a;
    e.x += Math.cos(a) * e.speed * dt * 60;
    e.y += Math.sin(a) * e.speed * dt * 60;

    // Damage base
    if (e.target === 'base' && dist(e, base) < CFG.BASE_SIZE / 2 + e.size) {
      base.hp -= CFG.BASE_DAMAGE;
      e.hp = 0; // enemy dies on contact
      spawnParticles(e.x, e.y, '#f44', 8, 3, 0.5);
      spawnFloatingText(base.x, base.y - 30, `-${CFG.BASE_DAMAGE}`, '#f44');
      triggerShake(4, 0.2);
      if (base.hp <= 0) {
        game.state = 'over';
      }
    }

    // Damage player on contact
    if (e.target === 'player' && player.alive && player.invulnTimer <= 0 && dist(e, player) < CFG.PLAYER_RADIUS + e.size) {
      player.hp -= 15;
      player.invulnTimer = 0.5;
      e.hp = 0;
      spawnParticles(e.x, e.y, '#f44', 6, 2, 0.4);
      triggerShake(3, 0.15);
      if (player.hp <= 0) playerDie();
    }

    // Remove dead enemies
    if (e.hp <= 0) {
      spawnParticles(e.x, e.y, '#f44', 12, 3, 0.6);
      spawnResourceDrop(e.x, e.y);
      game.score += 50 + game.wave * 10;
      game.enemies.splice(i, 1);
      triggerShake(2, 0.1);
    }
  }

  // --- Turrets ---
  for (const t of game.turrets) {
    t.fireTimer -= dt;
    t.angle = lerp(t.angle, t.targetAngle, 0.15);

    // Find nearest enemy
    let nearest = null;
    let nearestDist = Infinity;
    for (const e of game.enemies) {
      const d = dist(t, e);
      if (d < t.range && d < nearestDist) {
        nearest = e;
        nearestDist = d;
      }
    }
    if (nearest) {
      t.targetAngle = angle(t, nearest);
      if (t.fireTimer <= 0) {
        spawnTurretBullet(t, nearest);
        t.fireTimer = TURRET_TYPES[t.type].fireRate;
      }
    }
  }

  // --- Bullets ---
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx * dt * 60;
    b.y += b.vy * dt * 60;
    b.traveled += Math.hypot(b.vx, b.vy) * dt * 60;

    if (b.traveled > b.range || b.x < -50 || b.x > CFG.WIDTH + 50 || b.y < -50 || b.y > CFG.HEIGHT + 50) {
      game.bullets.splice(i, 1);
      continue;
    }

    // Hit enemies
    if (b.owner === 'player' || b.owner === 'turret') {
      for (let j = game.enemies.length - 1; j >= 0; j--) {
        const e = game.enemies[j];
        if (dist(b, e) < e.size + b.size) {
          e.hp -= b.dmg;
          e.hitTimer = 0.1;
          spawnParticles(b.x, b.y, '#fff', 3, 1.5, 0.2);

          // Splash damage
          if (b.splash) {
            for (const e2 of game.enemies) {
              if (e2 !== e && dist(b, e2) < b.splash) {
                e2.hp -= b.dmg * 0.5;
                e2.hitTimer = 0.1;
              }
            }
            spawnParticles(b.x, b.y, '#f80', 15, 4, 0.4);
          }

          game.bullets.splice(i, 1);
          break;
        }
      }
    }
  }

  // --- Place Turret ---
  if (keys[' '] && game.selectedTurret !== undefined) {
    // Actually, use click placement when in range of base
  }
  // Right click to place turret (or click when near base)
  // We use: press 1/2/3 to select, then left-click to place
  // But left click is also shoot. So: hold E + click to place
  if (keys['e'] && mouse.down) {
    const def = TURRET_TYPES[game.selectedTurret];
    if (game.resources.iron >= def.cost) {
      const placeX = mouse.x;
      const placeY = mouse.y;
      // Must be within range of base
      if (dist({ x: placeX, y: placeY }, base) < 350) {
        // Check not too close to other turrets
        let tooClose = false;
        for (const t of game.turrets) {
          if (dist({ x: placeX, y: placeY }, t) < 35) tooClose = true;
        }
        if (!tooClose) {
          game.resources.iron -= def.cost;
          game.turrets.push({
            x: placeX, y: placeY,
            type: game.selectedTurret,
            angle: 0,
            targetAngle: 0,
            fireTimer: 0,
            range: def.range,
          });
          spawnParticles(placeX, placeY, '#aaa', 10, 2, 0.3);
          spawnFloatingText(placeX, placeY - 20, `-${def.cost} iron`, '#ff0');
          keys['e'] = false; // consume the keypress
        }
      }
    }
  }

  // --- Resource decay ---
  for (let i = game.resources_drops.length - 1; i >= 0; i--) {
    game.resources_drops[i].life -= dt;
    game.resources_drops[i].bobPhase += dt * 3;
    if (game.resources_drops[i].life <= 0) game.resources_drops.splice(i, 1);
  }

  // --- Update particles ---
  updateParticles(dt);
  updateFloatingTexts(dt);

  // --- Screen shake ---
  if (game.shakeDuration > 0) {
    game.shakeDuration -= dt;
    game.shakeX = (Math.random() - 0.5) * game.shakeIntensity * 2;
    game.shakeY = (Math.random() - 0.5) * game.shakeIntensity * 2;
  } else {
    game.shakeX = 0;
    game.shakeY = 0;
  }
}

function playerDie() {
  const player = game.player;
  player.alive = false;
  player.respawnTimer = 3;
  game.oxygen = Math.max(0, game.oxygen - CFG.RESPAWN_OXY_PENALTY);
  spawnParticles(player.x, player.y, '#fff', 20, 4, 0.8);
  triggerShake(6, 0.3);
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  const player = game.player;
  const base = game.base;
  const night = game.nightProgress;

  // Background
  const bgR = Math.round(lerp(10, 5, night));
  const bgG = Math.round(lerp(10, 3, night));
  const bgB = Math.round(lerp(26, 15, night));
  ctx.fillStyle = `rgb(${bgR},${bgG},${bgB})`;
  ctx.fillRect(0, 0, CFG.WIDTH, CFG.HEIGHT);

  // Stars (visible at night)
  drawStars(night);

  // Fog patches
  for (const f of game.stars_fog) {
    f.x += f.drift * 0.3;
    if (f.x < -f.radius) f.x = CFG.WIDTH + f.radius;
    if (f.x > CFG.WIDTH + f.radius) f.x = -f.radius;

    const fogAlpha = 0.03 + night * 0.06;
    const gradient = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    const hue = 280 + Math.sin(f.phase + game.time * 0.5) * 40;
    gradient.addColorStop(0, `hsla(${hue}, 60%, 30%, ${fogAlpha})`);
    gradient.addColorStop(1, `hsla(${hue}, 60%, 10%, 0)`);
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(game.shakeX, game.shakeY);

  // --- Resources ---
  for (const r of game.resources_drops) {
    const bob = Math.sin(r.bobPhase) * 3;
    const alpha = r.life < 3 ? r.life / 3 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = r.type === 'iron' ? '#ff0' : '#0af';
    ctx.beginPath();
    ctx.arc(r.x, r.y + bob, 4, 0, Math.PI * 2);
    ctx.fill();
    // Glow
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath();
    ctx.arc(r.x, r.y + bob, 8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- Base Pod ---
  base.pulsePhase += 0.03;
  const pulse = 0.6 + 0.4 * Math.sin(base.pulsePhase);
  const baseHpRatio = base.hp / base.maxHp;

  // Outer glow
  const glowSize = CFG.BASE_SIZE * 1.5 + pulse * 10;
  const glow = ctx.createRadialGradient(base.x, base.y, CFG.BASE_SIZE / 2, base.x, base.y, glowSize);
  glow.addColorStop(0, `rgba(0, 255, 100, ${0.15 * pulse})`);
  glow.addColorStop(1, 'rgba(0, 255, 100, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(base.x, base.y, glowSize, 0, Math.PI * 2);
  ctx.fill();

  // Base square
  ctx.fillStyle = baseHpRatio > 0.5 ? '#0a4' : baseHpRatio > 0.25 ? '#a80' : '#a00';
  ctx.fillRect(base.x - CFG.BASE_SIZE / 2, base.y - CFG.BASE_SIZE / 2, CFG.BASE_SIZE, CFG.BASE_SIZE);
  ctx.strokeStyle = `rgba(0, 255, 100, ${0.5 + pulse * 0.5})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(base.x - CFG.BASE_SIZE / 2, base.y - CFG.BASE_SIZE / 2, CFG.BASE_SIZE, CFG.BASE_SIZE);

  // --- Turrets ---
  for (const t of game.turrets) {
    const def = TURRET_TYPES[t.type];
    const colors = ['#666', '#088', '#840'];
    const borderColors = ['#aaa', '#0ff', '#f80'];
    ctx.fillStyle = colors[t.type];
    ctx.beginPath();
    ctx.arc(t.x, t.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = borderColors[t.type];
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Barrel
    ctx.strokeStyle = borderColors[t.type];
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y);
    ctx.lineTo(t.x + Math.cos(t.angle) * 18, t.y + Math.sin(t.angle) * 18);
    ctx.stroke();
  }

  // --- Enemies ---
  for (const e of game.enemies) {
    const pulse = 0.7 + 0.3 * Math.sin(e.pulsePhase);
    const hitFlash = e.hitTimer > 0 ? 1 : 0;

    // Glow
    ctx.globalAlpha = 0.3 * pulse;
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size * 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Hexagon
    ctx.globalAlpha = 1;
    ctx.fillStyle = hitFlash ? '#fff' : `rgba(200, 30, 30, ${0.8 + pulse * 0.2})`;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = (Math.PI / 3) * k + e.pulsePhase * 0.2;
      const px = e.x + Math.cos(a) * e.size;
      const py = e.y + Math.sin(a) * e.size;
      if (k === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 80, 80, ${pulse})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.size * 2;
      const bh = 3;
      const bx = e.x - bw / 2;
      const by = e.y - e.size - 8;
      ctx.fillStyle = '#400';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#f44';
      ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
    }
  }

  // --- Player ---
  if (player.alive) {
    // Trail
    for (const t of player.trail) {
      const alpha = t.life / 0.4;
      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, CFG.PLAYER_RADIUS * alpha * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Invuln flash
    if (player.invulnTimer > 0 && Math.sin(player.invulnTimer * 30) > 0) {
      ctx.globalAlpha = 0.4;
    }

    // Body
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.x, player.y, CFG.PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Aim line
    ctx.strokeStyle = '#8af';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(player.angle) * 25, player.y + Math.sin(player.angle) * 25);
    ctx.stroke();

    ctx.globalAlpha = 1;
  } else {
    // Respawn indicator
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(game.time * 5);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Respawning in ${Math.ceil(player.respawnTimer)}...`, player.x, player.y - 20);
    ctx.globalAlpha = 1;
  }

  // --- Bullets ---
  for (const b of game.bullets) {
    // Trail
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x - b.vx * 0.3, b.y - b.vy * 0.3, b.size * 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- Particles ---
  drawParticles();
  drawFloatingTexts();

  ctx.restore(); // End shake

  // --- HUD ---
  drawHUD();
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  const player = game.player;

  // O2 Bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, 10, 200, 20);
  const o2Ratio = game.oxygen / CFG.OXYGEN_MAX;
  const o2Color = o2Ratio > 0.3 ? '#08f' : o2Ratio > 0.1 ? '#fa0' : '#f00';
  ctx.fillStyle = o2Color;
  ctx.fillRect(10, 10, 200 * o2Ratio, 20);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 200, 20);
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`O2: ${Math.ceil(game.oxygen)}s`, 14, 24);

  // Player HP
  if (player.alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 36, 150, 14);
    const hpRatio = player.hp / player.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? '#0a0' : hpRatio > 0.25 ? '#a80' : '#a00';
    ctx.fillRect(10, 36, 150 * hpRatio, 14);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(10, 36, 150, 14);
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(`HP: ${Math.ceil(player.hp)}/${player.maxHp}`, 14, 47);
  }

  // Base HP
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, 56, 150, 14);
  const baseHpRatio = game.base.hp / game.base.maxHp;
  ctx.fillStyle = baseHpRatio > 0.5 ? '#0a4' : baseHpRatio > 0.25 ? '#a80' : '#a00';
  ctx.fillRect(10, 56, 150 * baseHpRatio, 14);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(10, 56, 150, 14);
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText(`Base: ${Math.ceil(game.base.hp)}/${game.base.maxHp}`, 10 + 2, 67);

  // Wave & Score
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = '14px monospace';
  ctx.fillText(`Wave: ${game.wave}`, 10, 92);
  ctx.fillText(`Score: ${game.score}`, 10, 110);

  // Resources
  ctx.fillStyle = '#ff0';
  ctx.fillText(`Iron: ${game.resources.iron}`, 10, 130);
  ctx.fillStyle = '#0af';
  ctx.fillText(`Energy: ${game.resources.energy}`, 10, 148);

  // Day/Night indicator
  ctx.textAlign = 'right';
  ctx.font = '16px monospace';
  const cycleDuration = CFG.DAY_DURATION + CFG.NIGHT_DURATION;
  const cyclePos = game.dayTime % cycleDuration;
  const timeLeft = game.isNight
    ? CFG.NIGHT_DURATION - (cyclePos - CFG.DAY_DURATION)
    : CFG.DAY_DURATION - cyclePos;

  ctx.fillStyle = game.isNight ? '#a8f' : '#ff8';
  ctx.fillText(game.isNight ? 'Night' : 'Day', CFG.WIDTH - 10, 30);
  ctx.font = '12px monospace';
  ctx.fillText(`${Math.ceil(timeLeft)}s`, CFG.WIDTH - 10, 48);

  // Sun/Moon icon
  const iconX = CFG.WIDTH - 50;
  const iconY = 38;
  ctx.beginPath();
  if (game.isNight) {
    // Moon
    ctx.fillStyle = '#ccf';
    ctx.arc(iconX, iconY, 10, 0, Math.PI * 2);
    ctx.fill();
    const nightBg = Math.round(lerp(10, 5, game.nightProgress));
    ctx.fillStyle = `rgb(${nightBg},${nightBg},${Math.round(lerp(26, 15, game.nightProgress))})`;
    ctx.arc(iconX + 4, iconY - 2, 8, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Sun
    ctx.fillStyle = '#ff8';
    ctx.arc(iconX, iconY, 8, 0, Math.PI * 2);
    ctx.fill();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 + game.time;
      ctx.beginPath();
      ctx.moveTo(iconX + Math.cos(a) * 11, iconY + Math.sin(a) * 11);
      ctx.lineTo(iconX + Math.cos(a) * 14, iconY + Math.sin(a) * 14);
      ctx.strokeStyle = '#ff8';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // Turret selector
  ctx.textAlign = 'left';
  ctx.font = '12px monospace';
  const selY = CFG.HEIGHT - 70;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(CFG.WIDTH / 2 - 120, selY - 5, 240, 60);

  const turretLabels = ['[1] MG', '[2] Laser', '[3] Missile'];
  const turretColors = ['#aaa', '#0ff', '#f80'];
  const turretCosts = TURRET_TYPES.map(t => t.cost);
  for (let k = 0; k < 3; k++) {
    const tx = CFG.WIDTH / 2 - 105 + k * 82;
    ctx.fillStyle = k === game.selectedTurret ? turretColors[k] : '#666';
    ctx.font = k === game.selectedTurret ? 'bold 12px monospace' : '12px monospace';
    ctx.fillText(turretLabels[k], tx, selY + 15);
    ctx.fillStyle = '#ff0';
    ctx.font = '10px monospace';
    ctx.fillText(`${turretCosts[k]} iron`, tx, selY + 30);
    if (game.resources.iron < turretCosts[k]) {
      ctx.fillStyle = '#f44';
      ctx.fillText('(need iron)', tx, selY + 42);
    }
  }

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('WASD move | Mouse aim+click shoot | E+click place turret | Shift sprint', CFG.WIDTH / 2, CFG.HEIGHT - 8);

  // Wave incoming text
  if (game.waveActive && game.waveEnemiesRemaining > 0) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = `rgba(255, 50, 50, ${0.6 + 0.4 * Math.sin(game.time * 4)})`;
    ctx.fillText(`WAVE ${game.wave} — ${game.waveEnemiesRemaining} remaining`, CFG.WIDTH / 2, 30);
  }
}

// ============================================================
// TITLE SCREEN
// ============================================================
function drawTitle() {
  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, CFG.WIDTH, CFG.HEIGHT);

  // Stars
  drawStars(0.8);

  // Fog
  for (const f of game.stars_fog) {
    f.x += f.drift * 0.2;
    const fogAlpha = 0.04;
    const gradient = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    gradient.addColorStop(0, `hsla(280, 60%, 30%, ${fogAlpha})`);
    gradient.addColorStop(1, 'hsla(280, 60%, 10%, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('星渊迷航', CFG.WIDTH / 2, CFG.HEIGHT / 2 - 60);
  ctx.font = 'bold 36px monospace';
  ctx.fillStyle = '#8af';
  ctx.fillText('STAR ABYSS', CFG.WIDTH / 2, CFG.HEIGHT / 2 - 15);

  // Subtitle
  ctx.font = '16px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText('Survival Tower Defense', CFG.WIDTH / 2, CFG.HEIGHT / 2 + 20);

  // Instructions
  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  const lines = [
    'WASD - Move    Mouse - Aim & Shoot',
    'Shift - Sprint (drains O2 faster)',
    '1/2/3 - Select turret type',
    'E + Click - Place turret',
    'Defend your base pod through the night!',
  ];
  lines.forEach((line, i) => {
    ctx.fillText(line, CFG.WIDTH / 2, CFG.HEIGHT / 2 + 60 + i * 22);
  });

  // Start prompt
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + 0.5 * Math.sin(Date.now() * 0.003)})`;
  ctx.fillText('Press SPACE to start', CFG.WIDTH / 2, CFG.HEIGHT / 2 + 200);
}

// ============================================================
// GAME OVER SCREEN
// ============================================================
function drawGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, CFG.WIDTH, CFG.HEIGHT);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('GAME OVER', CFG.WIDTH / 2, CFG.HEIGHT / 2 - 60);

  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText(`Score: ${game.score}`, CFG.WIDTH / 2, CFG.HEIGHT / 2);
  ctx.fillText(`Wave Reached: ${game.wave}`, CFG.WIDTH / 2, CFG.HEIGHT / 2 + 30);
  ctx.fillText(`Iron: ${game.resources.iron}  Energy: ${game.resources.energy}`, CFG.WIDTH / 2, CFG.HEIGHT / 2 + 60);

  ctx.font = 'bold 18px monospace';
  ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + 0.5 * Math.sin(Date.now() * 0.003)})`;
  ctx.fillText('Press R to restart', CFG.WIDTH / 2, CFG.HEIGHT / 2 + 110);
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (game.state === 'title') {
    // Update fog for title screen
    for (const f of game.stars_fog) {
      f.x += f.drift;
      if (f.x < -f.radius) f.x = CFG.WIDTH + f.radius;
      if (f.x > CFG.WIDTH + f.radius) f.x = -f.radius;
    }
    drawTitle();
  } else if (game.state === 'playing') {
    update(dt);
    draw();
  } else if (game.state === 'over') {
    // Still draw the game state behind
    draw();
    drawGameOver();
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// START
// ============================================================
requestAnimationFrame(gameLoop);

</script>
