<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEV-I-R2 场景存档与救援验证</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#101824;color:#e4eef9;max-width:1050px;margin:32px auto;padding:0 20px}button{font:inherit;padding:12px 18px;margin:6px;border:1px solid #6194bb;border-radius:6px;background:#213e58;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#182738;padding:18px}h1{font-size:26px}</style>
<h1>DEV-I-R2 场景存档与救援</h1><p>直接执行当前 R2 产品代码与真实 IndexedDB。逻辑场景夹具验证 checkpoint、真实 A 玩家败北、固定安全站保包救援；不是 D1 的 3D 场景验收。每组使用新测试世界，保留旧数据。</p>
<button id="scene">运行场景与救援 7 组</button><button id="regression">回归 I-R1 独立 10 组</button>
<p id="status" role="status">等待运行</p><pre id="log">结果日志</pre><details><summary>完整本轮证据</summary><pre id="evidence"></pre></details>
<script type="module">
import {openIndexedDB} from './indexeddb.mjs';
import {runSceneCases} from './scene-cases-r2.mjs';
import {runIndependent} from './r1-independent-r2.mjs';
const status=document.querySelector('#status'),log=document.querySelector('#log');
for(const [id,run,file] of [['scene',runSceneCases,'scene-browser-r2.json'],['regression',runIndependent,'r1-browser-regression-r2.json']])document.getElementById(id).onclick=async()=>{
 document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='正在真实 IndexedDB 中执行…';
 try{
  const result=await run((name,fault)=>openIndexedDB({name,fault}),'browser-IDB-R2');result.userAgent=navigator.userAgent;
  log.textContent=result.cases.map(c=>(c.pass?'PASS ':'FAIL ')+c.name+(c.error?'\n'+c.error:'')).join('\n');
  document.querySelector('#evidence').textContent=JSON.stringify(result,null,2);
  const response=await fetch('./evidence-r2/'+file,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result,null,2)});
  status.textContent=`${result.pass?'通过':'失败'} ${result.cases.filter(c=>c.pass).length}/${result.cases.length}；真实 IDB；证据${response.ok?'已保存':'保存失败'}`;
 }catch(e){status.textContent='失败：'+e.message;log.textContent=e.stack;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
};
</script></html>
