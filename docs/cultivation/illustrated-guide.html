>96 / 1,000 L\u003c/td>\u003ctd>0.05 kg / 0.01%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-RING-03 洞天戒\u003c/td>\u003ctd>化神—合道\u003c/td>\u003ctd>100,000→600,000 L\u003c/td>\u003ctd>144 / 10,000 L\u003c/td>\u003ctd>0.08 kg / 0.001%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-RING-04 星海戒\u003c/td>\u003ctd>星劫—道源\u003c/td>\u003ctd>1,000,000→6,000,000 L\u003c/td>\u003ctd>192 / 100,000 L\u003c/td>\u003ctd>0.10 kg / 0.0001%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>格数 \u003ccode>S=S0+floor((V−V0)/k)\u003c/code>，大容积显示 m³，计算仍用整数毫升。内部质量上限统一为 \u003ccode>5 kg × 容积 L\u003c/code>，不能把无限质量塞入一点体积。有效携重=外壳重＋内部物品实际质量×传重系数。例如基础储物戒装满 5,000 kg 原料传重约 5 kg，仍然需要真的有 1,000 L 和足够格数。\u003c/p>\u003cp>稀有机缘可能较早获得高一档法器，但使用门槛不满足时处于封存状态；可鉴定、交易或存放，不能跳过承载条件直接装备星海戒。后天纳物袋使用外置符芯，不要求先有真气；已装物品在符芯耗尽时仍封存保留，补能后可取，不爆掉库存。正常收取不持续耗真气，扩容才需要阵台与耗材。\u003c/p>\u003cp>一名角色最多绑定 1 个袋＋1 枚戒作为可访问空间容器，其他只能空置封存。\u003cstrong>禁止把含物品的空间容器放进任何其他容器或空间容器\u003c/strong>；要装进载具/仓库，先清空、解除绑定后按普通空壳存放。由此避免袋中套戒无限压重、换所有者复制库存。活物、整辆载具、已锚定场景建筑不接受收纳；载具拆件必须是独立物品且满足容量。\u003c/p>\u003cp>袋/戒使用人物专门佩戴槽，佩戴不等于塞入背包；角色佩戴它们乘车也不算容器嵌套，但传递后的携重计入载具货重。满袋作为物品拖到货舱则明确拒绝，二者在数据层分别为装备关系与容器包含关系。\u003c/p>\u003cp>宠物不装普通袋戒；灵栖契是单独的宠物休养/召回关系，不提供可交易物品空间。宠物驮架和骑乘质量规则见第15/17文档，骑手背负的折算质量只计一次。未孵化封存蛋为特殊物品可短期装入防护背包，初始按每蛋2格、8 L、3 kg；在空间容器中停止孵化，活体破壳必须移至合法孵化器，不能在背包里突然生成完整宠物。\u003c/p>\u003ch2>6. 扩容材料和基本技能\u003c/h2>\u003cp>后天六级、完成一次基础采集/鉴定后，可向 \u003cstrong>N05 闻止\u003c/strong> 学《纳物铭纹》Ⅰ。N03 提供科技稳纹台，教玩家用练习空壳刻一条纹路；练习对象不产生可交易储物袋。玩家没遇到储物袋也能先学知识。纳物袋的确定备用来源是 N03 后天十级的较长制作委托，随机洞府可能更早给出；不让容量系统完全被稀有运气锁死。\u003c/p>\u003cp>技能Ⅰ服务纳物/灵纹袋；灵海在 \u003cstrong>N12 玄仪\u003c/strong> 学Ⅱ，服务储物/须弥戒；化神在 \u003cstrong>N16 宁照\u003c/strong> 学Ⅲ，服务洞天戒；星劫在 \u003cstrong>N21 星岚\u003c/strong> 学Ⅳ，服务星海戒。学习需当前境界、前一阶知识和一次刻纹试验，不用空放数千次技能；NPC 学习不新增固定 NPC 名额。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>扩容材料 ID\u003c/th>\u003cth>来源层级/路径\u003c/th>\u003cth>Q3 标准单份增加\u003c/th>\u003cth>适用容器\u003c/th>\u003cth>所需技能\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EX01 空纹碎片\u003c/td>\u003ctd>T0 洞府残阵、后天精英委托\u003c/td>\u003ctd>8 L\u003c/td>\u003ctd>纳物袋、灵纹袋\u003c/td>\u003ctd>Ⅰ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX02 凝空砂\u003c/td>\u003ctd>T1 药谷空间矿夹层\u003c/td>\u003ctd>30 L\u003c/td>\u003ctd>纳物袋、灵纹袋\u003c/td>\u003ctd>Ⅰ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX03 空髓晶\u003c/td>\u003ctd>T2 镜晶矿的外围支脉/灵海洞府\u003c/td>\u003ctd>200 L\u003c/td>\u003ctd>储物戒、须弥戒\u003c/td>\u003ctd>Ⅱ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX04 须弥石\u003c/td>\u003ctd>T3—T4 镜渊秘室/雷原裂隙\u003c/td>\u003ctd>1,200 L\u003c/td>\u003ctd>储物戒、须弥戒\u003c/td>\u003ctd>Ⅱ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX05 界隙结晶\u003c/td>\u003ctd>T5—T6 母星界隙谷/空衡星\u003c/td>\u003ctd>12,000 L\u003c/td>\u003ctd>洞天戒\u003c/td>\u003ctd>Ⅲ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX06 星核砂\u003c/td>\u003ctd>T7 万象星陨矿/高阶洞府\u003c/td>\u003ctd>60,000 L\u003c/td>\u003ctd>洞天戒\u003c/td>\u003ctd>Ⅲ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EX07 原初空髓\u003c/td>\u003ctd>T8—T9 陨星带/源寂残阵\u003c/td>\u003ctd>400,000 L\u003c/td>\u003ctd>星海戒\u003c/td>\u003ctd>Ⅳ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>单份有效增容 \u003ccode>ΔV=基础增容×品质系数\u003c/code>，Q1—Q6 系数 0.65/0.85/1/1.25/1.6/2，与材料通用规则一致，取整至 1 L。可混合多份适用材料；低档容器不能用更高材料强行突破壳体上限，高档容器也不能无限吞低阶沙子。\u003c/p>\u003cp>一次订单还需本阶导气纹×1＋溶媒×1及服务费；技能学会后在营地/洞府稳纹台操作，NPC 可代操作但不绕过玩家知识前置。预览增容前后、增格阈值、材料消耗和是否溢出。会超过壳体上限的整份材料默认不投入，允许明确确认损失余量；不在后台截断又吞掉所有材料。\u003c/p>\u003cp>容器非空可扩容，但必须安置在稳纹台并锁定其内容，制作期间不可存取；完成只增加容量，不改物品 IDs。扩容无随机碎袋，失败的事务全退。由袋升戒是制作新容器再搬运，扩容过的袋不会被静默销毁。\u003c/p>\u003ch2>7. 灵石、快捷栏与物品归属\u003c/h2>\u003cp>灵石实体五面额每颗默认 0.005 kg/0.002 L，兑换 100 碎为 1 初级后携重也降低，提供兑换意义。钱包显示可访问容器里灵石的总等值，\u003cstrong>只是派生显示，不是额外一份可花余额\u003c/strong>。营地银行余额是独立账本，仅在授权的交易/仓储终端使用；野外吸收不能远程扣银行或货舱中的石头。\u003c/p>\u003cp>快捷栏绑定物品实例/堆叠位置；丹药要在身上已绑定可访问容器或药囊中才可用。放进飞行器、扩容中的戒指、未开启封存戒后，快捷栏显示不可取用。一次按键先校验容量位置/绑定/状态，再进入服药；不先播吃药再提示物品在远处。\u003c/p>\u003cp>双栏转移先预览格数、体积和双方负重，提交时同时从源扣除并加入目标；同一个实例只有一个 owner/container/location。交易装满的戒指必须先卸货，避免“卖戒却保留内容”或隐含替人转让大量资产。联网所有权遵循第 14 文档。\u003c/p>\u003ch2>8. 掉落、货舱遗留与恢复\u003c/h2>\u003cp>满包战利品保留原容器，可标记返回，原有 15 分钟有效游玩期限仍显示。玩家主动丢放的物品装入独立地面包，保留至少 60 分钟有效游玩，不能通过丢弃重置原战利品资格或伪造新原料。\u003c/p>\u003cp>人物昏迷救援带回穿戴、背包和已绑定空间袋/戒，保留既有成长。停在野外的载具及其货舱留在原处并地图标记；可步行取回，或在救援站付费用无人拖运，首次教学免费；没钱不丢唯一物，可以先接委托。载具失能后货舱不因模型销毁消失，生成持久残骸容器，修复或打捞才能取回。\u003c/p>\u003ch2>9. 界面与验收\u003c/h2>\u003cp>背包窗口显示格数、体积、负重三条信息，预览拿起物品后的速度变化；人物/袋/戒/附近货舱/仓库明确分栏，无远程“整理全部”。扩容面板显示材料来源、技能等级与本次增量。中文容量文字不能只挤进一条窄状态栏。\u003c/p>\u003cp>背包默认计划用 I 打开，保留现有 M 地图、J 档案、U 成长、Q 扫描、E 闪避、F 交互；不直接抢占历史 B 闪避别名。暂停/HUD 同时给背包入口，关窗恢复输入但不误触攻击。未靠近货舱时可查看已知货物清单，但转移按钮明确禁用，避免把只读预览当作远程取物。\u003c/p>\u003cp>验收包括满格未满体积、满体积未超重、堆叠不减重量、超重禁止动作、载具重复计重、袋戒嵌套拒绝、空壳交易、不同品质材料精确增容、溢出未授权不扣料、绑定容器迁移、恢复旧档物品不丢、断线转移不复制，以及负重与追逐采用同一速度结果。\u003c/p>"},{"file":"11_CAVES_AND_FORTUNES.md","title":"D3-11 · 随机洞府、机缘与角色差异","text":"# D3-11 · 随机洞府、机缘与角色差异\n\n\u003c!-- illustrated-overview:start -->\n![普通洞府与稀有机缘](media/diagram-11-v001.svg)\n\n*图解：普通洞府8%尝试与第7次线索保底，不保证极品奖励。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n新增残图与公共遗迹竞争：地图提供可核验入口知识，复印不复制机缘；玩家个人已预留机缘不会被远区NPC偷领，公共未归属机缘允许真实探索竞争，核心被取后不重置。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n2026-09-12；拟实现。依赖 [刷新系统](08_WORLD_DIRECTOR.md)、[储物](10_STORAGE_AND_ENCUMBRANCE.md)、[联网边界](14_OFFLINE_AND_ONLINE_BOUNDARY.md)。覆盖旧“机缘可能固定放置”的表述：固定的是模板、生态规律与验证过的候选入口，**机缘实例及奖励不再是全角色同坐标同答案**。\n\n## 1. 两类洞府不能混淆\n\n探索洞府是远古实验室、修士遗居、丹室、兽巢等可进入空间，有线索、遭遇、收获和离开路线。定居洞府是玩家完成净化/修复后占用的一处私人据点，有仓储、打坐、炼制与展示功能。并非每个洞穴都能占为家，也不是进入一扇门就直接抽一个宝箱。\n\n首个永久定居资格在先天，由 N10 陆行舟介绍并发放勘定工具；玩家在已发现可居住候选中选择。若之前没遇到随机可居洞府，NPC 提供一处普通租用洞室作为保底，只有基础居住功能，不附赠稀有机缘。后天可发现探索洞府、使用临时营棚；不能没有气脉知识就免费拥有高阶洞天。\n\n## 2. 每个角色为什么遇到的不一样\n\n新角色创建唯一 `characterId` 和 `characterFortuneSeed`，后者与 worldSeed 分开保存；机缘种子由角色、规则版本、区域、独立发现 ID、机缘代号稳定派生。新建角色即使使用同一地图种子，也会有不同的洞府入口子集、布局、机关、守卫、传闻和奖励组合；统计差异不保证每个角色每一处都绝不相同。\n\n一次生成后固定保存，不因读档、人物升级、打开宝箱前换武器而重抽。角色身上的缺料不能直接决定箱子必出缺料。低阶角色偶遇高阶遗物时可带走封存物/线索，但守卫和使用门槛仍真实存在。\n\n作者提供房间、机关与生态模板，系统在验证过的组装图中变化；不要让纯随机组合生成无出口、打不开的唯一门或需要洞内宝物才能进洞的循环。\n\n## 3. 洞府模板与探险结构\n\n|模板 ID|背景/风格|主要过程|偏好奖励|\n|---|---|---|---|\n|CV01 遗弃勘测站|后天，科技进入修真线索|恢复供电、避开失控机、打开样本柜|普通药剂、材料、空纹碎片、储物知识|\n|CV02 旧修士居|后天后期—先天|追踪生活痕迹、解除保护阵、判断遗嘱|纳物袋、功法书、少量灵石|\n|CV03 地脉药府|先天—灵海|识别毒/药、恢复水脉、绕开巢兽|药草、丹方、回气/疗伤丹|\n|CV04 陨炉洞|灵海—金丹|降温/修炉、矿甲兽、分岔矿室|陨材、武器、扩容晶石|\n|CV05 镜心居|金丹—元婴|真假门、回声定位、镜阵守卫|储物戒、功法、一次传承挑战|\n|CV06 雷云别府|元婴—化神|避雷点、御器路线、稳住阵眼|御空知识、须弥石、珍品药草|\n|CV07 虚界残府|化神—合道|空间锚点、有限重力变化、退路维护|洞天戒、界隙结晶、高阶法器|\n|CV08 星海遗宫|星劫—道源|护域/补气站、小天体分室、星兽遗骸|星海戒、原初空髓、顶级传承|\n\n每个洞府有入口预兆、2—5 个探索房间、至少一个非纯战斗互动、一个核心目标和出口；目标游玩约 8—20 分钟。战斗压力、谜题难度和房间数量取自模板范围，不能三项都因“稀有”自动拉满。\n\n随机维度包括候选位置、入口显露条件、支路顺序、可见破损、守卫变体、资源室类型、传闻文本参数。地形和资产必须匹配：门通向实际可进入空间，外观图与内景 3D 使用同一模板，不用不相关背景画遮掩加载。\n\n## 4. 洞府出现与普通/极品机缘\n\n普通洞府发现是常规探索内容，不套 0.3% 极稀有机缘概率。每个首次完成的合格探索单元可进行一次 8% 普通洞府线索尝试；尝试 ID 需足够稀疏，不能把每 256 米调度块都算一次。连续 6 次合格发现未出线索，第 7 次保证给一条普通洞府线索；保底仅是探索内容，不保证储物戒或永久加成。\n\n0.3%仍只用于极稀有永久机缘，在另一独立随机流中尝试。普通洞府最终房间可以是合格调查点，但每座只试一次，重复挑战不再重试。新增26后，此流分为互斥5%护主破限、2%逆天传承、93%其他永久机缘；逆天线总概率0.006%，普通洞府保底不影响它。具体资格、节流、封存线索和30类奖励见[26](26_HEAVEN_DEFYING_LEGACIES.md)。任务给予的确定突破试炼称“传承任务”，不伪装成随机机缘。\n\n所有机缘都进入 director 的资格→预留→提示→活动→结算状态。成功但暂时无安全落点时保留资格，不重复重抽。已获得的洞府线索和独特奖励机会不因离线超过三天消失；无人参与的一般天气预兆可以结束，但同一线索可在后续合适天气再显现。\n\n## 5. 普通洞府奖励与稀有奖励\n\n普通洞府核心完成后给少量保证补给和一份“主要收获”，后者权重表如下；质量仍引用 D3-03 的适用奖励档，不等于所有箱子都出 Q6。\n\n|主要收获类别|基础权重|用途|\n|---|---:|---|\n|药草/炼丹材料|22%|突破、恢复、交易|\n|丹药|18%|疗伤、回气、护脉或短时战斗选择|\n|灵石|18%|修炼、服务、消费|\n|武器/锻造材料|14%|构筑和精炼|\n|功法书/残页|12%|学习、补全或交易|\n|储物袋/储物戒/扩容材料|8%|改善携带能力|\n|宠物蛋/契约材料|8%|孵化、缔约与血脉培养|\n\n先按洞府层级过滤合法子池再选择物品；封存的超阶遗物在专属表中最多占主要收获结果的 1%，不能在每个类别再独立加一次 1%。储物类 8% 内部默认为 25% 完整合法法器、75% 扩容材料，意味着普通基准完整法器率约 2%，不是每洞 8% 必出戒。不同模板可调整偏好，但发布前归一化、明示版本且保存当次结果。\n\n宠物补充后主表为七类共100%，只用于新增洞府实例；已生成旧版六类奖励不重抽。宠物类内部50%合法蛋、50%契约/营养材料，基准完整蛋约4%；蛋物种和血脉只从本区合法范围抽取，不再同时额外独立抽33次。蛋来源与种子在首次生成时固定。\n\n永久加成/强行突破只来自独立极稀有机缘，不混在普通掉落表里乘多次概率。主要收获在洞府实例创建时固定；不要先保存“随机宝箱”，等玩家开箱时按最新等级改成高级物品。\n\n不需要特定武器才能通过唯一出口。钥匙、控制节点和任务物在同一个可达图中验证；如果玩家离开、阵亡、背包满，可返回未结算房间。洞府核心收获一次，不能退出重进再领；可重复采集的边缘药圃按普通再生政策，不重置核心奖励。\n\n## 6. 玩家定居洞府\n\n一名角色初期可绑定一处主洞府，解锁跨星后最多每星一个已登记据点、同时仅一个主修炼洞府。购买或更换主洞府不复制旧仓储；迁居先打包、核对运力与目的容量，旧址保留至搬运确认。\n\n|洞府等级|建议境界|设施/仓储|修炼室倍率|升级材料方向|\n|---|---|---|---:|---|\n|H0 普通洞室|先天|安全床位、基础阵、120 格/3,000 L 仓库|1.0|净息晶×4、普通石材×20、铁陨材×4|\n|H1 灵脉洞府|灵海—金丹|稳纹台、炼丹工作台、180 格/10,000 L|1.2|潮汐砂×8、玄陨材×6、阵纹板×4|\n|H2 须弥别府|元婴—化神|高级刻纹台、温室、240 格/50,000 L|1.35|镜心晶×8、须弥石×3、风雷髓×4|\n|H3 洞天府邸|炼虚以上|跨星登记、300 格/200,000 L、独立展示室|1.5|界隙结晶×4、法纹石×8、星陨材×6|\n\n仓储每 L 最高 5 kg，仍有格数与体积。丹台可用于已学配方的准备/委托领取；固定 NPC 仍负责需要其资格的炼制，不因放个台子自动学会全部高级丹方。温室需要种子和水/灵石预算，每真实玩家采收周期只有一代，离线不堆积无限成熟作物。\n\n修炼室倍率替代当前选择的练功场倍率，不能与 NPC 练功室再次相乘；总修炼倍率仍封顶 3，离线仍最多 72 小时。升级洞府不扩大离线奖励天数。\n\n主洞府为恢复与陈列空间，首期不做离线被怪/其他玩家洗劫。玩家可放丹炉、武器架、标本、功法书架与储物柜，均来自真实库存或独立设施状态，不靠摆放复制可交易物。洞府的独特外观由随机模板和玩家布置共同形成。\n\n## 7. 单机/联网场景边界\n\n单机：洞府绑定角色种子，拥有者可随时暂停和保存，未完成洞府复入保持状态。联网规划：野外入口可共享发现，但核心探索空间默认队伍实例，机缘领取与私人住宅归属由服务器记录；不能把单机 worldSeed 直接当共享服务器世界。\n\n默认联网不开放抢占私人洞府或破坏他人仓库。组队战利品采用个人结算、同一机会 ID 每人一次；核心规则及个人随机结果由服务器生成。队伍重复带同一角色进入不重置资格，邀请新成员不让已领奖成员再次领奖。详细经济隔离与断线规则见第 14 文档。\n\n## 8. 生成验收\n\n至少用 1,000 个角色种子廉价验证：入口可达、门钥匙依赖无环、必有退出路线、主奖励总权重为 1、同角色重复生成稳定、不同角色有统计差异、已领资格不重复、普通保底不升级为极品保底、无合适地点可延迟布置、洞府仓库满不吞任务奖励。\n\n实机检查多个随机布局中的战斗/谜题与 3D 一致，复活后可返回，背包满可以标记回取；不能只用地图缩略图证明洞府可玩。\n","html":"\u003ch1>D3-11 · 随机洞府、机缘与角色差异\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-11-v001.svg\" alt=\"普通洞府与稀有机缘\">\u003c/p>\u003cp>\u003cem>图解：普通洞府8%尝试与第7次线索保底，不保证极品奖励。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>新增残图与公共遗迹竞争：地图提供可核验入口知识，复印不复制机缘；玩家个人已预留机缘不会被远区NPC偷领，公共未归属机缘允许真实探索竞争，核心被取后不重置。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>2026-09-12；拟实现。依赖 \u003ca href=\"#08_WORLD_DIRECTOR.md\">刷新系统\u003c/a>、\u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">储物\u003c/a>、\u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">联网边界\u003c/a>。覆盖旧“机缘可能固定放置”的表述：固定的是模板、生态规律与验证过的候选入口，\u003cstrong>机缘实例及奖励不再是全角色同坐标同答案\u003c/strong>。\u003c/p>\u003ch2>1. 两类洞府不能混淆\u003c/h2>\u003cp>探索洞府是远古实验室、修士遗居、丹室、兽巢等可进入空间，有线索、遭遇、收获和离开路线。定居洞府是玩家完成净化/修复后占用的一处私人据点，有仓储、打坐、炼制与展示功能。并非每个洞穴都能占为家，也不是进入一扇门就直接抽一个宝箱。\u003c/p>\u003cp>首个永久定居资格在先天，由 N10 陆行舟介绍并发放勘定工具；玩家在已发现可居住候选中选择。若之前没遇到随机可居洞府，NPC 提供一处普通租用洞室作为保底，只有基础居住功能，不附赠稀有机缘。后天可发现探索洞府、使用临时营棚；不能没有气脉知识就免费拥有高阶洞天。\u003c/p>\u003ch2>2. 每个角色为什么遇到的不一样\u003c/h2>\u003cp>新角色创建唯一 \u003ccode>characterId\u003c/code> 和 \u003ccode>characterFortuneSeed\u003c/code>，后者与 worldSeed 分开保存；机缘种子由角色、规则版本、区域、独立发现 ID、机缘代号稳定派生。新建角色即使使用同一地图种子，也会有不同的洞府入口子集、布局、机关、守卫、传闻和奖励组合；统计差异不保证每个角色每一处都绝不相同。\u003c/p>\u003cp>一次生成后固定保存，不因读档、人物升级、打开宝箱前换武器而重抽。角色身上的缺料不能直接决定箱子必出缺料。低阶角色偶遇高阶遗物时可带走封存物/线索，但守卫和使用门槛仍真实存在。\u003c/p>\u003cp>作者提供房间、机关与生态模板，系统在验证过的组装图中变化；不要让纯随机组合生成无出口、打不开的唯一门或需要洞内宝物才能进洞的循环。\u003c/p>\u003ch2>3. 洞府模板与探险结构\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模板 ID\u003c/th>\u003cth>背景/风格\u003c/th>\u003cth>主要过程\u003c/th>\u003cth>偏好奖励\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CV01 遗弃勘测站\u003c/td>\u003ctd>后天，科技进入修真线索\u003c/td>\u003ctd>恢复供电、避开失控机、打开样本柜\u003c/td>\u003ctd>普通药剂、材料、空纹碎片、储物知识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV02 旧修士居\u003c/td>\u003ctd>后天后期—先天\u003c/td>\u003ctd>追踪生活痕迹、解除保护阵、判断遗嘱\u003c/td>\u003ctd>纳物袋、功法书、少量灵石\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV03 地脉药府\u003c/td>\u003ctd>先天—灵海\u003c/td>\u003ctd>识别毒/药、恢复水脉、绕开巢兽\u003c/td>\u003ctd>药草、丹方、回气/疗伤丹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV04 陨炉洞\u003c/td>\u003ctd>灵海—金丹\u003c/td>\u003ctd>降温/修炉、矿甲兽、分岔矿室\u003c/td>\u003ctd>陨材、武器、扩容晶石\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV05 镜心居\u003c/td>\u003ctd>金丹—元婴\u003c/td>\u003ctd>真假门、回声定位、镜阵守卫\u003c/td>\u003ctd>储物戒、功法、一次传承挑战\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV06 雷云别府\u003c/td>\u003ctd>元婴—化神\u003c/td>\u003ctd>避雷点、御器路线、稳住阵眼\u003c/td>\u003ctd>御空知识、须弥石、珍品药草\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV07 虚界残府\u003c/td>\u003ctd>化神—合道\u003c/td>\u003ctd>空间锚点、有限重力变化、退路维护\u003c/td>\u003ctd>洞天戒、界隙结晶、高阶法器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CV08 星海遗宫\u003c/td>\u003ctd>星劫—道源\u003c/td>\u003ctd>护域/补气站、小天体分室、星兽遗骸\u003c/td>\u003ctd>星海戒、原初空髓、顶级传承\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每个洞府有入口预兆、2—5 个探索房间、至少一个非纯战斗互动、一个核心目标和出口；目标游玩约 8—20 分钟。战斗压力、谜题难度和房间数量取自模板范围，不能三项都因“稀有”自动拉满。\u003c/p>\u003cp>随机维度包括候选位置、入口显露条件、支路顺序、可见破损、守卫变体、资源室类型、传闻文本参数。地形和资产必须匹配：门通向实际可进入空间，外观图与内景 3D 使用同一模板，不用不相关背景画遮掩加载。\u003c/p>\u003ch2>4. 洞府出现与普通/极品机缘\u003c/h2>\u003cp>普通洞府发现是常规探索内容，不套 0.3% 极稀有机缘概率。每个首次完成的合格探索单元可进行一次 8% 普通洞府线索尝试；尝试 ID 需足够稀疏，不能把每 256 米调度块都算一次。连续 6 次合格发现未出线索，第 7 次保证给一条普通洞府线索；保底仅是探索内容，不保证储物戒或永久加成。\u003c/p>\u003cp>0.3%仍只用于极稀有永久机缘，在另一独立随机流中尝试。普通洞府最终房间可以是合格调查点，但每座只试一次，重复挑战不再重试。新增26后，此流分为互斥5%护主破限、2%逆天传承、93%其他永久机缘；逆天线总概率0.006%，普通洞府保底不影响它。具体资格、节流、封存线索和30类奖励见\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">26\u003c/a>。任务给予的确定突破试炼称“传承任务”，不伪装成随机机缘。\u003c/p>\u003cp>所有机缘都进入 director 的资格→预留→提示→活动→结算状态。成功但暂时无安全落点时保留资格，不重复重抽。已获得的洞府线索和独特奖励机会不因离线超过三天消失；无人参与的一般天气预兆可以结束，但同一线索可在后续合适天气再显现。\u003c/p>\u003ch2>5. 普通洞府奖励与稀有奖励\u003c/h2>\u003cp>普通洞府核心完成后给少量保证补给和一份“主要收获”，后者权重表如下；质量仍引用 D3-03 的适用奖励档，不等于所有箱子都出 Q6。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>主要收获类别\u003c/th>\u003cth>基础权重\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>药草/炼丹材料\u003c/td>\u003ctd>22%\u003c/td>\u003ctd>突破、恢复、交易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>丹药\u003c/td>\u003ctd>18%\u003c/td>\u003ctd>疗伤、回气、护脉或短时战斗选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>灵石\u003c/td>\u003ctd>18%\u003c/td>\u003ctd>修炼、服务、消费\u003c/td>\u003c/tr>\u003ctr>\u003ctd>武器/锻造材料\u003c/td>\u003ctd>14%\u003c/td>\u003ctd>构筑和精炼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>功法书/残页\u003c/td>\u003ctd>12%\u003c/td>\u003ctd>学习、补全或交易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>储物袋/储物戒/扩容材料\u003c/td>\u003ctd>8%\u003c/td>\u003ctd>改善携带能力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宠物蛋/契约材料\u003c/td>\u003ctd>8%\u003c/td>\u003ctd>孵化、缔约与血脉培养\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>先按洞府层级过滤合法子池再选择物品；封存的超阶遗物在专属表中最多占主要收获结果的 1%，不能在每个类别再独立加一次 1%。储物类 8% 内部默认为 25% 完整合法法器、75% 扩容材料，意味着普通基准完整法器率约 2%，不是每洞 8% 必出戒。不同模板可调整偏好，但发布前归一化、明示版本且保存当次结果。\u003c/p>\u003cp>宠物补充后主表为七类共100%，只用于新增洞府实例；已生成旧版六类奖励不重抽。宠物类内部50%合法蛋、50%契约/营养材料，基准完整蛋约4%；蛋物种和血脉只从本区合法范围抽取，不再同时额外独立抽33次。蛋来源与种子在首次生成时固定。\u003c/p>\u003cp>永久加成/强行突破只来自独立极稀有机缘，不混在普通掉落表里乘多次概率。主要收获在洞府实例创建时固定；不要先保存“随机宝箱”，等玩家开箱时按最新等级改成高级物品。\u003c/p>\u003cp>不需要特定武器才能通过唯一出口。钥匙、控制节点和任务物在同一个可达图中验证；如果玩家离开、阵亡、背包满，可返回未结算房间。洞府核心收获一次，不能退出重进再领；可重复采集的边缘药圃按普通再生政策，不重置核心奖励。\u003c/p>\u003ch2>6. 玩家定居洞府\u003c/h2>\u003cp>一名角色初期可绑定一处主洞府，解锁跨星后最多每星一个已登记据点、同时仅一个主修炼洞府。购买或更换主洞府不复制旧仓储；迁居先打包、核对运力与目的容量，旧址保留至搬运确认。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>洞府等级\u003c/th>\u003cth>建议境界\u003c/th>\u003cth>设施/仓储\u003c/th>\u003cth>修炼室倍率\u003c/th>\u003cth>升级材料方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>H0 普通洞室\u003c/td>\u003ctd>先天\u003c/td>\u003ctd>安全床位、基础阵、120 格/3,000 L 仓库\u003c/td>\u003ctd>1.0\u003c/td>\u003ctd>净息晶×4、普通石材×20、铁陨材×4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H1 灵脉洞府\u003c/td>\u003ctd>灵海—金丹\u003c/td>\u003ctd>稳纹台、炼丹工作台、180 格/10,000 L\u003c/td>\u003ctd>1.2\u003c/td>\u003ctd>潮汐砂×8、玄陨材×6、阵纹板×4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H2 须弥别府\u003c/td>\u003ctd>元婴—化神\u003c/td>\u003ctd>高级刻纹台、温室、240 格/50,000 L\u003c/td>\u003ctd>1.35\u003c/td>\u003ctd>镜心晶×8、须弥石×3、风雷髓×4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H3 洞天府邸\u003c/td>\u003ctd>炼虚以上\u003c/td>\u003ctd>跨星登记、300 格/200,000 L、独立展示室\u003c/td>\u003ctd>1.5\u003c/td>\u003ctd>界隙结晶×4、法纹石×8、星陨材×6\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>仓储每 L 最高 5 kg，仍有格数与体积。丹台可用于已学配方的准备/委托领取；固定 NPC 仍负责需要其资格的炼制，不因放个台子自动学会全部高级丹方。温室需要种子和水/灵石预算，每真实玩家采收周期只有一代，离线不堆积无限成熟作物。\u003c/p>\u003cp>修炼室倍率替代当前选择的练功场倍率，不能与 NPC 练功室再次相乘；总修炼倍率仍封顶 3，离线仍最多 72 小时。升级洞府不扩大离线奖励天数。\u003c/p>\u003cp>主洞府为恢复与陈列空间，首期不做离线被怪/其他玩家洗劫。玩家可放丹炉、武器架、标本、功法书架与储物柜，均来自真实库存或独立设施状态，不靠摆放复制可交易物。洞府的独特外观由随机模板和玩家布置共同形成。\u003c/p>\u003ch2>7. 单机/联网场景边界\u003c/h2>\u003cp>单机：洞府绑定角色种子，拥有者可随时暂停和保存，未完成洞府复入保持状态。联网规划：野外入口可共享发现，但核心探索空间默认队伍实例，机缘领取与私人住宅归属由服务器记录；不能把单机 worldSeed 直接当共享服务器世界。\u003c/p>\u003cp>默认联网不开放抢占私人洞府或破坏他人仓库。组队战利品采用个人结算、同一机会 ID 每人一次；核心规则及个人随机结果由服务器生成。队伍重复带同一角色进入不重置资格，邀请新成员不让已领奖成员再次领奖。详细经济隔离与断线规则见第 14 文档。\u003c/p>\u003ch2>8. 生成验收\u003c/h2>\u003cp>至少用 1,000 个角色种子廉价验证：入口可达、门钥匙依赖无环、必有退出路线、主奖励总权重为 1、同角色重复生成稳定、不同角色有统计差异、已领资格不重复、普通保底不升级为极品保底、无合适地点可延迟布置、洞府仓库满不吞任务奖励。\u003c/p>\u003cp>实机检查多个随机布局中的战斗/谜题与 3D 一致，复活后可返回，背包满可以标记回取；不能只用地图缩略图证明洞府可玩。\u003c/p>"},{"file":"12_MEDICINES_AND_AFTEREFFECTS.md","title":"D3-12 · 丹药分类、服用与后遗症","text":"# D3-12 · 丹药分类、服用与后遗症\n\n\u003c!-- illustrated-overview:start -->\n![丹药不是无代价按钮](media/diagram-12-v001.svg)\n\n*图解：攻击丹进入临时攻击属性；不能又乘一次最终伤害。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；拟实现。依赖 [丹方材料](03_ALCHEMY_MATERIALS_ECONOMY.md)、[储物与快捷栏](10_STORAGE_AND_ENCUMBRANCE.md)、[境界](01_REALMS_AND_CULTIVATION.md)。本文件成为功能丹的统一行为来源；三十种突破/淬体制剂仍用 D3-03。\n\n## 1. 分类与适用层级\n\n丹药分疗伤、回气、体力恢复、解毒、护脉、短时爆发、后遗症治疗、突破/淬体八个功能方向。每种功能丹可按 T0—T9 配方模板制作，本阶草药与结晶取自该层材料目录；不会把后天注射剂改名就说能恢复道源全身力量。\n\nR0 使用科技医剂/兴奋剂等名义；R1 起同类功能表现为丹药与真气调节。UI 显示类别、层级 T、品质 Q、即时/持续收益、共用冷却、服用时间、后遗症及禁用条件。\n\n恢复类匹配系数 `P=6^min(0,T药−R角色)`；同阶和更高阶恢复上限相同，低一阶只发挥 1/6 基准百分比。高于角色一阶以上的药不能安全服用，保留为交易/鉴定物。战力丹必须匹配本阶或高一阶且完成医师适应试验，不允许后天药按百分比强化道源。\n\n功能丹 Q1—Q6 有效系数 0.8/0.9/1/1.1/1.2/1.25；这是功能效果系数，不替换材料估价/体质品质系数。恢复百分比封顶 60%，后遗症不能因 Q6 变成零。突破丹按原体质槽公式，不套本表恢复系数。\n\n品质缩放“增量”而非整个最终倍率：Q6 燃血攻击为 `1+0.45×1.25=1.5625`，不是 `1.45×1.25`。负面效果、持续时长和气耗不因品质自动下降；解毒层数取定义整数，不做 1.25 层这种无法解释的状态。MED08 消减比例可随品质增加，但始终受后遗症最少承担 50% 原时长限制。\n\n## 2. 功能丹规格\n\n|ID / 名称|Q3 同阶效果|服用 / 持续|冷却族|基础配方（各 1 份溶媒另加）|\n|---|---|---|---|---|\n|MED01 疗伤丹 / R0 止血注剂|恢复最大生命 20%，再于 5 秒恢复 15%|2 秒 / 5 秒|恢复族 45 秒|炼体草×2、净化血浆×1|\n|MED02 回气丹 / R0 电容补剂|恢复最大真气/电容 35%|3 秒 / 即时|恢复族 45 秒|通脉草×2、环境结晶×1|\n|MED03 续力丹 / R0 肌能补剂|体力恢复 40 点|2 秒 / 即时|恢复族 45 秒|通脉草×1、药用盐×1|\n|MED04 清瘴丹|清除一层本阶可解中毒，30 秒抗毒 +40%|2 秒 / 30 秒|净化族 60 秒|通脉草×2、净水晶×1|\n|MED05 护脉丹|减轻下一次战力丹后遗症时长 25%，仅一次|3 秒 / 保护 10 分钟|护脉族 10 分钟|炼体草×2、环境结晶×2|\n|MED06 燃血丹 / R0 战斗兴奋剂|最终攻击×1.45，承受伤害×1.15|2 秒 / 30 秒|爆发族 10 分钟|炼体草×3、净化血浆×2、环境结晶×1|\n|MED07 逆脉丹|最终攻击×1.70，移动×1.20；持续期间每秒消耗最大真气 2%|3 秒 / 最长 20 秒|爆发族 15 分钟|炼体草×3、通脉草×2、同阶内丹×1|\n|MED08 调息复元丹|安全打坐时消减当前后遗症剩余时长 20%|5 秒 / 一次|复元族 10 分钟|通脉草×3、环境结晶×2|\n\n药用盐/净水晶由商人或普通环境采集供应，净化血浆从非配方限定的生物血加工取得。机械能芯只能做电容类科技补剂的明确替代配方，不能当作血浆。\n\n恢复族共享冷却：刚吃疗伤丹，不能立即用回气/续力丹轮流绕过 45 秒限制。灵石吸收沿用独立 5 秒站定、15 秒冷却，但仍要真的有可访问灵石且引导不被打断。品质缩放作用于收益，不缩短冷却、不改变动作生效帧。\n\n## 3. 强行提升战力的代价\n\n燃血丹结束后进入“气血亏耗”5 分钟有效游玩时间：攻击 −20%、自然生命/真气恢复 −30%、最大体力 −20。逆脉丹结束、气尽或主动取消后进入“经脉紊乱”10 分钟：攻击 −30%、防御 −20%、普通/疾跑移动 −15%、自然回气 −50%，且 30 秒内不能主动起飞。已经飞行时转安全降落，不在空中突然删掉所有托举力。\n\n两种爆发药同族互斥，激活中或后遗症未结束时拒绝再次服用同族；不允许用下一颗覆盖上一颗的债务。先验禁用条件再扣药，拒绝时明确显示剩余限制。不能先用护脉丹再喝无限兴奋剂永久保持强化。\n\nMED05 只减持续时长至原来的 75%，不减负面强度；MED08 再减少当时剩余时长 20%，每段后遗症最多成功治疗一次。即使叠加两者，也保留至少原始时长 50%的应承担时间；治疗前展示净效果。MED08 只在安全区或已安全登记的洞府打坐时可用，战斗中不能一边爆发一边瞬间治好。\n\n后遗症不掉境界、不永久删属性；进入昏迷救援仍保存剩余债务，救援可提供普通疗养而不是免费清空。到期、完成疗养和保存使用同一状态，反复卸装、切地图、读档、下线都不会重置或抹除。\n\n临时爆发作用于当前同阶属性，不授予下一境的呼吸、御空、传送或毁星权限。逆脉移动加成纳入第 13 文档的速度上限，不额外突破载具上限或让负重禁飞失效。\n\n## 4. 生效、打断与离线\n\n状态机：校验可访问药物→锁定一份→取出→服用生效帧→消耗并提交效果→收回。生效前中断则释放锁定、药物不消耗；生效后中断收回动作也不能返还已服药。动画与库存同一事务 ID，第一/第三人称显示同一药瓶/药丸和时间点。\n\n服用允许慢走，禁止攻击、疾跑和自由闪避；主动闪避或受重击会中断。已解锁御空且稳定悬停时可服恢复药，但持续飞行仍耗气，气尽需先降落；高速巡航、驾驶、坠落中拒绝服用。药在货舱/未启用法器中时不能施放。\n\n单机在线增益/冷却/后遗症用 simTime，暂停冻结。主动退出战斗后下线，尚未结束的爆发增益取消，剩余后遗症完整记账；若退出时已在后遗症，只保存原剩余值，不能再次叠一遍。安全洞府或练功室选择“离线疗养”时，离线每 2 分钟抵消 1 分钟后遗症，最多消减退出时已有债务，不生成额外增益；时间和消费结算均去重。未选择疗养或野外下线不自动洗掉负面。\n\n离线疗养与离线修炼共用一次结算记录，疗养期间无修为收益，债务消除后剩余有效时间才按修炼设置计修为。不能双倍计算同一时间。联网时战斗增益、退出与后遗症由服务器时钟结算，断线不能暂停敌人或药效，见第 14 文档。\n\n## 5. 医师/NPC 与经济\n\nN02 苏禾在第一次受伤后教 MED01—03，并明确战斗兴奋剂风险；MED06 需完成医师适应测试，不作为强制新手教程。N09 解锁净化/护脉，N12 及后续丹师提供逆脉与复元配方。NPC 制作能力沿原境界/Q上限，不增加重复药商。\n\n丹药可交易，但已打开/锁定的药不可重复上架。药物效果不凭空改变卖价；剩余药与装备独立保存。主线挑战要能通过装备、技能和打法完成，不强制吃爆发药才能看到剧情。\n\n## 6. 验收\n\n验证相邻层恢复 1/6、同阶恢复系数、共享冷却、两爆发互斥、生效帧前后中断、空货舱快捷使用拒绝、自然回复与持续飞行互斥、气尽触发后遗症、救援/下线不洗债、离线疗养与修炼时段不重叠、同一药实例只消费一次，以及 Q6 不消除后遗症。\n","html":"\u003ch1>D3-12 · 丹药分类、服用与后遗症\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-12-v001.svg\" alt=\"丹药不是无代价按钮\">\u003c/p>\u003cp>\u003cem>图解：攻击丹进入临时攻击属性；不能又乘一次最终伤害。\u003c/em>\u003c/p>\u003cp>2026-09-12；拟实现。依赖 \u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">丹方材料\u003c/a>、\u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">储物与快捷栏\u003c/a>、\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">境界\u003c/a>。本文件成为功能丹的统一行为来源；三十种突破/淬体制剂仍用 D3-03。\u003c/p>\u003ch2>1. 分类与适用层级\u003c/h2>\u003cp>丹药分疗伤、回气、体力恢复、解毒、护脉、短时爆发、后遗症治疗、突破/淬体八个功能方向。每种功能丹可按 T0—T9 配方模板制作，本阶草药与结晶取自该层材料目录；不会把后天注射剂改名就说能恢复道源全身力量。\u003c/p>\u003cp>R0 使用科技医剂/兴奋剂等名义；R1 起同类功能表现为丹药与真气调节。UI 显示类别、层级 T、品质 Q、即时/持续收益、共用冷却、服用时间、后遗症及禁用条件。\u003c/p>\u003cp>恢复类匹配系数 \u003ccode>P=6^min(0,T药−R角色)\u003c/code>；同阶和更高阶恢复上限相同，低一阶只发挥 1/6 基准百分比。高于角色一阶以上的药不能安全服用，保留为交易/鉴定物。战力丹必须匹配本阶或高一阶且完成医师适应试验，不允许后天药按百分比强化道源。\u003c/p>\u003cp>功能丹 Q1—Q6 有效系数 0.8/0.9/1/1.1/1.2/1.25；这是功能效果系数，不替换材料估价/体质品质系数。恢复百分比封顶 60%，后遗症不能因 Q6 变成零。突破丹按原体质槽公式，不套本表恢复系数。\u003c/p>\u003cp>品质缩放“增量”而非整个最终倍率：Q6 燃血攻击为 \u003ccode>1+0.45×1.25=1.5625\u003c/code>，不是 \u003ccode>1.45×1.25\u003c/code>。负面效果、持续时长和气耗不因品质自动下降；解毒层数取定义整数，不做 1.25 层这种无法解释的状态。MED08 消减比例可随品质增加，但始终受后遗症最少承担 50% 原时长限制。\u003c/p>\u003ch2>2. 功能丹规格\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID / 名称\u003c/th>\u003cth>Q3 同阶效果\u003c/th>\u003cth>服用 / 持续\u003c/th>\u003cth>冷却族\u003c/th>\u003cth>基础配方（各 1 份溶媒另加）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MED01 疗伤丹 / R0 止血注剂\u003c/td>\u003ctd>恢复最大生命 20%，再于 5 秒恢复 15%\u003c/td>\u003ctd>2 秒 / 5 秒\u003c/td>\u003ctd>恢复族 45 秒\u003c/td>\u003ctd>炼体草×2、净化血浆×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED02 回气丹 / R0 电容补剂\u003c/td>\u003ctd>恢复最大真气/电容 35%\u003c/td>\u003ctd>3 秒 / 即时\u003c/td>\u003ctd>恢复族 45 秒\u003c/td>\u003ctd>通脉草×2、环境结晶×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED03 续力丹 / R0 肌能补剂\u003c/td>\u003ctd>体力恢复 40 点\u003c/td>\u003ctd>2 秒 / 即时\u003c/td>\u003ctd>恢复族 45 秒\u003c/td>\u003ctd>通脉草×1、药用盐×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED04 清瘴丹\u003c/td>\u003ctd>清除一层本阶可解中毒，30 秒抗毒 +40%\u003c/td>\u003ctd>2 秒 / 30 秒\u003c/td>\u003ctd>净化族 60 秒\u003c/td>\u003ctd>通脉草×2、净水晶×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED05 护脉丹\u003c/td>\u003ctd>减轻下一次战力丹后遗症时长 25%，仅一次\u003c/td>\u003ctd>3 秒 / 保护 10 分钟\u003c/td>\u003ctd>护脉族 10 分钟\u003c/td>\u003ctd>炼体草×2、环境结晶×2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED06 燃血丹 / R0 战斗兴奋剂\u003c/td>\u003ctd>最终攻击×1.45，承受伤害×1.15\u003c/td>\u003ctd>2 秒 / 30 秒\u003c/td>\u003ctd>爆发族 10 分钟\u003c/td>\u003ctd>炼体草×3、净化血浆×2、环境结晶×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED07 逆脉丹\u003c/td>\u003ctd>最终攻击×1.70，移动×1.20；持续期间每秒消耗最大真气 2%\u003c/td>\u003ctd>3 秒 / 最长 20 秒\u003c/td>\u003ctd>爆发族 15 分钟\u003c/td>\u003ctd>炼体草×3、通脉草×2、同阶内丹×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MED08 调息复元丹\u003c/td>\u003ctd>安全打坐时消减当前后遗症剩余时长 20%\u003c/td>\u003ctd>5 秒 / 一次\u003c/td>\u003ctd>复元族 10 分钟\u003c/td>\u003ctd>通脉草×3、环境结晶×2\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>药用盐/净水晶由商人或普通环境采集供应，净化血浆从非配方限定的生物血加工取得。机械能芯只能做电容类科技补剂的明确替代配方，不能当作血浆。\u003c/p>\u003cp>恢复族共享冷却：刚吃疗伤丹，不能立即用回气/续力丹轮流绕过 45 秒限制。灵石吸收沿用独立 5 秒站定、15 秒冷却，但仍要真的有可访问灵石且引导不被打断。品质缩放作用于收益，不缩短冷却、不改变动作生效帧。\u003c/p>\u003ch2>3. 强行提升战力的代价\u003c/h2>\u003cp>燃血丹结束后进入“气血亏耗”5 分钟有效游玩时间：攻击 −20%、自然生命/真气恢复 −30%、最大体力 −20。逆脉丹结束、气尽或主动取消后进入“经脉紊乱”10 分钟：攻击 −30%、防御 −20%、普通/疾跑移动 −15%、自然回气 −50%，且 30 秒内不能主动起飞。已经飞行时转安全降落，不在空中突然删掉所有托举力。\u003c/p>\u003cp>两种爆发药同族互斥，激活中或后遗症未结束时拒绝再次服用同族；不允许用下一颗覆盖上一颗的债务。先验禁用条件再扣药，拒绝时明确显示剩余限制。不能先用护脉丹再喝无限兴奋剂永久保持强化。\u003c/p>\u003cp>MED05 只减持续时长至原来的 75%，不减负面强度；MED08 再减少当时剩余时长 20%，每段后遗症最多成功治疗一次。即使叠加两者，也保留至少原始时长 50%的应承担时间；治疗前展示净效果。MED08 只在安全区或已安全登记的洞府打坐时可用，战斗中不能一边爆发一边瞬间治好。\u003c/p>\u003cp>后遗症不掉境界、不永久删属性；进入昏迷救援仍保存剩余债务，救援可提供普通疗养而不是免费清空。到期、完成疗养和保存使用同一状态，反复卸装、切地图、读档、下线都不会重置或抹除。\u003c/p>\u003cp>临时爆发作用于当前同阶属性，不授予下一境的呼吸、御空、传送或毁星权限。逆脉移动加成纳入第 13 文档的速度上限，不额外突破载具上限或让负重禁飞失效。\u003c/p>\u003ch2>4. 生效、打断与离线\u003c/h2>\u003cp>状态机：校验可访问药物→锁定一份→取出→服用生效帧→消耗并提交效果→收回。生效前中断则释放锁定、药物不消耗；生效后中断收回动作也不能返还已服药。动画与库存同一事务 ID，第一/第三人称显示同一药瓶/药丸和时间点。\u003c/p>\u003cp>服用允许慢走，禁止攻击、疾跑和自由闪避；主动闪避或受重击会中断。已解锁御空且稳定悬停时可服恢复药，但持续飞行仍耗气，气尽需先降落；高速巡航、驾驶、坠落中拒绝服用。药在货舱/未启用法器中时不能施放。\u003c/p>\u003cp>单机在线增益/冷却/后遗症用 simTime，暂停冻结。主动退出战斗后下线，尚未结束的爆发增益取消，剩余后遗症完整记账；若退出时已在后遗症，只保存原剩余值，不能再次叠一遍。安全洞府或练功室选择“离线疗养”时，离线每 2 分钟抵消 1 分钟后遗症，最多消减退出时已有债务，不生成额外增益；时间和消费结算均去重。未选择疗养或野外下线不自动洗掉负面。\u003c/p>\u003cp>离线疗养与离线修炼共用一次结算记录，疗养期间无修为收益，债务消除后剩余有效时间才按修炼设置计修为。不能双倍计算同一时间。联网时战斗增益、退出与后遗症由服务器时钟结算，断线不能暂停敌人或药效，见第 14 文档。\u003c/p>\u003ch2>5. 医师/NPC 与经济\u003c/h2>\u003cp>N02 苏禾在第一次受伤后教 MED01—03，并明确战斗兴奋剂风险；MED06 需完成医师适应测试，不作为强制新手教程。N09 解锁净化/护脉，N12 及后续丹师提供逆脉与复元配方。NPC 制作能力沿原境界/Q上限，不增加重复药商。\u003c/p>\u003cp>丹药可交易，但已打开/锁定的药不可重复上架。药物效果不凭空改变卖价；剩余药与装备独立保存。主线挑战要能通过装备、技能和打法完成，不强制吃爆发药才能看到剧情。\u003c/p>\u003ch2>6. 验收\u003c/h2>\u003cp>验证相邻层恢复 1/6、同阶恢复系数、共享冷却、两爆发互斥、生效帧前后中断、空货舱快捷使用拒绝、自然回复与持续飞行互斥、气尽触发后遗症、救援/下线不洗债、离线疗养与修炼时段不重叠、同一药实例只消费一次，以及 Q6 不消除后遗症。\u003c/p>"},{"file":"13_MOVEMENT_AND_PURSUIT.md","title":"D3-13 · 分境界速度、负重与追逐","text":"# D3-13 · 分境界速度、负重与追逐\n\n\u003c!-- illustrated-overview:start -->\n![高手为何能追上新手](media/diagram-13-v001.svg)\n\n*图解：敌人按自身能力追击，不瞬间复制玩家速度。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；拟实现。覆盖 D3-01 “各境沿用同一基础地速”的旧规则。当前代码的 4.7/8.6 m/s 仅保留为后天一级基准，后续按本表迁移，不在本次文档修改中直接改游戏数值。\n\n依赖：[负重](10_STORAGE_AND_ENCUMBRANCE.md)、[丹药](12_MEDICINES_AND_AFTEREFFECTS.md)、[世界刷新](08_WORLD_DIRECTOR.md)。人物、怪物和载具都用可测量的米/秒，追逐不采用隐藏瞬移补偿。\n\n## 1. 每个大境界的地面移动\n\n表为一级、无负重惩罚、无装备加成的常速/疾跑/短时奔袭上限。常速是正常赶路，不代表姿态一定是现实走路；高境通过轻身步法表达，慢走可随时切回便于查看物体的 1.65 m/s。\n\n|境界|常速 m/s|疾跑 m/s|境界奔袭 m/s|从静止到基础疾跑约秒数|\n|---|---:|---:|---:|---:|\n|R0 后天|4.7|8.6|无独立奔袭|0.9|\n|R1 先天|5.5|12|18|0.8|\n|R2 灵海|6.5|17|27|0.75|\n|R3 金丹|8|24|39|0.7|\n|R4 元婴|10|33|55|0.65|\n|R5 化神|12|45|75|0.6|\n|R6 炼虚|14|60|100|0.55|\n|R7 合道|17|80|135|0.5|\n|R8 星劫|20|105|180|0.45|\n|R9 道源|24|140|240|0.4|\n\n小等级倍率 `L(l)=1+0.025×(l−1)`，十级比一级快 22.5%。常速/疾跑乘该倍率与常驻速度构筑倍率（1.0—2.0），再乘负重/减速/药后遗症；常驻上限 2.0 是每境基础值的上限，绝不是全部境界共用 8.6×2。\n\n常规地速：`v=base(r,mode) × L(l) × min(2,buildMultiplier) × loadFactor × slowFactor × drugFactor`。慢走使用固定 1.65 起点再乘负重/减速，不因道源身份无法慢走。药物正增益后最终不超过该模式基础×L×2.25；无正增益时仍为×2上限。攻击速度与地面速度分开，不能把挥刀播放加速 20 倍。\n\n境界奔袭由先天导引教学解锁，是地面长距离轻身模式，不等于闪避。稳定疾跑 2 秒且前方安全后可再次按 Shift 切入，持续耗体力与最大真气 1%/秒，基础最长 8 秒，冷却 12 秒；按攻击/交互退出并减速，不能高速掠过目标仍按近战距离结算命中。奔袭只乘 L，构筑最高再乘 1.25，药物不能突破表值×L×1.25；与普通疾跑加成择当前模式公式，不把两者叠乘。\n\n高境奔袭采用蹬地、滑步与残影，不加快脚步循环到失真；角色物理连续移动，残影没有伤害。各境奔袭动画/特效需随实施切片真实制作。\n\n## 2. 加速、转弯与低速控制\n\n疾跑基础加速度 `a=基础疾跑速度/表中加速秒数`；负重按同系数削减，高速奔袭另用曲线达到上限。制动距离使用实际速度/减速度计算，不把松开键等同瞬间停车；高境可花气急停，气不足保持正常制动。\n\n可用横向加速度限制转弯半径 `radius≥v²/aLateral`。基础横向加速度为 `18×1.5^r m/s²`，受到负重与减速限制。玩家鼠标可自由观察，身体路径按转向能力逐渐改变，不强迫镜头慢慢转。近战、室内、狭窄桥自动进入低速控制时明确 HUD 提示，可用慢走精细操作；不能无提示让角色突然失去方向。\n\nZ 趴伏速度=`min(6,当境基础常速×0.18×L)×负重×减速`；C 蹲行=`min(12,当境基础常速×0.45×L)×负重×减速`。它们不提供奔袭，高境爬行不做成地面导弹。普通闪避距离仍按技能阶段配置，不能将疾跑速度直接乘到旧 4 米闪避上。\n\n所有位移含奔袭和飞行都扫掠碰撞；多次子步和预热地形保护高速移动。前方内容未加载时减速并提示，不把角色放进无碰撞虚空。追逐中的敌人同样不能穿过未加载墙体。\n\n## 3. 飞行与载具速度关系\n\nF0/F1/F2/F3 设备巡航上限保持原 12/25/40/65 m/s，人物境界不直接给机体加速。负重按 D3-10 降低最大速度/加速/爬升。R4 御器基础 70、R5 御空 100、R6 160、R7 250 m/s；飞行构筑速度加成最高 25%，负重惩罚照常生效。\n\nR8/R9 星空局部巡航分别以 1,000/2,500 m/s 为起点，属于远行档；近敌、入港、贴近小天体时逐渐降到战斗机动档 250/400 m/s，并允许玩家主动减速，不能在生效瞬间把正在追赶的两者拉近。跨星距离仍走传送/长航流程，地面和星空不共用一张速度表。\n\nR0 满载 F1 可能被 R2 地面奔袭怪追近，这是运载选择的真实代价；高阶人物无需为了赶路永远坐慢速新手机。母星限高、真气耗尽下降、不能在持续飞行中自然回气仍沿用已有规则。\n\n## 4. 敌人的感知和追逐状态\n\n状态机：巡逻→疑似感知→确认目标→追逐/截路→攻击→失去视线→搜索→警戒返回。视觉、声音、气味/神识是独立通道；R0 普通野兽不隔山知道坐标，高阶神识怪有明确范围和干扰方式。\n\n|类型|视觉/听觉起点|追逐策略|失去目标后的搜索|\n|---|---|---|---|\n|R0—R1 掠食兽|视觉 35 m、声音 25 m，蹲伏足音更小|沿可达路线直追，扑击需前摇|最后可见点附近 8—12 秒|\n|R2—R3 猎兽|视觉 55 m、声音 35 m，部分有气味 20 m|预测 0.5 秒目标速度，侧翼绕障|12—18 秒，最多 2 个最近足迹点|\n|R4—R5 灵兽|视觉 80 m、有限神识 50 m|根据地形选截路点，空地联动|15—22 秒，可用遮蔽阵/岩层切断神识|\n|R6—R9 高阶生物|按场景配置，首片地面上限 160 m|领域/空中截击，能力有冷却和资源|20—30 秒；不永久全图锁定|\n\n距离是该类基础配置，不代表所有物种都相同；昼夜、天气、姿态和障碍修改感知。高级怪物只在实际感知成功后追踪，不能读取玩家整张地图坐标。\n\n星空场景另按闭合速度设置 1—5 公里预警范围与减速带，不把地面 160 米直接套给 1,000 m/s 巡航。必须留出至少数秒可反应时间；长距离渲染/调度预热不足时先降巡航速度，不能在玩家到达前一帧才出现巨兽。\n\n同阶同级普通怪巡航追速约为玩家**未配装、无负重基础疾跑**的 0.90—1.05；捕猎专长怪短时 1.15—1.30、持续 2—4 秒并明显喘息。防守/重甲怪慢一些。敌人以自身境界/等级算速度，不能根据当前玩家速度实时设置成“玩家＋1”，也不因玩家换戒减重而同步变快。\n\n## 5. 追上、逃脱、追击范围\n\n攻击须真的到有效距离并面对目标，扑击/抓取用扫掠命中；不做距离很远的自动抓回。角色可借转弯、障碍、洞穴、烟尘、消声姿态、飞行落差断感知；飞行不默认让所有地面怪无条件失去目标，但没有远程能力的怪不能凭空发射追踪弹。\n\n脱战条件：连续失去全部有效感知通道，搜索阶段结束且未再受到攻击。每种怪有生态活动范围与返巢倾向，但越过一条线不会立即满血无敌。返巢阶段不产新的修为/掉落，脱离战斗且未被持续干扰 10 秒后按每秒 5% 最大生命恢复；重新接敌沿当前真实生命继续。不存在边界外能伤害敌人、敌人却永远无法攻击玩家的甜点位；发现不可达目标则找掩体/远离，不能站着挨射。\n\n连续追击跨块保留实例 ID 和关键状态，优先加载追击走廊，不能一过 160 米 AI 圈就删除追兵。预算不足时优先保留追击中的怪，延迟新刷；跨洞府实例口需合法门禁，追兵在外警戒，不穿墙传送进私人住宅。\n\n新手误入高手区应先看到残骸、预警与敌人动作；同一地形直线硬跑很可能被追上，但有可识别的撤退掩体或救援结局。首次边界遭遇可以用较慢守门种类教学，不能暗改其境界速度。昏迷按现有救援规则处理，不永久丢成长。\n\n## 6. 开发样板与数值例子\n\n无配装、无负重：后天一级疾跑 8.6，先天一级 12，灵海一级 17 m/s。后天满安全负重倍率 0.75 时只剩 6.45 m/s；相对一只追速 9 m/s 的掠兽，被追近是正常结果，玩家应卸货、侧闪扑击或借障碍脱离。\n\n先天一级对同阶捕猎兽短时 14.4 m/s，单纯一直按 W 不保证逃脱；使用 18 m/s 奔袭可拉开一段距离，但耗气、持续和转弯半径都限制滥用。高阶不能凭“每境增攻防”却仍与新手同速，这是本轮明确修正。\n\n## 7. 验收\n\n验证十境速度单调递增、每境十级差异、负重曲线连续、体力/真气耗尽、构筑/药物上限、起跑制动、急转半径、车辆货重影响、敌人速度不读取玩家即时速度、遮挡脱战、跨块继续追击、无不可见瞬移、返巢回血边界不刷奖，以及 30/60/120 FPS 下相同路程与碰撞结果。\n","html":"\u003ch1>D3-13 · 分境界速度、负重与追逐\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-13-v001.svg\" alt=\"高手为何能追上新手\">\u003c/p>\u003cp>\u003cem>图解：敌人按自身能力追击，不瞬间复制玩家速度。\u003c/em>\u003c/p>\u003cp>2026-09-12；拟实现。覆盖 D3-01 “各境沿用同一基础地速”的旧规则。当前代码的 4.7/8.6 m/s 仅保留为后天一级基准，后续按本表迁移，不在本次文档修改中直接改游戏数值。\u003c/p>\u003cp>依赖：\u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">负重\u003c/a>、\u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">丹药\u003c/a>、\u003ca href=\"#08_WORLD_DIRECTOR.md\">世界刷新\u003c/a>。人物、怪物和载具都用可测量的米/秒，追逐不采用隐藏瞬移补偿。\u003c/p>\u003ch2>1. 每个大境界的地面移动\u003c/h2>\u003cp>表为一级、无负重惩罚、无装备加成的常速/疾跑/短时奔袭上限。常速是正常赶路，不代表姿态一定是现实走路；高境通过轻身步法表达，慢走可随时切回便于查看物体的 1.65 m/s。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>境界\u003c/th>\u003cth>常速 m/s\u003c/th>\u003cth>疾跑 m/s\u003c/th>\u003cth>境界奔袭 m/s\u003c/th>\u003cth>从静止到基础疾跑约秒数\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0 后天\u003c/td>\u003ctd>4.7\u003c/td>\u003ctd>8.6\u003c/td>\u003ctd>无独立奔袭\u003c/td>\u003ctd>0.9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R1 先天\u003c/td>\u003ctd>5.5\u003c/td>\u003ctd>12\u003c/td>\u003ctd>18\u003c/td>\u003ctd>0.8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2 灵海\u003c/td>\u003ctd>6.5\u003c/td>\u003ctd>17\u003c/td>\u003ctd>27\u003c/td>\u003ctd>0.75\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3 金丹\u003c/td>\u003ctd>8\u003c/td>\u003ctd>24\u003c/td>\u003ctd>39\u003c/td>\u003ctd>0.7\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4 元婴\u003c/td>\u003ctd>10\u003c/td>\u003ctd>33\u003c/td>\u003ctd>55\u003c/td>\u003ctd>0.65\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R5 化神\u003c/td>\u003ctd>12\u003c/td>\u003ctd>45\u003c/td>\u003ctd>75\u003c/td>\u003ctd>0.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6 炼虚\u003c/td>\u003ctd>14\u003c/td>\u003ctd>60\u003c/td>\u003ctd>100\u003c/td>\u003ctd>0.55\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R7 合道\u003c/td>\u003ctd>17\u003c/td>\u003ctd>80\u003c/td>\u003ctd>135\u003c/td>\u003ctd>0.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R8 星劫\u003c/td>\u003ctd>20\u003c/td>\u003ctd>105\u003c/td>\u003ctd>180\u003c/td>\u003ctd>0.45\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R9 道源\u003c/td>\u003ctd>24\u003c/td>\u003ctd>140\u003c/td>\u003ctd>240\u003c/td>\u003ctd>0.4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>小等级倍率 \u003ccode>L(l)=1+0.025×(l−1)\u003c/code>，十级比一级快 22.5%。常速/疾跑乘该倍率与常驻速度构筑倍率（1.0—2.0），再乘负重/减速/药后遗症；常驻上限 2.0 是每境基础值的上限，绝不是全部境界共用 8.6×2。\u003c/p>\u003cp>常规地速：\u003ccode>v=base(r,mode) × L(l) × min(2,buildMultiplier) × loadFactor × slowFactor × drugFactor\u003c/code>。慢走使用固定 1.65 起点再乘负重/减速，不因道源身份无法慢走。药物正增益后最终不超过该模式基础×L×2.25；无正增益时仍为×2上限。攻击速度与地面速度分开，不能把挥刀播放加速 20 倍。\u003c/p>\u003cp>境界奔袭由先天导引教学解锁，是地面长距离轻身模式，不等于闪避。稳定疾跑 2 秒且前方安全后可再次按 Shift 切入，持续耗体力与最大真气 1%/秒，基础最长 8 秒，冷却 12 秒；按攻击/交互退出并减速，不能高速掠过目标仍按近战距离结算命中。奔袭只乘 L，构筑最高再乘 1.25，药物不能突破表值×L×1.25；与普通疾跑加成择当前模式公式，不把两者叠乘。\u003c/p>\u003cp>高境奔袭采用蹬地、滑步与残影，不加快脚步循环到失真；角色物理连续移动，残影没有伤害。各境奔袭动画/特效需随实施切片真实制作。\u003c/p>\u003ch2>2. 加速、转弯与低速控制\u003c/h2>\u003cp>疾跑基础加速度 \u003ccode>a=基础疾跑速度/表中加速秒数\u003c/code>；负重按同系数削减，高速奔袭另用曲线达到上限。制动距离使用实际速度/减速度计算，不把松开键等同瞬间停车；高境可花气急停，气不足保持正常制动。\u003c/p>\u003cp>可用横向加速度限制转弯半径 \u003ccode>radius≥v²/aLateral\u003c/code>。基础横向加速度为 \u003ccode>18×1.5^r m/s²\u003c/code>，受到负重与减速限制。玩家鼠标可自由观察，身体路径按转向能力逐渐改变，不强迫镜头慢慢转。近战、室内、狭窄桥自动进入低速控制时明确 HUD 提示，可用慢走精细操作；不能无提示让角色突然失去方向。\u003c/p>\u003cp>Z 趴伏速度=\u003ccode>min(6,当境基础常速×0.18×L)×负重×减速\u003c/code>；C 蹲行=\u003ccode>min(12,当境基础常速×0.45×L)×负重×减速\u003c/code>。它们不提供奔袭，高境爬行不做成地面导弹。普通闪避距离仍按技能阶段配置，不能将疾跑速度直接乘到旧 4 米闪避上。\u003c/p>\u003cp>所有位移含奔袭和飞行都扫掠碰撞；多次子步和预热地形保护高速移动。前方内容未加载时减速并提示，不把角色放进无碰撞虚空。追逐中的敌人同样不能穿过未加载墙体。\u003c/p>\u003ch2>3. 飞行与载具速度关系\u003c/h2>\u003cp>F0/F1/F2/F3 设备巡航上限保持原 12/25/40/65 m/s，人物境界不直接给机体加速。负重按 D3-10 降低最大速度/加速/爬升。R4 御器基础 70、R5 御空 100、R6 160、R7 250 m/s；飞行构筑速度加成最高 25%，负重惩罚照常生效。\u003c/p>\u003cp>R8/R9 星空局部巡航分别以 1,000/2,500 m/s 为起点，属于远行档；近敌、入港、贴近小天体时逐渐降到战斗机动档 250/400 m/s，并允许玩家主动减速，不能在生效瞬间把正在追赶的两者拉近。跨星距离仍走传送/长航流程，地面和星空不共用一张速度表。\u003c/p>\u003cp>R0 满载 F1 可能被 R2 地面奔袭怪追近，这是运载选择的真实代价；高阶人物无需为了赶路永远坐慢速新手机。母星限高、真气耗尽下降、不能在持续飞行中自然回气仍沿用已有规则。\u003c/p>\u003ch2>4. 敌人的感知和追逐状态\u003c/h2>\u003cp>状态机：巡逻→疑似感知→确认目标→追逐/截路→攻击→失去视线→搜索→警戒返回。视觉、声音、气味/神识是独立通道；R0 普通野兽不隔山知道坐标，高阶神识怪有明确范围和干扰方式。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>视觉/听觉起点\u003c/th>\u003cth>追逐策略\u003c/th>\u003cth>失去目标后的搜索\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0—R1 掠食兽\u003c/td>\u003ctd>视觉 35 m、声音 25 m，蹲伏足音更小\u003c/td>\u003ctd>沿可达路线直追，扑击需前摇\u003c/td>\u003ctd>最后可见点附近 8—12 秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2—R3 猎兽\u003c/td>\u003ctd>视觉 55 m、声音 35 m，部分有气味 20 m\u003c/td>\u003ctd>预测 0.5 秒目标速度，侧翼绕障\u003c/td>\u003ctd>12—18 秒，最多 2 个最近足迹点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4—R5 灵兽\u003c/td>\u003ctd>视觉 80 m、有限神识 50 m\u003c/td>\u003ctd>根据地形选截路点，空地联动\u003c/td>\u003ctd>15—22 秒，可用遮蔽阵/岩层切断神识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6—R9 高阶生物\u003c/td>\u003ctd>按场景配置，首片地面上限 160 m\u003c/td>\u003ctd>领域/空中截击，能力有冷却和资源\u003c/td>\u003ctd>20—30 秒；不永久全图锁定\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>距离是该类基础配置，不代表所有物种都相同；昼夜、天气、姿态和障碍修改感知。高级怪物只在实际感知成功后追踪，不能读取玩家整张地图坐标。\u003c/p>\u003cp>星空场景另按闭合速度设置 1—5 公里预警范围与减速带，不把地面 160 米直接套给 1,000 m/s 巡航。必须留出至少数秒可反应时间；长距离渲染/调度预热不足时先降巡航速度，不能在玩家到达前一帧才出现巨兽。\u003c/p>\u003cp>同阶同级普通怪巡航追速约为玩家\u003cstrong>未配装、无负重基础疾跑\u003c/strong>的 0.90—1.05；捕猎专长怪短时 1.15—1.30、持续 2—4 秒并明显喘息。防守/重甲怪慢一些。敌人以自身境界/等级算速度，不能根据当前玩家速度实时设置成“玩家＋1”，也不因玩家换戒减重而同步变快。\u003c/p>\u003ch2>5. 追上、逃脱、追击范围\u003c/h2>\u003cp>攻击须真的到有效距离并面对目标，扑击/抓取用扫掠命中；不做距离很远的自动抓回。角色可借转弯、障碍、洞穴、烟尘、消声姿态、飞行落差断感知；飞行不默认让所有地面怪无条件失去目标，但没有远程能力的怪不能凭空发射追踪弹。\u003c/p>\u003cp>脱战条件：连续失去全部有效感知通道，搜索阶段结束且未再受到攻击。每种怪有生态活动范围与返巢倾向，但越过一条线不会立即满血无敌。返巢阶段不产新的修为/掉落，脱离战斗且未被持续干扰 10 秒后按每秒 5% 最大生命恢复；重新接敌沿当前真实生命继续。不存在边界外能伤害敌人、敌人却永远无法攻击玩家的甜点位；发现不可达目标则找掩体/远离，不能站着挨射。\u003c/p>\u003cp>连续追击跨块保留实例 ID 和关键状态，优先加载追击走廊，不能一过 160 米 AI 圈就删除追兵。预算不足时优先保留追击中的怪，延迟新刷；跨洞府实例口需合法门禁，追兵在外警戒，不穿墙传送进私人住宅。\u003c/p>\u003cp>新手误入高手区应先看到残骸、预警与敌人动作；同一地形直线硬跑很可能被追上，但有可识别的撤退掩体或救援结局。首次边界遭遇可以用较慢守门种类教学，不能暗改其境界速度。昏迷按现有救援规则处理，不永久丢成长。\u003c/p>\u003ch2>6. 开发样板与数值例子\u003c/h2>\u003cp>无配装、无负重：后天一级疾跑 8.6，先天一级 12，灵海一级 17 m/s。后天满安全负重倍率 0.75 时只剩 6.45 m/s；相对一只追速 9 m/s 的掠兽，被追近是正常结果，玩家应卸货、侧闪扑击或借障碍脱离。\u003c/p>\u003cp>先天一级对同阶捕猎兽短时 14.4 m/s，单纯一直按 W 不保证逃脱；使用 18 m/s 奔袭可拉开一段距离，但耗气、持续和转弯半径都限制滥用。高阶不能凭“每境增攻防”却仍与新手同速，这是本轮明确修正。\u003c/p>\u003ch2>7. 验收\u003c/h2>\u003cp>验证十境速度单调递增、每境十级差异、负重曲线连续、体力/真气耗尽、构筑/药物上限、起跑制动、急转半径、车辆货重影响、敌人速度不读取玩家即时速度、遮挡脱战、跨块继续追击、无不可见瞬移、返巢回血边界不刷奖，以及 30/60/120 FPS 下相同路程与碰撞结果。\u003c/p>"},{"file":"14_OFFLINE_AND_ONLINE_BOUNDARY.md","title":"D3-14 · 单机先行、未来联网的角色与世界边界","text":"# D3-14 · 单机先行、未来联网的角色与世界边界\n\n\u003c!-- illustrated-overview:start -->\n![单机先行，联网留边界](media/diagram-14-v001.svg)\n\n*图解：本地暂停规则不能直接用在所有人共享的世界。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；架构设计，当前仍是单机，不新增后端或第二项目。依赖 [刷新](08_WORLD_DIRECTOR.md)、[库存](10_STORAGE_AND_ENCUMBRANCE.md)、[洞府](11_CAVES_AND_FORTUNES.md)。不是本轮要立即实现的联机功能清单。\n\n## 1. 现在留好边界，后续按阶段联网\n\n宗门、战争和阵法新增实例归属以[23](23_SECTS_NPCS_MISSIONS_AND_DUELS.md)、[24](24_SECT_BUILDINGS_AND_FORMATIONS.md)为准。单机离线不模拟攻城破坏，宗门个人贡献与组织财库分账；未来服务器裁决地权、阵能、权限和战斗，正式在线世界不直接导入本地宗门资产。\n\n阶段 A：单机完整闭环，世界/角色种子、库存、洞府、计时和事务都通过适配器访问。阶段 B：独立在线角色档案与个人洞府，验证认证、服务端资产、恢复和时间。阶段 C：组队探索实例与合作战斗。阶段 D：在经济、所有权与反作弊通过验证后增加玩家交易/共享野外。联网不是把 localStorage 上传就完成，也不要求为单机先开发多服经济。\n\n继续同仓库模块化，未来确有服务器运行需求再建立服务端目录/部署边界。客户端渲染、输入、预测与规则定义可复用；资产结算、稀有随机结果、时间、怪物生命和库存由服务器最终确认。\n\n## 2. 角色/世界/实例分离\n\n|对象|稳定归属|用途|\n|---|---|---|\n|accountId|未来账号|登录和在线角色权限，单机可为空|\n|characterId|每个角色|境界、背包、功法、已领取机缘、私人洞府|\n|worldId/worldSeed|一份世界|地形与区域；单机可每角色一世界，组队为服务器世界|\n|worldUniqueLedger|世界根账本|同世界所有角色共用，原器/道统/异格/核心机缘预留与流转；删除角色不删除该账|\n|characterFortuneSeed|单机角色或服务器私有角色数据|个人机缘差异，不作为共享地形种子|\n|instanceId|一场洞府/战斗/事件|参与者、生成配置、敌人状态与结算范围|\n|itemInstanceId/containerId|唯一物品/容器|放在哪里、属于谁、是否可交易|\n|transactionId|一次动作的结算|掉落、转移、服药、扩容、交易只提交一次|\n\n单机 `origin=offline`，在线 `origin=online`，不得在同一角色过程中随意切 origin。规则版本和生成器版本存档；服务端随机主种子不发送给客户端，客户端只取得可见的实例结果。\n\n## 3. 哪些世界共享，哪些机缘个人化\n\n联网普通野怪、矿点和公共事件由服务器世界生成，不能每个客户端各有一套碰撞怪；私人洞府和个人传承是角色/队伍实例。公开洞府入口可以让同队一起进，但每个角色的首次资格、机缘奖励和领取记录分开。\n\n默认合作奖励规则：参与者在遭遇开始或合法加入时登记，服务器依据真实参与结算个人材料；不是最后一下独占所有血液。离线角色、站在安全区的未参与者不分经验。同一核心奖励每个 eligible character 一次，组队人数改变不复制稀有物；掉落总供给按在线规则另行平衡，不能直接把单机表乘队伍人数上线。\n\n私人洞府 ownerId 固定，可设置访客/队友展示权限；默认仅主人存取仓库、操作扩容。开放共用箱需明确权限和日志，访客不能默认拿走灵石。首期联网不做离线抄家或洞府抢占。\n\n## 4. 库存与交易的权威\n\n客户端提交的是“将物品 X 从容器 A 转移到 B，数量 n，期望版本 v”的意图，服务器校验距离、归属、容量、负重、绑定和锁定状态，再原子提交。客户端计算的容量与速度只是预测，不能自行宣布扩容成功。\n\n同一个含物法器不能同时归人物和载具；物品移动、钱包变化、地面包状态在同一事务。交易双方最终确认时再次检查物品与版本，移动被锁住的戒指、撤回材料或掉线都会取消未提交交易；已提交结果幂等重发，不能退货又发一份。\n\n灵石实体和银行账本不得双计余额。服务费、吸收、扩容、炼丹属于资产消耗，要有可追溯来源和输出。离线修改脚本得到的资产不能以“继承单机进度”直接流入在线市场。\n\n## 5. 单机档案怎样迁移\n\n在线经济默认使用**新建在线角色**，单机档案保留可继续玩。可迁移已解锁的非经济外观/已读剧情等经规则允许的纪念项；不直接继承灵石、材料、武器属性、修为、稀有机缘与扩容容量。\n\n若后续决定开放继承，必须建立单独的审核/封闭继承区，并与正常交易服隔离，明确折算表和验证依据；纯客户端历史无法可靠证明来源合法，不能承诺“校验一下 JSON 就可公平联网”。不在本次预先实施大规模验证或删除用户单机进度。\n\n## 6. 时间、暂停与断线\n\n单机暂停可冻结 simTime；联网共享战斗不能由一名玩家菜单暂停。在线打坐 72 小时上限由服务器计算，药效、后遗症、冷却用服务器状态，客户端修改系统时间无效。\n\n在线普通主动登出要求脱战并安全站定 10 秒；战斗断线保留角色最多 20 秒由基础防守/寻掩体行为接管，然后按服务器场景进行撤离或倒地救援，不让客户端关闭程序瞬间无敌。具体时间为后续联机测试起点；私人安全洞府可立即退出。\n\n线上断线期间不暂停追兵、药物和空间法器操作。扩容/炼丹已提交订单按服务器到期；未提交操作释放锁。重连先同步 authoritativeRevision、容器和增益，再恢复输入，防止旧客户端快照覆盖新结果。\n\n## 7. 验证范围\n\n单机阶段先用假时钟与本地事务适配器验证重载/重复请求；不声称已具备网络一致性。联网阶段必须追加双客户端同时拾取、转移中掉线、同戒同时交易/扩容、组队资格变更、模拟延迟/乱序、重复请求与版本冲突、种子不泄漏、离线资产拒绝导入正常市场，以及私人洞府访问权限测试。\n","html":"\u003ch1>D3-14 · 单机先行、未来联网的角色与世界边界\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-14-v001.svg\" alt=\"单机先行，联网留边界\">\u003c/p>\u003cp>\u003cem>图解：本地暂停规则不能直接用在所有人共享的世界。\u003c/em>\u003c/p>\u003cp>2026-09-12；架构设计，当前仍是单机，不新增后端或第二项目。依赖 \u003ca href=\"#08_WORLD_DIRECTOR.md\">刷新\u003c/a>、\u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">库存\u003c/a>、\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">洞府\u003c/a>。不是本轮要立即实现的联机功能清单。\u003c/p>\u003ch2>1. 现在留好边界，后续按阶段联网\u003c/h2>\u003cp>宗门、战争和阵法新增实例归属以\u003ca href=\"#23_SECTS_NPCS_MISSIONS_AND_DUELS.md\">23\u003c/a>、\u003ca href=\"#24_SECT_BUILDINGS_AND_FORMATIONS.md\">24\u003c/a>为准。单机离线不模拟攻城破坏，宗门个人贡献与组织财库分账；未来服务器裁决地权、阵能、权限和战斗，正式在线世界不直接导入本地宗门资产。\u003c/p>\u003cp>阶段 A：单机完整闭环，世界/角色种子、库存、洞府、计时和事务都通过适配器访问。阶段 B：独立在线角色档案与个人洞府，验证认证、服务端资产、恢复和时间。阶段 C：组队探索实例与合作战斗。阶段 D：在经济、所有权与反作弊通过验证后增加玩家交易/共享野外。联网不是把 localStorage 上传就完成，也不要求为单机先开发多服经济。\u003c/p>\u003cp>继续同仓库模块化，未来确有服务器运行需求再建立服务端目录/部署边界。客户端渲染、输入、预测与规则定义可复用；资产结算、稀有随机结果、时间、怪物生命和库存由服务器最终确认。\u003c/p>\u003ch2>2. 角色/世界/实例分离\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>稳定归属\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>accountId\u003c/td>\u003ctd>未来账号\u003c/td>\u003ctd>登录和在线角色权限，单机可为空\u003c/td>\u003c/tr>\u003ctr>\u003ctd>characterId\u003c/td>\u003ctd>每个角色\u003c/td>\u003ctd>境界、背包、功法、已领取机缘、私人洞府\u003c/td>\u003c/tr>\u003ctr>\u003ctd>worldId/worldSeed\u003c/td>\u003ctd>一份世界\u003c/td>\u003ctd>地形与区域；单机可每角色一世界，组队为服务器世界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>worldUniqueLedger\u003c/td>\u003ctd>世界根账本\u003c/td>\u003ctd>同世界所有角色共用，原器/道统/异格/核心机缘预留与流转；删除角色不删除该账\u003c/td>\u003c/tr>\u003ctr>\u003ctd>characterFortuneSeed\u003c/td>\u003ctd>单机角色或服务器私有角色数据\u003c/td>\u003ctd>个人机缘差异，不作为共享地形种子\u003c/td>\u003c/tr>\u003ctr>\u003ctd>instanceId\u003c/td>\u003ctd>一场洞府/战斗/事件\u003c/td>\u003ctd>参与者、生成配置、敌人状态与结算范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>itemInstanceId/containerId\u003c/td>\u003ctd>唯一物品/容器\u003c/td>\u003ctd>放在哪里、属于谁、是否可交易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>transactionId\u003c/td>\u003ctd>一次动作的结算\u003c/td>\u003ctd>掉落、转移、服药、扩容、交易只提交一次\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>单机 \u003ccode>origin=offline\u003c/code>，在线 \u003ccode>origin=online\u003c/code>，不得在同一角色过程中随意切 origin。规则版本和生成器版本存档；服务端随机主种子不发送给客户端，客户端只取得可见的实例结果。\u003c/p>\u003ch2>3. 哪些世界共享，哪些机缘个人化\u003c/h2>\u003cp>联网普通野怪、矿点和公共事件由服务器世界生成，不能每个客户端各有一套碰撞怪；私人洞府和个人传承是角色/队伍实例。公开洞府入口可以让同队一起进，但每个角色的首次资格、机缘奖励和领取记录分开。\u003c/p>\u003cp>默认合作奖励规则：参与者在遭遇开始或合法加入时登记，服务器依据真实参与结算个人材料；不是最后一下独占所有血液。离线角色、站在安全区的未参与者不分经验。同一核心奖励每个 eligible character 一次，组队人数改变不复制稀有物；掉落总供给按在线规则另行平衡，不能直接把单机表乘队伍人数上线。\u003c/p>\u003cp>私人洞府 ownerId 固定，可设置访客/队友展示权限；默认仅主人存取仓库、操作扩容。开放共用箱需明确权限和日志，访客不能默认拿走灵石。首期联网不做离线抄家或洞府抢占。\u003c/p>\u003ch2>4. 库存与交易的权威\u003c/h2>\u003cp>客户端提交的是“将物品 X 从容器 A 转移到 B，数量 n，期望版本 v”的意图，服务器校验距离、归属、容量、负重、绑定和锁定状态，再原子提交。客户端计算的容量与速度只是预测，不能自行宣布扩容成功。\u003c/p>\u003cp>同一个含物法器不能同时归人物和载具；物品移动、钱包变化、地面包状态在同一事务。交易双方最终确认时再次检查物品与版本，移动被锁住的戒指、撤回材料或掉线都会取消未提交交易；已提交结果幂等重发，不能退货又发一份。\u003c/p>\u003cp>灵石实体和银行账本不得双计余额。服务费、吸收、扩容、炼丹属于资产消耗，要有可追溯来源和输出。离线修改脚本得到的资产不能以“继承单机进度”直接流入在线市场。\u003c/p>\u003ch2>5. 单机档案怎样迁移\u003c/h2>\u003cp>在线经济默认使用\u003cstrong>新建在线角色\u003c/strong>，单机档案保留可继续玩。可迁移已解锁的非经济外观/已读剧情等经规则允许的纪念项；不直接继承灵石、材料、武器属性、修为、稀有机缘与扩容容量。\u003c/p>\u003cp>若后续决定开放继承，必须建立单独的审核/封闭继承区，并与正常交易服隔离，明确折算表和验证依据；纯客户端历史无法可靠证明来源合法，不能承诺“校验一下 JSON 就可公平联网”。不在本次预先实施大规模验证或删除用户单机进度。\u003c/p>\u003ch2>6. 时间、暂停与断线\u003c/h2>\u003cp>单机暂停可冻结 simTime；联网共享战斗不能由一名玩家菜单暂停。在线打坐 72 小时上限由服务器计算，药效、后遗症、冷却用服务器状态，客户端修改系统时间无效。\u003c/p>\u003cp>在线普通主动登出要求脱战并安全站定 10 秒；战斗断线保留角色最多 20 秒由基础防守/寻掩体行为接管，然后按服务器场景进行撤离或倒地救援，不让客户端关闭程序瞬间无敌。具体时间为后续联机测试起点；私人安全洞府可立即退出。\u003c/p>\u003cp>线上断线期间不暂停追兵、药物和空间法器操作。扩容/炼丹已提交订单按服务器到期；未提交操作释放锁。重连先同步 authoritativeRevision、容器和增益，再恢复输入，防止旧客户端快照覆盖新结果。\u003c/p>\u003ch2>7. 验证范围\u003c/h2>\u003cp>单机阶段先用假时钟与本地事务适配器验证重载/重复请求；不声称已具备网络一致性。联网阶段必须追加双客户端同时拾取、转移中掉线、同戒同时交易/扩容、组队资格变更、模拟延迟/乱序、重复请求与版本冲突、种子不泄漏、离线资产拒绝导入正常市场，以及私人洞府访问权限测试。\u003c/p>"},{"file":"15_PET_PROGRESSION_AND_BOND.md","title":"D3-15 · 灵宠：收服、血脉、成长与陪伴","text":"# D3-15 · 灵宠：收服、血脉、成长与陪伴\n\n\u003c!-- illustrated-overview:start -->\n![灵宠的成长旅程](media/diagram-15-v002.svg)\n\n*图解：同一只宠物：日常迷你跟随 ⇄ 完整体型战斗；身份与生命、技能冷却共用。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；完整设计草案，未实装。配套 [33 种图鉴](16_PET_BESTIARY_33.md)、[骑乘空战与资产](17_PET_3D_FLIGHT_AND_ASSETS.md)、[命名装扮与身份](18_NAMES_PET_STYLE_AND_IDENTITY.md)。本文新增宠物成长，不覆盖人物境界或野怪血核表。\n\n## 1. 玩家获得一位怎样的伙伴\n\n探索蛋巢/遇见灵兽 → 观察习性、救助和喂食 → 孵化或建立契约 → 起名 → 跟随、训练、共同战斗 → 学习功法/突破 → 觉醒血脉 → 解锁新外形与骑乘 → 在洞府照料、装扮和记录旅程。\n\n宠物具有自己的境界、血脉、年龄阶段、性格、信任、饱食和精力。名称相同不意味着数值/花纹相同；青龙幼裔不是刚孵化就能毁星。33 种属于神话血统的游戏谱系，普通幼裔也能长期养成，不用抓到成年神兽才开始系统。\n\n场景中同时只有 **1只当前随行宠物**，由同一个体切换两种模式：**日常跟随模式是迷你版，战斗模式是完整体型**。两种模式互斥，共用petInstanceId、名字、血脉、等级、羁绊、装备、生命、灵力与技能冷却，没有独立陪伴宠槽。迷你模式不攻击、不骑乘，不提供战斗/探宝/采集增益。\n\n随行契约栏3个是候选名单，不代表同时显示3只；切换成另一只宠物须脱战、落地并遵守60秒共享换宠冷却。同一只宠物变换模式不算换宠、不触发这项60秒冷却，也不恢复气血或技能。洞府灵兽栏从6席扩到18、再到66席，允许拥有同种不同个体，但当前只带其中一只在身边。\n\n## 2. 四条独立成长轴\n\n|轴|范围|决定什么|\n|---|---|---|\n|修为境界|R0 后天至 R9 道源，每境 1—10 级|生命、攻防、灵力、技能/飞行承载|\n|血脉|B0—B6 七档|成长资质、天赋分支、标志性外形；不是角色境界|\n|生命阶段|蛋/幼生/成长期/成熟期/古兽期|体型、基础动作、能否承载骑乘、野生收服难度|\n|羁绊|契约后 0—100，独立于收服前信任|配合精度、互动、伙伴回忆与外观动作|\n\n血脉七档：**B0 凡裔、B1 灵种、B2 异血、B3 玄脉、B4 王血、B5 圣裔、B6 祖脉**。高档更稀有，低档可通过进化提升；B6 不是花钱反复喂同一颗丹就必得。\n\n## 3. 从蛋孵化\n\n宠物蛋来自可探索蛋巢、随机洞府、救助委托或允许交易的未绑定蛋。新手任务可在 PET09 幼狐、PET27 幼当康、PET32 精卫幼裔三种 B0 蛋中选择一个，不把第一只伙伴锁在随机掉落后面；此任务不叫极品机缘。\n\n蛋首次生成就确定 `eggId/speciesId/bloodlinePotential/appearanceSeed/temperamentSeed`，鉴定可以逐步公开信息，但存放/孵化/读档不重抽。初始 B0—B2 孵化约 30/60/120 分钟有效照料时间；B3—B4 约 4/8 小时，B5—B6 需独特孵化环境及传承验证，时间不是唯一门槛。\n\n孵化需要本种偏好的温度/灵气档、营养 2 份和一个稳定孵化器。在线照料满足条件按 1 倍推进；离线仅在安全孵化器内、已预存必要能量时按 0.5 倍最多结算前 72 小时，完成后只等待破壳，不自动繁殖下一枚。缺能量暂停而不是坏蛋，长期不登录不损坏蛋或让宠物饿死。\n\n破壳仪式由玩家确认，进入起名/首次互动；新生自带 60 羁绊和基础亲近，不再重复收服小游戏。不同照料选择可影响一个温和的性格倾向，不改变预定物种或用温度小误差毁掉极品血脉。未绑定蛋可交易；进入孵化/绑定后锁定所有权，取消孵化退回同一枚进度蛋，不复制。\n\n## 4. 野外收服：成熟越高越难\n\n只有带 `tameable` 标记的野生个体可收服。主线首领、已被他人契约的宠物、临时召唤物不能直接抓；图鉴显示“可接近/可缔约/不可收服”。普通野怪 M 系列不自动全变宠，野生神兽幼裔使用 PET 对应的独立刷新配置。\n\n收服前信任 0—100，每次有效喂食间隔至少 5 分钟有效游玩；一次只消耗 1 份匹配层级的偏好食物，同次扔十份只吃一份，不算十次。已饱食、战斗警戒或食物不匹配时先提示/拒绝，不暗扣。信任保存在该野生实例，不因离开调度块重置。\n\n|生命阶段|最低有效喂食次数|每次偏好喂食信任|缔约信任门槛|额外条件|\n|---|---:|---:|---:|---|\n|幼生|5|+8|60|完成 2 次不同的照料/安抚互动，各 +10|\n|成长期|8|+6|75|完成一次救助/护送 +20、一次共同探索 +10|\n|成熟期|14|+4|85|完成 3 项物种考验共 +24，稳定照料 +10|\n|古兽期|20|+3|95|两项专属试炼各 +15、一次偏好照料 +5；需稀有缔约资格|\n\n表中条件满足时信任有确定路线达到阈值，不把“喂14次”藏成永远差一点的抽奖。事件加信任有唯一 ID，同一段护送不能反复领。首次受伤救助可作为互动，不鼓励先打伤再治疗刷好感：由玩家/宠物造成的伤害不生成救助奖励，攻击该个体降低信任并进入警戒。\n\n达到条件后在安全位置发出契约邀请，消耗一枚匹配契纹，5 秒无伤害引导后确定成功；不最后再用 1% 随机成功率吞掉几十次喂食。普通契约只允许目标不高于主人当前境界，且具备对应御灵知识；超过主人大境界要走第 8 节稀有破限契约。古兽难收服来自准备与考验，不来自无限重掷。\n\n野生目标离开时图鉴保留足迹范围与信任；未契约目标依然是世界生物，不必永久站原地等玩家。迁徙只去已定义的可达栖息地，重要收服目标失踪时给追踪线索。联网预留和资格规则见第 18 文档。\n\n## 5. 等级、修为与功法\n\n每级需求 `petXp(r,l)=round(80×4^r×l^1.35)`，十级满槽后选择突破，不自动跨境。有效战斗结束，实际参与的出战宠获得对应宠物奖励基数，默认按玩家该次合格战斗修为的 70% 换算；不从玩家经验中分走。无收益教学木桩、低两个境界的刷怪、仅处于迷你跟随、未实际参战的同一只宠物不增长实战经验。\n\n洞府训练提供每小时 `8×4^r` 宠物修为；离线 0.5 倍、最多 72 小时，每个角色一次只训练 1 只指定宠。离线训练消耗已授权宠物口粮预算，缺粮暂停，不能自动耗完背包丹药。生命阶段不按现实年龄自动老死，幼生成长期通过照料次数、有效探索和一项体能挑战解锁；成熟需两类战斗/骑乘试炼，古兽为血脉传承阶段，不是上线几年才有资格。\n\n宠物功法结构：1部主修兽诀、2个主动技能、1个血脉天赋、1个羁绊协同槽。技能熟练阶仍为入门/小成/精通/大成/圆满，使用真实护主/命中/避险事件成长，挂机不能练满主动技能。33种各两主动与一天赋、解锁与伤害系数以[21](21_PET_SKILLS_33.md)为准；补充术强5B、灵抗6B，五阶倍率共用19。\n\n六套通用兽诀：`PM01 吐纳篇`（灵力）、`PM02 奔雷步`（地面机动）、`PM03 护主诀`（拦截）、`PM04 掠空诀`（已具飞行资质者的控制）、`PM05 归巢息`（脱战恢复）、`PM06 合击章`（协同窗口）。物种天赋在图鉴逐项列出；不会飞的物种不能只读 PM04 就长出可载人翅膀。\n\n## 6. 基础数值与定位\n\n宠物采用同一境界缩放 `B=6^r×(1+0.18×(l−1))`。同级 B0 幼裔参考：生命 `90B×体型系数`、攻击 `6B×攻击型系数`、防御 `7B×防护系数`、灵力 `80×2^r×(1+0.08×(l−1))`。种族各定位系数限定 0.7—1.5，不能某种同时拿三项最大。\n\n血脉 B0—B6 常驻成长系数为 1.00/1.05/1.12/1.22/1.38/1.65/2.00；最终再加本种突破槽与功法，但不共享主人装备倍率。普通战斗宠实际 DPS 目标约主人参考同级战斗 DPS 的 25%—45%，防护宠可以生命高但输出低。宠物可以协助而不要求主人每秒微操；不能同时无限站桩奶人和输出。\n\n羁绊不直接无限倍增攻击：达到 20/40/60/80/100 分别解锁回应名字、拾取提示、一个协同窗口、专属安抚动作、关系纪念/装扮。协同收益受冷却和能量约束，宠物受伤需要恢复，不能换出再换入满血。\n\n## 7. 境界突破与血脉进化\n\n宠物每次跨大境界有三个可选配方模板（目标 R1—R9），配料来源须在 R−1 可达：\n\n|路线|主材（另加兽用溶媒×1）|本境体质槽 Q3 增量|\n|---|---|---|\n|PF-A 健体|目标阶炼体草×3、同源环境精华×2、普通营养髓×2|生命 +4%、防御 +3%|\n|PF-B 灵慧|目标阶通脉草×3、环境结晶×3、净息露×2|灵力 +5%、技能耗费 −1%|\n|PF-C 兽战|目标阶炼体草×2、合法异种净化血浆×2、上一境内丹×1|攻击 +4%、破势 +3%|\n\n兽用配方由 N25 灵兽医师及高阶丹师协作；A/B 无内丹，不用献祭另一只宠物。每境一个槽，改良替换不叠加，品质规则与体质上限继承角色系统的原则。境界突破不能顺便刷新冷却/补满灵力，健康条件和材料一次提交。\n\n血脉进化独立于境界：\n\n|目标血脉|最低宠物境界|确定准备|验证事件|\n|---|---|---|---|\n|B1 灵种|R0 六级|初灵露×3、本种偏好食物×5|完成一次安抚/共同探索|\n|B2 异血|R1|同源灵髓×3、通脉草×4|本种栖地试炼|\n|B3 玄脉|R2|血纹结晶×2、同源灵髓×5|一次物种天赋验证|\n|B4 王血|R4|祖纹碎片×3、同源精华×6|野外王种挑战或保护其栖地|\n|B5 圣裔|R6|完整圣纹×1、同源精华×8|个人血脉传承洞府|\n|B6 祖脉|R8|祖源印×1、星核砂×4、完整圣纹×2|独特祖脉机缘与最终伙伴试炼|\n\n同源指谱系对应的火/水/木/金/土/风/雷/空间能量精华，通过草药、矿脉与事件获得，不是杀自己养的宠物取血。稀有祖纹可由多种探索路线收集；B6 无固定日常刷点，资格实例唯一。进化前预览新能力、外形和可保留旧外观选项，原名字、petId、装扮、回忆不丢。只在安全稳灵台进化，不在空中变体导致骑手坠落。\n\n## 8. 宠物超过主人：允许，但罕见\n\n普通契约的修为突破上限是主人达到过的最高境界，通常靠共同活动保持接近；允许宠物同境小级领先，主人的临时负伤/脱装不触发宠物自动降级。血脉成长和主人构筑不同，个别单项超过主人是合理的。\n\n设计中的稀有“护主破限”指综合战斗能力明显超越主人，且可高出主人 **1 个大境界**。只通过一次匹配角色的特殊机缘授予破限契约，不在每次喂食/孵蛋/杀怪都抽。它在 0.3% 永久机缘成功后的合法子池中默认权重 5%，未过滤基准联合概率约 0.015%；不是在任意场景保证这个概率，发布配置需验证过滤后的实际分布。\n\n每角色最多一个破限契约位；宠物依旧需自己获取修为与材料，事件不同时免费赠送最高血脉、满级和全功法。特殊救主灌顶可以一次直接升一个宠物大境界，但仍受主人最高境界＋1、R9 封顶限制。替换契约位在安全 NPC 处进行，旧宠不降级但超出普通承载的技能进入休养封存，不复制双份超阶出战能力。\n\n稀有强宠可以帮助越级，但传送资格、主人真空承受和任务本人验证不代打绕过。普通玩家无需获得强宠才能完成主线；阶段平衡目标是绝大多数早中期角色没有综合碾压主人的宠物，需在随机样本与实机中验证，不能仅用一个低概率数字宣称平衡已成立。\n\n## 9. 跟随战斗、受伤与陪伴\n\n命令为跟随、防御主人、协同目标、停留、撤回。防御默认只反击威胁主人/自己的目标，不擅自拉满整群怪；禁区、NPC 和玩家私人建筑不自动攻击。宠物助攻贡献和主人击杀共享同一遭遇结算，不能把同一怪物经验/血液再额外复制一份。\n\n普通击倒变为受伤，契纹引导救援，主人回站可医治；不永久死亡、不因几天不上线叛逃。骑乘途中受伤先触发滑翔/护降，再撤回，不能把骑手留在空中。濒危默认撤退，可明确指令护主但不靠永久损失宠物制造压力。\n\n33种均有可爱迷你形态，目标体长约0.25—0.65米，使用专门比例和细节表现。迷你→战斗：玩家下达指令（可设置遇敌自动响应），检查合法完整体积位置后用2秒展开；允许接敌时展开，不要求先脱战。战斗→迷你：脱战8秒、落地、没有骑手/驮货且空间安全，2秒收形。公共城镇默认日常迷你跟随。\n\n变形只切同一个体的外观、碰撞与行为状态，不创建第二只宠物。过渡期间不攻击、不骑乘，不提供无敌帧、回血或清除减益；逻辑实体与受击账连续。位置不足就保留原模式并提示，不能穿过小缝再强行变大。战斗模式的骑乘是同只完整宠物的行为，不是第三只坐骑。\n\n互动包括呼名回头、摸头/挠下巴（按物种选）、喂食、梳理羽鳞、投玩具、趴睡、主人回家迎接、共同拍照；每种至少一个专属动作。性格分好奇/沉稳/亲人/顽皮等，影响互动和非危险跟随偏好，不让同样指令随机拒绝到无法战斗。饥饿仅在线温和影响训练效率，离线冻结；重复同一互动的羁绊收益递减，但动画仍可玩，不强制每天上线签到维护关系。\n\n## 10. 宠物住所与收纳\n\n普通储物袋/戒不收活物。宠物可在洞府实体兽栏休息；远征切换使用专用“灵栖契”连接已登记兽栏/安全灵栖空间，与货物容量系统分开。召回/出战是有动画和安全检查的宠物事务，不是把100公斤活兽塞进60升背包。\n\n宠物背袋另有最大20格、60 L的专属驮架样板，仅可骑乘的大体型成熟宠装备；里面实际重量计入载宠总载荷，不能与玩家背包无限套叠。未授权的离线宠物不会替玩家挖矿或刷材料；灵兽栏扩建不增加同时战斗数量。\n\n## 11. 教学与验收\n\n新增 N25 **林蘅**（曙光营地灵兽医师）：蛋鉴定、孵化、基础契约/兽诀、照料和治疗。新增 N26 **织翎**（栖息药谷兽装师）：骑具适配、服装、花纹登记与进化外观恢复。高阶契约由 N25 传承委托与现有各星 NPC 协作，不为每只宠物再加一个专属老师。\n\n第一片仅做 PET09 幼狐的孵化/五次喂养野生路线、起名、迷你陪伴、地面助战；下一片 PET17 天马验证后天骑乘飞行，再 PET13 毕方验证羽翼空战。验收必须覆盖收服阈值确实可达、同一喂食不重复加信任、蛋不重抽、境界与血脉分离、离线不饿死、破限稀有且不越两境、宠物受伤/载主降落、模式切换不穿墙和进化不丢资产/名字。\n","html":"\u003ch1>D3-15 · 灵宠：收服、血脉、成长与陪伴\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-15-v002.svg\" alt=\"灵宠的成长旅程\">\u003c/p>\u003cp>\u003cem>图解：同一只宠物：日常迷你跟随 ⇄ 完整体型战斗；身份与生命、技能冷却共用。\u003c/em>\u003c/p>\u003cp>2026-09-12；完整设计草案，未实装。配套 \u003ca href=\"#16_PET_BESTIARY_33.md\">33 种图鉴\u003c/a>、\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">骑乘空战与资产\u003c/a>、\u003ca href=\"#18_NAMES_PET_STYLE_AND_IDENTITY.md\">命名装扮与身份\u003c/a>。本文新增宠物成长，不覆盖人物境界或野怪血核表。\u003c/p>\u003ch2>1. 玩家获得一位怎样的伙伴\u003c/h2>\u003cp>探索蛋巢/遇见灵兽 → 观察习性、救助和喂食 → 孵化或建立契约 → 起名 → 跟随、训练、共同战斗 → 学习功法/突破 → 觉醒血脉 → 解锁新外形与骑乘 → 在洞府照料、装扮和记录旅程。\u003c/p>\u003cp>宠物具有自己的境界、血脉、年龄阶段、性格、信任、饱食和精力。名称相同不意味着数值/花纹相同；青龙幼裔不是刚孵化就能毁星。33 种属于神话血统的游戏谱系，普通幼裔也能长期养成，不用抓到成年神兽才开始系统。\u003c/p>\u003cp>场景中同时只有 \u003cstrong>1只当前随行宠物\u003c/strong>，由同一个体切换两种模式：\u003cstrong>日常跟随模式是迷你版，战斗模式是完整体型\u003c/strong>。两种模式互斥，共用petInstanceId、名字、血脉、等级、羁绊、装备、生命、灵力与技能冷却，没有独立陪伴宠槽。迷你模式不攻击、不骑乘，不提供战斗/探宝/采集增益。\u003c/p>\u003cp>随行契约栏3个是候选名单，不代表同时显示3只；切换成另一只宠物须脱战、落地并遵守60秒共享换宠冷却。同一只宠物变换模式不算换宠、不触发这项60秒冷却，也不恢复气血或技能。洞府灵兽栏从6席扩到18、再到66席，允许拥有同种不同个体，但当前只带其中一只在身边。\u003c/p>\u003ch2>2. 四条独立成长轴\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>轴\u003c/th>\u003cth>范围\u003c/th>\u003cth>决定什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>修为境界\u003c/td>\u003ctd>R0 后天至 R9 道源，每境 1—10 级\u003c/td>\u003ctd>生命、攻防、灵力、技能/飞行承载\u003c/td>\u003c/tr>\u003ctr>\u003ctd>血脉\u003c/td>\u003ctd>B0—B6 七档\u003c/td>\u003ctd>成长资质、天赋分支、标志性外形；不是角色境界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生命阶段\u003c/td>\u003ctd>蛋/幼生/成长期/成熟期/古兽期\u003c/td>\u003ctd>体型、基础动作、能否承载骑乘、野生收服难度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>羁绊\u003c/td>\u003ctd>契约后 0—100，独立于收服前信任\u003c/td>\u003ctd>配合精度、互动、伙伴回忆与外观动作\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>血脉七档：\u003cstrong>B0 凡裔、B1 灵种、B2 异血、B3 玄脉、B4 王血、B5 圣裔、B6 祖脉\u003c/strong>。高档更稀有，低档可通过进化提升；B6 不是花钱反复喂同一颗丹就必得。\u003c/p>\u003ch2>3. 从蛋孵化\u003c/h2>\u003cp>宠物蛋来自可探索蛋巢、随机洞府、救助委托或允许交易的未绑定蛋。新手任务可在 PET09 幼狐、PET27 幼当康、PET32 精卫幼裔三种 B0 蛋中选择一个，不把第一只伙伴锁在随机掉落后面；此任务不叫极品机缘。\u003c/p>\u003cp>蛋首次生成就确定 \u003ccode>eggId/speciesId/bloodlinePotential/appearanceSeed/temperamentSeed\u003c/code>，鉴定可以逐步公开信息，但存放/孵化/读档不重抽。初始 B0—B2 孵化约 30/60/120 分钟有效照料时间；B3—B4 约 4/8 小时，B5—B6 需独特孵化环境及传承验证，时间不是唯一门槛。\u003c/p>\u003cp>孵化需要本种偏好的温度/灵气档、营养 2 份和一个稳定孵化器。在线照料满足条件按 1 倍推进；离线仅在安全孵化器内、已预存必要能量时按 0.5 倍最多结算前 72 小时，完成后只等待破壳，不自动繁殖下一枚。缺能量暂停而不是坏蛋，长期不登录不损坏蛋或让宠物饿死。\u003c/p>\u003cp>破壳仪式由玩家确认，进入起名/首次互动；新生自带 60 羁绊和基础亲近，不再重复收服小游戏。不同照料选择可影响一个温和的性格倾向，不改变预定物种或用温度小误差毁掉极品血脉。未绑定蛋可交易；进入孵化/绑定后锁定所有权，取消孵化退回同一枚进度蛋，不复制。\u003c/p>\u003ch2>4. 野外收服：成熟越高越难\u003c/h2>\u003cp>只有带 \u003ccode>tameable\u003c/code> 标记的野生个体可收服。主线首领、已被他人契约的宠物、临时召唤物不能直接抓；图鉴显示“可接近/可缔约/不可收服”。普通野怪 M 系列不自动全变宠，野生神兽幼裔使用 PET 对应的独立刷新配置。\u003c/p>\u003cp>收服前信任 0—100，每次有效喂食间隔至少 5 分钟有效游玩；一次只消耗 1 份匹配层级的偏好食物，同次扔十份只吃一份，不算十次。已饱食、战斗警戒或食物不匹配时先提示/拒绝，不暗扣。信任保存在该野生实例，不因离开调度块重置。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>生命阶段\u003c/th>\u003cth>最低有效喂食次数\u003c/th>\u003cth>每次偏好喂食信任\u003c/th>\u003cth>缔约信任门槛\u003c/th>\u003cth>额外条件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>幼生\u003c/td>\u003ctd>5\u003c/td>\u003ctd>+8\u003c/td>\u003ctd>60\u003c/td>\u003ctd>完成 2 次不同的照料/安抚互动，各 +10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成长期\u003c/td>\u003ctd>8\u003c/td>\u003ctd>+6\u003c/td>\u003ctd>75\u003c/td>\u003ctd>完成一次救助/护送 +20、一次共同探索 +10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成熟期\u003c/td>\u003ctd>14\u003c/td>\u003ctd>+4\u003c/td>\u003ctd>85\u003c/td>\u003ctd>完成 3 项物种考验共 +24，稳定照料 +10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>古兽期\u003c/td>\u003ctd>20\u003c/td>\u003ctd>+3\u003c/td>\u003ctd>95\u003c/td>\u003ctd>两项专属试炼各 +15、一次偏好照料 +5；需稀有缔约资格\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>表中条件满足时信任有确定路线达到阈值，不把“喂14次”藏成永远差一点的抽奖。事件加信任有唯一 ID，同一段护送不能反复领。首次受伤救助可作为互动，不鼓励先打伤再治疗刷好感：由玩家/宠物造成的伤害不生成救助奖励，攻击该个体降低信任并进入警戒。\u003c/p>\u003cp>达到条件后在安全位置发出契约邀请，消耗一枚匹配契纹，5 秒无伤害引导后确定成功；不最后再用 1% 随机成功率吞掉几十次喂食。普通契约只允许目标不高于主人当前境界，且具备对应御灵知识；超过主人大境界要走第 8 节稀有破限契约。古兽难收服来自准备与考验，不来自无限重掷。\u003c/p>\u003cp>野生目标离开时图鉴保留足迹范围与信任；未契约目标依然是世界生物，不必永久站原地等玩家。迁徙只去已定义的可达栖息地，重要收服目标失踪时给追踪线索。联网预留和资格规则见第 18 文档。\u003c/p>\u003ch2>5. 等级、修为与功法\u003c/h2>\u003cp>每级需求 \u003ccode>petXp(r,l)=round(80×4^r×l^1.35)\u003c/code>，十级满槽后选择突破，不自动跨境。有效战斗结束，实际参与的出战宠获得对应宠物奖励基数，默认按玩家该次合格战斗修为的 70% 换算；不从玩家经验中分走。无收益教学木桩、低两个境界的刷怪、仅处于迷你跟随、未实际参战的同一只宠物不增长实战经验。\u003c/p>\u003cp>洞府训练提供每小时 \u003ccode>8×4^r\u003c/code> 宠物修为；离线 0.5 倍、最多 72 小时，每个角色一次只训练 1 只指定宠。离线训练消耗已授权宠物口粮预算，缺粮暂停，不能自动耗完背包丹药。生命阶段不按现实年龄自动老死，幼生成长期通过照料次数、有效探索和一项体能挑战解锁；成熟需两类战斗/骑乘试炼，古兽为血脉传承阶段，不是上线几年才有资格。\u003c/p>\u003cp>宠物功法结构：1部主修兽诀、2个主动技能、1个血脉天赋、1个羁绊协同槽。技能熟练阶仍为入门/小成/精通/大成/圆满，使用真实护主/命中/避险事件成长，挂机不能练满主动技能。33种各两主动与一天赋、解锁与伤害系数以\u003ca href=\"#21_PET_SKILLS_33.md\">21\u003c/a>为准；补充术强5B、灵抗6B，五阶倍率共用19。\u003c/p>\u003cp>六套通用兽诀：\u003ccode>PM01 吐纳篇\u003c/code>（灵力）、\u003ccode>PM02 奔雷步\u003c/code>（地面机动）、\u003ccode>PM03 护主诀\u003c/code>（拦截）、\u003ccode>PM04 掠空诀\u003c/code>（已具飞行资质者的控制）、\u003ccode>PM05 归巢息\u003c/code>（脱战恢复）、\u003ccode>PM06 合击章\u003c/code>（协同窗口）。物种天赋在图鉴逐项列出；不会飞的物种不能只读 PM04 就长出可载人翅膀。\u003c/p>\u003ch2>6. 基础数值与定位\u003c/h2>\u003cp>宠物采用同一境界缩放 \u003ccode>B=6^r×(1+0.18×(l−1))\u003c/code>。同级 B0 幼裔参考：生命 \u003ccode>90B×体型系数\u003c/code>、攻击 \u003ccode>6B×攻击型系数\u003c/code>、防御 \u003ccode>7B×防护系数\u003c/code>、灵力 \u003ccode>80×2^r×(1+0.08×(l−1))\u003c/code>。种族各定位系数限定 0.7—1.5，不能某种同时拿三项最大。\u003c/p>\u003cp>血脉 B0—B6 常驻成长系数为 1.00/1.05/1.12/1.22/1.38/1.65/2.00；最终再加本种突破槽与功法，但不共享主人装备倍率。普通战斗宠实际 DPS 目标约主人参考同级战斗 DPS 的 25%—45%，防护宠可以生命高但输出低。宠物可以协助而不要求主人每秒微操；不能同时无限站桩奶人和输出。\u003c/p>\u003cp>羁绊不直接无限倍增攻击：达到 20/40/60/80/100 分别解锁回应名字、拾取提示、一个协同窗口、专属安抚动作、关系纪念/装扮。协同收益受冷却和能量约束，宠物受伤需要恢复，不能换出再换入满血。\u003c/p>\u003ch2>7. 境界突破与血脉进化\u003c/h2>\u003cp>宠物每次跨大境界有三个可选配方模板（目标 R1—R9），配料来源须在 R−1 可达：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>路线\u003c/th>\u003cth>主材（另加兽用溶媒×1）\u003c/th>\u003cth>本境体质槽 Q3 增量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PF-A 健体\u003c/td>\u003ctd>目标阶炼体草×3、同源环境精华×2、普通营养髓×2\u003c/td>\u003ctd>生命 +4%、防御 +3%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PF-B 灵慧\u003c/td>\u003ctd>目标阶通脉草×3、环境结晶×3、净息露×2\u003c/td>\u003ctd>灵力 +5%、技能耗费 −1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PF-C 兽战\u003c/td>\u003ctd>目标阶炼体草×2、合法异种净化血浆×2、上一境内丹×1\u003c/td>\u003ctd>攻击 +4%、破势 +3%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>兽用配方由 N25 灵兽医师及高阶丹师协作；A/B 无内丹，不用献祭另一只宠物。每境一个槽，改良替换不叠加，品质规则与体质上限继承角色系统的原则。境界突破不能顺便刷新冷却/补满灵力，健康条件和材料一次提交。\u003c/p>\u003cp>血脉进化独立于境界：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>目标血脉\u003c/th>\u003cth>最低宠物境界\u003c/th>\u003cth>确定准备\u003c/th>\u003cth>验证事件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>B1 灵种\u003c/td>\u003ctd>R0 六级\u003c/td>\u003ctd>初灵露×3、本种偏好食物×5\u003c/td>\u003ctd>完成一次安抚/共同探索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B2 异血\u003c/td>\u003ctd>R1\u003c/td>\u003ctd>同源灵髓×3、通脉草×4\u003c/td>\u003ctd>本种栖地试炼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B3 玄脉\u003c/td>\u003ctd>R2\u003c/td>\u003ctd>血纹结晶×2、同源灵髓×5\u003c/td>\u003ctd>一次物种天赋验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B4 王血\u003c/td>\u003ctd>R4\u003c/td>\u003ctd>祖纹碎片×3、同源精华×6\u003c/td>\u003ctd>野外王种挑战或保护其栖地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B5 圣裔\u003c/td>\u003ctd>R6\u003c/td>\u003ctd>完整圣纹×1、同源精华×8\u003c/td>\u003ctd>个人血脉传承洞府\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B6 祖脉\u003c/td>\u003ctd>R8\u003c/td>\u003ctd>祖源印×1、星核砂×4、完整圣纹×2\u003c/td>\u003ctd>独特祖脉机缘与最终伙伴试炼\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>同源指谱系对应的火/水/木/金/土/风/雷/空间能量精华，通过草药、矿脉与事件获得，不是杀自己养的宠物取血。稀有祖纹可由多种探索路线收集；B6 无固定日常刷点，资格实例唯一。进化前预览新能力、外形和可保留旧外观选项，原名字、petId、装扮、回忆不丢。只在安全稳灵台进化，不在空中变体导致骑手坠落。\u003c/p>\u003ch2>8. 宠物超过主人：允许，但罕见\u003c/h2>\u003cp>普通契约的修为突破上限是主人达到过的最高境界，通常靠共同活动保持接近；允许宠物同境小级领先，主人的临时负伤/脱装不触发宠物自动降级。血脉成长和主人构筑不同，个别单项超过主人是合理的。\u003c/p>\u003cp>设计中的稀有“护主破限”指综合战斗能力明显超越主人，且可高出主人 \u003cstrong>1 个大境界\u003c/strong>。只通过一次匹配角色的特殊机缘授予破限契约，不在每次喂食/孵蛋/杀怪都抽。它在 0.3% 永久机缘成功后的合法子池中默认权重 5%，未过滤基准联合概率约 0.015%；不是在任意场景保证这个概率，发布配置需验证过滤后的实际分布。\u003c/p>\u003cp>每角色最多一个破限契约位；宠物依旧需自己获取修为与材料，事件不同时免费赠送最高血脉、满级和全功法。特殊救主灌顶可以一次直接升一个宠物大境界，但仍受主人最高境界＋1、R9 封顶限制。替换契约位在安全 NPC 处进行，旧宠不降级但超出普通承载的技能进入休养封存，不复制双份超阶出战能力。\u003c/p>\u003cp>稀有强宠可以帮助越级，但传送资格、主人真空承受和任务本人验证不代打绕过。普通玩家无需获得强宠才能完成主线；阶段平衡目标是绝大多数早中期角色没有综合碾压主人的宠物，需在随机样本与实机中验证，不能仅用一个低概率数字宣称平衡已成立。\u003c/p>\u003ch2>9. 跟随战斗、受伤与陪伴\u003c/h2>\u003cp>命令为跟随、防御主人、协同目标、停留、撤回。防御默认只反击威胁主人/自己的目标，不擅自拉满整群怪；禁区、NPC 和玩家私人建筑不自动攻击。宠物助攻贡献和主人击杀共享同一遭遇结算，不能把同一怪物经验/血液再额外复制一份。\u003c/p>\u003cp>普通击倒变为受伤，契纹引导救援，主人回站可医治；不永久死亡、不因几天不上线叛逃。骑乘途中受伤先触发滑翔/护降，再撤回，不能把骑手留在空中。濒危默认撤退，可明确指令护主但不靠永久损失宠物制造压力。\u003c/p>\u003cp>33种均有可爱迷你形态，目标体长约0.25—0.65米，使用专门比例和细节表现。迷你→战斗：玩家下达指令（可设置遇敌自动响应），检查合法完整体积位置后用2秒展开；允许接敌时展开，不要求先脱战。战斗→迷你：脱战8秒、落地、没有骑手/驮货且空间安全，2秒收形。公共城镇默认日常迷你跟随。\u003c/p>\u003cp>变形只切同一个体的外观、碰撞与行为状态，不创建第二只宠物。过渡期间不攻击、不骑乘，不提供无敌帧、回血或清除减益；逻辑实体与受击账连续。位置不足就保留原模式并提示，不能穿过小缝再强行变大。战斗模式的骑乘是同只完整宠物的行为，不是第三只坐骑。\u003c/p>\u003cp>互动包括呼名回头、摸头/挠下巴（按物种选）、喂食、梳理羽鳞、投玩具、趴睡、主人回家迎接、共同拍照；每种至少一个专属动作。性格分好奇/沉稳/亲人/顽皮等，影响互动和非危险跟随偏好，不让同样指令随机拒绝到无法战斗。饥饿仅在线温和影响训练效率，离线冻结；重复同一互动的羁绊收益递减，但动画仍可玩，不强制每天上线签到维护关系。\u003c/p>\u003ch2>10. 宠物住所与收纳\u003c/h2>\u003cp>普通储物袋/戒不收活物。宠物可在洞府实体兽栏休息；远征切换使用专用“灵栖契”连接已登记兽栏/安全灵栖空间，与货物容量系统分开。召回/出战是有动画和安全检查的宠物事务，不是把100公斤活兽塞进60升背包。\u003c/p>\u003cp>宠物背袋另有最大20格、60 L的专属驮架样板，仅可骑乘的大体型成熟宠装备；里面实际重量计入载宠总载荷，不能与玩家背包无限套叠。未授权的离线宠物不会替玩家挖矿或刷材料；灵兽栏扩建不增加同时战斗数量。\u003c/p>\u003ch2>11. 教学与验收\u003c/h2>\u003cp>新增 N25 \u003cstrong>林蘅\u003c/strong>（曙光营地灵兽医师）：蛋鉴定、孵化、基础契约/兽诀、照料和治疗。新增 N26 \u003cstrong>织翎\u003c/strong>（栖息药谷兽装师）：骑具适配、服装、花纹登记与进化外观恢复。高阶契约由 N25 传承委托与现有各星 NPC 协作，不为每只宠物再加一个专属老师。\u003c/p>\u003cp>第一片仅做 PET09 幼狐的孵化/五次喂养野生路线、起名、迷你陪伴、地面助战；下一片 PET17 天马验证后天骑乘飞行，再 PET13 毕方验证羽翼空战。验收必须覆盖收服阈值确实可达、同一喂食不重复加信任、蛋不重抽、境界与血脉分离、离线不饿死、破限稀有且不越两境、宠物受伤/载主降落、模式切换不穿墙和进化不丢资产/名字。\u003c/p>"},{"file":"16_PET_BESTIARY_33.md","title":"D3-16 · 33 种神兽谱系图鉴","text":"# D3-16 · 33 种神兽谱系图鉴\n\n\u003c!-- illustrated-overview:start -->\n![33谱系，各有身份](media/diagram-16-v001.svg)\n\n*图解：六种神宠异格仍属于原33谱系，不另增常见物种。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；游戏原创改编目录，不等于全部出自同一古籍。ID 为 PET01—PET33，身份与普通怪物 M00—M29 分开。规则见 [成长收服](15_PET_PROGRESSION_AND_BOND.md)、[飞行与3D](17_PET_3D_FLIGHT_AND_ASSETS.md)。\n\n## 1. 神话参考与原创边界\n\n四方神兽的传统方位意象参考 [故宫博物院《朱雀纹砖》](https://www.dpm.org.cn/collection/sculpture/233921.html)；凤凰、九尾狐的形象参考 [《山海经·南山经》原文](https://zh.wikisource.org/zh-hans/山海經/南山經)，毕方、帝江等参考 [《山海经·西山经》](https://zh.wikisource.org/zh-hans/西山經)；鲲化鹏的母题参考 [《庄子·逍遥游》](https://ctext.org/zhuangzi/enjoyment-in-untroubled-ease)。只取名称和形态灵感，不复制现代影视/游戏的具体造型。\n\n其余名目按中国传统神话/瑞兽综合改编。天禄/辟邪等存在意象重叠，本作将其设计为不同玩法支系，不主张古籍统一记有33种互不重叠物种。凶兽谱系养成友善伙伴、陆吾/开明兽等的兽型化、所有迷你态和服装均为本作原创，不把游戏技能写成原典记载。\n\n朱雀偏火域进攻，凤凰偏恢复与回护；麒麟偏护佑，白泽偏感知，四凶也各有独立破势/控制定位。各有玩法而不是同一只鸟或四足兽换颜色。\n\n## 2. 食物和取得说明\n\n偏好食物：FD01 鲜肉羹（净化肉×2、药草×1）；FD02 灵果糕（灵果×2、谷粉×1）；FD03 鱼藻团（鱼肉×2、水藻×1）；FD04 岩髓饼（兽用可消化矿髓×1、谷粉×2）；FD05 炎露丸（火性草×2、净息露×1）；FD06 雷芽糍（雷芽×2、谷粉×1）；FD07 月露蜜（花蜜×2、月露×1）；FD08 空灵酪（界露×1、灵乳×2）。饲料层级与目标境界匹配，原料由普通采集/商人供应；血脉觉醒用的稀有精华不等同日常口粮。\n\n表中“首遇”指最早合理生成野生个体或合法蛋/线索的地区境界，非每个角色到点必得；B 是常规可遇幼裔的血脉范围，B5/B6 仅独特传承/进化。稀有高血脉蛋不进入新手保底。\n\n飞行码：G 地面；S 水陆；A 小型灵鸟可飞但不载人；W 载人羽翼；C 天生腾云型四足；L 龙形御空；K 水空双形。具体初飞、载人门槛与高度在第 17 文档，同码仍有种族限制。\n\n## 3. 全部33种：战斗、骑乘、迷你与服装\n\n|ID / 神兽|首遇 / 幼裔血脉|定位与专属天赋|食物 / 移动|迷你识别造型|定制服装方向|\n|---|---|---|---|---|---|\n|PET01 青龙|R4 雷原，罕见蛋线索 / B3—B4|雷木龙息：短直线破甲，给主人一个协同标记|FD06 / L|盘成小圈、保留双角和青鬃|分节背甲、角穗、云纹鞍毯|\n|PET02 朱雀|R3 赤炉秘府 / B3—B4|灼羽火域：限制敌人路线，友方无持续火伤|FD05 / W|圆头红绒、短三焰尾|翼根护片、胸绶、火纹飞鞍|\n|PET03 白虎|R2 山脉猎场 / B2—B3|裂金扑：明确前摇的破势扑击|FD01 / G|圆耳白爪、额纹不可全遮|虎纹护肩、颈围、轻装鞍毯|\n|PET04 玄武|R2 雾泽深处 / B2—B3|龟蛇护阵：有限正面护盾，蛇首协同牵制|FD03 / S|小龟圆壳配独立小蛇尾，双头都可互动|壳纹盖片、护缘、蛇颈饰|\n|PET05 凤凰|R4 天穹药府 / B3—B4|回护羽：救治濒危队友一次，长冷却，不无限复活|FD07 / W|蓬松金红冠羽、短彩尾|羽冠、胸披、渐变尾带|\n|PET06 麒麟|R3 镜渊传承 / B2—B4|瑞泽踏：短时净化一层可解负面并护主|FD02 / C|小鹿身、卷鬃、单独鳞片高光|胸甲、蹄环、锦纹鞍毯|\n|PET07 应龙|R5 界隙遗巢 / B3—B4|风翼截击：俯冲截路，收招需拉升空间|FD03 / L|短鼻双翼、蓝金背脊|翼根甲、背鞍、角饰|\n|PET08 烛龙|R6 空衡残府 / B4|昼晦息：短时改变局部可见度，敌我提示一致|FD08 / L|长条幼龙、柔和双瞳、无刺眼全屏光|颈节饰、星纹护脊、悬浮鞍环|\n|PET09 九尾狐|R0 旧修士居/保底蛋 / B0—B2|幻步诱影：制造可识破诱饵，帮助脱战|FD02 / G|大耳绒团；尾数随血脉显现，迷你保持识别|围巾、耳坠、尾根丝结|\n|PET10 白泽|R2 药府遗室 / B1—B3|识妖眸：标记已可观察弱点，不能透视全部世界|FD07 / G|圆角白绒、眉心纹|学士披肩、角环、图鉴挎饰|\n|PET11 貔貅|R2 陨炉洞 / B1—B3|吞煞护：吸收一次可拦截投射并进入冷却|FD04 / G|胖爪短吻、金纹腹|兽面胸甲、铃铛、铜纹背饰|\n|PET12 獬豸|R1 药谷边界 / B1—B2|定势角：针对正在攻击目标的打断冲撞|FD02 / G|独角额、软蹄短腿|独角套环、裁纹披毯|\n|PET13 毕方|R2 赤炉林缘 / B1—B3|点焰啄：单足落点点燃标定小范围|FD05 / W|保留单足、蓝红绒羽与白喙|单腿环、背披、翼根小甲|\n|PET14 重明鸟|R2 晨光药府 / B1—B3|破妄鸣：解除一次幻影干扰，显示真实攻击前兆|FD07 / A|圆眼双重虹膜、暖黄短绒|眼侧饰、胸绶、轻羽帽|\n|PET15 青鸾|R1 古林巢 / B1—B2|回风翼：短护风抵消一次可推开的远程攻击|FD02 / W|青色冠绒、扇尾|轻绸胸披、尾穗、青羽鞍|\n|PET16 鲲鹏|R6 空衡水天界 / B3—B4|水空转势：在合法环境转换鱼/鸟形，长冷却|FD03 / K|水态小鲸团、空态圆翼鸟，两态同一花纹|水态背带、鸟态翼根甲、统一鞍徽|\n|PET17 天马|R0 盆地边缘稀有幼裔 / B0—B1|踏风跃：载骑短跳和落地稳身|FD02 / C|短腿小马、软云鬃|额带、彩鞍、鬃辫、腿套|\n|PET18 天禄|R1 灵石坡 / B1—B2|灵嗅：提示附近已加载灵石线索，不自动采矿|FD04 / C|圆鼻短翼、玉纹角|护额、铜铃、灵纹鞍毯|\n|PET19 辟邪|R2 镜渊外缘 / B1—B3|镇邪爪：削弱一次异常护甲，非对所有敌人增伤|FD01 / C|浓眉短吻、双角小翼|护颈、对角穗、深色披甲|\n|PET20 狻猊|R2 火岩寺遗址 / B1—B3|烟障息：可躲避的烟幕，助撤退但不凭空隐身|FD05 / G|卷鬃狮团、粗短爪|鬃边饰、香纹披肩|\n|PET21 睚眦|R3 断刃遗府 / B2—B3|断锋咬：对已破势目标追加一次短连击|FD01 / G|小龙首狼身、背部短刃鳞|刃纹护脊、颈带、爪套|\n|PET22 饕餮|R4 废炉深殿 / B3—B4|噬灵口：有限抽取敌方技能残能，不能无限吃物品变强|FD04 / G|宽嘴圆脸、收拢角和短腿|护颌、兽纹围兜、背甲|\n|PET23 穷奇|R3 雷原前哨 / B2—B3|翼虎横击：短翼斩与侧向扑击|FD01 / W|虎形绒团配小翼|翼根轻甲、尾带、豹纹鞍|\n|PET24 梼杌|R3 远古密林 / B2—B3|顽岩背：硬直抵抗后短时虚弱，防守型|FD01 / G|大头厚毛、短獠牙|软额甲、毛边披毯|\n|PET25 混沌|R5 界隙回声 / B3—B4|混元缓冲：把一次部分伤害延后，不消除总伤害|FD08 / C|无锐角绒球、保留耳/肢轮廓作游戏改编|星纹围巾、铃带、软背垫|\n|PET26 夫诸|R1 水源林地 / B0—B2|润泽步：减轻热区负面并形成短恢复窗口|FD02 / G|四角幼鹿、蹄边水纹|角套、花纹胸披、鹿铃|\n|PET27 当康|R0 盆地药圃/保底蛋 / B0—B1|拱土震：小范围破势，提示成熟草但不代收|FD02 / G|短牙小猪、圆鼻和叶纹背|草纹围兜、背巾、耳饰|\n|PET28 驺吾|R1 古林石道 / B1—B2|长尾掠：横扫牵制后快速回主人侧面|FD01 / G|大尾绒兽、五色条纹|条纹披肩、尾箍、轻鞍毯|\n|PET29 陆吾|R4 天穹旧山门 / B3—B4|守山势：局部减速阵，离开即失效|FD01 / G|九尾虎型幼守兽，兽面化原创|山纹护肩、各尾识别穗|\n|PET30 开明兽|R4 镜门禁地 / B3—B4|多目警戒：提示侧后威胁，多个首部不重复九次伤害|FD01 / G|主首加八个小灵首轮廓，保留多首特征|分区颈环、门纹胸甲|\n|PET31 帝江|R5 界门异象 / B3—B4|四翼移阵：短位移辅助，不能传送越过未加载门|FD08 / C|圆身六足四翼、无面形象以肢体表达情绪|环身绶带、翼根环、背垫|\n|PET32 精卫|R0 崖岸/保底蛋 / B0—B1|衔石点击：轻投石打断微小目标，不能搬山|FD07 / A|小喙圆鸟、足部彩环|小羽帽、足环、迷你披风|\n|PET33 乘黄|R2 金砂草原 / B1—B3|引风驰：地面护送加速窗口，仍受载重|FD02 / C|狐形幼兽、背角保留|背角护套、胸带、曲线鞍|\n\n## 4. 血脉与收服配置如何落地\n\n各物种使用第 15 文档的幼生/成长/成熟/古兽四档喂养门槛；B3 以上再需完成一项该物种天赋试炼，B4 以上必须取得对应栖地传承知识。不能给每种填一套看似复杂、实际不可达的随机好感数。\n\n饮食偏好决定每次有效喂食是否全额；非偏好但可食饲料只维护饱食，不计专属收服次数，界面提前说明。FD08 等高级食物不会出现在新手保底蛋的必需喂养项。孵化后所有物种可吃经医师配好的同阶基础口粮，偏好食物用于更好的照料，不强迫每天找到稀有材料。\n\n青龙、朱雀等高阶谱系没有固定世界坐标；刷新从本区合法巢/蛋/洞府奖励候选生成，33 种不同时在地图上常驻。重复同物种仍有外观基因、性格和名字差异，不再新增 PET34 来表示换皮。\n\n普通合法幼裔血脉候选权重B0/B1/B2/B3/B4为600/250/100/40/10，先按表中物种血脉范围过滤再归一化；只定义已选中该物种后的条件分布，不宣称新手区域有4%青龙蛋。B5/B6不进普通池，来自进化/独特传承。规则版本和生成结果随蛋/野生实例保存，孵化照料不重抽。\n\n## 5. 3D 差异底线\n\n玄武保留龟蛇双结构，九尾狐/陆吾尾部数量有清晰阶段标识，毕方保留单足，帝江保留六足四翼，开明兽保留多首轮廓，鲲鹏提供两套有对应花纹的合法形态。不能为了复用四足骨架抹掉标志特征。\n\n33 种各需普通体、迷你体、进化差异和服装挂点。允许共享材质/骨架家族，不能用同一狮子缩放改名完成一整张表。具体预算、动画、图片/视频版本规则在第 17 文档；本目录仅定义内容，不声称已生成33套资产。\n","html":"\u003ch1>D3-16 · 33 种神兽谱系图鉴\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-16-v001.svg\" alt=\"33谱系，各有身份\">\u003c/p>\u003cp>\u003cem>图解：六种神宠异格仍属于原33谱系，不另增常见物种。\u003c/em>\u003c/p>\u003cp>2026-09-12；游戏原创改编目录，不等于全部出自同一古籍。ID 为 PET01—PET33，身份与普通怪物 M00—M29 分开。规则见 \u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">成长收服\u003c/a>、\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">飞行与3D\u003c/a>。\u003c/p>\u003ch2>1. 神话参考与原创边界\u003c/h2>\u003cp>四方神兽的传统方位意象参考 \u003ca href=\"https://www.dpm.org.cn/collection/sculpture/233921.html\">故宫博物院《朱雀纹砖》\u003c/a>；凤凰、九尾狐的形象参考 \u003ca href=\"https://zh.wikisource.org/zh-hans/山海經/南山經\">《山海经·南山经》原文\u003c/a>，毕方、帝江等参考 \u003ca href=\"https://zh.wikisource.org/zh-hans/西山經\">《山海经·西山经》\u003c/a>；鲲化鹏的母题参考 \u003ca href=\"https://ctext.org/zhuangzi/enjoyment-in-untroubled-ease\">《庄子·逍遥游》\u003c/a>。只取名称和形态灵感，不复制现代影视/游戏的具体造型。\u003c/p>\u003cp>其余名目按中国传统神话/瑞兽综合改编。天禄/辟邪等存在意象重叠，本作将其设计为不同玩法支系，不主张古籍统一记有33种互不重叠物种。凶兽谱系养成友善伙伴、陆吾/开明兽等的兽型化、所有迷你态和服装均为本作原创，不把游戏技能写成原典记载。\u003c/p>\u003cp>朱雀偏火域进攻，凤凰偏恢复与回护；麒麟偏护佑，白泽偏感知，四凶也各有独立破势/控制定位。各有玩法而不是同一只鸟或四足兽换颜色。\u003c/p>\u003ch2>2. 食物和取得说明\u003c/h2>\u003cp>偏好食物：FD01 鲜肉羹（净化肉×2、药草×1）；FD02 灵果糕（灵果×2、谷粉×1）；FD03 鱼藻团（鱼肉×2、水藻×1）；FD04 岩髓饼（兽用可消化矿髓×1、谷粉×2）；FD05 炎露丸（火性草×2、净息露×1）；FD06 雷芽糍（雷芽×2、谷粉×1）；FD07 月露蜜（花蜜×2、月露×1）；FD08 空灵酪（界露×1、灵乳×2）。饲料层级与目标境界匹配，原料由普通采集/商人供应；血脉觉醒用的稀有精华不等同日常口粮。\u003c/p>\u003cp>表中“首遇”指最早合理生成野生个体或合法蛋/线索的地区境界，非每个角色到点必得；B 是常规可遇幼裔的血脉范围，B5/B6 仅独特传承/进化。稀有高血脉蛋不进入新手保底。\u003c/p>\u003cp>飞行码：G 地面；S 水陆；A 小型灵鸟可飞但不载人；W 载人羽翼；C 天生腾云型四足；L 龙形御空；K 水空双形。具体初飞、载人门槛与高度在第 17 文档，同码仍有种族限制。\u003c/p>\u003ch2>3. 全部33种：战斗、骑乘、迷你与服装\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID / 神兽\u003c/th>\u003cth>首遇 / 幼裔血脉\u003c/th>\u003cth>定位与专属天赋\u003c/th>\u003cth>食物 / 移动\u003c/th>\u003cth>迷你识别造型\u003c/th>\u003cth>定制服装方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>PET01 青龙\u003c/td>\u003ctd>R4 雷原，罕见蛋线索 / B3—B4\u003c/td>\u003ctd>雷木龙息：短直线破甲，给主人一个协同标记\u003c/td>\u003ctd>FD06 / L\u003c/td>\u003ctd>盘成小圈、保留双角和青鬃\u003c/td>\u003ctd>分节背甲、角穗、云纹鞍毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET02 朱雀\u003c/td>\u003ctd>R3 赤炉秘府 / B3—B4\u003c/td>\u003ctd>灼羽火域：限制敌人路线，友方无持续火伤\u003c/td>\u003ctd>FD05 / W\u003c/td>\u003ctd>圆头红绒、短三焰尾\u003c/td>\u003ctd>翼根护片、胸绶、火纹飞鞍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET03 白虎\u003c/td>\u003ctd>R2 山脉猎场 / B2—B3\u003c/td>\u003ctd>裂金扑：明确前摇的破势扑击\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>圆耳白爪、额纹不可全遮\u003c/td>\u003ctd>虎纹护肩、颈围、轻装鞍毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET04 玄武\u003c/td>\u003ctd>R2 雾泽深处 / B2—B3\u003c/td>\u003ctd>龟蛇护阵：有限正面护盾，蛇首协同牵制\u003c/td>\u003ctd>FD03 / S\u003c/td>\u003ctd>小龟圆壳配独立小蛇尾，双头都可互动\u003c/td>\u003ctd>壳纹盖片、护缘、蛇颈饰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET05 凤凰\u003c/td>\u003ctd>R4 天穹药府 / B3—B4\u003c/td>\u003ctd>回护羽：救治濒危队友一次，长冷却，不无限复活\u003c/td>\u003ctd>FD07 / W\u003c/td>\u003ctd>蓬松金红冠羽、短彩尾\u003c/td>\u003ctd>羽冠、胸披、渐变尾带\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET06 麒麟\u003c/td>\u003ctd>R3 镜渊传承 / B2—B4\u003c/td>\u003ctd>瑞泽踏：短时净化一层可解负面并护主\u003c/td>\u003ctd>FD02 / C\u003c/td>\u003ctd>小鹿身、卷鬃、单独鳞片高光\u003c/td>\u003ctd>胸甲、蹄环、锦纹鞍毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET07 应龙\u003c/td>\u003ctd>R5 界隙遗巢 / B3—B4\u003c/td>\u003ctd>风翼截击：俯冲截路，收招需拉升空间\u003c/td>\u003ctd>FD03 / L\u003c/td>\u003ctd>短鼻双翼、蓝金背脊\u003c/td>\u003ctd>翼根甲、背鞍、角饰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET08 烛龙\u003c/td>\u003ctd>R6 空衡残府 / B4\u003c/td>\u003ctd>昼晦息：短时改变局部可见度，敌我提示一致\u003c/td>\u003ctd>FD08 / L\u003c/td>\u003ctd>长条幼龙、柔和双瞳、无刺眼全屏光\u003c/td>\u003ctd>颈节饰、星纹护脊、悬浮鞍环\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET09 九尾狐\u003c/td>\u003ctd>R0 旧修士居/保底蛋 / B0—B2\u003c/td>\u003ctd>幻步诱影：制造可识破诱饵，帮助脱战\u003c/td>\u003ctd>FD02 / G\u003c/td>\u003ctd>大耳绒团；尾数随血脉显现，迷你保持识别\u003c/td>\u003ctd>围巾、耳坠、尾根丝结\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET10 白泽\u003c/td>\u003ctd>R2 药府遗室 / B1—B3\u003c/td>\u003ctd>识妖眸：标记已可观察弱点，不能透视全部世界\u003c/td>\u003ctd>FD07 / G\u003c/td>\u003ctd>圆角白绒、眉心纹\u003c/td>\u003ctd>学士披肩、角环、图鉴挎饰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET11 貔貅\u003c/td>\u003ctd>R2 陨炉洞 / B1—B3\u003c/td>\u003ctd>吞煞护：吸收一次可拦截投射并进入冷却\u003c/td>\u003ctd>FD04 / G\u003c/td>\u003ctd>胖爪短吻、金纹腹\u003c/td>\u003ctd>兽面胸甲、铃铛、铜纹背饰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET12 獬豸\u003c/td>\u003ctd>R1 药谷边界 / B1—B2\u003c/td>\u003ctd>定势角：针对正在攻击目标的打断冲撞\u003c/td>\u003ctd>FD02 / G\u003c/td>\u003ctd>独角额、软蹄短腿\u003c/td>\u003ctd>独角套环、裁纹披毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET13 毕方\u003c/td>\u003ctd>R2 赤炉林缘 / B1—B3\u003c/td>\u003ctd>点焰啄：单足落点点燃标定小范围\u003c/td>\u003ctd>FD05 / W\u003c/td>\u003ctd>保留单足、蓝红绒羽与白喙\u003c/td>\u003ctd>单腿环、背披、翼根小甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET14 重明鸟\u003c/td>\u003ctd>R2 晨光药府 / B1—B3\u003c/td>\u003ctd>破妄鸣：解除一次幻影干扰，显示真实攻击前兆\u003c/td>\u003ctd>FD07 / A\u003c/td>\u003ctd>圆眼双重虹膜、暖黄短绒\u003c/td>\u003ctd>眼侧饰、胸绶、轻羽帽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET15 青鸾\u003c/td>\u003ctd>R1 古林巢 / B1—B2\u003c/td>\u003ctd>回风翼：短护风抵消一次可推开的远程攻击\u003c/td>\u003ctd>FD02 / W\u003c/td>\u003ctd>青色冠绒、扇尾\u003c/td>\u003ctd>轻绸胸披、尾穗、青羽鞍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET16 鲲鹏\u003c/td>\u003ctd>R6 空衡水天界 / B3—B4\u003c/td>\u003ctd>水空转势：在合法环境转换鱼/鸟形，长冷却\u003c/td>\u003ctd>FD03 / K\u003c/td>\u003ctd>水态小鲸团、空态圆翼鸟，两态同一花纹\u003c/td>\u003ctd>水态背带、鸟态翼根甲、统一鞍徽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET17 天马\u003c/td>\u003ctd>R0 盆地边缘稀有幼裔 / B0—B1\u003c/td>\u003ctd>踏风跃：载骑短跳和落地稳身\u003c/td>\u003ctd>FD02 / C\u003c/td>\u003ctd>短腿小马、软云鬃\u003c/td>\u003ctd>额带、彩鞍、鬃辫、腿套\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET18 天禄\u003c/td>\u003ctd>R1 灵石坡 / B1—B2\u003c/td>\u003ctd>灵嗅：提示附近已加载灵石线索，不自动采矿\u003c/td>\u003ctd>FD04 / C\u003c/td>\u003ctd>圆鼻短翼、玉纹角\u003c/td>\u003ctd>护额、铜铃、灵纹鞍毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET19 辟邪\u003c/td>\u003ctd>R2 镜渊外缘 / B1—B3\u003c/td>\u003ctd>镇邪爪：削弱一次异常护甲，非对所有敌人增伤\u003c/td>\u003ctd>FD01 / C\u003c/td>\u003ctd>浓眉短吻、双角小翼\u003c/td>\u003ctd>护颈、对角穗、深色披甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET20 狻猊\u003c/td>\u003ctd>R2 火岩寺遗址 / B1—B3\u003c/td>\u003ctd>烟障息：可躲避的烟幕，助撤退但不凭空隐身\u003c/td>\u003ctd>FD05 / G\u003c/td>\u003ctd>卷鬃狮团、粗短爪\u003c/td>\u003ctd>鬃边饰、香纹披肩\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET21 睚眦\u003c/td>\u003ctd>R3 断刃遗府 / B2—B3\u003c/td>\u003ctd>断锋咬：对已破势目标追加一次短连击\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>小龙首狼身、背部短刃鳞\u003c/td>\u003ctd>刃纹护脊、颈带、爪套\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET22 饕餮\u003c/td>\u003ctd>R4 废炉深殿 / B3—B4\u003c/td>\u003ctd>噬灵口：有限抽取敌方技能残能，不能无限吃物品变强\u003c/td>\u003ctd>FD04 / G\u003c/td>\u003ctd>宽嘴圆脸、收拢角和短腿\u003c/td>\u003ctd>护颌、兽纹围兜、背甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET23 穷奇\u003c/td>\u003ctd>R3 雷原前哨 / B2—B3\u003c/td>\u003ctd>翼虎横击：短翼斩与侧向扑击\u003c/td>\u003ctd>FD01 / W\u003c/td>\u003ctd>虎形绒团配小翼\u003c/td>\u003ctd>翼根轻甲、尾带、豹纹鞍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET24 梼杌\u003c/td>\u003ctd>R3 远古密林 / B2—B3\u003c/td>\u003ctd>顽岩背：硬直抵抗后短时虚弱，防守型\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>大头厚毛、短獠牙\u003c/td>\u003ctd>软额甲、毛边披毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET25 混沌\u003c/td>\u003ctd>R5 界隙回声 / B3—B4\u003c/td>\u003ctd>混元缓冲：把一次部分伤害延后，不消除总伤害\u003c/td>\u003ctd>FD08 / C\u003c/td>\u003ctd>无锐角绒球、保留耳/肢轮廓作游戏改编\u003c/td>\u003ctd>星纹围巾、铃带、软背垫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET26 夫诸\u003c/td>\u003ctd>R1 水源林地 / B0—B2\u003c/td>\u003ctd>润泽步：减轻热区负面并形成短恢复窗口\u003c/td>\u003ctd>FD02 / G\u003c/td>\u003ctd>四角幼鹿、蹄边水纹\u003c/td>\u003ctd>角套、花纹胸披、鹿铃\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET27 当康\u003c/td>\u003ctd>R0 盆地药圃/保底蛋 / B0—B1\u003c/td>\u003ctd>拱土震：小范围破势，提示成熟草但不代收\u003c/td>\u003ctd>FD02 / G\u003c/td>\u003ctd>短牙小猪、圆鼻和叶纹背\u003c/td>\u003ctd>草纹围兜、背巾、耳饰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET28 驺吾\u003c/td>\u003ctd>R1 古林石道 / B1—B2\u003c/td>\u003ctd>长尾掠：横扫牵制后快速回主人侧面\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>大尾绒兽、五色条纹\u003c/td>\u003ctd>条纹披肩、尾箍、轻鞍毯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET29 陆吾\u003c/td>\u003ctd>R4 天穹旧山门 / B3—B4\u003c/td>\u003ctd>守山势：局部减速阵，离开即失效\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>九尾虎型幼守兽，兽面化原创\u003c/td>\u003ctd>山纹护肩、各尾识别穗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET30 开明兽\u003c/td>\u003ctd>R4 镜门禁地 / B3—B4\u003c/td>\u003ctd>多目警戒：提示侧后威胁，多个首部不重复九次伤害\u003c/td>\u003ctd>FD01 / G\u003c/td>\u003ctd>主首加八个小灵首轮廓，保留多首特征\u003c/td>\u003ctd>分区颈环、门纹胸甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET31 帝江\u003c/td>\u003ctd>R5 界门异象 / B3—B4\u003c/td>\u003ctd>四翼移阵：短位移辅助，不能传送越过未加载门\u003c/td>\u003ctd>FD08 / C\u003c/td>\u003ctd>圆身六足四翼、无面形象以肢体表达情绪\u003c/td>\u003ctd>环身绶带、翼根环、背垫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET32 精卫\u003c/td>\u003ctd>R0 崖岸/保底蛋 / B0—B1\u003c/td>\u003ctd>衔石点击：轻投石打断微小目标，不能搬山\u003c/td>\u003ctd>FD07 / A\u003c/td>\u003ctd>小喙圆鸟、足部彩环\u003c/td>\u003ctd>小羽帽、足环、迷你披风\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET33 乘黄\u003c/td>\u003ctd>R2 金砂草原 / B1—B3\u003c/td>\u003ctd>引风驰：地面护送加速窗口，仍受载重\u003c/td>\u003ctd>FD02 / C\u003c/td>\u003ctd>狐形幼兽、背角保留\u003c/td>\u003ctd>背角护套、胸带、曲线鞍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>4. 血脉与收服配置如何落地\u003c/h2>\u003cp>各物种使用第 15 文档的幼生/成长/成熟/古兽四档喂养门槛；B3 以上再需完成一项该物种天赋试炼，B4 以上必须取得对应栖地传承知识。不能给每种填一套看似复杂、实际不可达的随机好感数。\u003c/p>\u003cp>饮食偏好决定每次有效喂食是否全额；非偏好但可食饲料只维护饱食，不计专属收服次数，界面提前说明。FD08 等高级食物不会出现在新手保底蛋的必需喂养项。孵化后所有物种可吃经医师配好的同阶基础口粮，偏好食物用于更好的照料，不强迫每天找到稀有材料。\u003c/p>\u003cp>青龙、朱雀等高阶谱系没有固定世界坐标；刷新从本区合法巢/蛋/洞府奖励候选生成，33 种不同时在地图上常驻。重复同物种仍有外观基因、性格和名字差异，不再新增 PET34 来表示换皮。\u003c/p>\u003cp>普通合法幼裔血脉候选权重B0/B1/B2/B3/B4为600/250/100/40/10，先按表中物种血脉范围过滤再归一化；只定义已选中该物种后的条件分布，不宣称新手区域有4%青龙蛋。B5/B6不进普通池，来自进化/独特传承。规则版本和生成结果随蛋/野生实例保存，孵化照料不重抽。\u003c/p>\u003ch2>5. 3D 差异底线\u003c/h2>\u003cp>玄武保留龟蛇双结构，九尾狐/陆吾尾部数量有清晰阶段标识，毕方保留单足，帝江保留六足四翼，开明兽保留多首轮廓，鲲鹏提供两套有对应花纹的合法形态。不能为了复用四足骨架抹掉标志特征。\u003c/p>\u003cp>33 种各需普通体、迷你体、进化差异和服装挂点。允许共享材质/骨架家族，不能用同一狮子缩放改名完成一整张表。具体预算、动画、图片/视频版本规则在第 17 文档；本目录仅定义内容，不声称已生成33套资产。\u003c/p>"},{"file":"17_PET_3D_FLIGHT_AND_ASSETS.md","title":"D3-17 · 骑宠飞行、空战、3D 与媒体资产维护","text":"# D3-17 · 骑宠飞行、空战、3D 与媒体资产维护\n\n\u003c!-- illustrated-overview:start -->\n![骑宠飞行的四道检查](media/diagram-17-v001.svg)\n\n*图解：宠物能进星空，不意味着后天骑手可以呼吸真空。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；拟实现。依赖 [宠物成长](15_PET_PROGRESSION_AND_BOND.md)、[33种目录](16_PET_BESTIARY_33.md)、[人物移动](13_MOVEMENT_AND_PURSUIT.md)、[身份装扮](18_NAMES_PET_STYLE_AND_IDENTITY.md)。\n\n## 1. 对低境飞行规则的补充\n\n宠物两主动与天赋明细见[21](21_PET_SKILLS_33.md)，每招五阶专属轮廓、动画事件与双视角命中验收见[22](22_COMBAT_3D_AND_ANIMATION.md)。现有不可覆盖版本、源文件、真实预览与独立备份要求同样覆盖武技、宗门建筑和阵法资产；设计表不是已生成资产清单。\n\nR0—R3 本人仍不能肉身飞行，但现在可使用 **飞行器或合格飞行坐骑**。R4 御器、R5 肉身御空仍有独立价值；坐骑不是把主人升级到宠物境界。主人宇航服、毒区防护、真空权限继续检验，宠物会飞不等于骑手能呼吸真空。\n\n宠物能独飞与能载人是两个解锁。需成长阶段达到成长期、体型和鞍具适配、已学 PM04 或本能载飞、宠物灵力/精力足够，骑手完成 N26 教学。成熟度、血脉、境界、负重都在界面显示，不只看宠物有没有翅膀。\n\n## 2. 七类移动/飞行档案\n\n|码|适用形态|最低独飞/运动条件|载人条件|额外限制|\n|---|---|---|---|---|\n|G|普通四足地面|从幼生可跟随|大体型成长期＋鞍具，仅地面|没有飞行解锁，不把所有兽都改成飞兽|\n|S|玄武等水陆|幼生游水与陆行|成长期＋合格水陆鞍|潜水时检查骑手供氧，首片不自动深潜|\n|A|精卫、重明鸟小型灵鸟|R0 三级幼生成型，独飞最高20 m起|不可载人|高阶自身可依能力表更高飞，但小体型仍非人座|\n|W|朱雀、凤凰、青鸾、毕方、穷奇|R0 六级且翼部成型后独飞|宠物至少 R1 一级＋成长期＋飞鞍|翼展/起飞跑道/单足落地按种族验证|\n|C|腾云四足/帝江等|天马 R0 六级；其他本类至少 R2 一级|同独飞门槛＋成长期＋鞍具|天马是低境载飞样板；小型迷你态永不载人|\n|L|青龙、应龙、烛龙|宠物 R2 一级，龙息维持升力|R2 成长期＋龙鞍|应龙翼部与无翼龙不能同用一套起飞动画|\n|K|鲲鹏水空双形|R3 后解锁鹏态与水空转换|成长期＋两态共享的合法鞍座|不能在狭窄洞内变巨鹏；空中转水态须有合法水域与降落过程|\n\n能力表是最低门槛，不改变各物种最早取得地区；例如高阶青龙不会只因表有 R2 就固定出现在新手区。\n\n## 3. 境界高度、速度与骑手上限\n\n|宠物境界|具飞行档案时独飞最高 AGL|基础巡航 m/s|默认有效载重 kg|\n|---|---:|---:|---:|\n|R0|20 m|18|90（仅合格天马等）|\n|R1|60 m|28|140|\n|R2|120 m|42|220|\n|R3|200 m|65|350|\n|R4|300 m|85|550|\n|R5|800 m|120|850|\n|R6|1,500 m|180|1,200|\n|R7|3,000 m|280|1,800|\n|R8|地表 3,000 m；真空另验|地表350；星空1,000|2,500|\n|R9|地表 3,000 m；真空另验|地表450；星空2,500|4,000|\n\n地表载飞高度 = 宠物上限、骑手资格上限、场景上限三者最小值。骑手 R0—R3 上限200 m，R4 300 m，R5 800 m，R6 1,500 m，R7+ 3,000 m；只有骑手 R8+ 和宠物 R8+ 同时具备护域才能载骑进真空。星空战斗档参照移动文档渐进减速，不直接以巡航速度撞进近战。\n\n载重包含骑手基准75 kg＋身上有效负重＋鞍具（轻飞鞍3 kg起）＋宠物驮架货物；PET17 的R0基础90 kg起点针对轻装骑手，超载明确不能起飞。体型系数可在物种配置中0.8—1.5，必须写明最终额定载重。灵宠本身身体质量已算在其升力设计里，不重复加入货重。\n\n载重比≤50%无额外惩罚，50%—100%最大速度降到80%、爬升降到65%、消耗升至135%；超过100%拒绝起飞，空中因拾物/装备变化超载则安全降落。不得通过迷你化主人背包或塞活宠进袋减重。\n\n## 4. 灵力与紧急下降\n\n宠物精力100，非飞行脱战可恢复；载飞消耗精力1点/秒及宠物最大灵力1%/秒，急加速再耗0.5%/秒。低境飞行不是无限代步，基础满精力约100秒；地面休息/营养恢复，不能用同一颗食物无限刷新飞行计时。高境效率可由功法改善，气耗最低保留基础65%。\n\n余量20%预警，10%提示落点，5%启用护降储备、停止攻击与加速。最后5%不能被普通技能抢走；飞行前依据路线高度检验能否有可达应急落点，复杂空间不允许凭储备“永远滑翔”。失控/重伤时先滑翔/云托下降，骑手仍附着；地面后才能收回宠物。彻底失败用既有救援流程，不把宠物永久删掉。\n\n宠物死亡/受伤和人物下坐骑是两套状态，落地切换须清除骑乘环视/身体方向残留；必须回归现有“下车后无需Alt即可转向”测试。人物已会御空时可主动安全离鞍转御空，需本人真气；R0空中不能直接跳下就获得同样能力。\n\n## 5. 地面跟随与空中战斗\n\n地面命令沿 PET 感知/路径状态运行，跟随距主人约1.5—3 m，避开准星、门口和交互点。跟随落后时先加速/绕路，不因主人奔袭就直接传送到前方；远离且脱战、不可见时才允许有提示的契纹重聚，不能用它在战斗中绕墙。\n\n骑乘操作：W/S推进/减速，A/D侧向转向，鼠标观察；按住Alt独立环视，V切第一/第三人称；空格爬升、Ctrl下降，F在停稳落地时下骑。步行空间键原行为不变，明确按上下文切换。指令键建议 H 打开宠物命令轮盘，长按/快捷键分配在实现时做冲突检查。\n\n骑乘空战左键为宠物基础攻击，右键锁定可见目标/瞄准，1/2为宠物主动技能；默认禁止骑手同时普通攻击再叠宠物普攻。高阶“合击章”只在短协同窗口允许人物一次合法远程技能，不是两套DPS常驻相加。\n\n空战不是原地互扣血：接近→预告→俯冲/吐息→错身→拉升→调整方位；翼/角/口的命中体积按真实轨迹扫掠。不能在贴墙时强行转180度，转弯半径和制动有体型配置；吐息有射程、视线遮挡和每目标每段命中上限。小型 A 类空中助战可攻击地面目标，但不载人，地面怪的反制能力必须可读。\n\n## 6. 第一/第三人称与迷你形态\n\n第一人称锚点来自骑手鞍座头部，不是宠物头顶随意悬浮；手扶缰/鞍结构、腿部跨坐、宠物颈背前景都是真实同模型。俯冲不会让镜头跟着翻滚到晕眩，世界姿态与玩家观察分离；可设置有限/关闭镜头震动。第三人称扫掠考虑翼展、尾、地形，必要时拉高/收近，不能穿宠物胸腔。\n\n每只宠物的完整态、骑乘态、迷你态共享 petId、外观基因、装备和纹章。迷你专用网格/比例需要保留角、羽、尾等标识，衣服有对应简化模型；不得把全尺寸鞍具直接缩小穿进脸里。战斗态缩回迷你态须脱战且无骑手/货架占用；迷你展开战斗态按15可在接敌时进行，驮架货物先卸下，否则明确拒绝迷你化；不能靠变小降低货物实际质量。\n\n## 7. 图像、视频、3D 的必交付项\n\n每种 PET 必须有：\n\n1. 普通形态正/侧/背/3/4概念图、成年/成长期比例、迷你设计、至少三套服装分件图。\n2. 骨架/挂点图、材质与色域说明、骑乘鞍座图；不能骑乘的明确标记“不制作人座”。\n3. `.blend` 源、`.glb` 运行资产、贴图、动画事件、碰撞/载重/翼展数据。\n4. 真实3D八角度转台视频、迷你互动视频、步行/攻击连续视频；飞行种类还需起降/骑乘/空战视频。\n5. 每次进化/服装变体的来源链、哈希、版本、测试截图和未解决问题。\n\n概念视频可用于动势参考，但必须标记 concept，不替代实际游戏录像。生成图、示意图、Blender渲染、真实游戏截图、实际运行视频分别标类型，禁止把生成视频当成已能玩的空战演示。\n\n## 8. 不覆盖、不遗失的资产维护规则\n\n建议目录：\n\n```text\ndocs/pet-assets/PET09/v001/\n  concept/        # 原始生成图、参考出处、提示词\n  reviews/        # 对照、批注、决定采用/拒绝理由\n  video/          # 概念和实机录像分别命名\n  manifest.json   # 文件清单、哈希、类型、来源和依赖\nplayable/assets/pets/PET09/v001/\n  source/         # blend与原始贴图\n  runtime/        # glb、压缩贴图、动画配置\n  manifest.json\n```\n\n这些是目标路径，尚未制作时不创建假模型或占位空视频。每次新结果进入新版本 v002…，保留 v001；当前采用版本通过单独 registry 指针选择，不覆盖原始文件。宠物注册表33条允许 `planned` 状态，无文件时不得标 ready。\n\n下载工具/插件产物后，先复制到稳定项目路径、确认可打开、计算 SHA-256、记录来源任务/提示词/积分消耗与生成时间，再引用。临时目录、远程任务链接、聊天图片都不能作为唯一保存地址；视频要同时保留原文件与轻量预览版。禁止将密钥写进 manifest 或提示词归档。\n\n每个 manifest 字段至少含 assetId、petSpeciesId、version、kind、relativePath、bytes、sha256、sourceAssetIds、sourceMethod、license/sourceUrl、createdAt、reviewStatus、runtimeCompatibleVersion。模型引用贴图、骑具引用骨架、视频引用确切运行构建，避免“有图却不知对应哪版模型”。\n\n阶段完成前验证文件存在、哈希匹配、解码/导入成功及引用完整。原图、源模型、旧版视频原则上保留；空间不足先报告体积、列出可再生缓存，再按已批准清理范围处理，不自动删除唯一源文件。Git只保存小型源码/清单；大资产未来选择Git LFS或有版本的对象存储，不能把“在仓库目录”误认为已备份。\n\n备份目标为一份工作副本＋一份独立位置副本，备份后需按哈希校验并抽样恢复。没有已配置备份目的地时明确写 `backupStatus:not_configured`，不能承诺绝不会丢。当前媒体盘点只证明当时文件存在，不是独立备份；用户已有图片/视频/模型不得因本轮新增宠物而替换或清理。\n\n## 9. 骨架、服装和性能预算\n\n基础家族：四足猫科、鹿马科、猪/厚躯、鸟翼、游龙、龟蛇双体、球形多肢、鲲鹏双形。毕方单足、帝江六足四翼、开明多首等需专用扩展。成年普通体30k—60k三角、迷你8k—18k、骑乘重点体60k—100k为候选上限；最多3个基础材质＋2个服装材质，普通2K贴图，远处LOD与1K降级。\n\n每种最低地面动画：待机、走/跑、左右转、攻击、生效/收招、受击、倒地、恢复、喂食、呼名、亲昵、睡眠、变形。载飞另加起飞/巡航/转弯/爬升/下降/急停/落地/疲劳滑翔；骑手有上/下骑、稳定坐姿、缰绳跟随和空战施放。\n\n宠物与敌人共用全场预算，但为一个战斗宠保留资源，不因敌人达到上限消失；多人阶段默认仅附近队友显示完整战宠，远处同模式模型做LOD简化，不能将战斗模式改成迷你跟随模式，不加载所有33种全分辨率。不得为性能无提示隐藏具有伤害判定的敌我实体。\n\n## 10. 制作顺序与证据\n\nPA0：PET09 概念→完整/迷你模型→命名/喂食/跟随视频。PA1：地面战斗与倒地恢复。PA2：PET17 载重/鞍座/后天载飞，验证第一/第三视角。PA3：PET13 翼展/单足/俯冲空战。PA4：逐家族扩展33种，边做边归档，不能一口气花积分生成33个未验证模型。\n\n本轮只设计并盘点已存在媒体，不生成宠物图片/视频/模型，也未配置独立备份。每个PA切片都必须更新资产清单和用户可复验步骤。\n\n本轮实际记录：[现有资产盘点 v001](../pet-assets/EXISTING_ASSETS_20260912_v001.json) 共130份、213,423,363字节，包含图像/视频/模型/音频及嵌入资产模块；不表示130份都是宠物资产或已重新验收。对应 [33种宠物注册表](../pet-assets/PET_ASSET_REGISTRY.json) 当前全部 planned、无伪造版本。后续执行 `node tools/inventory-design-assets.cjs` 生成新编号盘点，不覆盖旧快照；注册表已有数据时脚本不覆盖人工登记的宠物版本。\n","html":"\u003ch1>D3-17 · 骑宠飞行、空战、3D 与媒体资产维护\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-17-v001.svg\" alt=\"骑宠飞行的四道检查\">\u003c/p>\u003cp>\u003cem>图解：宠物能进星空，不意味着后天骑手可以呼吸真空。\u003c/em>\u003c/p>\u003cp>2026-09-12；拟实现。依赖 \u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">宠物成长\u003c/a>、\u003ca href=\"#16_PET_BESTIARY_33.md\">33种目录\u003c/a>、\u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">人物移动\u003c/a>、\u003ca href=\"#18_NAMES_PET_STYLE_AND_IDENTITY.md\">身份装扮\u003c/a>。\u003c/p>\u003ch2>1. 对低境飞行规则的补充\u003c/h2>\u003cp>宠物两主动与天赋明细见\u003ca href=\"#21_PET_SKILLS_33.md\">21\u003c/a>，每招五阶专属轮廓、动画事件与双视角命中验收见\u003ca href=\"#22_COMBAT_3D_AND_ANIMATION.md\">22\u003c/a>。现有不可覆盖版本、源文件、真实预览与独立备份要求同样覆盖武技、宗门建筑和阵法资产；设计表不是已生成资产清单。\u003c/p>\u003cp>R0—R3 本人仍不能肉身飞行，但现在可使用 \u003cstrong>飞行器或合格飞行坐骑\u003c/strong>。R4 御器、R5 肉身御空仍有独立价值；坐骑不是把主人升级到宠物境界。主人宇航服、毒区防护、真空权限继续检验，宠物会飞不等于骑手能呼吸真空。\u003c/p>\u003cp>宠物能独飞与能载人是两个解锁。需成长阶段达到成长期、体型和鞍具适配、已学 PM04 或本能载飞、宠物灵力/精力足够，骑手完成 N26 教学。成熟度、血脉、境界、负重都在界面显示，不只看宠物有没有翅膀。\u003c/p>\u003ch2>2. 七类移动/飞行档案\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>码\u003c/th>\u003cth>适用形态\u003c/th>\u003cth>最低独飞/运动条件\u003c/th>\u003cth>载人条件\u003c/th>\u003cth>额外限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>G\u003c/td>\u003ctd>普通四足地面\u003c/td>\u003ctd>从幼生可跟随\u003c/td>\u003ctd>大体型成长期＋鞍具，仅地面\u003c/td>\u003ctd>没有飞行解锁，不把所有兽都改成飞兽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S\u003c/td>\u003ctd>玄武等水陆\u003c/td>\u003ctd>幼生游水与陆行\u003c/td>\u003ctd>成长期＋合格水陆鞍\u003c/td>\u003ctd>潜水时检查骑手供氧，首片不自动深潜\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>精卫、重明鸟小型灵鸟\u003c/td>\u003ctd>R0 三级幼生成型，独飞最高20 m起\u003c/td>\u003ctd>不可载人\u003c/td>\u003ctd>高阶自身可依能力表更高飞，但小体型仍非人座\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W\u003c/td>\u003ctd>朱雀、凤凰、青鸾、毕方、穷奇\u003c/td>\u003ctd>R0 六级且翼部成型后独飞\u003c/td>\u003ctd>宠物至少 R1 一级＋成长期＋飞鞍\u003c/td>\u003ctd>翼展/起飞跑道/单足落地按种族验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C\u003c/td>\u003ctd>腾云四足/帝江等\u003c/td>\u003ctd>天马 R0 六级；其他本类至少 R2 一级\u003c/td>\u003ctd>同独飞门槛＋成长期＋鞍具\u003c/td>\u003ctd>天马是低境载飞样板；小型迷你态永不载人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L\u003c/td>\u003ctd>青龙、应龙、烛龙\u003c/td>\u003ctd>宠物 R2 一级，龙息维持升力\u003c/td>\u003ctd>R2 成长期＋龙鞍\u003c/td>\u003ctd>应龙翼部与无翼龙不能同用一套起飞动画\u003c/td>\u003c/tr>\u003ctr>\u003ctd>K\u003c/td>\u003ctd>鲲鹏水空双形\u003c/td>\u003ctd>R3 后解锁鹏态与水空转换\u003c/td>\u003ctd>成长期＋两态共享的合法鞍座\u003c/td>\u003ctd>不能在狭窄洞内变巨鹏；空中转水态须有合法水域与降落过程\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>能力表是最低门槛，不改变各物种最早取得地区；例如高阶青龙不会只因表有 R2 就固定出现在新手区。\u003c/p>\u003ch2>3. 境界高度、速度与骑手上限\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>宠物境界\u003c/th>\u003cth>具飞行档案时独飞最高 AGL\u003c/th>\u003cth>基础巡航 m/s\u003c/th>\u003cth>默认有效载重 kg\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0\u003c/td>\u003ctd>
