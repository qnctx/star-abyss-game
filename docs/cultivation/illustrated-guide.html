 1. 核心体验\n\n**图文阅读：打开[离线图文手册](illustrated-guide.html)**，可搜索正文、切换章节和打印。各章的规则图配合详细表格阅读；新增[26逆天传承](26_HEAVEN_DEFYING_LEGACIES.md)包含双分身/归一、六部功法、六式禁传武技、六件遗兵、六种神宠异格和六种机缘。\n\n人类远征队在裂环星发现可改变生命结构的物质，最初将其制成“进化液”。随着探索深入，幸存者与遗民揭示：科技测量到的能量回路，正是古老文明修行所称的经脉与真气。宇航服、实验舱、轨道器不是突然失效，而逐步成为修炼、炼丹与星际远征的工具。\n\n游戏是单人、实时第三/第一人称动作冒险。主要循环：整备功法与武器 → 选择区域 → 观察、战斗、采集、发现遗迹 → 带材料返回或继续冒险 → NPC 炼丹/锻造 → 提升修为与属性 → 突破境界 → 发现新生态、新人物和新规则。打坐提供稳定修为，探索决定突破资格、材料品质和稀有成长；两者缺一不可。\n\n任务不是唯一入口。遗迹声响、异色植物、怪物迁徙、陨落轨迹、NPC 传闻都能开启发现。主线提供一条有保障的成长路线，支线与机缘扩展解法。路线不固定，但材料产地、怪物生态和突破前置有可解释规律。\n\n## 2. 编号与明确取舍\n\n- 采用最新“共十境界”：后天是第 **0** 境，之后第 **1—9** 境；每境 **1—10** 级，共 100 个角色等级位置。这里的第几境不是“后天一级”的小等级。\n- 0—3 境空中移动可依靠飞行器或合格飞宠；4 境解锁借物御器；5 境才可肉身御空；6 境可跨星传送；8 境可星空飞行；9 境具备有条件毁星能力。骑宠不自动绕过本人防护/真空权限。\n- 小等级靠修为；跨大境界靠满级修为、突破法和明确确认。进化液是突破制剂的统称，高阶 NPC 可称其为丹；不要求每升一级都重复买药。\n- 离线只结算前 72 小时修炼，达到当前大境界上限即停止，不替玩家突破、不自动战斗采集。\n- 自由跨区，不用空气墙要求玩家“等级不足”。低境玩家面对真实强敌，可绕行、逃跑、侦察；被击败会昏迷并被救回安全区。\n- 单人 NPC 市场为本轮范围；玩家间联网交易、拍卖行和联机经济另立项目，不以本地买卖界面冒充已实现。\n- 保留当前探索剧情、载具、扫描和角色资产，后续按迁移文档接入新成长系统，不在文档任务里改动运行数值或用户存档。\n\n## 3. 按模块开发的阅读顺序\n\n|文件|负责回答|\n|---|---|\n|[01 境界、数值与修炼](01_REALMS_AND_CULTIVATION.md)|十境界名字、每境能力、属性差异、挂机、突破|\n|[02 战斗、武器与功法](02_COMBAT_WEAPONS_SKILLS.md)|怎么打、十类武器、技能与真气、陨石锻造|\n|[03 丹方、材料与经济](03_ALCHEMY_MATERIALS_ECONOMY.md)|三十种突破配方、品级、血液/内丹掉率、灵石和交易|\n|[04 世界、区域与探索](04_WORLD_REGIONS_EXPLORATION.md)|足够大的星球、0—5 境地区、高阶星球、飞行和机缘|\n|[05 NPC、交互与任务](05_NPCS_DIALOGUE_TASKS.md)|68名固定NPC、功能、对话框、交易/炼丹/宠物/宗门服务|\n|[06 怪物与 3D 资产](06_MONSTERS_AND_3D.md)|30 类怪物、战斗行为、掉落、原型与高阶 3D 制作规格|\n|[07 实施与验收](07_IMPLEMENTATION_AND_ACCEPTANCE.md)|从第一场战斗到完整远征的切片、数据合同、迁移和测试|\n|[08 世界刷新系统](08_WORLD_DIRECTOR.md)|野怪/材料再生、随机事件、离线资格、空间安全、种子与存档|\n|[09 配置与开发面板](09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md)|刷新配置、可达性校验、概率模拟、调试面板与分阶段接入|\n|[10 储物与负重](10_STORAGE_AND_ENCUMBRANCE.md)|背包、飞行器货舱、袋戒、扩容材料/技能、容量与携重|\n|[11 随机洞府与机缘](11_CAVES_AND_FORTUNES.md)|角色差异、洞府布局、奖励、定居与私人仓储|\n|[12 丹药与后遗症](12_MEDICINES_AND_AFTEREFFECTS.md)|疗伤/回气/续力/爆发丹、共享冷却、治疗与离线疗养|\n|[13 移动与追逐](13_MOVEMENT_AND_PURSUIT.md)|十境速度、奔袭、负重影响、怪物感知/追击/脱战|\n|[14 单机与联网边界](14_OFFLINE_AND_ONLINE_BOUNDARY.md)|世界/角色/实例归属、在线资产、组队洞府与未来迁移|\n|[15 宠物成长与羁绊](15_PET_PROGRESSION_AND_BOND.md)|孵化、喂养收服、七档血脉、十境成长、兽诀、迷你陪伴|\n|[16 神兽33种](16_PET_BESTIARY_33.md)|每种定位、食物、天赋、飞行类型、迷你形态与服装|\n|[17 骑宠空战与资产](17_PET_3D_FLIGHT_AND_ASSETS.md)|高度/载重/灵力、双视角、3D动作、图片视频版本与备份|\n|[18 名字、装扮与身份](18_NAMES_PET_STYLE_AND_IDENTITY.md)|玩家/宠物起名、个体花纹、私人纹章、同名与多人归属|\n|[19 属性与五阶掌握](19_DAMAGE_ATTRIBUTES_AND_MASTERY.md)|先加后乘、术强/灵抗、伤害/盾/治疗、锁定反制和手算示例|\n|[20 人物武技60式](20_PLAYER_MARTIAL_ARTS_60.md)|20武器技、26属性术、14战术身法的系数/门槛/耗能/判定|\n|[21 宠物专属技能](21_PET_SKILLS_33.md)|33种各2主动1天赋、独立宠物属性、空战与AI|\n|[22 战斗3D与动画](22_COMBAT_3D_AND_ANIMATION.md)|每招专属形状与五阶VFX、骨骼/命中/双视角、资产版本验收|\n|[23 宗门与比武](23_SECTS_NPCS_MISSIONS_AND_DUELS.md)|6宗门、12新增NPC、12委托模板、20兑换项与擂台|\n|[24 建宗与阵法](24_SECT_BUILDINGS_AND_FORMATIONS.md)|立宗条件、12建筑、12阵法、真实供能、覆灭与重建|\n|[25 图文阅读路线](25_ILLUSTRATED_READING_GUIDE.md)|按玩法选阅读顺序、图例、媒体来源与离线阅读器|\n|[26 逆天传承与机缘](26_HEAVEN_DEFYING_LEGACIES.md)|一气化三清、超常核心、30项极稀有设计、跨境算例|\n|[27 消耗换代与世界唯一](27_CONSUMPTION_AND_UNIQUE_WORLD.md)|实际消耗才补充、不同新组合、原器流转不复制、20项刷新验收|\n|[28 地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)|8类地图、12人物模板、材料竞争、伏击夺宝、销赃追索与新人补位|\n|[29 十大顶层势力](29_SUPREME_FACTIONS_AND_STORY.md)|一神国二洞天三学府四圣地、领袖等级、20下属门派、关系与六幕故事|\n\n刷新系统留在本游戏项目内，以独立模块和开发入口维护，不另外新建仓库或服务。宗门、建筑、阵法与战斗、库存、境界、任务共用稳定ID和事务存档；未来共享世界需求出现时再拆后端。当前文档包共三十份（本入口＋01—29），配30张规则图与1张三联概念插画。新增27优先覆盖旧的到期换货、掉落自动过期和每角色原器唯一假设。\n\n## 4. 对旧设计的覆盖\n\n本包覆盖 D2 对应条款：取消“不增加人物经验条”、仅两种材料、暂不引入品级、无交易/炼丹的范围限制；新增角色十境界及材料经济。技能的“入门/小成/精通/大成/圆满”保留为**技能熟练阶**，不得再称角色境界。旧身体/装备续航作为科技适应记录保留，转换方案独立迁移，不能与新境界重复乘算。\n\nD2 的事件去重、事务扣料、存档备份、真实 3D 与表现/判定一致原则继续适用。旧文档与 D3 冲突时，以本包对应模块为准；用户新指令优先于本包。第 07 文件的阶段替代旧 M0—M6 排期，但不撤销历史验收证据。\n\n2026-09-12 补充：第 10—14 文件覆盖旧文档尚未定义的容量/钱包、第 01 文件相同基础地速、第 03 文件功能丹即时恢复及固定放置机缘假设。机缘实例按角色随机并保存；共享联网玩法在后续阶段实现，当前仍单机。\n\n宠物当前规则：同时只有一只随行个体，在日常迷你跟随与完整战斗模式之间切换；不是战宠加陪伴宠两只同时出现。宠物补充以第15—18为准：新增33种神话谱系与两名NPC，允许低境载宠飞行；生活宠物只能在灵兽栏/灵栖契内休息，普通储物袋不收活物。资产版本归档与独立备份不能混称，未生成模型仍标 planned。\n\n## 5. 初期可感知的目标\n\n本次19—24覆盖旧伤害公式与宗门未定义部分：五阶名称保留，伤害倍率为1/1.18/1.40/1.68/2，防御常数由20改40，弱点默认25%进入统一增伤桶；宠物数值独立计算。本章当时新增12名宗门NPC至38名；第29再增30名，现共68名。玩法和数值均待实机验证，文档审计不代表60武技、66宠物主动或3D资产已完成。\n\n第一轮可玩目标是一趟 20—30 分钟的远征：与医师领取基础方案，击退掠兽取得血液，避开高阶巢母采药，拾取铁陨，返回炼制一次进化液、锻造一把武器，再用实际增强后的能力挑战营地外精英。全过程可失败、可救援、可保存，收益不依赖低概率内丹。\n\n这不是要求先完成 100 级再验证乐趣。先验证一只敌人是否好打、一种技能是否有用、一次炼丹是否值得，再扩大种类与地图。所有概率、时长、伤害和价格均为首轮可调配置，不能当作已验证的平衡结论。\n","html":"\u003ch1>星渊：从科技远征到星空修真 · D3\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-00-v001.svg\" alt=\"从科技远征到星空修真\">\u003c/p>\u003cp>\u003cem>图解：普通成长有可靠路线；逆天机缘稀少而有真实改变打法的价值。\u003c/em>\u003c/p>\u003cp>2026-09-12。性质：后续开发基准草案；本文档包不代表玩法已经实装。当前版本仍是探索原型，实际完成项查阅 \u003ca href=\"../HTML5_VERIFICATION.md\">验收台账\u003c/a>。\u003c/p>\u003ch2>1. 核心体验\u003c/h2>\u003cp>\u003cstrong>图文阅读：打开\u003ca href=\"illustrated-guide.html\">离线图文手册\u003c/a>\u003c/strong>，可搜索正文、切换章节和打印。各章的规则图配合详细表格阅读；新增\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">26逆天传承\u003c/a>包含双分身/归一、六部功法、六式禁传武技、六件遗兵、六种神宠异格和六种机缘。\u003c/p>\u003cp>人类远征队在裂环星发现可改变生命结构的物质，最初将其制成“进化液”。随着探索深入，幸存者与遗民揭示：科技测量到的能量回路，正是古老文明修行所称的经脉与真气。宇航服、实验舱、轨道器不是突然失效，而逐步成为修炼、炼丹与星际远征的工具。\u003c/p>\u003cp>游戏是单人、实时第三/第一人称动作冒险。主要循环：整备功法与武器 → 选择区域 → 观察、战斗、采集、发现遗迹 → 带材料返回或继续冒险 → NPC 炼丹/锻造 → 提升修为与属性 → 突破境界 → 发现新生态、新人物和新规则。打坐提供稳定修为，探索决定突破资格、材料品质和稀有成长；两者缺一不可。\u003c/p>\u003cp>任务不是唯一入口。遗迹声响、异色植物、怪物迁徙、陨落轨迹、NPC 传闻都能开启发现。主线提供一条有保障的成长路线，支线与机缘扩展解法。路线不固定，但材料产地、怪物生态和突破前置有可解释规律。\u003c/p>\u003ch2>2. 编号与明确取舍\u003c/h2>\u003cul>\u003cli>采用最新“共十境界”：后天是第 \u003cstrong>0\u003c/strong> 境，之后第 \u003cstrong>1—9\u003c/strong> 境；每境 \u003cstrong>1—10\u003c/strong> 级，共 100 个角色等级位置。这里的第几境不是“后天一级”的小等级。\u003c/li>\u003cli>0—3 境空中移动可依靠飞行器或合格飞宠；4 境解锁借物御器；5 境才可肉身御空；6 境可跨星传送；8 境可星空飞行；9 境具备有条件毁星能力。骑宠不自动绕过本人防护/真空权限。\u003c/li>\u003cli>小等级靠修为；跨大境界靠满级修为、突破法和明确确认。进化液是突破制剂的统称，高阶 NPC 可称其为丹；不要求每升一级都重复买药。\u003c/li>\u003cli>离线只结算前 72 小时修炼，达到当前大境界上限即停止，不替玩家突破、不自动战斗采集。\u003c/li>\u003cli>自由跨区，不用空气墙要求玩家“等级不足”。低境玩家面对真实强敌，可绕行、逃跑、侦察；被击败会昏迷并被救回安全区。\u003c/li>\u003cli>单人 NPC 市场为本轮范围；玩家间联网交易、拍卖行和联机经济另立项目，不以本地买卖界面冒充已实现。\u003c/li>\u003cli>保留当前探索剧情、载具、扫描和角色资产，后续按迁移文档接入新成长系统，不在文档任务里改动运行数值或用户存档。\u003c/li>\u003c/ul>\u003ch2>3. 按模块开发的阅读顺序\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>文件\u003c/th>\u003cth>负责回答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">01 境界、数值与修炼\u003c/a>\u003c/td>\u003ctd>十境界名字、每境能力、属性差异、挂机、突破\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#02_COMBAT_WEAPONS_SKILLS.md\">02 战斗、武器与功法\u003c/a>\u003c/td>\u003ctd>怎么打、十类武器、技能与真气、陨石锻造\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">03 丹方、材料与经济\u003c/a>\u003c/td>\u003ctd>三十种突破配方、品级、血液/内丹掉率、灵石和交易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#04_WORLD_REGIONS_EXPLORATION.md\">04 世界、区域与探索\u003c/a>\u003c/td>\u003ctd>足够大的星球、0—5 境地区、高阶星球、飞行和机缘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#05_NPCS_DIALOGUE_TASKS.md\">05 NPC、交互与任务\u003c/a>\u003c/td>\u003ctd>68名固定NPC、功能、对话框、交易/炼丹/宠物/宗门服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#06_MONSTERS_AND_3D.md\">06 怪物与 3D 资产\u003c/a>\u003c/td>\u003ctd>30 类怪物、战斗行为、掉落、原型与高阶 3D 制作规格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#07_IMPLEMENTATION_AND_ACCEPTANCE.md\">07 实施与验收\u003c/a>\u003c/td>\u003ctd>从第一场战斗到完整远征的切片、数据合同、迁移和测试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#08_WORLD_DIRECTOR.md\">08 世界刷新系统\u003c/a>\u003c/td>\u003ctd>野怪/材料再生、随机事件、离线资格、空间安全、种子与存档\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md\">09 配置与开发面板\u003c/a>\u003c/td>\u003ctd>刷新配置、可达性校验、概率模拟、调试面板与分阶段接入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">10 储物与负重\u003c/a>\u003c/td>\u003ctd>背包、飞行器货舱、袋戒、扩容材料/技能、容量与携重\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">11 随机洞府与机缘\u003c/a>\u003c/td>\u003ctd>角色差异、洞府布局、奖励、定居与私人仓储\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">12 丹药与后遗症\u003c/a>\u003c/td>\u003ctd>疗伤/回气/续力/爆发丹、共享冷却、治疗与离线疗养\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">13 移动与追逐\u003c/a>\u003c/td>\u003ctd>十境速度、奔袭、负重影响、怪物感知/追击/脱战\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">14 单机与联网边界\u003c/a>\u003c/td>\u003ctd>世界/角色/实例归属、在线资产、组队洞府与未来迁移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">15 宠物成长与羁绊\u003c/a>\u003c/td>\u003ctd>孵化、喂养收服、七档血脉、十境成长、兽诀、迷你陪伴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#16_PET_BESTIARY_33.md\">16 神兽33种\u003c/a>\u003c/td>\u003ctd>每种定位、食物、天赋、飞行类型、迷你形态与服装\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">17 骑宠空战与资产\u003c/a>\u003c/td>\u003ctd>高度/载重/灵力、双视角、3D动作、图片视频版本与备份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#18_NAMES_PET_STYLE_AND_IDENTITY.md\">18 名字、装扮与身份\u003c/a>\u003c/td>\u003ctd>玩家/宠物起名、个体花纹、私人纹章、同名与多人归属\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#19_DAMAGE_ATTRIBUTES_AND_MASTERY.md\">19 属性与五阶掌握\u003c/a>\u003c/td>\u003ctd>先加后乘、术强/灵抗、伤害/盾/治疗、锁定反制和手算示例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#20_PLAYER_MARTIAL_ARTS_60.md\">20 人物武技60式\u003c/a>\u003c/td>\u003ctd>20武器技、26属性术、14战术身法的系数/门槛/耗能/判定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#21_PET_SKILLS_33.md\">21 宠物专属技能\u003c/a>\u003c/td>\u003ctd>33种各2主动1天赋、独立宠物属性、空战与AI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#22_COMBAT_3D_AND_ANIMATION.md\">22 战斗3D与动画\u003c/a>\u003c/td>\u003ctd>每招专属形状与五阶VFX、骨骼/命中/双视角、资产版本验收\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#23_SECTS_NPCS_MISSIONS_AND_DUELS.md\">23 宗门与比武\u003c/a>\u003c/td>\u003ctd>6宗门、12新增NPC、12委托模板、20兑换项与擂台\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#24_SECT_BUILDINGS_AND_FORMATIONS.md\">24 建宗与阵法\u003c/a>\u003c/td>\u003ctd>立宗条件、12建筑、12阵法、真实供能、覆灭与重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#25_ILLUSTRATED_READING_GUIDE.md\">25 图文阅读路线\u003c/a>\u003c/td>\u003ctd>按玩法选阅读顺序、图例、媒体来源与离线阅读器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">26 逆天传承与机缘\u003c/a>\u003c/td>\u003ctd>一气化三清、超常核心、30项极稀有设计、跨境算例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27 消耗换代与世界唯一\u003c/a>\u003c/td>\u003ctd>实际消耗才补充、不同新组合、原器流转不复制、20项刷新验收\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28 地图与游历NPC\u003c/a>\u003c/td>\u003ctd>8类地图、12人物模板、材料竞争、伏击夺宝、销赃追索与新人补位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#29_SUPREME_FACTIONS_AND_STORY.md\">29 十大顶层势力\u003c/a>\u003c/td>\u003ctd>一神国二洞天三学府四圣地、领袖等级、20下属门派、关系与六幕故事\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>刷新系统留在本游戏项目内，以独立模块和开发入口维护，不另外新建仓库或服务。宗门、建筑、阵法与战斗、库存、境界、任务共用稳定ID和事务存档；未来共享世界需求出现时再拆后端。当前文档包共三十份（本入口＋01—29），配30张规则图与1张三联概念插画。新增27优先覆盖旧的到期换货、掉落自动过期和每角色原器唯一假设。\u003c/p>\u003ch2>4. 对旧设计的覆盖\u003c/h2>\u003cp>本包覆盖 D2 对应条款：取消“不增加人物经验条”、仅两种材料、暂不引入品级、无交易/炼丹的范围限制；新增角色十境界及材料经济。技能的“入门/小成/精通/大成/圆满”保留为\u003cstrong>技能熟练阶\u003c/strong>，不得再称角色境界。旧身体/装备续航作为科技适应记录保留，转换方案独立迁移，不能与新境界重复乘算。\u003c/p>\u003cp>D2 的事件去重、事务扣料、存档备份、真实 3D 与表现/判定一致原则继续适用。旧文档与 D3 冲突时，以本包对应模块为准；用户新指令优先于本包。第 07 文件的阶段替代旧 M0—M6 排期，但不撤销历史验收证据。\u003c/p>\u003cp>2026-09-12 补充：第 10—14 文件覆盖旧文档尚未定义的容量/钱包、第 01 文件相同基础地速、第 03 文件功能丹即时恢复及固定放置机缘假设。机缘实例按角色随机并保存；共享联网玩法在后续阶段实现，当前仍单机。\u003c/p>\u003cp>宠物当前规则：同时只有一只随行个体，在日常迷你跟随与完整战斗模式之间切换；不是战宠加陪伴宠两只同时出现。宠物补充以第15—18为准：新增33种神话谱系与两名NPC，允许低境载宠飞行；生活宠物只能在灵兽栏/灵栖契内休息，普通储物袋不收活物。资产版本归档与独立备份不能混称，未生成模型仍标 planned。\u003c/p>\u003ch2>5. 初期可感知的目标\u003c/h2>\u003cp>本次19—24覆盖旧伤害公式与宗门未定义部分：五阶名称保留，伤害倍率为1/1.18/1.40/1.68/2，防御常数由20改40，弱点默认25%进入统一增伤桶；宠物数值独立计算。本章当时新增12名宗门NPC至38名；第29再增30名，现共68名。玩法和数值均待实机验证，文档审计不代表60武技、66宠物主动或3D资产已完成。\u003c/p>\u003cp>第一轮可玩目标是一趟 20—30 分钟的远征：与医师领取基础方案，击退掠兽取得血液，避开高阶巢母采药，拾取铁陨，返回炼制一次进化液、锻造一把武器，再用实际增强后的能力挑战营地外精英。全过程可失败、可救援、可保存，收益不依赖低概率内丹。\u003c/p>\u003cp>这不是要求先完成 100 级再验证乐趣。先验证一只敌人是否好打、一种技能是否有用、一次炼丹是否值得，再扩大种类与地图。所有概率、时长、伤害和价格均为首轮可调配置，不能当作已验证的平衡结论。\u003c/p>"},{"file":"01_REALMS_AND_CULTIVATION.md","title":"D3-01 · 十境界、属性与修炼","text":"# D3-01 · 十境界、属性与修炼\n\n\u003c!-- illustrated-overview:start -->\n![从后天到星空](media/diagram-01-v001.svg)\n\n*图解：每境十级；击败高手不等于自动获得他的移动权限。*\n\u003c!-- illustrated-overview:end -->\n\n依赖：[总览](README.md)。本文是角色成长的唯一数值基准；战斗与配方只能引用，不另造第二套境界。\n\n## 1. 十境界与能力里程碑\n\n最高组织与领袖见[29](29_SUPREME_FACTIONS_AND_STORY.md)。总等级=10r+l；道源91—93初阶、94—96中阶（96顶峰）、97—99大成、100圆满。神皇99级是当前已知最高NPC参考战力；这些角色段位不替代技能五阶掌握。\n\n|编号|境界（每境 1—10 级）|生命与探索能力|力量演示目标|移动权限|\n|---|---|---|---|---|\n|R0|后天|科技强化肉体，仍需宇航服供氧和环境防护|从对抗野兽到破坏轻型机械；有效攻击 1—5 米|徒步/车辆/飞行器|\n|R1|先天|形成内息，可在出生星常规地表脱下呼吸面罩|击穿 10 厘米标定石墙；气刃约 10 米|仍依靠飞行器|\n|R2|灵海|真气形成稳定气海，解锁元素护体|可击毁标记为可破坏的普通建筑构件，范围约 5 米|仍依靠飞行器|\n|R3|金丹|真气凝核，可短时抵挡酸雾和局部能量侵蚀|裂开 20 米巨岩/破开重装堡门，范围约 15 米|仍依靠飞行器|\n|R4|元婴|意识外探，发现隐藏阵纹、远控法器|切断 100 米岩脊的脆弱结构，范围约 40 米|借物御器，地表上限 200 米|\n|R5|化神|肉身御空，独立神识探查|击毁 300 米级山峰的标定核心，范围约 100 米|无需飞行器，持续耗真气|\n|R6|炼虚|承受跨星传送，短距离空间步法|干预公里级空间裂隙/摧毁大型虚空巢穴|跨星传送；仍非真空长航|\n|R7|合道|建立局部领域，环境规则成为战术资源|覆盖 5 公里战略区域的领域事件|星球内高空航行，真空仍需载具|\n|R8|星劫|形成真空护域，可肉身在星空活动|摧毁标定 10 公里小天体核心，击败星空巨兽|星空飞行，真气维持护域与推进|\n|R9|道源|操控星核级能量结构，探索文明级后果|具备毁星能力，须完整星核事件而非随手普攻|星域航行与高级传送|\n\n这些是游戏的结构破坏等级和剧情挑战尺度，不是假称物理模拟能量值。普通战斗有效距离、范围和伤害仍受技能配置限制；不因达到 R5 让每次挥剑都削平整个场景。R9 的可毁星目标与救援保护见世界文档。\n\nR1 的“正常呼吸”只针对标记为常规可适应的出生星大气；真空、深水、极毒区不能混同为能呼吸。R0 密封服在安全区自动补给，出发前预警；供氧耗尽会昏迷救援，不永久删档。\n\n宠物补充：表中0—3境“依靠飞行器”现扩为飞行器或合格飞行坐骑，详见 [骑宠规则](17_PET_3D_FLIGHT_AND_ASSETS.md)。宠物自己能飞/更高境界不等于骑手能肉身御空、耐真空或越过本人传送资格。\n\n## 2. 可量化基础属性\n\n设境界 r∈[0,9]，小等级 l∈[1,10]，`B = 6^r × (1 + 0.18 × (l−1))`。未配装、标准成长路线的参考值：\n\n- 生命 `H = round(120 × B)`；攻击 `A = round(12 × B)`；防御 `D = round(10 × B)`。\n- R1 起真气上限 `Q = round(100 × 2^r × (1 + 0.08 × (l−1)))`；R0 没有可自行运转的真气，科技设备使用独立电容 100。\n- 体力池基础 100，动作按实际池结算。后天一级常速 4.7 m/s、疾跑 8.6 m/s；后续每境独立速度与每小级加成见 [移动追逐](13_MOVEMENT_AND_PURSUIT.md)，不再所有境界共用新手地速。\n- 每境从 1 到 10 级基础生命/攻防增长 2.62 倍；从上一境 10 级到下一境 1 级约 2.29 倍。大境界带来新能力，但不是碰一下必死的隐藏等级压制。\n\n|境界|1 级参考攻击|10 级参考攻击|1 级参考生命|\n|---|---:|---:|---:|\n|后天|12|31|120|\n|先天|72|189|720|\n|灵海|432|1,132|4,320|\n|金丹|2,592|6,791|25,920|\n|元婴|15,552|40,746|155,520|\n|化神|93,312|244,477|933,120|\n|炼虚|559,872|1,466,865|5,598,720|\n|合道|3,359,232|8,801,188|33,592,320|\n|星劫|20,155,392|52,807,127|201,553,920|\n|道源|120,932,352|316,842,762|1,209,323,520|\n\n显示使用万/亿并可展开精确值。存储以整数属性计算，伤害每次结算后取整，不用浮点余额存材料或货币。\n\n## 3. 同境界差异从哪里来\n\n角色境界决定可承载上限；丹方路线、材料品质、功法、武器、机缘共同决定同境界差异。\n\n`最终攻击 = 基础攻击 × (1 + 体质攻击加成) × 功法倍率 × 装备倍率`，防御/生命同结构。体质加成由历次突破、淬体和机缘累计，单项正加成合计上限 +80%；功法常驻单属性倍率上限 1.8；装备合计同属性倍率上限 1.8。极端配置上限约 5.83 倍，初期实际目标是同级不同构筑主属性相差 2—4 倍。\n\n速度单独计算：先取每境基础值，再乘小级/构筑与负重；常驻构筑倍率上限 2.0，奔袭与药物上限见 [移动追逐](13_MOVEMENT_AND_PURSUIT.md)。一般减速 slowFactor 最低保留 35%，但超载、束缚等显式禁移动另算；攻速上限 1.6，不随赶路速度无限加快挥刀动画。\n\n破甲、真气效率、招式形态和控制能力可以不同，不能把所有差异都压成攻击。三种突破路线主强化攻击、生命/防御、真气/速度；每境三条路线均可继续下一境，无永久选错门派。\n\n## 4. 修为、小升级与大突破\n\n极稀有例外见[26逆天传承](26_HEAVEN_DEFYING_LEGACIES.md)：普通5.83倍常驻构筑上限仍有效，天命核心在其后有显式单核心倍率。允许低境高小级角色凭成熟传承挑战高一境普通对手，但不因此直接解锁对方境界的飞行/真空权限。\n\n当前境界每级所需修为：`X(r,l)=round(100 × 4^r × l^1.35)`。l=1—9 用于升到下一小级；l=10 用于填满突破槽。修为不可跨境囤积；满槽提示“待突破”，不继续扣灵石。道源十级满槽后完成当前成长上限，停止经验消费。\n\n来源为有风险的战斗、首次探索、任务验证、在线打坐与离线打坐。普通同阶同级怪参考奖励当前级 X 的 3%，精英 10%，首领 30%；低于玩家两个大境界的敌人不再给修为，但仍按原表掉材料。刷新同一唯一探索点不重复领奖。\n\n普通突破：本境十级且突破槽满 → NPC 讲解下一境 → 选择完整配方或替代突破法 → 展示材料、属性、能力变化 → 主动确认 → 一次性扣料并升到下一境一级。无随机爆丹、掉级或强制清空装备。R0 一级起可用后天淬体液增加成长资质，但进入 R1 使用的是 R1 突破液。\n\n每种境界配方有“入境突破”和“同境淬体”两种用途：R1—R9 首次突破到该境可用；当前已在该境可炼一次淬体剂。R0 只有淬体用途。首次突破的体质收益与同境淬体共用该境一个槽位，不可喝两遍叠加。换更高品质或不同路线只重算该槽，不累加，并明确预览被替换属性。\n\n## 5. 三种突破途径\n\n|途径|可用范围|条件/代价|永久收益|\n|---|---|---|---|\n|进化液/丹药|R0→R1 至 R8→R9 全部|修为满＋任一对应配方＋NPC 校准|按配方路线与品质记录一个体质槽|\n|遗址传承|R0→R1 至 R8→R9|修为满＋对应层级传承试炼；可用探索材料替代血/核，耗时更长|相当于同阶 Q3 均衡突破，另解锁功法知识|\n|极稀有机缘灌顶|R0→R1 至 R8→R9|匹配本境、满足生命承载试验；可以免修为不足及常规配方，一次最多跨一个大境界|记录不可重复的 +2%—5% 永久体质或特殊感知能力|\n\n机缘不是保证刷出的第四个日常任务。若已达目标境界，机缘改为对应传承或同等限额体质收益，不浪费、不跨两境。无需为了随机事件才能走通主线。所有跨境方式都触发同一 NPC 世界知识记录和区域解锁，不绕过必要的飞行/传送安全规则。R9 到顶后机缘只增强构筑，不生成第十一境。\n\n每境的确定性传承路线如下。试炼材料为同阶药草/环境结晶/阵纹记录，可取代猎杀血核；试炼失败不永久销毁传承资格，不能要求玩家提前会下一境能力。\n\n|目标境界|非丹药突破试炼|不用下一境能力也能完成的办法|\n|---|---|---|\n|先天|引息归环：稳定三处导引节点，抵御短时灵压|后天设备读数＋手动调节，用宇航服保护完成|\n|灵海|百川归流：恢复药谷水脉并承受回流|使用先天内息或水道机关分段泄压|\n|金丹|赤炉凝核：在冷/热周期内凝聚稳定能核|用灵海气量与矿站冷却装置控制，不先要求金丹护体|\n|元婴|镜心照影：识别并打断自己的三种错误回路|扫描、脚步/倒影观察及金丹技能，避免只猜真假|\n|化神|天穹问神：取得风暴三点测量并稳定神识|用元婴御器或 F3 飞行器到达落脚点，不先要御空|\n|炼虚|界隙锚定：修复母星界门三个本地锚点|化神御空＋地面阵器，全部位于母星|\n|合道|重力合律：在不同重力区维持同一规则|炼虚空间步法或固定平台/索桥两种路径|\n|星劫|真空护域：在带救援罩的试验舱内稳定护域|合道领域配合星港试验设备，无需裸身进入真空|\n|道源|星核共鸣：理解并稳定一处衰败小天体核心|星劫护域＋阵锚辅助；完成后才拥有毁星层级能力|\n\n普通丹药路线也需 NPC 的一次短安全校准，但不再完整重复上述长试炼。机缘灌顶把当前不足修为补至突破条件，奖励采用唯一事务记录；例如元婴满级以下遇到匹配“化神星辉”，可直接升化神一级，不能连升炼虚。\n\n## 6. 打坐与离线 72 小时\n\n安全区练功 NPC 解锁打坐。退出前在安全区开始修炼才结算离线收益；野外断线先保留位置，重进执行当地安全恢复，不伪装野外无敌挂机。在线打坐基础速度 `v(r)=20 × 4^r 修为/小时`；离线效率在线的 50%。这是慢速保底，探索战斗应明显更快。\n\n`有效离线秒数 = max(0,min(当前可信时间−最后有效在线时间,72×3600))`。一次离线超过三天，只结算最初三天，之后停止。离线修为可以自动升小级，但不能跨大境界；当前境界突破槽填满后立即停止，剩余时间不存进下一境。\n\n在线修炼倍率：练功室 1.0/1.2/1.5；匹配功法 1.0—1.3；灵石辅助最高 2.0；总倍率封顶 3.0。离线先乘相同加成再乘 0.5。升级到下一小级时依新阈值逐段结算。\n\n灵石只在用户勾选“允许离线消耗”并预存数量后自动使用。有效修炼每小时消耗本境标准碎灵石额度 `C(r)=10×5^r`；不足时回退无灵石基础速度，不能负余额或自动兑换背包全部资产。达到上限只扣实际有效时长，内部以微小时累计到最小货币单位。\n\n重登界面显示离线时长、计入时长、获得修为、小级变化、消耗、停训原因。重复打开/读档不重复领取；先持久化结算事务再显示。系统时钟回拨给 0 并保留最大已结算时间。纯离线版本无法可靠防止改系统时间，应诚实标记；若以后接联网交易，收益时间及结算改服务器权威，不能继承未经验证的离线资产。\n\n## 7. 真气与恢复\n\n停止消耗真气且脱战 8 秒后，自然恢复每秒上限的 2%；战斗中每秒 0.2%；打坐恢复每秒 5%。暂停/菜单不补资源。飞行、护域或持续技能开启时不触发自然回气。\n\n回气丹的同阶 Q3 基准为 3 秒服用、恢复 35%；与疗伤/续力共享 45 秒恢复族冷却，层级和品质系数见 [丹药规格](12_MEDICINES_AND_AFTEREFFECTS.md)。灵石吸收 5 秒站定引导，恢复 20%，冷却 15 秒，只消耗身上可访问灵石；二者都不触发突破、不清冷却。\n\nR5 御空基础耗气上限的 2%/秒，急加速再加 1%/秒；基础满气悬空约 50 秒。20% 预警、10% 提示落点、5% 强制转降落，把最后 5% 用作专门的降落缓冲，禁止继续加速。断气/被打断时服装应急缓降接管；不凭空回满气，地面才可安全恢复。R8 真空护域额外 0.5%/秒，飞行不取代跨星传送与长途载具。\n\n## 8. 成长验收关键点\n\n验证 100 个等级位置、三条突破路线、上限属性、跨境幂次、70/72/96 小时离线、时钟回拨、满突破槽、不足灵石、重复读档、突破与机缘竞争提交、R9 封顶，以及脱战/飞行/打坐资源状态互斥。\n","html":"\u003ch1>D3-01 · 十境界、属性与修炼\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-01-v001.svg\" alt=\"从后天到星空\">\u003c/p>\u003cp>\u003cem>图解：每境十级；击败高手不等于自动获得他的移动权限。\u003c/em>\u003c/p>\u003cp>依赖：\u003ca href=\"#README.md\">总览\u003c/a>。本文是角色成长的唯一数值基准；战斗与配方只能引用，不另造第二套境界。\u003c/p>\u003ch2>1. 十境界与能力里程碑\u003c/h2>\u003cp>最高组织与领袖见\u003ca href=\"#29_SUPREME_FACTIONS_AND_STORY.md\">29\u003c/a>。总等级=10r+l；道源91—93初阶、94—96中阶（96顶峰）、97—99大成、100圆满。神皇99级是当前已知最高NPC参考战力；这些角色段位不替代技能五阶掌握。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>编号\u003c/th>\u003cth>境界（每境 1—10 级）\u003c/th>\u003cth>生命与探索能力\u003c/th>\u003cth>力量演示目标\u003c/th>\u003cth>移动权限\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0\u003c/td>\u003ctd>后天\u003c/td>\u003ctd>科技强化肉体，仍需宇航服供氧和环境防护\u003c/td>\u003ctd>从对抗野兽到破坏轻型机械；有效攻击 1—5 米\u003c/td>\u003ctd>徒步/车辆/飞行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R1\u003c/td>\u003ctd>先天\u003c/td>\u003ctd>形成内息，可在出生星常规地表脱下呼吸面罩\u003c/td>\u003ctd>击穿 10 厘米标定石墙；气刃约 10 米\u003c/td>\u003ctd>仍依靠飞行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2\u003c/td>\u003ctd>灵海\u003c/td>\u003ctd>真气形成稳定气海，解锁元素护体\u003c/td>\u003ctd>可击毁标记为可破坏的普通建筑构件，范围约 5 米\u003c/td>\u003ctd>仍依靠飞行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3\u003c/td>\u003ctd>金丹\u003c/td>\u003ctd>真气凝核，可短时抵挡酸雾和局部能量侵蚀\u003c/td>\u003ctd>裂开 20 米巨岩/破开重装堡门，范围约 15 米\u003c/td>\u003ctd>仍依靠飞行器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4\u003c/td>\u003ctd>元婴\u003c/td>\u003ctd>意识外探，发现隐藏阵纹、远控法器\u003c/td>\u003ctd>切断 100 米岩脊的脆弱结构，范围约 40 米\u003c/td>\u003ctd>借物御器，地表上限 200 米\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R5\u003c/td>\u003ctd>化神\u003c/td>\u003ctd>肉身御空，独立神识探查\u003c/td>\u003ctd>击毁 300 米级山峰的标定核心，范围约 100 米\u003c/td>\u003ctd>无需飞行器，持续耗真气\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6\u003c/td>\u003ctd>炼虚\u003c/td>\u003ctd>承受跨星传送，短距离空间步法\u003c/td>\u003ctd>干预公里级空间裂隙/摧毁大型虚空巢穴\u003c/td>\u003ctd>跨星传送；仍非真空长航\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R7\u003c/td>\u003ctd>合道\u003c/td>\u003ctd>建立局部领域，环境规则成为战术资源\u003c/td>\u003ctd>覆盖 5 公里战略区域的领域事件\u003c/td>\u003ctd>星球内高空航行，真空仍需载具\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R8\u003c/td>\u003ctd>星劫\u003c/td>\u003ctd>形成真空护域，可肉身在星空活动\u003c/td>\u003ctd>摧毁标定 10 公里小天体核心，击败星空巨兽\u003c/td>\u003ctd>星空飞行，真气维持护域与推进\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R9\u003c/td>\u003ctd>道源\u003c/td>\u003ctd>操控星核级能量结构，探索文明级后果\u003c/td>\u003ctd>具备毁星能力，须完整星核事件而非随手普攻\u003c/td>\u003ctd>星域航行与高级传送\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>这些是游戏的结构破坏等级和剧情挑战尺度，不是假称物理模拟能量值。普通战斗有效距离、范围和伤害仍受技能配置限制；不因达到 R5 让每次挥剑都削平整个场景。R9 的可毁星目标与救援保护见世界文档。\u003c/p>\u003cp>R1 的“正常呼吸”只针对标记为常规可适应的出生星大气；真空、深水、极毒区不能混同为能呼吸。R0 密封服在安全区自动补给，出发前预警；供氧耗尽会昏迷救援，不永久删档。\u003c/p>\u003cp>宠物补充：表中0—3境“依靠飞行器”现扩为飞行器或合格飞行坐骑，详见 \u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">骑宠规则\u003c/a>。宠物自己能飞/更高境界不等于骑手能肉身御空、耐真空或越过本人传送资格。\u003c/p>\u003ch2>2. 可量化基础属性\u003c/h2>\u003cp>设境界 r∈[0,9]，小等级 l∈[1,10]，\u003ccode>B = 6^r × (1 + 0.18 × (l−1))\u003c/code>。未配装、标准成长路线的参考值：\u003c/p>\u003cul>\u003cli>生命 \u003ccode>H = round(120 × B)\u003c/code>；攻击 \u003ccode>A = round(12 × B)\u003c/code>；防御 \u003ccode>D = round(10 × B)\u003c/code>。\u003c/li>\u003cli>R1 起真气上限 \u003ccode>Q = round(100 × 2^r × (1 + 0.08 × (l−1)))\u003c/code>；R0 没有可自行运转的真气，科技设备使用独立电容 100。\u003c/li>\u003cli>体力池基础 100，动作按实际池结算。后天一级常速 4.7 m/s、疾跑 8.6 m/s；后续每境独立速度与每小级加成见 \u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">移动追逐\u003c/a>，不再所有境界共用新手地速。\u003c/li>\u003cli>每境从 1 到 10 级基础生命/攻防增长 2.62 倍；从上一境 10 级到下一境 1 级约 2.29 倍。大境界带来新能力，但不是碰一下必死的隐藏等级压制。\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>境界\u003c/th>\u003cth>1 级参考攻击\u003c/th>\u003cth>10 级参考攻击\u003c/th>\u003cth>1 级参考生命\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>后天\u003c/td>\u003ctd>12\u003c/td>\u003ctd>31\u003c/td>\u003ctd>120\u003c/td>\u003c/tr>\u003ctr>\u003ctd>先天\u003c/td>\u003ctd>72\u003c/td>\u003ctd>189\u003c/td>\u003ctd>720\u003c/td>\u003c/tr>\u003ctr>\u003ctd>灵海\u003c/td>\u003ctd>432\u003c/td>\u003ctd>1,132\u003c/td>\u003ctd>4,320\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金丹\u003c/td>\u003ctd>2,592\u003c/td>\u003ctd>6,791\u003c/td>\u003ctd>25,920\u003c/td>\u003c/tr>\u003ctr>\u003ctd>元婴\u003c/td>\u003ctd>15,552\u003c/td>\u003ctd>40,746\u003c/td>\u003ctd>155,520\u003c/td>\u003c/tr>\u003ctr>\u003ctd>化神\u003c/td>\u003ctd>93,312\u003c/td>\u003ctd>244,477\u003c/td>\u003ctd>933,120\u003c/td>\u003c/tr>\u003ctr>\u003ctd>炼虚\u003c/td>\u003ctd>559,872\u003c/td>\u003ctd>1,466,865\u003c/td>\u003ctd>5,598,720\u003c/td>\u003c/tr>\u003ctr>\u003ctd>合道\u003c/td>\u003ctd>3,359,232\u003c/td>\u003ctd>8,801,188\u003c/td>\u003ctd>33,592,320\u003c/td>\u003c/tr>\u003ctr>\u003ctd>星劫\u003c/td>\u003ctd>20,155,392\u003c/td>\u003ctd>52,807,127\u003c/td>\u003ctd>201,553,920\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道源\u003c/td>\u003ctd>120,932,352\u003c/td>\u003ctd>316,842,762\u003c/td>\u003ctd>1,209,323,520\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>显示使用万/亿并可展开精确值。存储以整数属性计算，伤害每次结算后取整，不用浮点余额存材料或货币。\u003c/p>\u003ch2>3. 同境界差异从哪里来\u003c/h2>\u003cp>角色境界决定可承载上限；丹方路线、材料品质、功法、武器、机缘共同决定同境界差异。\u003c/p>\u003cp>\u003ccode>最终攻击 = 基础攻击 × (1 + 体质攻击加成) × 功法倍率 × 装备倍率\u003c/code>，防御/生命同结构。体质加成由历次突破、淬体和机缘累计，单项正加成合计上限 +80%；功法常驻单属性倍率上限 1.8；装备合计同属性倍率上限 1.8。极端配置上限约 5.83 倍，初期实际目标是同级不同构筑主属性相差 2—4 倍。\u003c/p>\u003cp>速度单独计算：先取每境基础值，再乘小级/构筑与负重；常驻构筑倍率上限 2.0，奔袭与药物上限见 \u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">移动追逐\u003c/a>。一般减速 slowFactor 最低保留 35%，但超载、束缚等显式禁移动另算；攻速上限 1.6，不随赶路速度无限加快挥刀动画。\u003c/p>\u003cp>破甲、真气效率、招式形态和控制能力可以不同，不能把所有差异都压成攻击。三种突破路线主强化攻击、生命/防御、真气/速度；每境三条路线均可继续下一境，无永久选错门派。\u003c/p>\u003ch2>4. 修为、小升级与大突破\u003c/h2>\u003cp>极稀有例外见\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">26逆天传承\u003c/a>：普通5.83倍常驻构筑上限仍有效，天命核心在其后有显式单核心倍率。允许低境高小级角色凭成熟传承挑战高一境普通对手，但不因此直接解锁对方境界的飞行/真空权限。\u003c/p>\u003cp>当前境界每级所需修为：\u003ccode>X(r,l)=round(100 × 4^r × l^1.35)\u003c/code>。l=1—9 用于升到下一小级；l=10 用于填满突破槽。修为不可跨境囤积；满槽提示“待突破”，不继续扣灵石。道源十级满槽后完成当前成长上限，停止经验消费。\u003c/p>\u003cp>来源为有风险的战斗、首次探索、任务验证、在线打坐与离线打坐。普通同阶同级怪参考奖励当前级 X 的 3%，精英 10%，首领 30%；低于玩家两个大境界的敌人不再给修为，但仍按原表掉材料。刷新同一唯一探索点不重复领奖。\u003c/p>\u003cp>普通突破：本境十级且突破槽满 → NPC 讲解下一境 → 选择完整配方或替代突破法 → 展示材料、属性、能力变化 → 主动确认 → 一次性扣料并升到下一境一级。无随机爆丹、掉级或强制清空装备。R0 一级起可用后天淬体液增加成长资质，但进入 R1 使用的是 R1 突破液。\u003c/p>\u003cp>每种境界配方有“入境突破”和“同境淬体”两种用途：R1—R9 首次突破到该境可用；当前已在该境可炼一次淬体剂。R0 只有淬体用途。首次突破的体质收益与同境淬体共用该境一个槽位，不可喝两遍叠加。换更高品质或不同路线只重算该槽，不累加，并明确预览被替换属性。\u003c/p>\u003ch2>5. 三种突破途径\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>途径\u003c/th>\u003cth>可用范围\u003c/th>\u003cth>条件/代价\u003c/th>\u003cth>永久收益\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>进化液/丹药\u003c/td>\u003ctd>R0→R1 至 R8→R9 全部\u003c/td>\u003ctd>修为满＋任一对应配方＋NPC 校准\u003c/td>\u003ctd>按配方路线与品质记录一个体质槽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遗址传承\u003c/td>\u003ctd>R0→R1 至 R8→R9\u003c/td>\u003ctd>修为满＋对应层级传承试炼；可用探索材料替代血/核，耗时更长\u003c/td>\u003ctd>相当于同阶 Q3 均衡突破，另解锁功法知识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>极稀有机缘灌顶\u003c/td>\u003ctd>R0→R1 至 R8→R9\u003c/td>\u003ctd>匹配本境、满足生命承载试验；可以免修为不足及常规配方，一次最多跨一个大境界\u003c/td>\u003ctd>记录不可重复的 +2%—5% 永久体质或特殊感知能力\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>机缘不是保证刷出的第四个日常任务。若已达目标境界，机缘改为对应传承或同等限额体质收益，不浪费、不跨两境。无需为了随机事件才能走通主线。所有跨境方式都触发同一 NPC 世界知识记录和区域解锁，不绕过必要的飞行/传送安全规则。R9 到顶后机缘只增强构筑，不生成第十一境。\u003c/p>\u003cp>每境的确定性传承路线如下。试炼材料为同阶药草/环境结晶/阵纹记录，可取代猎杀血核；试炼失败不永久销毁传承资格，不能要求玩家提前会下一境能力。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>目标境界\u003c/th>\u003cth>非丹药突破试炼\u003c/th>\u003cth>不用下一境能力也能完成的办法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>先天\u003c/td>\u003ctd>引息归环：稳定三处导引节点，抵御短时灵压\u003c/td>\u003ctd>后天设备读数＋手动调节，用宇航服保护完成\u003c/td>\u003c/tr>\u003ctr>\u003ctd>灵海\u003c/td>\u003ctd>百川归流：恢复药谷水脉并承受回流\u003c/td>\u003ctd>使用先天内息或水道机关分段泄压\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金丹\u003c/td>\u003ctd>赤炉凝核：在冷/热周期内凝聚稳定能核\u003c/td>\u003ctd>用灵海气量与矿站冷却装置控制，不先要求金丹护体\u003c/td>\u003c/tr>\u003ctr>\u003ctd>元婴\u003c/td>\u003ctd>镜心照影：识别并打断自己的三种错误回路\u003c/td>\u003ctd>扫描、脚步/倒影观察及金丹技能，避免只猜真假\u003c/td>\u003c/tr>\u003ctr>\u003ctd>化神\u003c/td>\u003ctd>天穹问神：取得风暴三点测量并稳定神识\u003c/td>\u003ctd>用元婴御器或 F3 飞行器到达落脚点，不先要御空\u003c/td>\u003c/tr>\u003ctr>\u003ctd>炼虚\u003c/td>\u003ctd>界隙锚定：修复母星界门三个本地锚点\u003c/td>\u003ctd>化神御空＋地面阵器，全部位于母星\u003c/td>\u003c/tr>\u003ctr>\u003ctd>合道\u003c/td>\u003ctd>重力合律：在不同重力区维持同一规则\u003c/td>\u003ctd>炼虚空间步法或固定平台/索桥两种路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>星劫\u003c/td>\u003ctd>真空护域：在带救援罩的试验舱内稳定护域\u003c/td>\u003ctd>合道领域配合星港试验设备，无需裸身进入真空\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道源\u003c/td>\u003ctd>星核共鸣：理解并稳定一处衰败小天体核心\u003c/td>\u003ctd>星劫护域＋阵锚辅助；完成后才拥有毁星层级能力\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>普通丹药路线也需 NPC 的一次短安全校准，但不再完整重复上述长试炼。机缘灌顶把当前不足修为补至突破条件，奖励采用唯一事务记录；例如元婴满级以下遇到匹配“化神星辉”，可直接升化神一级，不能连升炼虚。\u003c/p>\u003ch2>6. 打坐与离线 72 小时\u003c/h2>\u003cp>安全区练功 NPC 解锁打坐。退出前在安全区开始修炼才结算离线收益；野外断线先保留位置，重进执行当地安全恢复，不伪装野外无敌挂机。在线打坐基础速度 \u003ccode>v(r)=20 × 4^r 修为/小时\u003c/code>；离线效率在线的 50%。这是慢速保底，探索战斗应明显更快。\u003c/p>\u003cp>\u003ccode>有效离线秒数 = max(0,min(当前可信时间−最后有效在线时间,72×3600))\u003c/code>。一次离线超过三天，只结算最初三天，之后停止。离线修为可以自动升小级，但不能跨大境界；当前境界突破槽填满后立即停止，剩余时间不存进下一境。\u003c/p>\u003cp>在线修炼倍率：练功室 1.0/1.2/1.5；匹配功法 1.0—1.3；灵石辅助最高 2.0；总倍率封顶 3.0。离线先乘相同加成再乘 0.5。升级到下一小级时依新阈值逐段结算。\u003c/p>\u003cp>灵石只在用户勾选“允许离线消耗”并预存数量后自动使用。有效修炼每小时消耗本境标准碎灵石额度 \u003ccode>C(r)=10×5^r\u003c/code>；不足时回退无灵石基础速度，不能负余额或自动兑换背包全部资产。达到上限只扣实际有效时长，内部以微小时累计到最小货币单位。\u003c/p>\u003cp>重登界面显示离线时长、计入时长、获得修为、小级变化、消耗、停训原因。重复打开/读档不重复领取；先持久化结算事务再显示。系统时钟回拨给 0 并保留最大已结算时间。纯离线版本无法可靠防止改系统时间，应诚实标记；若以后接联网交易，收益时间及结算改服务器权威，不能继承未经验证的离线资产。\u003c/p>\u003ch2>7. 真气与恢复\u003c/h2>\u003cp>停止消耗真气且脱战 8 秒后，自然恢复每秒上限的 2%；战斗中每秒 0.2%；打坐恢复每秒 5%。暂停/菜单不补资源。飞行、护域或持续技能开启时不触发自然回气。\u003c/p>\u003cp>回气丹的同阶 Q3 基准为 3 秒服用、恢复 35%；与疗伤/续力共享 45 秒恢复族冷却，层级和品质系数见 \u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">丹药规格\u003c/a>。灵石吸收 5 秒站定引导，恢复 20%，冷却 15 秒，只消耗身上可访问灵石；二者都不触发突破、不清冷却。\u003c/p>\u003cp>R5 御空基础耗气上限的 2%/秒，急加速再加 1%/秒；基础满气悬空约 50 秒。20% 预警、10% 提示落点、5% 强制转降落，把最后 5% 用作专门的降落缓冲，禁止继续加速。断气/被打断时服装应急缓降接管；不凭空回满气，地面才可安全恢复。R8 真空护域额外 0.5%/秒，飞行不取代跨星传送与长途载具。\u003c/p>\u003ch2>8. 成长验收关键点\u003c/h2>\u003cp>验证 100 个等级位置、三条突破路线、上限属性、跨境幂次、70/72/96 小时离线、时钟回拨、满突破槽、不足灵石、重复读档、突破与机缘竞争提交、R9 封顶，以及脱战/飞行/打坐资源状态互斥。\u003c/p>"},{"file":"02_COMBAT_WEAPONS_SKILLS.md","title":"D3-02 · 战斗、十大武器与功法","text":"# D3-02 · 战斗、十大武器与功法\n\n\u003c!-- illustrated-overview:start -->\n![一场可读的战斗](media/diagram-02-v001.svg)\n\n*图解：学会观察、留资源，再使用重击和武技创造优势。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n抢夺例外：第28的动态劫修可在玩家倒地后完成可打断搜夺，转移真实可触及财物；普通怪昏迷仍保留背包。斩杀动态敌对NPC可取得其当前库存，固定NPC保护规则不变。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n依赖：[境界数值](01_REALMS_AND_CULTIVATION.md)、[材料经济](03_ALCHEMY_MATERIALS_ECONOMY.md)。所有数值为白盒起点，先做 R0 一场有趣的战斗。\n\n## 1. 一场战斗怎样发生\n\n扫描可识别足迹、警戒范围、护甲和一次明显弱点；接近后怪物会警告或追踪。玩家选择绕开、伏击、远程引诱或正面交战。普通攻击制造机会，重击破势，闪避避开冲撞，屏障拦截正面攻击，技能用来打断/连携。怪物不会只站在原地扣血。\n\n普通同级单怪目标耗时 8—15 秒，精英 25—45 秒，首领 2—4 分钟；同级普通怪命中玩家约 5—8 次致昏迷。按实际攻击频率调血量，不直接把角色 H/A 拷贝给怪物。高质量同级构筑可显著缩短战斗，但首领读招仍有价值。\n\nR0 一级白盒起点：M00 生命 48、攻击 24、防御 2、攻击间隔约 2.5 秒；M01 生命 160、攻击 36、防御 8；M02 生命 900、攻击 42、防御 12。精英/首领预期玩家已有小级、武器或淬体进展，不按裸装一级强制通关。后续怪物以该生态模板乘境界与小级 B，另调攻击频率/部位，禁止把首领系数重复乘两遍。\n\n普通敌人 AI：巡游 → 发现/警告 → 接近 → 预备攻击 → 生效 → 收招 → 再判断；另有受击、破势、退却、倒地、脱离重置状态。脱离恢复时显示返巢，不让玩家隔着无敌边界无限攻击；已归属的掉落只结算一次。\n\n每境地速与敌人追踪采用 [移动追逐](13_MOVEMENT_AND_PURSUIT.md)：有感知/搜索/失去目标过程，怪物速度按自身境界而非玩家即时速度设置。重量与空间容器按 [储物负重](10_STORAGE_AND_ENCUMBRANCE.md)，短时爆发与后遗症按 [丹药规格](12_MEDICINES_AND_AFTEREFFECTS.md)。\n\n## 2. 操作与动作\n\n|输入|步行战斗|限制|\n|---|---|---|\n|左键|当前武器普通攻击/短连段|持扫描器时先收起再出招，不瞬间多持一物|\n|右键|近战格挡；远程武器瞄准|重武器只有短架势防守，无永久举盾|\n|R / 鼠标中键|蓄力重击 / 已装备武器战技|两个独立动作；可重绑，现有闪避保持 E|\n|E|矢量闪避，后续可切换修真身法|已实现版本的 4 米闪避作为 R0 起点|\n|Q|扫描|高阶可选择解析类功法替换外观，保留信息用途|\n|1 / 2|两个已装备主动功法|冷却跟技能保存，切槽不刷新|\n|滚轮 / 3|切两套武器|战斗换武器有收拔动作，不能同时结算两把攻击|\n|4|快捷恢复物|只用预先选择的物品；不足时明确提示|\n|F / V / Z|交互 / 视角 / 趴下|沿用现版，交互界面屏蔽攻击|\n\n驾驶禁用角色武器攻击；载具武器另开功能。无鼠标捕获时第一次点击只恢复控制，拖拽视角不误开火。第一人称必须有对应握持与挥击，第三人称使用同一武器和命中时间，禁止两个视角不同攻击距离。趴姿允许短刀刺击、弩/发射器射击；长柄/重武器先起蹲并提示，不能贴地穿模大回旋。\n\n## 3. 十大武器\n\n枪指长枪/矛；初期电磁发射器属于科技工具，作为远程教学武器保留，不占修真十类之一。\n\n|ID|类别|战斗定位|基础动作与破绽|材料倾向|\n|---|---|---|---|---|\n|W01|刀|连续近战、压制|两斩一劈，收刀较快，正面破甲一般|铁陨＋兽皮握带|\n|W02|剑|精准、反击、气刃|刺/横斩/格挡反击，需命中弱点|晶陨＋导气纹|\n|W03|长枪|距离、穿刺、守口|直刺/挑击，近身和侧后较弱|钨陨＋韧骨杆|\n|W04|棍|范围、架势控制|横扫/点打/撑跃，无刃伤但破势稳定|空髓木＋陨铁箍|\n|W05|锤|重破甲、击退|慢蓄力，命中回报高，落空硬直长|重陨＋甲片芯|\n|W06|斧|劈甲、持续伤口|短突进重劈，耗体力高|赤陨＋兽筋|\n|W07|戟|中距离群战|刺挑扫，转向受限，狭窄舱室吃亏|合金陨材＋长杆|\n|W08|弓弩|远程、诱敌、部位命中|拉弓/装填占时，有弹药，贴身弱|星砂弓身＋兽筋|\n|W09|拳套/爪|贴身、闪避连携|短距离快击，必须进入敌人危险区|骨爪＋轻陨护节|\n|W10|环/飞刃|御器、回收轨迹、控场|往返路线可挡，飞出期间不能近战格挡|晶陨＋引灵核心|\n\n初片只完成刀、电磁发射器和闪避；后续按枪→剑→锤→弓弩→其余类别扩展。十类有数据与动作合同不等于十类已做好 3D。\n\n## 4. 伤害、破势与防御\n\n伤害管线以[19属性与掌握](19_DAMAGE_ATTRIBUTES_AND_MASTERY.md)为唯一数值基准：技能原始总量=`(C×6^t+a×攻击+b×术强)×掌握倍率`；普通攻击视为0/1/0、重击0/1.8/0，不吃主动武技掌握倍率。扫描弱点+25%进入同类增伤桶，不再独立乘35%。具体武技与反制见[20的60式](20_PLAYER_MARTIAL_ARTS_60.md)。\n\n`护甲减伤=min(0.8,有效防御/(有效防御+40×6^目标境界))`；固定减防→百分比减防→百分比穿透→固定穿透，最低0。几何屏障→抗性/易伤/通用减伤→个人盾→生命。通用减伤封顶60%，与抗性合计封顶85%。这替代旧常数20，必须重新验证怪物战斗时长，历史测试不代表新数值已平衡。\n\n破势独立于血量：普通攻击破势 10，重击 30，精准打断 40；普通怪阈值 60、精英 120、首领分部位 180 起。脱离受击 3 秒后每秒恢复阈值的 10%。破势给约 1.2 秒机会，首领仅局部暴露而非无限眩晕。连续控制抗性递增，5 秒内最多一次完整倒地。\n\n闪避不默认无敌。前摇通过身体姿态、地面扬尘、声响表达；危险体积按武器/肢体真实扫掠检测，每次攻击命中同一对象一次。低帧率也不得漏穿墙。战斗镜头震动可关闭，受击反馈不强行拉玩家朝向。\n\n## 5. 功法与技能成长\n\n角色十境界和技能五熟练阶完全分开。功法品质使用 Q1—Q6，境界门槛由 `requiredRealm` 决定，不能拿 Q6 后天功法当道源能力。基本功法可学习且永久保留，安全点配置 **1 主修、1 辅修、2 主动、2 被动**；武器战技来自装备，主修功法不再另占主动槽。\n\n初始功法族：\n\n|功法|初获|打法|高阶成长方向|\n|---|---|---|---|\n|玄壳导引诀|后天教学|电容与体力效率、引导内息|先天后转真气导引，成长不再依赖服装供电|\n|踏星步|后天闪避模块/先天传承|避险与连携|小转向、双储备、精准避险回气；次数来源唯一|\n|裂锋诀|先天武学教习|单体破甲、刀枪剑战技|弱点贯击与部位击破|\n|镇岳篇|先天护体教习|定向屏障、反击|护盾角度控制，挡住真实伤害才涨熟练|\n|归息经|灵海遗迹|气量、恢复与持久战|脱战恢复/辅助炼丹；不边无成本飞行边无限回气|\n|御物章|元婴传承|飞刃、御器、操纵机关|远控多个目标，数量受锁定与气量限制|\n|化神游空诀|化神突破|肉身御空|气耗效率、空中闪避与安全降落|\n|虚步经 / 星域经|炼虚 / 星劫|空间移动 / 真空护域|明确范围和媒介，不穿越未加载/未解锁星球|\n\n熟练阶沿用入门、小成、精通、大成、圆满；有效实战、训练挑战提升，空放不刷。打坐只提供角色修为，不能离线把所有战技练到圆满。功法书未学习前可交易，学习后书消耗；已掌握内容不可凭空复印出售。\n\n## 6. 陨石锻造\n\n流程：发现陨落/矿脉 → 采集原矿 → NPC 鉴定组成与 Q 品质 → 精炼成对应陨材 → 选武器类别、配方、辅料 → 预览攻防/速度及适用境界 → 扣料锻造 → 检视并装备。未知陨石由场景轨迹/热痕可发现；新陨落避开安全区，不砸毁唯一任务物品。\n\n任意同阶基础武器配方：同阶陨材 6、同阶韧材 2、导气纹 1；弓弩另需兽筋 2，重武器另需陨材 2。韧材允许同阶合成纤维替代，性能预览有差别。标准锻造成本为装备估值的 10%，品质由材料与工匠能力决定，无暗骰碎装。\n\n一把武器最多 1 主词条＋2 副词条；从成分得到可预览效果，不无限洗随机词条。修复消耗同阶陨材；精炼改良不改变武器类型；旧武器分解返还精炼原料的 30%，不能通过打造/分解获利。Q 品质与装备倍率上限引用成长文档。高级工匠接单有真实地区/知识前置，不要求所有 NPC 同时能造全部境界武器。\n\n同层级武器的 Q1—Q6 主属性倍率起点为 1.0/1.10/1.20/1.35/1.55/1.80；词条与其他装备合并后仍受单属性装备倍率1.8上限限制，同词条不能重复乘品质。功法五阶常驻倍率及品质增量统一按19，技能五阶动画按[22](22_COMBAT_3D_AND_ANIMATION.md)；不要同时读取旧倍率表。\n\n## 7. 战斗失败与奖励\n\n野外生命归零为昏迷；播放怪物失去兴趣或救援烟幕撤离，淡出后在已建立救援联系的安全站苏醒。保留境界、功法、唯一物品和背包，不随机掉级。代价为本次未领取掉落遗失、装备 5% 耐久损耗、短暂疗养提示；无钱也能救援，无耐久时仍保留基础训练武器可用。\n\n救援携带范围是人物身上及已绑定储物袋/戒；野外载具和货舱不免费瞬移回营，保留地图位置供取回/拖运。服战力丹形成的后遗症不会因昏迷清零，避免用救援洗掉药物代价。\n\n战斗奖励由怪物实例 ID 一次性生成；尸体交互领取血液/材料，未领取时给范围提示；不存在“再读档一次就再掉一份”。药草、陨石和战斗共享探索经济，但安全练功木桩无可带出掉落。\n","html":"\u003ch1>D3-02 · 战斗、十大武器与功法\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-02-v001.svg\" alt=\"一场可读的战斗\">\u003c/p>\u003cp>\u003cem>图解：学会观察、留资源，再使用重击和武技创造优势。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>抢夺例外：第28的动态劫修可在玩家倒地后完成可打断搜夺，转移真实可触及财物；普通怪昏迷仍保留背包。斩杀动态敌对NPC可取得其当前库存，固定NPC保护规则不变。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>依赖：\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">境界数值\u003c/a>、\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">材料经济\u003c/a>。所有数值为白盒起点，先做 R0 一场有趣的战斗。\u003c/p>\u003ch2>1. 一场战斗怎样发生\u003c/h2>\u003cp>扫描可识别足迹、警戒范围、护甲和一次明显弱点；接近后怪物会警告或追踪。玩家选择绕开、伏击、远程引诱或正面交战。普通攻击制造机会，重击破势，闪避避开冲撞，屏障拦截正面攻击，技能用来打断/连携。怪物不会只站在原地扣血。\u003c/p>\u003cp>普通同级单怪目标耗时 8—15 秒，精英 25—45 秒，首领 2—4 分钟；同级普通怪命中玩家约 5—8 次致昏迷。按实际攻击频率调血量，不直接把角色 H/A 拷贝给怪物。高质量同级构筑可显著缩短战斗，但首领读招仍有价值。\u003c/p>\u003cp>R0 一级白盒起点：M00 生命 48、攻击 24、防御 2、攻击间隔约 2.5 秒；M01 生命 160、攻击 36、防御 8；M02 生命 900、攻击 42、防御 12。精英/首领预期玩家已有小级、武器或淬体进展，不按裸装一级强制通关。后续怪物以该生态模板乘境界与小级 B，另调攻击频率/部位，禁止把首领系数重复乘两遍。\u003c/p>\u003cp>普通敌人 AI：巡游 → 发现/警告 → 接近 → 预备攻击 → 生效 → 收招 → 再判断；另有受击、破势、退却、倒地、脱离重置状态。脱离恢复时显示返巢，不让玩家隔着无敌边界无限攻击；已归属的掉落只结算一次。\u003c/p>\u003cp>每境地速与敌人追踪采用 \u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">移动追逐\u003c/a>：有感知/搜索/失去目标过程，怪物速度按自身境界而非玩家即时速度设置。重量与空间容器按 \u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">储物负重\u003c/a>，短时爆发与后遗症按 \u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">丹药规格\u003c/a>。\u003c/p>\u003ch2>2. 操作与动作\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>输入\u003c/th>\u003cth>步行战斗\u003c/th>\u003cth>限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>左键\u003c/td>\u003ctd>当前武器普通攻击/短连段\u003c/td>\u003ctd>持扫描器时先收起再出招，不瞬间多持一物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右键\u003c/td>\u003ctd>近战格挡；远程武器瞄准\u003c/td>\u003ctd>重武器只有短架势防守，无永久举盾\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R / 鼠标中键\u003c/td>\u003ctd>蓄力重击 / 已装备武器战技\u003c/td>\u003ctd>两个独立动作；可重绑，现有闪避保持 E\u003c/td>\u003c/tr>\u003ctr>\u003ctd>E\u003c/td>\u003ctd>矢量闪避，后续可切换修真身法\u003c/td>\u003ctd>已实现版本的 4 米闪避作为 R0 起点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Q\u003c/td>\u003ctd>扫描\u003c/td>\u003ctd>高阶可选择解析类功法替换外观，保留信息用途\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 / 2\u003c/td>\u003ctd>两个已装备主动功法\u003c/td>\u003ctd>冷却跟技能保存，切槽不刷新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>滚轮 / 3\u003c/td>\u003ctd>切两套武器\u003c/td>\u003ctd>战斗换武器有收拔动作，不能同时结算两把攻击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>快捷恢复物\u003c/td>\u003ctd>只用预先选择的物品；不足时明确提示\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F / V / Z\u003c/td>\u003ctd>交互 / 视角 / 趴下\u003c/td>\u003ctd>沿用现版，交互界面屏蔽攻击\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>驾驶禁用角色武器攻击；载具武器另开功能。无鼠标捕获时第一次点击只恢复控制，拖拽视角不误开火。第一人称必须有对应握持与挥击，第三人称使用同一武器和命中时间，禁止两个视角不同攻击距离。趴姿允许短刀刺击、弩/发射器射击；长柄/重武器先起蹲并提示，不能贴地穿模大回旋。\u003c/p>\u003ch2>3. 十大武器\u003c/h2>\u003cp>枪指长枪/矛；初期电磁发射器属于科技工具，作为远程教学武器保留，不占修真十类之一。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>类别\u003c/th>\u003cth>战斗定位\u003c/th>\u003cth>基础动作与破绽\u003c/th>\u003cth>材料倾向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>W01\u003c/td>\u003ctd>刀\u003c/td>\u003ctd>连续近战、压制\u003c/td>\u003ctd>两斩一劈，收刀较快，正面破甲一般\u003c/td>\u003ctd>铁陨＋兽皮握带\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W02\u003c/td>\u003ctd>剑\u003c/td>\u003ctd>精准、反击、气刃\u003c/td>\u003ctd>刺/横斩/格挡反击，需命中弱点\u003c/td>\u003ctd>晶陨＋导气纹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W03\u003c/td>\u003ctd>长枪\u003c/td>\u003ctd>距离、穿刺、守口\u003c/td>\u003ctd>直刺/挑击，近身和侧后较弱\u003c/td>\u003ctd>钨陨＋韧骨杆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W04\u003c/td>\u003ctd>棍\u003c/td>\u003ctd>范围、架势控制\u003c/td>\u003ctd>横扫/点打/撑跃，无刃伤但破势稳定\u003c/td>\u003ctd>空髓木＋陨铁箍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W05\u003c/td>\u003ctd>锤\u003c/td>\u003ctd>重破甲、击退\u003c/td>\u003ctd>慢蓄力，命中回报高，落空硬直长\u003c/td>\u003ctd>重陨＋甲片芯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W06\u003c/td>\u003ctd>斧\u003c/td>\u003ctd>劈甲、持续伤口\u003c/td>\u003ctd>短突进重劈，耗体力高\u003c/td>\u003ctd>赤陨＋兽筋\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W07\u003c/td>\u003ctd>戟\u003c/td>\u003ctd>中距离群战\u003c/td>\u003ctd>刺挑扫，转向受限，狭窄舱室吃亏\u003c/td>\u003ctd>合金陨材＋长杆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W08\u003c/td>\u003ctd>弓弩\u003c/td>\u003ctd>远程、诱敌、部位命中\u003c/td>\u003ctd>拉弓/装填占时，有弹药，贴身弱\u003c/td>\u003ctd>星砂弓身＋兽筋\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W09\u003c/td>\u003ctd>拳套/爪\u003c/td>\u003ctd>贴身、闪避连携\u003c/td>\u003ctd>短距离快击，必须进入敌人危险区\u003c/td>\u003ctd>骨爪＋轻陨护节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>W10\u003c/td>\u003ctd>环/飞刃\u003c/td>\u003ctd>御器、回收轨迹、控场\u003c/td>\u003ctd>往返路线可挡，飞出期间不能近战格挡\u003c/td>\u003ctd>晶陨＋引灵核心\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>初片只完成刀、电磁发射器和闪避；后续按枪→剑→锤→弓弩→其余类别扩展。十类有数据与动作合同不等于十类已做好 3D。\u003c/p>\u003ch2>4. 伤害、破势与防御\u003c/h2>\u003cp>伤害管线以\u003ca href=\"#19_DAMAGE_ATTRIBUTES_AND_MASTERY.md\">19属性与掌握\u003c/a>为唯一数值基准：技能原始总量=\u003ccode>(C×6^t+a×攻击+b×术强)×掌握倍率\u003c/code>；普通攻击视为0/1/0、重击0/1.8/0，不吃主动武技掌握倍率。扫描弱点+25%进入同类增伤桶，不再独立乘35%。具体武技与反制见\u003ca href=\"#20_PLAYER_MARTIAL_ARTS_60.md\">20的60式\u003c/a>。\u003c/p>\u003cp>\u003ccode>护甲减伤=min(0.8,有效防御/(有效防御+40×6^目标境界))\u003c/code>；固定减防→百分比减防→百分比穿透→固定穿透，最低0。几何屏障→抗性/易伤/通用减伤→个人盾→生命。通用减伤封顶60%，与抗性合计封顶85%。这替代旧常数20，必须重新验证怪物战斗时长，历史测试不代表新数值已平衡。\u003c/p>\u003cp>破势独立于血量：普通攻击破势 10，重击 30，精准打断 40；普通怪阈值 60、精英 120、首领分部位 180 起。脱离受击 3 秒后每秒恢复阈值的 10%。破势给约 1.2 秒机会，首领仅局部暴露而非无限眩晕。连续控制抗性递增，5 秒内最多一次完整倒地。\u003c/p>\u003cp>闪避不默认无敌。前摇通过身体姿态、地面扬尘、声响表达；危险体积按武器/肢体真实扫掠检测，每次攻击命中同一对象一次。低帧率也不得漏穿墙。战斗镜头震动可关闭，受击反馈不强行拉玩家朝向。\u003c/p>\u003ch2>5. 功法与技能成长\u003c/h2>\u003cp>角色十境界和技能五熟练阶完全分开。功法品质使用 Q1—Q6，境界门槛由 \u003ccode>requiredRealm\u003c/code> 决定，不能拿 Q6 后天功法当道源能力。基本功法可学习且永久保留，安全点配置 \u003cstrong>1 主修、1 辅修、2 主动、2 被动\u003c/strong>；武器战技来自装备，主修功法不再另占主动槽。\u003c/p>\u003cp>初始功法族：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>功法\u003c/th>\u003cth>初获\u003c/th>\u003cth>打法\u003c/th>\u003cth>高阶成长方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>玄壳导引诀\u003c/td>\u003ctd>后天教学\u003c/td>\u003ctd>电容与体力效率、引导内息\u003c/td>\u003ctd>先天后转真气导引，成长不再依赖服装供电\u003c/td>\u003c/tr>\u003ctr>\u003ctd>踏星步\u003c/td>\u003ctd>后天闪避模块/先天传承\u003c/td>\u003ctd>避险与连携\u003c/td>\u003ctd>小转向、双储备、精准避险回气；次数来源唯一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>裂锋诀\u003c/td>\u003ctd>先天武学教习\u003c/td>\u003ctd>单体破甲、刀枪剑战技\u003c/td>\u003ctd>弱点贯击与部位击破\u003c/td>\u003c/tr>\u003ctr>\u003ctd>镇岳篇\u003c/td>\u003ctd>先天护体教习\u003c/td>\u003ctd>定向屏障、反击\u003c/td>\u003ctd>护盾角度控制，挡住真实伤害才涨熟练\u003c/td>\u003c/tr>\u003ctr>\u003ctd>归息经\u003c/td>\u003ctd>灵海遗迹\u003c/td>\u003ctd>气量、恢复与持久战\u003c/td>\u003ctd>脱战恢复/辅助炼丹；不边无成本飞行边无限回气\u003c/td>\u003c/tr>\u003ctr>\u003ctd>御物章\u003c/td>\u003ctd>元婴传承\u003c/td>\u003ctd>飞刃、御器、操纵机关\u003c/td>\u003ctd>远控多个目标，数量受锁定与气量限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>化神游空诀\u003c/td>\u003ctd>化神突破\u003c/td>\u003ctd>肉身御空\u003c/td>\u003ctd>气耗效率、空中闪避与安全降落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>虚步经 / 星域经\u003c/td>\u003ctd>炼虚 / 星劫\u003c/td>\u003ctd>空间移动 / 真空护域\u003c/td>\u003ctd>明确范围和媒介，不穿越未加载/未解锁星球\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>熟练阶沿用入门、小成、精通、大成、圆满；有效实战、训练挑战提升，空放不刷。打坐只提供角色修为，不能离线把所有战技练到圆满。功法书未学习前可交易，学习后书消耗；已掌握内容不可凭空复印出售。\u003c/p>\u003ch2>6. 陨石锻造\u003c/h2>\u003cp>流程：发现陨落/矿脉 → 采集原矿 → NPC 鉴定组成与 Q 品质 → 精炼成对应陨材 → 选武器类别、配方、辅料 → 预览攻防/速度及适用境界 → 扣料锻造 → 检视并装备。未知陨石由场景轨迹/热痕可发现；新陨落避开安全区，不砸毁唯一任务物品。\u003c/p>\u003cp>任意同阶基础武器配方：同阶陨材 6、同阶韧材 2、导气纹 1；弓弩另需兽筋 2，重武器另需陨材 2。韧材允许同阶合成纤维替代，性能预览有差别。标准锻造成本为装备估值的 10%，品质由材料与工匠能力决定，无暗骰碎装。\u003c/p>\u003cp>一把武器最多 1 主词条＋2 副词条；从成分得到可预览效果，不无限洗随机词条。修复消耗同阶陨材；精炼改良不改变武器类型；旧武器分解返还精炼原料的 30%，不能通过打造/分解获利。Q 品质与装备倍率上限引用成长文档。高级工匠接单有真实地区/知识前置，不要求所有 NPC 同时能造全部境界武器。\u003c/p>\u003cp>同层级武器的 Q1—Q6 主属性倍率起点为 1.0/1.10/1.20/1.35/1.55/1.80；词条与其他装备合并后仍受单属性装备倍率1.8上限限制，同词条不能重复乘品质。功法五阶常驻倍率及品质增量统一按19，技能五阶动画按\u003ca href=\"#22_COMBAT_3D_AND_ANIMATION.md\">22\u003c/a>；不要同时读取旧倍率表。\u003c/p>\u003ch2>7. 战斗失败与奖励\u003c/h2>\u003cp>野外生命归零为昏迷；播放怪物失去兴趣或救援烟幕撤离，淡出后在已建立救援联系的安全站苏醒。保留境界、功法、唯一物品和背包，不随机掉级。代价为本次未领取掉落遗失、装备 5% 耐久损耗、短暂疗养提示；无钱也能救援，无耐久时仍保留基础训练武器可用。\u003c/p>\u003cp>救援携带范围是人物身上及已绑定储物袋/戒；野外载具和货舱不免费瞬移回营，保留地图位置供取回/拖运。服战力丹形成的后遗症不会因昏迷清零，避免用救援洗掉药物代价。\u003c/p>\u003cp>战斗奖励由怪物实例 ID 一次性生成；尸体交互领取血液/材料，未领取时给范围提示；不存在“再读档一次就再掉一份”。药草、陨石和战斗共享探索经济，但安全练功木桩无可带出掉落。\u003c/p>"},{"file":"03_ALCHEMY_MATERIALS_ECONOMY.md","title":"D3-03 · 丹方、材料、掉落与灵石经济","text":"# D3-03 · 丹方、材料、掉落与灵石经济\n\n\u003c!-- illustrated-overview:start -->\n![材料如何变成实力](media/diagram-03-v001.svg)\n\n*图解：同境三条丹方路线互换，不能喝三遍重复叠加体质。*\n\u003c!-- illustrated-overview:end -->\n\n依赖：[境界](01_REALMS_AND_CULTIVATION.md)。配方、材料和经济均是拟实现数据，不消耗玩家当前资源。\n\n## 1. 两个互不替代的维度\n\n材料层级 T0—T9 对应可承载境界；品质 Q1—Q6 为粗品、凡品、良品、上品、极品、天成。同名材料可有不同 Q，低层级 Q6 不能替代高层级 T8。物品显示“层级·品质·来源”，不只靠颜色。\n\n材料类别：药草、血液、内丹、骨/甲/筋、陨石、环境结晶、灵石、传承书、制成丹药与武器。草药从真实采集点获得，血液/内丹按怪物层级，陨石来自矿点和落星事件；不让所有东西都从同一种宝箱掉。\n\n制剂品质由主料加权质量向下取整，且不得超过最低主料品质 +1，也不得超过 NPC 当前能力；辅料不能把低质主料洗成极品。Q1—Q6 品质系数为 0.65/0.85/1.0/1.25/1.6/2.0。炼丹前固定显示成品品质，无随机失败吞掉稀有材料。\n\n## 2. 三十种境界制剂配方\n\n下表每格是一份制剂的完整主材数量，默认再加纯化溶媒 1（营地有售），整数单位为一份采集物或一管血液；产出恰好 1 份，不能当血液毫升计量。ID 采用 `R{r}-{A/B/C}`。A 炼体偏攻防，B 通脉偏身法，C 凝元偏真气。R0 制剂用于后天淬体；R1—R9 用于突破到该境或替换同境体质槽。\n\n|境界|A 炼体配方（无内丹）|B 通脉配方（无内丹）|C 凝元配方（稀有内丹路线）|\n|---|---|---|---|\n|R0 后天|赤芽淬体液：赤芽草×3、掠兽血×2、铁陨粉×1|清露导引液：月露苔×4、石露×2、铁陨粉×1|微核启灵液：月露苔×2、后天内丹×1、石露×2|\n|R1 先天|开脉进化液：开脉藤×4、棘背兽血×3、铜陨粉×2|先天通息液：息风叶×4、净息晶×2、铜陨粉×2|聚息丹：开脉藤×3、后天内丹×2、净息晶×2|\n|R2 灵海|沧血扩海液：潮髓莲×4、泽鳄血×3、玄陨粉×2|百川通海丹：雾心草×5、潮汐砂×3、玄陨粉×2|凝海丹：潮髓莲×3、先天内丹×2、潮汐砂×3|\n|R3 金丹|赤炉结丹液：焰心芝×5、熔甲兽血×4、赤陨粉×3|九转凝丹液：凝露花×5、地火晶×3、赤陨粉×3|金髓丹：焰心芝×4、灵海内丹×2、地火晶×3|\n|R4 元婴|返胎塑婴液：还魂花×5、镜翼兽血×4、晶陨粉×3|明神育婴丹：空髓木芽×6、镜心晶×3、晶陨粉×3|归一育婴丹：还魂花×4、金丹内丹×2、镜心晶×3|\n|R5 化神|龙髓化神液：神照果×6、雷脊兽血×5、雷陨粉×4|天息化神丹：天息兰×6、风雷髓×4、雷陨粉×4|照神丹：神照果×4、元婴内丹×2、风雷髓×4|\n|R6 炼虚|裂空炼虚液：虚叶草×6、虚渊兽血×5、空陨粉×4|太虚通脉丹：界根藤×6、界隙砂×4、空陨粉×4|虚府丹：虚叶草×4、化神内丹×2、界隙砂×4|\n|R7 合道|万象合道液：道纹芝×7、重环兽血×6、界陨粉×5|同尘合道丹：尘光穗×7、法纹石×5、界陨粉×5|合源丹：道纹芝×5、炼虚内丹×2、法纹石×5|\n|R8 星劫|星髓渡劫液：星露葵×7、噬星鳐血×6、星陨粉×5|曜息渡劫丹：曜心莲×7、劫光晶×5、星陨粉×5|劫元丹：星露葵×5、合道内丹×2、劫光晶×5|\n|R9 道源|源血归道液：源初花×8、界鲸血×6、源陨粉×6|太初归源丹：寂照草×8、原初尘×6、源陨粉×6|道源丹：源初花×6、星劫内丹×3、原初尘×6|\n\n目标境界 R 的材料默认在 **R−1 地区的核心、秘境或精英栖地**可以收齐，不能要求先升级到 R 才能取得所有 R 突破材料。名称不等于必须打 R 的怪；例如 R5 配方的雷脊兽血取自 R4 幼成体。R6 虚叶草、界隙砂和空陨粉在母星 R5 界隙谷有有限、可再生来源，高阶星球更丰富。详细区域见世界表。\n\nR0—R2 普通突破不需要低概率内丹；C 路线可用较多同层破损内丹片替代（10 片=1 枚完整核，片来自精英委托与稀有矿巢，不能把普通石头换核）。NPC 也提供有限委托报酬渠道。内丹路线有构筑价值，不是唯一正确路线。\n\n## 3. 丹方带来的差别\n\n每个境界体质槽的 Q3 基础加成：A 攻击 +4%、防御 +4%、生命 +3%；B 攻击 +2%、普通移速 +3%、真气上限 +3%；C 真气上限 +6%、技能真气耗费 −2%、防御 +2%。乘 Q 系数后存入该槽，最后统一受成长文档上限约束。R0 C 的气量加成先作用于科技电容，R1 后同槽改计真气，不两边叠加。\n\n消耗减免按 `基础消耗×max(0.65,1−减免合计)`，不能零消耗。速度上限与飞行分别结算。某境已用 A-Q2，再用 B-Q5 时移除旧槽、替换为新槽；界面显示净变化，可取消。永久机缘另有唯一记录并计入体质总上限。\n\n淬体可改良，但每次替换均消耗完整配方；突破不强制高品质，不把玩家卡在稀有采集点。Q5/Q6 可以获得显著更好的成长资质，长期通过探索改良旧境槽位，而非因为早期服用普通药永久废号。\n\n## 4. 常用功能丹与炼丹过程\n\n同阶回气丹：本阶通脉药草×2、环境结晶×1、纯化溶媒×1，产 1，Q3 恢复 35% 真气。疗伤丹：本阶炼体草×2、净化血浆×1、溶媒×1，Q3 即时恢复 20% 生命并在 5 秒恢复 15%；与回气/续力共享 45 秒恢复冷却。完整层级适配、八种功能药、爆发后遗症见 [丹药规格](12_MEDICINES_AND_AFTEREFFECTS.md)。R0 对应科技医剂，不声称普通人已有真气。\n\n固定炼丹 NPC 工作流：选已知丹方 → 放主辅材/允许替代品 → 预览层级、品质、效果、服务费、时间 → 确认并原子锁料 → 30—120 秒制作 → 成品进待领取栏 → 领取。离线制作仅按一次时间戳完成，不受打坐 72 小时上限影响，也不自动循环批量生产。取消未开炉订单全退；开炉后不可取消，关闭窗口不丢单。背包满时保留在 NPC 订单栏。\n\n首次教学订单免服务费，普通订单服务费为主材基准估值的 10%，只收钱不吞掉失败材料。丹方知识来自 NPC、遗迹、任务或交易书；同一境三条路线至少一条有确定获取路径。\n\n## 5. 内丹概率与可持续材料\n\n|怪物境界|普通怪完整内丹率|精英率|首领率|\n|---|---:|---:|---:|\n|R0|0.2%|1%|5%|\n|R1|0.5%|2%|12%|\n|R2|1.5%|5%|25%|\n|R3|4%|12%|45%|\n|R4|8%|22%|65%|\n|R5|15%|35%|85%|\n|R6|25%|50%|100%|\n|R7|40%|65%|100%|\n|R8|60%|80%|100%|\n|R9|80%|95%|100%|\n\n一次成功最多 1 枚完整核；首领额外核只作独立一次性任务奖励，不偷偷再乘。普通生物保证血液 1 管，35% 额外 1 管，25% 骨/甲/筋 1 件；精英血液 2—3、身体材料 1—2；首领血液 5、特色材料 2、唯一首杀知识 1。机械敌人掉能芯/合金，绝不掉“机械血液”。血液用自动无菌采集演出，避免每次重复长动画。\n\n普通 Q1/Q2/Q3/Q4 分布为 45/35/18/2%；精英 Q2/Q3/Q4/Q5 为 25/50/23/2%；首领 Q3/Q4/Q5/Q6 为 40/45/14/1%。按每件主材独立质量骰，掉核率和核品质是不同骰。高阶怪更容易有核，但不是天然全部极品。\n\n收获随机种子与实例 ID 在首次生成时保存；读档、击晕后刷新或反复进入区域不改既有掉落。再生群体可产新掉落，但唯一首杀不重复。后天首条主线完整不依赖 0.2% 掉核。\n\n## 6. 灵石面额、用途与交换\n\n|名称|相邻兑换|碎灵石计价|\n|---|---|---:|\n|碎灵石|基础单位|1|\n|初级灵石|1 初级 = 100 碎|100|\n|中级灵石|1 中级 = 100 初级|10,000|\n|高级灵石|1 高级 = 100 中级|1,000,000|\n|极品灵石|1 极品 = 100 高级|100,000,000|\n\n银行/兑换 NPC 按 1:100 双向兑换，无隐藏损耗。价值单位与 Q 品质不同，“极品灵石”是固定面额名称，不是所有物品的 Q5。\n\n灵石用于交易、炼丹/锻造服务、传送、练功加速与回气。回气吸收每次消耗 `ceil(C(r)/5)` 碎灵石价值，需放入吸收槽授权；仅扣实际消耗价值，不吞整颗极品。对大面额晶石的部分吸收，原实例记 `remainingValue` 成为残石，不在野外凭空生成数万颗找零碎石；残石在 NPC 处按剩余价值兑换完整面额。已消耗价值不可出售。钱包是可访问实体价值的派生汇总，负重与银行边界见 [储物规格](10_STORAGE_AND_ENCUMBRANCE.md)。\n\n矿脉能产对应面额：新手碎/少量初级；R2—R3 初级/中级；R4—R5 中级/高级；高级星球高级/极品。采集有脉量和可见工具/环境要求，不无限原地点击；首次确保玩家能赚足基本炼丹服务费。\n\n## 7. 交易基准与闭环\n\n所有材料、药草、功法书、丹药、武器、陨石可与支持该品类的 NPC 买卖或议价交换；唯一主线证据与已学习知识本体不能卖。玩家报价以选择物品和数量进行，不用自由文本承诺直接改库存。\n\n基准单位价：T0 草药 2、血液 3、身体材料 4、陨材 8、完整内丹 120 碎灵石；T 层乘 `5^T`，再乘 Q 系数向上取整。合成药品/武器估值=主辅材价值＋基准服务费。NPC 收购价为估值 60%，卖价 125%；安全区基础溶媒 1 碎灵石。功法书为本层基准内丹价 5 倍起，稀有唯一传承只以探索/指定交换获得。\n\n缺货溢价 0—20%，收购需求加价 0—20%，总卖价始终低于可立即买入再卖出的价格，避免循环套利。基础草、血和矿至少各有一个稳定买家。每个地区 NPC 货币额度/库存分开；游戏内 24 小时补货，离线最多补一次，普通进出菜单不刷货。\n\n补货资格由[世界刷新系统](08_WORLD_DIRECTOR.md)发布，首轮24游戏小时对应120分钟有效游玩，离线至少24小时才最多一次；按[27](27_CONSUMPTION_AND_UNIQUE_WORLD.md)只补已售/授权调拨产生的缺额，旧货和回购物保留，新货有到货来源。唯一原器的买卖仅转移原实例，不能按商品销量制造第二件。草、矿、野怪不共用商店时钟，也不按修炼72小时循环产出。\n\n以物易物按 NPC 收购价值抵买价，差额用灵石结清；预览双边数量、估值、找零，再一次提交。数量、钱包采用 BigInt 或安全整数串序列化，禁止高阶大额丢精度。NPC 无钱显示剩余额度，不吃掉超额货物。\n\n## 8. 机缘与概率的边界\n\n稀有永久机缘只在首次完成一段合格未知区域调查时尝试，初始权重 0.3%，不是每秒/每次杀怪尝试；约每 333 次独立合格发现一次仅为统计期望，不是保底承诺。每种永久机缘只能领取一次，普通刷新不重掷。作者提供模板和候选区域，位置/内容/奖励按角色种子生成保存，不提供所有角色同坐标同奖励的固定机缘。普通洞府另有常规发现频率，详见 [随机洞府](11_CAVES_AND_FORTUNES.md)。\n\n永久体质上限、替代突破和重复已学奖励遵循成长文档。没有机缘也能达到最高境界；机缘使角色特殊，不成为必须先刷三百次的门票。\n","html":"\u003ch1>D3-03 · 丹方、材料、掉落与灵石经济\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-03-v001.svg\" alt=\"材料如何变成实力\">\u003c/p>\u003cp>\u003cem>图解：同境三条丹方路线互换，不能喝三遍重复叠加体质。\u003c/em>\u003c/p>\u003cp>依赖：\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">境界\u003c/a>。配方、材料和经济均是拟实现数据，不消耗玩家当前资源。\u003c/p>\u003ch2>1. 两个互不替代的维度\u003c/h2>\u003cp>材料层级 T0—T9 对应可承载境界；品质 Q1—Q6 为粗品、凡品、良品、上品、极品、天成。同名材料可有不同 Q，低层级 Q6 不能替代高层级 T8。物品显示“层级·品质·来源”，不只靠颜色。\u003c/p>\u003cp>材料类别：药草、血液、内丹、骨/甲/筋、陨石、环境结晶、灵石、传承书、制成丹药与武器。草药从真实采集点获得，血液/内丹按怪物层级，陨石来自矿点和落星事件；不让所有东西都从同一种宝箱掉。\u003c/p>\u003cp>制剂品质由主料加权质量向下取整，且不得超过最低主料品质 +1，也不得超过 NPC 当前能力；辅料不能把低质主料洗成极品。Q1—Q6 品质系数为 0.65/0.85/1.0/1.25/1.6/2.0。炼丹前固定显示成品品质，无随机失败吞掉稀有材料。\u003c/p>\u003ch2>2. 三十种境界制剂配方\u003c/h2>\u003cp>下表每格是一份制剂的完整主材数量，默认再加纯化溶媒 1（营地有售），整数单位为一份采集物或一管血液；产出恰好 1 份，不能当血液毫升计量。ID 采用 \u003ccode>R{r}-{A/B/C}\u003c/code>。A 炼体偏攻防，B 通脉偏身法，C 凝元偏真气。R0 制剂用于后天淬体；R1—R9 用于突破到该境或替换同境体质槽。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>境界\u003c/th>\u003cth>A 炼体配方（无内丹）\u003c/th>\u003cth>B 通脉配方（无内丹）\u003c/th>\u003cth>C 凝元配方（稀有内丹路线）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0 后天\u003c/td>\u003ctd>赤芽淬体液：赤芽草×3、掠兽血×2、铁陨粉×1\u003c/td>\u003ctd>清露导引液：月露苔×4、石露×2、铁陨粉×1\u003c/td>\u003ctd>微核启灵液：月露苔×2、后天内丹×1、石露×2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R1 先天\u003c/td>\u003ctd>开脉进化液：开脉藤×4、棘背兽血×3、铜陨粉×2\u003c/td>\u003ctd>先天通息液：息风叶×4、净息晶×2、铜陨粉×2\u003c/td>\u003ctd>聚息丹：开脉藤×3、后天内丹×2、净息晶×2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2 灵海\u003c/td>\u003ctd>沧血扩海液：潮髓莲×4、泽鳄血×3、玄陨粉×2\u003c/td>\u003ctd>百川通海丹：雾心草×5、潮汐砂×3、玄陨粉×2\u003c/td>\u003ctd>凝海丹：潮髓莲×3、先天内丹×2、潮汐砂×3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3 金丹\u003c/td>\u003ctd>赤炉结丹液：焰心芝×5、熔甲兽血×4、赤陨粉×3\u003c/td>\u003ctd>九转凝丹液：凝露花×5、地火晶×3、赤陨粉×3\u003c/td>\u003ctd>金髓丹：焰心芝×4、灵海内丹×2、地火晶×3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4 元婴\u003c/td>\u003ctd>返胎塑婴液：还魂花×5、镜翼兽血×4、晶陨粉×3\u003c/td>\u003ctd>明神育婴丹：空髓木芽×6、镜心晶×3、晶陨粉×3\u003c/td>\u003ctd>归一育婴丹：还魂花×4、金丹内丹×2、镜心晶×3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R5 化神\u003c/td>\u003ctd>龙髓化神液：神照果×6、雷脊兽血×5、雷陨粉×4\u003c/td>\u003ctd>天息化神丹：天息兰×6、风雷髓×4、雷陨粉×4\u003c/td>\u003ctd>照神丹：神照果×4、元婴内丹×2、风雷髓×4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6 炼虚\u003c/td>\u003ctd>裂空炼虚液：虚叶草×6、虚渊兽血×5、空陨粉×4\u003c/td>\u003ctd>太虚通脉丹：界根藤×6、界隙砂×4、空陨粉×4\u003c/td>\u003ctd>虚府丹：虚叶草×4、化神内丹×2、界隙砂×4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R7 合道\u003c/td>\u003ctd>万象合道液：道纹芝×7、重环兽血×6、界陨粉×5\u003c/td>\u003ctd>同尘合道丹：尘光穗×7、法纹石×5、界陨粉×5\u003c/td>\u003ctd>合源丹：道纹芝×5、炼虚内丹×2、法纹石×5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R8 星劫\u003c/td>\u003ctd>星髓渡劫液：星露葵×7、噬星鳐血×6、星陨粉×5\u003c/td>\u003ctd>曜息渡劫丹：曜心莲×7、劫光晶×5、星陨粉×5\u003c/td>\u003ctd>劫元丹：星露葵×5、合道内丹×2、劫光晶×5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R9 道源\u003c/td>\u003ctd>源血归道液：源初花×8、界鲸血×6、源陨粉×6\u003c/td>\u003ctd>太初归源丹：寂照草×8、原初尘×6、源陨粉×6\u003c/td>\u003ctd>道源丹：源初花×6、星劫内丹×3、原初尘×6\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>目标境界 R 的材料默认在 \u003cstrong>R−1 地区的核心、秘境或精英栖地\u003c/strong>可以收齐，不能要求先升级到 R 才能取得所有 R 突破材料。名称不等于必须打 R 的怪；例如 R5 配方的雷脊兽血取自 R4 幼成体。R6 虚叶草、界隙砂和空陨粉在母星 R5 界隙谷有有限、可再生来源，高阶星球更丰富。详细区域见世界表。\u003c/p>\u003cp>R0—R2 普通突破不需要低概率内丹；C 路线可用较多同层破损内丹片替代（10 片=1 枚完整核，片来自精英委托与稀有矿巢，不能把普通石头换核）。NPC 也提供有限委托报酬渠道。内丹路线有构筑价值，不是唯一正确路线。\u003c/p>\u003ch2>3. 丹方带来的差别\u003c/h2>\u003cp>每个境界体质槽的 Q3 基础加成：A 攻击 +4%、防御 +4%、生命 +3%；B 攻击 +2%、普通移速 +3%、真气上限 +3%；C 真气上限 +6%、技能真气耗费 −2%、防御 +2%。乘 Q 系数后存入该槽，最后统一受成长文档上限约束。R0 C 的气量加成先作用于科技电容，R1 后同槽改计真气，不两边叠加。\u003c/p>\u003cp>消耗减免按 \u003ccode>基础消耗×max(0.65,1−减免合计)\u003c/code>，不能零消耗。速度上限与飞行分别结算。某境已用 A-Q2，再用 B-Q5 时移除旧槽、替换为新槽；界面显示净变化，可取消。永久机缘另有唯一记录并计入体质总上限。\u003c/p>\u003cp>淬体可改良，但每次替换均消耗完整配方；突破不强制高品质，不把玩家卡在稀有采集点。Q5/Q6 可以获得显著更好的成长资质，长期通过探索改良旧境槽位，而非因为早期服用普通药永久废号。\u003c/p>\u003ch2>4. 常用功能丹与炼丹过程\u003c/h2>\u003cp>同阶回气丹：本阶通脉药草×2、环境结晶×1、纯化溶媒×1，产 1，Q3 恢复 35% 真气。疗伤丹：本阶炼体草×2、净化血浆×1、溶媒×1，Q3 即时恢复 20% 生命并在 5 秒恢复 15%；与回气/续力共享 45 秒恢复冷却。完整层级适配、八种功能药、爆发后遗症见 \u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">丹药规格\u003c/a>。R0 对应科技医剂，不声称普通人已有真气。\u003c/p>\u003cp>固定炼丹 NPC 工作流：选已知丹方 → 放主辅材/允许替代品 → 预览层级、品质、效果、服务费、时间 → 确认并原子锁料 → 30—120 秒制作 → 成品进待领取栏 → 领取。离线制作仅按一次时间戳完成，不受打坐 72 小时上限影响，也不自动循环批量生产。取消未开炉订单全退；开炉后不可取消，关闭窗口不丢单。背包满时保留在 NPC 订单栏。\u003c/p>\u003cp>首次教学订单免服务费，普通订单服务费为主材基准估值的 10%，只收钱不吞掉失败材料。丹方知识来自 NPC、遗迹、任务或交易书；同一境三条路线至少一条有确定获取路径。\u003c/p>\u003ch2>5. 内丹概率与可持续材料\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>怪物境界\u003c/th>\u003cth>普通怪完整内丹率\u003c/th>\u003cth>精英率\u003c/th>\u003cth>首领率\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R0\u003c/td>\u003ctd>0.2%\u003c/td>\u003ctd>1%\u003c/td>\u003ctd>5%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R1\u003c/td>\u003ctd>0.5%\u003c/td>\u003ctd>2%\u003c/td>\u003ctd>12%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2\u003c/td>\u003ctd>1.5%\u003c/td>\u003ctd>5%\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3\u003c/td>\u003ctd>4%\u003c/td>\u003ctd>12%\u003c/td>\u003ctd>45%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4\u003c/td>\u003ctd>8%\u003c/td>\u003ctd>22%\u003c/td>\u003ctd>65%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R5\u003c/td>\u003ctd>15%\u003c/td>\u003ctd>35%\u003c/td>\u003ctd>85%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6\u003c/td>\u003ctd>25%\u003c/td>\u003ctd>50%\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R7\u003c/td>\u003ctd>40%\u003c/td>\u003ctd>65%\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R8\u003c/td>\u003ctd>60%\u003c/td>\u003ctd>80%\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R9\u003c/td>\u003ctd>80%\u003c/td>\u003ctd>95%\u003c/td>\u003ctd>100%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>一次成功最多 1 枚完整核；首领额外核只作独立一次性任务奖励，不偷偷再乘。普通生物保证血液 1 管，35% 额外 1 管，25% 骨/甲/筋 1 件；精英血液 2—3、身体材料 1—2；首领血液 5、特色材料 2、唯一首杀知识 1。机械敌人掉能芯/合金，绝不掉“机械血液”。血液用自动无菌采集演出，避免每次重复长动画。\u003c/p>\u003cp>普通 Q1/Q2/Q3/Q4 分布为 45/35/18/2%；精英 Q2/Q3/Q4/Q5 为 25/50/23/2%；首领 Q3/Q4/Q5/Q6 为 40/45/14/1%。按每件主材独立质量骰，掉核率和核品质是不同骰。高阶怪更容易有核，但不是天然全部极品。\u003c/p>\u003cp>收获随机种子与实例 ID 在首次生成时保存；读档、击晕后刷新或反复进入区域不改既有掉落。再生群体可产新掉落，但唯一首杀不重复。后天首条主线完整不依赖 0.2% 掉核。\u003c/p>\u003ch2>6. 灵石面额、用途与交换\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>名称\u003c/th>\u003cth>相邻兑换\u003c/th>\u003cth>碎灵石计价\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>碎灵石\u003c/td>\u003ctd>基础单位\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>初级灵石\u003c/td>\u003ctd>1 初级 = 100 碎\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中级灵石\u003c/td>\u003ctd>1 中级 = 100 初级\u003c/td>\u003ctd>10,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高级灵石\u003c/td>\u003ctd>1 高级 = 100 中级\u003c/td>\u003ctd>1,000,000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>极品灵石\u003c/td>\u003ctd>1 极品 = 100 高级\u003c/td>\u003ctd>100,000,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>银行/兑换 NPC 按 1:100 双向兑换，无隐藏损耗。价值单位与 Q 品质不同，“极品灵石”是固定面额名称，不是所有物品的 Q5。\u003c/p>\u003cp>灵石用于交易、炼丹/锻造服务、传送、练功加速与回气。回气吸收每次消耗 \u003ccode>ceil(C(r)/5)\u003c/code> 碎灵石价值，需放入吸收槽授权；仅扣实际消耗价值，不吞整颗极品。对大面额晶石的部分吸收，原实例记 \u003ccode>remainingValue\u003c/code> 成为残石，不在野外凭空生成数万颗找零碎石；残石在 NPC 处按剩余价值兑换完整面额。已消耗价值不可出售。钱包是可访问实体价值的派生汇总，负重与银行边界见 \u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">储物规格\u003c/a>。\u003c/p>\u003cp>矿脉能产对应面额：新手碎/少量初级；R2—R3 初级/中级；R4—R5 中级/高级；高级星球高级/极品。采集有脉量和可见工具/环境要求，不无限原地点击；首次确保玩家能赚足基本炼丹服务费。\u003c/p>\u003ch2>7. 交易基准与闭环\u003c/h2>\u003cp>所有材料、药草、功法书、丹药、武器、陨石可与支持该品类的 NPC 买卖或议价交换；唯一主线证据与已学习知识本体不能卖。玩家报价以选择物品和数量进行，不用自由文本承诺直接改库存。\u003c/p>\u003cp>基准单位价：T0 草药 2、血液 3、身体材料 4、陨材 8、完整内丹 120 碎灵石；T 层乘 \u003ccode>5^T\u003c/code>，再乘 Q 系数向上取整。合成药品/武器估值=主辅材价值＋基准服务费。NPC 收购价为估值 60%，卖价 125%；安全区基础溶媒 1 碎灵石。功法书为本层基准内丹价 5 倍起，稀有唯一传承只以探索/指定交换获得。\u003c/p>\u003cp>缺货溢价 0—20%，收购需求加价 0—20%，总卖价始终低于可立即买入再卖出的价格，避免循环套利。基础草、血和矿至少各有一个稳定买家。每个地区 NPC 货币额度/库存分开；游戏内 24 小时补货，离线最多补一次，普通进出菜单不刷货。\u003c/p>\u003cp>补货资格由\u003ca href=\"#08_WORLD_DIRECTOR.md\">世界刷新系统\u003c/a>发布，首轮24游戏小时对应120分钟有效游玩，离线至少24小时才最多一次；按\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27\u003c/a>只补已售/授权调拨产生的缺额，旧货和回购物保留，新货有到货来源。唯一原器的买卖仅转移原实例，不能按商品销量制造第二件。草、矿、野怪不共用商店时钟，也不按修炼72小时循环产出。\u003c/p>\u003cp>以物易物按 NPC 收购价值抵买价，差额用灵石结清；预览双边数量、估值、找零，再一次提交。数量、钱包采用 BigInt 或安全整数串序列化，禁止高阶大额丢精度。NPC 无钱显示剩余额度，不吃掉超额货物。\u003c/p>\u003ch2>8. 机缘与概率的边界\u003c/h2>\u003cp>稀有永久机缘只在首次完成一段合格未知区域调查时尝试，初始权重 0.3%，不是每秒/每次杀怪尝试；约每 333 次独立合格发现一次仅为统计期望，不是保底承诺。每种永久机缘只能领取一次，普通刷新不重掷。作者提供模板和候选区域，位置/内容/奖励按角色种子生成保存，不提供所有角色同坐标同奖励的固定机缘。普通洞府另有常规发现频率，详见 \u003ca href=\"#11_CAVES_AND_FORTUNES.md\">随机洞府\u003c/a>。\u003c/p>\u003cp>永久体质上限、替代突破和重复已学奖励遵循成长文档。没有机缘也能达到最高境界；机缘使角色特殊，不成为必须先刷三百次的门票。\u003c/p>"},{"file":"04_WORLD_REGIONS_EXPLORATION.md","title":"D3-04 · 星球、区域、飞行与自由探索","text":"# D3-04 · 星球、区域、飞行与自由探索\n\n\u003c!-- illustrated-overview:start -->\n![地区开放，风险真实](media/diagram-04-v001.svg)\n\n*图解：高手可回新手区；新手也可探索险区，但应准备退路。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n开荒地图补充：普通地表自由进入；迷雾、地宫、阵门与航路可要求实际地图情报/通行序列。地图可购买、测绘、交换或机缘取得，危险能力与境界门槛仍独立检查。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n依赖：[境界](01_REALMS_AND_CULTIVATION.md)、[配方](03_ALCHEMY_MATERIALS_ECONOMY.md)。世界坐标与内容密度必须先验证再扩容。\n\n## 1. 尺度与空间结构\n\n出生星“裂环星”设定半径约 3,200 公里；这是世界观尺度，不宣称整个球体已有可玩内容。首个行星章节的开发目标是 **64×64 公里连通大陆**，用地形流式加载、区域 LOD 和局部坐标支撑；当前 6×6 公里地图作为裂环盆地起点，先扩成有内容的 16×16 公里，再按地区推进至目标大陆。\n\n不能先放大成 4,096 平方公里空地再称完成。步行路线约每 90—150 秒有一种可识别发现，载具主路约每 45—90 秒有景观/分岔/危险提示；这些是布点目标，需实际路测，不是随机弹任务。山脉、峡谷、地下设施形成有用途的路线差异；海面和未制作大陆用自然边界与地图远景表达。\n\n每区有安全站、普通采集带、精英栖地、至少一处可重复探索设施和一项首次独特发现。地区等级只是推荐威胁，不锁进入权限。高阶玩家可回新手区交易、护送、补材料；无低阶修为奖励防止刷低级怪成为最优升级法。\n\n野怪种群、材料成熟和随机事件由 [世界刷新系统](08_WORLD_DIRECTOR.md) 统一安排；固定地形、NPC、传送阵和主线唯一物保留固定层。调度块不是随机撒点地图，必须先有生态候选点和安全通道。\n\n## 2. 母星六个地区\n\n|区域/推荐境界|地形与入口|当地玩法与主要危险|正常成长材料与下一境材料|安全点|\n|---|---|---|---|---|\n|Z0 裂环盆地 / 后天|着陆荒原、坠舰、陨坑|清理掠兽、维修电路、采草、解剖识别；后天巢母守矿道|赤芽草/月露苔、掠兽血、铁陨；边缘温室有开脉藤/息风叶，岩沟有铜陨/净息晶和后天棘背兽|曙光营地|\n|Z1 雾泽古林 / 先天|河谷与巨木，沿盆地旧路进入|泽鳄伏击、孢雾、可净化水道；失落药圃|先天血/核；潮髓莲/雾心草、潮汐砂、玄陨；先天泽鳄提供 R2 配方血|栖息药谷|\n|Z2 赤炉山脉 / 灵海|火山矿道、废采矿站|熔甲兽分段破甲、熔流开路/冷却机关|灵海血/核；焰心芝/凝露花、地火晶、赤陨；灵海熔甲兽血|赤炉工坊|\n|Z3 镜渊裂谷 / 金丹|镜晶峡谷、断桥、地下回声室|假影辨识、桥面控制、地下猎食者；扫描发现安全镜面|金丹血/核；还魂花/空髓木芽、镜心晶、晶陨；金丹镜翼兽血|镜渊驿站|\n|Z4 天穹雷原 / 元婴|高原风暴、浮岩、古观测塔|雷脊兽预警冲撞、临时避雷点、御器穿越裂谷|元婴血/核；神照果/天息兰、风雷髓、雷陨；元婴雷脊兽血|天穹学宫|\n|Z5 界隙荒海 / 化神|大陆终端、失稳界门、盐海裂岛|御空与安全落点、虚渊兽裂隙突袭、恢复古传送阵|化神血/核；虚叶草/界根藤、界隙砂、空陨，化神虚渊兽血，足够母星完成 R6 突破|界门港|\n\n每区普通群体覆盖本境 1—6 级，精英 6—9 级，首领 10 级；边缘有下一地区迁徙个体并清晰警告。具体怪物使用固定种族＋境界参数，不随机把新手入口怪升成化神。Z0 棘背兽是后天变种，进入 Z1 后才常见先天成体；其掉落名字相同但层级标签不同。\n\n## 3. 强敌拦路与救援\n\n越区入口同时提供高阶脚印、遭破坏的载具、远处攻击演示和扫描“危险差距”提示。至少留一条可侦察/潜行路线，但不保证新手能轻松绕过所有高阶内容。打不过可以转身跑、用掩体脱战，避免强制战斗结算锁门。\n\n玩家昏迷后最近已签约救援站派救援员/无人机：本地烟幕拖离或远距信标定位 → 过场回站 → 救援 NPC 说明遭遇 → 修理、整备、重新选路线。未知远区可由沿途驿站先执行救援，之后解锁该安全点但不自动公开整个区域；不强制支付负担不起的费用。\n\n低境越区失败不是掉级刷钱惩罚。保持任务物品与已采材料；只丢未拾取的现场掉落，并损失 5% 装备耐久。救援不把野外怪物凭空杀死，不产生可领击杀奖。连续失败时 NPC 提供弱点、装备和撤退路线建议，不直接送足以碾压高阶区的神器。\n\n## 4. 高阶星球与传送链\n\n|目的地|推荐境界|独特规则|下一境材料|到达/回程|\n|---|---|---|---|---|\n|P1 裂环星|R0—R5，R6 突破在此完成|科技营地到遗民修行的过渡|R1—R6 全部必需材料有路径|界门港是母星回程锚点|\n|P2 空衡星|R6|重力潮汐、空间裂隙、浮陆矿场|道纹芝/尘光穗、重环兽血、法纹石/界陨、炼虚核，用于 R7|炼虚认证＋界门校准；到达即登记回程锚点|\n|P3 万象星|R7|局部领域切换昼夜/重力，古文明站队支线|星露葵/曜心莲、噬星鳐血、劫光晶/星陨、合道核，用于 R8|空衡阵师教学，材料不依赖 R8 星空飞行|\n|P4 寂曜星及陨星带|R8|地表港口＋真空小天体＋星空巨兽|源初花/寂照草、界鲸血、原初尘/源陨、星劫核，用于 R9|传送可到港，星空飞行作为探索方式之一|\n|P5 源寂星域|R9|星核异变、文明级选择、星域生物|顶级构筑、机缘与终局装备|高阶阵网/星域航行，保留原世界回程|\n\n首次跨星传送由任务提供一次能量配额和双向回程券；不发生“钱花完困死外星”。之后费用按距离与阵级显示，可灵石或当地委托抵付。第六境材料在母星有来源，第七境材料在第六境星球有来源，以此类推，禁止环形解锁。\n\n高阶星球先按有限落地区域交付，不同时承诺五颗完整 64×64 公里星球。跨星加载有明确传送过场；不会用几秒飞行假装跨越真实天文距离。\n\n## 5. 飞行阶段与升级\n\n所有高度指相对脚下地表 AGL，建筑屋顶不提高全局飞行上限；洞内遵循天花板碰撞。地形突变需预测落点和限高平滑，不瞬移贴地。\n\n|阶段|解锁/材料方向|最高离地高度|巡航目标|约束|\n|---|---|---:|---:|---|\n|F0 现有助推服|后天起始设备|4.5 m|沿用现有 12 m/s|保持现版，作为低空越障|\n|F1 轻型飞行器|后天维修教学：铁陨/兽筋/电池|30 m|25 m/s|独立电池，基础连续约 90 秒|\n|F2 探索飞行器|先天区域蓝图：玄陨/净息晶|80 m|40 m/s|连续约 180 秒；着陆充电|\n|F3 高空飞行器|灵海/金丹矿场蓝图：赤陨/耐热甲|200 m|65 m/s|连续约 300 秒；风暴区需要防护模块|\n|F4 御器|元婴＋御物章＋载人法器|200 m|70 m/s|借物、耗真气，不能叫肉身御空|\n|F5 御空|化神突破与游空教学|母星常规区 800 m|100 m/s|2% 真气/秒基础，安全下降规则见成长|\n|F6 高空远行|炼虚/合道修习|已制作大气层区最高 3 km|160/250 m/s|离开地表内容前警告；真空仍需交通工具|\n|F8 星空飞行|星劫＋真空护域|在星空场景不使用 AGL|局部巡航 1 km/s|战斗接近时降速，长途使用传送/航行过场|\n\n飞行器高度封顶 200 米是 0—3 境交通的硬设计边界；不能通过品质词条堆到无限高度。载具升级增加能耗效率/载重/续航，独立于人物真气。真气、设备电量都不能在持续推进时自然正收益；地图预估返航成本，低资源提示最近安全点。\n\n宠物为新增的低境交通路线，见 [骑宠空战](17_PET_3D_FLIGHT_AND_ASSETS.md)：例如合格后天天马可载轻装骑手20米飞行，宠物提高后可到骑手上限；R0—R3骑手仍最高200米。载宠与本人御空的许可、灵力和防护分开计算。\n\n## 6. 探索事件，不重复终端模板\n\n- 陨落：远处火迹、热痕和陨坑；选择尽早冒险挖热矿，或等冷却但遇到循热而来的掠食者。材料层级由区域决定。\n- 药草生态：夜间开放、雷击后成熟、需要净化水源等不同规律；观察可找到稳定采法，不只刷随机光点。\n- 猎场：追踪伤痕找到精英，或破坏环境迫其暴露部位；杀怪、驱离和诱开可获得不同但有价值的回报。\n- 遗址：功法壁画、残缺阵纹、旧实验日志互相印证，奖励知识/配方/地图信息；少数有传承试炼。\n- 偶遇：迁徙商人、求援远征队、误入的高阶修士；帮助或交换可揭示下一探索机会，没有固定每日 NPC 刷新坐标。\n- 稀有机缘：地脉倒流、星辉灌体、古魂考验；事件实例唯一，结果与选择相关，永久收益有上限。\n\n探索洞府的入口、布局、守卫与奖励按角色种子生成，不是所有角色共用一套固定机缘；先天可登记私人洞府，提供仓储和修炼。模板、普通洞府发现保底与极稀有永久机缘的区别见 [洞府规格](11_CAVES_AND_FORTUNES.md)。\n\n昼夜与生态条件用游戏时间推进，但不要求现实凌晨上线。传闻只说范围和现象，不自动在地图标出所有极品位置。\n\n## 7. 第九境毁星的实际玩法\n\n毁星是高阶能力证明和有后果的长事件：扫描星核 → 选择保护/疏散或封印方案 → 击败星核守卫 → 稳定多处能量节点 → 长时间蓄势且可被打断 → 二次确认目标与后果 → 持久化星球状态并播放破裂过程。消耗专门星核资源及大部分真气，不绑定普通攻击键。\n\n首个可毁目标为**无常住 NPC、可替代资源产地的死寂试炼星**，不允许随手摧毁承载唯一 NPC/主线的母星。后续可扩展经疏散与替代内容验证的目标。毁星后资源变为陨星带、路线与档案改变，原地地表入口关闭且存档一致；未进入事件的星球绝不跟着一起清空。\n\n这不降低第九境的设定能力，而是把毁星做成玩家真正可完成和可承担后果的内容。若未来开放有人居住星球，需先补足分支剧情、NPC 迁居、任务替代和明确确认，另立开发切片。\n","html":"\u003ch1>D3-04 · 星球、区域、飞行与自由探索\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-04-v001.svg\" alt=\"地区开放，风险真实\">\u003c/p>\u003cp>\u003cem>图解：高手可回新手区；新手也可探索险区，但应准备退路。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>开荒地图补充：普通地表自由进入；迷雾、地宫、阵门与航路可要求实际地图情报/通行序列。地图可购买、测绘、交换或机缘取得，危险能力与境界门槛仍独立检查。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>依赖：\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">境界\u003c/a>、\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">配方\u003c/a>。世界坐标与内容密度必须先验证再扩容。\u003c/p>\u003ch2>1. 尺度与空间结构\u003c/h2>\u003cp>出生星“裂环星”设定半径约 3,200 公里；这是世界观尺度，不宣称整个球体已有可玩内容。首个行星章节的开发目标是 \u003cstrong>64×64 公里连通大陆\u003c/strong>，用地形流式加载、区域 LOD 和局部坐标支撑；当前 6×6 公里地图作为裂环盆地起点，先扩成有内容的 16×16 公里，再按地区推进至目标大陆。\u003c/p>\u003cp>不能先放大成 4,096 平方公里空地再称完成。步行路线约每 90—150 秒有一种可识别发现，载具主路约每 45—90 秒有景观/分岔/危险提示；这些是布点目标，需实际路测，不是随机弹任务。山脉、峡谷、地下设施形成有用途的路线差异；海面和未制作大陆用自然边界与地图远景表达。\u003c/p>\u003cp>每区有安全站、普通采集带、精英栖地、至少一处可重复探索设施和一项首次独特发现。地区等级只是推荐威胁，不锁进入权限。高阶玩家可回新手区交易、护送、补材料；无低阶修为奖励防止刷低级怪成为最优升级法。\u003c/p>\u003cp>野怪种群、材料成熟和随机事件由 \u003ca href=\"#08_WORLD_DIRECTOR.md\">世界刷新系统\u003c/a> 统一安排；固定地形、NPC、传送阵和主线唯一物保留固定层。调度块不是随机撒点地图，必须先有生态候选点和安全通道。\u003c/p>\u003ch2>2. 母星六个地区\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>区域/推荐境界\u003c/th>\u003cth>地形与入口\u003c/th>\u003cth>当地玩法与主要危险\u003c/th>\u003cth>正常成长材料与下一境材料\u003c/th>\u003cth>安全点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Z0 裂环盆地 / 后天\u003c/td>\u003ctd>着陆荒原、坠舰、陨坑\u003c/td>\u003ctd>清理掠兽、维修电路、采草、解剖识别；后天巢母守矿道\u003c/td>\u003ctd>赤芽草/月露苔、掠兽血、铁陨；边缘温室有开脉藤/息风叶，岩沟有铜陨/净息晶和后天棘背兽\u003c/td>\u003ctd>曙光营地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z1 雾泽古林 / 先天\u003c/td>\u003ctd>河谷与巨木，沿盆地旧路进入\u003c/td>\u003ctd>泽鳄伏击、孢雾、可净化水道；失落药圃\u003c/td>\u003ctd>先天血/核；潮髓莲/雾心草、潮汐砂、玄陨；先天泽鳄提供 R2 配方血\u003c/td>\u003ctd>栖息药谷\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z2 赤炉山脉 / 灵海\u003c/td>\u003ctd>火山矿道、废采矿站\u003c/td>\u003ctd>熔甲兽分段破甲、熔流开路/冷却机关\u003c/td>\u003ctd>灵海血/核；焰心芝/凝露花、地火晶、赤陨；灵海熔甲兽血\u003c/td>\u003ctd>赤炉工坊\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z3 镜渊裂谷 / 金丹\u003c/td>\u003ctd>镜晶峡谷、断桥、地下回声室\u003c/td>\u003ctd>假影辨识、桥面控制、地下猎食者；扫描发现安全镜面\u003c/td>\u003ctd>金丹血/核；还魂花/空髓木芽、镜心晶、晶陨；金丹镜翼兽血\u003c/td>\u003ctd>镜渊驿站\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z4 天穹雷原 / 元婴\u003c/td>\u003ctd>高原风暴、浮岩、古观测塔\u003c/td>\u003ctd>雷脊兽预警冲撞、临时避雷点、御器穿越裂谷\u003c/td>\u003ctd>元婴血/核；神照果/天息兰、风雷髓、雷陨；元婴雷脊兽血\u003c/td>\u003ctd>天穹学宫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Z5 界隙荒海 / 化神\u003c/td>\u003ctd>大陆终端、失稳界门、盐海裂岛\u003c/td>\u003ctd>御空与安全落点、虚渊兽裂隙突袭、恢复古传送阵\u003c/td>\u003ctd>化神血/核；虚叶草/界根藤、界隙砂、空陨，化神虚渊兽血，足够母星完成 R6 突破\u003c/td>\u003ctd>界门港\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每区普通群体覆盖本境 1—6 级，精英 6—9 级，首领 10 级；边缘有下一地区迁徙个体并清晰警告。具体怪物使用固定种族＋境界参数，不随机把新手入口怪升成化神。Z0 棘背兽是后天变种，进入 Z1 后才常见先天成体；其掉落名字相同但层级标签不同。\u003c/p>\u003ch2>3. 强敌拦路与救援\u003c/h2>\u003cp>越区入口同时提供高阶脚印、遭破坏的载具、远处攻击演示和扫描“危险差距”提示。至少留一条可侦察/潜行路线，但不保证新手能轻松绕过所有高阶内容。打不过可以转身跑、用掩体脱战，避免强制战斗结算锁门。\u003c/p>\u003cp>玩家昏迷后最近已签约救援站派救援员/无人机：本地烟幕拖离或远距信标定位 → 过场回站 → 救援 NPC 说明遭遇 → 修理、整备、重新选路线。未知远区可由沿途驿站先执行救援，之后解锁该安全点但不自动公开整个区域；不强制支付负担不起的费用。\u003c/p>\u003cp>低境越区失败不是掉级刷钱惩罚。保持任务物品与已采材料；只丢未拾取的现场掉落，并损失 5% 装备耐久。救援不把野外怪物凭空杀死，不产生可领击杀奖。连续失败时 NPC 提供弱点、装备和撤退路线建议，不直接送足以碾压高阶区的神器。\u003c/p>\u003ch2>4. 高阶星球与传送链\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>目的地\u003c/th>\u003cth>推荐境界\u003c/th>\u003cth>独特规则\u003c/th>\u003cth>下一境材料\u003c/th>\u003cth>到达/回程\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>P1 裂环星\u003c/td>\u003ctd>R0—R5，R6 突破在此完成\u003c/td>\u003ctd>科技营地到遗民修行的过渡\u003c/td>\u003ctd>R1—R6 全部必需材料有路径\u003c/td>\u003ctd>界门港是母星回程锚点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P2 空衡星\u003c/td>\u003ctd>R6\u003c/td>\u003ctd>重力潮汐、空间裂隙、浮陆矿场\u003c/td>\u003ctd>道纹芝/尘光穗、重环兽血、法纹石/界陨、炼虚核，用于 R7\u003c/td>\u003ctd>炼虚认证＋界门校准；到达即登记回程锚点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P3 万象星\u003c/td>\u003ctd>R7\u003c/td>\u003ctd>局部领域切换昼夜/重力，古文明站队支线\u003c/td>\u003ctd>星露葵/曜心莲、噬星鳐血、劫光晶/星陨、合道核，用于 R8\u003c/td>\u003ctd>空衡阵师教学，材料不依赖 R8 星空飞行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P4 寂曜星及陨星带\u003c/td>\u003ctd>R8\u003c/td>\u003ctd>地表港口＋真空小天体＋星空巨兽\u003c/td>\u003ctd>源初花/寂照草、界鲸血、原初尘/源陨、星劫核，用于 R9\u003c/td>\u003ctd>传送可到港，星空飞行作为探索方式之一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>P5 源寂星域\u003c/td>\u003ctd>R9\u003c/td>\u003ctd>星核异变、文明级选择、星域生物\u003c/td>\u003ctd>顶级构筑、机缘与终局装备\u003c/td>\u003ctd>高阶阵网/星域航行，保留原世界回程\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>首次跨星传送由任务提供一次能量配额和双向回程券；不发生“钱花完困死外星”。之后费用按距离与阵级显示，可灵石或当地委托抵付。第六境材料在母星有来源，第七境材料在第六境星球有来源，以此类推，禁止环形解锁。\u003c/p>\u003cp>高阶星球先按有限落地区域交付，不同时承诺五颗完整 64×64 公里星球。跨星加载有明确传送过场；不会用几秒飞行假装跨越真实天文距离。\u003c/p>\u003ch2>5. 飞行阶段与升级\u003c/h2>\u003cp>所有高度指相对脚下地表 AGL，建筑屋顶不提高全局飞行上限；洞内遵循天花板碰撞。地形突变需预测落点和限高平滑，不瞬移贴地。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>解锁/材料方向\u003c/th>\u003cth>最高离地高度\u003c/th>\u003cth>巡航目标\u003c/th>\u003cth>约束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>F0 现有助推服\u003c/td>\u003ctd>后天起始设备\u003c/td>\u003ctd>4.5 m\u003c/td>\u003ctd>沿用现有 12 m/s\u003c/td>\u003ctd>保持现版，作为低空越障\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F1 轻型飞行器\u003c/td>\u003ctd>后天维修教学：铁陨/兽筋/电池\u003c/td>\u003ctd>30 m\u003c/td>\u003ctd>25 m/s\u003c/td>\u003ctd>独立电池，基础连续约 90 秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F2 探索飞行器\u003c/td>\u003ctd>先天区域蓝图：玄陨/净息晶\u003c/td>\u003ctd>80 m\u003c/td>\u003ctd>40 m/s\u003c/td>\u003ctd>连续约 180 秒；着陆充电\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F3 高空飞行器\u003c/td>\u003ctd>灵海/金丹矿场蓝图：赤陨/耐热甲\u003c/td>\u003ctd>200 m\u003c/td>\u003ctd>65 m/s\u003c/td>\u003ctd>连续约 300 秒；风暴区需要防护模块\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F4 御器\u003c/td>\u003ctd>元婴＋御物章＋载人法器\u003c/td>\u003ctd>200 m\u003c/td>\u003ctd>70 m/s\u003c/td>\u003ctd>借物、耗真气，不能叫肉身御空\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F5 御空\u003c/td>\u003ctd>化神突破与游空教学\u003c/td>\u003ctd>母星常规区 800 m\u003c/td>\u003ctd>100 m/s\u003c/td>\u003ctd>2% 真气/秒基础，安全下降规则见成长\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F6 高空远行\u003c/td>\u003ctd>炼虚/合道修习\u003c/td>\u003ctd>已制作大气层区最高 3 km\u003c/td>\u003ctd>160/250 m/s\u003c/td>\u003ctd>离开地表内容前警告；真空仍需交通工具\u003c/td>\u003c/tr>\u003ctr>\u003ctd>F8 星空飞行\u003c/td>\u003ctd>星劫＋真空护域\u003c/td>\u003ctd>在星空场景不使用 AGL\u003c/td>\u003ctd>局部巡航 1 km/s\u003c/td>\u003ctd>战斗接近时降速，长途使用传送/航行过场\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>飞行器高度封顶 200 米是 0—3 境交通的硬设计边界；不能通过品质词条堆到无限高度。载具升级增加能耗效率/载重/续航，独立于人物真气。真气、设备电量都不能在持续推进时自然正收益；地图预估返航成本，低资源提示最近安全点。\u003c/p>\u003cp>宠物为新增的低境交通路线，见 \u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">骑宠空战\u003c/a>：例如合格后天天马可载轻装骑手20米飞行，宠物提高后可到骑手上限；R0—R3骑手仍最高200米。载宠与本人御空的许可、灵力和防护分开计算。\u003c/p>\u003ch2>6. 探索事件，不重复终端模板\u003c/h2>\u003cul>\u003cli>陨落：远处火迹、热痕和陨坑；选择尽早冒险挖热矿，或等冷却但遇到循热而来的掠食者。材料层级由区域决定。\u003c/li>\u003cli>药草生态：夜间开放、雷击后成熟、需要净化水源等不同规律；观察可找到稳定采法，不只刷随机光点。\u003c/li>\u003cli>猎场：追踪伤痕找到精英，或破坏环境迫其暴露部位；杀怪、驱离和诱开可获得不同但有价值的回报。\u003c/li>\u003cli>遗址：功法壁画、残缺阵纹、旧实验日志互相印证，奖励知识/配方/地图信息；少数有传承试炼。\u003c/li>\u003cli>偶遇：迁徙商人、求援远征队、误入的高阶修士；帮助或交换可揭示下一探索机会，没有固定每日 NPC 刷新坐标。\u003c/li>\u003cli>稀有机缘：地脉倒流、星辉灌体、古魂考验；事件实例唯一，结果与选择相关，永久收益有上限。\u003c/li>\u003c/ul>\u003cp>探索洞府的入口、布局、守卫与奖励按角色种子生成，不是所有角色共用一套固定机缘；先天可登记私人洞府，提供仓储和修炼。模板、普通洞府发现保底与极稀有永久机缘的区别见 \u003ca href=\"#11_CAVES_AND_FORTUNES.md\">洞府规格\u003c/a>。\u003c/p>\u003cp>昼夜与生态条件用游戏时间推进，但不要求现实凌晨上线。传闻只说范围和现象，不自动在地图标出所有极品位置。\u003c/p>\u003ch2>7. 第九境毁星的实际玩法\u003c/h2>\u003cp>毁星是高阶能力证明和有后果的长事件：扫描星核 → 选择保护/疏散或封印方案 → 击败星核守卫 → 稳定多处能量节点 → 长时间蓄势且可被打断 → 二次确认目标与后果 → 持久化星球状态并播放破裂过程。消耗专门星核资源及大部分真气，不绑定普通攻击键。\u003c/p>\u003cp>首个可毁目标为\u003cstrong>无常住 NPC、可替代资源产地的死寂试炼星\u003c/strong>，不允许随手摧毁承载唯一 NPC/主线的母星。后续可扩展经疏散与替代内容验证的目标。毁星后资源变为陨星带、路线与档案改变，原地地表入口关闭且存档一致；未进入事件的星球绝不跟着一起清空。\u003c/p>\u003cp>这不降低第九境的设定能力，而是把毁星做成玩家真正可完成和可承担后果的内容。若未来开放有人居住星球，需先补足分支剧情、NPC 迁居、任务替代和明确确认，另立开发切片。\u003c/p>"},{"file":"05_NPCS_DIALOGUE_TASKS.md","title":"D3-05 · 68 名固定 NPC、对话与功能","text":"# D3-05 · 68 名固定 NPC、对话与功能\n\n\u003c!-- illustrated-overview:start -->\n![和NPC交谈之后](media/diagram-05-v002.svg)\n\n*图解：共68名固定NPC；关键知识不能因一处宗门倒塌永久丢失。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n固定NPC现为68名（含29新增30名）。新增RN01—RN12动态游历模板不计入固定人数，实际人物有姓名、目标、背包、隐藏倾向与永久死亡记录；采集、竞争、伏击、搜夺、销赃与换人补位使用独立体系。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n依赖：[世界](04_WORLD_REGIONS_EXPLORATION.md)、[炼丹交易](03_ALCHEMY_MATERIALS_ECONOMY.md)、[宗门](23_SECTS_NPCS_MISSIONS_AND_DUELS.md)。宠物及宗门补充后固定名单共 **68 名**：原母星28名、原高阶星域10名，新增十大顶层领袖和20名跨区域支门派人物。重复路人、敌对人形、随机旅商不计入固定名额；初片只制作必要的前4名和教习，其余随对应切片接入。\n\n## 1. 母星 28 名\n\n|ID / 姓名|常驻地 / 身份|具体功能|解锁与边界|\n|---|---|---|---|\n|N01 林澈|曙光营地 / 远征领队|主线、首次探索目标、营地服务介绍|开局可见，不把所有支线自动灌进日志|\n|N02 苏禾|曙光营地 / 生物医师|后天淬体与先天制剂、疗伤、血样知识|基础采集后教学；炼制 R0—R1、最高 Q3|\n|N03 韩铸|曙光营地 / 机械锻造师|铁陨精炼、刀与发射器、修理、F1 飞行器|回收铁陨解锁；服务 R0—R1、最高 Q3|\n|N04 许衡|曙光营地 / 商站管事|材料收购、基础补给、1:100 灵石兑换、仓库|不卖唯一证据；库存与收购额度可见|\n|N05 闻止|曙光营地 / 导引教习|打坐、练功室、72 小时设置、突破讲解|完成一次血样调查即可，首次训练免费|\n|N06 祁岳|曙光营地 / 战技教官|刀法、闪避、格挡、训练挑战|训练不产可带出材料，不空放刷境界|\n|N07 唐岚|曙光营地 / 救援队长|昏迷救援、危险区说明、建立野外救援联系|开局签约，破产也能回安全区|\n|N08 阿洛|曙光营地 / 勘测机器人|扫描图鉴、陨落线索、地图与异常声纹研究|图鉴只公开已见对象；不先剧透全星球|\n|N09 沈青萝|栖息药谷 / 遗民药师|药草采法、炼丹、先天到灵海的知识|服务 R1—R2、最高 Q4；首次解释修行体系|\n|N10 陆行舟|栖息药谷 / 远游修士|传授功法、十境界传闻、非丹药传承路线|玩家可早遇见；高境细节随证据展开|\n|N11 岳九锻|赤炉工坊 / 炼器师|R2—R3 武器、甲具、F2/F3 飞行器|最高 Q4；高空模块须热区矿材|\n|N12 玄仪|镜渊驿站 / 丹阵师|R3—R4 丹方、传承试炼、镜阵破解|最高 Q5；副本入口与炼丹分别操作|\n|N13 白砚|镜渊驿站 / 典籍商|功法书、遗物鉴定、材料交换委托|未知书可鉴定再学，不静默消耗|\n|N14 云栖|天穹学宫 / 御器导师|御器、御空预修、R4—R5 制剂与药圃|最高 Q5；R5 才真正授予肉身飞行|\n|N15 墨临|界门港 / 星门阵师|跨星认证、阵网校准、首次双向券|达到 R6 后可跨星；R5 可先修阵和找材料|\n|N16 宁照|界门港 / 化神炼丹师|R5—R6 制剂、Q6 精炼、突破炼虚|R6 入境材料母星可获得，避免传送死锁|\n|N25 林蘅|曙光营地 / 灵兽医师|宠物蛋鉴定/孵化、收服教学、契约、兽用制剂、基础兽诀和治疗|后天完成血样/生态调查可见；高阶契约委托与各星NPC协作|\n|N26 织翎|栖息药谷 / 兽装师|宠物服装、骑具适配、个人纹章、低境载飞教学|首次流动服务可在营地预约教学，主工坊在药谷；不要求先天才能学后天骑宠|\n|N27 顾行简|玄衡武院 / 院正|宗籍、立宗登记、识阵教学|R0传闻、R1学阵、R2五级立宗|\n|N28 叶知锋|玄衡武院 / 演武执事|武技、贡献兑换、比武|外门R0六级|\n|N29 沈清岳|青岚剑宗 / 传剑长老|剑风传承、验证|R1五级及试剑|\n|N30 乔听澜|青岚剑宗 / 巡山执事|巡逻护送、风眼材料|危险地区真实可达|\n|N31 炎百炼|赤炉门 / 炉主|锻造研究、阵器|R2与锻造教学|\n|N32 罗星砂|赤炉门 / 矿务执事|采矿治理、锻材兑换|任务信誉与成本预览|\n|N33 温素问|回春谷 / 谷主|功能丹谱、药圃、疗养|R1三级救人试炼|\n|N34 何采苓|回春谷 / 药圃执事|采集、补种、药材兑换|真实物品上交|\n|N35 牧云生|御灵山 / 长老|兽诀、契约、载宠训练|R1安抚任务，不要求稀有宠|\n|N36 鹿小满|御灵山 / 灵兽执事|饲料、失宠救援、鞍具|保留个体身份|\n\n## 2. 高阶 10 名\n\n|ID / 姓名|地点|功能|服务范围|\n|---|---|---|---|\n|N17 裴虚|空衡星 / 虚衡丹院|炼虚/合道丹方、空间试炼、稀有草交换|R6—R7 制剂，最高 Q6|\n|N18 石问天|空衡星 / 浮陆炉坊|高阶十大类武器、空间法器、当地修理|R6—R7 装備，最高 Q6|\n|N19 洛尘|万象星 / 合道观|领域功法、R8 突破制剂、传承突破|R7—R8 制剂，最高 Q6|\n|N20 商无界|万象星 / 万象商会|高级物品买卖、灵石兑换、跨星委托、仓库|非联网拍卖行；稀品有限库存|\n|N21 星岚|寂曜星 / 星港|星空飞行教学、真空救援、星兽图鉴、R9 丹方|R8—R9 制剂，最高 Q6；先给安全训练场|\n|N22 赤衡|寂曜星 / 星炉|星陨精炼、R8—R9 武器、星空装备|最高 Q6；最顶级配方需星兽与遗迹材料|\n|N23 守源者·衡|源寂星域 / 源庭|道源突破复核、星核事件、毁星/封印选择|复核与试炼，不重复卖一套必要突破药|\n|N24 时缄|源寂星域 / 归航档案馆|终局探索、旧星回程、机缘档案、传承置换|保证主线与回程可追溯，不无限出售永久机缘|\n|N37 裴观辰|空衡星 / 太虚星宫长老|空间术、星门阵图|R6安全传送测绘|\n|N38 闻星渡|空衡星 / 太虚星宫远征执事|跨星护航、星材兑换、比武联络|真实远征事件去重|\n\n## 2.1 十大势力新增30名\n\n以下为[29顶层势力](29_SUPREME_FACTIONS_AND_STORY.md)的名册同步，原38名不重编号；新支线人物的死亡与继任规则按29。\n\n|ID / 姓名|所属|功能/合作线|等级或冲突边界|\n|---|---|---|---|\n|N39 姬天衡·神皇|神国·昊宸神国 / 最高领袖|组织决策、终局事件、道源强度|99级 / 大成（九级）；不作为低阶免费队友|\n|N40 玄微子·太初老祖|洞天·太初玄都洞天 / 最高领袖|组织决策、终局事件、道源强度|98级 / 大成（八级）；不作为低阶免费队友|\n|N41 顾长渊·归墟老祖|洞天·归墟洞天 / 最高领袖|组织决策、终局事件、道源强度|97级 / 大成（七级）；不作为低阶免费队友|\n|N42 闻道衡·院长|学府·太一学府 / 最高领袖|组织决策、终局事件、道源强度|97级 / 大成（七级）；不作为低阶免费队友|\n|N43 叶知微·院长|学府·万象学府 / 最高领袖|组织决策、终局事件、道源强度|96级 / 中阶顶峰（六级）；不作为低阶免费队友|\n|N44 墨天机·院长|学府·天工学府 / 最高领袖|组织决策、终局事件、道源强度|96级 / 中阶顶峰（六级）；不作为低阶免费队友|\n|N45 陆焚霄·圣主|圣地·赤霄圣地 / 最高领袖|组织决策、终局事件、道源强度|95级 / 中阶（五级）；不作为低阶免费队友|\n|N46 苏映寒·圣主|圣地·瑶光圣地 / 最高领袖|组织决策、终局事件、道源强度|95级 / 中阶（五级）；不作为低阶免费队友|\n|N47 闻无相·圣主|圣地·无相圣地 / 最高领袖|组织决策、终局事件、道源强度|95级 / 中阶（五级）；不作为低阶免费队友|\n|N48 牧天青·圣主|圣地·御灵圣地 / 最高领袖|组织决策、终局事件、道源强度|95级 / 中阶（五级）；不作为低阶免费队友|\n|N49 裴照野·巡边使，R2三级|SS01 镇辰府 / 昊宸|护送灾民，和主角并肩守撤离口|主角确实劫掠平民或伪造军令后追捕；不会仅因拒绝入伍攻击|\n|N50 姬玄策·监察使，R4二级|SS02 天衡司 / 昊宸|合作查星门走私，交换通行证据|受密令没收未认主禁器，遭拒后可进入有预告争夺；可用证据说服其违令|\n|N51 宁守真·守印弟子，R1七级|SS03 守一门 / 太初|修复裂缝，教正确封印顺序|主角破坏有证实危险的封印会阻止，不因学其他宗功法敌视|\n|N52 沈藏岳·藏卷执事，R3三级|SS04 藏虚观 / 太初|查找失窃残卷、共同过镜阵|本人私吞传承，发现主角持关键残图时可能伏击夺图|\n|N53 顾听潮·渡舟队长，R2一级|SS05 归潮盟 / 归墟|救助被重税拖垮的商队，提供绕行图|玩家出卖安全路线致难民受害后绝交/交战|\n|N54 陆沉锋·先锋，R3一级|SS06 沉星剑门 / 归墟|袭击掠夺灵脉的非法采场|将无辜补给船也列目标，主角阻止其爆破后可能决斗|\n|N55 温知行·游学弟子，R1四级|SS07 明心书院 / 太一|一起做遗迹辨伪、保全证据|主角杀伤其同伴且拒绝解释，关系下降并依法追责|\n|N56 卫争鸣·试剑弟子，R2五级|SS08 问道剑院 / 太一|先比武再共闯剑阵，互相救援可成挚友|争排名先走规则内比武；只有私人仇怨升级才野外攻击|\n|N57 叶听澜·勘图师，R2二级|SS09 星图院 / 万象|共同测绘地宫、出售经核实地图|主角泄露避难点给劫修后拒绝合作，不无证据全图通缉|\n|N58 许照尘·鉴图执事，R3四级|SS10 千鉴阁 / 万象|鉴定残图，追索赃物流转|为偿债伪造一条安全路线，暴露后可能逃走或雇劫修灭证|\n|N59 墨承砚·炉师，R2三级|SS11 星炉宗 / 天工|修炉、击退矿区怪群，共建节能阵器|主角掠走救援用核心导致停炉后讨还，可赔偿和解|\n|N60 韩断机·试验执事，R3五级|SS12 百机门 / 天工|合作测试无伤害兽用鞍具|偷偷使用强制抽灵装置，被揭发后带机关武器攻击|\n|N61 岳扶危·护航统领，R3三级|SS13 烽岳宗 / 赤霄|保卫航路，救两方伤员，重视守约|会因上级征用令与主角对峙，可通过替代物资避免冲突|\n|N62 炎夺岳·夺矿执事，R4一级|SS14 血铸门 / 赤霄|迫于兽潮可暂时与主角合作|觊觎主角陨核/原器，主动布设夺宝伏击，是可斩杀的长期对手|\n|N63 苏晚照·行医弟子，R1五级|SS15 济世山 / 瑶光|采药、救援、护送伤员，可同行治疗|目击主角滥杀后离队，必要时保护受害者对抗主角|\n|N64 柳寒灯·药库执事，R3二级|SS16 寒灯谷 / 瑶光|采购短缺药材，提供可靠疗伤线索|倒卖赈灾丹药，主角掌握货单后可能找人抢夺证据|\n|N65 阮渡影·潜行弟子，R2四级|SS17 渡影楼 / 无相|救回被盗兽卵、揭穿假旗袭击，可能背叛本门保护主角|主角出卖其真实身份后失去信任，生死追捕由实际证据触发|\n|N66 莫无声·猎宝人，R4三级|SS18 无面阁 / 无相|可买情报或达成一次停战交易|按已观察的宝物设局，使用伪名；身份揭露后仍是同一实例|\n|N67 牧青禾·护兽弟子，R1六级|SS19 青梧苑 / 御灵|共同孵蛋、安抚暴走灵兽、救援契约宠|若主角抢卵贩卖或伤害受保护兽群，会护兽反击|\n|N68 赫连驭·镇兽执事，R3六级|SS20 镇兽谷 / 御灵|兽潮时帮助筑防线，早期看似可靠|推行强制契约，企图夺主角封存异格蛋；活契约宠不变成可抢背包物|\n\n所有已解锁安全站都有基础休息/仓储/回程接口，少量通用服务由上述 NPC 的终端提供，不为每个按钮再复制一个新 NPC。高阶地区救援由唐岚网络接入当地星港；剧情先说明定位与支援来源。\n\n高阶丹师/工匠可回制已掌握的低阶配方，因此后期能用高品质材料改良后天/先天体质槽；服务范围表标的是新配方上限与主要业务，不禁止炼低阶药。低阶 NPC 的能力不会因带来 Q6 材料自动突破上限，预览须明确提示品质损失。\n\n储物/洞府服务继续复用原NPC：N05 闻止在后天六级教《纳物铭纹》Ⅰ，N03 韩铸提供稳纹台/货舱/基础袋制作；N12 玄仪在灵海教Ⅱ，N16 宁照在化神教Ⅲ，N21 星岚在星劫教Ⅳ。N10 陆行舟在先天介绍洞府登记与普通租洞保底。N02 教恢复药及兴奋剂风险，N09/N12 接高级药物和后遗症疗养。宠物专门新增N25/N26，旧24人不重编号。详细成本、前置和上限查 [储物](10_STORAGE_AND_ENCUMBRANCE.md)、[洞府](11_CAVES_AND_FORTUNES.md)、[丹药](12_MEDICINES_AND_AFTEREFFECTS.md)、[宠物](15_PET_PROGRESSION_AND_BOND.md)。\n\n## 3. NPC 首次接触怎样揭开修真\n\n开局人类词汇是“强化等级、神经导引、能量电容”；玩家第一次带未知血样回营时，苏禾发现其自组织能量结构，闻止授予基础导引。先天突破后，沈青萝确认这就是内息；陆行舟讲清后天之上九个大境，并指出人类已掌握的进化液是丹道的一种提纯形式。\n\n第一次见陆行舟就能问“后面还有哪些境界”，不会故意隐藏用户希望了解的体系。界面显示十境名字与简要能力，高阶配方、地名和具体数值随探索逐步发现。科技设备仍能测量真气，旧调查剧情作为世界谜团继续推进。\n\n## 4. 对话框合同\n\n靠近可交互范围、落地并面向 NPC，F 开启。中央偏下为文本框，左侧姓名/身份/头像，正文右侧或下方为可选回复；上方保留场景与人物，不用全屏遮罩盖住全部演出。对话暂停单人世界战斗，退出恢复输入状态，不能带着菜单误攻击。\n\n固定回复包括“询问近况”“查看服务”“询问线索”“离开”，未解锁服务解释原因。任务回复单独标记“接受/暂不”，不能点下一句就默认出售物品。正文可滚动，长文本分段；选择项最少 44 px 高、中文自动换行，640/768/1440 宽度均可点到，Esc 可返回上一层，最外层才关闭。\n\n对话数据结构：`DialogueNode{id,speaker,text,conditions,choices:[{id,label,next,effects}]}`。剧情脚本决定条件和结果；不能用模型随口编出的 NPC 答案直接扣钱或升级。分支已读记录可重看，不重复发放首次奖励。\n\n示例：\n\n> 苏禾：这管血样里的结构会主动聚集能量。我们能提纯它，但你还需要赤芽草稳定药性。\n>\n> ① 查看后天淬体液配方　② 哪里能找到赤芽草？　③ 血样危险吗？　④ 稍后再来\n\n> 陆行舟：你们称为进化的过程，我们叫修行。后天只是打底。内息贯通是先天，气海成形是灵海……但知道名字，并不等于身体能承受。\n>\n> ① 查看十境界　② 我如何突破先天？　③ 不靠丹药也能突破吗？　④ 询问附近传承\n\n> 唐岚：把你拖回来的时候，护甲已经裂了。那头棘背兽冲撞前会先刨地；你可以向侧面闪开，也可以沿西边岩沟绕过去。\n>\n> ① 检查装备　② 标记撤退路线　③ 重看攻击特征　④ 我准备再试一次\n\n## 5. 功能窗口\n\n|窗口|必须显示|确认/失败行为|\n|---|---|---|\n|炼丹|丹方、材料来源、已拥有/所需、替代品、成品 Q、净属性变化、费用和时间|明确确认才锁料；缺料按钮禁用并标产地；背包满留订单|\n|锻造|十大类分类、图样、3D 旋转预览、攻速/距离/需求、材料品级、装备对比|预览不得用不对应实际武器的概念图；不足不扣料|\n|练功|当前境级、修为、每小时预计收益、72 小时上限、灵石预存和消耗开关|默认不允许离线花石；停止退还未消耗预存|\n|交易|双边物品、数量、单价、品质、可用余额、NPC 剩余额度和库存、差额找零|最后一步确认原子提交；回车不自动出售任务物|\n|突破|三种办法、候选配方、属性净变化、新能力、缺失条件|预览→确认→演出→结果，重复点击不重复扣料|\n|传送|目的地、危险等级、费用、返程方式、携带限制|首次到达保证回程，未知目的地可见传闻但不能误传|\n|离线结算|实际离线/有效小时、修为/小级、花石、停止原因|只展示已落盘结算，不靠“领取”重复加奖|\n\nUI 布局共用一套对话/服务容器，M 地图、J 档案、U 成长仍分开。U 扩展为境界/功法/配装/修炼，角色境界与技能熟练阶明确标注。服务窗口打开时释放鼠标，关闭通过统一输入恢复函数，回归下车 Alt 残留问题。\n\n补充“储物扩容”服务页：选择袋/戒→检查技能→查看格数/容积/内部质量→放材料→预览增长与溢出→确认订单；材料来自哪里可追踪。洞府登记页需显示位置、等级、仓容量、修炼倍率、是否主洞府，以及搬迁物品的真实运输要求。\n\n## 6. 非固定任务与服务解锁\n\n任务类型包括材料委托、生态调查、救援、遗址传承、陨石鉴定、飞行试验、首领狩猎、阵网修复。固定教学保证基本成长资源；普通委托按区域和库存选择，不强制每日签到。长期不登录不会倒扣境界，不生成必须付费清除的离线惩罚。\n\n委托奖励来源可解释：商人要材料、药师收血样、学宫收研究结果。交付时在同一事务检查库存和任务状态；采集数量不足不能把背包扣到负数。允许把交易来的材料用于普通委托；首次狩猎/实地试炼要真实事件记录，不能只买一枚内丹伪造击杀。\n","html":"\u003ch1>D3-05 · 68 名固定 NPC、对话与功能\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-05-v002.svg\" alt=\"和NPC交谈之后\">\u003c/p>\u003cp>\u003cem>图解：共68名固定NPC；关键知识不能因一处宗门倒塌永久丢失。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>固定NPC现为68名（含29新增30名）。新增RN01—RN12动态游历模板不计入固定人数，实际人物有姓名、目标、背包、隐藏倾向与永久死亡记录；采集、竞争、伏击、搜夺、销赃与换人补位使用独立体系。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>依赖：\u003ca href=\"#04_WORLD_REGIONS_EXPLORATION.md\">世界\u003c/a>、\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">炼丹交易\u003c/a>、\u003ca href=\"#23_SECTS_NPCS_MISSIONS_AND_DUELS.md\">宗门\u003c/a>。宠物及宗门补充后固定名单共 \u003cstrong>68 名\u003c/strong>：原母星28名、原高阶星域10名，新增十大顶层领袖和20名跨区域支门派人物。重复路人、敌对人形、随机旅商不计入固定名额；初片只制作必要的前4名和教习，其余随对应切片接入。\u003c/p>\u003ch2>1. 母星 28 名\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID / 姓名\u003c/th>\u003cth>常驻地 / 身份\u003c/th>\u003cth>具体功能\u003c/th>\u003cth>解锁与边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>N01 林澈\u003c/td>\u003ctd>曙光营地 / 远征领队\u003c/td>\u003ctd>主线、首次探索目标、营地服务介绍\u003c/td>\u003ctd>开局可见，不把所有支线自动灌进日志\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N02 苏禾\u003c/td>\u003ctd>曙光营地 / 生物医师\u003c/td>\u003ctd>后天淬体与先天制剂、疗伤、血样知识\u003c/td>\u003ctd>基础采集后教学；炼制 R0—R1、最高 Q3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N03 韩铸\u003c/td>\u003ctd>曙光营地 / 机械锻造师\u003c/td>\u003ctd>铁陨精炼、刀与发射器、修理、F1 飞行器\u003c/td>\u003ctd>回收铁陨解锁；服务 R0—R1、最高 Q3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N04 许衡\u003c/td>\u003ctd>曙光营地 / 商站管事\u003c/td>\u003ctd>材料收购、基础补给、1:100 灵石兑换、仓库\u003c/td>\u003ctd>不卖唯一证据；库存与收购额度可见\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N05 闻止\u003c/td>\u003ctd>曙光营地 / 导引教习\u003c/td>\u003ctd>打坐、练功室、72 小时设置、突破讲解\u003c/td>\u003ctd>完成一次血样调查即可，首次训练免费\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N06 祁岳\u003c/td>\u003ctd>曙光营地 / 战技教官\u003c/td>\u003ctd>刀法、闪避、格挡、训练挑战\u003c/td>\u003ctd>训练不产可带出材料，不空放刷境界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N07 唐岚\u003c/td>\u003ctd>曙光营地 / 救援队长\u003c/td>\u003ctd>昏迷救援、危险区说明、建立野外救援联系\u003c/td>\u003ctd>开局签约，破产也能回安全区\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N08 阿洛\u003c/td>\u003ctd>曙光营地 / 勘测机器人\u003c/td>\u003ctd>扫描图鉴、陨落线索、地图与异常声纹研究\u003c/td>\u003ctd>图鉴只公开已见对象；不先剧透全星球\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N09 沈青萝\u003c/td>\u003ctd>栖息药谷 / 遗民药师\u003c/td>\u003ctd>药草采法、炼丹、先天到灵海的知识\u003c/td>\u003ctd>服务 R1—R2、最高 Q4；首次解释修行体系\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N10 陆行舟\u003c/td>\u003ctd>栖息药谷 / 远游修士\u003c/td>\u003ctd>传授功法、十境界传闻、非丹药传承路线\u003c/td>\u003ctd>玩家可早遇见；高境细节随证据展开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N11 岳九锻\u003c/td>\u003ctd>赤炉工坊 / 炼器师\u003c/td>\u003ctd>R2—R3 武器、甲具、F2/F3 飞行器\u003c/td>\u003ctd>最高 Q4；高空模块须热区矿材\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N12 玄仪\u003c/td>\u003ctd>镜渊驿站 / 丹阵师\u00 d>\u003ctd>会因上级征用令与主角对峙，可通过替代物资避免冲突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N62 炎夺岳·夺矿执事，R4一级\u003c/td>\u003ctd>SS14 血铸门 / 赤霄\u003c/td>\u003ctd>迫于兽潮可暂时与主角合作\u003c/td>\u003ctd>觊觎主角陨核/原器，主动布设夺宝伏击，是可斩杀的长期对手\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N63 苏晚照·行医弟子，R1五级\u003c/td>\u003ctd>SS15 济世山 / 瑶光\u003c/td>\u003ctd>采药、救援、护送伤员，可同行治疗\u003c/td>\u003ctd>目击主角滥杀后离队，必要时保护受害者对抗主角\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N64 柳寒灯·药库执事，R3二级\u003c/td>\u003ctd>SS16 寒灯谷 / 瑶光\u003c/td>\u003ctd>采购短缺药材，提供可靠疗伤线索\u003c/td>\u003ctd>倒卖赈灾丹药，主角掌握货单后可能找人抢夺证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N65 阮渡影·潜行弟子，R2四级\u003c/td>\u003ctd>SS17 渡影楼 / 无相\u003c/td>\u003ctd>救回被盗兽卵、揭穿假旗袭击，可能背叛本门保护主角\u003c/td>\u003ctd>主角出卖其真实身份后失去信任，生死追捕由实际证据触发\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N66 莫无声·猎宝人，R4三级\u003c/td>\u003ctd>SS18 无面阁 / 无相\u003c/td>\u003ctd>可买情报或达成一次停战交易\u003c/td>\u003ctd>按已观察的宝物设局，使用伪名；身份揭露后仍是同一实例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N67 牧青禾·护兽弟子，R1六级\u003c/td>\u003ctd>SS19 青梧苑 / 御灵\u003c/td>\u003ctd>共同孵蛋、安抚暴走灵兽、救援契约宠\u003c/td>\u003ctd>若主角抢卵贩卖或伤害受保护兽群，会护兽反击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N68 赫连驭·镇兽执事，R3六级\u003c/td>\u003ctd>SS20 镇兽谷 / 御灵\u003c/td>\u003ctd>兽潮时帮助筑防线，早期看似可靠\u003c/td>\u003ctd>推行强制契约，企图夺主角封存异格蛋；活契约宠不变成可抢背包物\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>所有已解锁安全站都有基础休息/仓储/回程接口，少量通用服务由上述 NPC 的终端提供，不为每个按钮再复制一个新 NPC。高阶地区救援由唐岚网络接入当地星港；剧情先说明定位与支援来源。\u003c/p>\u003cp>高阶丹师/工匠可回制已掌握的低阶配方，因此后期能用高品质材料改良后天/先天体质槽；服务范围表标的是新配方上限与主要业务，不禁止炼低阶药。低阶 NPC 的能力不会因带来 Q6 材料自动突破上限，预览须明确提示品质损失。\u003c/p>\u003cp>储物/洞府服务继续复用原NPC：N05 闻止在后天六级教《纳物铭纹》Ⅰ，N03 韩铸提供稳纹台/货舱/基础袋制作；N12 玄仪在灵海教Ⅱ，N16 宁照在化神教Ⅲ，N21 星岚在星劫教Ⅳ。N10 陆行舟在先天介绍洞府登记与普通租洞保底。N02 教恢复药及兴奋剂风险，N09/N12 接高级药物和后遗症疗养。宠物专门新增N25/N26，旧24人不重编号。详细成本、前置和上限查 \u003ca href=\"#10_STORAGE_AND_ENCUMBRANCE.md\">储物\u003c/a>、\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">洞府\u003c/a>、\u003ca href=\"#12_MEDICINES_AND_AFTEREFFECTS.md\">丹药\u003c/a>、\u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">宠物\u003c/a>。\u003c/p>\u003ch2>3. NPC 首次接触怎样揭开修真\u003c/h2>\u003cp>开局人类词汇是“强化等级、神经导引、能量电容”；玩家第一次带未知血样回营时，苏禾发现其自组织能量结构，闻止授予基础导引。先天突破后，沈青萝确认这就是内息；陆行舟讲清后天之上九个大境，并指出人类已掌握的进化液是丹道的一种提纯形式。\u003c/p>\u003cp>第一次见陆行舟就能问“后面还有哪些境界”，不会故意隐藏用户希望了解的体系。界面显示十境名字与简要能力，高阶配方、地名和具体数值随探索逐步发现。科技设备仍能测量真气，旧调查剧情作为世界谜团继续推进。\u003c/p>\u003ch2>4. 对话框合同\u003c/h2>\u003cp>靠近可交互范围、落地并面向 NPC，F 开启。中央偏下为文本框，左侧姓名/身份/头像，正文右侧或下方为可选回复；上方保留场景与人物，不用全屏遮罩盖住全部演出。对话暂停单人世界战斗，退出恢复输入状态，不能带着菜单误攻击。\u003c/p>\u003cp>固定回复包括“询问近况”“查看服务”“询问线索”“离开”，未解锁服务解释原因。任务回复单独标记“接受/暂不”，不能点下一句就默认出售物品。正文可滚动，长文本分段；选择项最少 44 px 高、中文自动换行，640/768/1440 宽度均可点到，Esc 可返回上一层，最外层才关闭。\u003c/p>\u003cp>对话数据结构：\u003ccode>DialogueNode{id,speaker,text,conditions,choices:[{id,label,next,effects}]}\u003c/code>。剧情脚本决定条件和结果；不能用模型随口编出的 NPC 答案直接扣钱或升级。分支已读记录可重看，不重复发放首次奖励。\u003c/p>\u003cp>示例：\u003c/p>\u003cblockquote>苏禾：这管血样里的结构会主动聚集能量。我们能提纯它，但你还需要赤芽草稳定药性。\u003c/blockquote>\u003cblockquote>\u003c/blockquote>\u003cblockquote>① 查看后天淬体液配方　② 哪里能找到赤芽草？　③ 血样危险吗？　④ 稍后再来\u003c/blockquote>\u003cblockquote>陆行舟：你们称为进化的过程，我们叫修行。后天只是打底。内息贯通是先天，气海成形是灵海……但知道名字，并不等于身体能承受。\u003c/blockquote>\u003cblockquote>\u003c/blockquote>\u003cblockquote>① 查看十境界　② 我如何突破先天？　③ 不靠丹药也能突破吗？　④ 询问附近传承\u003c/blockquote>\u003cblockquote>唐岚：把你拖回来的时候，护甲已经裂了。那头棘背兽冲撞前会先刨地；你可以向侧面闪开，也可以沿西边岩沟绕过去。\u003c/blockquote>\u003cblockquote>\u003c/blockquote>\u003cblockquote>① 检查装备　② 标记撤退路线　③ 重看攻击特征　④ 我准备再试一次\u003c/blockquote>\u003ch2>5. 功能窗口\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>窗口\u003c/th>\u003cth>必须显示\u003c/th>\u003cth>确认/失败行为\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>炼丹\u003c/td>\u003ctd>丹方、材料来源、已拥有/所需、替代品、成品 Q、净属性变化、费用和时间\u003c/td>\u003ctd>明确确认才锁料；缺料按钮禁用并标产地；背包满留订单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>锻造\u003c/td>\u003ctd>十大类分类、图样、3D 旋转预览、攻速/距离/需求、材料品级、装备对比\u003c/td>\u003ctd>预览不得用不对应实际武器的概念图；不足不扣料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>练功\u003c/td>\u003ctd>当前境级、修为、每小时预计收益、72 小时上限、灵石预存和消耗开关\u003c/td>\u003ctd>默认不允许离线花石；停止退还未消耗预存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交易\u003c/td>\u003ctd>双边物品、数量、单价、品质、可用余额、NPC 剩余额度和库存、差额找零\u003c/td>\u003ctd>最后一步确认原子提
