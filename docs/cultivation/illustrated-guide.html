交；回车不自动出售任务物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>突破\u003c/td>\u003ctd>三种办法、候选配方、属性净变化、新能力、缺失条件\u003c/td>\u003ctd>预览→确认→演出→结果，重复点击不重复扣料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>传送\u003c/td>\u003ctd>目的地、危险等级、费用、返程方式、携带限制\u003c/td>\u003ctd>首次到达保证回程，未知目的地可见传闻但不能误传\u003c/td>\u003c/tr>\u003ctr>\u003ctd>离线结算\u003c/td>\u003ctd>实际离线/有效小时、修为/小级、花石、停止原因\u003c/td>\u003ctd>只展示已落盘结算，不靠“领取”重复加奖\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>UI 布局共用一套对话/服务容器，M 地图、J 档案、U 成长仍分开。U 扩展为境界/功法/配装/修炼，角色境界与技能熟练阶明确标注。服务窗口打开时释放鼠标，关闭通过统一输入恢复函数，回归下车 Alt 残留问题。\u003c/p>\u003cp>补充“储物扩容”服务页：选择袋/戒→检查技能→查看格数/容积/内部质量→放材料→预览增长与溢出→确认订单；材料来自哪里可追踪。洞府登记页需显示位置、等级、仓容量、修炼倍率、是否主洞府，以及搬迁物品的真实运输要求。\u003c/p>\u003ch2>6. 非固定任务与服务解锁\u003c/h2>\u003cp>任务类型包括材料委托、生态调查、救援、遗址传承、陨石鉴定、飞行试验、首领狩猎、阵网修复。固定教学保证基本成长资源；普通委托按区域和库存选择，不强制每日签到。长期不登录不会倒扣境界，不生成必须付费清除的离线惩罚。\u003c/p>\u003cp>委托奖励来源可解释：商人要材料、药师收血样、学宫收研究结果。交付时在同一事务检查库存和任务状态；采集数量不足不能把背包扣到负数。允许把交易来的材料用于普通委托；首次狩猎/实地试炼要真实事件记录，不能只买一枚内丹伪造击杀。\u003c/p>"},{"file":"06_MONSTERS_AND_3D.md","title":"D3-06 · 30 类生物、2 类机关与对应 3D","text":"# D3-06 · 30 类生物、2 类机关与对应 3D\n\n\u003c!-- illustrated-overview:start -->\n![怪物不是血条木桩](media/diagram-06-v001.svg)\n\n*图解：掉落随怪物实例保存；稀有内丹不是基础突破的唯一途径。*\n\u003c!-- illustrated-overview:end -->\n\n依赖：[战斗](02_COMBAT_WEAPONS_SKILLS.md)、[掉落](03_ALCHEMY_MATERIALS_ECONOMY.md)、[地区](04_WORLD_REGIONS_EXPLORATION.md)。本文件交付的是造型、骨架、行为、掉落和制作验收规格；尚未生成这些模型，不消耗 aholo 积分。\n\n## 1. 生态与成长的关系\n\n规划 **30 类生物敌人**，每境 3 类（普通、精英、首领），另有 **2 类科技机关敌人**。同一生物族可有年龄/境界变种，但新境界至少增加一个行为或环境交互，不只变大换色加血。生物吸收地脉和灵石逐渐形成内丹，解释低阶核少、高阶核多。\n\n所有生物掉血液，骨/皮/甲/筋按身体结构定义；完整内丹按 D3-03 的境界＋精英度表。表中“必得”表示成功领取一次掉落的最低产物；概率核和额外身体材料另按通用表，不与必得重复生成。首领的首次知识奖励只给一次，后续仅给可再生材料。\n\n出生/死亡/再生代数、种群上限、可见入场、尸体与掉落保存统一遵循 [世界刷新系统](08_WORLD_DIRECTOR.md)。怪物模型加载失败不得激活不可见伤害，召唤怪是否奖励必须在事件配置显式声明。\n\n## 2. 敌人、打法与收益清单\n\n|ID / 境界 / 类别|生物与形态|核心招式、弱点、玩家解法|最低战利品与用途|\n|---|---|---|---|\n|M00 / R0 / 普通|砂脊掠兽，四足低伏、骨脊与长尾|刨地 0.8 秒后直扑；侧闪后攻击肋部；可诱开采草|掠兽血×1；R0-A，皮筋可造握带|\n|M01 / R0 / 精英|棘背兽，重前肢、扇形背棘|正面角甲、冲撞后卡岩；重击/侧攻破甲|棘背兽血×2、角甲×1；R1-A 和盾甲|\n|M02 / R0 / 首领|赤喉巢母，腹囊与四足厚壳|喷砂遮线、呼叫小兽、腹囊蓄气暴露；扫描识别真腹囊|掠兽血×5、巢母筋×2；首杀炼体路线知识|\n|M03 / R1 / 普通|泽鳄，六肢浅水伏击兽|水纹提示扑咬，陆地转身慢；引到浅滩|泽鳄血×1；R2-A，鳄皮护具|\n|M04 / R1 / 精英|腐雾孢蛛，八足菌囊|蛛丝封路、菌囊喷雾；打囊或点燃环境清路|孢蛛血×2、韧丝×1；通用炼丹净化/弓弦|\n|M05 / R1 / 首领|沼冠巨蜥，背生水生药草|翻滚/尾扫、周期饮水恢复；关闭水道或持续打断|泽鳄同族血×5、潮冠甲×2；首杀药圃索引|\n|M06 / R2 / 普通|熔甲兽，重甲四足|发热后冲撞，冷却时甲缝张开；火区调水降温|熔甲兽血×1；R3-A，耐热甲|\n|M07 / R2 / 精英|炉鳞蜥，贴壁火蜥|贴壁喷射、尾部散热；远程断附着后近战|炉鳞血×2、耐热腱×1；锻造辅料/F3|\n|M08 / R2 / 首领|熔巢巨兽，岩甲巨躯|三段踩踏、地火喷口；逐部位拆甲开弱点|熔甲兽同族血×5、炉心甲×2；首杀冷却阵蓝图|\n|M09 / R3 / 普通|镜翼兽，晶膜双翼|假影突袭，真身落尘/有声；扫描或观察影子|镜翼兽血×1；R4-A，晶膜法器|\n|M10 / R3 / 精英|盲鳞潜兽，地下长体|听脚步破土；慢走引位、出土后打头|潜兽血×2、感震鳞×1；感知装备|\n|M11 / R3 / 首领|镜渊蛟，四肢长颈、水晶角|真假身交替、折射吐息；破镜台取消反射|镜翼同源血×5、镜角×2；首杀元婴传承碎页|\n|M12 / R4 / 普通|雷脊兽，背部储雷角|竖角预警后跳砸；借避雷岩泄放再攻击|雷脊兽血×1；R5-A，雷筋御器|\n|M13 / R4 / 精英|风镰隼，长翼钩爪|俯冲切线、横风击退；御器侧移或地面掩体|风隼血×2、风羽×1；轻型法器|\n|M14 / R4 / 首领|天穹雷鹏，巨翼雷纹|导雷链与高空落雷；先破接地点再短暂上背|雷脊同源血×5、雷羽骨×2；首杀游空预修法|\n|M15 / R5 / 普通|虚渊兽，六足半透明鳍|短距裂隙突袭，出口提前浮纹；辨出口方向|虚渊兽血×1；R6-A，界膜装备|\n|M16 / R5 / 精英|盐海骨螯，四对足重钳|钳夹拖入盐池、背甲开合；打断钳部/飞到安全台|骨螯血×2、抗蚀甲×1；护具与阵器|\n|M17 / R5 / 首领|裂界螭，长体双翼|撕开有限裂隙、阶段性坠地；空战与地面恢复交替|虚渊同源血×5、界角×2；首杀星门校准部件|\n|M18 / R6 / 普通|重环兽，四足悬石甲环|局部重力压制；脱离环域/击破悬石|重环兽血×1；R7-A，重力武器芯|\n|M19 / R6 / 精英|空折螳，双刃昆虫|两次折跃斩，第二斩留出口标记；不能只躲第一下|空螳血×2、折刃×1；空间武器|\n|M20 / R6 / 首领|虚衡巨龟，浮陆背壳|重力翻转、甲柱保护核心；利用平台稳定区|重环同源血×5、衡甲×2；首杀领域入门典籍|\n|M21 / R7 / 普通|噬星鳐幼体，气海游鳐|在星球高空灵流中游动，尾束横扫；可从浮台战斗|噬星鳐血×1；R8-A，不要求先有真空飞行|\n|M22 / R7 / 精英|法纹獬，角兽、移动纹阵|切换冲击/反射领域；观察角纹选攻击时机|法纹血×2、纹角×1；领域法器|\n|M23 / R7 / 首领|万象麒麟，四足披云鳞|昼夜相与场地规则切换；控制两处领域锚点|噬星同源血×5、万象鳞×2；首杀护域知识|\n|M24 / R8 / 普通|界鲸幼体，真空鳍兽|引力吸入、侧鳍拍击；绕侧避开吸入口|界鲸血×1；R9-A，星空护具|\n|M25 / R8 / 精英|陨甲螯，附着小天体的甲兽|抛碎陨、锚定翻转；先断锚脚，利用陨石掩体|陨螯血×2、星甲×1；星炉装备|\n|M26 / R8 / 首领|吞曜巨鲸，真空大型生物|吸收星光、护膜分区与喷流；多次接近/撤离补气|界鲸血×5、曜骨×2；首杀道源线索|\n|M27 / R9 / 普通|源蚀龙，能量脊与长躯|侵蚀护域、标记区域爆发；领域切换清除附着|源龙血×1；道源终局淬体/武器改良|\n|M28 / R9 / 精英|星核卫兽，晶骨四足|星核连线护盾，破节点进入输出窗口|核兽血×2、源晶骨×1；星核事件准备|\n|M29 / R9 / 首领|寂源古兽，四足长颈与星核冠|多节点跨场地战；阻止回流后选择封印/毁核|道源血×5、寂源核壳×2；终局构筑与唯一档案|\n\n“同源血”不是把不同血随机混成原料：图鉴明确归入对应配方血型标签，掉落仍显示具体来源，可追溯生态关系。同境其他血液可净化成通用药用血浆；不能替代命名突破血型，除非配方明确列出替代品。\n\n机关 G00 舰内失控维护机：前向焊枪、侧后冷却口，掉合金与电容，可战斗或恢复权限停机。G01 遗址巡阵傀儡：方向盾与阵核连线，掉阵纹板/能晶，可破盾或解阵。两者不掉内丹与生物血；停机路线给研究奖励，不能反复开关刷材料。\n\n## 3. 第一只怪物的具体模型与动作合同\n\nM00 砂脊掠兽：肩高 0.75 m，鼻到臀 1.45 m，尾 0.9 m；前肢略粗、胸廓低、后腿反关节但有明确膝踝，四足接地；灰沙色短皮配暗红颈褶，骨脊为外露角质。眼睛位于头侧，不画成发光机械镜头；禁止用胶囊加球体直接当最终生物。\n\n参考图制作需正/侧/后/四分之三、张口/闭口、骨脊与脚掌细节，比例尺一致。概念图确定以后制作真实闭合网格、UV、PBR、骨架与动画；不能把平面怪物图立在场景里冒充 3D。\n\n基础骨架目标 32—44 骨：根/骨盆、脊柱 3、颈 2、头/下颌、四肢各 3—4、尾 5—7；足底与口部有命中/接触挂点。视觉眼睛骨可选，不让尾巴碰撞承担整个身体受击箱。\n\n首套动画 13 段：待机呼吸、嗅探、步行、疾跑、左转、右转、扑击前摇、扑击生效、落地收招、轻受击、破势倒地、起身、死亡。前摇约 0.8 s，扑击约 0.3 s，收招约 0.7 s；根运动与实际扫掠位移只能选一个权威来源，不能双重移动。血样采集为玩家工具动作，不要求每只尸体做一套循环血动画。\n\n## 4. 复用骨架，不复用全部玩法\n\n|骨架家族|可复用对象|必须单独制作的差异|\n|---|---|---|\n|低伏四足|掠兽、棘背兽、熔甲兽、雷脊兽|甲片、体重、步态、冲撞/扑击时序|\n|重型四足|巢母、巨蜥、重环兽、麒麟、卫兽|受击部位、躯干骨、首领攻击与阶段|\n|多足节肢|孢蛛、骨螯、陨甲螯|足数、钳/蛛丝/喷囊结构|\n|蜥/长体|炉鳞蜥、潜兽、蛟、螭、源龙|贴壁、潜地、翼、脊柱数量|\n|双翼|镜翼兽、风隼、雷鹏|翼膜/羽毛轮廓、起落与俯冲|\n|刃虫|空折螳|双臂攻击扫掠与折跃预告|\n|巨壳|虚衡巨龟|可站立背部、平台与甲柱|\n|鳐/鲸|噬星鳐、界鲸、吞曜鲸|鳍面、尾链、真空运动与可打部位|\n\n寂源古兽用重型四足扩展星核冠与长颈，禁止为了凑复用牺牲可辨识形态。远景高阶首领采用分部位渲染与碰撞，先以 20—120 m 可战斗个体制作；设定中的巨型投影不等于一张百万面模型覆盖整个星球。\n\n## 5. 资产预算与交付要求\n\n普通怪 LOD0 18k—35k 三角，LOD1 8k—15k，LOD2 2k—5k；精英 30k—60k；首领 60k—120k，按部位拆分。普通怪最多 2 套 2K 纹理、3 个材质；首领最多 4 套，低画质使用 1K。预算为制作上限，实际同屏首轮目标 8 普通＋2 精英或 1 首领，超预算必须测量降级，不默认所有 30 种一起加载。\n\n每种交付：概念图与提示词/来源、`.blend` 可编辑源、`.glb` 游戏资产、贴图、骨骼映射、动画事件表、碰撞尺寸、掉落/行为配置 ID、许可记录、版本清单。文件目标目录 `playable/assets/monsters/\u003cid>/`，尚未生成时不创建假 GLB。\n\n命中事件来自动画生效区间与实际空间扫掠；受击部位用简化碰撞而非高模逐三角碰撞。死尸可采集后转低成本残留或淡出，已采记录保留。离开区域释放动画、粒子和贴图引用；重新进入不能复制未领取掉落。\n\n## 6. 制作优先级与验收\n\n先 M00 普通怪 → M01 精英 → 一种药草和一块陨石 → M02 首领 → G00 机关，配合真实炼丹闭环。怪物每次至少验收：无灯/有灯可读轮廓、前后左右视图、脚底与转弯、第一人称近距离、被刀/远程命中、尸体采集、实际掉落进入库存，以及重载和区域往返后的去重。\n\n若使用 aholo，先核验剩余积分与单次报价，优先一次生成一只已确定造型的样板，在 Blender 内修骨架、权重和动作再复用；不一次生成三十只未经验证的怪物。效果不佳时保留来源与问题记录，不声称只调用了工具就实现美术目标。\n","html":"\u003ch1>D3-06 · 30 类生物、2 类机关与对应 3D\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-06-v001.svg\" alt=\"怪物不是血条木桩\">\u003c/p>\u003cp>\u003cem>图解：掉落随怪物实例保存；稀有内丹不是基础突破的唯一途径。\u003c/em>\u003c/p>\u003cp>依赖：\u003ca href=\"#02_COMBAT_WEAPONS_SKILLS.md\">战斗\u003c/a>、\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">掉落\u003c/a>、\u003ca href=\"#04_WORLD_REGIONS_EXPLORATION.md\">地区\u003c/a>。本文件交付的是造型、骨架、行为、掉落和制作验收规格；尚未生成这些模型，不消耗 aholo 积分。\u003c/p>\u003ch2>1. 生态与成长的关系\u003c/h2>\u003cp>规划 \u003cstrong>30 类生物敌人\u003c/strong>，每境 3 类（普通、精英、首领），另有 \u003cstrong>2 类科技机关敌人\u003c/strong>。同一生物族可有年龄/境界变种，但新境界至少增加一个行为或环境交互，不只变大换色加血。生物吸收地脉和灵石逐渐形成内丹，解释低阶核少、高阶核多。\u003c/p>\u003cp>所有生物掉血液，骨/皮/甲/筋按身体结构定义；完整内丹按 D3-03 的境界＋精英度表。表中“必得”表示成功领取一次掉落的最低产物；概率核和额外身体材料另按通用表，不与必得重复生成。首领的首次知识奖励只给一次，后续仅给可再生材料。\u003c/p>\u003cp>出生/死亡/再生代数、种群上限、可见入场、尸体与掉落保存统一遵循 \u003ca href=\"#08_WORLD_DIRECTOR.md\">世界刷新系统\u003c/a>。怪物模型加载失败不得激活不可见伤害，召唤怪是否奖励必须在事件配置显式声明。\u003c/p>\u003ch2>2. 敌人、打法与收益清单\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID / 境界 / 类别\u003c/th>\u003cth>生物与形态\u003c/th>\u003cth>核心招式、弱点、玩家解法\u003c/th>\u003cth>最低战利品与用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M00 / R0 / 普通\u003c/td>\u003ctd>砂脊掠兽，四足低伏、骨脊与长尾\u003c/td>\u003ctd>刨地 0.8 秒后直扑；侧闪后攻击肋部；可诱开采草\u003c/td>\u003ctd>掠兽血×1；R0-A，皮筋可造握带\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M01 / R0 / 精英\u003c/td>\u003ctd>棘背兽，重前肢、扇形背棘\u003c/td>\u003ctd>正面角甲、冲撞后卡岩；重击/侧攻破甲\u003c/td>\u003ctd>棘背兽血×2、角甲×1；R1-A 和盾甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02 / R0 / 首领\u003c/td>\u003ctd>赤喉巢母，腹囊与四足厚壳\u003c/td>\u003ctd>喷砂遮线、呼叫小兽、腹囊蓄气暴露；扫描识别真腹囊\u003c/td>\u003ctd>掠兽血×5、巢母筋×2；首杀炼体路线知识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M03 / R1 / 普通\u003c/td>\u003ctd>泽鳄，六肢浅水伏击兽\u003c/td>\u003ctd>水纹提示扑咬，陆地转身慢；引到浅滩\u003c/td>\u003ctd>泽鳄血×1；R2-A，鳄皮护具\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M04 / R1 / 精英\u003c/td>\u003ctd>腐雾孢蛛，八足菌囊\u003c/td>\u003ctd>蛛丝封路、菌囊喷雾；打囊或点燃环境清路\u003c/td>\u003ctd>孢蛛血×2、韧丝×1；通用炼丹净化/弓弦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M05 / R1 / 首领\u003c/td>\u003ctd>沼冠巨蜥，背生水生药草\u003c/td>\u003ctd>翻滚/尾扫、周期饮水恢复；关闭水道或持续打断\u003c/td>\u003ctd>泽鳄同族血×5、潮冠甲×2；首杀药圃索引\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M06 / R2 / 普通\u003c/td>\u003ctd>熔甲兽，重甲四足\u003c/td>\u003ctd>发热后冲撞，冷却时甲缝张开；火区调水降温\u003c/td>\u003ctd>熔甲兽血×1；R3-A，耐热甲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M07 / R2 / 精英\u003c/td>\u003ctd>炉鳞蜥，贴壁火蜥\u003c/td>\u003ctd>贴壁喷射、尾部散热；远程断附着后近战\u003c/td>\u003ctd>炉鳞血×2、耐热腱×1；锻造辅料/F3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M08 / R2 / 首领\u003c/td>\u003ctd>熔巢巨兽，岩甲巨躯\u003c/td>\u003ctd>三段踩踏、地火喷口；逐部位拆甲开弱点\u003c/td>\u003ctd>熔甲兽同族血×5、炉心甲×2；首杀冷却阵蓝图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M09 / R3 / 普通\u003c/td>\u003ctd>镜翼兽，晶膜双翼\u003c/td>\u003ctd>假影突袭，真身落尘/有声；扫描或观察影子\u003c/td>\u003ctd>镜翼兽血×1；R4-A，晶膜法器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10 / R3 / 精英\u003c/td>\u003ctd>盲鳞潜兽，地下长体\u003c/td>\u003ctd>听脚步破土；慢走引位、出土后打头\u003c/td>\u003ctd>潜兽血×2、感震鳞×1；感知装备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M11 / R3 / 首领\u003c/td>\u003ctd>镜渊蛟，四肢长颈、水晶角\u003c/td>\u003ctd>真假身交替、折射吐息；破镜台取消反射\u003c/td>\u003ctd>镜翼同源血×5、镜角×2；首杀元婴传承碎页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12 / R4 / 普通\u003c/td>\u003ctd>雷脊兽，背部储雷角\u003c/td>\u003ctd>竖角预警后跳砸；借避雷岩泄放再攻击\u003c/td>\u003ctd>雷脊兽血×1；R5-A，雷筋御器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M13 / R4 / 精英\u003c/td>\u003ctd>风镰隼，长翼钩爪\u003c/td>\u003ctd>俯冲切线、横风击退；御器侧移或地面掩体\u003c/td>\u003ctd>风隼血×2、风羽×1；轻型法器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M14 / R4 / 首领\u003c/td>\u003ctd>天穹雷鹏，巨翼雷纹\u003c/td>\u003ctd>导雷链与高空落雷；先破接地点再短暂上背\u003c/td>\u003ctd>雷脊同源血×5、雷羽骨×2；首杀游空预修法\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M15 / R5 / 普通\u003c/td>\u003ctd>虚渊兽，六足半透明鳍\u003c/td>\u003ctd>短距裂隙突袭，出口提前浮纹；辨出口方向\u003c/td>\u003ctd>虚渊兽血×1；R6-A，界膜装备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M16 / R5 / 精英\u003c/td>\u003ctd>盐海骨螯，四对足重钳\u003c/td>\u003ctd>钳夹拖入盐池、背甲开合；打断钳部/飞到安全台\u003c/td>\u003ctd>骨螯血×2、抗蚀甲×1；护具与阵器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M17 / R5 / 首领\u003c/td>\u003ctd>裂界螭，长体双翼\u003c/td>\u003ctd>撕开有限裂隙、阶段性坠地；空战与地面恢复交替\u003c/td>\u003ctd>虚渊同源血×5、界角×2；首杀星门校准部件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M18 / R6 / 普通\u003c/td>\u003ctd>重环兽，四足悬石甲环\u003c/td>\u003ctd>局部重力压制；脱离环域/击破悬石\u003c/td>\u003ctd>重环兽血×1；R7-A，重力武器芯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M19 / R6 / 精英\u003c/td>\u003ctd>空折螳，双刃昆虫\u003c/td>\u003ctd>两次折跃斩，第二斩留出口标记；不能只躲第一下\u003c/td>\u003ctd>空螳血×2、折刃×1；空间武器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M20 / R6 / 首领\u003c/td>\u003ctd>虚衡巨龟，浮陆背壳\u003c/td>\u003ctd>重力翻转、甲柱保护核心；利用平台稳定区\u003c/td>\u003ctd>重环同源血×5、衡甲×2；首杀领域入门典籍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M21 / R7 / 普通\u003c/td>\u003ctd>噬星鳐幼体，气海游鳐\u003c/td>\u003ctd>在星球高空灵流中游动，尾束横扫；可从浮台战斗\u003c/td>\u003ctd>噬星鳐血×1；R8-A，不要求先有真空飞行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M22 / R7 / 精英\u003c/td>\u003ctd>法纹獬，角兽、移动纹阵\u003c/td>\u003ctd>切换冲击/反射领域；观察角纹选攻击时机\u003c/td>\u003ctd>法纹血×2、纹角×1；领域法器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M23 / R7 / 首领\u003c/td>\u003ctd>万象麒麟，四足披云鳞\u003c/td>\u003ctd>昼夜相与场地规则切换；控制两处领域锚点\u003c/td>\u003ctd>噬星同源血×5、万象鳞×2；首杀护域知识\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M24 / R8 / 普通\u003c/td>\u003ctd>界鲸幼体，真空鳍兽\u003c/td>\u003ctd>引力吸入、侧鳍拍击；绕侧避开吸入口\u003c/td>\u003ctd>界鲸血×1；R9-A，星空护具\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M25 / R8 / 精英\u003c/td>\u003ctd>陨甲螯，附着小天体的甲兽\u003c/td>\u003ctd>抛碎陨、锚定翻转；先断锚脚，利用陨石掩体\u003c/td>\u003ctd>陨螯血×2、星甲×1；星炉装备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M26 / R8 / 首领\u003c/td>\u003ctd>吞曜巨鲸，真空大型生物\u003c/td>\u003ctd>吸收星光、护膜分区与喷流；多次接近/撤离补气\u003c/td>\u003ctd>界鲸血×5、曜骨×2；首杀道源线索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M27 / R9 / 普通\u003c/td>\u003ctd>源蚀龙，能量脊与长躯\u003c/td>\u003ctd>侵蚀护域、标记区域爆发；领域切换清除附着\u003c/td>\u003ctd>源龙血×1；道源终局淬体/武器改良\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M28 / R9 / 精英\u003c/td>\u003ctd>星核卫兽，晶骨四足\u003c/td>\u003ctd>星核连线护盾，破节点进入输出窗口\u003c/td>\u003ctd>核兽血×2、源晶骨×1；星核事件准备\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M29 / R9 / 首领\u003c/td>\u003ctd>寂源古兽，四足长颈与星核冠\u003c/td>\u003ctd>多节点跨场地战；阻止回流后选择封印/毁核\u003c/td>\u003ctd>道源血×5、寂源核壳×2；终局构筑与唯一档案\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>“同源血”不是把不同血随机混成原料：图鉴明确归入对应配方血型标签，掉落仍显示具体来源，可追溯生态关系。同境其他血液可净化成通用药用血浆；不能替代命名突破血型，除非配方明确列出替代品。\u003c/p>\u003cp>机关 G00 舰内失控维护机：前向焊枪、侧后冷却口，掉合金与电容，可战斗或恢复权限停机。G01 遗址巡阵傀儡：方向盾与阵核连线，掉阵纹板/能晶，可破盾或解阵。两者不掉内丹与生物血；停机路线给研究奖励，不能反复开关刷材料。\u003c/p>\u003ch2>3. 第一只怪物的具体模型与动作合同\u003c/h2>\u003cp>M00 砂脊掠兽：肩高 0.75 m，鼻到臀 1.45 m，尾 0.9 m；前肢略粗、胸廓低、后腿反关节但有明确膝踝，四足接地；灰沙色短皮配暗红颈褶，骨脊为外露角质。眼睛位于头侧，不画成发光机械镜头；禁止用胶囊加球体直接当最终生物。\u003c/p>\u003cp>参考图制作需正/侧/后/四分之三、张口/闭口、骨脊与脚掌细节，比例尺一致。概念图确定以后制作真实闭合网格、UV、PBR、骨架与动画；不能把平面怪物图立在场景里冒充 3D。\u003c/p>\u003cp>基础骨架目标 32—44 骨：根/骨盆、脊柱 3、颈 2、头/下颌、四肢各 3—4、尾 5—7；足底与口部有命中/接触挂点。视觉眼睛骨可选，不让尾巴碰撞承担整个身体受击箱。\u003c/p>\u003cp>首套动画 13 段：待机呼吸、嗅探、步行、疾跑、左转、右转、扑击前摇、扑击生效、落地收招、轻受击、破势倒地、起身、死亡。前摇约 0.8 s，扑击约 0.3 s，收招约 0.7 s；根运动与实际扫掠位移只能选一个权威来源，不能双重移动。血样采集为玩家工具动作，不要求每只尸体做一套循环血动画。\u003c/p>\u003ch2>4. 复用骨架，不复用全部玩法\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>骨架家族\u003c/th>\u003cth>可复用对象\u003c/th>\u003cth>必须单独制作的差异\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>低伏四足\u003c/td>\u003ctd>掠兽、棘背兽、熔甲兽、雷脊兽\u003c/td>\u003ctd>甲片、体重、步态、冲撞/扑击时序\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重型四足\u003c/td>\u003ctd>巢母、巨蜥、重环兽、麒麟、卫兽\u003c/td>\u003ctd>受击部位、躯干骨、首领攻击与阶段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多足节肢\u003c/td>\u003ctd>孢蛛、骨螯、陨甲螯\u003c/td>\u003ctd>足数、钳/蛛丝/喷囊结构\u003c/td>\u003c/tr>\u003ctr>\u003ctd>蜥/长体\u003c/td>\u003ctd>炉鳞蜥、潜兽、蛟、螭、源龙\u003c/td>\u003ctd>贴壁、潜地、翼、脊柱数量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>双翼\u003c/td>\u003ctd>镜翼兽、风隼、雷鹏\u003c/td>\u003ctd>翼膜/羽毛轮廓、起落与俯冲\u003c/td>\u003c/tr>\u003ctr>\u003ctd>刃虫\u003c/td>\u003ctd>空折螳\u003c/td>\u003ctd>双臂攻击扫掠与折跃预告\u003c/td>\u003c/tr>\u003ctr>\u003ctd>巨壳\u003c/td>\u003ctd>虚衡巨龟\u003c/td>\u003ctd>可站立背部、平台与甲柱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鳐/鲸\u003c/td>\u003ctd>噬星鳐、界鲸、吞曜鲸\u003c/td>\u003ctd>鳍面、尾链、真空运动与可打部位\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>寂源古兽用重型四足扩展星核冠与长颈，禁止为了凑复用牺牲可辨识形态。远景高阶首领采用分部位渲染与碰撞，先以 20—120 m 可战斗个体制作；设定中的巨型投影不等于一张百万面模型覆盖整个星球。\u003c/p>\u003ch2>5. 资产预算与交付要求\u003c/h2>\u003cp>普通怪 LOD0 18k—35k 三角，LOD1 8k—15k，LOD2 2k—5k；精英 30k—60k；首领 60k—120k，按部位拆分。普通怪最多 2 套 2K 纹理、3 个材质；首领最多 4 套，低画质使用 1K。预算为制作上限，实际同屏首轮目标 8 普通＋2 精英或 1 首领，超预算必须测量降级，不默认所有 30 种一起加载。\u003c/p>\u003cp>每种交付：概念图与提示词/来源、\u003ccode>.blend\u003c/code> 可编辑源、\u003ccode>.glb\u003c/code> 游戏资产、贴图、骨骼映射、动画事件表、碰撞尺寸、掉落/行为配置 ID、许可记录、版本清单。文件目标目录 \u003ccode>playable/assets/monsters/&lt;id&gt;/\u003c/code>，尚未生成时不创建假 GLB。\u003c/p>\u003cp>命中事件来自动画生效区间与实际空间扫掠；受击部位用简化碰撞而非高模逐三角碰撞。死尸可采集后转低成本残留或淡出，已采记录保留。离开区域释放动画、粒子和贴图引用；重新进入不能复制未领取掉落。\u003c/p>\u003ch2>6. 制作优先级与验收\u003c/h2>\u003cp>先 M00 普通怪 → M01 精英 → 一种药草和一块陨石 → M02 首领 → G00 机关，配合真实炼丹闭环。怪物每次至少验收：无灯/有灯可读轮廓、前后左右视图、脚底与转弯、第一人称近距离、被刀/远程命中、尸体采集、实际掉落进入库存，以及重载和区域往返后的去重。\u003c/p>\u003cp>若使用 aholo，先核验剩余积分与单次报价，优先一次生成一只已确定造型的样板，在 Blender 内修骨架、权重和动作再复用；不一次生成三十只未经验证的怪物。效果不佳时保留来源与问题记录，不声称只调用了工具就实现美术目标。\u003c/p>"},{"file":"07_IMPLEMENTATION_AND_ACCEPTANCE.md","title":"D3-07 · 分阶段开发、数据与验收","text":"# D3-07 · 分阶段开发、数据与验收\n\n\u003c!-- illustrated-overview:start -->\n![先做小而完整的一圈](media/diagram-07-v001.svg)\n\n*图解：设计完成≠玩法实装；每片同时验收数值、输入与3D。*\n\u003c!-- illustrated-overview:end -->\n\n依赖：[D3 总览](README.md)。这里只安排工作，不把文档完成计为游戏实现。禁止直接将当前离线探索原型改成满级全功能菜单。\n\n## 1. 开发切片\n\n|阶段|读取规范|实际交付闭环|结束标准|\n|---|---|---|---|\n|C0 基线与存档|01、07；既有输入/存档/模型文档|旧档备份、字段审计、当前任务资产清单、D3 schema 草案|迁移可逆，未覆盖旧档；确认旧扫描/闪避/飞行/车辆操作|\n|C1 第一场战斗|02、06|玩家生命、刀/发射器、M00 前摇扑击、闪避、受击、昏迷救援|真实武器/怪物 3D，一场完整可输可赢战斗；无固定假伤害、无双倍掉落|\n|C2 战利品与采集|03、04、06|M00 血液、草药、铁陨、背包、一次性拾取、材料品质|击杀/采集→库存→存档，重载不复制；普通路线不靠内丹|\n|C3 NPC 与经济|03、05|领队/医师/锻造师/商人/教习的共用对话框、买卖/炼丹/锻造|掉落→出售/加工→真实装备和制剂；不足、取消、背包满可恢复|\n|C4 后天成长|01、03、05|修为、小级、打坐、72 小时离线、灵石预存、后天淬体槽的三条替换路线|每一级属性可核算；后天只有一个体质槽，三路线互替；离线不跨境|\n|C5 先天突破与首领|01—06|M01/M02、R1 三丹方、先天能力、教习传承突破、F1 交通|两条不同材料路线能突破；一次普通远征目标 20—30 分钟，不等于 30 分钟从后天一级升先天；低核率不软锁|\n|C6 先天—金丹区域|01—06|Z1/Z2/Z3 分批、F2/F3、枪剑锤、相应药材/NPC/怪物|每区新战术与新材料闭环；真实自由往返和强敌救援；分区加载可测|\n|C7 元婴—化神|01—06|Z4/Z5、御器、御空、能量耗尽降落、母星 R6 突破准备|200 m 飞行器上限与御空区分；低气返航、安全落点、界隙材料可收齐|\n|C8 跨星与合道|01—06|空衡/万象落地区、传送、R6/R7 成长、工匠与交易|来回闭环、首次返程保障、下一境材料无循环依赖|\n|C9 星劫与道源|01—06|星空场景、真空护域、巨兽、R8/R9 制剂和装备|回气/救援不软锁，天体尺度与碰撞/加载可验证|\n|C10 终局星核事件|01、04—06|无居民试炼星毁星/封印两结果、陨带、持久化世界变化|目标明确确认，回程与唯一任务不丢失，存档不复原被毁天体|\n\nC4 表中的“淬体槽”指后天一个境界槽中的 A/B/C 三路线，绝不是同时装备三个后天槽。各阶段结束更新当前验收台账与对应规范，报告真实复测路径。后续阶段不能靠测试夹具授予等级就宣称玩家已能正常解锁。\n\n新增横向依赖：[世界刷新 WD0—WD6](09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md) 嵌入上述阶段。C0 准备定义/种子/存档，C1 接第一组怪，C2 接采集再生，C3—C5 接经济约束，再扩随机事件和大地图。刷新系统不单开项目，也不等所有玩法完成后才补建。\n\n本轮补充的开发依赖：C0 先分离 character/world/container/transaction ID；C1 同步实现真实追击、脱战和后天地速；C2 的库存必须有格数/体积/负重，并接车货舱；C3 接恢复药与扩容教学界面；C4—C5 接首个随机洞府/纳物袋、离线疗养与先天速度；C6 扩储物戒、定居洞府和爆发后遗症；C7—C9 接高级空间容器与飞行追逐。不能先把所有物品无限塞进背包，最后才补重量。\n\n未来联网按第 14 文档独立阶段推进，当前仅保持纯逻辑/存储适配边界；联网角色不直接接收不可验证的单机资产。\n\n## 2. 数据模型建议\n\n19—24新增横向切片：C1接统一伤害、WS01/WS03与五阶日志；C3接真实学习/兑换界面；C5接S01外门到正式入门、一个委托和一次NPC比武；C6接R2立宗、一个仓库、AR01告警/AR02盾的供能破坏修复；之后才扩六宗、六十武技和十二阵法。宠物先保留15的PET09地面/PET17载飞路线，再用22的PET03/04/05覆盖攻击/盾/治疗样板。每片同时交真实3D动画与图/视频版本，不能把设计数量当完工数量。\n\n新增定义需明确SkillDefinition的C/a/b、tier、五阶系数、hitType、前/后摇、段权重、资源成本、effectVariant和动画事件；Sect/Building/Formation实例与账本字段见24。优先验收一次“领任务→学招→实战→交付→兑换有效补给”和“学阵→布设→供能→被破坏→修复”的闭环。\n\n|对象|最低字段|\n|---|---|\n|RealmDefinition|id(R0—R9),name,levels,baseScale,capabilities,breakthroughRecipeIds|\n|CultivationProgress|realm,level,xp,bodySlots[10],opportunityIds,trainingState,lastOnlineAt,lastSettledAt|\n|TrainingState|stationId,startedAt,offlineEnabled,spiritBudget,spendEnabled,fractionalCostCarry|\n|ItemDefinition|id,family,tier,qualityRules,stackLimit,tradeable,baseValue,sourceTags|\n|ItemStack/EquipmentInstance|definitionId,quantity,quality,provenance,instanceId,affixes,durability|\n|RecipeDefinition|id,targetRealm,route,inputs,allowedSubstitutes,output,bodySlotEffect,craftTime,serviceRule|\n|CraftOrder|id,npcId,recipeId,lockedInputs,startAt,completeAt,resultSnapshot,status|\n|MonsterDefinition|id,species,realm,rank,stats,aiProfile,animationEvents,hitVolumes,lootProfile|\n|MonsterInstance|id,spawnSeed,zoneId,state,health,lootSeed,deathRecorded,lootClaimed|\n|NPCDefinition|id,zoneId,dialogueRoot,services,stockProfile,craftTierCap,qualityCap|\n|Transaction|id,kind,expectedStateVersion,inputs,outputs,committedAt|\n|WorldProgress|discoveredZones,returnAnchors,rescueStations,uniqueEvents,planetStates,resourceNodes|\n|ContainerDefinition/State|id,ownerId,type,slots,volumeMl,maxInternalMassGrams,transmittedMassRatio,items,bound,revision|\n|StorageExpansionOrder|id,containerId,skillRank,lockedMaterials,beforeCapacity,deltaCapacity,status|\n|CaveInstance/HomeState|id,characterId,seedVersion,roomGraph,coreRewardState,discovered,homeTier,storageIds|\n|MedicineEffect|id,sourceItemId,appliedAt,remainingDuration,aftereffectDebt,treatmentUsed,cooldownFamily|\n|PursuitState|targetId,lastKnownPosition,senseChannels,searchUntil,homeAnchor,velocity,state|\n\n定义只读、进度可存档、战斗瞬态独立；不要把纹理路径、逻辑状态和余额塞进一个 UI 对象。所有稳定 ID 使用 R/W/M/N/Z/P 前缀与本文表对应，名称可以本地化。\n\n金额以碎灵石整数 BigInt 表示，JSON 存十进制字符串。三十份制剂为 `R0-A` 至 `R9-C`；目标境界、材料层级与当前角色境界分开。掉落质量 Q 不与 NPC 段位 R、灵石面额混用。\n\n## 3. 事务与恢复\n\n购买、出售、兑换、炼丹开炉、领取、突破、采集与离线结算都执行：读取带版本状态 → 校验条件和数量 → 构建新状态 → 持久化完整结果 → 发布动画/UI。无法写入时不先播“成功”并从旧状态继续。浏览器本地存储先保留前一份完整备份与事务 ID，不假装多次独立写入天然原子。\n\n重复确认同一事务返回已提交结果。炼丹开炉锁材料，完成后领取标志和入包同次提交；存档损坏不能读成新订单再领一遍。随机掉落在实例首次生成时确定、死亡时确认，载入不重掷。浏览器离线版不提供对抗修改客户端的经济安全承诺。\n\n## 4. 现有原型迁移\n\n- 当前调查主线、黑匣子、地图发现、车辆维修、电池、驾驶视角、扫描器装备、角色/车辆资产保持；D3 新字段以默认后天 1 级增加，不虚构旧玩家击杀历史。\n- 现有身体/装备续航升级保留为 `legacyAdaptation`，先沿用当前 30/60/90/120 秒效果。D3 01 中基础移速不重复乘这些旧续航等级。\n- 旧入门闪避直接视为已学习教学技能；未学玩家仍按教学解锁；保持 E 绑定。旧功法草案中的核心槽未实装部分不迁移成免费装备。\n- R0 扫描/闪避/助推先由设备供电/体力解释；R1 真气上线时逐项指定资源来源，不同时扣两种池。老设备依然可用，不因突破突然消失。\n- 原共振能量草案被“R0 科技电容/R1+真气”覆盖；不能保留一条隐藏恢复条形成无限供能。\n- 旧存档离线时长在首次迁移时不追溯发放数月经验；创建训练记录后才开始计时，界面明确说明。\n- 不删除独立 Godot 旧实现；引擎迁移是单独任务。当前浏览器版先验证战斗与经济，再基于性能决定扩大世界技术路线。\n\n## 5. 必须执行的测试\n\n|模块|关键用例|\n|---|---|\n|境界|100 等级、每境 10 级、9 次跨境、R0 淬体、R9 封顶、三路线互替不叠加、机缘不跨两境|\n|战斗|攻击/重击/格挡/闪避、真实弱点、低帧扫掠、墙后不命中、死亡一次掉落、追击脱离不刷奖|\n|失败救援|低境越区、无钱、空装备耐久、任务唯一样本、传送外星后败北、回站鼠标无需 Alt|\n|掉落|固定种子、R0 0.2% 与 R9 80% 普通核率、机械无血核、10 内丹片替换、品质分布和最低奖励|\n|配方|全部 30 配方有产地/NPC/层级，至少一条无核路线、目标 R 材料在 R−1 可达、R6 材料母星可得|\n|修炼|0/1/71/72/73/96 小时、负时差、重复登录、满槽、自动小升级不跨境、有限预存/无授权不扣石|\n|灵石|五面额各相邻 1:100、反向找零、高额精度、重复兑换无收益、吸收只扣实际价值|\n|交易/制作|不足、背包满、取消、NPC 无钱、服务上限、离线单次完工、一次性领取、崩溃恢复|\n|飞行|0—3 境必须有设备、200 m AGL 封顶、R4 御器、R5 耗气/缓降、R8 护域、无免费悬空回气|\n|世界|地区无等级空气墙、危险预警、复访低阶无修为、首传回程、毁星只改目标、不丢 NPC|\n|UI/3D|640/768/1440 中文不裁切、对话选项可点、第一/第三视角同命中、武器图模对应、怪物多角度/连续动作|\n\n概率单测使用可控种子与大量廉价模拟，不跑几只怪就断言掉率正确；普通游戏流程测试不依赖随机内丹。离线边界使用注入时钟，不让测试真等 72 小时。真实浏览器手测不可用直接改背包绕过唯一的收益入口。\n\n## 6. 调参观察与阶段退出条件\n\n每轮记录首杀耗时、受击次数、失败后返回耗时、一个普通突破的有效游玩时间、材料库存积压、净灵石收入、飞行返航失败率。目标是玩家一次远征至少获得一个可解释的进展；若只获得无用途材料或重复回程，先改任务与经济，再加怪物种类。\n\nC1—C5 验收时由玩家实际体验确认打击感、动作观感和成长回报，自动测试只证明规则一致。未完成动作/素材的项目必须列为未完成，不用文字特效和静态图替代真实玩法。\n\n## 7. 本轮文档交付范围\n\nD3 初稿完成：八份模块文档、十境级别表、三十丹方、二十四固定 NPC、三十生物与两机关、十大武器、母星六区与高阶星球路线、离线/救援/交易/飞行规则。此轮不修改游戏源代码、不生成收费模型、不迁移用户存档。文档检查通过不等于 C0—C10 实现或运行测试通过。\n\n文档结构检查记录：[cultivation-doc-audit.json](../../artifacts/cultivation-doc-audit.json)。检查覆盖八份文档的相对链接、十境属性表与公式、24/30/10 个 NPC/生物/武器唯一编号，以及十境各三份配方共 30 份。复核流程：从总览依次检查模块 → 对照各目标境界材料的上一境来源 → 走查 NPC 产能/品质上限 → 按 C1—C5 首轮路线核对收益入口。本轮未执行游戏运行回归，因为未修改游戏代码。\n\n2026-09-12 刷新系统补充后，文档包扩为十份，最新结构检查还覆盖第 08/09 文档链接与样板刷新配置的 JSON 可解析性。新增内容是架构和实施设计，未实现刷新逻辑或管理面板。\n\n2026-09-12 储物/洞府/丹药/追逐/联网边界补充后，文档包共十五份。新增验收覆盖容量三约束、载具货重、袋戒禁嵌套、七种扩容材料、八类功能药的效果/债务、十境速度单调性、洞府奖励权重与角色种子、个人/在线资产分离。仅做文档结构/数值一致性检查，未宣称这些系统已实装。\n\n2026-09-12 宠物补充：现十九份文档，33种谱系、26名固定NPC。C2—C3先接蛋/饲料/契约库存，C4—C5完成PET09孵化/收服/命名/迷你/地面助战，C5—C6用PET17做后天载飞，随后PET13羽翼空战，再按骨架家族扩品种。资产PA0—PA4顺序见第17文档；任何只完成图片的物种不得标记已可跟随战斗。\n\n新增数据：PetDefinition/PetInstance/TamingProgress/PetMediaRecord参照第18文档。新增验证：33种唯一ID与飞行/食物引用、四档信任可达、七档血脉与十境不混用、普通/破限上限、骑手与宠物双高度/载重、模型和媒体哈希、同名/同种多角色归属。当前仅文档/资产盘点，不宣称宠物已实装。\n\n本轮媒体盘点130份，共213,423,363字节，路径与哈希见第17文档。33条宠物资产注册记录全部 planned；独立备份状态未配置。自动文档检查结果继续写入 `artifacts/cultivation-doc-audit.json`，历史八/十/十五份记录只描述当时阶段，当前计数为十九份、26名NPC。\n","html":"\u003ch1>D3-07 · 分阶段开发、数据与验收\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-07-v001.svg\" alt=\"先做小而完整的一圈\">\u003c/p>\u003cp>\u003cem>图解：设计完成≠玩法实装；每片同时验收数值、输入与3D。\u003c/em>\u003c/p>\u003cp>依赖：\u003ca href=\"#README.md\">D3 总览\u003c/a>。这里只安排工作，不把文档完成计为游戏实现。禁止直接将当前离线探索原型改成满级全功能菜单。\u003c/p>\u003ch2>1. 开发切片\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>读取规范\u003c/th>\u003cth>实际交付闭环\u003c/th>\u003cth>结束标准\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C0 基线与存档\u003c/td>\u003ctd>01、07；既有输入/存档/模型文档\u003c/td>\u003ctd>旧档备份、字段审计、当前任务资产清单、D3 schema 草案\u003c/td>\u003ctd>迁移可逆，未覆盖旧档；确认旧扫描/闪避/飞行/车辆操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C1 第一场战斗\u003c/td>\u003ctd>02、06\u003c/td>\u003ctd>玩家生命、刀/发射器、M00 前摇扑击、闪避、受击、昏迷救援\u003c/td>\u003ctd>真实武器/怪物 3D，一场完整可输可赢战斗；无固定假伤害、无双倍掉落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C2 战利品与采集\u003c/td>\u003ctd>03、04、06\u003c/td>\u003ctd>M00 血液、草药、铁陨、背包、一次性拾取、材料品质\u003c/td>\u003ctd>击杀/采集→库存→存档，重载不复制；普通路线不靠内丹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C3 NPC 与经济\u003c/td>\u003ctd>03、05\u003c/td>\u003ctd>领队/医师/锻造师/商人/教习的共用对话框、买卖/炼丹/锻造\u003c/td>\u003ctd>掉落→出售/加工→真实装备和制剂；不足、取消、背包满可恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C4 后天成长\u003c/td>\u003ctd>01、03、05\u003c/td>\u003ctd>修为、小级、打坐、72 小时离线、灵石预存、后天淬体槽的三条替换路线\u003c/td>\u003ctd>每一级属性可核算；后天只有一个体质槽，三路线互替；离线不跨境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C5 先天突破与首领\u003c/td>\u003ctd>01—06\u003c/td>\u003ctd>M01/M02、R1 三丹方、先天能力、教习传承突破、F1 交通\u003c/td>\u003ctd>两条不同材料路线能突破；一次普通远征目标 20—30 分钟，不等于 30 分钟从后天一级升先天；低核率不软锁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C6 先天—金丹区域\u003c/td>\u003ctd>01—06\u003c/td>\u003ctd>Z1/Z2/Z3 分批、F2/F3、枪剑锤、相应药材/NPC/怪物\u003c/td>\u003ctd>每区新战术与新材料闭环；真实自由往返和强敌救援；分区加载可测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C7 元婴—化神\u003c/td>\u003ctd>01—06\u003c/td>\u003ctd>Z4/Z5、御器、御空、能量耗尽降落、母星 R6 突破准备\u003c/td>\u003ctd>200 m 飞行器上限与御空区分；低气返航、安全落点、界隙材料可收齐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C8 跨星与合道\u003c/td>\u003ctd>01—06\u003c/td>\u003ctd>空衡/万象落地区、传送、R6/R7 成长、工匠与交易\u003c/td>\u003ctd>来回闭环、首次返程保障、下一境材料无循环依赖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C9 星劫与道源\u003c/td>\u003ctd>01—06\u003c/td>\u003ctd>星空场景、真空护域、巨兽、R8/R9 制剂和装备\u003c/td>\u003ctd>回气/救援不软锁，天体尺度与碰撞/加载可验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C10 终局星核事件\u003c/td>\u003ctd>01、04—06\u003c/td>\u003ctd>无居民试炼星毁星/封印两结果、陨带、持久化世界变化\u003c/td>\u003ctd>目标明确确认，回程与唯一任务不丢失，存档不复原被毁天体\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>C4 表中的“淬体槽”指后天一个境界槽中的 A/B/C 三路线，绝不是同时装备三个后天槽。各阶段结束更新当前验收台账与对应规范，报告真实复测路径。后续阶段不能靠测试夹具授予等级就宣称玩家已能正常解锁。\u003c/p>\u003cp>新增横向依赖：\u003ca href=\"#09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md\">世界刷新 WD0—WD6\u003c/a> 嵌入上述阶段。C0 准备定义/种子/存档，C1 接第一组怪，C2 接采集再生，C3—C5 接经济约束，再扩随机事件和大地图。刷新系统不单开项目，也不等所有玩法完成后才补建。\u003c/p>\u003cp>本轮补充的开发依赖：C0 先分离 character/world/container/transaction ID；C1 同步实现真实追击、脱战和后天地速；C2 的库存必须有格数/体积/负重，并接车货舱；C3 接恢复药与扩容教学界面；C4—C5 接首个随机洞府/纳物袋、离线疗养与先天速度；C6 扩储物戒、定居洞府和爆发后遗症；C7—C9 接高级空间容器与飞行追逐。不能先把所有物品无限塞进背包，最后才补重量。\u003c/p>\u003cp>未来联网按第 14 文档独立阶段推进，当前仅保持纯逻辑/存储适配边界；联网角色不直接接收不可验证的单机资产。\u003c/p>\u003ch2>2. 数据模型建议\u003c/h2>\u003cp>19—24新增横向切片：C1接统一伤害、WS01/WS03与五阶日志；C3接真实学习/兑换界面；C5接S01外门到正式入门、一个委托和一次NPC比武；C6接R2立宗、一个仓库、AR01告警/AR02盾的供能破坏修复；之后才扩六宗、六十武技和十二阵法。宠物先保留15的PET09地面/PET17载飞路线，再用22的PET03/04/05覆盖攻击/盾/治疗样板。每片同时交真实3D动画与图/视频版本，不能把设计数量当完工数量。\u003c/p>\u003cp>新增定义需明确SkillDefinition的C/a/b、tier、五阶系数、hitType、前/后摇、段权重、资源成本、effectVariant和动画事件；Sect/Building/Formation实例与账本字段见24。优先验收一次“领任务→学招→实战→交付→兑换有效补给”和“学阵→布设→供能→被破坏→修复”的闭环。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>最低字段\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RealmDefinition\u003c/td>\u003ctd>id(R0—R9),name,levels,baseScale,capabilities,breakthroughRecipeIds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CultivationProgress\u003c/td>\u003ctd>realm,level,xp,bodySlots[10],opportunityIds,trainingState,lastOnlineAt,lastSettledAt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TrainingState\u003c/td>\u003ctd>stationId,startedAt,offlineEnabled,spiritBudget,spendEnabled,fractionalCostCarry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ItemDefinition\u003c/td>\u003ctd>id,family,tier,qualityRules,stackLimit,tradeable,baseValue,sourceTags\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ItemStack/EquipmentInstance\u003c/td>\u003ctd>definitionId,quantity,quality,provenance,instanceId,affixes,durability\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RecipeDefinition\u003c/td>\u003ctd>id,targetRealm,route,inputs,allowedSubstitutes,output,bodySlotEffect,craftTime,serviceRule\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CraftOrder\u003c/td>\u003ctd>id,npcId,recipeId,lockedInputs,startAt,completeAt,resultSnapshot,status\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MonsterDefinition\u003c/td>\u003ctd>id,species,realm,rank,stats,aiProfile,animationEvents,hitVolumes,lootProfile\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MonsterInstance\u003c/td>\u003ctd>id,spawnSeed,zoneId,state,health,lootSeed,deathRecorded,lootClaimed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NPCDefinition\u003c/td>\u003ctd>id,zoneId,dialogueRoot,services,stockProfile,craftTierCap,qualityCap\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transaction\u003c/td>\u003ctd>id,kind,expectedStateVersion,inputs,outputs,committedAt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WorldProgress\u003c/td>\u003ctd>discoveredZones,returnAnchors,rescueStations,uniqueEvents,planetStates,resourceNodes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ContainerDefinition/State\u003c/td>\u003ctd>id,ownerId,type,slots,volumeMl,maxInternalMassGrams,transmittedMassRatio,items,bound,revision\u003c/td>\u003c/tr>\u003ctr>\u003ctd>StorageExpansionOrder\u003c/td>\u003ctd>id,containerId,skillRank,lockedMaterials,beforeCapacity,deltaCapacity,status\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CaveInstance/HomeState\u003c/td>\u003ctd>id,characterId,seedVersion,roomGraph,coreRewardState,discovered,homeTier,storageIds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MedicineEffect\u003c/td>\u003ctd>id,sourceItemId,appliedAt,remainingDuration,aftereffectDebt,treatmentUsed,cooldownFamily\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PursuitState\u003c/td>\u003ctd>targetId,lastKnownPosition,senseChannels,searchUntil,homeAnchor,velocity,state\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>定义只读、进度可存档、战斗瞬态独立；不要把纹理路径、逻辑状态和余额塞进一个 UI 对象。所有稳定 ID 使用 R/W/M/N/Z/P 前缀与本文表对应，名称可以本地化。\u003c/p>\u003cp>金额以碎灵石整数 BigInt 表示，JSON 存十进制字符串。三十份制剂为 \u003ccode>R0-A\u003c/code> 至 \u003ccode>R9-C\u003c/code>；目标境界、材料层级与当前角色境界分开。掉落质量 Q 不与 NPC 段位 R、灵石面额混用。\u003c/p>\u003ch2>3. 事务与恢复\u003c/h2>\u003cp>购买、出售、兑换、炼丹开炉、领取、突破、采集与离线结算都执行：读取带版本状态 → 校验条件和数量 → 构建新状态 → 持久化完整结果 → 发布动画/UI。无法写入时不先播“成功”并从旧状态继续。浏览器本地存储先保留前一份完整备份与事务 ID，不假装多次独立写入天然原子。\u003c/p>\u003cp>重复确认同一事务返回已提交结果。炼丹开炉锁材料，完成后领取标志和入包同次提交；存档损坏不能读成新订单再领一遍。随机掉落在实例首次生成时确定、死亡时确认，载入不重掷。浏览器离线版不提供对抗修改客户端的经济安全承诺。\u003c/p>\u003ch2>4. 现有原型迁移\u003c/h2>\u003cul>\u003cli>当前调查主线、黑匣子、地图发现、车辆维修、电池、驾驶视角、扫描器装备、角色/车辆资产保持；D3 新字段以默认后天 1 级增加，不虚构旧玩家击杀历史。\u003c/li>\u003cli>现有身体/装备续航升级保留为 \u003ccode>legacyAdaptation\u003c/code>，先沿用当前 30/60/90/120 秒效果。D3 01 中基础移速不重复乘这些旧续航等级。\u003c/li>\u003cli>旧入门闪避直接视为已学习教学技能；未学玩家仍按教学解锁；保持 E 绑定。旧功法草案中的核心槽未实装部分不迁移成免费装备。\u003c/li>\u003cli>R0 扫描/闪避/助推先由设备供电/体力解释；R1 真气上线时逐项指定资源来源，不同时扣两种池。老设备依然可用，不因突破突然消失。\u003c/li>\u003cli>原共振能量草案被“R0 科技电容/R1+真气”覆盖；不能保留一条隐藏恢复条形成无限供能。\u003c/li>\u003cli>旧存档离线时长在首次迁移时不追溯发放数月经验；创建训练记录后才开始计时，界面明确说明。\u003c/li>\u003cli>不删除独立 Godot 旧实现；引擎迁移是单独任务。当前浏览器版先验证战斗与经济，再基于性能决定扩大世界技术路线。\u003c/li>\u003c/ul>\u003ch2>5. 必须执行的测试\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>关键用例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>境界\u003c/td>\u003ctd>100 等级、每境 10 级、9 次跨境、R0 淬体、R9 封顶、三路线互替不叠加、机缘不跨两境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>战斗\u003c/td>\u003ctd>攻击/重击/格挡/闪避、真实弱点、低帧扫掠、墙后不命中、死亡一次掉落、追击脱离不刷奖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>失败救援\u003c/td>\u003ctd>低境越区、无钱、空装备耐久、任务唯一样本、传送外星后败北、回站鼠标无需 Alt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>掉落\u003c/td>\u003ctd>固定种子、R0 0.2% 与 R9 80% 普通核率、机械无血核、10 内丹片替换、品质分布和最低奖励\u003c/td>\u003c/tr>\u003ctr>\u003ctd>配方\u003c/td>\u003ctd>全部 30 配方有产地/NPC/层级，至少一条无核路线、目标 R 材料在 R−1 可达、R6 材料母星可得\u003c/td>\u003c/tr>\u003ctr>\u003ctd>修炼\u003c/td>\u003ctd>0/1/71/72/73/96 小时、负时差、重复登录、满槽、自动小升级不跨境、有限预存/无授权不扣石\u003c/td>\u003c/tr>\u003ctr>\u003ctd>灵石\u003c/td>\u003ctd>五面额各相邻 1:100、反向找零、高额精度、重复兑换无收益、吸收只扣实际价值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交易/制作\u003c/td>\u003ctd>不足、背包满、取消、NPC 无钱、服务上限、离线单次完工、一次性领取、崩溃恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>飞行\u003c/td>\u003ctd>0—3 境必须有设备、200 m AGL 封顶、R4 御器、R5 耗气/缓降、R8 护域、无免费悬空回气\u003c/td>\u003c/tr>\u003ctr>\u003ctd>世界\u003c/td>\u003ctd>地区无等级空气墙、危险预警、复访低阶无修为、首传回程、毁星只改目标、不丢 NPC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>UI/3D\u003c/td>\u003ctd>640/768/1440 中文不裁切、对话选项可点、第一/第三视角同命中、武器图模对应、怪物多角度/连续动作\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>概率单测使用可控种子与大量廉价模拟，不跑几只怪就断言掉率正确；普通游戏流程测试不依赖随机内丹。离线边界使用注入时钟，不让测试真等 72 小时。真实浏览器手测不可用直接改背包绕过唯一的收益入口。\u003c/p>\u003ch2>6. 调参观察与阶段退出条件\u003c/h2>\u003cp>每轮记录首杀耗时、受击次数、失败后返回耗时、一个普通突破的有效游玩时间、材料库存积压、净灵石收入、飞行返航失败率。目标是玩家一次远征至少获得一个可解释的进展；若只获得无用途材料或重复回程，先改任务与经济，再加怪物种类。\u003c/p>\u003cp>C1—C5 验收时由玩家实际体验确认打击感、动作观感和成长回报，自动测试只证明规则一致。未完成动作/素材的项目必须列为未完成，不用文字特效和静态图替代真实玩法。\u003c/p>\u003ch2>7. 本轮文档交付范围\u003c/h2>\u003cp>D3 初稿完成：八份模块文档、十境级别表、三十丹方、二十四固定 NPC、三十生物与两机关、十大武器、母星六区与高阶星球路线、离线/救援/交易/飞行规则。此轮不修改游戏源代码、不生成收费模型、不迁移用户存档。文档检查通过不等于 C0—C10 实现或运行测试通过。\u003c/p>\u003cp>文档结构检查记录：\u003ca href=\"../../artifacts/cultivation-doc-audit.json\">cultivation-doc-audit.json\u003c/a>。检查覆盖八份文档的相对链接、十境属性表与公式、24/30/10 个 NPC/生物/武器唯一编号，以及十境各三份配方共 30 份。复核流程：从总览依次检查模块 → 对照各目标境界材料的上一境来源 → 走查 NPC 产能/品质上限 → 按 C1—C5 首轮路线核对收益入口。本轮未执行游戏运行回归，因为未修改游戏代码。\u003c/p>\u003cp>2026-09-12 刷新系统补充后，文档包扩为十份，最新结构检查还覆盖第 08/09 文档链接与样板刷新配置的 JSON 可解析性。新增内容是架构和实施设计，未实现刷新逻辑或管理面板。\u003c/p>\u003cp>2026-09-12 储物/洞府/丹药/追逐/联网边界补充后，文档包共十五份。新增验收覆盖容量三约束、载具货重、袋戒禁嵌套、七种扩容材料、八类功能药的效果/债务、十境速度单调性、洞府奖励权重与角色种子、个人/在线资产分离。仅做文档结构/数值一致性检查，未宣称这些系统已实装。\u003c/p>\u003cp>2026-09-12 宠物补充：现十九份文档，33种谱系、26名固定NPC。C2—C3先接蛋/饲料/契约库存，C4—C5完成PET09孵化/收服/命名/迷你/地面助战，C5—C6用PET17做后天载飞，随后PET13羽翼空战，再按骨架家族扩品种。资产PA0—PA4顺序见第17文档；任何只完成图片的物种不得标记已可跟随战斗。\u003c/p>\u003cp>新增数据：PetDefinition/PetInstance/TamingProgress/PetMediaRecord参照第18文档。新增验证：33种唯一ID与飞行/食物引用、四档信任可达、七档血脉与十境不混用、普通/破限上限、骑手与宠物双高度/载重、模型和媒体哈希、同名/同种多角色归属。当前仅文档/资产盘点，不宣称宠物已实装。\u003c/p>\u003cp>本轮媒体盘点130份，共213,423,363字节，路径与哈希见第17文档。33条宠物资产注册记录全部 planned；独立备份状态未配置。自动文档检查结果继续写入 \u003ccode>artifacts/cultivation-doc-audit.json\u003c/code>，历史八/十/十五份记录只描述当时阶段，当前计数为十九份、26名NPC。\u003c/p>"},{"file":"08_WORLD_DIRECTOR.md","title":"D3-08 · 世界刷新系统：野怪、材料与随机事件","text":"# D3-08 · 世界刷新系统：野怪、材料与随机事件\n\n\u003c!-- illustrated-overview:start -->\n![世界如何刷新](media/diagram-08-v001.svg)\n\n*图解：不在眼前凭空刷怪；读档不重抽极品结果。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12。状态：设计规格，尚未实现。依赖 [D3 总览](README.md)、[境界](01_REALMS_AND_CULTIVATION.md)、[经济](03_ALCHEMY_MATERIALS_ECONOMY.md)、[世界](04_WORLD_REGIONS_EXPLORATION.md)、[怪物](06_MONSTERS_AND_3D.md)。配套 [配置与开发面板](09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md)。\n\n## 1. 放在哪里：同项目、独立模块\n\n当前选择：**放在 star-abyss-game 内，建立独立 world-director 模块，不新建第二个仓库、不另开一个运行服务。** 它是游戏的世界内容调度器，负责何时、何地、以什么条件出现哪些对象；不是独立于玩法的随机刷怪器。\n\n|方案|适用情形|本次判断|\n|---|---|---|\n|同项目独立模块＋数据目录＋调试入口|当前单人、离线浏览器原型，需要共享任务/存档/碰撞/资产|采用，调参与正常游戏共用规则|\n|同仓库独立包/进程|第二款游戏复用，或大规模模拟需要隔离运行|保留边界，以后按证据拆包|\n|独立后端项目|多人共享世界、服务器权威掉落、跨服交易、远程运营|未来另立架构；不为当前单人游戏先做网络依赖|\n\n开新项目不会自动让刷新更可靠；现在反而会把境界、物品 ID、任务状态和存档协议复制两份。开发面板可以有独立网页入口，但仍属于本仓库，也不成为玩家必须打开的第二个软件。\n\n当前源码核对：`playable/src/rocks.mjs` 用固定种子构造岩石，服务地形显示与碰撞；`meteor-scene.mjs` 增加陨石外观细节；`main.mjs` 集中序列化与本地保存探索状态。它们都不是 D3 的资源采集/野怪刷新系统。新模块不得把现有岩石 ID 重排后破坏旧坐标，也不得把每块岩石都默认为可采陨石。\n\n## 2. 系统管什么、不越权管什么\n\n输入：世界种子、规则版本、区域生态、可达地形、时间/天气、发现记录、任务约束、玩家位置、渲染/AI预算。输出：可落盘的刷新计划、对象实例、事件资格、候选被拒原因与统计。\n\n管理六类内容：普通/精英/首领种群、药草与矿物节点、动态陨落、随机遭遇、稀有机缘、商站补货资格。境界系统负责升级，战斗系统负责生命/伤害，库存系统负责入包，交易系统负责价格；刷新系统不直接给玩家加等级、调物价或扣钱。\n\n新增 [随机洞府](11_CAVES_AND_FORTUNES.md) 作为有入口/布局/守卫/一次性奖励的事件实例；法器、扩容材料、丹药进入合法奖励池，不另做一套无来源发奖器。私人定居洞府由角色所有权管理，登记后不被普通刷新替换。联网权威与个人机缘种子边界见 [第 14 文档](14_OFFLINE_AND_ONLINE_BOUNDARY.md)。\n\n固定 NPC、主线唯一证据、已建安全点、传送阵由内容定义和任务状态控制，不混入普通随机池。商店只收到“可补货”事件，实际库存与钱由经济模块一次性提交。随机事件的脚本可以产生委托，不能随意改主线前置。\n\n```mermaid\nflowchart LR\n  A[区域生态与候选位置] --> D[刷新调度]\n  B[任务约束与探索记录] --> D\n  C[时间 天气 世界种子] --> D\n  D --> E[可达性 安全区 数量预算检查]\n  E --> F[提交实例与持久化状态]\n  F --> G[3D显示与怪物AI]\n  G --> H[战斗 采集 事件结算]\n  H --> I[库存 成长 任务]\n  H --> J[已消耗记录与再生冷却]\n  J --> D\n```\n\n## 3. 四层世界内容\n\n1. 固定层：营地、地形、主线终端、NPC、传送阵、保护通道。不能被随机刷怪占住。\n2. 生态层：生境区、怪物巢穴、药圃、矿脉、巡游路线。定义长期在哪里可能出现什么。\n3. 实例层：某一代掠兽、某一株月露苔、某次陨落，含数量、质量、状态与冷却。\n4. 事件层：猎兽迁徙、受困勘测队、星辉机缘等，拥有独立条件、参与状态和一次性结果。\n\n同一巢穴可以再次出怪，但上一代尸体未处理时不能在尸体上无条件叠新怪。材料可再生，但采过一次的节点在冷却内不能因区域卸载再出现。随机位置必须在已制作的生境候选区，不把整个 64×64 公里大陆当作均匀撒点平面。\n\n## 4. 与境界、任务、经济绑定的原则\n\n- 怪物境界由区域和物种定义，R0 区不会因玩家到 R5 就自动变 R5；高境返回仍能收低阶材料，但不刷低阶修为。\n- 玩家的境界影响传闻、可参与的事件和奖励使用资格，不用于暗中提高当前怪物血量或暗改内丹率。\n- 主线用“约束”保证至少一条成长路径：必需草、普通血与基础矿有固定可再生来源；随机事件增加选择，不决定能否升级。\n- 目标境界 R 的配方材料需要在 R−1 的可达内容中存在，R6 材料必须在母星 Z5 可得。系统加载配置时先检查依赖图，发现循环就拒绝该规则包。\n- 怪物死亡通知掉落模块，掉落模块引用 D3-03 概率表；调度器绝不因为“玩家最近运气差”改完整内丹概率。若增加公开保底，须另写规则和 UI，不偷偷实现。\n- 采集、委托和掉落共同产生经济供给，但“材料库存少”仅可让已定义的商人发布需求或传闻，不直接往玩家脚下塞缺失材料。\n- 药草消失、矿点枯竭、怪物返巢都有可读状态；地图只显示玩家发现的地点和大致成熟信息，开发面板的完整位置不暴露给正常 UI。\n\n## 5. 分区与运行预算\n\n内容区域 Z0—Z5 是玩法尺度；内部以 **256×256 米调度块**索引候选点和状态，坐标含 `planetId/zoneId/cellX/cellZ/heightBand`。这与现有岩石的 32 米碰撞索引不是同一层，不替换它。地下、地表、浮空平台用 heightBand 区分。\n\n初始三档：距玩家约 160 米内进行完整 AI/碰撞；160—600 米保留低频活动状态与合适 LOD；更远仅保存数据和到期时间。边界带 40 米滞回，避免站在边界来回加载。数字只是首轮配置，需按实机性能调整。\n\n步行以所在块和相邻块预热；载具/飞行按实际速度预测前方 5 秒路径，至少预热两块。相机看见的远景也要保证已有对象可显示，但不能只因为转头就新建一批怪物实例。\n\n首轮战斗预算：同时完整运行最多 8 普通＋2 精英，或 1 首领及其最多 4 个普通召唤物；首领战时使用后者预算。超预算对象保留既有身份、降频或延后入场，不直接无痕删除正在追击的敌人。预算是性能上限，生态数量上限另外配置。\n\n调度默认每秒一次；战斗命中沿现有仿真步运行，不能让每秒刷新的节奏降低碰撞精度。每次最多检测 8 个新生点、提交 2 个普通刷新计划，首领计划独占一次提交；超时排队。最终帧耗时上限由目标机器测量确定。\n\n## 6. 刷新默认规则\n\n本节所有“间隔”是**真实消耗后的最早补充时间**，不是定时覆盖现物。消费事务生成一次性空缺令牌；没有令牌，即使过期也不能再生。首次布置与后续换代分开；具体消耗条件、建筑例外、不同组合和世界唯一账本以[27](27_CONSUMPTION_AND_UNIQUE_WORLD.md)为准。\n\n时间均为有效游玩时钟的秒数；菜单/暂停冻结。显示昼夜可加速，但不把“8 分钟刷新”隐式变成 8 秒。\n\n|对象|再生起点与间隔候选|数量/生成限制|生成后的保存方式|\n|---|---|---|---|\n|普通怪群|该群最后一只死亡后 8—12 分钟，间隔首次确定|每巢 2—4 只，区域种群上限；未结束追击不重建|每只实例和巢代数保存|\n|精英|死亡后 25—40 分钟|每个精英栖地最多 1 只；需环境条件|身份、冷却、掉落种子保存|\n|可重复首领|首次任务胜利后进入 90—120 分钟再挑战冷却|需明确再挑战交互/进入场地，不在玩家身后自动刷|首杀知识永不再发；后续挑战有新实例|\n|普通药草|采完后 12—20 分钟|每药圃 3—6 个节点，一次成熟 1 代|成熟时间、质量、产量固定|\n|环境药草|采完后至少 30 分钟且满足天气/昼夜|符合条件才成熟；普通任务须有替代路线|条件窗口和已成熟状态保存|\n|小矿脉|采尽后 30—45 分钟|每脉储量固定，分次开采不重置品级|剩余储量/代数保存|\n|稀有矿脉|采尽后 90—120 分钟|在定义的高级矿带出现，有产量上限|本代主材和副产物提前确定|\n|动态陨落|首次可布置；旧陨落采尽/实际清理后间隔30—60分钟|每区最多1个未处理陨落，未采不因计时过期|轨迹、落点、热度、矿量及消耗令牌保存|\n|一般遭遇|新探索推进后，距上次约 8—15 分钟|最多 1 个主要遭遇；不能覆盖首领战/重要对话|已提示、参与、结算/过期状态保存|\n|极稀有机缘|每次独立合格首次调查尝试 0.3%|同唯一事件一次，非计时刷出|成功或失败的尝试都记录|\n\n每次间隔采用该代独立随机数固定抽取，不能每帧重抽延后时间。正在打的怪、已成熟未采的草不因为新时段开始换一份品质。事件召唤物也占种群/AI预算，须指定能否掉落；首领无限召唤的小怪默认无材料/修为，防止拖战刷收益。\n\n## 7. 出生位置与“不能当面凭空出现”\n\n先选生境候选点，再检查地形坡度/支撑、碰撞占用、怪物尺寸、巡游可达性、水深/洞内权限、活动预算和保护范围。新出生普通怪至少离玩家 45 米，精英 80 米；安全站边界外再留 80 米无敌对生成缓冲，唯一交互点周边留 20 米，必要通道不可阻塞。\n\n距离只是最低条件：还必须不在当前可见空间，或有合法的洞穴出洞/掘地/降落等可见入场动画。第一人称正前方、第三人称相机视野、载具预测路径均参与检查；不能按玩家身体朝向判断“背后就安全”。相机视野外也不能在 45 米内突然出生。\n\n已有怪物正常巡逻走入视野不算刷新。触发式伏击必须事先有足迹/声音/任务提示，并通过实际入口进入；不会把敌人直接放在玩家碰撞体内。无法找到位置就排队，记录 blocked_reason，不降低安全条件硬塞。\n\n药草采完后的新一代可在合法邻近空位生长，或由旧根株长出不同组合的新收成；正在生长/未采一代的品质固定，不能瞬间换点。矿脉采尽后的下一代矿芯按27轮换伴生组合，不移动整座碰撞岩体。陨落须先有实际采尽/清理空缺，再给轨迹、声响与落点预兆；提交前复核保护区域和玩家位置，冲突就延后，不靠改落点新增第二份资源。\n\n## 8. 随机数与可复现性\n\n新档创建并保存 `worldSeed`。派生流使用稳定编码的 `worldSeed + rulesVersion + planetId + zoneId + anchorId + generation + purpose`，purpose 分为 spawn/species/interval/loot/quality/event。禁止业务奖励使用 `Math.random()` 或全局共享可变随机流；粒子可另用不影响玩法的随机数。\n\n种子产生的是可重复结果，不自动等于保存：还要保存哪些代已经生成、死亡、采集、结算。怪物首次建立持久化实例时确定 lootSeed；质量/具体掉落可延迟计算，但算法版本与种子固定。修改其余区域内容不能改变已经存在的怪物掉落。\n\n个人洞府/机缘另用 `characterId + characterFortuneSeed + discoveryOpportunityId + purpose` 派生，不与共享地形种子混用；结果附规则版本。新角色有独立机会记录，重进同一角色不会重抽。已有普通生态实例仍按世界种子；未来共享野怪与个人奖励权威分离，不能每客户端生成不同公共怪物。\n\n只对新增代应用新版规则；已存在的实例绑定其原规则快照或可解析版本。游戏更新不能将旧尸体重新抽成新品，也不能因为排序改变发出不同 IDs。PRNG 具体算法在实现时选定并加入固定输入/输出向量；跨平台须一致，不能只保存“seed”而忘记算法版本。\n\n这能防止正常刷新、重进和重新载入当前状态时重复抽奖，**不能阻止纯离线玩家回滚整份旧存档或修改客户端**。若以后接联网交易，掉落和时间必须转为服务端权威，不能把本地种子当防作弊方案。\n\n## 9. 对象状态与掉落事务\n\n普通种群：`alive → defeatCommitted → vacancyCreated → cooling → eligible → reserved → nextGenerationCommitted`；合法收服也可通过人口转移产生空缺。eligible要求空缺令牌和到期条件同时满足。每只个体独立记录，群体补充仍在最后成员死亡/转移后开始；掉落容器走独立生命周期，不将物品未领误当怪物还活着。\n\n可采节点：`growing → mature → harvesting → depleted → growing`。采集提交扣剩余储量并入包同次完成；取消读条回 mature，不偷扣一份材料。资源品质属于当前代，剩余次数属于同一库存。\n\n事件：`candidate → reserved → telegraphed → active → resolved/expired`。玩家接受的事件在远处卸载时保留简化状态；未参与的一般事件到期可消失，但不会自动发奖励。唯一机缘成功触发后转为已发现机会，未领取不会离线悄悄消失；已拒绝/已完成按事件明示规则记录，不能换区重新抽。\n\n战利品id采用`monsterInstanceId + rewardIndex`；死亡记录、空缺来源与战利品清单同次落盘，拾取与入库同次落盘。尸体3D可淡出，但未领物品转为持久遗留标记，取消旧15分钟自动过期规则。普通剩余物可由玩家明确放弃，唯一/任务物不自动清理。新怪不得与原尸体叠放，每锚点未结算普通战利品容器达到3个时暂停该锚点补怪；其它锚点独立运转，详见27。\n\n## 10. 离线、暂停与重登\n\n三个时钟各有职责：\n\n|时钟|推进方式|用途|\n|---|---|---|\n|simTime|只在正常游玩时推进，暂停不动|战斗、追击、物品期限、在线生态冷却|\n|civilTime|昼夜/气象日历，由配置控制与 simTime 的比例|夜开花、雷雨条件、商站在线补货日历|\n|wallTime|真实时间，带已结算最大值/可信来源说明|离线修炼、单次制单完成、离线生态资格|\n\n离线修炼仍独立遵守 72 小时上限。刷新模块不会离线打怪、自动采矿、累计数百次陨落或奖励。离线生态采用保守恢复：本次未结算离线间隔最多提供 **30 分钟再生抵扣**，且每个已消耗普通怪巢/草/矿最多推进一代；抵扣只用于变成 eligible，回到游戏并通过出生检查后才实际生成。\n\n活动中的怪、未采成熟节点、未领尸体不在离线期间视为被杀/被采或换代；追击载入时在原合理位置复原，先有可控输入和安全恢复窗口，不能玩家还在载入就受伤。精英、首领、动态陨落与机缘不获得离线冷却抵扣，必须通过各自有效游玩/挑战规则。\n\n每个耗尽状态保存剩余冷却与已应用离线区间；同一离线区间只结算一次，反复登录不重复赠送 30 分钟。暂停只是暂停，不当作一次离线领取；只有正常退出或确认的后台长挂进入重登流程才计算一次，不能开关菜单刷再生。\n\n商站“每24游戏小时、离线最多一次”仅是对已售缺额的补货窗口。未卖的货原样保留；新到货有运输/生产来源，不整页重抽品质。在线civilTime以12倍simTime推进，窗口为120分钟游玩；离线至少24小时才获一次缺额补充资格。每NPC保存缺额令牌、到货单和lastRestockAt；玩家卖给商人的回购物独立保留。\n\n## 11. 事件多样性与稀有机缘\n\n一般遭遇每 60 秒检查一次资格，但必须满足距上一事件 8—15 分钟、推进到一个未消耗探索机会点、当前不在首领战/关键对话、存在可达入口，才尝试挑选；不是每 60 秒都抽 0.3% 机缘。最近三个同类事件降低一般选择权重，最多同类连续两次；不影响独立的内丹/品质骰。\n\n“合格首次调查”是作者或区域生成器定义的 `discoveryOpportunityId`，如首次完成某遗址调查、找到某独特地脉；穿过一个调度块、打开一次地图、重复杀同一巢的怪都不算。ID 集合持久化，首次完成时原子记录已尝试，再用专属流进行一次 0.3% 机缘尝试；失败也记录，不能刷进出。\n\n成功后在匹配资格的机缘池选择内容；唯一类先查世界根唯一账，未领取但已预留也不可再次抽到。无落点可保留原资格，不能重掷稀有概率；唯一池耗尽与空间暂缺分别处理，见27。普通生态换代不生成新的首次调查机会；26的逆天传承也不能靠反复采同一矿重抽。\n\n普通探索洞府采用独立的 8% 线索尝试/第七次保底规则（第 11 文档），不调用永久机缘 0.3% 骰；线索、洞府布局、主要奖励三者都有稳定实例 ID。人物负重只影响到达能力和拾取容量，不改变奖励品质；满包时保留洞府核心领取状态供回取，不把一次未入包当作已领取。\n\n宠物新增独立 PET 野生/蛋巢规则：生成时固定血脉潜力、性格和外观种子，收服信任/有效喂食/迁徙轨迹随实例保存。成熟期难度按第15文档，不因角色升级重抽幼体；已契约宠从野生人口账转个人所有权，死亡战利品和收服奖励互斥。宠物蛋作为第11文档既有主要奖励类别下的版本化子项配置，完整权重必须重新归一化，不能不改总表又附加一个无限额33种蛋骰。稀有破限契约只进入永久机缘的合法子池。\n\n当前新洞府奖励表已在第11文档调整为七类，宠物类8%，其中50%蛋/50%培养材料；旧洞府仍保持原实例版本。已缔约宠倒地不产血液/内丹，也不能释放后按原实例反复抓取/击杀领取唯一奖励。\n\n## 12. 与存档、版本和工程的边界\n\n建议目录（将来实现，不预先放空模块冒充完成）：\n\n```text\nplayable/src/world-director/\n  director.mjs          # 调度与计划\n  state.mjs             # 实例、代数、冷却、事务状态\n  rng.mjs               # 可复现派生随机流\n  policies.mjs          # 任务、区域、安全与预算约束\n  placement.mjs         # 位置校验接口\n  events.mjs            # 遭遇/稀有机会\n  persistence.mjs       # 序列化/迁移\n  adapters/             # 接 main、战斗、库存、3D；逻辑核心不依赖 Three.js\nplayable/data/world-director/  # 生境、刷新、掉落引用、事件配置\ntools/world-director/         # 校验、模拟、诊断与开发入口\n```\n\n逻辑核心接收注入时钟、随机流和空间查询，输出 plans，不直接操纵 DOM/Three.js/localStorage。适配层统一提交世界状态及库存相关事务。世界视图只消费已确认实例，不能先显示怪物再补存档。\n\n旧档迁移新增 `director.schemaVersion/worldSeed/rulesVersion/cellStates/anchorGenerations/uniqueClaims/discoveryAttempts`；首次迁移不追溯几年离线资源、不替换固定地形。只存变化过的块和必要高水位，远处未访问区域按定义懒生成。死亡/已领记录可压缩成代数高水位＋未结算例外；旧实例请求仍需被高水位拒绝，不因垃圾回收再次有效。\n\n首片小数据可接现有存储适配器；64×64 公里阶段评估 IndexedDB 分块存储和事务，达到容量/写入耗时阈值前必须迁移，不能把全部世界每帧 JSON.stringify 到 localStorage。迁移失败保留原档，显示错误并禁止继续生成有奖励对象。\n\n## 13. 可验收的第一版\n\n只做 Z0 一小块：2 个掠兽巢、1 个棘背精英点、2 个药圃、1 条铁陨矿脉、1 个普通陨落事件候选；再接一次固定教学任务。验证杀怪/采集后冷却，远离回来才安全再生；存档与重进结果一致；同一材料能进入 D3 的炼丹/锻造。没有真实采集与库存时，不能只在地图上循环出现光点就算完成。\n\n验收必须覆盖：视线内不凭空刷怪、顶着巢穴不无限出怪、进出块不重置、离线不积累奖励、暂停不刷新、固定种子复现、老版本实例不变、缺候选只排队、必需材料可达、资源/实例上限、已领取无法再领，以及高阶返回新手区不会把怪物升级。\n","html":"\u003ch1>D3-08 · 世界刷新系统：野怪、材料与随机事件\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-08-v001.svg\" alt=\"世界如何刷新\">\u003c/p>\u003cp>\u003cem>图解：不在眼前凭空刷怪；读档不重抽极品结果。\u003c/em>\u003c/p>\u003cp>2026-09-12。状态：设计规格，尚未实现。依赖 \u003ca href=\"#README.md\">D3 总览\u003c/a>、\u003ca href=\"#01_REALMS_AND_CULTIVATION.md\">境界\u003c/a>、\u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">经济\u003c/a>、\u003ca href=\"#04_WORLD_REGIONS_EXPLORATION.md\">世界\u003c/a>、\u003ca href=\"#06_MONSTERS_AND_3D.md\">怪物\u003c/a>。配套 \u003ca href=\"#09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md\">配置与开发面板\u003c/a>。\u003c/p>\u003ch2>1. 放在哪里：同项目、独立模块\u003c/h2>\u003cp>当前选择：\u003cstrong>放在 star-abyss-game 内，建立独立 world-director 模块，不新建第二个仓库、不另开一个运行服务。\u003c/strong> 它是游戏的世界内容调度器，负责何时、何地、以什么条件出现哪些对象；不是独立于玩法的随机刷怪器。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方案\u003c/th>\u003cth>适用情形\u003c/th>\u003cth>本次判断\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>同项目独立模块＋数据目录＋调试入口\u003c/td>\u003ctd>当前单人、离线浏览器原型，需要共享任务/存档/碰撞/资产\u003c/td>\u003ctd>采用，调参与正常游戏共用规则\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同仓库独立包/进程\u003c/td>\u003ctd>第二款游戏复用，或大规模模拟需要隔离运行\u003c/td>\u003ctd>保留边界，以后按证据拆包\u003c/td>\u003c/tr>\u003ctr>\u003ctd>独立后端项目\u003c/td>\u003ctd>多人共享世界、服务器权威掉落、跨服交易、远程运营\u003c/td>\u003ctd>未来另立架构；不为当前单人游戏先做网络依赖\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>开新项目不会自动让刷新更可靠；现在反而会把境界、物品 ID、任务状态和存档协议复制两份。开发面板可以有独立网页入口，但仍属于本仓库，也不成为玩家必须打开的第二个软件。\u003c/p>\u003cp>当前源码核对：\u003ccode>playable/src/rocks.mjs\u003c/code> 用固定种子构造岩石，服务地形显示与碰撞；\u003ccode>meteor-scene.mjs\u003c/code> 增加陨石外观细节；\u003ccode>main.mjs\u003c/code> 集中序列化与本地保存探索状态。它们都不是 D3 的资源采集/野怪刷新系统。新模块不得把现有岩石 ID 重排后破坏旧坐标，也不得把每块岩石都默认为可采陨石。\u003c/p>\u003ch2>2. 系统管什么、不越权管什么\u003c/h2>\u003cp>输入：世界种子、规则版本、区域生态、可达地形、时间/天气、发现记录、任务约束、玩家位置、渲染/AI预算。输出：可落盘的刷新计划、对象实例、事件资格、候选被拒原因与统计。\u003c/p>\u003cp>管理六类内容：普通/精英/首领种群、药草与矿物节点、动态陨落、随机遭遇、稀有机缘、商站补货资格。境界系统负责升级，战斗系统负责生命/伤害，库存系统负责入包，交易系统负责价格；刷新系统不直接给玩家加等级、调物价或扣钱。\u003c/p>\u003cp>新增 \u003ca href=\"#11_CAVES_AND_FORTUNES.md\">随机洞府\u003c/a> 作为有入口/布局/守卫/一次性奖励的事件实例；法器、扩容材料、丹药进入合法奖励池，不另做一套无来源发奖器。私人定居洞府由角色所有权管理，登记后不被普通刷新替换。联网权威与个人机缘种子边界见 \u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">第 14 文档\u003c/a>。\u003c/p>\u003cp>固定 NPC、主线唯一证据、已建安全点、传送阵由内容定义和任务状态控制，不混入普通随机池。商店只收到“可补货”事件，实际库存与钱由经济模块一次性提交。随机事件的脚本可以产生委托，不能随意改主线前置。\u003c/p>\u003cpre>\u003ccode>flowchart LR\n  A[区域生态与候选位置] --&gt; D[刷新调度]\n  B[任务约束与探索记录] --&gt; D\n  C[时间 天气 世界种子] --&gt; D\n  D --&gt; E[可达性 安全区 数量预算检查]\n  E --&gt; F[提交实例与持久化状态]\n  F --&gt; G[3D显示与怪物AI]\n  G --&gt; H[战斗 采集 事件结算]\n  H --&gt; I[库存 成长 任务]\n  H --&gt; J[已消耗记录与再生冷却]\n  J --&gt; D\u003c/code>\u003c/pre>\u003ch2>3. 四层世界内容\u003c/h2>\u003col>\u003cli>固定层：营地、地形、主线终端、NPC、传送阵、保护通道。不能被随机刷怪占住。\u003c/li>\u003cli>生态层：生境区、怪物巢穴、药圃、矿脉、巡游路线。定义长期在哪里可能出现什么。\u003c/li>\u003cli>实例层：某一代掠兽、某一株月露苔、某次陨落，含数量、质量、状态与冷却。\u003c/li>\u003cli>事件层：猎兽迁徙、受困勘测队、星辉机缘等，拥有独立条件、参与状态和一次性结果。\u003c/li>\u003c/ol>\u003cp>同一巢穴可以再次出怪，但上一代尸体未处理时不能在尸体上无条件叠新怪。材料可再生，但采过一次的节点在冷却内不能因区域卸载再出现。随机位置必须在已制作的生境候选区，不把整个 64×64 公里大陆当作均匀撒点平面。\u003c/p>\u003ch2>4. 与境界、任务、经济绑定的原则\u003c/h2>\u003cul>\u003cli>怪物境界由区域和物种定义，R0 区不会因玩家到 R5 就自动变 R5；高境返回仍能收低阶材料，但不刷低阶修为。\u003c/li>\u003cli>玩家的境界影响传闻、可参与的事件和奖励使用资格，不用于暗中提高当前怪物血量或暗改内丹率。\u003c/li>\u003cli>主线用“约束”保证至少一条成长路径：必需草、普通血与基础矿有固定可再生来源；随机事件增加选择，不决定能否升级。\u003c/li>\u003cli>目标境界 R 的配方材料需要在 R−1 的可达内容中存在，R6 材料必须在母星 Z5 可得。系统加载配置时先检查依赖图，发现循环就拒绝该规则包。\u003c/li>\u003cli>怪物死亡通知掉落模块，掉落模块引用 D3-03 概率表；调度器绝不因为“玩家最近运气差”改完整内丹概率。若增加公开保底，须另写规则和 UI，不偷偷实现。\u003c/li>\u003cli>采集、委托和掉落共同产生经济供给，但“材料库存少”仅可让已定义的商人发布需求或传闻，不直接往玩家脚下塞缺失材料。\u003c/li>\u003cli>药草消失、矿点枯竭、怪物返巢都有可读状态；地图只显示玩家发现的地点和大致成熟信息，开发面板的完整位置不暴露给正常 UI。\u003c/li>\u003c/ul>\u003ch2>5. 分区与运行预算\u003c/h2>\u003cp>内容区域 Z0—Z5 是玩法尺度；内部以 \u003cstrong>256×256 米调度块\u003c/strong>索引候选点和状态，坐标含 \u003ccode>planetId/zoneId/cellX/cellZ/heightBand\u003c/code>。这与现有岩石的 32 米碰撞索引不是同一层，不替换它。地下、地表、浮空平台用 heightBand 区分。\u003c/p>\u003cp>初始三档：距玩家约 160 米内进行完整 AI/碰撞；160—600 米保留低频活动状态与合适 LOD；更远仅保存数据和到期时间。边界带 40 米滞回，避免站在边界来回加载。数字只是首轮配置，需按实机性能调整。\u003c/p>\u003cp>步行以所在块和相邻块预热；载具/飞行按实际速度预测前方 5 秒路径，至少预热两块。相机看见的远景也要保证已有对象可显示，但不能只因为转头就新建一批怪物实例。\u003c/p>\u003cp>首轮战斗预算：同时完整运行最多 8 普通＋2 精英，或 1 首领及其最多 4 个普通召唤物；首领战时使用后者预算。超预算对象保留既有身份、降频或延后入场，不直接无痕删除正在追击的敌人。预算是性能上限，生态数量上限另外配置。\u003c/p>\u003cp>调度默认每秒一次；战斗命中沿现有仿真步运行，不能让每秒刷新的节奏降低碰撞精度。每次最多检测 8 个新生点、提交 2 个普通刷新计划，首领计划独占一次提交；超时排队。最终帧耗时上限由目标机器测量确定。\u003c/p>\u003ch2>6. 刷新默认规则\u003c/h2>\u003cp>本节所有“间隔”是\u003cstrong>真实消耗后的最早补充时间\u003c/strong>，不是定时覆盖现物。消费事务生成一次性空缺令牌；没有令牌，即使过期也不能再生。首次布置与后续换代分开；具体消耗条件、建筑例外、不同组合和世界唯一账本以\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27\u003c/a>为准。\u003c/p>\u003cp>时间均为有效游玩时钟的秒数；菜单/暂停冻结。显示昼夜可加速，但不把“8 分钟刷新”隐式变成 8 秒。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>再生起点与间隔候选\u003c/th>\u003cth>数量/生成限制\u003c/th>\u003cth>生成后的保存方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>普通怪群\u003c/td>\u003ctd>该群最后一只死亡后 8—12 分钟，间隔首次确定\u003c/td>\u003ctd>每巢 2—4 只，区域种群上限；未结束追击不重建\u003c/td>\u003ctd>每只实例和巢代数保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>精英\u003c/td>\u003ctd>死亡后 25—40 分钟\u003c/td>\u003ctd>每个精英栖地最多 1 只；需环境条件\u003c/td>\u003ctd>身份、冷却、掉落种子保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可重复首领\u003c/td>\u003ctd>首次任务胜利后进入 90—120 分钟再挑战冷却\u003c/td>\u003ctd>需明确再挑战交互/进入场地，不在玩家身后自动刷\u003c/td>\u003ctd>首杀知识永不再发；后续挑战有新实例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>普通药草\u003c/td>\u003ctd>采完后 12—20 分钟\u003c/td>\u003ctd>每药圃 3—6 个节点，一次成熟 1 代\u003c/td>\u003ctd>成熟时间、质量、产量固定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>环境药草\u003c/td>\u003ctd>采完后至少 30 分钟且满足天气/昼夜\u003c/td>\u003ctd>符合条件才成熟；普通任务须有替代路线\u003c/td>\u003ctd>条件窗口和已成熟状态保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小矿脉\u003c/td>\u003ctd>采尽后 30—45 分钟\u003c/td>\u003ctd>每脉储量固定，分次开采不重置品级\u003c/td>\u003ctd>剩余储量/代数保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>稀有矿脉\u003c/td>\u003ctd>采尽后 90—120 分钟\u003c/td>\u003ctd>在定义的高级矿带出现，有产量上限\u003c/td>\u003ctd>本代主材和副产物提前确定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>动态陨落\u003c/td>\u003ctd>首次可布置；旧陨落采尽/实际清理后间隔30—60分钟\u003c/td>\u003ctd>每区最多1个未处理陨落，未采不因计时过期\u003c/td>\u003ctd>轨迹、落点、热度、矿量及消耗令牌保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般遭遇\u003c/td>\u003ctd>新探索推进后，距上次约 8—15 分钟\u003c/td>\u003ctd>最多 1 个主要遭遇；不能覆盖首领战/重要对话\u003c/td>\u003ctd>已提示、参与、结算/过期状态保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>极稀有机缘\u003c/td>\u003ctd>每次独立合格首次调查尝试 0.3%\u003c/td>\u003ctd>同唯一事件一次，非计时刷出\u003c/td>\u003ctd>成功或失败的尝试都记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每次间隔采用该代独立随机数固定抽取，不能每帧重抽延后时间。正在打的怪、已成熟未采的草不因为新时段开始换一份品质。事件召唤物也占种群/AI预算，须指定能否掉落；首领无限召唤的小怪默认无材料/修为，防止拖战刷收益。\u003c/p>\u003ch2>7. 出生位置与“不能当面凭空出现”\u003c/h2>\u003cp>先选生境候选点，再检查地形坡度/支撑、碰撞占用、怪物尺寸、巡游可达性、水深/洞内权限、活动预算和保护范围。新出生普通怪至少离玩家 45 米，精英 80 米；安全站边界外再留 80 米无敌对生成缓冲，唯一交互点周边留 20 米，必要通道不可阻塞。\u003c/p>\u003cp>距离只是最低条件：还必须不在当前可见空间，或有合法的洞穴出洞/掘地/降落等可见入场动画。第一人称正前方、第三人称相机视野、载具预测路径均参与检查；不能按玩家身体朝向判断“背后就安全”。相机视野外也不能在 45 米内突然出生。\u003c/p>\u003cp>已有怪物正常巡逻走入视野不算刷新。触发式伏击必须事先有足迹/声音/任务提示，并通过实际入口进入；不会把敌人直接放在玩家碰撞体内。无法找到位置就排队，记录 blocked_reason，不降低安全条件硬塞。\u003c/p>\u003cp>药草采完后的新一代可在合法邻近空位生长，或由旧根株长出不同组合的新收成；正在生长/未采一代的品质固定，不能瞬间换点。矿脉采尽后的下一代矿芯按27轮换伴生组合，不移动整座碰撞岩体。陨落须先有实际采尽/清理空缺，再给轨迹、声响与落点预兆；提交前复核保护区域和玩家位置，冲突就延后，不靠改落点新增第二份资源。\u003c/p>\u003ch2>8. 随机数与可复现性\u003c/h2>\u003cp>新档创建并保存 \u003ccode>worldSeed\u003c/code>。派生流使用稳定编码的 \u003ccode>worldSeed + rulesVersion + planetId + zoneId + anchorId + generation + purpose\u003c/code>，purpose 分为 spawn/species/interval/loot/quality/event。禁止业务奖励使用 \u003ccode>Math.random()\u003c/code> 或全局共享可变随机流；粒子可另用不影响玩法的随机数。\u003c/p>\u003cp>种子产生的是可重复结果，不自动等于保存：还要保存哪些代已经生成、死亡、采集、结算。怪物首次建立持久化实例时确定 lootSeed；质量/具体掉落可延迟计算，但算法版本与种子固定。修改其余区域内容不能改变已经存在的怪物掉落。\u003c/p>\u003cp>个人洞府/机缘另用 \u003ccode>characterId + characterFortuneSeed + discoveryOpportunityId + purpose\u003c/code> 派生，不与共享地形种子混用；结果附规则版本。新角色有独立机会记录，重进同一角色不会重抽。已有普通生态实例仍按世界种子；未来共享野怪与个人奖励权威分离，不能每客户端生成不同公共怪物。\u003c/p>\u003cp>只对新增代应用新版规则；已存在的实例绑定其原规则快照或可解析版本。游戏更新不能将旧尸体重新抽成新品，也不能因为排序改变发出不同 IDs。PRNG 具体算法在实现时选定并加入固定输入/输出向量；跨平台须一致，不能只保存“seed”而忘记算法版本。\u003c/p>\u003cp>这能防止正常刷新、重进和重新载入当前状态时重复抽奖，\u003cstrong>不能阻止纯离线玩家回滚整份旧存档或修改客户端\u003c/strong>。若以后接联网交易，掉落和时间必须转为服务端权威，不能把本地种子当防作弊方案。\u003c/p>\u003ch2>9. 对象状态与掉落事务\u003c/h2>\u003cp>普通种群：\u003ccode>alive → defeatCommitted → vacancyCreated → cooling → eligible → reserved → nextGenerationCommitted\u003c/code>；合法收服也可通过人口转移产生空缺。eligible要求空缺令牌和到期条件同时满足。每只个体独立记录，群体补充仍在最后成员死亡/转移后开始；掉落容器走独立生命周期，不将物品未领误当怪物还活着。\u003c/p>\u003cp>可采节点：\u003ccode>growing → mature → harvesting → depleted → growing\u003c/code>。采集提交扣剩余储量并入包同次完成；取消读条回 mature，不偷扣一份材料。资源品质属于当前代，剩余次数属于同一库存。\u003c/p>\u003cp>事件：\u003ccode>candidate → reserved → telegraphed → active → resolved/expired\u003c/code>。玩家接受的事件在远处卸载时保留简化状态；未参与的一般事件到期可消失，但不会自动发奖励。唯一机缘成功触发后转为已发现机会，未领取不会离线悄悄消失；已拒绝/已完成按事件明示规则记录，不能换区重新抽。\u003c/p>\u003cp>战利品id采用\u003ccode>monsterInstanceId + rewardIndex\u003c/code>；死亡记录、空缺来源与战利品清单同次落盘，拾取与入库同次落盘。尸体3D可淡出，但未领物品转为持久遗留标记，取消旧15分钟自动过期规则。普通剩余物可由玩家明确放弃，唯一/任务物不自动清理。新怪不得与原尸体叠放，每锚点未结算普通战利品容器达到3个时暂停该锚点补怪；其它锚点独立运转，详见27。\u003c/p>\u003ch2>10. 离线、暂停与重登\u003c/h2>\u003cp>三个时钟各有职责：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>时钟\u003c/th>\u003cth>推进方式\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>simTime\u003c/td>\u003ctd>只在正常游玩时推进，暂停不动\u003c/td>\u003ctd>战斗、追击、物品期限、在线生态冷却\u003c/td>\u003c/tr>\u003ctr>\u003ctd>civilTime\u003c/td>\u003ctd>昼夜/气象日历，由配置控制与 simTime 的比例\u003c/td>\u003ctd>夜开花、雷雨条件、商站在线补货日历\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wallTime\u003c/td>\u003ctd>真实时间，带已结算最大值/可信来源说明\u003c/td>\u003ctd>离线修炼、单次制单完成、离线生态资格\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>离线修炼仍独立遵守 72 小时上限。刷新模块不会离线打怪、自动采矿、累计数百次陨落或奖励。离线生态采用保守恢复：本次未结算离线间隔最多提供 \u003cstrong>30 分钟再生抵扣\u003c/strong>，且每个已消耗普通怪巢/草/矿最多推进一代；抵扣只用于变成 eligible，回到游戏并通过出生检查后才实际生成。\u003c/p>\u003cp>活动中的怪、未采成熟节点、未领尸体不在离线期间视为被杀/被采或换代；追击载入时在原合理位置复原，先有可控输入和安全恢复窗口，不能玩家还在载入就受伤。精英、首领、动态陨落与机缘不获得离线冷却抵扣，必须通过各自有效游玩/挑战规则。\u003c/p>\u003cp>每个耗尽状态保存剩余冷却与已应用离线区间；同一离线区间只结算一次，反复登录不重复赠送 30 分钟。暂停只是暂停，不当作一次离线领取；只有正常退出或确认的后台长挂进入重登流程才计算一次，不能开关菜单刷再生。\u003c/p>\u003cp>商站“每24游戏小时、离线最多一次”仅是对已售缺额的补货窗口。未卖的货原样保留；新到货有运输/生产来源，不整页重抽品质。在线civilTime以12倍simTime推进，窗口为120分钟游玩；离线至少24小时才获一次缺额补充资格。每NPC保存缺额令牌、到货单和lastRestockAt；玩家卖给商人的回购物独立保留。\u003c/p>\u003ch2>11. 事件多样性与稀有机缘\u003c/h2>\u003cp>一般遭遇每 60 秒检查一次资格，但必须满足距上一事件 8—15 分钟、推进到一个未消耗探索机会点、当前不在首领战/关键对话、存在可达入口，才尝试挑选；不是每 60 秒都抽 0.3% 机缘。最近三个同类事件降低一般选择权重，最多同类连续两次；不影响独立的内丹/品质骰。\u003c/p>\u003cp>“合格首次调查”是作者或区域生成器定义的 \u003ccode>discoveryOpportunityId\u003c/code>，如首次完成某遗址调查、找到某独特地脉；穿过一个调度块、打开一次地图、重复杀同一巢的怪都不算。ID 集合持久化，首次完成时原子记录已尝试，再用专属流进行一次 0.3% 机缘尝试；失败也记录，不能刷进出。\u003c/p>\u003cp>成功后在匹配资格的机缘池选择内容；唯一类先查世界根唯一账，未领取但已预留也不可再次抽到。无落点可保留原资格，不能重掷稀有概率；唯一池耗尽与空间暂缺分别处理，见27。普通生态换代不生成新的首次调查机会；26的逆天传承也不能靠反复采同一矿重抽。\u003c/p>\u003cp>普通探索洞府采用独立的 8% 线索尝试/第七次保底规则（第 11 文档），不调用永久机缘 0.3% 骰；线索、洞府布局、主要奖励三者都有稳定实例 ID。人物负重只影响到达能力和拾取容量，不改变奖励品质；满包时保留洞府核心领取状态供回取，不把一次未入包当作已领取。\u003c/p>\u003cp>宠物新增独立 PET 野生/蛋巢规则：生成时固定血脉潜力、性格和外观种子，收服信任/有效喂食/迁徙轨迹随实例保存。成熟期难度按第15文档，不因角色升级重抽幼体；已契约宠从野生人口账转个人所有权，死亡战利品和收服奖励互斥。宠物蛋作为第11文档既有主要奖励类别下的版本化子项配置，完整权重必须重新归一化，不能不改总表又附加一个无限额33种蛋骰。稀有破限契约只进入永久机缘的合法子池。\u003c/p>\u003cp>当前新洞府奖励表已在第11文档调整为七类，宠物类8%，其中50%蛋/50%培养材料；旧洞府仍保持原实例版本。已缔约宠倒地不产血液/内丹，也不能释放后按原实例反复抓取/击杀领取唯一奖励。\u003c/p>\u003ch2>12. 与存档、版本和工程的边界\u003c/h2>\u003cp>建议目录（将来实现，不预先放空模块冒充完成）：\u003c/p>\u003cpre>\u003ccode>playable/src/world-director/\n  director.mjs          # 调度与计划\n  state.mjs             # 实例、代数、冷却、事务状态\n  rng.mjs               # 可复现派生随机流\n  policies.mjs          # 任务、区域、安全与预算约束\n  placement.mjs         # 位置校验接口\n  events.mjs            # 遭遇/稀有机会\n  persistence.mjs       # 序列化/迁移\n  adapters/             # 接 main、战斗、库存、3D；逻辑核心不依赖 Three.js\nplayable/data/world-director/  # 生境、刷新、掉落引用、事件配置\ntools/world-director/         # 校验、模拟、诊断与开发入口\u003c/code>\u003c/pre>\u003cp>逻辑核心接收注入时钟、随机流和空间查询，输出 plans，不直接操纵 DOM/Three.js/localStorage。适配层统一提交世界状态及库存相关事务。世界视图只消费已确认实例，不能先显示怪物再补存档。\u003c/p>\u003cp>旧档迁移新增 \u003ccode>director.schemaVersion/worldSeed/rulesVersion/cellStates/anchorGenerations/uniqueClaims/discoveryAttempts\u003c/code>；首次迁移不追溯几年离线资源、不替换固定地形。只存变化过的块和必要高水位，远处未访问区域按定义懒生成。死亡/已领记录可压缩成代数高水位＋未结算例外；旧实例请求仍需被高水位拒绝，不因垃圾回收再次有效。\u003c/p>\u003cp>首片小数据可接现有存储适配器；64×64 公里阶段评估 IndexedDB 分块存储和事务，达到容量/写入耗时阈值前必须迁移，不能把全部世界每帧 JSON.stringify 到 localStorage。迁移失败保留原档，显示错误并禁止继续生成有奖励对象。\u003c/p>\u003ch2>13. 可验收的第一版\u003c/h2>\u003cp>只做 Z0 一小块：2 个掠兽巢、1 个棘背精英点、2 个药圃、1 条铁陨矿脉、1 个普通陨落事件候选；再接一次固定教学任务。验证杀怪/采集后冷却，远离回来才安全再生；存档与重进结果一致；同一材料能进入 D3 的炼丹/锻造。没有真实采集与库存时，不能只在地图上循环出现光点就算完成。\u003c/p>\u003cp>验收必须覆盖：视线内不凭空刷怪、顶着巢穴不无限出怪、进出块不重置、离线不积累奖励、暂停不刷新、固定种子复现、老版本实例不变、缺候选只排队、必需材料可达、资源/实例上限、已领取无法再领，以及高阶返回新手区不会把怪物升级。\u003c/p>"},{"file":"09_WORLD_DIRECTOR_CONFIG_AND_TOOLS.md","title":"D3-09 · 刷新配置、开发面板与实施顺序","text":"# D3-09 · 刷新配置、开发面板与实施顺序\n\n\u003c!-- illustrated-overview:start -->\n![刷新配置到开发面板](media/diagram-09-v001.svg)\n\n*图解：调试种子用来验收，不是正式角色的免费神物入口。*\n\u003c!-- illustrated-overview:end -->\n\n依赖：[世界刷新规则](08_WORLD_DIRECTOR.md)。此文件定义给开发者使用的工具，正常玩家只看到世界、图鉴与传闻，不看到全部随机种子或刷新倒计时。\n\n## 1. 配置不是一串随机概率\n\n每个候选内容必须绑定合法 ID、来源用途、生态条件、空间约束和持久化策略。掉落概率只维护在经济配置里一处，刷新表引用 `lootProfileId`，不复制十境内丹概率。\n\n|定义|必填字段|拒绝示例|\n|---|---|---|\n|BiomeRule|id,planetId,zoneId,realmRange,habitats,candidateSets,protectedVolumes|生境在未制作地图外；R0 区无解释刷新 R8|\n|SpawnAnchor|id,biomeId,speciesPool,populationCap,respawnPolicy,placementProfile|缺 M ID、无地面支撑、上限为负|\n|ResourceAnchor|id,itemFamily,tier,qualityProfile,yieldRange,regenPolicy,sourceTags|无材料用途、纯机械掉血、低阶矿伪装高层|\n|EventRule|id,eligibility,weight,cooldown,entryProfile,maxConcurrent,expiry,rewardPolicy|没有进场方式、无法结束、无限召唤发奖励|\n|OpportunityRule|id,discoverySet,realmEligibility,uniqueKey,rewardId,fallback|每帧抽机缘、重复唯一奖励、成功却无落点丢失|\n|SpawnPolicy|safeDistance,visibleEntry,groundRequirements,pathClearance,maxAttempts|只按距离不检查视线；失败时忽略碰撞|\n|LootProfile|id,tableVersion,guaranteed,rolls,tier,qualityProfile|概率和大于1、数量负数、读取当前等级重抽尸体|\n|CaveTemplate|id,entranceCandidates,roomGraph,realmRange,coreRewardProfile,inhabitable|门钥匙依赖循环、无退出路线、普通洞府重复给唯一核心奖励|\n|CharacterOpportunity|characterId,discoveryId,fortuneSeedVersion,attempted,result,reservation|个人结果用共享随机流重抽、失败尝试未记录|\n\n配置用 JSON 或可验证的静态模块。数值统一单位：时间秒、距离米、概率 [0,1]、金额碎灵石整数串。每份配置写 `schemaVersion`、`balanceVersion` 与变更摘要；稳定 ID 不含中文显示名。\n\n## 2. Z0 样板配置（拟实现）\n\n此例说明一只普通怪在既定地点如何再生，尚不是可运行模块。候选位置指内容制作时验证过的点集；不在设计阶段猜造会撞上现有舰体的坐标。\n\n```json\n{\n  \"schemaVersion\": 2,\n  \"id\": \"Z0-LAIR-01\",\n  \"planetId\": \"P1\",\n  \"zoneId\": \"Z0\",\n  \"candidateSetId\": \"Z0-SAND-HABITAT-01\",\n  \"speciesPool\": [{\"monsterId\": \"M00\", \"weight\": 1}],\n  \"realm\": \"R0\",\n  \"levelRange\": [1, 3],\n  \"groupSize\": [2, 3],\n  \"populationCap\": 3,\n  \"respawn\": {\n    \"clock\": \"simTime\",\n    \"after\": \"lastMemberConsumptionCommitted\",\n    \"requiresVacancyToken\": true,\n    \"delaySeconds\": [480, 720],\n    \"offlineCreditMaxSeconds\": 1800,\n    \"offlineGenerationsMax\": 1\n  },\n  \"replacement\": {\n    \"newInstanceRequired\": true,\n    \"excludePreviousComposition\": true,\n    \"fingerprintFields\": [\"species\", \"groupSize\", \"entryLayout\", \"patrolVariant\"],\n    \"onNoDistinctCandidate\": \"wait\",\n    \"qualityIsNotExclusionField\": true\n  },\n  \"uniqueScope\": \"none\",\n  \"placementProfileId\": \"GROUND-NORMAL-SAFE\",\n  \"lootProfileId\": \"BIO-R0-NORMAL-V1\",\n  \"sourceTags\": [\"blood:scavenger\", \"hide:basic\"],\n  \"consumers\": [\"R0-A\", \"W01\"]\n}\n```\n\n`consumers` 是配置可达性检查与图鉴引用，不是击杀后直接生成成品丹/武器。M00 的血型对应掠兽血；由掉落/物品定义统一映射，显示名字变化不使配方失效。\n\n## 3. 调度和提交接口\n\n第27新增配置：consumePolicy、replacementPolicy、distinctFingerprintFields、uniqueScope/uniqueDefinitionId、minSupplyFamilies；世界根保存vacancyTokens与uniqueLedger。调度先查旧实例实际消费提交，再查时间/空间；新代事务同时消耗令牌、提交新实例和唯一预留。`explainAnchor`须能区分noConsumption、cooling、noDistinctCandidate、uniqueReserved、uniquePoolExhausted、unsafePlacement；不能统一显示“刷新中”。\n\n建议契约，不在此实现空函数：\n\n- `createDirector(definitions, savedState, adapters)`：校验定义和存档版本，不能失败后默默用随机新世界覆盖。\n- `planTick(context)`：输入玩家/时间/视线/天气/任务与预算，返回 plans 和 rejectionReasons，不直接发掉落。\n- `reservePlan(plan, expectedRevision)`：锁位置、数量和候选事件；重复调用返回同一 reservation。\n- `commitWorldTransaction(transaction)`：由存储适配器原子记录生成、死亡或采集等结果；带实例 ID 与状态版本。\n- `acknowledgeView(instanceId)`：仅标记 3D 已创建，不产生第二份世界对象。\n- `applyOfflineEligibility(intervalId, elapsed)`：按规则产生到期资格，不能批量模拟玩家击杀。\n- `serializeDirector()/restoreDirector()`：保留实例、代数、高水位、规则版本及未完成订单关联。\n- `explainAnchor(anchorId)`：返回何时到期、为什么没刷、占了哪项预算、来源和消费端，供开发面板用。\n\n状态提交顺序：定义校验 → 判断资格 → 空间查询 → reservation → 持久化 → 3D 创建；3D 加载失败时实例保持“待显示”且不激活伤害，进行有限重试或明确错误。不能模型失败时留一只看不见的攻击怪，也不能每次重试再增一只。\n\n## 4. 开发面板：同仓库的独立入口\n\n计划入口 `tools/world-director/preview.html`，由本地开发服务加载，使用隔离的测试存档与明确的“开发模拟”标识；不污染用户正常存档。构建发布时不包含强制掉落/跳时间操作。不是为玩家增加一页管理野怪的游戏菜单。\n\n|页签|功能|必须能回答的问题|\n|---|---|---|\n|区域图|生境、候选点、保护范围、正在活动/冷却的对象|为什么这里有怪、那里没有？会挡 NPC 或通道吗？|\n|生态与资源|巢穴人口、材料储量、品质分布、下一次资格时间|血、草、矿能否支撑本阶段配方？|\n|事件时间线|候选→预告→参与→结算、被拒原因、唯一机缘尝试|随机事件为什么没触发？是否重复尝试？|\n|概率模拟|固定种子批次、击杀量、实际分布与区间|低阶内丹是否仍稀有？是否引用错掉落表？|\n|成长可达图|区域→怪物/节点→材料→配方→境界→下一区|有无需要先突破才能取得突破材料的循环？|\n|回放与存档|快照、时间推进、区域往返、模拟载入失败|重登是否复刷、掉落是否重复、旧实例是否改变？|\n|洞府与运输|角色种子对比、布局可达性、奖励量/重量、背包/货舱运力、追击走廊|不同角色是否有差异？拿到材料能否分批带回？追兵是否跨块消失？|\n\n允许开发者切换天气、快进仿真、传送测试角色、强制一代生成、预置背包，但所有这些操作有日志，测试报告标记使用了哪些夹具。强制操作不得计入真实通关/掉率证据。\n\n配置编辑流程：草稿 → schema/引用/可达性检查 → 固定种子模拟 → 3D 实机路线 → 人工采用 → 新版本。运行中的现有怪物保持旧规则，新代用新规则；需要改变既有实例必须显式迁移和备份，不能热更新悄悄重抽。\n\n## 5. 数据校验与调参证据\n\n校验四层：结构类型与单位；跨表 ID 与数量范围；成长可达性与替代来源；运行安全与资源预算。仅校验 JSON 格式远远不够。\n\n最低预算检查为：Z0 普通路线在一次 20—30 分钟远征中有机会取得一次 R0-A 所需草×3、血×2、铁陨粉×1的原料，不保证玩家不探索就自动集齐；教学路线提供确定来源。两群 M00 共 4—6 只，即使完整内丹零掉落也不影响第一条淬体配方。\n\n模拟分为经济仿真与行为仿真。经济仿真用 D3 掉落表统计 10 万次廉价抽样及置信区间；行为仿真用固定玩家路径检查何时看见/触发/错过节点。自动化路径不能代表所有玩家实际体验，最终还要实机玩一趟。\n\n报告记录：规则版本、种子、测试区域、时钟推进、夹具开关、计划/拒绝计数、生成/死亡/拾取数、各材料净产出、唯一事件次数、活动对象峰值、存档大小和写入耗时。不能只展示“随机效果很丰富”。\n\n## 6. 如何嵌入既有 C0—C10 开发\n\n|切片|刷新系统工作|对应主开发阶段|\n|---|---|---|\n|WD0 规则与种子|schema、稳定 ID、独立随机流、旧档新增字段、候选点人工标定|C0，并先于 C1 动态刷怪|\n|WD1 第一组种群|M00 两巢、数量预算、出生检查、死亡/冷却/再生|C1，接真实战斗，不先做所有怪|\n|WD2 采集与掉落|草/矿代数、血液/内丹引用、采集去重、离线资格|C2，接真实库存|\n|WD3 经济和任务约束|配方可达图、教学保底、NPC 补货事件、调试面板前三页|C3—C5|\n|WD4 一般事件和机缘|陨落/迁徙样板、唯一发现尝试、永久机缘事务|C5 后，先做两类一般事件再稀有事件|\n|WD5 大地图与跨星|调度块/预热、持久化压缩、IndexedDB、每星独立生态|C6—C9，不先生成全部行星|\n|WD6 世界永久变化|毁星目标停刷、陨带新规则、NPC/唯一物保留|C10|\n\n不能等所有怪物/丹方做完才加刷新系统，也不需要先造一个完整编辑器才能打第一只怪。先做稳定的规则和单一实例闭环，再扩开发工具。\n\n## 7. 首版验收清单\n\n1. 固定种子启动相同世界；改变粒子随机数不改变怪物或掉落。\n2. 击杀/采集→离开→返回，冷却内不重生；冷却到期但玩家正在看着巢穴时不凭空出现。\n3. 保存并重载后保持实例与品质；反复跨块不新增资源；重复拾取请求只成功一次。\n4. 暂停 15 分钟不推进仿真；一次离线 96 小时仍不累积多代资源，修炼只算独立的前 72 小时。\n5. 没有合法位置、模型加载失败、存储失败都不产生看不见的伤害怪或丢失物品。\n6. 不掉任何内丹仍能完成后天普通配方；R6 依赖图能在母星闭合。\n7. 高境回 Z0 不改变 M00 的境界；强敌区可进入且失败后能救援。\n8. 开发快进/强制极品仅影响测试存档，正常包没有这些按钮；当前游戏按键/视角恢复仍有效。\n\n9. 按[27的RF01—RF20](27_CONSUMPTION_AND_UNIQUE_WORLD.md)逐项验收：部分采集/满包没有令牌，成功耗尽只给一个；未取物不消失；新代组合不同但材料家族不断供；原器交易、拆分、换角色和多来源提交均不释放唯一键。\n\n本轮仅文档设计与引用检查，不宣称 WD0—WD6 已实现，也未新建第二项目或后台服务。\n","html":"\u003ch1>D3-09 · 刷新配置、开发面板与实施顺序\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-09-v001.svg\" alt=\"刷新配置到开发面板\">\u003c/p>\u003cp>\u003cem>图解：调试种子用来验收，不是正式角色的免费神物入口。\u003c/em>\u003c/p>\u003cp>依赖：\u003ca href=\"#08_WORLD_DIRECTOR.md\">世界刷新规则\u003c/a>。此文件定义给开发者使用的工具，正常玩家只看到世界、图鉴与传闻，不看到全部随机种子或刷新倒计时。\u003c/p>\u003ch2>1. 配置不是一串随机概率\u003c/h2>\u003cp>每个候选内容必须绑定合法 ID、来源用途、生态条件、空间约束和持久化策略。掉落概率只维护在经济配置里一处，刷新表引用 \u003ccode>lootProfileId\u003c/code>，不复制十境内丹概率。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>定义\u003c/th>\u003cth>必填字段\u003c/th>\u003cth>拒绝示例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>BiomeRule\u003c/td>\u003ctd>id,planetId,zoneId,realmRange,habitats,candidateSets,protectedVolumes\u003c/td>\u003ctd>生境在未制作地图外；R0 区无解释刷新 R8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SpawnAnchor\u003c/td>\u003ctd>id,biomeId,speciesPool,populationCap,respawnPolicy,placementProfile\u003c/td>\u003ctd>缺 M ID、无地面支撑、上限为负\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ResourceAnchor\u003c/td>\u003ctd>id,itemFamily,tier,qualityProfile,yieldRange,regenPolicy,sourceTags\u003c/td>\u003ctd>无材料用途、纯机械掉血、低阶矿伪装高层\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EventRule\u003c/td>\u003ctd>id,eligibility,weight,cooldown,entryProfile,maxConcurrent,expiry,rewardPolicy\u003c/td>\u003ctd>没有进场方式、无法结束、无限召唤发奖励\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpportunityRule\u003c/td>\u003ctd>id,discoverySet,realmEligibility,uniqueKey,rewardId,fallback\u003c/td>\u003ctd>每帧抽机缘、重复唯一奖励、成功却无落点丢失\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SpawnPolicy\u003c/td>\u003ctd>safeDistance,visibleEntry,groundRequirements,pathClearance,maxAttempts\u003c/td>\u003ctd>只按距离不检查视线；失败时忽略碰撞\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LootProfile\u003c/td>\u003ctd>id,tableVersion,guaranteed,rolls,tier,qualityProfile\u003c/td>\u003ctd>概率和大于1、数量负数、读取当前等级重抽尸体\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CaveTemplate\u003c/td>\u003ctd>id,entranceCandidates,roomGraph,realmRange,coreRewardProfile,inhabitable\u003c/td>\u003ctd>门钥匙依赖循环、无退出路线、普通洞府重复给唯一核心奖励\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CharacterOpportunity\u003c/td>\u003ctd>characterId,discoveryId,fortuneSeedVersion,attempted,result,reservation\u003c/td>\u003ctd>个人结果用共享随机流重抽、失败尝试未记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>配置用 JSON 或可验证的静态模块。数值统一单位：时间秒、距离米、概率 [0,1]、金额碎灵石整数串。每份配置写 \u003ccode>schemaVersion\u003c/code>、\u003ccode>balanceVersion\u003c/code> 与变更摘要；稳定 ID 不含中文显示名。\u003c/p>\u003ch2>2. Z0 样板配置（拟实现）\u003c/h2>\u003cp>此例说明一只普通怪在既定地点如何再生，尚不是可运行模块。候选位置指内容制作时验证过的点集；不在设计阶段猜造会撞上现有舰体的坐标。\u003c/p>\u003cpre>\u003ccode>{\n  &quot;schemaVersion&quot;: 2,\n  &quot;id&quot;: &quot;Z0-LAIR-01&quot;,\n  &quot;planetId&quot;: &quot;P1&quot;,\n  &quot;zoneId&quot;: &quot;Z0&quot;,\n  &quot;candidateSetId&quot;: &quot;Z0-SAND-HABITAT-01&quot;,\n  &quot;speciesPool&quot;: [{&quot;monsterId&quot;: &quot;M00&quot;, &quot;weight&quot;: 1}],\n  &quot;realm&quot;: &quot;R0&quot;,\n  &quot;levelRange&quot;: [1, 3],\n  &quot;groupSize&quot;: [2, 3],\n  &quot;populationCap&quot;: 3,\n  &quot;respawn&quot;: {\n    &quot;clock&quot;: &quot;simTime&quot;,\n    &quot;after&quot;: &quot;lastMemberConsumptionCommitted&quot;,\n    &quot;requiresVacancyToken&quot;: true,\n    &quot;delaySeconds&quot;: [480, 720],\n    &quot;offlineCreditMaxSeconds&quot;: 1800,\n    &quot;offlineGenerationsMax&quot;: 1\n  },\n  &quot;replacement&quot;: {\n    &quot;newInstanceRequired&quot;: true,\n    &quot;excludePreviousComposition&quot;: true,\n    &quot;fingerprintFields&quot;: [&quot;species&quot;, &quot;groupSize&quot;, &quot;entryLayout&quot;, &quot;patrolVariant&quot;],\n    &quot;onNoDistinctCandidate&quot;: &quot;wait&quot;,\n    &quot;qualityIsNotExclusionField&quot;: true\n  },\n  &quot;uniqueScope&quot;: &quot;none&quot;,\n  &quot;placementProfileId&quot;: &quot;GROUND-NORMAL-SAFE&quot;,\n  &quot;lootProfileId&quot;: &quot;BIO-R0-NORMAL-V1&quot;,\n  &quot;sourceTags&quot;: [&quot;blood:scavenger&quot;, &quot;hide:basic&quot;],\n  &quot;consumers&quot;: [&quot;R0-A&quot;, &quot;W01&quot;]\n}\u003c/code>\u003c/pre>\u003cp>\u003ccode>consumers\u003c/code> 是配置可达性检查与图鉴引用，不是击杀后直接生成成品丹/武器。M00 的血型对应掠兽血；由掉落/物品定义统一映射，显示名字变化不使配方失效。\u003c/p>\u003ch2>3. 调度和提交接口\u003c/h2>\u003cp>第27新增配置：consumePolicy、replacementPolicy、distinctFingerprintFields、uniqueScope/uniqueDefinitionId、minSupplyFamilies；世界根保存vacancyTokens与uniqueLedger。调度先查旧实例实际消费提交，再查时间/空间；新代事务同时消耗令牌、提交新实例和唯一预留。\u003ccode>explainAnchor\u003c/code>须能区分noConsumption、cooling、noDistinctCandidate、uniqueReserved、uniquePoolExhausted、unsafePlacement；不能统一显示“刷新中”。\u003c/p>\u003cp>建议契约，不在此实现空函数：\u003c/p>\u003cul>\u003cli>\u003ccode>createDirector(definitions, savedState, adapters)\u003c/code>：校验定义和存档版本，不能失败后默默用随机新世界覆盖。\u003c/li>\u003cli>\u003ccode>planTick(context)\u003c/code>：输入玩家/时间/视线/天气/任务与预算，返回 plans 和 rejectionReasons，不直接发掉落。\u003c/li>\u003cli>\u003ccode>reservePlan(plan, expectedRevision)\u003c/code>：锁位置、数量和候选事件；重复调用返回同一 reservation。\u003c/li>\u003cli>\u003ccode>commitWorldTransaction(transaction)\u003c/code>：由存储适配器原子记录生成、死亡或采集等结果；带实例 ID 与状态版本。\u003c/li>\u003cli>\u003ccode>acknowledgeView(instanceId)\u003c/code>：仅标记 3D 已创建，不产生第二份世界对象。\u003c/li>\u003cli>\u003ccode>applyOfflineEligibility(intervalId, elapsed)\u003c/code>：按规则产生到期资格，不能批量模拟玩家击杀。\u003c/li>\u003cli>\u003ccode>serializeDirector()/restoreDirector()\u003c/code>：保留实例、代数、高水位、规则版本及未完成订单关联。\u003c/li>\u003cli>\u003ccode>explainAnchor(anchorId)\u003c/code>：返回何时到期、为什么没刷、占了哪项预算、来源和消费端，供开发面板用。\u003c/li>\u003c/ul>\u003cp>状态提交顺序：定义校验 → 判断资格 → 空间查询 → reservation → 持久化 → 3D 创建；3D 加载失败时实例保持“待显示”且不激活伤害，进行有限重试或明确错误。不能模型失败时留一只看不见的攻击怪，也不能每次重试再增一只。\u003c/p>\u003ch2>4. 开发面板：同仓库的独立入口\u003c/h2>\u003cp>计划入口 \u003ccode>tools/world-director/preview.html\u003c/code>，由本地开发服务加载，使用隔离的测试存档与明确的“开发模拟”标识；不污染用户正常存档。构建发布时不包含强制掉落/跳时间操作。不是为玩家增加一页管理野怪的游戏菜单。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>页签\u003c/th>\u003cth>功能\u003c/th>\u003cth>必须能回答的问题\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>区域图\u003c/td>\u003ctd>生境、候选点、保护范围、正在活动/冷却的对象\u003c/td>\u003ctd>为什么这里有怪、那里没有？会挡 NPC 或通道吗？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生态与资源\u003c/td>\u003ctd>巢穴人口、材料储量、品质分布、下一次资格时间\u003c/td>\u003ctd>血、草、矿能否支撑本阶段配方？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>事件时间线\u003c/td>\u003ctd>候选→预告→参与→结算、被拒原因、唯一机缘尝试\u003c/td>\u003ctd>随机事件为什么没触发？是否重复尝试？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>概率模拟\u003c/td>\u003ctd>固定种子批次、击杀量、实际分布与区间\u003c/td>\u003ctd>低阶内丹是否仍稀有？是否引用错掉落表？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成长可达图\u003c/td>\u003ctd>区域→怪物/节点→材料→配方→境界→下一区\u003c/td>\u003ctd>有无需要先突破才能取得突破材料的循环？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>回放与存档\u003c/td>\u003ctd>快照、时间推进、区域往返、模拟载入失败\u003c/td>\u003ctd>重登是否复刷、掉落是否重复、旧实例是否改变？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>洞府与运输\u003c/td>\u003ctd>角色种子对比、布局可达性、奖励量/重量、背包/货舱运力、追击走廊\u003c/td>\u003ctd>不同角色是否有差异？拿到材料能否分批带回？追兵是否跨块消失？\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>允许开发者切换天气、快进仿真、传送测试角色、强制一代生成、预置背包，但所有这些操作有日志，测试报告标记使用了哪些夹具。强制操作不得计入真实通关/掉率证据。\u003c/p>\u003cp>配置编辑流程：草稿 → schema/引用/可达性检查 → 固定种子模拟 → 3D 实机路线 → 人工采用 → 新版本。运行中的现有怪物保持旧规则，新代用新规则；需要改变既有实例必须显式迁移和备份，不能热更新悄悄重抽。\u003c/p>\u003ch2>5. 数据校验与调参证据\u003c/h2>\u003cp>校验四层：结构类型与单位；跨表 ID 与数量范围；成长可达性与替代来源；运行安全与资源预算。仅校验 JSON 格式远远不够。\u003c/p>\u003cp>最低预算检查为：Z0 普通路线在一次 20—30 分钟远征中有机会取得一次 R0-A 所需草×3、血×2、铁陨粉×1的原料，不保证玩家不探索就自动集齐；教学路线提供确定来源。两群 M00 共 4—6 只，即使完整内丹零掉落也不影响第一条淬体配方。\u003c/p>\u003cp>模拟分为经济仿真与行为仿真。经济仿真用 D3 掉落表统计 10 万次廉价抽样及置信区间；行为仿真用固定玩家路径检查何时看见/触发/错过节点。自动化路径不能代表所有玩家实际体验，最终还要实机玩一趟。\u003c/p>\u003cp>报告记录：规则版本、种子、测试区域、时钟推进、夹具开关、计划/拒绝计数、生成/死亡/拾取数、各材料净产出、唯一事件次数、活动对象峰值、存档大小和写入耗时。不能只展示“随机效果很丰富”。\u003c/p>\u003ch2>6. 如何嵌入既有 C0—C10 开发\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>切片\u003c/th>\u003cth>刷新系统工作\u003c/th>\u003cth>对应主开发阶段\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>WD0 规则与种子\u003c/td>\u003ctd>schema、稳定 ID、独立随机流、旧档新增字段、候选点人工标定\u003c/td>\u003ctd>C0，并先于 C1 动态刷怪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD1 第一组种群\u003c/td>\u003ctd>M00 两巢、数量预算、出生检查、死亡/冷却/再生\u003c/td>\u003ctd>C1，接真实战斗，不先做所有怪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD2 采集与掉落\u003c/td>\u003ctd>草/矿代数、血液/内丹引用、采集去重、离线资格\u003c/td>\u003ctd>C2，接真实库存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD3 经济和任务约束\u003c/td>\u003ctd>配方可达图、教学保底、NPC 补货事件、调试面板前三页\u003c/td>\u003ctd>C3—C5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD4 一般事件和机缘\u003c/td>\u003ctd>陨落/迁徙样板、唯一发现尝试、永久机缘事务\u003c/td>\u003ctd>C5 后，先做两类一般事件再稀有事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD5 大地图与跨星\u003c/td>\u003ctd>调度块/预热、持久化压缩、IndexedDB、每星独立生态\u003c/td>\u003ctd>C6—C9，不先生成全部行星\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WD6 世界永久变化\u003c/td>\u003ctd>毁星目标停刷、陨带新规则、NPC/唯一物保留\u003c/td>\u003ctd>C10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>不能等所有怪物/丹方做完才加刷新系统，也不需要先造一个完整编辑器才能打第一只怪。先做稳定的规则和单一实例闭环，再扩开发工具。\u003c/p>\u003ch2>7. 首版验收清单\u003c/h2>\u003col>\u003cli>固定种子启动相同世界；改变粒子随机数不改变怪物或掉落。\u003c/li>\u003cli>击杀/采集→离开→返回，冷却内不重生；冷却到期但玩家正在看着巢穴时不凭空出现。\u003c/li>\u003cli>保存并重载后保持实例与品质；反复跨块不新增资源；重复拾取请求只成功一次。\u003c/li>\u003cli>暂停 15 分钟不推进仿真；一次离线 96 小时仍不累积多代资源，修炼只算独立的前 72 小时。\u003c/li>\u003cli>没有合法位置、模型加载失败、存储失败都不产生看不见的伤害怪或丢失物品。\u003c/li>\u003cli>不掉任何内丹仍能完成后天普通配方；R6 依赖图能在母星闭合。\u003c/li>\u003cli>高境回 Z0 不改变 M00 的境界；强敌区可进入且失败后能救援。\u003c/li>\u003cli>开发快进/强制极品仅影响测试存档，正常包没有这些按钮；当前游戏按键/视角恢复仍有效。\u003c/li>\u003c/ol>\u003col>\u003cli>按\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27的RF01—RF20\u003c/a>逐项验收：部分采集/满包没有令牌，成功耗尽只给一个；未取物不消失；新代组合不同但材料家族不断供；原器交易、拆分、换角色和多来源提交均不释放唯一键。\u003c/li>\u003c/ol>\u003cp>本轮仅文档设计与引用检查，不宣称 WD0—WD6 已实现，也未新建第二项目或后台服务。\u003c/p>"},{"file":"10_STORAGE_AND_ENCUMBRANCE.md","title":"D3-10 · 背包、货舱、储物法器与扩容","text":"# D3-10 · 背包、货舱、储物法器与扩容\n\n\u003c!-- illustrated-overview:start -->\n![东西装到哪里](media/diagram-10-v001.svg)\n\n*图解：同一物品只能在一个容器；普通袋戒不能装活宠物。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；设计规格，尚未实现。依赖 [经济](03_ALCHEMY_MATERIALS_ECONOMY.md)、[NPC](05_NPCS_DIALOGUE_TASKS.md)、[随机洞府](11_CAVES_AND_FORTUNES.md)、[移动追逐](13_MOVEMENT_AND_PURSUIT.md)、[单机与联网](14_OFFLINE_AND_ONLINE_BOUNDARY.md)。本文件覆盖旧设计中未定义容量的背包/钱包假设。\n\n## 1. 三种容量同时存在\n\n物理背包同时受格数、体积（升 L）和玩家负重限制；飞行器货舱受格数、体积和载重限制。空间法器仍有格数、内部容积和内部质量上限，并大幅降低传给持有者的重量。任何一个上限先到，就不能继续放入；界面说明是哪一项满了。\n\n统一规则：物品具有单件体积、质量、最大堆叠数；同 ID、品质、状态和可堆叠属性才能合堆。合堆只省格子，不减质量/体积。装备每件一格，材料默认每格 20，丹药 10，灵石 100；特殊物品另定义。初片不做拼图式旋转背包，避免操作负担。\n\n参考物品：草药一份 0.10 kg/0.20 L，血液一管 0.25 kg/0.30 L，完整内丹 0.08 kg/0.05 L，陨矿一块 2 kg/0.40 L，刀 2 kg/3 L，药剂一份 0.10 kg/0.10 L。各物种大材料另配重量；原矿不能无损变成同样重量的“粉末”来绕过体积限制。\n\n## 2. 开局与物理升级\n\n|容器 ID|格数|容积|容器自身重|结构载重上限|取得方式|\n|---|---:|---:|---:|---:|---|\n|ST-PACK-01 标准背包|24|40 L|2 kg|35 kg|开局配发|\n|ST-PACK-02 加固背包|32|65 L|3 kg|55 kg|N03 韩铸：韧皮×3、铁陨材×2、纤维×2|\n|ST-PACK-03 探索背架|40|90 L|4.5 kg|90 kg|先天地区：轻陨材×3、韧丝×3、导气纹×1|\n|ST-SKIMMER 勘探车货箱|48|180 L|计入车体|250 kg|原勘探车维修后附带|\n|ST-F1 轻型飞行器货舱|32|100 L|计入机体|120 kg|F1 蓝图附带|\n|ST-F2 探索飞行器货舱|56|300 L|计入机体|400 kg|F2 升级|\n|ST-F3 高空飞行器货舱|80|800 L|计入机体|1,200 kg|F3 升级|\n|ST-CAMP 营地仓库|120|2,000 L|不随身|10,000 kg|营地初始免费仓格|\n\n容量是收纳能力，不自动赋予角色承重。后天背了 90 L 背架也可能跑不动。营地可付材料扩建到 240 格/8,000 L，再高转洞府仓库；不是默认无限背包。原型未来接入时以旧资产迁移规则决定默认归属，不能把玩家既有物品截断删除。\n\n## 3. 人物负重怎样影响移动\n\n无临时效果时安全负重 `C(r,l)=30×2^r×(1+0.04×(l−1)) kg`。外穿衣甲、武器、背包、普通物品、空间法器外壳和传递重量都计入；身体自身质量不计。宇航服初始计 8 kg，标准背包 2 kg，训练刀 2 kg，因此后天一级在满速舒适阈值前还有 6 kg 可装，安全负重前还有 18 kg。\n\n定义 `q=有效负重/C`：\n\n|负重区间|移动倍率|动作限制|\n|---|---|---|\n|q≤0.60|1.00|正常|\n|0.60\u003cq≤1.00|从 1.00 线性降到 0.75|加速能力同步降低；体力消耗从 1.00 升至 1.25 倍|\n|1.00\u003cq≤1.20|从 0.75 线性降到 0.50|禁止疾跑、闪避和主动起飞，能慢移/整理/卸货|\n|q>1.20|停止主动移动|只允许整理、近处转移、丢放、求援；不自动删除物品|\n\n普通拾取在会超过 120% 负重时拒绝；若因取下减负装备、法器失稳等导致被动超载，保留物品并给解决入口。眩晕、伤势等不凭空缩小容器。不能靠丢包再立即远程取药规避负重，地面包需要靠近操作。\n\n最终速度按第 13 文档计算。负重影响所有姿势的移动和加速，不缩短动作时间、不把武器动画直接慢放。空间法器不是绝对零重，因此装满高密度陨铁仍有代价。\n\n## 4. 载具装货与性能\n\n停稳并在真实货舱交互点 3 米内 F 打开双栏，或在安全停泊状态从座舱打开。飞行中、被攻击中、远离载具时不可随意转移。飞行器格数不与玩家格数合并，快捷药不能远程从货舱取用。\n\n令 `f=货物有效质量/额定货重`，允许装入至 100%，超出拒绝；背包仍背在驾驶者身上时也算货重，放入货舱后只能算一次。标准乘员质量已包含在机体基准，额外装备与背负质量计入货重。\n\n- `f≤0.25`：速度/加速/爬升无额外惩罚。\n- `0.25\u003cf≤1`：最大速度线性降至 80%，加速降至 65%，爬升降至 60%；同距离能耗最高增加 35%。\n- 满载 F3 依然能够在正常气象达到 200 米上限，只是更慢更费电；超载不能起飞，不能以增加高度补偿载重。\n\n货舱加固升级只提升该机体额定值，必须配套推进/支撑模块，不能无限加箱子。追逐中的载具速度严格使用相同负重结果，怪物不得忽略自身速度瞬移追上。\n\n## 5. 储物法器的大小\n\n|法器 ID / 形态|建议可用境界|初始→最大容积|初始格数 / 每增加多少 L 加一格|外壳重 / 内物传重系数|\n|---|---|---|---|---|\n|ST-BAG-01 纳物袋|后天后期，稳定符芯供能|60→240 L|32 / 8 L|0.8 kg / 2%|\n|ST-BAG-02 灵纹袋|先天|300→1,200 L|48 / 25 L|0.6 kg / 0.5%|\n|ST-RING-01 储物戒|灵海|1,000→6,000 L|72 / 100 L|0.05 kg / 0.1%|\n|ST-RING-02 须弥戒|金丹—元婴|10,000→60,000 L|96 / 1,000 L|0.05 kg / 0.01%|\n|ST-RING-03 洞天戒|化神—合道|100,000→600,000 L|144 / 10,000 L|0.08 kg / 0.001%|\n|ST-RING-04 星海戒|星劫—道源|1,000,000→6,000,000 L|192 / 100,000 L|0.10 kg / 0.0001%|\n\n格数 `S=S0+floor((V−V0)/k)`，大容积显示 m³，计算仍用整数毫升。内部质量上限统一为 `5 kg × 容积 L`，不能把无限质量塞入一点体积。有效携重=外壳重＋内部物品实际质量×传重系数。例如基础储物戒装满 5,000 kg 原料传重约 5 kg，仍然需要真的有 1,000 L 和足够格数。\n\n稀有机缘可能较早获得高一档法器，但使用门槛不满足时处于封存状态；可鉴定、交易或存放，不能跳过承载条件直接装备星海戒。后天纳物袋使用外置符芯，不要求先有真气；已装物品在符芯耗尽时仍封存保留，补能后可取，不爆掉库存。正常收取不持续耗真气，扩容才需要阵台与耗材。\n\n一名角色最多绑定 1 个袋＋1 枚戒作为可访问空间容器，其他只能空置封存。**禁止把含物品的空间容器放进任何其他容器或空间容器**；要装进载具/仓库，先清空、解除绑定后按普通空壳存放。由此避免袋中套戒无限压重、换所有者复制库存。活物、整辆载具、已锚定场景建筑不接受收纳；载具拆件必须是独立物品且满足容量。\n\n袋/戒使用人物专门佩戴槽，佩戴不等于塞入背包；角色佩戴它们乘车也不算容器嵌套，但传递后的携重计入载具货重。满袋作为物品拖到货舱则明确拒绝，二者在数据层分别为装备关系与容器包含关系。\n\n宠物不装普通袋戒；灵栖契是单独的宠物休养/召回关系，不提供可交易物品空间。宠物驮架和骑乘质量规则见第15/17文档，骑手背负的折算质量只计一次。未孵化封存蛋为特殊物品可短期装入防护背包，初始按每蛋2格、8 L、3 kg；在空间容器中停止孵化，活体破壳必须移至合法孵化器，不能在背包里突然生成完整宠物。\n\n## 6. 扩容材料和基本技能\n\n后天六级、完成一次基础采集/鉴定后，可向 **N05 闻止** 学《纳物铭纹》Ⅰ。N03 提供科技稳纹台，教玩家用练习空壳刻一条纹路；练习对象不产生可交易储物袋。玩家没遇到储物袋也能先学知识。纳物袋的确定备用来源是 N03 后天十级的较长制作委托，随机洞府可能更早给出；不让容量系统完全被稀有运气锁死。\n\n技能Ⅰ服务纳物/灵纹袋；灵海在 **N12 玄仪** 学Ⅱ，服务储物/须弥戒；化神在 **N16 宁照** 学Ⅲ，服务洞天戒；星劫在 **N21 星岚** 学Ⅳ，服务星海戒。学习需当前境界、前一阶知识和一次刻纹试验，不用空放数千次技能；NPC 学习不新增固定 NPC 名额。\n\n|扩容材料 ID|来源层级/路径|Q3 标准单份增加|适用容器|所需技能|\n|---|---|---:|---|---|\n|EX01 空纹碎片|T0 洞府残阵、后天精英委托|8 L|纳物袋、灵纹袋|Ⅰ|\n|EX02 凝空砂|T1 药谷空间矿夹层|30 L|纳物袋、灵纹袋|Ⅰ|\n|EX03 空髓晶|T2 镜晶矿的外围支脉/灵海洞府|200 L|储物戒、须弥戒|Ⅱ|\n|EX04 须弥石|T3—T4 镜渊秘室/雷原裂隙|1,200 L|储物戒、须弥戒|Ⅱ|\n|EX05 界隙结晶|T5—T6 母星界隙谷/空衡星|12,000 L|洞天戒|Ⅲ|\n|EX06 星核砂|T7 万象星陨矿/高阶洞府|60,000 L|洞天戒|Ⅲ|\n|EX07 原初空髓|T8—T9 陨星带/源寂残阵|400,000 L|星海戒|Ⅳ|\n\n单份有效增容 `ΔV=基础增容×品质系数`，Q1—Q6 系数 0.65/0.85/1/1.25/1.6/2，与材料通用规则一致，取整至 1 L。可混合多份适用材料；低档容器不能用更高材料强行突破壳体上限，高档容器也不能无限吞低阶沙子。\n\n一次订单还需本阶导气纹×1＋溶媒×1及服务费；技能学会后在营地/洞府稳纹台操作，NPC 可代操作但不绕过玩家知识前置。预览增容前后、增格阈值、材料消耗和是否溢出。会超过壳体上限的整份材料默认不投入，允许明确确认损失余量；不在后台截断又吞掉所有材料。\n\n容器非空可扩容，但必须安置在稳纹台并锁定其内容，制作期间不可存取；完成只增加容量，不改物品 IDs。扩容无随机碎袋，失败的事务全退。由袋升戒是制作新容器再搬运，扩容过的袋不会被静默销毁。\n\n## 7. 灵石、快捷栏与物品归属\n\n灵石实体五面额每颗默认 0.005 kg/0.002 L，兑换 100 碎为 1 初级后携重也降低，提供兑换意义。钱包显示可访问容器里灵石的总等值，**只是派生显示，不是额外一份可花余额**。营地银行余额是独立账本，仅在授权的交易/仓储终端使用；野外吸收不能远程扣银行或货舱中的石头。\n\n快捷栏绑定物品实例/堆叠位置；丹药要在身上已绑定可访问容器或药囊中才可用。放进飞行器、扩容中的戒指、未开启封存戒后，快捷栏显示不可取用。一次按键先校验容量位置/绑定/状态，再进入服药；不先播吃药再提示物品在远处。\n\n双栏转移先预览格数、体积和双方负重，提交时同时从源扣除并加入目标；同一个实例只有一个 owner/container/location。交易装满的戒指必须先卸货，避免“卖戒却保留内容”或隐含替人转让大量资产。联网所有权遵循第 14 文档。\n\n## 8. 掉落、货舱遗留与恢复\n\n满包战利品保留原容器，可标记返回，原有 15 分钟有效游玩期限仍显示。玩家主动丢放的物品装入独立地面包，保留至少 60 分钟有效游玩，不能通过丢弃重置原战利品资格或伪造新原料。\n\n人物昏迷救援带回穿戴、背包和已绑定空间袋/戒，保留既有成长。停在野外的载具及其货舱留在原处并地图标记；可步行取回，或在救援站付费用无人拖运，首次教学免费；没钱不丢唯一物，可以先接委托。载具失能后货舱不因模型销毁消失，生成持久残骸容器，修复或打捞才能取回。\n\n## 9. 界面与验收\n\n背包窗口显示格数、体积、负重三条信息，预览拿起物品后的速度变化；人物/袋/戒/附近货舱/仓库明确分栏，无远程“整理全部”。扩容面板显示材料来源、技能等级与本次增量。中文容量文字不能只挤进一条窄状态栏。\n\n背包默认计划用 I 打开，保留现有 M 地图、J 档案、U 成长、Q 扫描、E 闪避、F 交互；不直接抢占历史 B 闪避别名。暂停/HUD 同时给背包入口，关窗恢复输入但不误触攻击。未靠近货舱时可查看已知货物清单，但转移按钮明确禁用，避免把只读预览当作远程取物。\n\n验收包括满格未满体积、满体积未超重、堆叠不减重量、超重禁止动作、载具重复计重、袋戒嵌套拒绝、空壳交易、不同品质材料精确增容、溢出未授权不扣料、绑定容器迁移、恢复旧档物品不丢、断线转移不复制，以及负重与追逐采用同一速度结果。\n","html":"\u003ch1>D3-10 · 背包、货舱、储物法器与扩容\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-10-v001.svg\" alt=\"东西装到哪里\">\u003c/p>\u003cp>\u003cem>图解：同一物品只能在一个容器；普通袋戒不能装活宠物。\u003c/em>\u003c/p>\u003cp>2026-09-12；设计规格，尚未实现。依赖 \u003ca href=\"#03_ALCHEMY_MATERIALS_ECONOMY.md\">经济\u003c/a>、\u003ca href=\"#05_NPCS_DIALOGUE_TASKS.md\">NPC\u003c/a>、\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">随机洞府\u003c/a>、\u003ca href=\"#13_MOVEMENT_AND_PURSUIT.md\">移动追逐\u003c/a>、\u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">单机与联网\u003c/a>。本文件覆盖旧设计中未定义容量的背包/钱包假设。\u003c/p>\u003ch2>1. 三种容量同时存在\u003c/h2>\u003cp>物理背包同时受格数、体积（升 L）和玩家负重限制；飞行器货舱受格数、体积和载重限制。空间法器仍有格数、内部容积和内部质量上限，并大幅降低传给持有者的重量。任何一个上限先到，就不能继续放入；界面说明是哪一项满了。\u003c/p>\u003cp>统一规则：物品具有单件体积、质量、最大堆叠数；同 ID、品质、状态和可堆叠属性才能合堆。合堆只省格子，不减质量/体积。装备每件一格，材料默认每格 20，丹药 10，灵石 100；特殊物品另定义。初片不做拼图式旋转背包，避免操作负担。\u003c/p>\u003cp>参考物品：草药一份 0.10 kg/0.20 L，血液一管 0.25 kg/0.30 L，完整内丹 0.08 kg/0.05 L，陨矿一块 2 kg/0.40 L，刀 2 kg/3 L，药剂一份 0.10 kg/0.10 L。各物种大材料另配重量；原矿不能无损变成同样重量的“粉末”来绕过体积限制。\u003c/p>\u003ch2>2. 开局与物理升级\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>容器 ID\u003c/th>\u003cth>格数\u003c/th>\u003cth>容积\u003c/th>\u003cth>容器自身重\u003c/th>\u003cth>结构载重上限\u003c/th>\u003cth>取得方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ST-PACK-01 标准背包\u003c/td>\u003ctd>24\u003c/td>\u003ctd>40 L\u003c/td>\u003ctd>2 kg\u003c/td>\u003ctd>35 kg\u003c/td>\u003ctd>开局配发\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-PACK-02 加固背包\u003c/td>\u003ctd>32\u003c/td>\u003ctd>65 L\u003c/td>\u003ctd>3 kg\u003c/td>\u003ctd>55 kg\u003c/td>\u003ctd>N03 韩铸：韧皮×3、铁陨材×2、纤维×2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-PACK-03 探索背架\u003c/td>\u003ctd>40\u003c/td>\u003ctd>90 L\u003c/td>\u003ctd>4.5 kg\u003c/td>\u003ctd>90 kg\u003c/td>\u003ctd>先天地区：轻陨材×3、韧丝×3、导气纹×1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-SKIMMER 勘探车货箱\u003c/td>\u003ctd>48\u003c/td>\u003ctd>180 L\u003c/td>\u003ctd>计入车体\u003c/td>\u003ctd>250 kg\u003c/td>\u003ctd>原勘探车维修后附带\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-F1 轻型飞行器货舱\u003c/td>\u003ctd>32\u003c/td>\u003ctd>100 L\u003c/td>\u003ctd>计入机体\u003c/td>\u003ctd>120 kg\u003c/td>\u003ctd>F1 蓝图附带\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-F2 探索飞行器货舱\u003c/td>\u003ctd>56\u003c/td>\u003ctd>300 L\u003c/td>\u003ctd>计入机体\u003c/td>\u003ctd>400 kg\u003c/td>\u003ctd>F2 升级\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-F3 高空飞行器货舱\u003c/td>\u003ctd>80\u003c/td>\u003ctd>800 L\u003c/td>\u003ctd>计入机体\u003c/td>\u003ctd>1,200 kg\u003c/td>\u003ctd>F3 升级\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-CAMP 营地仓库\u003c/td>\u003ctd>120\u003c/td>\u003ctd>2,000 L\u003c/td>\u003ctd>不随身\u003c/td>\u003ctd>10,000 kg\u003c/td>\u003ctd>营地初始免费仓格\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>容量是收纳能力，不自动赋予角色承重。后天背了 90 L 背架也可能跑不动。营地可付材料扩建到 240 格/8,000 L，再高转洞府仓库；不是默认无限背包。原型未来接入时以旧资产迁移规则决定默认归属，不能把玩家既有物品截断删除。\u003c/p>\u003ch2>3. 人物负重怎样影响移动\u003c/h2>\u003cp>无临时效果时安全负重 \u003ccode>C(r,l)=30×2^r×(1+0.04×(l−1)) kg\u003c/code>。外穿衣甲、武器、背包、普通物品、空间法器外壳和传递重量都计入；身体自身质量不计。宇航服初始计 8 kg，标准背包 2 kg，训练刀 2 kg，因此后天一级在满速舒适阈值前还有 6 kg 可装，安全负重前还有 18 kg。\u003c/p>\u003cp>定义 \u003ccode>q=有效负重/C\u003c/code>：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>负重区间\u003c/th>\u003cth>移动倍率\u003c/th>\u003cth>动作限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>q≤0.60\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>正常\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0.60&lt;q≤1.00\u003c/td>\u003ctd>从 1.00 线性降到 0.75\u003c/td>\u003ctd>加速能力同步降低；体力消耗从 1.00 升至 1.25 倍\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1.00&lt;q≤1.20\u003c/td>\u003ctd>从 0.75 线性降到 0.50\u003c/td>\u003ctd>禁止疾跑、闪避和主动起飞，能慢移/整理/卸货\u003c/td>\u003c/tr>\u003ctr>\u003ctd>q&gt;1.20\u003c/td>\u003ctd>停止主动移动\u003c/td>\u003ctd>只允许整理、近处转移、丢放、求援；不自动删除物品\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>普通拾取在会超过 120% 负重时拒绝；若因取下减负装备、法器失稳等导致被动超载，保留物品并给解决入口。眩晕、伤势等不凭空缩小容器。不能靠丢包再立即远程取药规避负重，地面包需要靠近操作。\u003c/p>\u003cp>最终速度按第 13 文档计算。负重影响所有姿势的移动和加速，不缩短动作时间、不把武器动画直接慢放。空间法器不是绝对零重，因此装满高密度陨铁仍有代价。\u003c/p>\u003ch2>4. 载具装货与性能\u003c/h2>\u003cp>停稳并在真实货舱交互点 3 米内 F 打开双栏，或在安全停泊状态从座舱打开。飞行中、被攻击中、远离载具时不可随意转移。飞行器格数不与玩家格数合并，快捷药不能远程从货舱取用。\u003c/p>\u003cp>令 \u003ccode>f=货物有效质量/额定货重\u003c/code>，允许装入至 100%，超出拒绝；背包仍背在驾驶者身上时也算货重，放入货舱后只能算一次。标准乘员质量已包含在机体基准，额外装备与背负质量计入货重。\u003c/p>\u003cul>\u003cli>\u003ccode>f≤0.25\u003c/code>：速度/加速/爬升无额外惩罚。\u003c/li>\u003cli>\u003ccode>0.25&lt;f≤1\u003c/code>：最大速度线性降至 80%，加速降至 65%，爬升降至 60%；同距离能耗最高增加 35%。\u003c/li>\u003cli>满载 F3 依然能够在正常气象达到 200 米上限，只是更慢更费电；超载不能起飞，不能以增加高度补偿载重。\u003c/li>\u003c/ul>\u003cp>货舱加固升级只提升该机体额定值，必须配套推进/支撑模块，不能无限加箱子。追逐中的载具速度严格使用相同负重结果，怪物不得忽略自身速度瞬移追上。\u003c/p>\u003ch2>5. 储物法器的大小\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>法器 ID / 形态\u003c/th>\u003cth>建议可用境界\u003c/th>\u003cth>初始→最大容积\u003c/th>\u003cth>初始格数 / 每增加多少 L 加一格\u003c/th>\u003cth>外壳重 / 内物传重系数\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ST-BAG-01 纳物袋\u003c/td>\u003ctd>后天后期，稳定符芯供能\u003c/td>\u003ctd>60→240 L\u003c/td>\u003ctd>32 / 8 L\u003c/td>\u003ctd>0.8 kg / 2%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-BAG-02 灵纹袋\u003c/td>\u003ctd>先天\u003c/td>\u003ctd>300→1,200 L\u003c/td>\u003ctd>48 / 25 L\u003c/td>\u003ctd>0.6 kg / 0.5%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-RING-01 储物戒\u003c/td>\u003ctd>灵海\u003c/td>\u003ctd>1,000→6,000 L\u003c/td>\u003ctd>72 / 100 L\u003c/td>\u003ctd>0.05 kg / 0.1%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ST-RING-02 须弥戒\u003c/td>\u003ctd>金丹—元婴\u003c/td>\u003ctd>10,000→60,000 L\u003c/td>\u003ctd
