003c!-- illustrated-overview:start -->\n![一气化三清：一次激活，两种选择](media/diagram-26-v001.svg)\n\n*图解：圆满双具归一：A/S×3.2，防御灵抗×2.2；合体后不能再拆分刷生命。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n游历者也能持有已有世界来源的逆天物，RN12人物模板不额外提高神物掉率。斩杀后只转移携行原物；吸收后的道统仅在原事件允许时以唯一残印继承，同一资格不会既掉原卷又掉残印。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n2026-09-12；设计稿，尚未实装。用户新增方向：极难获得，获得后普通同级近乎无敌，优秀低境角色可以跨一个大境界取胜。这里是对普通成长上限的**显式例外**，不是把所有普通装备永久调强。角色仍为十境，每境十级。\n\n![双分身、合体与遗宝发现概念图](media/mythic-triptych-v001.png)\n\n图解：左侧本体与两具道身共同战斗；中间两道身归一强化本体；右侧是一条可能以残兵与幼灵开始的隐秘传承。此图为内置imagegen生成的概念插画，不能当作已有3D模型或游戏截图；正式角色结构仍按C2资产规范制作。\n\n## 1. 稀有不等于只能多一个百分比\n\n普通功法讲修炼效率，逆天功法改变能力结构；普通武技造成伤害，逆天武技改变一个受限战斗规则；遗兵有可觉醒的历史；神宠异格属于原33谱系的极稀有个体，不新增第34种；逆天机缘可以永久改变一条成长路线。\n\n验收目标：同境同小级、同普通装备预算下，完成培养的逆天构筑对普通构筑在三类60秒遭遇中胜率目标≥90%；不是获得一个残片立刻满功率。面对同类逆天持有者、专克机制、多人围攻、资源耗尽仍可能失败。低境十级对高一境一至三级普通精英，在看懂攻击后有可验证胜算；低境一级随便秒杀高两境不作为目标。\n\n能力可以提前偶得，承载逐步开放：R0后期就可能拿到残卷、封兵或幼灵，以设备/仪式代行基础功能；进阶形态要学习、修复和试炼。发现坐标、触发顺序和考验组合随角色种子变化，不靠固定时间地点点击领取。\n\n## 2. 超常加成与普通公式怎样相接\n\n保持[19](19_DAMAGE_ATTRIBUTES_AND_MASTERY.md)普通属性管线，在普通常驻属性算完后、施法快照前加入独立 `heavenOverride`。一个角色同时激活**一个天命核心**，来自逆天功法/遗兵/机缘之一；同核心包含一套完整规则，可持有其他宝物但只保留非核心招式/外观/材料功能，切换必须脱战并保留原冷却。新槽是本章明确新增，不悄悄占用或复制主辅功法槽。\n\n同属性超常倍率取当前核心的一个最高生效值，不把“遗兵×分身合体×机缘灌顶”全部乘起来。临时攻击丹与核心加成采用 `max(丹药临时攻击倍率,核心攻击倍率)`；丹药代价仍真实存在。核心速度增益仍进13的移动上限，不倍增攻速、飞行高度或真空权限。\n\n逆天技能的 `C/a/b`、掌握M、抗性、屏障、伤害事件顺序继续用19；专属规则例外必须逐条标记。主核心提供属性时，同一核心技能不能再把相同倍率作为额外“最终伤害”乘一次。稀有武技仍占原主动槽；天命核心动作默认长按技能轮盘选择，允许重绑，不能抢Q扫描/E闪避。\n\n个人盾上限、控制递减、弱点与伤害桶仍有效；允许特定招式短窗口直伤、第二动作体或局部防御穿透。这些是强度来源，不以没有提示的永久无敌实现“逆天”。怪物不会读取玩家获得神物后立即同步变强。同次致命事件只触发一个保命源，优先自身星胎、其次宠物余烬；未触发者不扣储备，但15秒内不能再触发另一保命源，防止两者交替形成连续免死。\n\n## 3. 一气化三清：双道身与三清归一（MYC01）\n\n### 3.1 五阶具体能力\n\nR0八级可通过已发现传承试验学入门，使用独立电容支撑；R1起内息承担。两道身从入门就都有，不把用户要的双分身拖到终局。分身方式与合体方式共用一次激活、资源和剩余时间。\n\n|掌握|每道身攻击/术强继承|每道身生命/防御继承|合体A/S倍率|合体最大H倍率/防御灵抗倍率|最长持续/首次CD|\n|---|---|---|---|---|---|\n|入门|35%|30%/60%|1.80|1.10/1.30|12秒/180秒|\n|小成|45%|35%/65%|2.10|1.20/1.50|15秒/180秒|\n|精通|55%|40%/70%|2.40|1.30/1.70|18秒/180秒|\n|大成|65%|45%/75%|2.80|1.40/1.90|21秒/180秒|\n|圆满|75%|50%/80%|3.20|1.50/2.20|24秒/180秒|\n\nCD在激活时起计，收回/死亡/换核心不重置；前摇1.2秒可被打断，成功开始扣基础池20%，每有效秒另扣2%。不允许战斗换装。表中继承取本体**不含天命核心和临时丹药**的常驻属性快照；不继承分身、召唤、宠物、阵法、核心激活、掉落和炼制技能。每道身使用本体已装备的一个可复制武技，轮流施放，共享“分身技能”CD：每6秒最多一具道身施放一次，两具不能同时复制大招。\n\n普通攻击各按继承A结算；复制武技的固定C也乘继承比例，继承A/S已经缩放后不再整体乘第二遍。复制技按本体已掌握阶段计算一次；若原武技CD长于6秒，则取原CD。每次复制从本体额外扣原技能成本50%，耗尽则道身只能普攻直至总体断气。道身不独立吃丹回气，不共享本体被动吸血/反伤触发；本体只能因自己的实际伤害触发一次。\n\n### 3.2 战斗与合体状态\n\n本体可下达夹击/护卫/集火/归一，双道身采用青/金轮廓、脚下印和头顶图标，敌人能识别但仍需处理三个攻击方向。每道身要走真实路径，离本体30米开始回归、超过40米停攻返航；不能穿墙去打未加载敌人。指令可设两种不同武器动作，但没有两套可掉落装备。\n\n至少一具存活时可合体，前摇0.8秒；两具存活取全倍率，一具取倍率增量的一半。例如圆满只剩一具：A/S=1+(3.2−1)/2=2.1。两具已灭不能合体，也不能在同一次激活重生道身。选择归一后剩余持续时间不刷新，不能再拆回分身循环刷盾/生命。\n\n合体增H采用临时生命容量层：常驻H和当前H原样保留，增加 `(H倍率−1)×常驻最大H` 的临时容量与同额临时生命；先消耗临时层，不能治疗该层，结束移除剩余层，不按百分比抬高永久生命。伤害日志分别记临时层/本体，合体不能把残血洗满。个人盾上限按常驻最大H计算，不利用临时H扩盾；实际本体HP为0仍昏迷。\n\n持续结束或主动提前结束后有15秒“分神疲劳”：不能再次激活核心，回气速率−30%；不掉境界、不清熟练。受伤道身消散有0.5秒清晰解体演出，禁止瞬间把被杀道身算成满额合体。\n\n### 3.3 3D制作与五阶差异\n\n骨架和武器来自同版本本体，衣物不另随机生成。入门道身局部透明且边缘不稳定，小成骨架/衣纹稳定，精通青金经脉连贯，大成三人脚下形成短连线，圆满头顶出现完整三清环；装饰不增加命中次数。合体时两道身沿可见弧线归胸，先解除实体碰撞再播放流光，0.8秒到点才更新属性。可在第一人称看见两侧影身，合体镜头不强制切第三人称。\n\n道身计入可见战斗单位与寻路预算，单机默认同屏最多两组完整三清核心，超出先简化远处VFX而不是删掉敌方伤害体。未来多人需独立容量测试，不能复制客户端角色对象当服务端分身。\n\n## 4. 六部逆天功法\n\n每部均D5，沿用五阶熟练度，专属阶段数值覆盖普通核心；下表未写的属性无额外收益。圆满是长期培养结果。\n\n|ID 名称|早期发现/最早使用|逆天规则（入门→圆满）|代价与独特获取考验|\n|---|---|---|---|\n|MYC01 一气化三清|R0后期/八级|双道身或归一，完整五阶见上|三处不同生态回声拼接，分别用本体完成攻/守/识试验，不要求先有分身|\n|MYC02 不灭星胎经|R0残核/R1|核心H倍率1.2/1.4/1.6/1.8/2；致命前可消耗星胎储备拦一次使H留1，24小时有效游玩一次|星胎需三次不同远征修复，承伤成功后60秒伤害−30%，不抵剧情毁星/缺氧|\n|MYC03 万法归炉诀|R1碎炉/R2|吸收已成功挡下的术伤能量，转自身下一术增伤桶+15/25/35/45/60%，最多存一次|必须实挡，不能吸友方/自己阵法；存量10秒失效，自己承担屏障成本|\n|MYC04 太初无相经|R0无字页/R1|激活12秒选择已观测元素，来源该元素术强倍率1.5/1.8/2.1/2.4/2.7|CD150秒、20%基础气＋每秒2%；本次其他元素术强×0.6，切元素需再激活|\n|MYC05 逆命燃灯录|R1残灯/R2|激活10秒A/S倍率1.8/2.1/2.4/2.7/3；伤害的20%延后为随后20秒生命债|CD180秒、25%气，债务可治疗但不可下线/昏迷清除，不免死；先完成有安全余量的债务教学|\n|MYC06 周天无漏篇|R2星图/R3|激活20秒A/S倍率1.4/1.6/1.8/2/2.2，主动真气成本减少10/15/20/25/30%|CD150秒、启动30%基础气；飞行/阵能/维持核心不减耗，无限循环不成立|\n\nMYC02的抗致命保命默认被动占用当前核心，储备不能与别的核心同时工作；其24小时是累计游玩时间，离线不能充值次数。MYC03的增伤走19的75%普通桶，不额外突破其上限。\n\n## 5. 六式禁传武技\n\n占人物主动槽、D5、五阶伤害仍×1/1.18/1.40/1.68/2；控制不随伤害翻倍。费用以基础池百分比表示；表中数值为入门，总多段预算。\n\n|ID 名称|最低境界|伤害/范围/判定|前摇/后摇/CD/耗气|逆天之处与反制|\n|---|---|---|---|---|\n|MYA01 截天一线|R1|12/1.4/0.8；18米宽0.6线H2|1/0.8/35/30%|本次50%伤害物理、50%直伤，掩体和几何盾仍能挡；释放前线向冻结|\n|MYA02 掌中山河|R3|20/0.5/2；15米半径5H3|1.5/1/45/35%|有界区域4秒地速−40%，共4段；能出圈、毁符柱，空中也显示上下边界|\n|MYA03 大梦回身|R2|无伤害；自身H6|0.6/0.4/90/30%|留下锚点，5秒内可回返最多12米与同高度合法位置；不回滚生命、资源、道具和CD|\n|MYA04 因果断章|R4|8/0/1.0；12米H5|1.4/0.8/45/30%|锁印后截断目标下一次可打断主动，持续2秒且只一次；锁定前破线、后解印/用普攻可反制|\n|MYA05 万剑朝宗|R2|18/1.8/1.0；24米H4|1.2/1/40/35%|12剑视觉、六段总伤，转向60°/秒；墙体逐剑挡，不复制武器12份属性|\n|MYA06 诛星七步|R5|20/1.5/1.2；七步共14米H1|1/1/50/40%|七步累计伤害权重10/10/10/10/15/20/25%，末击削韧80；可打断、地形会截停|\n\n表现分别是极细断天白线、立体山河掌印、梦镜残身、断裂卷页锁印、可读剑群和逐步星痕。低特效也保留线/圈/锚/剑核/脚步预警。圆满补完整结构，不能把六段计算成十二次满额。\n\n## 6. 六件唯一成长遗兵\n\n未绑定完整遗兵可交易；激活后认主，可安全解除认主再交易，保留物品自身修复史、不会洗首次奖励。按[27世界唯一账](27_CONSUMPTION_AND_UNIQUE_WORLD.md)，每世界每件原器只有一个rootArtifactId，所有角色及来源共用；交易、丢弃、拆片、换角色不复位。收集残片只能补全同一把。普通装备属性仍按本境Q6上限，下面“神权”必须作为天命核心激活才生效。\n\n|ID 名称/类别|最早使用|神权（入门→圆满）|成长材料与破局方式|\n|---|---|---|---|\n|MYW01 归墟断剑/剑|R0八级残刃|A倍率1.6/1.9/2.2/2.5/2.8；每12秒首重击30%转直伤|三块不同陨落遗片、真实剑碑验证；断口吞光，复原后仍留历史裂痕|\n|MYW02 镇界长枪/长枪|R1|A倍率1.5/1.8/2.1/2.4/2.7；命中施放者削韧额外20|追踪会迁移的界缝锚材，枪尾撑地稳态，落空长收招|\n|MYW03 天衡古锤/锤|R2|A倍率1.8/2.1/2.4/2.7/3；地速−15%，重击前摇+20%|反重力陨核需要先稳定设施而非强打，核心倾斜表示蓄力|\n|MYW04 无弦星弓/弓|R1|A倍率1.4/1.7/2/2.3/2.6；可额外耗基础气5%替代一支箭|夜空不同方位观测，不能在背包生成箭出售；光弦和真实拉弓动作|\n|MYW05 万象归环/环|R2|S倍率1.5/1.8/2.1/2.4/2.7；每10秒可挡正面一枚可挡弹|寻回失散环瓣、校准真实回收轨迹，不挡H5已成立锁印|\n|MYW06 弑劫双爪/拳爪|R1|A倍率1.6/1.9/2.2/2.5/2.8；实际生命伤害吸取8%，每秒最多自身H的3%|击败有预警破绽的镜像猎手；反伤/召唤不触发吸血链|\n\n遗兵激活持续20秒、CD150秒、启动20%基础气、每秒2%；被动段仅在激活窗口有效。封存/换武器立即结束神权但CD照走。进阶从入门到圆满需本境材料、三类不同实战记录与修复知识，不额外复制普通武器品质乘数。\n\n## 7. 六种神宠异格：保留33谱系\n\n以下为原宠物的稀有命格，不是新增可普遍购买的物种。宠物自身也只有一个异格核心，普通血脉和境界仍成长，不能孵化即满B6。普通主人的同级宠可以更强，仍沿用稀有护主破限最多高主人一个大境界。\n\n|ID 异格/原谱系|额外专属能力|数值与代价|出其不意的获得线索/3D|\n|---|---|---|---|\n|MYP01 归夜九尾/PET09|影卫：短暂替主人分担伤害|8秒转移主人盾后伤害30%给自身，CD90秒、灵力30%；自身生命不足则停止|被当成普通失散幼狐，三个无奖励善意照料后显示残月纹；迷你形态双色尾尖|\n|MYP02 不熄凰/PET05|余烬护生：抵一次主人致命伤至H=1|每24小时有效游玩一次，耗宠基础灵力80%；随后120秒无法出战，不复活已倒地者|熄灭炉灰中温度反常的卵，需救火不是添火；焦羽重生演出|\n|MYP03 负星玄武/PET04|星壳承天：自身H与D临时×2|12秒、CD120秒、灵力35%，移动−40%，不为主人复制2倍生命|空壳漂浮的幼龟实际背负微星核，修壳需放弃一次快捷开采；星纹甲片|\n|MYP04 逐日天马/PET17|日行：载飞巡航速度×1.6|10秒、CD120秒、灵力40%，仍守骑手高度/防护/载重，不改地面人物速度|护送受伤母兽后得到独特幼驹线索；蹄下短日轮，不瞬移|\n|MYP05 食界鲲鹏/PET16|吞界息：破阵吐息总伤20/0.5/2|20米H2，1.2秒前摇、CD45秒、灵力35%；对几何盾额外+50%入专用破盾桶，不作用HP|潮汐倒流仅露一枚石状卵，先维护水系再显真形；鳍内星砂|\n|MYP06 问道白泽/PET10|万象识破：给主人一次破防机会|H5锁定1.2秒，15米、CD45秒、灵力30%；下次本体命中忽略目标50%防御，5秒失效，不共享分身|救下被误判为机械异常的幼兽，通过声音回应而非杀怪；额目书纹|\n\n异格能力占15的羁绊协同槽，原A/B/T保留但不另开第三常规主动键。异格五阶：数值效果保持表值，解锁稳定时长/耗能依次为表中耗能×1.2/1.15/1.1/1.05/1，持续时长为表值×0.6/0.7/0.8/0.9/1；一次免死型只改耗能，不增加次数。伤害型按19五阶伤害M，破盾系数不跟M翻倍。MYP06百分比穿透与其他穿透合计仍50%封顶。\n\n## 8. 六种逆天机缘\n\n|ID 机缘|惊喜入口|实际难题|永久获得与边界|\n|---|---|---|---|\n|MYF01 太初重铸池|枯井扫描读数是负温，而非金光宝箱|恢复三支流、保留退路、承载试验；最低R0八级|天命核心：H/A/S/D/灵抗×1.6；无激活耗能，但占唯一核心，不与三清倍率叠加|\n|MYF02 无字天碑|普通石材拆解前出现与手势同步的影子|用已学三类动作解碑，失败仅记录，不销毁碑|任选一部尚未拥有MYC的入门完整传承，不赠圆满；内容生成时锁定候选|\n|MYF03 残星问心|救援信号来自无人设备，回应形成坐标|修复观测站、完成三段不同取舍任务|自选已学武技累计熟练额外+50%学习效率，永久但仅一项，不直接×1.5伤害|\n|MYF04 逆流一瞬|崩塌遗迹的碎片逆向漂浮|在两个安全锚之间保持路径，不能要求未学传送|获得MYA03残章与普通体质+5%一个槽，残章需修复才学；不真实回滚存档|\n|MYF05 众生回响|多次不求回报的救助留下不同微小标记|至少3种独立生态事件，系统稀有种子先决定有无，善举不保证出货|一枚已锁定谱系/异格的MYP蛋或救援契约线索，仍须孵化/建立信任|\n|MYF06 星骸授业|不起眼铁陨内部有节律敲击|非暴力拆解、隔离辐射、寻找失落炉心|获得一件封存MYW，修复后可用；材料失败不碎原器，可补普通辅料|\n\n机缘成功意味着确定兑现已承诺内容，困难放在探索、承载、护送、解谜、稀有材料与真实战斗，**不在最后再掷一次低概率成功，把几十小时努力清零**。谜题可从记录推导，关键道具可追回；初次受挫保留线索，仍需补消耗品和解决难题。\n\n## 9. 极稀有刷新与难度\n\n延续11：每个首次完成的合格独立探索调查，极稀有永久机缘概率0.3%。其中固定互斥分支：5%为原护主破限线、2%为本章逆天线、93%为原普通永久机缘。逆天线基础无条件概率为0.003×0.02=0.00006，即**0.006%，约1/16667次合格调查**；这只是期望，不保证第16667次出现。不能每帧/每开箱/每256米重试，调度限定每有效游玩小时最多6个合格首次调查。\n\n逆天线在未耗尽合法类别间等权选择（五类都可用时各20%），类内未占用条目等权；选择前按27查世界唯一键，预留时锁定来源、物项和固定候选序列。仅区域暂时无法兑现时保留封存线索，不把已属于别人的原器再许诺给玩家。MYF兑现与直接来源共用奖励唯一键，原器/道统/命格/核心机缘世界唯一，MYA首次学习按角色记录。已有活动线索时新资格保留待揭示；全部唯一池耗尽的明确选择见27。\n\n100个合格调查至少触发一次逆天线概率约0.598%；600个约3.536%。这里算的是**遇到线索**，不等于完成高难度挑战并得到成熟神物。无普通保底，不进日常商店/签到；第20的20次研究保底只覆盖常规D5技能，不覆盖MY编号。开发可用显式测试种子验证所有线路，不能将测试种子当正式角色常规掉落。\n\n后天能偶遇，但高阶难题可先封存后回来；“越境打赢”不要求先用尚未得到的神物杀掉守门者。路径至少提供战斗与机关/绕行两种进入方式，最终承载考验必须在当前能力或可取得设备范围内。\n\n## 10. 越境可算的例子\n\n取R0十级普通成长B=2.62，常规体质+40%、功法×1.35、装备×1.4，得到攻击83.19024、防御69.3252、生命831.9024。与R1一级普通精英比较：H1080、A90、D60，均无盾/额外减伤。\n\n|状态|玩家A/D|玩家普攻每次实际HP伤害|敌人每次普攻对玩家HP伤害|说明|\n|---|---|---|---|---|\n|未激活|83.19024 / 69.3252|66|32|玩家需要17次命中，机动失误仍有风险|\n|三清圆满归一|266.208768 / 152.51544|212|18|玩家需要6次命中，并有415.9512临时生命层；24秒窗口内有现实胜算|\n\n目标防御K按其R1为240，玩家K按R0为40；用19公式分别算，不偷偷把玩家也视为R1。这里是裸普攻算例，未计攻击间隔、对方重击、位移与失误；测试应安排有两种可躲招式的同一精英对照，不能把纸面算例称为已实测胜率。\n\n同小级跨一整境的基础差约6倍，三清归一3.2倍攻击本身不保证赢；通过临时生命、防御、武技与战术才可能胜。越境击败不直接解锁R5御空/R6传送/R8真空权限，成长与世界能力仍分别确认。\n\n## 11. 资产、存档与验收\n\n保存legendaryInstanceId、sourceOpportunityId、world/characterId、foundState、repairStages、mastery、activeCoreId、cooldownUntilSimulationTime、cloneGroupId、sharedEnergyLedger、temporaryLifeLayer、debt。分身无库存/掉落，不生成独立经验；所有击杀归本体同一任务事件，实际宠物仍只一只战宠。\n\n新增媒体存入media/versioned文件与清单；本轮概念图是concept，后续Blender源、GLB、动画、五阶演出视频单独登记，保留此前130资产清单，不用新清单覆盖旧盘点。没有独立备份仍如实标注。\n\n首片只验证三清：普通战斗→发现残卷→三类试验→学习双分身→真实夹击→受伤一具→合体只计一具→耗气结束→CD读档保留。补测试：克隆不得再克隆、材料/掉落不复制、临时生命不洗血、换装不重算快照、跨境公式、H5锁定、低帧率碰撞、第一人称镜头和30米回归。随后扩一件遗兵与一种异格；未体验过单核心前不同时开发30项。\n","html":"\u003ch1>26 · 逆天传承、唯一遗兵与不可预料的机缘\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-26-v001.svg\" alt=\"一气化三清：一次激活，两种选择\">\u003c/p>\u003cp>\u003cem>图解：圆满双具归一：A/S×3.2，防御灵抗×2.2；合体后不能再拆分刷生命。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>游历者也能持有已有世界来源的逆天物，RN12人物模板不额外提高神物掉率。斩杀后只转移携行原物；吸收后的道统仅在原事件允许时以唯一残印继承，同一资格不会既掉原卷又掉残印。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>2026-09-12；设计稿，尚未实装。用户新增方向：极难获得，获得后普通同级近乎无敌，优秀低境角色可以跨一个大境界取胜。这里是对普通成长上限的\u003cstrong>显式例外\u003c/strong>，不是把所有普通装备永久调强。角色仍为十境，每境十级。\u003c/p>\u003cp>\u003cimg loading=\"lazy\" src=\"media/mythic-triptych-v001.png\" alt=\"双分身、合体与遗宝发现概念图\">\u003c/p>\u003cp>图解：左侧本体与两具道身共同战斗；中间两道身归一强化本体；右侧是一条可能以残兵与幼灵开始的隐秘传承。此图为内置imagegen生成的概念插画，不能当作已有3D模型或游戏截图；正式角色结构仍按C2资产规范制作。\u003c/p>\u003ch2>1. 稀有不等于只能多一个百分比\u003c/h2>\u003cp>普通功法讲修炼效率，逆天功法改变能力结构；普通武技造成伤害，逆天武技改变一个受限战斗规则；遗兵有可觉醒的历史；神宠异格属于原33谱系的极稀有个体，不新增第34种；逆天机缘可以永久改变一条成长路线。\u003c/p>\u003cp>验收目标：同境同小级、同普通装备预算下，完成培养的逆天构筑对普通构筑在三类60秒遭遇中胜率目标≥90%；不是获得一个残片立刻满功率。面对同类逆天持有者、专克机制、多人围攻、资源耗尽仍可能失败。低境十级对高一境一至三级普通精英，在看懂攻击后有可验证胜算；低境一级随便秒杀高两境不作为目标。\u003c/p>\u003cp>能力可以提前偶得，承载逐步开放：R0后期就可能拿到残卷、封兵或幼灵，以设备/仪式代行基础功能；进阶形态要学习、修复和试炼。发现坐标、触发顺序和考验组合随角色种子变化，不靠固定时间地点点击领取。\u003c/p>\u003ch2>2. 超常加成与普通公式怎样相接\u003c/h2>\u003cp>保持\u003ca href=\"#19_DAMAGE_ATTRIBUTES_AND_MASTERY.md\">19\u003c/a>普通属性管线，在普通常驻属性算完后、施法快照前加入独立 \u003ccode>heavenOverride\u003c/code>。一个角色同时激活\u003cstrong>一个天命核心\u003c/strong>，来自逆天功法/遗兵/机缘之一；同核心包含一套完整规则，可持有其他宝物但只保留非核心招式/外观/材料功能，切换必须脱战并保留原冷却。新槽是本章明确新增，不悄悄占用或复制主辅功法槽。\u003c/p>\u003cp>同属性超常倍率取当前核心的一个最高生效值，不把“遗兵×分身合体×机缘灌顶”全部乘起来。临时攻击丹与核心加成采用 \u003ccode>max(丹药临时攻击倍率,核心攻击倍率)\u003c/code>；丹药代价仍真实存在。核心速度增益仍进13的移动上限，不倍增攻速、飞行高度或真空权限。\u003c/p>\u003cp>逆天技能的 \u003ccode>C/a/b\u003c/code>、掌握M、抗性、屏障、伤害事件顺序继续用19；专属规则例外必须逐条标记。主核心提供属性时，同一核心技能不能再把相同倍率作为额外“最终伤害”乘一次。稀有武技仍占原主动槽；天命核心动作默认长按技能轮盘选择，允许重绑，不能抢Q扫描/E闪避。\u003c/p>\u003cp>个人盾上限、控制递减、弱点与伤害桶仍有效；允许特定招式短窗口直伤、第二动作体或局部防御穿透。这些是强度来源，不以没有提示的永久无敌实现“逆天”。怪物不会读取玩家获得神物后立即同步变强。同次致命事件只触发一个保命源，优先自身星胎、其次宠物余烬；未触发者不扣储备，但15秒内不能再触发另一保命源，防止两者交替形成连续免死。\u003c/p>\u003ch2>3. 一气化三清：双道身与三清归一（MYC01）\u003c/h2>\u003ch3>3.1 五阶具体能力\u003c/h3>\u003cp>R0八级可通过已发现传承试验学入门，使用独立电容支撑；R1起内息承担。两道身从入门就都有，不把用户要的双分身拖到终局。分身方式与合体方式共用一次激活、资源和剩余时间。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>掌握\u003c/th>\u003cth>每道身攻击/术强继承\u003c/th>\u003cth>每道身生命/防御继承\u003c/th>\u003cth>合体A/S倍率\u003c/th>\u003cth>合体最大H倍率/防御灵抗倍率\u003c/th>\u003cth>最长持续/首次CD\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>入门\u003c/td>\u003ctd>35%\u003c/td>\u003ctd>30%/60%\u003c/td>\u003ctd>1.80\u003c/td>\u003ctd>1.10/1.30\u003c/td>\u003ctd>12秒/180秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小成\u003c/td>\u003ctd>45%\u003c/td>\u003ctd>35%/65%\u003c/td>\u003ctd>2.10\u003c/td>\u003ctd>1.20/1.50\u003c/td>\u003ctd>15秒/180秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>精通\u003c/td>\u003ctd>55%\u003c/td>\u003ctd>40%/70%\u003c/td>\u003ctd>2.40\u003c/td>\u003ctd>1.30/1.70\u003c/td>\u003ctd>18秒/180秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大成\u003c/td>\u003ctd>65%\u003c/td>\u003ctd>45%/75%\u003c/td>\u003ctd>2.80\u003c/td>\u003ctd>1.40/1.90\u003c/td>\u003ctd>21秒/180秒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>圆满\u003c/td>\u003ctd>75%\u003c/td>\u003ctd>50%/80%\u003c/td>\u003ctd>3.20\u003c/td>\u003ctd>1.50/2.20\u003c/td>\u003ctd>24秒/180秒\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>CD在激活时起计，收回/死亡/换核心不重置；前摇1.2秒可被打断，成功开始扣基础池20%，每有效秒另扣2%。不允许战斗换装。表中继承取本体\u003cstrong>不含天命核心和临时丹药\u003c/strong>的常驻属性快照；不继承分身、召唤、宠物、阵法、核心激活、掉落和炼制技能。每道身使用本体已装备的一个可复制武技，轮流施放，共享“分身技能”CD：每6秒最多一具道身施放一次，两具不能同时复制大招。\u003c/p>\u003cp>普通攻击各按继承A结算；复制武技的固定C也乘继承比例，继承A/S已经缩放后不再整体乘第二遍。复制技按本体已掌握阶段计算一次；若原武技CD长于6秒，则取原CD。每次复制从本体额外扣原技能成本50%，耗尽则道身只能普攻直至总体断气。道身不独立吃丹回气，不共享本体被动吸血/反伤触发；本体只能因自己的实际伤害触发一次。\u003c/p>\u003ch3>3.2 战斗与合体状态\u003c/h3>\u003cp>本体可下达夹击/护卫/集火/归一，双道身采用青/金轮廓、脚下印和头顶图标，敌人能识别但仍需处理三个攻击方向。每道身要走真实路径，离本体30米开始回归、超过40米停攻返航；不能穿墙去打未加载敌人。指令可设两种不同武器动作，但没有两套可掉落装备。\u003c/p>\u003cp>至少一具存活时可合体，前摇0.8秒；两具存活取全倍率，一具取倍率增量的一半。例如圆满只剩一具：A/S=1+(3.2−1)/2=2.1。两具已灭不能合体，也不能在同一次激活重生道身。选择归一后剩余持续时间不刷新，不能再拆回分身循环刷盾/生命。\u003c/p>\u003cp>合体增H采用临时生命容量层：常驻H和当前H原样保留，增加 \u003ccode>(H倍率−1)×常驻最大H\u003c/code> 的临时容量与同额临时生命；先消耗临时层，不能治疗该层，结束移除剩余层，不按百分比抬高永久生命。伤害日志分别记临时层/本体，合体不能把残血洗满。个人盾上限按常驻最大H计算，不利用临时H扩盾；实际本体HP为0仍昏迷。\u003c/p>\u003cp>持续结束或主动提前结束后有15秒“分神疲劳”：不能再次激活核心，回气速率−30%；不掉境界、不清熟练。受伤道身消散有0.5秒清晰解体演出，禁止瞬间把被杀道身算成满额合体。\u003c/p>\u003ch3>3.3 3D制作与五阶差异\u003c/h3>\u003cp>骨架和武器来自同版本本体，衣物不另随机生成。入门道身局部透明且边缘不稳定，小成骨架/衣纹稳定，精通青金经脉连贯，大成三人脚下形成短连线，圆满头顶出现完整三清环；装饰不增加命中次数。合体时两道身沿可见弧线归胸，先解除实体碰撞再播放流光，0.8秒到点才更新属性。可在第一人称看见两侧影身，合体镜头不强制切第三人称。\u003c/p>\u003cp>道身计入可见战斗单位与寻路预算，单机默认同屏最多两组完整三清核心，超出先简化远处VFX而不是删掉敌方伤害体。未来多人需独立容量测试，不能复制客户端角色对象当服务端分身。\u003c/p>\u003ch2>4. 六部逆天功法\u003c/h2>\u003cp>每部均D5，沿用五阶熟练度，专属阶段数值覆盖普通核心；下表未写的属性无额外收益。圆满是长期培养结果。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 名称\u003c/th>\u003cth>早期发现/最早使用\u003c/th>\u003cth>逆天规则（入门→圆满）\u003c/th>\u003cth>代价与独特获取考验\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYC01 一气化三清\u003c/td>\u003ctd>R0后期/八级\u003c/td>\u003ctd>双道身或归一，完整五阶见上\u003c/td>\u003ctd>三处不同生态回声拼接，分别用本体完成攻/守/识试验，不要求先有分身\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC02 不灭星胎经\u003c/td>\u003ctd>R0残核/R1\u003c/td>\u003ctd>核心H倍率1.2/1.4/1.6/1.8/2；致命前可消耗星胎储备拦一次使H留1，24小时有效游玩一次\u003c/td>\u003ctd>星胎需三次不同远征修复，承伤成功后60秒伤害−30%，不抵剧情毁星/缺氧\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC03 万法归炉诀\u003c/td>\u003ctd>R1碎炉/R2\u003c/td>\u003ctd>吸收已成功挡下的术伤能量，转自身下一术增伤桶+15/25/35/45/60%，最多存一次\u003c/td>\u003ctd>必须实挡，不能吸友方/自己阵法；存量10秒失效，自己承担屏障成本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC04 太初无相经\u003c/td>\u003ctd>R0无字页/R1\u003c/td>\u003ctd>激活12秒选择已观测元素，来源该元素术强倍率1.5/1.8/2.1/2.4/2.7\u003c/td>\u003ctd>CD150秒、20%基础气＋每秒2%；本次其他元素术强×0.6，切元素需再激活\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC05 逆命燃灯录\u003c/td>\u003ctd>R1残灯/R2\u003c/td>\u003ctd>激活10秒A/S倍率1.8/2.1/2.4/2.7/3；伤害的20%延后为随后20秒生命债\u003c/td>\u003ctd>CD180秒、25%气，债务可治疗但不可下线/昏迷清除，不免死；先完成有安全余量的债务教学\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC06 周天无漏篇\u003c/td>\u003ctd>R2星图/R3\u003c/td>\u003ctd>激活20秒A/S倍率1.4/1.6/1.8/2/2.2，主动真气成本减少10/15/20/25/30%\u003c/td>\u003ctd>CD150秒、启动30%基础气；飞行/阵能/维持核心不减耗，无限循环不成立\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>MYC02的抗致命保命默认被动占用当前核心，储备不能与别的核心同时工作；其24小时是累计游玩时间，离线不能充值次数。MYC03的增伤走19的75%普通桶，不额外突破其上限。\u003c/p>\u003ch2>5. 六式禁传武技\u003c/h2>\u003cp>占人物主动槽、D5、五阶伤害仍×1/1.18/1.40/1.68/2；控制不随伤害翻倍。费用以基础池百分比表示；表中数值为入门，总多段预算。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 名称\u003c/th>\u003cth>最低境界\u003c/th>\u003cth>伤害/范围/判定\u003c/th>\u003cth>前摇/后摇/CD/耗气\u003c/th>\u003cth>逆天之处与反制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYA01 截天一线\u003c/td>\u003ctd>R1\u003c/td>\u003ctd>12/1.4/0.8；18米宽0.6线H2\u003c/td>\u003ctd>1/0.8/35/30%\u003c/td>\u003ctd>本次50%伤害物理、50%直伤，掩体和几何盾仍能挡；释放前线向冻结\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA02 掌中山河\u003c/td>\u003ctd>R3\u003c/td>\u003ctd>20/0.5/2；15米半径5H3\u003c/td>\u003ctd>1.5/1/45/35%\u003c/td>\u003ctd>有界区域4秒地速−40%，共4段；能出圈、毁符柱，空中也显示上下边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA03 大梦回身\u003c/td>\u003ctd>R2\u003c/td>\u003ctd>无伤害；自身H6\u003c/td>\u003ctd>0.6/0.4/90/30%\u003c/td>\u003ctd>留下锚点，5秒内可回返最多12米与同高度合法位置；不回滚生命、资源、道具和CD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA04 因果断章\u003c/td>\u003ctd>R4\u003c/td>\u003ctd>8/0/1.0；12米H5\u003c/td>\u003ctd>1.4/0.8/45/30%\u003c/td>\u003ctd>锁印后截断目标下一次可打断主动，持续2秒且只一次；锁定前破线、后解印/用普攻可反制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA05 万剑朝宗\u003c/td>\u003ctd>R2\u003c/td>\u003ctd>18/1.8/1.0；24米H4\u003c/td>\u003ctd>1.2/1/40/35%\u003c/td>\u003ctd>12剑视觉、六段总伤，转向60°/秒；墙体逐剑挡，不复制武器12份属性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA06 诛星七步\u003c/td>\u003ctd>R5\u003c/td>\u003ctd>20/1.5/1.2；七步共14米H1\u003c/td>\u003ctd>1/1/50/40%\u003c/td>\u003ctd>七步累计伤害权重10/10/10/10/15/20/25%，末击削韧80；可打断、地形会截停\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>表现分别是极细断天白线、立体山河掌印、梦镜残身、断裂卷页锁印、可读剑群和逐步星痕。低特效也保留线/圈/锚/剑核/脚步预警。圆满补完整结构，不能把六段计算成十二次满额。\u003c/p>\u003ch2>6. 六件唯一成长遗兵\u003c/h2>\u003cp>未绑定完整遗兵可交易；激活后认主，可安全解除认主再交易，保留物品自身修复史、不会洗首次奖励。按\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27世界唯一账\u003c/a>，每世界每件原器只有一个rootArtifactId，所有角色及来源共用；交易、丢弃、拆片、换角色不复位。收集残片只能补全同一把。普通装备属性仍按本境Q6上限，下面“神权”必须作为天命核心激活才生效。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 名称/类别\u003c/th>\u003cth>最早使用\u003c/th>\u003cth>神权（入门→圆满）\u003c/th>\u003cth>成长材料与破局方式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYW01 归墟断剑/剑\u003c/td>\u003ctd>R0八级残刃\u003c/td>\u003ctd>A倍率1.6/1.9/2.2/2.5/2.8；每12秒首重击30%转直伤\u003c/td>\u003ctd>三块不同陨落遗片、真实剑碑验证；断口吞光，复原后仍留历史裂痕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYW02 镇界长枪/长枪\u003c/td>\u003ctd>R1\u003c/td>\u003ctd>A倍率1.5/1.8/2.1/2.4/2.7；命中施放者削韧额外20\u003c/td>\u003ctd>追踪会迁移的界缝锚材，枪尾撑地稳态，落空长收招\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYW03 天衡古锤/锤\u003c/td>\u003ctd>R2\u003c/td>\u003ctd>A倍率1.8/2.1/2.4/2.7/3；地速−15%，重击前摇+20%\u003c/td>\u003ctd>反重力陨核需要先稳定设施而非强打，核心倾斜表示蓄力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYW04 无弦星弓/弓\u003c/td>\u003ctd>R1\u003c/td>\u003ctd>A倍率1.4/1.7/2/2.3/2.6；可额外耗基础气5%替代一支箭\u003c/td>\u003ctd>夜空不同方位观测，不能在背包生成箭出售；光弦和真实拉弓动作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYW05 万象归环/环\u003c/td>\u003ctd>R2\u003c/td>\u003ctd>S倍率1.5/1.8/2.1/2.4/2.7；每10秒可挡正面一枚可挡弹\u003c/td>\u003ctd>寻回失散环瓣、校准真实回收轨迹，不挡H5已成立锁印\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYW06 弑劫双爪/拳爪\u003c/td>\u003ctd>R1\u003c/td>\u003ctd>A倍率1.6/1.9/2.2/2.5/2.8；实际生命伤害吸取8%，每秒最多自身H的3%\u003c/td>\u003ctd>击败有预警破绽的镜像猎手；反伤/召唤不触发吸血链\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>遗兵激活持续20秒、CD150秒、启动20%基础气、每秒2%；被动段仅在激活窗口有效。封存/换武器立即结束神权但CD照走。进阶从入门到圆满需本境材料、三类不同实战记录与修复知识，不额外复制普通武器品质乘数。\u003c/p>\u003ch2>7. 六种神宠异格：保留33谱系\u003c/h2>\u003cp>以下为原宠物的稀有命格，不是新增可普遍购买的物种。宠物自身也只有一个异格核心，普通血脉和境界仍成长，不能孵化即满B6。普通主人的同级宠可以更强，仍沿用稀有护主破限最多高主人一个大境界。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 异格/原谱系\u003c/th>\u003cth>额外专属能力\u003c/th>\u003cth>数值与代价\u003c/th>\u003cth>出其不意的获得线索/3D\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYP01 归夜九尾/PET09\u003c/td>\u003ctd>影卫：短暂替主人分担伤害\u003c/td>\u003ctd>8秒转移主人盾后伤害30%给自身，CD90秒、灵力30%；自身生命不足则停止\u003c/td>\u003ctd>被当成普通失散幼狐，三个无奖励善意照料后显示残月纹；迷你形态双色尾尖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP02 不熄凰/PET05\u003c/td>\u003ctd>余烬护生：抵一次主人致命伤至H=1\u003c/td>\u003ctd>每24小时有效游玩一次，耗宠基础灵力80%；随后120秒无法出战，不复活已倒地者\u003c/td>\u003ctd>熄灭炉灰中温度反常的卵，需救火不是添火；焦羽重生演出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP03 负星玄武/PET04\u003c/td>\u003ctd>星壳承天：自身H与D临时×2\u003c/td>\u003ctd>12秒、CD120秒、灵力35%，移动−40%，不为主人复制2倍生命\u003c/td>\u003ctd>空壳漂浮的幼龟实际背负微星核，修壳需放弃一次快捷开采；星纹甲片\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP04 逐日天马/PET17\u003c/td>\u003ctd>日行：载飞巡航速度×1.6\u003c/td>\u003ctd>10秒、CD120秒、灵力40%，仍守骑手高度/防护/载重，不改地面人物速度\u003c/td>\u003ctd>护送受伤母兽后得到独特幼驹线索；蹄下短日轮，不瞬移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP05 食界鲲鹏/PET16\u003c/td>\u003ctd>吞界息：破阵吐息总伤20/0.5/2\u003c/td>\u003ctd>20米H2，1.2秒前摇、CD45秒、灵力35%；对几何盾额外+50%入专用破盾桶，不作用HP\u003c/td>\u003ctd>潮汐倒流仅露一枚石状卵，先维护水系再显真形；鳍内星砂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP06 问道白泽/PET10\u003c/td>\u003ctd>万象识破：给主人一次破防机会\u003c/td>\u003ctd>H5锁定1.2秒，15米、CD45秒、灵力30%；下次本体命中忽略目标50%防御，5秒失效，不共享分身\u003c/td>\u003ctd>救下被误判为机械异常的幼兽，通过声音回应而非杀怪；额目书纹\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>异格能力占15的羁绊协同槽，原A/B/T保留但不另开第三常规主动键。异格五阶：数值效果保持表值，解锁稳定时长/耗能依次为表中耗能×1.2/1.15/1.1/1.05/1，持续时长为表值×0.6/0.7/0.8/0.9/1；一次免死型只改耗能，不增加次数。伤害型按19五阶伤害M，破盾系数不跟M翻倍。MYP06百分比穿透与其他穿透合计仍50%封顶。\u003c/p>\u003ch2>8. 六种逆天机缘\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 机缘\u003c/th>\u003cth>惊喜入口\u003c/th>\u003cth>实际难题\u003c/th>\u003cth>永久获得与边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYF01 太初重铸池\u003c/td>\u003ctd>枯井扫描读数是负温，而非金光宝箱\u003c/td>\u003ctd>恢复三支流、保留退路、承载试验；最低R0八级\u003c/td>\u003ctd>天命核心：H/A/S/D/灵抗×1.6；无激活耗能，但占唯一核心，不与三清倍率叠加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF02 无字天碑\u003c/td>\u003ctd>普通石材拆解前出现与手势同步的影子\u003c/td>\u003ctd>用已学三类动作解碑，失败仅记录，不销毁碑\u003c/td>\u003ctd>任选一部尚未拥有MYC的入门完整传承，不赠圆满；内容生成时锁定候选\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF03 残星问心\u003c/td>\u003ctd>救援信号来自无人设备，回应形成坐标\u003c/td>\u003ctd>修复观测站、完成三段不同取舍任务\u003c/td>\u003ctd>自选已学武技累计熟练额外+50%学习效率，永久但仅一项，不直接×1.5伤害\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF04 逆流一瞬\u003c/td>\u003ctd>崩塌遗迹的碎片逆向漂浮\u003c/td>\u003ctd>在两个安全锚之间保持路径，不能要求未学传送\u003c/td>\u003ctd>获得MYA03残章与普通体质+5%一个槽，残章需修复才学；不真实回滚存档\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF05 众生回响\u003c/td>\u003ctd>多次不求回报的救助留下不同微小标记\u003c/td>\u003ctd>至少3种独立生态事件，系统稀有种子先决定有无，善举不保证出货\u003c/td>\u003ctd>一枚已锁定谱系/异格的MYP蛋或救援契约线索，仍须孵化/建立信任\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF06 星骸授业\u003c/td>\u003ctd>不起眼铁陨内部有节律敲击\u003c/td>\u003ctd>非暴力拆解、隔离辐射、寻找失落炉心\u003c/td>\u003ctd>获得一件封存MYW，修复后可用；材料失败不碎原器，可补普通辅料\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>机缘成功意味着确定兑现已承诺内容，困难放在探索、承载、护送、解谜、稀有材料与真实战斗，\u003cstrong>不在最后再掷一次低概率成功，把几十小时努力清零\u003c/strong>。谜题可从记录推导，关键道具可追回；初次受挫保留线索，仍需补消耗品和解决难题。\u003c/p>\u003ch2>9. 极稀有刷新与难度\u003c/h2>\u003cp>延续11：每个首次完成的合格独立探索调查，极稀有永久机缘概率0.3%。其中固定互斥分支：5%为原护主破限线、2%为本章逆天线、93%为原普通永久机缘。逆天线基础无条件概率为0.003×0.02=0.00006，即\u003cstrong>0.006%，约1/16667次合格调查\u003c/strong>；这只是期望，不保证第16667次出现。不能每帧/每开箱/每256米重试，调度限定每有效游玩小时最多6个合格首次调查。\u003c/p>\u003cp>逆天线在未耗尽合法类别间等权选择（五类都可用时各20%），类内未占用条目等权；选择前按27查世界唯一键，预留时锁定来源、物项和固定候选序列。仅区域暂时无法兑现时保留封存线索，不把已属于别人的原器再许诺给玩家。MYF兑现与直接来源共用奖励唯一键，原器/道统/命格/核心机缘世界唯一，MYA首次学习按角色记录。已有活动线索时新资格保留待揭示；全部唯一池耗尽的明确选择见27。\u003c/p>\u003cp>100个合格调查至少触发一次逆天线概率约0.598%；600个约3.536%。这里算的是\u003cstrong>遇到线索\u003c/strong>，不等于完成高难度挑战并得到成熟神物。无普通保底，不进日常商店/签到；第20的20次研究保底只覆盖常规D5技能，不覆盖MY编号。开发可用显式测试种子验证所有线路，不能将测试种子当正式角色常规掉落。\u003c/p>\u003cp>后天能偶遇，但高阶难题可先封存后回来；“越境打赢”不要求先用尚未得到的神物杀掉守门者。路径至少提供战斗与机关/绕行两种进入方式，最终承载考验必须在当前能力或可取得设备范围内。\u003c/p>\u003ch2>10. 越境可算的例子\u003c/h2>\u003cp>取R0十级普通成长B=2.62，常规体质+40%、功法×1.35、装备×1.4，得到攻击83.19024、防御69.3252、生命831.9024。与R1一级普通精英比较：H1080、A90、D60，均无盾/额外减伤。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态\u003c/th>\u003cth>玩家A/D\u003c/th>\u003cth>玩家普攻每次实际HP伤害\u003c/th>\u003cth>敌人每次普攻对玩家HP伤害\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>未激活\u003c/td>\u003ctd>83.19024 / 69.3252\u003c/td>\u003ctd>66\u003c/td>\u003ctd>32\u003c/td>\u003ctd>玩家需要17次命中，机动失误仍有风险\u003c/td>\u003c/tr>\u003ctr>\u003ctd>三清圆满归一\u003c/td>\u003ctd>266.208768 / 152.51544\u003c/td>\u003ctd>212\u003c/td>\u003ctd>18\u003c/td>\u003ctd>玩家需要6次命中，并有415.9512临时生命层；24秒窗口内有现实胜算\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>目标防御K按其R1为240，玩家K按R0为40；用19公式分别算，不偷偷把玩家也视为R1。这里是裸普攻算例，未计攻击间隔、对方重击、位移与失误；测试应安排有两种可躲招式的同一精英对照，不能把纸面算例称为已实测胜率。\u003c/p>\u003cp>同小级跨一整境的基础差约6倍，三清归一3.2倍攻击本身不保证赢；通过临时生命、防御、武技与战术才可能胜。越境击败不直接解锁R5御空/R6传送/R8真空权限，成长与世界能力仍分别确认。\u003c/p>\u003ch2>11. 资产、存档与验收\u003c/h2>\u003cp>保存legendaryInstanceId、sourceOpportunityId、world/characterId、foundState、repairStages、mastery、activeCoreId、cooldownUntilSimulationTime、cloneGroupId、sharedEnergyLedger、temporaryLifeLayer、debt。分身无库存/掉落，不生成独立经验；所有击杀归本体同一任务事件，实际宠物仍只一只战宠。\u003c/p>\u003cp>新增媒体存入media/versioned文件与清单；本轮概念图是concept，后续Blender源、GLB、动画、五阶演出视频单独登记，保留此前130资产清单，不用新清单覆盖旧盘点。没有独立备份仍如实标注。\u003c/p>\u003cp>首片只验证三清：普通战斗→发现残卷→三类试验→学习双分身→真实夹击→受伤一具→合体只计一具→耗气结束→CD读档保留。补测试：克隆不得再克隆、材料/掉落不复制、临时生命不洗血、换装不重算快照、跨境公式、H5锁定、低帧率碰撞、第一人称镜头和30米回归。随后扩一件遗兵与一种异格；未体验过单核心前不同时开发30项。\u003c/p>"},{"file":"27_CONSUMPTION_AND_UNIQUE_WORLD.md","title":"27 · 消耗后换代、世界唯一与刷新合理性复核","text":"# 27 · 消耗后换代、世界唯一与刷新合理性复核\n\n\u003c!-- illustrated-overview:start -->\n![消耗后换代，原器永不复制](media/diagram-27-v001.svg)\n\n*图解：时间到不是刷新理由；玩家建筑必须真实扣料重建，原器只流转原实例。*\n\u003c!-- illustrated-overview:end -->\n\n\u003c!-- wandering-npc-update -->\n动态人物也属于消耗驱动生态：死亡/永久迁出产生人口空缺，新人有新身份与货单；采集与抢夺使用真实库存转移。旧人唯一物持续流转，不随新人补位重生，具体规则见28。 详见[28地图与游历NPC](28_MAPS_AND_WANDERING_NPCS.md)。\n\n2026-09-12；设计修订，未实装。用户明确：怪物、建筑、物资被实际击败、取得、采收或清理后才进入刷新；下一代应是新的东西，特定逆天物必须唯一。本章覆盖08/09的换代起点与26的“每角色一件”表述，冷却、安全距离和单机优先仍沿用。\n\n## 1. 对旧设计的判断\n\n原有区域生态、代数种子、任务材料可达、视线安全和事务保存值得保留。但“冷却到期”和“对象可替换”没有严格分开；动态陨落及商店定时补货可能挤掉未取资源；尸体过期可能使未领收益消失；每角色唯一无法保证同世界多角色的唯一性。修订后采用**消耗驱动的空缺补充**，不是到点把整个区域清空再随机摆一遍。\n\n不建议所有东西被拿走后马上原点重刷：这样会鼓励守在采集点，也会把建筑和遗迹变成无限宝箱。消耗是必要前提，后面仍要经过冷却、生态、来源、空间、预算检查；没有合法候选就等待。\n\n## 2. 首次布置与后续刷新分开\n\n首次建世界/首次访问未生成区域允许按初始配置创建一代，不要求有人先采不存在的东西。此后同一槽位只有已提交的消耗事件才产生 `vacancyToken`；懒加载、卸载、倒地恢复、模型LOD、读档、天气变化、登录都不是消耗。\n\n补充公式：`可换代 = 有未使用空缺令牌 AND 冷却到期 AND 生态/前置允许 AND 唯一资格允许 AND 有合法位置 AND 未超预算`。一次成功提交消耗一个令牌，只增加一代。令牌来源必须能追溯到旧实例、合法动作及库存/战斗/建设事务。\n\n“被人”包括玩家、战宠协助击杀，以及真实参与且已记录的世界NPC；未来联网包括其他玩家。NPC采走资源必须使物品进入该NPC/运输队的有限库存，不允许为了刷新而凭空写一句“路人拿走了”。宠物打赢只记主人同一击杀，不能主人和宠物各发一个令牌。\n\n## 3. 各类对象怎样腾出名额\n\n|对象|产生空缺的真实事件|不产生空缺的情况|下一代是什么|\n|---|---|---|---|\n|普通怪/精英|击败已持久化，或合法收服并转移种群所有权|受伤、打晕后会恢复、脱战回血、暂时走远、卸载|新的个体/队伍、活动路线和外观，不复活原实例|\n|怪物掉落包|所有物品已入库，或玩家明确放弃指定普通剩余物|背包满、关界面、尸体模型淡出、未捡|清理容器占用；掉落包本身不再产一份奖励|\n|多次采集矿脉|最后一份储量扣除且材料成功入库|敲了一次但有剩余、采集取消、写档失败|同矿带另一个新矿芯/伴生组合，岩体不随机瞬移|\n|草药/果实|该代产量全部采收并提交|成熟未采、采收中断、容器放不下|生态许可的新植株/新收成与新产量，未采植株不变质重抽|\n|普通宝箱/补给点|原清单取尽，或明确放弃剩余普通物资并封箱|只看不拿、拿走一部分、交换相机/装备|有来源的下一批补给或新的可达探索内容|\n|陨落资源|本次可采储量耗尽，或真实清理任务完成|陨石冷却降温、未采超过一小时、玩家离线|下一次有轨迹预告的新陨落；不是旧矿量复原|\n|可重复野外遗址|核心奖励处理完＋一次探索完成＋需清理障碍已清|刚进门、击败守卫但核心未处理、暂时离开|保留历史遗址，可能迁入新住客/任务，不复原唯一宝库|\n|无主临时建筑|被毁且残骸清理完成、地点重新通过地权检查|还完整、里面物资没处理、存在已接受任务|商旅/生态事件带来新营棚等，必须有建造过程|\n|玩家/宗门建筑|玩家建设订单或有授权NPC的重建订单|时间到、离线、模型卸载、遭攻击但未毁|材料驱动的同址修复/新建筑，绝不从普通随机池自动替换|\n|固定NPC/主线建筑|仅剧情迁移、救援和明确重建事务|普通冷却/其他资源被拿走|同一身份/任务继续，不能刷一个替代品销毁历史|\n|商店货架|一份售出/授权调拨记录形成相应库存空缺|货还在架上、玩家卖给商人、仅过了补货时间|运输/生产到货填缺额；旧货保留，不刷新整页洗品质|\n|唯一逆天物|不产生同类再生资格|交易、丢弃、损坏、拆成残片、主人死亡/删角色|原物继续流转或永久退役，同唯一键绝不再生|\n\n怪物与其掉落包是两个生命周期：怪物被击败已腾出生物名额，不强迫玩家捡完每个低价材料才能恢复整个生态；旧掉落继续存在且不重算。新怪不能叠在旧尸体上，先等尸体完成演出，在另一个合法候选进入。每个锚点最多3个未结算普通战利品容器，达到上限仅暂停该锚点补怪，并给回收/明确放弃提示，不自动删掉落或全图停刷。\n\n尸体模型可淡出；未领物品转为地图上的遗留物标记并保留清单，不再用15分钟过期删除未领取物。唯一、任务物与已预留机缘永不自动放弃。普通物可由玩家明确放弃，提交后永久注销该清单，不将其标记成“已经入包”。\n\n## 4. 刷新后是不同的新东西\n\n每个 `anchorId+generation` 生成新实例ID；上一代物品进入玩家库存后仍有原来源，不回到锚点。新一代的 `compositionFingerprint` 包含物种/材料家族、群体数量、生成布局、行动路线、外观变体；不把ID/生成时间变化冒充内容变化。\n\n先在该生境的合法候选组合中排除上一代同指纹，再按原生态权重抽取一次并保存。候选至少两个才允许普通轮换；若规则或场地临时只剩上一种组合，显示 `noDistinctCandidate` 等待，不偷偷复制，也不不断重抽品质。Z0只做一种掠兽的样板，可以通过不同群体数量/路径/外观形成两套真实组合，无需假称已有第二种怪物模型。\n\n轮换不等于“铁矿下一次必定变神剑”。草药仍在合法药区，普通矿仍在相应矿带，怪物不会随玩家升级；同种生物和同类材料允许再次出现，但本代组合不原样重复。品质、内丹率仍使用原掉落表，**品质不是强制不重复字段**，避免通过排除普通品逐轮逼出极品。\n\n|场景|原一代|合理的新一代|不合理的变化|\n|---|---|---|---|\n|新手兽巢|两只掠兽，东侧巡游|三只新个体，北侧进场与不同巡线|把原死怪恢复满血再发一遍旧掉落|\n|水林药区|3株基础草，靠浅滩|保留必要草药家族的4株新苗，支流边生长|普通突破材料被随机换成全是高阶不可采植物|\n|陨铁矿带|矿芯A以铁陨为主，少量石料|矿芯B仍供基础铁陨，伴生组合变化|整个有碰撞的山体突然消失或移到玩家脚下|\n|遗址营棚|旧补给营被清理|商旅建成新营棚、带来新普通清单|玩家洞府家具被随机改成怪物巢|\n\n每个阶段必需材料的保底供给按“材料家族最低产量＋替代来源”检查，不能因追求不重复让基础炼丹断供；补货仍需要真实空缺和来源，保底不是凭空给背包加物资。\n\n## 5. 哪些逆天东西真正唯一\n\n新增独立于角色的 `WorldUniqueLedger`，保存在整个世界根存档。键为 `(worldId,uniqueDefinitionId)`；一个世界内所有角色共用，切角色不能获得第二份。不同独立单机世界是不同故事，可以各有一份，不宣称全体单机玩家共用全球唯一。未来共享服务器以 `(economyShardId,uniqueDefinitionId)` 约束，跨服迁移必须转移原账，不能双方各复制一份。\n\n|内容|唯一范围|获得后能否再次刷新|\n|---|---|---|\n|MYW01—06六件原器|每世界每原器一件，残片也归同原器|永不；找回/重铸只能恢复原实例|\n|MYC01—06原始传承|每世界每部一份“道统资格”；每角色学习记录单独保存|原资格不刷新；明确师承玩法未设计前不允许复印/教给无数角色|\n|MYP01—06异格命格|每世界每命格一个载体|宠物可更换主人，不能复制命格；普通33物种不受此唯一限制|\n|MYF01—06核心机缘|每世界每个核心事件一次|遗址可再被探索，核心奖励资格永不重置|\n|MYA01—06禁传武技|每角色每式首次学习一次，传本可由不同合法事件流转|允许未来世界中其他角色获得独立传本；不是所有稀有物都世界唯一|\n|普通Q6武器/高血脉普通宠|稀有但不唯一|按既定合法来源产出，不以颜色误称唯一|\n\n界面区分“世界唯一原器”“本角色首次”“极稀有可重复”；不显示未发现唯一物的精确位置/主人，避免剧透。普通高血脉青龙不是世界只有一只青龙。\n\nMYF02无字天碑选择MYC、MYF05产生MYP、MYF06产生MYW时，必须同时占用机缘键和对应奖励唯一键。直接掉落、NPC转交、机缘、修复、迁移全部调用同一账本，不能每条来源各有一个“首次”就分别发原器。\n\n## 6. 唯一物从生成前就占位\n\n`unissued → reserved → manifested → claimed → transferred/recoverable/retired`。\n\n- 在提示线索/出现物体前原子预留；背包满或暂时不做挑战仍占位，不等玩家拿到后才查重。\n- reservation绑定来源事件与奖励实例。重复请求返回原预留，不能产生第二个ID。\n- manifested之后绝不因超时释放；玩家交易/丢在地上/存飞船都只改持有位置。学习传承后变为已吸收资格，原键永久已使用。\n- 原器损坏/拆成残片时保留rootArtifactId。找回、拼合、重铸消耗这些原片并恢复同一物品，不发第二把。明确彻底销毁才进入retired，仍不能再刷新。\n- 删除角色不能删世界唯一账；删角色时先预览处置，原器留在该世界遗留物/继承保管处，或者玩家明确永久退役。宠物进入托管，不悄悄回池生第二只。\n- 仅“事务从未提交、线索未显示”的技术性预留可回滚；已显示的机缘属于世界历史，不靠关游戏释放。\n\n候选选择前先排除已占唯一键，再固定本次候选序列和稀有门结果；提交时用版本检查锁唯一键。未来两玩家同帧撞同资格，只有一个提交成功；另一个按预存候选序列检查其余未占用内容，不重掷稀有概率。如果全部占用，保留资格并明确记录 `uniquePoolExhausted`，提供玩家确认的尚未学MYA传承或现有原器的一次专属修复研究；没有可用选项就暂停此类新尝试并显示已探尽，不让玩家无限等一个不会复位的原器。不暗改成普通石头，不再次提高原稀有门成功率。\n\n唯一原器没有“刷完所有后重新开一轮”。未来若要赛季重置，必须是独立新世界/新经济域，不能在旧世界同账里复位。\n\n## 7. 概率、离线与经济联动\n\n原普通洞府8%与普通线索第7次保底保留；永久机缘0.3%及其5%护主破限/2%逆天/93%其余分支不变。它们只在首次合格调查发生，不在每次采草/刷怪新一代时重掷；物资轮换不生成无限新的 `discoveryOpportunityId`。同遗迹的普通住客换了，不等于重新拥有唯一核心首次调查。\n\n新增内容首次资格与补充空缺分别记账：一次新探索可以揭示尚未布置的机缘，已经在该机缘槽里的内容则不能被后来的事件挤掉。场上未采陨石、未完成机缘仍占事件名额，天气散去只收起提示，不清奖励数据。\n\n离线仍最多给已消耗普通槽位30分钟冷却抵扣、最多一代；**没消耗就抵扣0**。离线不代替NPC采集、不清掉落、不拆建筑、不释放唯一预留。商店仅对已售形成的缺额获得一次补货资格，旧品不变；回购商品单独库存，不因补货抹掉刚卖的东西。\n\n不把整个区域绑成一个条件：矿还有剩余只影响该矿芯；一个掉落包未拿不会让全部森林停止生长。按锚点和对象家族局部限额，有助于保留探索自由，也控制存档增长。\n\n## 8. 配置、存档与复核清单\n\n配置新增consumePolicy、replacementPolicy、distinctFingerprintFields、uniqueScope、uniqueDefinitionId、minSupplyFamilies。实例新增consumptionTxnId、vacancyTokenId、generation、previousFingerprint、reservationRevision、rootArtifactId；世界保存usedVacancyTokens、uniqueLedger与未结算物资容器。\n\n冷却从消耗事务提交时起算；成功入库与储量扣除不能分开。生成计划持久化必须同次写“令牌已用＋新代实例＋唯一预留”；存储失败保持旧态，不显示可攻击的新怪。版本迁移先备份，对已有唯一重复冲突暂停相关发放并列清单，不静默删玩家拥有的物品。\n\n|验收ID|场景|应有结果|\n|---|---|---|\n|RF01|未采草等两小时|仍是同代同品质，空缺为0|\n|RF02|矿只采一半后离线|保留原剩余量，不换代|\n|RF03|满包导致采收提交失败|不扣储量、不开始再生|\n|RF04|采尽且事务成功|恰好一个空缺令牌，冷却开始|\n|RF05|同一采收请求重发|返回原结果，不多给令牌或材料|\n|RF06|令牌已有、时间已到但视线不安全|等待，不强行出现|\n|RF07|一次合法新代提交|新ID、不同组合、只消费一个令牌|\n|RF08|只有上一种合法组合|noDistinctCandidate，不重抽品质|\n|RF09|怪物击败但未捡掉落|死亡空缺与原掉落分别保留，原掉落不重算|\n|RF10|尸体演出结束|遗留物标记继续存在，非奖励过期|\n|RF11|原器被捡后卖出/丢弃|世界仍只有原实例，唯一账不复位|\n|RF12|原器拆成残片再重铸|恢复相同rootArtifactId，不能一片拼两把|\n|RF13|MYF06与直接遗兵来源并发|只能提交一份对应MYW|\n|RF14|换角色或删除原主人|世界唯一资格仍占用，走托管/退役|\n|RF15|一只异格宠释放再收服|还是同实例同命格，不刷新第二只|\n|RF16|建筑完整但计时到|不替换；损毁后须清理与真实重建|\n|RF17|补货时间到但库存未售|不增加、不洗旧货品质|\n|RF18|区域换代后重复调查遗迹|不重抽逆天门、不重领核心|\n|RF19|离线96小时且无消耗|不发令牌、不堆多代、不动唯一账|\n|RF20|迁移发现两把同唯一键原器|报告冲突、停止相关发放，保留备份与实物待处理|\n\n以上为待实现验收合同。本轮只完成规则复核、文档同步和图文检查，不宣称这些情况已经在运行游戏中修好。\n","html":"\u003ch1>27 · 消耗后换代、世界唯一与刷新合理性复核\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-27-v001.svg\" alt=\"消耗后换代，原器永不复制\">\u003c/p>\u003cp>\u003cem>图解：时间到不是刷新理由；玩家建筑必须真实扣料重建，原器只流转原实例。\u003c/em>\u003c/p>\u003cp>&lt;!-- wandering-npc-update --&gt;\u003c/p>\u003cp>动态人物也属于消耗驱动生态：死亡/永久迁出产生人口空缺，新人有新身份与货单；采集与抢夺使用真实库存转移。旧人唯一物持续流转，不随新人补位重生，具体规则见28。 详见\u003ca href=\"#28_MAPS_AND_WANDERING_NPCS.md\">28地图与游历NPC\u003c/a>。\u003c/p>\u003cp>2026-09-12；设计修订，未实装。用户明确：怪物、建筑、物资被实际击败、取得、采收或清理后才进入刷新；下一代应是新的东西，特定逆天物必须唯一。本章覆盖08/09的换代起点与26的“每角色一件”表述，冷却、安全距离和单机优先仍沿用。\u003c/p>\u003ch2>1. 对旧设计的判断\u003c/h2>\u003cp>原有区域生态、代数种子、任务材料可达、视线安全和事务保存值得保留。但“冷却到期”和“对象可替换”没有严格分开；动态陨落及商店定时补货可能挤掉未取资源；尸体过期可能使未领收益消失；每角色唯一无法保证同世界多角色的唯一性。修订后采用\u003cstrong>消耗驱动的空缺补充\u003c/strong>，不是到点把整个区域清空再随机摆一遍。\u003c/p>\u003cp>不建议所有东西被拿走后马上原点重刷：这样会鼓励守在采集点，也会把建筑和遗迹变成无限宝箱。消耗是必要前提，后面仍要经过冷却、生态、来源、空间、预算检查；没有合法候选就等待。\u003c/p>\u003ch2>2. 首次布置与后续刷新分开\u003c/h2>\u003cp>首次建世界/首次访问未生成区域允许按初始配置创建一代，不要求有人先采不存在的东西。此后同一槽位只有已提交的消耗事件才产生 \u003ccode>vacancyToken\u003c/code>；懒加载、卸载、倒地恢复、模型LOD、读档、天气变化、登录都不是消耗。\u003c/p>\u003cp>补充公式：\u003ccode>可换代 = 有未使用空缺令牌 AND 冷却到期 AND 生态/前置允许 AND 唯一资格允许 AND 有合法位置 AND 未超预算\u003c/code>。一次成功提交消耗一个令牌，只增加一代。令牌来源必须能追溯到旧实例、合法动作及库存/战斗/建设事务。\u003c/p>\u003cp>“被人”包括玩家、战宠协助击杀，以及真实参与且已记录的世界NPC；未来联网包括其他玩家。NPC采走资源必须使物品进入该NPC/运输队的有限库存，不允许为了刷新而凭空写一句“路人拿走了”。宠物打赢只记主人同一击杀，不能主人和宠物各发一个令牌。\u003c/p>\u003ch2>3. 各类对象怎样腾出名额\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>产生空缺的真实事件\u003c/th>\u003cth>不产生空缺的情况\u003c/th>\u003cth>下一代是什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>普通怪/精英\u003c/td>\u003ctd>击败已持久化，或合法收服并转移种群所有权\u003c/td>\u003ctd>受伤、打晕后会恢复、脱战回血、暂时走远、卸载\u003c/td>\u003ctd>新的个体/队伍、活动路线和外观，不复活原实例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>怪物掉落包\u003c/td>\u003ctd>所有物品已入库，或玩家明确放弃指定普通剩余物\u003c/td>\u003ctd>背包满、关界面、尸体模型淡出、未捡\u003c/td>\u003ctd>清理容器占用；掉落包本身不再产一份奖励\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多次采集矿脉\u003c/td>\u003ctd>最后一份储量扣除且材料成功入库\u003c/td>\u003ctd>敲了一次但有剩余、采集取消、写档失败\u003c/td>\u003ctd>同矿带另一个新矿芯/伴生组合，岩体不随机瞬移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>草药/果实\u003c/td>\u003ctd>该代产量全部采收并提交\u003c/td>\u003ctd>成熟未采、采收中断、容器放不下\u003c/td>\u003ctd>生态许可的新植株/新收成与新产量，未采植株不变质重抽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>普通宝箱/补给点\u003c/td>\u003ctd>原清单取尽，或明确放弃剩余普通物资并封箱\u003c/td>\u003ctd>只看不拿、拿走一部分、交换相机/装备\u003c/td>\u003ctd>有来源的下一批补给或新的可达探索内容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>陨落资源\u003c/td>\u003ctd>本次可采储量耗尽，或真实清理任务完成\u003c/td>\u003ctd>陨石冷却降温、未采超过一小时、玩家离线\u003c/td>\u003ctd>下一次有轨迹预告的新陨落；不是旧矿量复原\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可重复野外遗址\u003c/td>\u003ctd>核心奖励处理完＋一次探索完成＋需清理障碍已清\u003c/td>\u003ctd>刚进门、击败守卫但核心未处理、暂时离开\u003c/td>\u003ctd>保留历史遗址，可能迁入新住客/任务，不复原唯一宝库\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无主临时建筑\u003c/td>\u003ctd>被毁且残骸清理完成、地点重新通过地权检查\u003c/td>\u003ctd>还完整、里面物资没处理、存在已接受任务\u003c/td>\u003ctd>商旅/生态事件带来新营棚等，必须有建造过程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>玩家/宗门建筑\u003c/td>\u003ctd>玩家建设订单或有授权NPC的重建订单\u003c/td>\u003ctd>时间到、离线、模型卸载、遭攻击但未毁\u003c/td>\u003ctd>材料驱动的同址修复/新建筑，绝不从普通随机池自动替换\u003c/td>\u003c/tr>\u003ctr>\u003ctd>固定NPC/主线建筑\u003c/td>\u003ctd>仅剧情迁移、救援和明确重建事务\u003c/td>\u003ctd>普通冷却/其他资源被拿走\u003c/td>\u003ctd>同一身份/任务继续，不能刷一个替代品销毁历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>商店货架\u003c/td>\u003ctd>一份售出/授权调拨记录形成相应库存空缺\u003c/td>\u003ctd>货还在架上、玩家卖给商人、仅过了补货时间\u003c/td>\u003ctd>运输/生产到货填缺额；旧货保留，不刷新整页洗品质\u003c/td>\u003c/tr>\u003ctr>\u003ctd>唯一逆天物\u003c/td>\u003ctd>不产生同类再生资格\u003c/td>\u003ctd>交易、丢弃、损坏、拆成残片、主人死亡/删角色\u003c/td>\u003ctd>原物继续流转或永久退役，同唯一键绝不再生\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>怪物与其掉落包是两个生命周期：怪物被击败已腾出生物名额，不强迫玩家捡完每个低价材料才能恢复整个生态；旧掉落继续存在且不重算。新怪不能叠在旧尸体上，先等尸体完成演出，在另一个合法候选进入。每个锚点最多3个未结算普通战利品容器，达到上限仅暂停该锚点补怪，并给回收/明确放弃提示，不自动删掉落或全图停刷。\u003c/p>\u003cp>尸体模型可淡出；未领物品转为地图上的遗留物标记并保留清单，不再用15分钟过期删除未领取物。唯一、任务物与已预留机缘永不自动放弃。普通物可由玩家明确放弃，提交后永久注销该清单，不将其标记成“已经入包”。\u003c/p>\u003ch2>4. 刷新后是不同的新东西\u003c/h2>\u003cp>每个 \u003ccode>anchorId+generation\u003c/code> 生成新实例ID；上一代物品进入玩家库存后仍有原来源，不回到锚点。新一代的 \u003ccode>compositionFingerprint\u003c/code> 包含物种/材料家族、群体数量、生成布局、行动路线、外观变体；不把ID/生成时间变化冒充内容变化。\u003c/p>\u003cp>先在该生境的合法候选组合中排除上一代同指纹，再按原生态权重抽取一次并保存。候选至少两个才允许普通轮换；若规则或场地临时只剩上一种组合，显示 \u003ccode>noDistinctCandidate\u003c/code> 等待，不偷偷复制，也不不断重抽品质。Z0只做一种掠兽的样板，可以通过不同群体数量/路径/外观形成两套真实组合，无需假称已有第二种怪物模型。\u003c/p>\u003cp>轮换不等于“铁矿下一次必定变神剑”。草药仍在合法药区，普通矿仍在相应矿带，怪物不会随玩家升级；同种生物和同类材料允许再次出现，但本代组合不原样重复。品质、内丹率仍使用原掉落表，\u003cstrong>品质不是强制不重复字段\u003c/strong>，避免通过排除普通品逐轮逼出极品。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>原一代\u003c/th>\u003cth>合理的新一代\u003c/th>\u003cth>不合理的变化\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>新手兽巢\u003c/td>\u003ctd>两只掠兽，东侧巡游\u003c/td>\u003ctd>三只新个体，北侧进场与不同巡线\u003c/td>\u003ctd>把原死怪恢复满血再发一遍旧掉落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>水林药区\u003c/td>\u003ctd>3株基础草，靠浅滩\u003c/td>\u003ctd>保留必要草药家族的4株新苗，支流边生长\u003c/td>\u003ctd>普通突破材料被随机换成全是高阶不可采植物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>陨铁矿带\u003c/td>\u003ctd>矿芯A以铁陨为主，少量石料\u003c/td>\u003ctd>矿芯B仍供基础铁陨，伴生组合变化\u003c/td>\u003ctd>整个有碰撞的山体突然消失或移到玩家脚下\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遗址营棚\u003c/td>\u003ctd>旧补给营被清理\u003c/td>\u003ctd>商旅建成新营棚、带来新普通清单\u003c/td>\u003ctd>玩家洞府家具被随机改成怪物巢\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每个阶段必需材料的保底供给按“材料家族最低产量＋替代来源”检查，不能因追求不重复让基础炼丹断供；补货仍需要真实空缺和来源，保底不是凭空给背包加物资。\u003c/p>\u003ch2>5. 哪些逆天东西真正唯一\u003c/h2>\u003cp>新增独立于角色的 \u003ccode>WorldUniqueLedger\u003c/code>，保存在整个世界根存档。键为 \u003ccode>(worldId,uniqueDefinitionId)\u003c/code>；一个世界内所有角色共用，切角色不能获得第二份。不同独立单机世界是不同故事，可以各有一份，不宣称全体单机玩家共用全球唯一。未来共享服务器以 \u003ccode>(economyShardId,uniqueDefinitionId)\u003c/code> 约束，跨服迁移必须转移原账，不能双方各复制一份。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>内容\u003c/th>\u003cth>唯一范围\u003c/th>\u003cth>获得后能否再次刷新\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MYW01—06六件原器\u003c/td>\u003ctd>每世界每原器一件，残片也归同原器\u003c/td>\u003ctd>永不；找回/重铸只能恢复原实例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYC01—06原始传承\u003c/td>\u003ctd>每世界每部一份“道统资格”；每角色学习记录单独保存\u003c/td>\u003ctd>原资格不刷新；明确师承玩法未设计前不允许复印/教给无数角色\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYP01—06异格命格\u003c/td>\u003ctd>每世界每命格一个载体\u003c/td>\u003ctd>宠物可更换主人，不能复制命格；普通33物种不受此唯一限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYF01—06核心机缘\u003c/td>\u003ctd>每世界每个核心事件一次\u003c/td>\u003ctd>遗址可再被探索，核心奖励资格永不重置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MYA01—06禁传武技\u003c/td>\u003ctd>每角色每式首次学习一次，传本可由不同合法事件流转\u003c/td>\u003ctd>允许未来世界中其他角色获得独立传本；不是所有稀有物都世界唯一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>普通Q6武器/高血脉普通宠\u003c/td>\u003ctd>稀有但不唯一\u003c/td>\u003ctd>按既定合法来源产出，不以颜色误称唯一\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>界面区分“世界唯一原器”“本角色首次”“极稀有可重复”；不显示未发现唯一物的精确位置/主人，避免剧透。普通高血脉青龙不是世界只有一只青龙。\u003c/p>\u003cp>MYF02无字天碑选择MYC、MYF05产生MYP、MYF06产生MYW时，必须同时占用机缘键和对应奖励唯一键。直接掉落、NPC转交、机缘、修复、迁移全部调用同一账本，不能每条来源各有一个“首次”就分别发原器。\u003c/p>\u003ch2>6. 唯一物从生成前就占位\u003c/h2>\u003cp>\u003ccode>unissued → reserved → manifested → claimed → transferred/recoverable/retired\u003c/code>。\u003c/p>\u003cul>\u003cli>在提示线索/出现物体前原子预留；背包满或暂时不做挑战仍占位，不等玩家拿到后才查重。\u003c/li>\u003cli>reservation绑定来源事件与奖励实例。重复请求返回原预留，不能产生第二个ID。\u003c/li>\u003cli>manifested之后绝不因超时释放；玩家交易/丢在地上/存飞船都只改持有位置。学习传承后变为已吸收资格，原键永久已使用。\u003c/li>\u003cli>原器损坏/拆成残片时保留rootArtifactId。找回、拼合、重铸消耗这些原片并恢复同一物品，不发第二把。明确彻底销毁才进入retired，仍不能再刷新。\u003c/li>\u003cli>删除角色不能删世界唯一账；删角色时先预览处置，原器留在该世界遗留物/继承保管处，或者玩家明确永久退役。宠物进入托管，不悄悄回池生第二只。\u003c/li>\u003cli>仅“事务从未提交、线索未显示”的技术性预留可回滚；已显示的机缘属于世界历史，不靠关游戏释放。\u003c/li>\u003c/ul>\u003cp>候选选择前先排除已占唯一键，再固定本次候选序列和稀有门结果；提交时用版本检查锁唯一键。未来两玩家同帧撞同资格，只有一个提交成功；另一个按预存候选序列检查其余未占用内容，不重掷稀有概率。如果全部占用，保留资格并明确记录 \u003ccode>uniquePoolExhausted\u003c/code>，提供玩家确认的尚未学MYA传承或现有原器的一次专属修复研究；没有可用选项就暂停此类新尝试并显示已探尽，不让玩家无限等一个不会复位的原器。不暗改成普通石头，不再次提高原稀有门成功率。\u003c/p>\u003cp>唯一原器没有“刷完所有后重新开一轮”。未来若要赛季重置，必须是独立新世界/新经济域，不能在旧世界同账里复位。\u003c/p>\u003ch2>7. 概率、离线与经济联动\u003c/h2>\u003cp>原普通洞府8%与普通线索第7次保底保留；永久机缘0.3%及其5%护主破限/2%逆天/93%其余分支不变。它们只在首次合格调查发生，不在每次采草/刷怪新一代时重掷；物资轮换不生成无限新的 \u003ccode>discoveryOpportunityId\u003c/code>。同遗迹的普通住客换了，不等于重新拥有唯一核心首次调查。\u003c/p>\u003cp>新增内容首次资格与补充空缺分别记账：一次新探索可以揭示尚未布置的机缘，已经在该机缘槽里的内容则不能被后来的事件挤掉。场上未采陨石、未完成机缘仍占事件名额，天气散去只收起提示，不清奖励数据。\u003c/p>\u003cp>离线仍最多给已消耗普通槽位30分钟冷却抵扣、最多一代；\u003cstrong>没消耗就抵扣0\u003c/strong>。离线不代替NPC采集、不清掉落、不拆建筑、不释放唯一预留。商店仅对已售形成的缺额获得一次补货资格，旧品不变；回购商品单独库存，不因补货抹掉刚卖的东西。\u003c/p>\u003cp>不把整个区域绑成一个条件：矿还有剩余只影响该矿芯；一个掉落包未拿不会让全部森林停止生长。按锚点和对象家族局部限额，有助于保留探索自由，也控制存档增长。\u003c/p>\u003ch2>8. 配置、存档与复核清单\u003c/h2>\u003cp>配置新增consumePolicy、replacementPolicy、distinctFingerprintFields、uniqueScope、uniqueDefinitionId、minSupplyFamilies。实例新增consumptionTxnId、vacancyTokenId、generation、previousFingerprint、reservationRevision、rootArtifactId；世界保存usedVacancyTokens、uniqueLedger与未结算物资容器。\u003c/p>\u003cp>冷却从消耗事务提交时起算；成功入库与储量扣除不能分开。生成计划持久化必须同次写“令牌已用＋新代实例＋唯一预留”；存储失败保持旧态，不显示可攻击的新怪。版本迁移先备份，对已有唯一重复冲突暂停相关发放并列清单，不静默删玩家拥有的物品。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>验收ID\u003c/th>\u003cth>场景\u003c/th>\u003cth>应有结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RF01\u003c/td>\u003ctd>未采草等两小时\u003c/td>\u003ctd>仍是同代同品质，空缺为0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF02\u003c/td>\u003ctd>矿只采一半后离线\u003c/td>\u003ctd>保留原剩余量，不换代\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF03\u003c/td>\u003ctd>满包导致采收提交失败\u003c/td>\u003ctd>不扣储量、不开始再生\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF04\u003c/td>\u003ctd>采尽且事务成功\u003c/td>\u003ctd>恰好一个空缺令牌，冷却开始\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF05\u003c/td>\u003ctd>同一采收请求重发\u003c/td>\u003ctd>返回原结果，不多给令牌或材料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF06\u003c/td>\u003ctd>令牌已有、时间已到但视线不安全\u003c/td>\u003ctd>等待，不强行出现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF07\u003c/td>\u003ctd>一次合法新代提交\u003c/td>\u003ctd>新ID、不同组合、只消费一个令牌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF08\u003c/td>\u003ctd>只有上一种合法组合\u003c/td>\u003ctd>noDistinctCandidate，不重抽品质\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF09\u003c/td>\u003ctd>怪物击败但未捡掉落\u003c/td>\u003ctd>死亡空缺与原掉落分别保留，原掉落不重算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF10\u003c/td>\u003ctd>尸体演出结束\u003c/td>\u003ctd>遗留物标记继续存在，非奖励过期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF11\u003c/td>\u003ctd>原器被捡后卖出/丢弃\u003c/td>\u003ctd>世界仍只有原实例，唯一账不复位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF12\u003c/td>\u003ctd>原器拆成残片再重铸\u003c/td>\u003ctd>恢复相同rootArtifactId，不能一片拼两把\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF13\u003c/td>\u003ctd>MYF06与直接遗兵来源并发\u003c/td>\u003ctd>只能提交一份对应MYW\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF14\u003c/td>\u003ctd>换角色或删除原主人\u003c/td>\u003ctd>世界唯一资格仍占用，走托管/退役\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF15\u003c/td>\u003ctd>一只异格宠释放再收服\u003c/td>\u003ctd>还是同实例同命格，不刷新第二只\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF16\u003c/td>\u003ctd>建筑完整但计时到\u003c/td>\u003ctd>不替换；损毁后须清理与真实重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF17\u003c/td>\u003ctd>补货时间到但库存未售\u003c/td>\u003ctd>不增加、不洗旧货品质\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF18\u003c/td>\u003ctd>区域换代后重复调查遗迹\u003c/td>\u003ctd>不重抽逆天门、不重领核心\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF19\u003c/td>\u003ctd>离线96小时且无消耗\u003c/td>\u003ctd>不发令牌、不堆多代、不动唯一账\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RF20\u003c/td>\u003ctd>迁移发现两把同唯一键原器\u003c/td>\u003ctd>报告冲突、停止相关发放，保留备份与实物待处理\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>以上为待实现验收合同。本轮只完成规则复核、文档同步和图文检查，不宣称这些情况已经在运行游戏中修好。\u003c/p>"},{"file":"28_MAPS_AND_WANDERING_NPCS.md","title":"28 · 开荒地图、游历人物与夺宝追赃","text":"# 28 · 开荒地图、游历人物与夺宝追赃\n\n\u003c!-- illustrated-overview:start -->\n![地图引路，人物争缘](media/diagram-28-v001.svg)\n\n*图解：坏人不会自带标签；新人物不能复制旧人的宝物与机缘。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；设计稿，尚未实装。配套[世界刷新](27_CONSUMPTION_AND_UNIQUE_WORLD.md)、[洞府](11_CAVES_AND_FORTUNES.md)、[唯一传承](26_HEAVEN_DEFYING_LEGACIES.md)。新增动态游历人物体系，独立于固定服务/剧情名册（第29增补后68名）；他们有真实身份、库存、经验、目标和死亡记录。\n\n## 1. 有的险地要先拿到地图\n\n普通地表仍能自由探索；“有地图才可开荒”主要用于迷雾地带、地下迷宫、不断变化的阵门和空间航路。地图提供实在的定位、通行序列或安全窗口，不是在普通山坡放一堵“未买地图不能走”的空气墙。\n\n|地图ID|种类|能解决的实际障碍|获得渠道|入门价格/边界|\n|---|---|---|---|---|\n|MAP01 荒野行路图|区域地形|道路、水源、已知避难点|N04购买、游历者交换、自行测绘|40碎灵石；不透露未发现宝物|\n|MAP02 瘴林水脉图|危险地表|雾中可验证地标、净气点与退路|N09购买、救助采药人|120碎灵石；防毒装备仍必需|\n|MAP03 地宫层图|地下结构|竖井、连通层、闸门次序|普通洞府残图、勘图师交易|当阶基础价150×5^r；不自动杀守卫|\n|MAP04 镜阵行仪图|阵法解法|真实阵眼顺序，缺图可先外围研究|N12鉴定、机缘拼图、阵师委托|研究服务100×5^r；不保证商店常有成图|\n|MAP05 陨带航路图|飞行/矿带|碎石运动周期、安全落点|N14/游商购买、实际航测|200×5^r；不授予高度/真空权限|\n|MAP06 星门坐标图|跨星|已发现星门的授权坐标与返程锚|N15首次返程教学、N38远征|首条任务保障，其余300×5^r；R6认证独立|\n|MAP07 古藏残图|隐秘机缘|几块残图与现地特征合成入口线索|独立机缘、NPC真库存、战利品|无固定售价，鉴定后议价；不等于必出逆天物|\n|MAP08 虚海星图|星空|移动天体参考系、补气站和危险带|R8星港购买、星空遗迹研究|500×5^r；过期轨迹需重测|\n\nr是地图覆盖区的材料/危险阶，不随买家当前境界临时涨价。普通地图可复制交易，但每份复制需纸/存储晶与测绘服务，售价受原图真实性和已知范围约束；唯一机缘的通行资格不是可无限复制的地图图像。\n\n地图有四个独立字段：范围完整度0—100%、可信度（未知/交叉核实/实测）、记录版本/时间、可用入口。普通地图阅读后地形知识永久进入日志，地图原件丢失不失忆；一次性阵门印记、未解析残图和入场钥匙仍是实体物品，可以被抢。\n\n古藏残图共享opportunityId与世界唯一预留：不同残片拼的是同一地点，复印不会多生成一座宝库。若有人先取走核心，地图更新为“遗迹已被探索/可能有后续住客”，玩家可发现遗留线索或追查原物，不重发原器。普通传闻不预留神物，只有实际选中并提交的唯一奖励才占唯一账。\n\n地图并非永久准确：地形通常稳定，动态怪群只标“曾有巢穴”，不显示每秒实时位置；崩塌与阵门变化留下版本差异。坏人可卖真地形、假安全路线，玩家能用地标、痕迹、价格、消息来源交叉核验。必要主线的基础路线至少有一个可靠NPC/自行测绘入口，不能被一张假图永久卡住。\n\n## 2. 十二种动态游历人物\n\n名字从姓名/称号/出身组合生成，展示名字不是数据库主键。RN是行为模板，实际人物用travelerInstanceId；姓名、外貌、声音、衣装、惯用武器与关系记录共同识别。下列权重为区域允许模板中的初始权重，全部允许时总和100；不是实际“好人/坏人百分比”，不向玩家展示。\n\n|模板ID|常见身份/示例名（不是固定角色）|权重|行动与引导作用|潜在冲突|\n|---|---|---|---|---|\n|RN01|采药客·孟秋实|20|找药、观察毒区、请求驱兽，可出售自采药和地形笔记|可能藏起稀有药，不自动分享所有发现|\n|RN02|寻矿人·石临川|10|搬矿、修工具、雇人守采点，教辨矿痕|矿权争执，可能先占新矿芯|\n|RN03|猎妖人·燕逐风|10|追踪怪物、设置可见陷阱、真实剥取材料|抢猎物或因伤撤退，会被强兽杀死|\n|RN04|勘图师·顾望山|8|测绘岔路、出售地图与校验服务|地图可能过时，信誉不等于永久准确|\n|RN05|行脚商·陶万里|8|带货、收购、往返商站和临时营地|负重慢，可能求护送或被劫|\n|RN06|负伤修士·柳照尘|8|求药、指明危险或遗失宝物地点|有真伤者，也有装伤诱饵，治疗不能自动揭示善恶|\n|RN07|结伴散修·季长松|8|邀请短途结伴，共斗、分账、讲见闻|可能临阵逃走；分配条款提前说明|\n|RN08|引路客·莫归舟|8|熟悉险路，能带玩家找入口|可能把人带进埋伏，沿路存在异常痕迹|\n|RN09|劫修·陆断潮|6|观察货物与战力、跟踪、要求交货或偷袭|明确转敌后可斩杀；不会凭空知道戒内全部财产|\n|RN10|灰市掮客·钱无咎|8|收赃、搬货、转卖地图、传递买家消息|可能销赃或提供赎回线索，可截断其运输路线|\n|RN11|争缘修士·谢问衡|4|竞争遗迹入口、破解阵法、争抢未归属奖励|可能谈分成，也可能撕毁约定，关系按行为变化|\n|RN12|负缘隐修·沈藏星|2|携带某段已有传承历史，追求修复/还愿|可能持稀有物，但绝不因抽到此模板自动获得逆天原器|\n\n隐藏行为倾向在出生时固定并持久化：守约、逐利、胆怯、掠夺、重情。外观、姓氏和头顶颜色不直接泄露；贪财不必杀人，结伴者也可能在巨大利益下背约。背叛触发还需真实动机、已知目标价值和可行逃路，不在打开对话时临时抽一次坏人骰。\n\n## 3. 他们真的在世界里做事\n\n状态：进区→观察→选择任务→移动→采集/战斗/交易/寻缘→处理伤势与负重→返营/继续探索。行动目标来自区域可用资源和已获得情报，不能按玩家缺什么自动扮演发奖员。\n\nNPC采集会扣掉同一个资源节点，材料进入其背包并产生27的空缺令牌；玩家先采则NPC转向别处。NPC和怪物使用19伤害、13追逐与真实动画，不只是远处循环对砍。双方都有可能死亡；NPC击杀只取实际掉落，未参与的玩家不自动获得经验。\n\n与玩家结伴时约定“各取自己采集”“材料五五分”或“固定护送费”；只在完成实际事件后分配，一件唯一物不能拆成两份。NPC被怪物杀死后背包留在现场或被具有明确搬运能力的世界实体带走；普通怪不会把神剑神秘吞进掉落表又复制一份。\n\n近区最多同时3名完整游历AI，计入已有战斗总预算，不在8普通怪之外再偷偷加12名。中距离低频运行真实位置和阶段，远区仅推进有完整资源账的路线节点；远区战斗可用已存种子的简化模型，但必须双方实际在同节点并保存伤亡/库存事务，不隔空指定NPC获得玩家物品。离线不模拟抢劫、销赃或NPC夺取已揭示给玩家的机缘。\n\n首次进入未加载区域只揭示预先属于该区的人物和当前记录，不因玩家转头新建商人。入区商旅应从道路、舰船或营地出现，有行走/到达演出；不能刷新在玩家背后一米。\n\n## 4. 富裕但不是无限提款机\n\n取该境标准远征价值基准 `V(r)=200×5^r` 碎灵石，作为首轮调参单位。多数游历者的携行资产约2—6V，商旅4—10V，负缘者可有低现金与高价值封存物。总值包括正在穿用的装备、补给和可交易货物，不是每人额外带十份现金。实际库存逐项生成并能在交易/尸体中对应，杀人时不再掷一个“豪富额外掉落包”。\n\n每区每120分钟有效游玩最多补进价值12V的外来普通携行货，初始布置另有一次20V预算；只能在已有旅人死亡/永久迁出产生空缺后补位，时间到不会覆盖活人。当地采集收益从地区真实资源库存转移，不再扣外来货额度；其后给玩家也不能同时保留在NPC包里。服务消耗、交易、补给与运输成本形成支出，首轮用实际净收益调这个预算，不把它当已验证经济结论。\n\n玩家可以攻击中立游历者，但目击者、脚印/战斗记录和幸存者形成可追溯后果：交易拒绝、护卫追查、地图情报减少。没有目击不让全世界瞬间知道凶手；原38名基础服务NPC的剧情保护规则不因此撤销。后果用于世界反应，不偷偷清空战利品惩罚玩家。\n\n## 5. 偷袭夺宝必须有过程\n\n掠夺者只能根据已观察的公开装备、交易、采集动作、传闻判断价值，不读取玩家背包UI或尚未揭示的唯一账。伏击路径为踩点→跟踪→等待空当→接近/包围→短前摇攻击或勒索。允许隐藏意图，但保留可察觉迹象：重复跟随、同行者绕路、陌生脚印、武器出鞘声；不弹“此人坏人”的标签。\n\n安全站及保护通道不发生抢劫；打开交谈/交易菜单暂停单机，不允许菜单中无输入被打死。背叛必须先结束对话、恢复鼠标控制，再按合法攻击前摇执行，近战起手至少0.6秒。强敌不会因抢劫需要而获得瞬移、无限速度或无敌；玩家可识破、逃跑、交出指定物、反击或反埋伏。\n\n抢劫者战斗失败可以投降/逃跑/死亡。玩家可选择斩杀，死亡留下其**当前真实库存与装备**，包括曾抢到的物资、携行地图和未使用机缘物；已学功法不能变成一本凭空可掉秘籍，只有携带的原本/研究笔记或明确可继承的道统资格才可取得。\n\n## 6. 玩家败北：真实失物，但可追索\n\n这是02“普通昏迷保留背包”的明确例外，仅发生于具备robberyEnabled的动态掠夺事件；被普通怪击败仍按原救援规则。生命归零先倒地，劫修需要原地完成5秒搜夺，可被战宠、队友或救援打断；提交抢夺事务前物品仍属于玩家。\n\n一次搜夺在以下两档中选一档，结果预览在事后记录，不同时叠加：\n\n- **劫财**：最多转移可触及普通财物总估值25%，优先灵石/药材/矿材，受劫修实际体积与负重限制；灵石按真实整数面额拆分记录。没有合适物也不会生成负债。\n- **夺宝**：转移一件已实际识别且可取走的高价值物或未解残图，替代普通25%掠夺，不再额外抢全包。世界唯一未认主/封存原器也可能被取走，唯一账同步改持有人，玩家世界里仍只有这一件。\n\n基础宇航服/呼吸设备、最低生存武器、主线不可替代钥匙、已学知识、已契约活宠及银行资产不可取；飞行器货舱只有劫修真的到达并成功破锁才能接触。认主装备、封闭袋戒不能凭空开包：须相应破印能力，额外10秒可打断破印；失败只取外部财物。核心已吸收入体的MYC资格/MYF增益不变成背包物，不可掏走；其封存原本若尚未吸收则可能被夺。\n\n搜夺成功后NPC要背着东西逃走；过重就少拿、减速或丢弃，不能抢完瞬间传送到商店。救援恢复玩家控制并给“失物记录”：物品ID、数量、外观、最后目击地点、嫌疑人身份特征。事件消耗一次搜夺资格；同一人不能对同一次倒地反复扣25%。复起后10分钟有效游玩不主动生成新的夺宝伏击，但玩家主动追击仍可交战。\n\n## 7. 抢走的东西能被卖掉，也能找回\n\nNPC带赃物去实际买家，可在路上被拦截。普通销赃最早在玩家恢复控制后20分钟有效游玩、到达商路交易节点且买家有钱/容量时完成；离线冻结。物品原ID转入买家库存，买家的钱转给劫修；不能把物品复制一份出售后还在劫修背包里。\n\n被追索普通物至少保留60分钟有效游玩的赎回窗口，期间不被NPC制作消耗；唯一原器、主线关联失物和关键残图不自动销毁，之后仍沿持有人记录可追踪。普通物超过窗口可被实际加工，留明确去向和收据，找回可能只剩追回卖款；这是真实损失，不宣称所有东西无限免费返还。\n\n玩家可询问目击者、悬赏追踪、截获货单、赎回或击败当前持有人。找回是转移原物；N07救援网络只提供线索，不能再发一份“补偿神剑”。劫修卖掉宝物后再被杀，只掉其现有卖款和剩余物，不掉已卖宝物。对同一失物的“尸体拾回”和“NPC赎回”请求只能有一个成功。\n\n## 8. NPC也能先得到机缘\n\n游历者可持自己的普通地图，参与尚未归属的公共遗迹和世界机缘。生成时有明确是否允许NPC参与的opportunityOwnership：玩家个人已预留机缘禁止NPC隔空领取；公共未预留机缘可竞争，先通过真实考验并提交者获得，不能等玩家做完最后一秒凭空截胡。\n\n世界唯一键在NPC预留/获物时同样锁定；NPC走MYF06与玩家直接MYW来源共用账。RN12的2%只决定“可能有传承故事”的人物模板，**不另开一个2%神物掉率**。其初始逆天物必须有世界事件预算和唯一账的真实来源；新补旅人不会因上一任带神物而自动也带一件。\n\nNPC若携未吸收原卷、封兵、残图，玩家战胜并斩杀后可取得原物，成为另一条艰难机缘路径。已经吸收的MYC道统是否能继承必须由该原事件声明：允许者死亡时生成与原uniqueDefinitionId绑定的唯一传承残印，通过承载试验才转给玩家；不允许者仅留普通笔记。不得同时掉原卷和残印，更不复制NPC全套技能。已激活的MYF体质不是可掉落的百分比物品。\n\n持逆天核心的NPC也用26的CD、合体和代价，提供可读但强大的战斗，玩家可暂避后续再战。死亡后留下历史记录，机缘流转不恢复其生命；他们被怪物杀死时同样留下原物供真实拾取，可能引发后续争夺事件。\n\n## 9. 死亡后换一个新人，不给旧人改名复活\n\n人物死亡、合法永久迁出或加入固定岗位后提交人口空缺；外出采矿/短暂卸载不算迁出。新旅人最早30—60分钟有效游玩后、外来物资预算足够且道路安全时从区域入口补入；每区最多6个在地动态人物，近区AI仍服从3名和总战斗预算。\n\n新人物换实例ID、姓名组合、脸/衣装变体、出身、目标、初始货单与行为倾向；名字尽量不与本世界最近20名旅人重复。不能只改显示名而复用旧死亡状态/信任/物品。旧人遗体或遗留物未领时保留物品账，新人不会继承其原器；现场未结算容器过多时局部暂停补人，沿用27预算思路。\n\n旧人被抢/被杀史保留于墓记、目击和关系记录；若有复仇者，必须是另一真实人物持独立库存与可解释关系。尸体外观可淡出，死亡账不可因存档压缩清零；改名、刷新和模型换皮不释放世界唯一名额。\n\n## 10. 3D、对话与数据合同\n\n至少制作采药蹲姿、采矿挥镐/收矿、检查地图、背负货包、与怪交战、受伤求助、观察跟踪、出鞘偷袭、搜身读条、负重逃跑、交易交接、倒地/死亡12组状态动作。手里的图、武器、背包要与库存对应；不对话时凭空出现富豪箱子。第一/第三人称共享命中和搜夺时间，菜单关闭后的方向控制必须恢复。\n\nNPC邀请卡显示路线、预计时长、分配方式、可退出条件；不显示隐藏倾向。交易地图展示覆盖范围/记录日期/是否鉴定/是否只含传闻。失物页显示可追踪记录与证据，未知处显示“去向待查”，不做全图透视定位。\n\n数据：TravelerDefinition(RN)、TravelerInstance(id,nameSeed,appearanceSeed,temperament,realm,loadout,inventoryId,knowledgeIds,goal,route,knownValueEvidence,lifeState)、MapItem(instanceId,coverage,version,source,verification,opportunityId,accessTokenId)、RobberyEvent(eventId,sourceId,targetId,eligibleItems,transferTxnId,searchProgress,completed)、StolenProvenance(rootItemId,owners,tradeTxnIds,recoveryWindow)、PopulationVacancy与区域外来价值账。\n\n部分堆叠转移生成可追溯splitId，数量守恒；唯一物不拆成多个可用原器。死亡与背包容器创建同事务，抢夺扣玩家库存与加NPC库存同事务，交易钱货同时提交。两人抢同一物、玩家在NPC死亡同帧赎回、存储失败、菜单重复确认都需版本检查。\n\n## 11. 三条首片闭环与验收\n\n先做RN01真实采药与可靠地图出售→玩家跟路线采到材料；再RN09伏击→玩家败北丢普通矿材→NPC负重逃跑→追击取回原物；最后RN11公共遗迹竞争→同一原器归属只能一方成功。先不同时开放随机抢唯一装备，待追赃可完整走通后再接封存遗兵。\n\n|验收ID|场景|期望|\n|---|---|---|\n|TN01|地图阅读后原件被抢|已学地形仍在，一次性钥匙资格按实物处理|\n|TN02|买到假路线|有可核验矛盾与替代入口，不软锁主线|\n|TN03|NPC与玩家同采最后一份|一方提交成功，物资与空缺各一次|\n|TN04|NPC被怪物击杀|只掉真实当前背包，无额外财富骰|\n|TN05|对话中背叛|先恢复输入再按前摇攻击，不菜单秒杀|\n|TN06|搜夺读条被打断|未提交部分不转移，再次请求不重复扣物|\n|TN07|同次倒地重复搜夺|仅一次成功；负重/容量真实限制|\n|TN08|NPC卖赃后被斩杀|尸体没有已卖原物，只保留钱与剩余物|\n|TN09|尸体找回与赎回并发|只能一次取得同一物|\n|TN10|旧人死后新人补位|新人新身份新普通货单，唯一原器不复制|\n|TN11|NPC先预留公共神物|玩家不能从另一来源再生成同原器|\n|TN12|离线/保存重载|不销赃、不重抽善恶、不重生死者、不复位唯一账|\n\n所有价格、人口、收益与抢夺比例为白盒起点，需要真实路线与经济统计调参；本轮文档完成不等于这些AI、搜夺或3D动画已经实装。\n","html":"\u003ch1>28 · 开荒地图、游历人物与夺宝追赃\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-28-v001.svg\" alt=\"地图引路，人物争缘\">\u003c/p>\u003cp>\u003cem>图解：坏人不会自带标签；新人物不能复制旧人的宝物与机缘。\u003c/em>\u003c/p>\u003cp>2026-09-12；设计稿，尚未实装。配套\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">世界刷新\u003c/a>、\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">洞府\u003c/a>、\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">唯一传承\u003c/a>。新增动态游历人物体系，独立于固定服务/剧情名册（第29增补后68名）；他们有真实身份、库存、经验、目标和死亡记录。\u003c/p>\u003ch2>1. 有的险地要先拿到地图\u003c/h2>\u003cp>普通地表仍能自由探索；“有地图才可开荒”主要用于迷雾地带、地下迷宫、不断变化的阵门和空间航路。地图提供实在的定位、通行序列或安全窗口，不是在普通山坡放一堵“未买地图不能走”的空气墙。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>地图ID\u003c/th>\u003cth>种类\u003c/th>\u003cth>能解决的实际障碍\u003c/th>\u003cth>获得渠道\u003c/th>\u003cth>入门价格/边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MAP01 荒野行路图\u003c/td>\u003ctd>区域地形\u003c/td>\u003ctd>道路、水源、已知避难点\u003c/td>\u003ctd>N04购买、游历者交换、自行测绘\u003c/td>\u003ctd>40碎灵石；不透露未发现宝物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP02 瘴林水脉图\u003c/td>\u003ctd>危险地表\u003c/td>\u003ctd>雾中可验证地标、净气点与退路\u003c/td>\u003ctd>N09购买、救助采药人\u003c/td>\u003ctd>120碎灵石；防毒装备仍必需\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP03 地宫层图\u003c/td>\u003ctd>地下结构\u003c/td>\u003ctd>竖井、连通层、闸门次序\u003c/td>\u003ctd>普通洞府残图、勘图师交易\u003c/td>\u003ctd>当阶基础价150×5^r；不自动杀守卫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP04 镜阵行仪图\u003c/td>\u003ctd>阵法解法\u003c/td>\u003ctd>真实阵眼顺序，缺图可先外围研究\u003c/td>\u003ctd>N12鉴定、机缘拼图、阵师委托\u003c/td>\u003ctd>研究服务100×5^r；不保证商店常有成图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP05 陨带航路图\u003c/td>\u003ctd>飞行/矿带\u003c/td>\u003ctd>碎石运动周期、安全落点\u003c/td>\u003ctd>N14/游商购买、实际航测\u003c/td>\u003ctd>200×5^r；不授予高度/真空权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP06 星门坐标图\u003c/td>\u003ctd>跨星\u003c/td>\u003ctd>已发现星门的授权坐标与返程锚\u003c/td>\u003ctd>N15首次返程教学、N38远征\u003c/td>\u003ctd>首条任务保障，其余300×5^r；R6认证独立\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP07 古藏残图\u003c/td>\u003ctd>隐秘机缘\u003c/td>\u003ctd>几块残图与现地特征合成入口线索\u003c/td>\u003ctd>独立机缘、NPC真库存、战利品\u003c/td>\u003ctd>无固定售价，鉴定后议价；不等于必出逆天物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAP08 虚海星图\u003c/td>\u003ctd>星空\u003c/td>\u003ctd>移动天体参考系、补气站和危险带\u003c/td>\u003ctd>R8星港购买、星空遗迹研究\u003c/td>\u003ctd>500×5^r；过期轨迹需重测\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>r是地图覆盖区的材料/危险阶，不随买家当前境界临时涨价。普通地图可复制交易，但每份复制需纸/存储晶与测绘服务，售价受原图真实性和已知范围约束；唯一机缘的通行资格不是可无限复制的地图图像。\u003c/p>\u003cp>地图有四个独立字段：范围完整度0—100%、可信度（未知/交叉核实/实测）、记录版本/时间、可用入口。普通地图阅读后地形知识永久进入日志，地图原件丢失不失忆；一次性阵门印记、未解析残图和入场钥匙仍是实体物品，可以被抢。\u003c/p>\u003cp>古藏残图共享opportunityId与世界唯一预留：不同残片拼的是同一地点，复印不会多生成一座宝库。若有人先取走核心，地图更新为“遗迹已被探索/可能有后续住客”，玩家可发现遗留线索或追查原物，不重发原器。普通传闻不预留神物，只有实际选中并提交的唯一奖励才占唯一账。\u003c/p>\u003cp>地图并非永久准确：地形通常稳定，动态怪群只标“曾有巢穴”，不显示每秒实时位置；崩塌与阵门变化留下版本差异。坏人可卖真地形、假安全路线，玩家能用地标、痕迹、价格、消息来源交叉核验。必要主线的基础路线至少有一个可靠NPC/自行测绘入口，不能被一张假图永久卡住。\u003c/p>\u003ch2>2. 十二种动态游历人物\u003c/h2>\u003cp>名字从姓名/称号/出身组合生成，展示名字不是数据库主键。RN是行为模板，实际人物用travelerInstanceId；姓名、外貌、声音、衣装、惯用武器与关系记录共同识别。下列权重为区域允许模板中的初始权重，全部允许时总和100；不是实际“好人/坏人百分比”，不向玩家展示。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模板ID\u003c/th>\u003cth>常见身份/示例名（不是固定角色）\u003c/th>\u003cth>权重\u003c/th>\u003cth>行动与引导作用\u003c/th>\u003cth>潜在冲突\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>RN01\u003c/td>\u003ctd>采药客·孟秋实\u003c/td>\u003ctd>20\u003c/td>\u003ctd>找药、观察毒区、请求驱兽，可出售自采药和地形笔记\u003c/td>\u003ctd>可能藏起稀有药，不自动分享所有发现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN02\u003c/td>\u003ctd>寻矿人·石临川\u003c/td>\u003ctd>10\u003c/td>\u003ctd>搬矿、修工具、雇人守采点，教辨矿痕\u003c/td>\u003ctd>矿权争执，可能先占新矿芯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN03\u003c/td>\u003ctd>猎妖人·燕逐风\u003c/td>\u003ctd>10\u003c/td>\u003ctd>追踪怪物、设置可见陷阱、真实剥取材料\u003c/td>\u003ctd>抢猎物或因伤撤退，会被强兽杀死\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN04\u003c/td>\u003ctd>勘图师·顾望山\u003c/td>\u003ctd>8\u003c/td>\u003ctd>测绘岔路、出售地图与校验服务\u003c/td>\u003ctd>地图可能过时，信誉不等于永久准确\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN05\u003c/td>\u003ctd>行脚商·陶万里\u003c/td>\u003ctd>8\u003c/td>\u003ctd>带货、收购、往返商站和临时营地\u003c/td>\u003ctd>负重慢，可能求护送或被劫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN06\u003c/td>\u003ctd>负伤修士·柳照尘\u003c/td>\u003ctd>8\u003c/td>\u003ctd>求药、指明危险或遗失宝物地点\u003c/td>\u003ctd>有真伤者，也有装伤诱饵，治疗不能自动揭示善恶\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN07\u003c/td>\u003ctd>结伴散修·季长松\u003c/td>\u003ctd>8\u003c/td>\u003ctd>邀请短途结伴，共斗、分账、讲见闻\u003c/td>\u003ctd>可能临阵逃走；分配条款提前说明\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN08\u003c/td>\u003ctd>引路客·莫归舟\u003c/td>\u003ctd>8\u003c/td>\u003ctd>熟悉险路，能带玩家找入口\u003c/td>\u003ctd>可能把人带进埋伏，沿路存在异常痕迹\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN09\u003c/td>\u003ctd>劫修·陆断潮\u003c/td>\u003ctd>6\u003c/td>\u003ctd>观察货物与战力、跟踪、要求交货或偷袭\u003c/td>\u003ctd>明确转敌后可斩杀；不会凭空知道戒内全部财产\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN10\u003c/td>\u003ctd>灰市掮客·钱无咎\u003c/td>\u003ctd>8\u003c/td>\u003ctd>收赃、搬货、转卖地图、传递买家消息\u003c/td>\u003ctd>可能销赃或提供赎回线索，可截断其运输路线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN11\u003c/td>\u003ctd>争缘修士·谢问衡\u003c/td>\u003ctd>4\u003c/td>\u003ctd>竞争遗迹入口、破解阵法、争抢未归属奖励\u003c/td>\u003ctd>可能谈分成，也可能撕毁约定，关系按行为变化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RN12\u003c/td>\u003ctd>负缘隐修·沈藏星\u003c/td>\u003ctd>2\u003c/td>\u003ctd>携带某段已有传承历史，追求修复/还愿\u003c/td>\u003ctd>可能持稀有物，但绝不因抽到此模板自动获得逆天原器\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>隐藏行为倾向在出生时固定并持久化：守约、逐利、胆怯、掠夺、重情。外观、姓氏和头顶颜色不直接泄露；贪财不必杀人，结伴者也可能在巨大利益下背约。背叛触发还需真实动机、已知目标价值和可行逃路，不在打开对话时临时抽一次坏人骰。\u003c/p>\u003ch2>3. 他们真的在世界里做事\u003c/h2>\u003cp>状态：进区→观察→选择任务→移动→采集/战斗/交易/寻缘→处理伤势与负重→返营/继续探索。行动目标来自区域可用资源和已获得情报，不能按玩家缺什么自动扮演发奖员。\u003c/p>\u003cp>NPC采集会扣掉同一个资源节点，材料进入其背包并产生27的空缺令牌；玩家先采则NPC转向别处。NPC和怪物使用19伤害、13追逐与真实动画，不只是远处循环对砍。双方都有可能死亡；NPC击杀只取实际掉落，未参与的玩家不自动获得经验。\u003c/p>\u003cp>与玩家结伴时约定“各取自己采集”“材料五五分”或“固定护送费”；只在完成实际事件后分配，一件唯一物不能拆成两份。NPC被怪物杀死后背包留在现场或被具有明确搬运能力的世界实体带走；普通怪不会把神剑神秘吞进掉落表又复制一份。\u003c/p>\u003cp>近区最多同时3名完整游历AI，计入已有战斗总预算，不在8普通怪之外再偷偷加12名。中距离低频运行真实位置和阶段，远区仅推进有完整资源账的路线节点；远区战斗可用已存种子的简化模型，但必须双方实际在同节点并保存伤亡/库存事务，不隔空指定NPC获得玩家物品。离线不模拟抢劫、销赃或NPC夺取已揭示给玩家的机缘。\u003c/p>\u003cp>首次进入未加载区域只揭示预先属于该区的人物和当前记录，不因玩家转头新建商人。入区商旅应从道路、舰船或营地出现，有行走/到达演出；不能刷新在玩家背后一米。\u003c/p>\u003ch2>4. 富裕但不是无限提款机\u003c/h2>\u003cp>取该境标准远征价值基准 \u003ccode>V(r)=200×5^r\u003c/code> 碎灵石，作为首轮调参单位。多数游历者的携行资产约2—6V，商旅4—10V，负缘者可有低现金与高价值封存物。总值包括正在穿用的装备、补给和可交易货物，不是每人额外带十份现金。实际库存逐项生成并能在交易/尸体中对应，杀人时不再掷一个“豪富额外掉落包”。\u003c/p>\u003cp>每区每120分钟有效游玩最多补进价值12V的外来普通携行货，初始布置另有一次20V预算；只能在已有旅人死亡/永久迁出产生空缺后补位，时间到不会覆盖活人。当地采集收益从地区真实资源库存转移，不再扣外来货额度；其后给玩家也不能同时保留在NPC包里。服务消耗、交易、补给与运输成本形成支出，首轮用实际净收益调这个预算，不把它当已验证经济结论。\u003c/p>\u003cp>玩家可以攻击中立游历者，但目击者、脚印/战斗记录和幸存者形成可追溯后果：交易拒绝、护卫追查、地图情报减少。没有目击不让全世界瞬间知道凶手；原38名基础服务NPC的剧情保护规则不因此撤销。后果用于世界反应，不偷偷清空战利品惩罚玩家。\u003c/p>\u003ch2>5. 偷袭夺宝必须有过程\u003c/h2>\u003cp>掠夺者只能根据已观察的公开装备、交易、采集动作、传闻判断价值，不读取玩家背包UI或尚未揭示的唯一账。伏击路径为踩点→跟踪→等待空当→接近/包围→短前摇攻击或勒索。允许隐藏意图，但保留可察觉迹象：重复跟随、同行者绕路、陌生脚印、武器出鞘声；不弹“此人坏人”的标签。\u003c/p>\u003cp>安全站及保护通道不发生抢劫；打开交谈/交易菜单暂停单机，不允许菜单中无输入被打死。背叛必须先结束对话、恢复鼠标控制，再按合法攻击前摇执行，近战起手至少0.6秒。强敌不会因抢劫需要而获得瞬移、无限速度或无敌；玩家可识破、逃跑、交出指定物、反击或反埋伏。\u003c/p>\u003cp>抢劫者战斗失败可以投降/逃跑/死亡。玩家可选择斩杀，死亡留下其\u003cstrong>当前真实库存与装备\u003c/strong>，包括曾抢到的物资、携行地图和未使用机缘物；已学功法不能变成一本凭空可掉秘籍，只有携带的原本/研究笔记或明确可继承的道统资格才可取得。\u003c/p>\u003ch2>6. 玩家败北：真实失物，但可追索\u003c/h2>\u003cp>这是02“普通昏迷保留背包”的明确例外，仅发生于具备robberyEnabled的动态掠夺事件；被普通怪击败仍按原救援规则。生命归零先倒地，劫修需要原地完成5秒搜夺，可被战宠、队友或救援打断；提交抢夺事务前物品仍属于玩家。\u003c/p>\u003cp>一次搜夺在以下两档中选一档，结果预览在事后记录，不同时叠加：\u003c/p>\u003cul>\u003cli>\u003cstrong>劫财\u003c/strong>：最多转移可触及普通财物总估值25%，优先灵石/药材/矿材，受劫修实际体积与负重限制；灵石按真实整数面额拆分记录。没有合适物也不会生成负债。\u003c/li>\u003cli>\u003cstrong>夺宝\u003c/strong>：转移一件已实际识别且可取走的高价值物或未解残图，替代普通25%掠夺，不再额外抢全包。世界唯一未认主/封存原器也可能被取走，唯一账同步改持有人，玩家世界里仍只有这一件。\u003c/li>\u003c/ul>\u003cp>基础宇航服/呼吸设备、最低生存武器、主线不可替代钥匙、已学知识、已契约活宠及银行资产不可取；飞行器货舱只有劫修真的到达并成功破锁才能接触。认主装备、封闭袋戒不能凭空开包：须相应破印能力，额外10秒可打断破印；失败只取外部财物。核心已吸收入体的MYC资格/MYF增益不变成背包物，不可掏走；其封存原本若尚未吸收则可能被夺。\u003c/p>\u003cp>搜夺成功后NPC要背着东西逃走；过重就少拿、减速或丢弃，不能抢完瞬间传送到商店。救援恢复玩家控制并给“失物记录”：物品ID、数量、外观、最后目击地点、嫌疑人身份特征。事件消耗一次搜夺资格；同一人不能对同一次倒地反复扣25%。复起后10分钟有效游玩不主动生成新的夺宝伏击，但玩家主动追击仍可交战。\u003c/p>\u003ch2>7. 抢走的东西能被卖掉，也能找回\u003c/h2>\u003cp>NPC带赃物去实际买家，可在路上被拦截。普通销赃最早在玩家恢复控制后20分钟有效游玩、到达商路交易节点且买家有钱/容量时完成；离线冻结。物品原ID转入买家库存，买家的钱转给劫修；不能把物品复制一份出售后还在劫修背包里。\u003c/p>\u003cp>被追索普通物至少保留60分钟有效游玩的赎回窗口，期间不被NPC制作消耗；唯一原器、主线关联失物和关键残图不自动销毁，之后仍沿持有人记录可追踪。普通物超过窗口可被实际加工，留明确去向和收据，找回可能只剩追回卖款；这是真实损失，不宣称所有东西无限免费返还。\u003c/p>\u003cp>玩家可询问目击者、悬赏追踪、截获货单、赎回或击败当前持有人。找回是转移原物；N07救援网络只提供线索，不能再发一份“补偿神剑”。劫修卖掉宝物后再被杀，只掉其现有卖款和剩余物，不掉已卖宝物。对同一失物的“尸体拾回”和“NPC赎回”请求只能有一个成功。\u003c/p>\u003ch2>8. NPC也能先得到机缘\u003c/h2>\u003cp>游历者可持自己的普通地图，参与尚未归属的公共遗迹和世界机缘。生成时有明确是否允许NPC参与的opportunityOwnership：玩家个人已预留机缘禁止NPC隔空领取；公共未预留机缘可竞争，先通过真实考验并提交者获得，不能等玩家做完最后一秒凭空截胡。\u003c/p>\u003cp>世界唯一键在NPC预留/获物时同样锁定；NPC走MYF06与玩家直接MYW来源共用账。RN12的2%只决定“可能有传承故事”的人物模板，\u003cstrong>不另开一个2%神物掉率\u003c/strong>。其初始逆天物必须有世界事件预算和唯一账的真实来源；新补旅人不会因上一任带神物而自动也带一件。\u003c/p>\u003cp>NPC若携未吸收原卷、封兵、残图，玩家战胜并斩杀后可取得原物，成为另一条艰难机缘路径。已经吸收的MYC道统是否能继承必须由该原事件声明：允许者死亡时生成与原uniqueDefinitionId绑定的唯一传承残印，通过承载试验才转给玩家；不允许者仅留普通笔记。不得同时掉原卷和残印，更不复制NPC全套技能。已激活的MYF体质不是可掉落的百分比物品。\u003c/p>\u003cp>持逆天核心的NPC也用26的CD、合体和代价，提供可读但强大的战斗，玩家可暂避后续再战。死亡后留下历史记录，机缘流转不恢复其生命；他们被怪物杀死时同样留下原物供真实拾取，可能引发后续争夺事件。\u003c/p>\u003ch2>9. 死亡后换一个新人，不给旧人改名复活\u003c/h2>\u003cp>人物死亡、合法永久迁出或加入固定岗位后提交人口空缺；外出采矿/短暂卸载不算迁出。新旅人最早30—60分钟有效游玩后、外来物资预算足够且道路安全时从区域入口补入；每区最多6个在地动态人物，近区AI仍服从3名和总战斗预算。\u003c/p>\u003cp>新人物换实例ID、姓名组合、脸/衣装变体、出身、目标、初始货单与行为倾向；名字尽量不与本世界最近20名旅人重复。不能只改显示名而复用旧死亡状态/信任/物品。旧人遗体或遗留物未领时保留物品账，新人不会继承其原器；现场未结算容器过多时局部暂停补人，沿用27预算思路。\u003c/p>\u003cp>旧人被抢/被杀史保留于墓记、目击和关系记录；若有复仇者，必须是另一真实人物持独立库存与可解释关系。尸体外观可淡出，死亡账不可因存档压缩清零；改名、刷新和模型换皮不释放世界唯一名额。\u003c/p>\u003ch2>10. 3D、对话与数据合同\u003c/h2>\u003cp>至少制作采药蹲姿、采矿挥镐/收矿、检查地图、背负货包、与怪交战、受伤求助、观察跟踪、出鞘偷袭、搜身读条、负重逃跑、交易交接、倒地/死亡12组状态动作。手里的图、武器、背包要与库存对应；不对话时凭空出现富豪箱子。第一/第三人称共享命中和搜夺时间，菜单关闭后的方向控制必须恢复。\u003c/p>\u003cp>NPC邀请卡显示路线、预计时长、分配方式、可退出条件；不显示隐藏倾向。交易地图展示覆盖范围/记录日期/是否鉴定/是否只含传闻。失物页显示可追踪记录与证据，未知处显示“去向待查”，不做全图透视定位。\u003c/p>\u003cp>数据：TravelerDefinition(RN)、TravelerInstance(id,nameSeed,appearanceSeed,temperament,realm,loadout,inventoryId,knowledgeIds,goal,route,knownValueEvidence,lifeState)、MapItem(instanceId,coverage,version,source,verification,opportunityId,accessTokenId)、RobberyEvent(eventId,sourceId,targetId,eligibleItems,transferTxnId,searchProgress,completed)、StolenProvenance(rootItemId,owners,tradeTxnIds,recoveryWindow)、PopulationVacancy与区域外来价值账。\u003c/p>\u003cp>部分堆叠转移生成可追溯splitId，数量守恒；唯一物不拆成多个可用原器。死亡与背包容器创建同事务，抢夺扣玩家库存与加NPC库存同事务，交易钱货同时提交。两人抢同一物、玩家在NPC死亡同帧赎回、存储失败、菜单重复确认都需版本检查。\u003c/p>\u003ch2>11. 三条首片闭环与验收\u003c/h2>\u003cp>先做RN01真实采药与可靠地图出售→玩家跟路线采到材料；再RN09伏击→玩家败北丢普通矿材→NPC负重逃跑→追击取回原物；最后RN11公共遗迹竞争→同一原器归属只能一方成功。先不同时开放随机抢唯一装备，待追赃可完整走通后再接封存遗兵。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>验收ID\u003c/th>\u003cth>场景\u003c/th>\u003cth>期望\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TN01\u003c/td>\u003ctd>地图阅读后原件被抢\u003c/td>\u003ctd>已学地形仍在，一次性钥匙资格按实物处理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN02\u003c/td>\u003ctd>买到假路线\u003c/td>\u003ctd>有可核验矛盾与替代入口，不软锁主线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN03\u003c/td>\u003ctd>NPC与玩家同采最后一份\u003c/td>\u003ctd>一方提交成功，物资与空缺各一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN04\u003c/td>\u003ctd>NPC被怪物击杀\u003c/td>\u003ctd>只掉真实当前背包，无额外财富骰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN05\u003c/td>\u003ctd>对话中背叛\u003c/td>\u003ctd>先恢复输入再按前摇攻击，不菜单秒杀\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN06\u003c/td>\u003ctd>搜夺读条被打断\u003c/td>\u003ctd>未提交部分不转移，再次请求不重复扣物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN07\u003c/td>\u003ctd>同次倒地重复搜夺\u003c/td>\u003ctd>仅一次成功；负重/容量真实限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN08\u003c/td>\u003ctd>NPC卖赃后被斩杀\u003c/td>\u003ctd>尸体没有已卖原物，只保留钱与剩余物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN09\u003c/td>\u003ctd>尸体找回与赎回并发\u003c/td>\u003ctd>只能一次取得同一物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN10\u003c/td>\u003ctd>旧人死后新人补位\u003c/td>\u003ctd>新人新身份新普通货单，唯一原器不复制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN11\u003c/td>\u003ctd>NPC先预留公共神物\u003c/td>\u003ctd>玩家不能从另一来源再生成同原器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TN12\u003c/td>\u003ctd>离线/保存重载\u003c/td>\u003ctd>不销赃、不重抽善恶、不重生死者、不复位唯一账\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>所有价格、人口、收益与抢夺比例为白盒起点，需要真实路线与经济统计调参；本轮文档完成不等于这些AI、搜夺或3D动画已经实装。\u003c/p>"},{"file":"29_SUPREME_FACTIONS_AND_STORY.md","title":"29 · 一神国、二洞天、三学府、四圣地","text":"# 29 · 一神国、二洞天、三学府、四圣地\n\n\u003c!-- illustrated-overview:start -->\n![十方格局：从下属门派走向星域](media/diagram-29-v001.svg)\n\n*图解：既有六宗门保留服务；新领袖与支线人物共30名，固定名册增至68名。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；世界观与任务设计增补，未实装。本章保留用户指定的十位最高领袖战力，连接既有六宗门、动态游历者和跨星路线。阵营不是善恶标签，个人关系、宗门身份与实际行为分别记录。\n\n## 1. 等级与称谓对齐\n\n沿用十境各十级：`总等级=10×境界编号r+本境小级l`。后天R0是1—10级，道源R9是91—100级。因此99级=道源九级，98级=道源八级，97级=道源七级，96级=道源六级，95级=道源五级。\n\n道源内部叙事称谓：91—93初阶、94—96中阶（96为中阶顶峰）、97—99大成、100圆满。本章的“道源大成”是角色境界段位，与技能的入门/小成/精通/大成/圆满分属两个字段，不能混用。领袖数字是常态参考战力等级，装备/阵法/伤势影响实战，仍通过19的属性管线结算；不额外再乘一次“神皇倍率”。\n\n神皇是当前已知NPC中单体最强者，99级；不新增一个隐藏100级NPC压过用户设定，也不阻止玩家将来达到100级。最高领袖不会按主角等级自动缩放或被低阶教学习惯动作击杀。\n\n## 2. 十大顶级组织与最高人物\n\n|组织ID|类别/组织|最高人物（固定NPC）|总等级|道源阶段|根本主张与矛盾|\n|---|---|---|---|---|---|\n|TF01|神国·昊宸神国|N39 姬天衡·神皇|99|大成（九级）|统一星门、抵御星潮；中央秩序也形成通行垄断与边星重税|\n|TF02|洞天·太初玄都洞天|N40 玄微子·太初老祖|98|大成（八级）|保存道统、维护封印；封存知识与公开求道长期冲突|\n|TF03|洞天·归墟洞天|N41 顾长渊·归墟老祖|97|大成（七级）|边星自治、归还被征用的灵脉；激进派可能不顾后果拆星门|\n|TF04|学府·太一学府|N42 闻道衡·院长|97|大成（七级）|传承应向通过验证的人开放；坚持论证而非血统定资格|\n|TF05|学府·万象学府|N43 叶知微·院长|96|中阶顶峰（六级）|实地观测、档案与星图共享；争议在于危险知识如何公开|\n|TF06|学府·天工学府|N44 墨天机·院长|96|中阶顶峰（六级）|科技与炼器并进、用工程减少灵脉消耗；实验失败可能伤人|\n|TF07|圣地·赤霄圣地|N45 陆焚霄·圣主|95|中阶（五级）|尚武、炼兵与守护航道；军备需求侵蚀矿脉和边地权益|\n|TF08|圣地·瑶光圣地|N46 苏映寒·圣主|95|中阶（五级）|疗愈、生态与中立救援；必须面对战争双方都需要药的困局|\n|TF09|圣地·无相圣地|N47 闻无相·圣主|95|中阶（五级）|认为道统垄断必须打破，擅长隐匿与情报；部分门人以此为夺宝借口|\n|TF10|圣地·御灵圣地|N48 牧天青·圣主|95|中阶（五级）|人兽契约与共同生存；与强制奴役灵兽、掠夺兽巢的组织冲突|\n\n根基分别为：神国天都“曜京”、太初“玄都内天”、归墟“沉星内海”、太一“问道洲”、万象“万象星观测环”、天工“铸星环”、赤霄“炎冠星”、瑶光“澄明星”、无相“无名渡”、御灵“万灵洲”。它们通过现有空衡/万象/寂曜航路逐步接触，不是开局同时建十张大地图。高阶未开放时以文书、代表和封锁航路体现组织存在。\n\n## 3. 对立、合作与互相牵制\n\n|双方|现状|冲突焦点|合作窗口/可变化结果|\n|---|---|---|---|\n|昊宸—归墟|核心对立，局部停战|星门控制、征用灵脉与自治权|星潮来袭时共守边界；主角证据可促成限期共管|\n|昊宸—赤霄|军备同盟|神国要服从，赤霄要矿权与军事自主|供应受阻会裂盟，但不随机一夜互相灭门|\n|昊宸—太一|合作培养，制度冲突|神国欲按出身授法，学府主张公开试炼|共同调查边军贪腐，改革路线可改善关系|\n|太初—无相|长期敌对|封存禁法是否正当、旧道统失窃案|证明部分封印确有危险后可交换档案，激进者仍不接受|\n|太初—太一|同源异见|守成秘传与开放研习|共同主持不依赖血统的承载试验|\n|归墟—无相|机会性合作，互不信任|前者要自治，后者有人想趁乱夺原器|主角可识破假旗袭击，切断激进派合作|\n|天工—赤霄|资源竞争|陨脉用作公共设施还是战争炼兵|一起修复防御设施；矿区污染证据决定后续契约|\n|天工—御灵|技术伦理争议|灵兽能芯实验、鞍具与自主契约|完成无伤害替代试验可形成长期合作|\n|瑶光—赤霄|救援中立下的摩擦|战地采药、占领药谷和伤员撤离|允许医疗走廊换取限量补给，任何一方违约都留后果|\n|御灵—无相|针对具体掠夺团的敌意|盗卵与伪造契约，不把所有无相弟子都定罪|无相内部告密者可帮助救兽并获得庇护|\n|万象—各方|有限中立，掌握证据|星图、战争档案与消息封锁|只公开有依据的信息；拒绝伪造记录，即使主角请求|\n\n没有单一“好人联盟/坏人联盟”。神国也有保护平民的军官，归墟也有伤害商旅的极端派；瑶光中也可能有人倒卖救命丹。阵营立场由利益与历史决定，个人能违抗上级并承担职位/追捕后果。\n\n## 4. 既有六宗门接在哪一层\n\n|既有宗门|上层关系|保持的独立性|\n|---|---|---|\n|S01 玄衡武院|太一学府的边星合作武院，受天工教学资助|保留N27/N28和科技营地教学，不因外交恶化关闭基础教程|\n|S02 青岚剑宗|太初玄都的外传支系|剑宗内部也有开放派，可推荐主角访学太一|\n|S03 赤炉门|天工学府认证工坊，同时承接赤霄订单|矿脉任务让玩家实际面对两方利益，非自动归军队所有|\n|S04 回春谷|瑶光圣地的医道支脉|沿用N33/N34和既有丹方，不强迫玩家加入才能救命|\n|S05 御灵山|御灵圣地的边星契约道场|保留同一宠物双模式和N35/N36服务|\n|S06 太虚星宫|万象学府参与、神国许可的空衡星门研究机构|既受许可限制又保留档案责任；不是十强之外另一个顶级统治组织|\n\n顶层人物的等级不意味着旗下所有门人都是道源。下层弟子依所在地区自然分布R0—R5，高阶星区才常见R6以上；使者投影只传话，不具备远程秒杀战斗能力。\n\n## 5. 二十个下属门派与关系NPC\n\n下表新增20名可建立个人关系的具名NPC，加上10位最高人物，固定设计名册由38增至68。现有38人的编号与任务不重写。下属门派SS01—SS20是支线组织，当前不新增20套玩家入门职业；六宗门仍是首轮完整加入/兑换系统。\n\n“初遇”给定本体阶段，任务重逢若有成长要记录修炼经历，不随主角自动补级。高级本体出现在低阶剧情时只通过投影/信使，不作为免费高阶战斗队友。友善/敌对倾向是作者配置，玩家看到行为后才形成判断。\n\n|门派ID/名字|直属顶层|具名NPC/初遇本体|与主角合作的具体任务|可能结怨、攻击的具体原因|\n|---|---|---|---|---|\n|SS01 镇辰府|昊宸|N49 裴照野·巡边使，R2三级|护送灾民，和主角并肩守撤离口|主角确实劫掠平民或伪造军令后追捕；不会仅因拒绝入伍攻击|\n|SS02 天衡司|昊宸|N50 姬玄策·监察使，R4二级|合作查星门走私，交换通行证据|受密令没收未认主禁器，遭拒后可进入有预告争夺；可用证据说服其违令|\n|SS03 守一门|太初|N51 宁守真·守印弟子，R1七级|修复裂缝，教正确封印顺序|主角破坏有证实危险的封印会阻止，不因学其他宗功法敌视|\n|SS04 藏虚观|太初|N52 沈藏岳·藏卷执事，R3三级|查找失窃残卷、共同过镜阵|本人私吞传承，发现主角持关键残图时可能伏击夺图|\n|SS05 归潮盟|归墟|N53 顾听潮·渡舟队长，R2一级|救助被重税拖垮的商队，提供绕行图|玩家出卖安全路线致难民受害后绝交/交战|\n|SS06 沉星剑门|归墟|N54 陆沉锋·先锋，R3一级|袭击掠夺灵脉的非法采场|将无辜补给船也列目标，主角阻止其爆破后可能决斗|\n|SS07 明心书院|太一|N55 温知行·游学弟子，R1四级|一起做遗迹辨伪、保全证据|主角杀伤其同伴且拒绝解释，关系下降并依法追责|\n|SS08 问道剑院|太一|N56 卫争鸣·试剑弟子，R2五级|先比武再共闯剑阵，互相救援可成挚友|争排名先走规则内比武；只有私人仇怨升级才野外攻击|\n|SS09 星图院|万象|N57 叶听澜·勘图师，R2二级|共同测绘地宫、出售经核实地图|主角泄露避难点给劫修后拒绝合作，不无证据全图通缉|\n|SS10 千鉴阁|万象|N58 许照尘·鉴图执事，R3四级|鉴定残图，追索赃物流转|为偿债伪造一条安全路线，暴露后可能逃走或雇劫修灭证|\n|SS11 星炉宗|天工|N59 墨承砚·炉师，R2三级|修炉、击退矿区怪群，共建节能阵器|主角掠走救援用核心导致停炉后讨还，可赔偿和解|\n|SS12 百机门|天工|N60 韩断机·试验执事，R3五级|合作测试无伤害兽用鞍具|偷偷使用强制抽灵装置，被揭发后带机关武器攻击|\n|SS13 烽岳宗|赤霄|N61 岳扶危·护航统领，R3三级|保卫航路，救两方伤员，重视守约|会因上级征用令与主角对峙，可通过替代物资避免冲突|\n|SS14 血铸门|赤霄|N62 炎夺岳·夺矿执事，R4一级|迫于兽潮可暂时与主角合作|觊觎主角陨核/原器，主动布设夺宝伏击，是可斩杀的长期对手|\n|SS15 济世山|瑶光|N63 苏晚照·行医弟子，R1五级|采药、救援、护送伤员，可同行治疗|目击主角滥杀后离队，必要时保护受害者对抗主角|\n|SS16 寒灯谷|瑶光|N64 柳寒灯·药库执事，R3二级|采购短缺药材，提供可靠疗伤线索|倒卖赈灾丹药，主角掌握货单后可能找人抢夺证据|\n|SS17 渡影楼|无相|N65 阮渡影·潜行弟子，R2四级|救回被盗兽卵、揭穿假旗袭击，可能背叛本门保护主角|主角出卖其真实身份后失去信任，生死追捕由实际证据触发|\n|SS18 无面阁|无相|N66 莫无声·猎宝人，R4三级|可买情报或达成一次停战交易|按已观察的宝物设局，使用伪名；身份揭露后仍是同一实例|\n|SS19 青梧苑|御灵|N67 牧青禾·护兽弟子，R1六级|共同孵蛋、安抚暴走灵兽、救援契约宠|若主角抢卵贩卖或伤害受保护兽群，会护兽反击|\n|SS20 镇兽谷|御灵|N68 赫连驭·镇兽执事，R3六级|兽潮时帮助筑防线，早期看似可靠|推行强制契约，企图夺主角封存异格蛋；活契约宠不变成可抢背包物|\n\n不是每个组织都固定配“一个好人一个坏人”：卫争鸣是可化解的竞争者，裴照野可能因主角行为变敌，阮渡影来自可疑组织却可成为可靠伙伴。关系好的NPC也有底线；关系差不必一见面就战斗。\n\n## 6. 关系、组队与敌意怎么算\n\n每个具名人物分别记录信任T∈[-100,100]、个人仇怨G∈[0,100]、组织声望F∈[-100,100]和证据事件。T与F不能相互覆盖：玩家得罪神国，不会自动让曾被救过的裴照野忘记恩情；他可能拒绝执行不当追捕，也可能只能暗中提供消息。\n\n首次实际救援T+15、履行一次高风险约定+10、普通交易不刷信任；同事件只计一次。毁约T−15，抢夺已确认属于该人的财物T−40且G+40；恶意杀害其亲友需证据才触发G+70。T≥30且满足个人任务可邀同行，T≥60可解锁互救支线；T≤−30仅表示拒绝合作，主动攻击还需G≥60或明确的通缉/夺宝行为动机。罪行可由目击、真实物证和供述传播，不全宇宙瞬时同步。\n\n早期玩家最多1名临时人类同伴，与**同一只当前宠物**并存，均计总AI预算。同行前明确任务、分配、期限、撤离条件。队友会真实行走、攻击、耗药、负重、受伤；超过主角两境的本体不作为常规可招募战斗队友，特殊救援演出不产生可刷经验/材料。分成以实际物品清单分配，唯一物提前约定归属，不给每人复制一份。\n\n同伴倒地先进入可救援状态，危险任务明确告知可能永久死亡；非战斗过场不突然秒杀队友。可斩杀的支线人物死亡后不会改名复活；职位可由新人物接任，原恩怨、任务记录和唯一物账保留。原38名基础服务NPC的保护边界保持，新30名中领袖只在相应终局事件开放实战，支线人物是否可杀在事件定义声明。\n\n背叛、抢夺、搜身、销赃、赎回全部复用28，不能为剧情把“已学一气化三清”从主角脑中掏出。来自最高组织的劫修也受真实视线、负重、追击、CD与安全区限制。误会有交证据/赔偿/第三方作证路线，蓄意反复掠夺不能靠买一瓶药立即洗白。\n\n## 7. 六幕故事线：从小委托接触大组织\n\n|幕/主角阶段|触发与同行人物|冲突和关键选择|持久后果与奖励|\n|---|---|---|---|\n|ACT01 雾林初约/R0—R1|可靠基础地图→苏晚照、牧青禾的救援线|救伤员还是先抢稀有草；存在分批完成办法，不强制二选一害人|得到可信地图、基础配方与人情；初次听到瑶光/御灵，不送神物|\n|ACT02 一矿两契/R2|墨承砚修炉、岳扶危护航，陆沉锋在矿外出现|同一陨脉有军备和民用两份契约；查清违法加采后选公开证据/重谈分配/武力争夺|矿区产出归属、运输路与NPC关系变化；真实工坊服务和进阶阵图|\n|ACT03 无字假图/R3—R4|叶听澜测绘、阮渡影密告，许照尘/莫无声可能设局|辨别被篡改图纸，公共遗迹先取资格；是否救曾骗过自己的引路者|图谱真伪档案、背叛/和解支线；唯一机缘只按原概率/唯一账产生|\n|ACT04 星门税火/R5—R6|姬玄策监察与顾听潮救船，同时可访问S06|神国担忧星潮，归墟反征用；主角发现部分税银流向私人炼兵|选择共管证据线、自治护航线或强行夺门线；航路许可不同，但保留基础返程|\n|ACT05 封印之争/R7—R8|宁守真和温知行带来相互矛盾的古卷|太初要求续封，无相要公开，天工发现旧星门耗能失衡；证据表明禁制既有保护也被滥用|可形成局部技术改造联盟，或引发有限势力战争；不是一句话说服十位领袖|\n|ACT06 十方问鼎/R9|前五幕证据与幸存关系决定谁愿出面|神皇主张集中调度，归墟要求星域自治；无相激进派欲抢控制核心，赤霄军队内部出现分歧|集中秩序/诸域共治/公开道统等结局分支；可比武或战争解决部分节点，无需屠尽十强|\n\n最终大战的目标是星门控制核心与星潮应对，不要求把有居民星球打爆。道源威能用受限场景、阵眼和天体事件表达；毁星仍遵守既有无人试炼星范围。神皇99级的强度通过能力、范围与可读破绽体现，不靠删除玩家输入制造不可战胜。\n\n## 8. 可选私人故事与重玩差异\n\n- **《一纸军令》裴照野**：早期护民结缘，后期奉命追捕主角；带齐证据可使其拒令失职，缺证据则真刀真枪交战。击败可留命、押送或斩杀，各有不同后续联系人。\n- **《断图留名》叶听澜与许照尘**：玩家可提前发现篡改，也可能被伏击后循失物记录追赃。许照尘死亡后不能再生成他卖过的地图原件，接任鉴图师有独立身份。\n- **《影下归人》阮渡影**：来自无相却持续帮助主角；揭穿其身份会改变其行动安全，不等于她立即变坏。保密、公开作证或出卖分别通向同行、庇护或仇敌线。\n- **《契不为枷》牧青禾与赫连驭**：救兽和强制契约两条路线在兽潮时交汇；可用真实替代防线证明无需奴役，也可挑战赫连驭。奖励是契约知识与合法材料，不强夺玩家活宠。\n\n相同组织框架下，任务地点、真实运输货单、游历者介入和机缘候选可按世界种子变化。具名人物的基本信念不每次见面重抽，玩家行为改变关系；支线顺序可变，已死亡者不会回来主持下一幕，后续用不同幸存者/档案提供关键线索。\n\n## 9. 3D、界面与实现边界\n\n顶层势力以建筑轮廓、纹章、服饰材质和动作礼仪区分：昊宸金黑日轮、太初白玉闭环、归墟深蓝断环、太一青墨简牍、万象靛紫星格、天工铜灰齿纹、赤霄赤金炎冠、瑶光月白药枝、无相银灰折面、御灵青绿契纹。不得仅用衣服颜色判断NPC是否会背叛。\n\n关系页分“此人与我的关系”“所属组织态度”“已知证据”，不显示未揭露的阴谋脚本。邀请组队、任务分账、拒绝征用和决斗均有明确选项；菜单结束先恢复镜头与输入，随后才允许敌对前摇。同行需配行走、地图查看、协同攻击、救援、分歧、离队、投降和倒地动作，不用聊天头像冒充组队。\n\n新增FactionDefinition(TF)、BranchSectDefinition(SS)、LeaderDefinition、PersonalRelation、EvidenceEvent、CompanionContract、StoryAct和SuccessionRecord。组织敌对关系独立于个人仇怨；继任者得到职位而非死者物品/技能副本。首轮只接ACT01两位低阶代表及一条协作任务，顶层组织先以档案/信物体现，不要求当前前期模块一次实现道源战争。\n\n验收：十强分组1/2/3/4及等级99/98/97/97/96/96/95/95/95/95完全一致；30个新固定ID不重复；20支门派有唯一直属组织；六宗门关联不变更原服务；亲善与阵营敌意可并存；同伴不免费刷战利品；背叛不在菜单中击杀；死者不复活、原器不复制；任务分支失败仍有关键知识和返程路线。\n","html":"\u003ch1>29 · 一神国、二洞天、三学府、四圣地\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-29-v001.svg\" alt=\"十方格局：从下属门派走向星域\">\u003c/p>\u003cp>\u003cem>图解：既有六宗门保留服务；新领袖与支线人物共30名，固定名册增至68名。\u003c/em>\u003c/p>\u003cp>2026-09-12；世界观与任务设计增补，未实装。本章保留用户指定的十位最高领袖战力，连接既有六宗门、动态游历者和跨星路线。阵营不是善恶标签，个人关系、宗门身份与实际行为分别记录。\u003c/p>\u003ch2>1. 等级与称谓对齐\u003c/h2>\u003cp>沿用十境各十级：\u003ccode>总等级=10×境界编号r+本境小级l\u003c/code>。后天R0是1—10级，道源R9是91—100级。因此99级=道源九级，98级=道源八级，97级=道源七级，96级=道源六级，95级=道源五级。\u003c/p>\u003cp>道源内部叙事称谓：91—93初阶、94—96中阶（96为中阶顶峰）、97—99大成、100圆满。本章的“道源大成”是角色境界段位，与技能的入门/小成/精通/大成/圆满分属两个字段，不能混用。领袖数字是常态参考战力等级，装备/阵法/伤势影响实战，仍通过19的属性管线结算；不额外再乘一次“神皇倍率”。\u003c/p>\u003cp>神皇是当前已知NPC中单体最强者，99级；不新增一个隐藏100级NPC压过用户设定，也不阻止玩家将来达到100级。最高领袖不会按主角等级自动缩放或被低阶教学习惯动作击杀。\u003c/p>\u003ch2>2. 十大顶级组织与最高人物\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>组织ID\u003c/th>\u003cth>类别/组织\u003c/th>\u003cth>最高人物（固定NPC）\u003c/th>\u003cth>总等级\u003c/th>\u003cth>道源阶段\u003c/th>\u003cth>根本主张与矛盾\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TF01\u003c/td>\u003ctd>神国·昊宸神国\u003c/td>\u003ctd>N39 姬天衡·神皇\u003c/td>\u003ctd>99\u003c/td>\u003ctd>大成（九级）\u003c/td>\u003ctd>统一星门、抵御星潮；中央秩序也形成通行垄断与边星重税\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF02\u003c/td>\u003ctd>洞天·太初玄都洞天\u003c/td>\u003ctd>N40 玄微子·太初老祖\u003c/td>\u003ctd>98\u003c/td>\u003ctd>大成（八级）\u003c/td>\u003ctd>保存道统、维护封印；封存知识与公开求道长期冲突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF03\u003c/td>\u003ctd>洞天·归墟洞天\u003c/td>\u003ctd>N41 顾长渊·归墟老祖\u003c/td>\u003ctd>97\u003c/td>\u003ctd>大成（七级）\u003c/td>\u003ctd>边星自治、归还被征用的灵脉；激进派可能不顾后果拆星门\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF04\u003c/td>\u003ctd>学府·太一学府\u003c/td>\u003ctd>N42 闻道衡·院长\u003c/td>\u003ctd>97\u003c/td>\u003ctd>大成（七级）\u003c/td>\u003ctd>传承应向通过验证的人开放；坚持论证而非血统定资格\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF05\u003c/td>\u003ctd>学府·万象学府\u003c/td>\u003ctd>N43 叶知微·院长\u003c/td>\u003ctd>96\u003c/td>\u003ctd>中阶顶峰（六级）\u003c/td>\u003ctd>实地观测、档案与星图共享；争议在于危险知识如何公开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF06\u003c/td>\u003ctd>学府·天工学府\u003c/td>\u003ctd>N44 墨天机·院长\u003c/td>\u003ctd>96\u003c/td>\u003ctd>中阶顶峰（六级）\u003c/td>\u003ctd>科技与炼器并进、用工程减少灵脉消耗；实验失败可能伤人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF07\u003c/td>\u003ctd>圣地·赤霄圣地\u003c/td>\u003ctd>N45 陆焚霄·圣主\u003c/td>\u003ctd>95\u003c/td>\u003ctd>中阶（五级）\u003c/td>\u003ctd>尚武、炼兵与守护航道；军备需求侵蚀矿脉和边地权益\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF08\u003c/td>\u003ctd>圣地·瑶光圣地\u003c/td>\u003ctd>N46 苏映寒·圣主\u003c/td>\u003ctd>95\u003c/td>\u003ctd>中阶（五级）\u003c/td>\u003ctd>疗愈、生态与中立救援；必须面对战争双方都需要药的困局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF09\u003c/td>\u003ctd>圣地·无相圣地\u003c/td>\u003ctd>N47 闻无相·圣主\u003c/td>\u003ctd>95\u003c/td>\u003ctd>中阶（五级）\u003c/td>\u003ctd>认为道统垄断必须打破，擅长隐匿与情报；部分门人以此为夺宝借口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TF10\u003c/td>\u003ctd>圣地·御灵圣地\u003c/td>\u003ctd>N48 牧天青·圣主\u003c/td>\u003ctd>95\u003c/td>\u003ctd>中阶（五级）\u003c/td>\u003ctd>人兽契约与共同生存；与强制奴役灵兽、掠夺兽巢的组织冲突\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>根基分别为：神国天都“曜京”、太初“玄都内天”、归墟“沉星内海”、太一“问道洲”、万象“万象星观测环”、天工“铸星环”、赤霄“炎冠星”、瑶光“澄明星”、无相“无名渡”、御灵“万灵洲”。它们通过现有空衡/万象/寂曜航路逐步接触，不是开局同时建十张大地图。高阶未开放时以文书、代表和封锁航路体现组织存在。\u003c/p>\u003ch2>3. 对立、合作与互相牵制\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>双方\u003c/th>\u003cth>现状\u003c/th>\u003cth>冲突焦点\u003c/th>\u003cth>合作窗口/可变化结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>昊宸—归墟\u003c/td>\u003ctd>核心对立，局部停战\u003c/td>\u003ctd>星门控制、征用灵脉与自治权\u003c/td>\u003ctd>星潮来袭时共守边界；主角证据可促成限期共管\u003c/td>\u003c/tr>\u003ctr>\u003ctd>昊宸—赤霄\u003c/td>\u003ctd>军备同盟\u003c/td>\u003ctd>神国要服从，赤霄要矿权与军事自主\u003c/td>\u003ctd>供应受阻会裂盟，但不随机一夜互相灭门\u003c/td>\u003c/tr>\u003ctr>\u003ctd>昊宸—太一\u003c/td>\u003ctd>合作培养，制度冲突\u003c/td>\u003ctd>神国欲按出身授法，学府主张公开试炼\u003c/td>\u003ctd>共同调查边军贪腐，改革路线可改善关系\u003c/td>\u003c/tr>\u003ctr>\u003ctd>太初—无相\u003c/td>\u003ctd>长期敌对\u003c/td>\u003ctd>封存禁法是否正当、旧道统失窃案\u003c/td>\u003ctd>证明部分封印确有危险后可交换档案，激进者仍不接受\u003c/td>\u003c/tr>\u003ctr>\u003ctd>太初—太一\u003c/td>\u003ctd>同源异见\u003c/td>\u003ctd>守成秘传与开放研习\u003c/td>\u003ctd>共同主持不依赖血统的承载试验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>归墟—无相\u003c/td>\u003ctd>机会性合作，互不信任\u003c/td>\u003ctd>前者要自治，后者有人想趁乱夺原器\u003c/td>\u003ctd>主角可识破假旗袭击，切断激进派合作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>天工—赤霄\u003c/td>\u003ctd>资源竞争\u003c/td>\u003ctd>陨脉用作公共设施还是战争炼兵\u003c/td>\u003ctd>一起修复防御设施；矿区污染证据决定后续契约\u003c/td>\u003c/tr>\u003ctr>\u003ctd>天工—御灵\u003c/td>\u003ctd>技术伦理争议\u003c/td>\u003ctd>灵兽能芯实验、鞍具与自主契约\u003c/td>\u003ctd>完成无伤害替代试验可形成长期合作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>瑶光—赤霄\u003c/td>\u003ctd>救援中立下的摩擦\u003c/td>\u003ctd>战地采药、占领药谷和伤员撤离\u003c/td>\u003ctd>允许医疗走廊换取限量补给，任何一方违约都留后果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>御灵—无相\u003c/td>\u003ctd>针对具体掠夺团的敌意\u003c/td>\u003ctd>盗卵与伪造契约，不把所有无相弟子都定罪\u003c/td>\u003ctd>无相内部告密者可帮助救兽并获得庇护\u003c/td>\u003c/tr>\u003ctr>\u003ctd>万象—各方\u003c/td>\u003ctd>有限中立，掌握证据\u003c/td>\u003ctd>星图、战争档案与消息封锁\u003c/td>\u003ctd>只公开有依据的信息；拒绝伪造记录，即使主角请求\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>没有单一“好人联盟/坏人联盟”。神国也有保护平民的军官，归墟也有伤害商旅的极端派；瑶光中也可能有人倒卖救命丹。阵营立场由利益与历史决定，个人能违抗上级并承担职位/追捕后果。\u003c/p>\u003ch2>4. 既有六宗门接在哪一层\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>既有宗门\u003c/th>\u003cth>上层关系\u003c/th>\u003cth>保持的独立性\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S01 玄衡武院\u003c/td>\u003ctd>太一学府的边星合作武院，受天工教学资助\u003c/td>\u003ctd>保留N27/N28和科技营地教学，不因外交恶化关闭基础教程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S02 青岚剑宗\u003c/td>\u003ctd>太初玄都的外传支系\u003c/td>\u003ctd>剑宗内部也有开放派，可推荐主角访学太一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S03 赤炉门\u003c/td>\u003ctd>天工学府认证工坊，同时承接赤霄订单\u003c/td>\u003ctd>矿脉任务让玩家实际面对两方利益，非自动归军队所有\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S04 回春谷\u003c/td>\u003ctd>瑶光圣地的医道支脉\u003c/td>\u003ctd>沿用N33/N34和既有丹方，不强迫玩家加入才能救命\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S05 御灵山\u003c/td>\u003ctd>御灵圣地的边星契约道场\u003c/td>\u003ctd>保留同一宠物双模式和N35/N36服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S06 太虚星宫\u003c/td>\u003ctd>万象学府参与、神国许可的空衡星门研究机构\u003c/td>\u003ctd>既受许可限制又保留档案责任；不是十强之外另一个顶级统治组织\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>顶层人物的等级不意味着旗下所有门人都是道源。下层弟子依所在地区自然分布R0—R5，高阶星区才常见R6以上；使者投影只传话，不具备远程秒杀战斗能力。\u003c/p>\u003ch2>5. 二十个下属门派与关系NPC\u003c/h2>\u003cp>下表新增20名可建立个人关系的具名NPC，加上10位最高人物，固定设计名册由38增至68。现有38人的编号与任务不重写。下属门派SS01—SS20是支线组织，当前不新增20套玩家入门职业；六宗门仍是首轮完整加入/兑换系统。\u003c/p>\u003cp>“初遇”给定本体阶段，任务重逢若有成长要记录修炼经历，不随主角自动补级。高级本体出现在低阶剧情时只通过投影/信使，不作为免费高阶战斗队友。友善/敌对倾向是作者配置，玩家看到行为后才形成判断。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>门派ID/名字\u003c/th>\u003cth>直属顶层\u003c/th>\u003cth>具名NPC/初遇本体\u003c/th>\u003cth>与主角合作的具体任务\u003c/th>\u003cth>可能结怨、攻击的具体原因\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SS01 镇辰府\u003c/td>\u003ctd>昊宸\u003c/td>\u003ctd>N49 裴照野·巡边使，R2三级\u003c/td>\u003ctd>护送灾民，和主角并肩守撤离口\u003c/td>\u003ctd>主角确实劫掠平民或伪造军令后追捕；不会仅因拒绝入伍攻击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS02 天衡司\u003c/td>\u003ctd>昊宸\u003c/td>\u003ctd>N50 姬玄策·监察使，R4二级\u003c/td>\u003ctd>合作查星门走私，交换通行证据\u003c/td>\u003ctd>受密令没收未认主禁器，遭拒后可进入有预告争夺；可用证据说服其违令\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS03 守一门\u003c/td>\u003ctd>太初\u003c/td>\u003ctd>N51 宁守真·守印弟子，R1七级\u003c/td>\u003ctd>修复裂缝，教正确封印顺序\u003c/td>\u003ctd>主角破坏有证实危险的封印会阻止，不因学其他宗功法敌视\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS04 藏虚观\u003c/td>\u003ctd>太初\u003c/td>\u003ctd>N52 沈藏岳·藏卷执事，R3三级\u003c/td>\u003ctd>查找失窃残卷、共同过镜阵\u003c/td>\u003ctd>本人私吞传承，发现主角持关键残图时可能伏击夺图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS05 归潮盟\u003c/td>\u003ctd>归墟\u003c/td>\u003ctd>N53 顾听潮·渡舟队长，R2一级\u003c/td>\u003ctd>救助被重税拖垮的商队，提供绕行图\u003c/td>\u003ctd>玩家出卖安全路线致难民受害后绝交/交战\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS06 沉星剑门\u003c/td>\u003ctd>归墟\u003c/td>\u003ctd>N54 陆沉锋·先锋，R3一级\u003c/td>\u003ctd>袭击掠夺灵脉的非法采场\u003c/td>\u003ctd>将无辜补给船也列目标，主角阻止其爆破后可能决斗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS07 明心书院\u003c/td>\u003ctd>太一\u003c/td>\u003ctd>N55 温知行·游学弟子，R1四级\u003c/td>\u003ctd>一起做遗迹辨伪、保全证据\u003c/td>\u003ctd>主角杀伤其同伴且拒绝解释，关系下降并依法追责\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS08 问道剑院\u003c/td>\u003ctd>太一\u003c/td>\u003ctd>N56 卫争鸣·试剑弟子，R2五级\u003c/td>\u003ctd>先比武再共闯剑阵，互相救援可成挚友\u003c/td>\u003ctd>争排名先走规则内比武；只有私人仇怨升级才野外攻击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS09 星图院\u003c/td>\u003ctd>万象\u003c/td>\u003ctd>N57 叶听澜·勘图师，R2二级\u003c/td>\u003ctd>共同测绘地宫、出售经核实地图\u003c/td>\u003ctd>主角泄露避难点给劫修后拒绝合作，不无证据全图通缉\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS10 千鉴阁\u003c/td>\u003ctd>万象\u003c/td>\u003ctd>N58 许照尘·鉴图执事，R3四级\u003c/td>\u003ctd>鉴定残图，追索赃物流转\u003c/td>\u003ctd>为偿债伪造一条安全路线，暴露后可能逃走或雇劫修灭证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS11 星炉宗\u003c/td>\u003ctd>天工\u003c/td>\u003ctd>N59 墨承砚·炉师，R2三级\u003c/td>\u003ctd>修炉、击退矿区怪群，共建节能阵器\u003c/td>\u003ctd>主角掠走救援用核心导致停炉后讨还，可赔偿和解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS12 百机门\u003c/td>\u003ctd>天工\u003c/td>\u003ctd>N60 韩断机·试验执事，R3五级\u003c/td>\u003ctd>合作测试无伤害兽用鞍具\u003c/td>\u003ctd>偷偷使用强制抽灵装置，被揭发后带机关武器攻击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS13 烽岳宗\u003c/td>\u003ctd>赤霄\u003c/td>\u003ctd>N61 岳扶危·护航统领，R3三级\u003c/td>\u003ctd>保卫航路，救两方伤员，重视守约\u003c/td>\u003ctd>会因上级征用令与主角对峙，可通过替代物资避免冲突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS14 血铸门\u003c/td>\u003ctd>赤霄\u003c/td>\u003ctd>N62 炎夺岳·夺矿执事，R4一级\u003c/td>\u003ctd>迫于兽潮可暂时与主角合作\u003c/td>\u003ctd>觊觎主角陨核/原器，主动布设夺宝伏击，是可斩杀的长期对手\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS15 济世山\u003c/td>\u003ctd>瑶光\u003c/td>\u003ctd>N63 苏晚照·行医弟子，R1五级\u003c/td>\u003ctd>采药、救援、护送伤员，可同行治疗\u003c/td>\u003ctd>目击主角滥杀后离队，必要时保护受害者对抗主角\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS16 寒灯谷\u003c/td>\u003ctd>瑶光\u003c/td>\u003ctd>N64 柳寒灯·药库执事，R3二级\u003c/td>\u003ctd>采购短缺药材，提供可靠疗伤线索\u003c/td>\u003ctd>倒卖赈灾丹药，主角掌握货单后可能找人抢夺证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS17 渡影楼\u003c/td>\u003ctd>无相\u003c/td>\u003ctd>N65 阮渡影·潜行弟子，R2四级\u003c/td>\u003ctd>救回被盗兽卵、揭穿假旗袭击，可能背叛本门保护主角\u003c/td>\u003ctd>主角出卖其真实身份后失去信任，生死追捕由实际证据触发\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS18 无面阁\u003c/td>\u003ctd>无相\u003c/td>\u003ctd>N66 莫无声·猎宝人，R4三级\u003c/td>\u003ctd>可买情报或达成一次停战交易\u003c/td>\u003ctd>按已观察的宝物设局，使用伪名；身份揭露后仍是同一实例\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS19 青梧苑\u003c/td>\u003ctd>御灵\u003c/td>\u003ctd>N67 牧青禾·护兽弟子，R1六级\u003c/td>\u003ctd>共同孵蛋、安抚暴走灵兽、救援契约宠\u003c/td>\u003ctd>若主角抢卵贩卖或伤害受保护兽群，会护兽反击\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SS20 镇兽谷\u003c/td>\u003ctd>御灵\u003c/td>\u003ctd>N68 赫连驭·镇兽执事，R3六级\u003c/td>\u003ctd>兽潮时帮助筑防线，早期看似可靠\u003c/td>\u003ctd>推行强制契约，企图夺主角封存异格蛋；活契约宠不变成可抢背包物\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>不是每个组织都固定配“一个好人一个坏人”：卫争鸣是可化解的竞争者，裴照野可能因主角行为变敌，阮渡影来自可疑组织却可成为可靠伙伴。关系好的NPC也有底线；关系差不必一见面就战斗。\u003c/p>\u003ch2>6. 关系、组队与敌意怎么算\u003c/h2>\u003cp>每个具名人物分别记录信任T∈[-100,100]、个人仇怨G∈[0,100]、组织声望F∈[-100,100]和证据事件。T与F不能相互覆盖：玩家得罪神国，不会自动让曾被救过的裴照野忘记恩情；他可能拒绝执行不当追捕，也可能只能暗中提供消息。\u003c/p>\u003cp>首次实际救援T+15、履行一次高风险约定+10、普通交易不刷信任；同事件只计一次。毁约T−15，抢夺已确认属于该人的财物T−40且G+40；恶意杀害其亲友需证据才触发G+70。T≥30且满足个人任务可邀同行，T≥60可解锁互救支线；T≤−30仅表示拒绝合作，主动攻击还需G≥60或明确的通缉/夺宝行为动机。罪行可由目击、真实物证和供述传播，不全宇宙瞬时同步。\u003c/p>\u003cp>早期玩家最多1名临时人类同伴，与\u003cstrong>同一只当前宠物\u003c/strong>并存，均计总AI预算。同行前明确任务、分配、期限、撤离条件。队友会真实行走、攻击、耗药、负重、受伤；超过主角两境的本体不作为常规可招募战斗队友，特殊救援演出不产生可刷经验/材料。分成以实际物品清单分配，唯一物提前约定归属，不给每人复制一份。\u003c/p>\u003cp>同伴倒地先进入可救援状态，危险任务明确告知可能永久死亡；非战斗过场不突然秒杀队友。可斩杀的支线人物死亡后不会改名复活；职位可由新人物接任，原恩怨、任务记录和唯一物账保留。原38名基础服务NPC的保护边界保持，新30名中领袖只在相应终局事件开放实战，支线人物是否可杀在事件定义声明。\u003c/p>\u003cp>背叛、抢夺、搜身、销赃、赎回全部复用28，不能为剧情把“已学一气化三清”从主角脑中掏出。来自最高组织的劫修也受真实视线、负重、追击、CD与安全区限制。误会有交证据/赔偿/第三方作证路线，蓄意反复掠夺不能靠买一瓶药立即洗白。\u003c/p>\u003ch2>7. 六幕故事线：从小委托接触大组织\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>幕/主角阶段\u003c/th>\u003cth>触发与同行人物\u003c/th>\u003cth>冲突和关键选择\u003c/th>\u003cth>持久后果与奖励\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ACT01 雾林初约/R0—R1\u003c/td>\u003ctd>可靠基础地图→苏晚照、牧青禾的救援线\u003c/td>\u003ctd>救伤员还是先抢稀有草；存在分批完成办法，不强制二选一害人\u003c/td>\u003ctd>得到可信地图、基础配方与人情；初次听到瑶光/御灵，不送神物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACT02 一矿两契/R2\u003c/td>\u003ctd>墨承砚修炉、岳扶危护航，陆沉锋在矿外出现\u003c/td>\u003ctd>同一陨脉有军备和民用两份契约；查清违法加采后选公开证据/重谈分配/武力争夺\u003c/td>\u003ctd>矿区产出归属、运输路与NPC关系变化；真实工坊服务和进阶阵图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACT03 无字假图/R3—R4\u003c/td>\u003ctd>叶听澜测绘、阮渡影密告，许照尘/莫无声可能设局\u003c/td>\u003ctd>辨别被篡改图纸，公共遗迹先取资格；是否救曾骗过自己的引路者\u003c/td>\u003ctd>图谱真伪档案、背叛/和解支线；唯一机缘只按原概率/唯一账产生\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACT04 星门税火/R5—R6\u003c/td>\u003ctd>姬玄策监察与顾听潮救船，同时可访问S06\u003c/td>\u003ctd>神国担忧星潮，归墟反征用；主角发现部分税银流向私人炼兵\u003c/td>\u003ctd>选择共管证据线、自治护航线或强行夺门线；航路许可不同，但保留基础返程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACT05 封印之争/R7—R8\u003c/td>\u003ctd>宁守真和温知行带来相互矛盾的古卷\u003c/td>\u003ctd>太初要求续封，无相要公开，天工发现旧星门耗能失衡；证据表明禁制既有保护也被滥用\u003c/td>\u003ctd>可形成局部技术改造联盟，或引发有限势力战争；不是一句话说服十位领袖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACT06 十方问鼎/R9\u003c/td>\u003ctd>前五幕证据与幸存关系决定谁愿出面\u003c/td>\u003ctd>神皇主张集中调度，归墟要求星域自治；无相激进派欲抢控制核心，赤霄军队内部出现分歧\u003c/td>\u003ctd>集中秩序/诸域共治/公开道统等结局分支；可比武或战争解决部分节点，无需屠尽十强\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>最终大战的目标是星门控制核心与星潮应对，不要求把有居民星球打爆。道源威能用受限场景、阵眼和天体事件表达；毁星仍遵守既有无人试炼星范围。神皇99级的强度通过能力、范围与可读破绽体现，不靠删除玩家输入制造不可战胜。\u003c/p>\u003ch2>8. 可选私人故事与重玩差异\u003c/h2>\u003cul>\u003cli>\u003cstrong>《一纸军令》裴照野\u003c/strong>：早期护民结缘，后期奉命追捕主角；带齐证据可使其拒令失职，缺证据则真刀真枪交战。击败可留命、押送或斩杀，各有不同后续联系人。\u003c/li>\u003cli>\u003cstrong>《断图留名》叶听澜与许照尘\u003c/strong>：玩家可提前发现篡改，也可能被伏击后循失物记录追赃。许照尘死亡后不能再生成他卖过的地图原件，接任鉴图师有独立身份。\u003c/li>\u003cli>\u003cstrong>《影下归人》阮渡影\u003c/strong>：来自无相却持续帮助主角；揭穿其身份会改变其行动安全，不等于她立即变坏。保密、公开作证或出卖分别通向同行、庇护或仇敌线。\u003c/li>\u003cli>\u003cstrong>《契不为枷》牧青禾与赫连驭\u003c/strong>：救兽和强制契约两条路线在兽潮时交汇；可用真实替代防线证明无需奴役，也可挑战赫连驭。奖励是契约知识与合法材料，不强夺玩家活宠。\u003c/li>\u003c/ul>\u003cp>相同组织框架下，任务地点、真实运输货单、游历者介入和机缘候选可按世界种子变化。具名人物的基本信念不每次见面重抽，玩家行为改变关系；支线顺序可变，已死亡者不会回来主持下一幕，后续用不同幸存者/档案提供关键线索。\u003c/p>\u003ch2>9. 3D、界面与实现边界\u003c/h2>\u003cp>顶层势力以建筑轮廓、纹章、服饰材质和动作礼仪区分：昊宸金黑日轮、太初白玉闭环、归墟深蓝断环、太一青墨简牍、万象靛紫星格、天工铜灰齿纹、赤霄赤金炎冠、瑶光月白药枝、无相银灰折面、御灵青绿契纹。不得仅用衣服颜色判断NPC是否会背叛。\u003c/p>\u003cp>关系页分“此人与我的关系”“所属组织态度”“已知证据”，不显示未揭露的阴谋脚本。邀请组队、任务分账、拒绝征用和决斗均有明确选项；菜单结束先恢复镜头与输入，随后才允许敌对前摇。同行需配行走、地图查看、协同攻击、救援、分歧、离队、投降和倒地动作，不用聊天头像冒充组队。\u003c/p>\u003cp>新增FactionDefinition(TF)、BranchSectDefinition(SS)、LeaderDefinition、PersonalRelation、EvidenceEvent、CompanionContract、StoryAct和SuccessionRecord。组织敌对关系独立于个人仇怨；继任者得到职位而非死者物品/技能副本。首轮只接ACT01两位低阶代表及一条协作任务，顶层组织先以档案/信物体现，不要求当前前期模块一次实现道源战争。\u003c/p>\u003cp>验收：十强分组1/2/3/4及等级99/98/97/97/96/96/95/95/95/95完全一致；30个新固定ID不重复；20支门派有唯一直属组织；六宗门关联不变更原服务；亲善与阵营敌意可并存；同伴不免费刷战利品；背叛不在菜单中击杀；死者不复活、原器不复制；任务分支失败仍有关键知识和返程路线。\u003c/p>"}];const nav=document.querySelector('nav'),article=document.querySelector('article'),search=document.querySelector('#search');let active='';function menu(){const q=search.value.trim().toLowerCase();const list=chapters.filter(c=>(c.title+' '+c.text).toLowerCase().includes(q));nav.innerHTML=list.map(c=>'<a href="#'+c.file+'" class="'+(c.file===active?'active':'')+'">'+c.title+'</a>').join('');document.querySelector('#count').textContent=list.length+' / '+chapters.length+' 章';}function show(){const f=decodeURIComponent(location.hash.slice(1));const i=Math.max(0,chapters.findIndex(c=>c.file===f));const c=chapters[i];active=c.file;article.innerHTML='<div class="notice">设计稿 · 数值可复核，玩法待实机验证</div>'+c.html+'<div class="next">'+(i?'<a href="#'+chapters[i-1].file+'">← 上一章</a>':'<span></span>')+(i<chapters.length-1?'<a href="#'+chapters[i+1].file+'">下一章 →</a>':'')+'</div>';menu();window.scrollTo(0,0);}addEventListener('hashchange',show);search.addEventListener('input',menu);document.querySelector('#print').onclick=()=>print();show();</script></html>
