20 m\u003c/td>\u003ctd>18\u003c/td>\u003ctd>90（仅合格天马等）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R1\u003c/td>\u003ctd>60 m\u003c/td>\u003ctd>28\u003c/td>\u003ctd>140\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R2\u003c/td>\u003ctd>120 m\u003c/td>\u003ctd>42\u003c/td>\u003ctd>220\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R3\u003c/td>\u003ctd>200 m\u003c/td>\u003ctd>65\u003c/td>\u003ctd>350\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R4\u003c/td>\u003ctd>300 m\u003c/td>\u003ctd>85\u003c/td>\u003ctd>550\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R5\u003c/td>\u003ctd>800 m\u003c/td>\u003ctd>120\u003c/td>\u003ctd>850\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R6\u003c/td>\u003ctd>1,500 m\u003c/td>\u003ctd>180\u003c/td>\u003ctd>1,200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R7\u003c/td>\u003ctd>3,000 m\u003c/td>\u003ctd>280\u003c/td>\u003ctd>1,800\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R8\u003c/td>\u003ctd>地表 3,000 m；真空另验\u003c/td>\u003ctd>地表350；星空1,000\u003c/td>\u003ctd>2,500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>R9\u003c/td>\u003ctd>地表 3,000 m；真空另验\u003c/td>\u003ctd>地表450；星空2,500\u003c/td>\u003ctd>4,000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>地表载飞高度 = 宠物上限、骑手资格上限、场景上限三者最小值。骑手 R0—R3 上限200 m，R4 300 m，R5 800 m，R6 1,500 m，R7+ 3,000 m；只有骑手 R8+ 和宠物 R8+ 同时具备护域才能载骑进真空。星空战斗档参照移动文档渐进减速，不直接以巡航速度撞进近战。\u003c/p>\u003cp>载重包含骑手基准75 kg＋身上有效负重＋鞍具（轻飞鞍3 kg起）＋宠物驮架货物；PET17 的R0基础90 kg起点针对轻装骑手，超载明确不能起飞。体型系数可在物种配置中0.8—1.5，必须写明最终额定载重。灵宠本身身体质量已算在其升力设计里，不重复加入货重。\u003c/p>\u003cp>载重比≤50%无额外惩罚，50%—100%最大速度降到80%、爬升降到65%、消耗升至135%；超过100%拒绝起飞，空中因拾物/装备变化超载则安全降落。不得通过迷你化主人背包或塞活宠进袋减重。\u003c/p>\u003ch2>4. 灵力与紧急下降\u003c/h2>\u003cp>宠物精力100，非飞行脱战可恢复；载飞消耗精力1点/秒及宠物最大灵力1%/秒，急加速再耗0.5%/秒。低境飞行不是无限代步，基础满精力约100秒；地面休息/营养恢复，不能用同一颗食物无限刷新飞行计时。高境效率可由功法改善，气耗最低保留基础65%。\u003c/p>\u003cp>余量20%预警，10%提示落点，5%启用护降储备、停止攻击与加速。最后5%不能被普通技能抢走；飞行前依据路线高度检验能否有可达应急落点，复杂空间不允许凭储备“永远滑翔”。失控/重伤时先滑翔/云托下降，骑手仍附着；地面后才能收回宠物。彻底失败用既有救援流程，不把宠物永久删掉。\u003c/p>\u003cp>宠物死亡/受伤和人物下坐骑是两套状态，落地切换须清除骑乘环视/身体方向残留；必须回归现有“下车后无需Alt即可转向”测试。人物已会御空时可主动安全离鞍转御空，需本人真气；R0空中不能直接跳下就获得同样能力。\u003c/p>\u003ch2>5. 地面跟随与空中战斗\u003c/h2>\u003cp>地面命令沿 PET 感知/路径状态运行，跟随距主人约1.5—3 m，避开准星、门口和交互点。跟随落后时先加速/绕路，不因主人奔袭就直接传送到前方；远离且脱战、不可见时才允许有提示的契纹重聚，不能用它在战斗中绕墙。\u003c/p>\u003cp>骑乘操作：W/S推进/减速，A/D侧向转向，鼠标观察；按住Alt独立环视，V切第一/第三人称；空格爬升、Ctrl下降，F在停稳落地时下骑。步行空间键原行为不变，明确按上下文切换。指令键建议 H 打开宠物命令轮盘，长按/快捷键分配在实现时做冲突检查。\u003c/p>\u003cp>骑乘空战左键为宠物基础攻击，右键锁定可见目标/瞄准，1/2为宠物主动技能；默认禁止骑手同时普通攻击再叠宠物普攻。高阶“合击章”只在短协同窗口允许人物一次合法远程技能，不是两套DPS常驻相加。\u003c/p>\u003cp>空战不是原地互扣血：接近→预告→俯冲/吐息→错身→拉升→调整方位；翼/角/口的命中体积按真实轨迹扫掠。不能在贴墙时强行转180度，转弯半径和制动有体型配置；吐息有射程、视线遮挡和每目标每段命中上限。小型 A 类空中助战可攻击地面目标，但不载人，地面怪的反制能力必须可读。\u003c/p>\u003ch2>6. 第一/第三人称与迷你形态\u003c/h2>\u003cp>第一人称锚点来自骑手鞍座头部，不是宠物头顶随意悬浮；手扶缰/鞍结构、腿部跨坐、宠物颈背前景都是真实同模型。俯冲不会让镜头跟着翻滚到晕眩，世界姿态与玩家观察分离；可设置有限/关闭镜头震动。第三人称扫掠考虑翼展、尾、地形，必要时拉高/收近，不能穿宠物胸腔。\u003c/p>\u003cp>每只宠物的完整态、骑乘态、迷你态共享 petId、外观基因、装备和纹章。迷你专用网格/比例需要保留角、羽、尾等标识，衣服有对应简化模型；不得把全尺寸鞍具直接缩小穿进脸里。战斗态缩回迷你态须脱战且无骑手/货架占用；迷你展开战斗态按15可在接敌时进行，驮架货物先卸下，否则明确拒绝迷你化；不能靠变小降低货物实际质量。\u003c/p>\u003ch2>7. 图像、视频、3D 的必交付项\u003c/h2>\u003cp>每种 PET 必须有：\u003c/p>\u003col>\u003cli>普通形态正/侧/背/3/4概念图、成年/成长期比例、迷你设计、至少三套服装分件图。\u003c/li>\u003cli>骨架/挂点图、材质与色域说明、骑乘鞍座图；不能骑乘的明确标记“不制作人座”。\u003c/li>\u003cli>\u003ccode>.blend\u003c/code> 源、\u003ccode>.glb\u003c/code> 运行资产、贴图、动画事件、碰撞/载重/翼展数据。\u003c/li>\u003cli>真实3D八角度转台视频、迷你互动视频、步行/攻击连续视频；飞行种类还需起降/骑乘/空战视频。\u003c/li>\u003cli>每次进化/服装变体的来源链、哈希、版本、测试截图和未解决问题。\u003c/li>\u003c/ol>\u003cp>概念视频可用于动势参考，但必须标记 concept，不替代实际游戏录像。生成图、示意图、Blender渲染、真实游戏截图、实际运行视频分别标类型，禁止把生成视频当成已能玩的空战演示。\u003c/p>\u003ch2>8. 不覆盖、不遗失的资产维护规则\u003c/h2>\u003cp>建议目录：\u003c/p>\u003cpre>\u003ccode>docs/pet-assets/PET09/v001/\n  concept/        # 原始生成图、参考出处、提示词\n  reviews/        # 对照、批注、决定采用/拒绝理由\n  video/          # 概念和实机录像分别命名\n  manifest.json   # 文件清单、哈希、类型、来源和依赖\nplayable/assets/pets/PET09/v001/\n  source/         # blend与原始贴图\n  runtime/        # glb、压缩贴图、动画配置\n  manifest.json\u003c/code>\u003c/pre>\u003cp>这些是目标路径，尚未制作时不创建假模型或占位空视频。每次新结果进入新版本 v002…，保留 v001；当前采用版本通过单独 registry 指针选择，不覆盖原始文件。宠物注册表33条允许 \u003ccode>planned\u003c/code> 状态，无文件时不得标 ready。\u003c/p>\u003cp>下载工具/插件产物后，先复制到稳定项目路径、确认可打开、计算 SHA-256、记录来源任务/提示词/积分消耗与生成时间，再引用。临时目录、远程任务链接、聊天图片都不能作为唯一保存地址；视频要同时保留原文件与轻量预览版。禁止将密钥写进 manifest 或提示词归档。\u003c/p>\u003cp>每个 manifest 字段至少含 assetId、petSpeciesId、version、kind、relativePath、bytes、sha256、sourceAssetIds、sourceMethod、license/sourceUrl、createdAt、reviewStatus、runtimeCompatibleVersion。模型引用贴图、骑具引用骨架、视频引用确切运行构建，避免“有图却不知对应哪版模型”。\u003c/p>\u003cp>阶段完成前验证文件存在、哈希匹配、解码/导入成功及引用完整。原图、源模型、旧版视频原则上保留；空间不足先报告体积、列出可再生缓存，再按已批准清理范围处理，不自动删除唯一源文件。Git只保存小型源码/清单；大资产未来选择Git LFS或有版本的对象存储，不能把“在仓库目录”误认为已备份。\u003c/p>\u003cp>备份目标为一份工作副本＋一份独立位置副本，备份后需按哈希校验并抽样恢复。没有已配置备份目的地时明确写 \u003ccode>backupStatus:not_configured\u003c/code>，不能承诺绝不会丢。当前媒体盘点只证明当时文件存在，不是独立备份；用户已有图片/视频/模型不得因本轮新增宠物而替换或清理。\u003c/p>\u003ch2>9. 骨架、服装和性能预算\u003c/h2>\u003cp>基础家族：四足猫科、鹿马科、猪/厚躯、鸟翼、游龙、龟蛇双体、球形多肢、鲲鹏双形。毕方单足、帝江六足四翼、开明多首等需专用扩展。成年普通体30k—60k三角、迷你8k—18k、骑乘重点体60k—100k为候选上限；最多3个基础材质＋2个服装材质，普通2K贴图，远处LOD与1K降级。\u003c/p>\u003cp>每种最低地面动画：待机、走/跑、左右转、攻击、生效/收招、受击、倒地、恢复、喂食、呼名、亲昵、睡眠、变形。载飞另加起飞/巡航/转弯/爬升/下降/急停/落地/疲劳滑翔；骑手有上/下骑、稳定坐姿、缰绳跟随和空战施放。\u003c/p>\u003cp>宠物与敌人共用全场预算，但为一个战斗宠保留资源，不因敌人达到上限消失；多人阶段默认仅附近队友显示完整战宠，远处同模式模型做LOD简化，不能将战斗模式改成迷你跟随模式，不加载所有33种全分辨率。不得为性能无提示隐藏具有伤害判定的敌我实体。\u003c/p>\u003ch2>10. 制作顺序与证据\u003c/h2>\u003cp>PA0：PET09 概念→完整/迷你模型→命名/喂食/跟随视频。PA1：地面战斗与倒地恢复。PA2：PET17 载重/鞍座/后天载飞，验证第一/第三视角。PA3：PET13 翼展/单足/俯冲空战。PA4：逐家族扩展33种，边做边归档，不能一口气花积分生成33个未验证模型。\u003c/p>\u003cp>本轮只设计并盘点已存在媒体，不生成宠物图片/视频/模型，也未配置独立备份。每个PA切片都必须更新资产清单和用户可复验步骤。\u003c/p>\u003cp>本轮实际记录：\u003ca href=\"../pet-assets/EXISTING_ASSETS_20260912_v001.json\">现有资产盘点 v001\u003c/a> 共130份、213,423,363字节，包含图像/视频/模型/音频及嵌入资产模块；不表示130份都是宠物资产或已重新验收。对应 \u003ca href=\"../pet-assets/PET_ASSET_REGISTRY.json\">33种宠物注册表\u003c/a> 当前全部 planned、无伪造版本。后续执行 \u003ccode>node tools/inventory-design-assets.cjs\u003c/code> 生成新编号盘点，不覆盖旧快照；注册表已有数据时脚本不覆盖人工登记的宠物版本。\u003c/p>"},{"file":"18_NAMES_PET_STYLE_AND_IDENTITY.md","title":"D3-18 · 玩家命名、宠物个性装扮与多人辨识","text":"# D3-18 · 玩家命名、宠物个性装扮与多人辨识\n\n\u003c!-- illustrated-overview:start -->\n![一眼认出自己的宠物](media/diagram-18-v001.svg)\n\n*图解：名字可以相同；所有权、契约与库存ID不能相同。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；拟实现。依赖 [宠物](15_PET_PROGRESSION_AND_BOND.md)、[3D归档](17_PET_3D_FLIGHT_AND_ASSETS.md)、[联网](14_OFFLINE_AND_ONLINE_BOUNDARY.md)。33是物种数，不是只能有33种外观或33只唯一宠物。\n\n## 1. 玩家与宠物的名字\n\n创建角色时输入显示名，建议2—12个可见字符（中文/字母/数字，允许内部空格），长度按Unicode字素簇计算，不按UTF-16长度把汉字和表情截断。默认提供可编辑候选，第一次开始前可确认。拒绝空白名、控制字符、不可见方向控制、脚本/HTML内容；界面全部按纯文本渲染。\n\n宠物破壳/契约后可起1—12字昵称；可暂用“幼狐”等默认称谓，之后安全区免费改名。玩家改显示名也保留 characterId，首次单机不收费；未来联网改名须服务器去重/冷却策略，但不通过改名改变成长、机缘或交易身份。\n\n名字不是主键。稳定关系为 `characterId → petInstanceId → speciesId`，界面可显示“阿岚的青禾 · 九尾狐”。多人重名允许，通过服务器分配短识别码区分，例如“阿岚·7K2M”；不把UUID全文盖在每个人头上。模仿官方/系统样式的前缀和高亮标记不能通过输入名字获得。\n\n## 2. 同种宠物的外观差异\n\n每个体有固定 `appearanceSeed`，生成可调的毛羽主/辅色、花纹图层、眼色、角/鬃/尾装饰变体和轻微体型差异。体型变体控制在同档±8%，命中体积和骑具随真实尺寸配置，不通过装扮变成难命中的超小战宠。\n\n玩家可用染料/兽装服务调整合法色域与花纹，但不能抹掉物种关键轮廓。青龙仍有青系主视觉、白虎保留主要白底/虎纹，服装可更多样；首次配色示例至少8主色域×6纹样×5眼色×多个服装方案，即便同物种也有很多组合，但组合数量不是绝不撞款的保证。\n\n身份最终以petInstanceId、所属角色和个人徽记确认。同一只宠物的迷你日常跟随与完整战斗模式共用此身份，两种模式不同时生成两个场景实体。进化/迷你化使用同一个体色域映射，不重新抽一张脸；喜欢幼态外观的玩家可在安全区选已解锁外观皮层，不改变战斗年龄与载重资格。\n\n## 3. 服装与骑具分开\n\n每种至少三套专门适配的服装：远征实用、洞府休闲、血脉典礼。不是一件人类T恤套所有兽；具体方向见33种表。共用装扮槽：头/角饰、颈胸饰、背披、四肢或足环、尾饰、主人纹章。鸟类改为翼根/足环，玄武改为壳饰，帝江/开明按特殊骨架扩展。\n\n纯服装不加攻防/速度。骑鞍、飞行缰具、宠物护具和驮架属于功能装备，单列容量、重量、适用体型；可覆盖外观但数据仍真实。披风/尾带不进入攻击判定，不能通过长装饰增加攻击距离。\n\n制作/定制流程：选本人宠物→查看完整/迷你双预览→选槽与配色→检查挂点兼容/费用→确认→保存 loadout；没有完成迷你对应件的服装不得标全形态兼容。武器穿模、翼膜被覆盖、蛇首被壳饰挡住都属于不通过。\n\n## 4. 如何一眼认出自己的宠物\n\n- 主人可选一个稳定的个人纹章，宠物项牌/鞍毯和迷你配件同步显示；不是每次登录随机换徽章。\n- 玩家自己的宠物优先显示昵称＋小爪标识；队友显示“昵称·主人”，陌生玩家近距离/选中才显示归属，减少满屏名字。\n- 我方/队友/陌生/敌对使用形状标志和文本并辅以颜色，不只靠红绿区分。\n- 呼叫指令带本人宠物的短回应音和可见小动作，其他同名宠物不响应；选择对象用实例ID而非名称搜索第一项。\n- 多人主城默认迷你，完整坐骑在合法骑乘区展开；别人可选择隐藏远处纯装饰，但不能隐藏正在攻击自己的实体。\n\n互动先展示所属者；陌生人不能F一下就骑走、喂药消耗主人的物品或打开驮架。允许主人授权队友抚摸/临时乘坐，但容器权限和转让契约需单独授权。单机角色名字不等于未来联网唯一账号。\n\n## 5. 个性、回忆与情绪价值\n\n每只宠物记录相遇地、生日（游戏纪念）、第一次击败精英、首次载飞、一次护主、玩家选择的合照。照片与录像按资产规范保存原文件和元数据；游戏内相册只是索引，删除一张相册展示不默认删除原图。\n\n性格影响闲暇行为：好奇会看花和轻嗅物件，沉稳坐在门边，亲人靠近但不挡镜头，顽皮会追玩家投的玩具。行为有距离/冷却，不偷走稀有道具、不打断重要对话、不擅自引怪。主人久别返回有欢迎动作，但不会责备玩家没上线或扣关系。\n\n呼名并不要求必须配置语音识别，按钮/快捷指令即可；未来语音选用同一宠物实例指令入口。每种至少一段特征叫声和三个非战斗情绪姿态，字幕可解释回应，关闭声音也可辨认。\n\n## 6. 单机与联网所有权\n\n未绑定宠物蛋可交易；已缔约宠物首期默认不可直接上架出售，防止培养关系变成无限倒卖。未来若开放玩家间赠养，需独立确认、清空驮架、释放活动状态、重置接收方信任教学，petId和来源档案仍保留；不作为本轮联机范围。\n\n野外成熟宠收服在联网中需服务器记录目标信任贡献与缔约预留。同一只实体只能属于一个角色；进入最终缔约流程时有限时独占 reservation，超时释放，不允许先到者永远锁野生目标。个人洞府的蛋/宠物按个人资格生成，不能一名队友领走所有人的唯一奖励。\n\n破限契约位、血脉机缘资格、名字、服装和照片索引都与characterId绑定；客户端只发改名/换装意图，服务器检查文字规则、所有权、已拥有服装和材料。单机宠物资产不能直接导入在线经济服，沿用在线角色分离政策。\n\n## 7. 数据与验收\n\n建议增加 `PetDefinition{speciesId,bloodlineRange,dietId,flightProfile,rigFamily,talents,styleSlots}`；`PetInstance{petId,ownerId,origin,displayName,realm,level,xp,bloodline,lifeStage,trust,bond,temperament,appearanceSeed,skills,styleLoadout,health,spirit,stamina,injury,breakLimitContractId,memoryIds}`；`TamingProgress{wildInstanceId,actorId,feedingEvents,trust,trialIds,reservation}`；`PetMediaRecord{id,petId,kind,path,sha256,assetVersion,createdAt}`。\n\n验收：两个同名玩家和同名同种宠物仍正确选中；中文/组合字符长度准确；HTML按文本显示；服装不会改碰撞优势；迷你与进化保持纹章和名字；双客户端争抢同只宠物仅一个成功；换装/扩容/寄养并发不复制；照片归档后重启能找到；拒绝未授权骑乘/取货。\n","html":"\u003ch1>D3-18 · 玩家命名、宠物个性装扮与多人辨识\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-18-v001.svg\" alt=\"一眼认出自己的宠物\">\u003c/p>\u003cp>\u003cem>图解：名字可以相同；所有权、契约与库存ID不能相同。\u003c/em>\u003c/p>\u003cp>2026-09-12；拟实现。依赖 \u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">宠物\u003c/a>、\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">3D归档\u003c/a>、\u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">联网\u003c/a>。33是物种数，不是只能有33种外观或33只唯一宠物。\u003c/p>\u003ch2>1. 玩家与宠物的名字\u003c/h2>\u003cp>创建角色时输入显示名，建议2—12个可见字符（中文/字母/数字，允许内部空格），长度按Unicode字素簇计算，不按UTF-16长度把汉字和表情截断。默认提供可编辑候选，第一次开始前可确认。拒绝空白名、控制字符、不可见方向控制、脚本/HTML内容；界面全部按纯文本渲染。\u003c/p>\u003cp>宠物破壳/契约后可起1—12字昵称；可暂用“幼狐”等默认称谓，之后安全区免费改名。玩家改显示名也保留 characterId，首次单机不收费；未来联网改名须服务器去重/冷却策略，但不通过改名改变成长、机缘或交易身份。\u003c/p>\u003cp>名字不是主键。稳定关系为 \u003ccode>characterId → petInstanceId → speciesId\u003c/code>，界面可显示“阿岚的青禾 · 九尾狐”。多人重名允许，通过服务器分配短识别码区分，例如“阿岚·7K2M”；不把UUID全文盖在每个人头上。模仿官方/系统样式的前缀和高亮标记不能通过输入名字获得。\u003c/p>\u003ch2>2. 同种宠物的外观差异\u003c/h2>\u003cp>每个体有固定 \u003ccode>appearanceSeed\u003c/code>，生成可调的毛羽主/辅色、花纹图层、眼色、角/鬃/尾装饰变体和轻微体型差异。体型变体控制在同档±8%，命中体积和骑具随真实尺寸配置，不通过装扮变成难命中的超小战宠。\u003c/p>\u003cp>玩家可用染料/兽装服务调整合法色域与花纹，但不能抹掉物种关键轮廓。青龙仍有青系主视觉、白虎保留主要白底/虎纹，服装可更多样；首次配色示例至少8主色域×6纹样×5眼色×多个服装方案，即便同物种也有很多组合，但组合数量不是绝不撞款的保证。\u003c/p>\u003cp>身份最终以petInstanceId、所属角色和个人徽记确认。同一只宠物的迷你日常跟随与完整战斗模式共用此身份，两种模式不同时生成两个场景实体。进化/迷你化使用同一个体色域映射，不重新抽一张脸；喜欢幼态外观的玩家可在安全区选已解锁外观皮层，不改变战斗年龄与载重资格。\u003c/p>\u003ch2>3. 服装与骑具分开\u003c/h2>\u003cp>每种至少三套专门适配的服装：远征实用、洞府休闲、血脉典礼。不是一件人类T恤套所有兽；具体方向见33种表。共用装扮槽：头/角饰、颈胸饰、背披、四肢或足环、尾饰、主人纹章。鸟类改为翼根/足环，玄武改为壳饰，帝江/开明按特殊骨架扩展。\u003c/p>\u003cp>纯服装不加攻防/速度。骑鞍、飞行缰具、宠物护具和驮架属于功能装备，单列容量、重量、适用体型；可覆盖外观但数据仍真实。披风/尾带不进入攻击判定，不能通过长装饰增加攻击距离。\u003c/p>\u003cp>制作/定制流程：选本人宠物→查看完整/迷你双预览→选槽与配色→检查挂点兼容/费用→确认→保存 loadout；没有完成迷你对应件的服装不得标全形态兼容。武器穿模、翼膜被覆盖、蛇首被壳饰挡住都属于不通过。\u003c/p>\u003ch2>4. 如何一眼认出自己的宠物\u003c/h2>\u003cul>\u003cli>主人可选一个稳定的个人纹章，宠物项牌/鞍毯和迷你配件同步显示；不是每次登录随机换徽章。\u003c/li>\u003cli>玩家自己的宠物优先显示昵称＋小爪标识；队友显示“昵称·主人”，陌生玩家近距离/选中才显示归属，减少满屏名字。\u003c/li>\u003cli>我方/队友/陌生/敌对使用形状标志和文本并辅以颜色，不只靠红绿区分。\u003c/li>\u003cli>呼叫指令带本人宠物的短回应音和可见小动作，其他同名宠物不响应；选择对象用实例ID而非名称搜索第一项。\u003c/li>\u003cli>多人主城默认迷你，完整坐骑在合法骑乘区展开；别人可选择隐藏远处纯装饰，但不能隐藏正在攻击自己的实体。\u003c/li>\u003c/ul>\u003cp>互动先展示所属者；陌生人不能F一下就骑走、喂药消耗主人的物品或打开驮架。允许主人授权队友抚摸/临时乘坐，但容器权限和转让契约需单独授权。单机角色名字不等于未来联网唯一账号。\u003c/p>\u003ch2>5. 个性、回忆与情绪价值\u003c/h2>\u003cp>每只宠物记录相遇地、生日（游戏纪念）、第一次击败精英、首次载飞、一次护主、玩家选择的合照。照片与录像按资产规范保存原文件和元数据；游戏内相册只是索引，删除一张相册展示不默认删除原图。\u003c/p>\u003cp>性格影响闲暇行为：好奇会看花和轻嗅物件，沉稳坐在门边，亲人靠近但不挡镜头，顽皮会追玩家投的玩具。行为有距离/冷却，不偷走稀有道具、不打断重要对话、不擅自引怪。主人久别返回有欢迎动作，但不会责备玩家没上线或扣关系。\u003c/p>\u003cp>呼名并不要求必须配置语音识别，按钮/快捷指令即可；未来语音选用同一宠物实例指令入口。每种至少一段特征叫声和三个非战斗情绪姿态，字幕可解释回应，关闭声音也可辨认。\u003c/p>\u003ch2>6. 单机与联网所有权\u003c/h2>\u003cp>未绑定宠物蛋可交易；已缔约宠物首期默认不可直接上架出售，防止培养关系变成无限倒卖。未来若开放玩家间赠养，需独立确认、清空驮架、释放活动状态、重置接收方信任教学，petId和来源档案仍保留；不作为本轮联机范围。\u003c/p>\u003cp>野外成熟宠收服在联网中需服务器记录目标信任贡献与缔约预留。同一只实体只能属于一个角色；进入最终缔约流程时有限时独占 reservation，超时释放，不允许先到者永远锁野生目标。个人洞府的蛋/宠物按个人资格生成，不能一名队友领走所有人的唯一奖励。\u003c/p>\u003cp>破限契约位、血脉机缘资格、名字、服装和照片索引都与characterId绑定；客户端只发改名/换装意图，服务器检查文字规则、所有权、已拥有服装和材料。单机宠物资产不能直接导入在线经济服，沿用在线角色分离政策。\u003c/p>\u003ch2>7. 数据与验收\u003c/h2>\u003cp>建议增加 \u003ccode>PetDefinition{speciesId,bloodlineRange,dietId,flightProfile,rigFamily,talents,styleSlots}\u003c/code>；\u003ccode>PetInstance{petId,ownerId,origin,displayName,realm,level,xp,bloodline,lifeStage,trust,bond,temperament,appearanceSeed,skills,styleLoadout,health,spirit,stamina,injury,breakLimitContractId,memoryIds}\u003c/code>；\u003ccode>TamingProgress{wildInstanceId,actorId,feedingEvents,trust,trialIds,reservation}\u003c/code>；\u003ccode>PetMediaRecord{id,petId,kind,path,sha256,assetVersion,createdAt}\u003c/code>。\u003c/p>\u003cp>验收：两个同名玩家和同名同种宠物仍正确选中；中文/组合字符长度准确；HTML按文本显示；服装不会改碰撞优势；迷你与进化保持纹章和名字；双客户端争抢同只宠物仅一个成功；换装/扩容/寄养并发不复制；照片归档后重启能找到；拒绝未授权骑乘/取货。\u003c/p>"},{"file":"19_DAMAGE_ATTRIBUTES_AND_MASTERY.md","title":"D3-19 · 属性、伤害顺序与五阶掌握","text":"# D3-19 · 属性、伤害顺序与五阶掌握\n\n\u003c!-- illustrated-overview:start -->\n![伤害按什么顺序计算](media/diagram-19-v001.svg)\n\n*图解：示例：597.24入射 → 几何盾100 → 防御后291.714… → 个人盾50 → 掉血241。*\n\u003c!-- illustrated-overview:end -->\n\n2026-09-12；拟实现数值基准。覆盖D3-02旧“所有技能只乘攻击”的伤害草案；人物十境基础值仍由D3-01提供。武技见[20](20_PLAYER_MARTIAL_ARTS_60.md)，宠技见[21](21_PET_SKILLS_33.md)，3D见[22](22_COMBAT_3D_AND_ANIMATION.md)。\n\n## 1. 参考边界\n\n参考动作对战游戏把基础伤害、属性加成、护盾和命中条件明示给玩家的表达方式。例如[王者荣耀官方吕布技能页](https://pvp.qq.com/web201605/herodetail/123.shtml)分别列技能基础值、额外攻击加成和护盾条件。本作不复制该角色技能、倍率或其护甲公式；以下常数、抗性、境界缩放和反制均为本作设计，需白盒测试调参。\n\n## 2. 属性从哪里来：先加再乘，避免重复\n\n角色基础仍为 `B=6^r×(1+0.18×(l−1))`，生命120B、攻击12B、防御10B。新增术强基础 `Sbase=10B`，灵抗基础 `Rbase=8B`；R0通过科技电容驱动术式，R1起转真气，但不能同时扣两种资源。\n\n对生命H、攻击A、术强S、物防D、灵抗R分别计算：\n\n`最终属性 = max(0,(境界基础值 + 装备固定值 + 限时固定值) × (1+体质百分比合计) × 功法常驻倍率 × 装备常驻倍率 × 临时属性倍率)`。\n\n- 同类体质百分比先相加，总上限+80%，保留旧境界体质槽规则。\n- 主修/辅修对同属性常驻加成先合并成一个倍率，最高1.8；装备同属性倍率最高1.8。不能每件装备各乘1.8。\n- 装备固定值与装备百分比是独立词条，同一词条只能选一个入口。品质影响锻造时生成词条，伤害结算不再乘一次Q。\n- 燃血/逆脉保留第12的“攻击×1.45/1.70”，只进入临时攻击属性倍率，不再进入造成伤害加成桶；术强不随攻击丹自动提高。其他明确写“造成伤害提高”的效果才进入后述增伤桶。\n- 普通显示属性可四舍五入，内部保留固定精度。货物负重/移速公式仍由D3-10/13负责，不让伤害模块再缩放速度。\n\n主修功法的五阶常驻倍率建议1.00/1.08/1.16/1.25/1.35。Q1—Q6只放大“超出1的增量”，系数0.8/0.9/1/1.1/1.2/1.3，再与辅修合并并封顶1.8。主动武技不以书籍Q直接二次乘伤害；高品质秘籍通过更好学习效率、合法招式选项与专长配置体现。\n\n## 3. 技能数值写法\n\n新增[26](26_HEAVEN_DEFYING_LEGACIES.md)的天命核心是本章普通上限的有名例外：普通常驻属性算完后进入单一核心覆盖，再建立施法快照；核心倍率与攻击丹取最高，不再次加入普通伤害桶。双分身、临时生命层、直伤分量必须各自记来源，不能递归复制核心。\n\n卡片的`C,a,b`表示：`原始总伤害 = (C×6^t + a×A + b×S) × M(k)`，t为该技能当前已学习的层级版本，不能直接取目标境界；t≤施放者r，默认t为卡片的最低境界。随境升阶需有对应层级研习，不能用R0书固定值自动变成道源固定值；A/S本身会随人物成长。\n\n主文档的卡片统一用 `C/a/b` 缩写，例如 `12/1.2/.4`。物理系卡片通常b=0，灵术a=0或混合，但最终按指定伤害类别处理，不能同一段伤害同时享受双份穿透。“物水”等表示物理通道和水的招式主题，除非技能明写状态，不自动附加水术伤害或潮湿。\n\n五阶掌握保持：\n\n|k|掌握程度|伤害M|治疗/护盾M|非伤害控制时长M|学习累计熟练度标尺|\n|---|---|---:|---:|---:|---:|\n|1|入门|1.00|1.00|1.00|0|\n|2|小成|1.18|1.10|1.05|100×难度系数|\n|3|精通|1.40|1.22|1.10|350×难度系数|\n|4|大成|1.68|1.36|1.15|800×难度系数|\n|5|圆满|2.00|1.50|1.20|1,500×难度系数|\n\n卡片标注的多段/持续伤害是整次总量，按命中份额拆分，不能每一段都发全额。控制、距离和数量不跟伤害M一起翻倍；冷却、消耗默认五阶不变，改变必须在专属突破项写出。护盾/治疗用各自M，不再乘伤害M。\n\n## 4. 学习难度与进阶\n\n|难度|系数|入门学习前置|累计有效练习目标（不含找书）|\n|---|---:|---|---|\n|D1 易学|1.0|基础教学＋3次正确演示|约1—2小时可达精通|\n|D2 常规|1.5|同系一项入门或该系基础导引教学＋5次演示|约2—4小时可达精通|\n|D3 艰深|2.3|同系精通或宗门试炼＋8次演示|约4—6小时可达精通|\n|D4 绝学|3.5|专属传承＋两类实战验证|约6—10小时可达精通|\n|D5 秘传|5.0|唯一/稀有知识＋综合试炼|约10小时以上，按体验调参|\n\n时间是有效练习调参目标，不能用现实挂机硬锁。一次有效命中/防御/避险普通给5、精确处理给10，同事件只取最高，独特试炼一次给30；无生命木桩仅满足入门教学，不产熟练刷满。防守技能以真实拦截结算，不要求挨打次数与进攻命中一样多。\n\n基础导引是可重复的安全教学挑战，不额外赠送一招战斗技能；冰、毒、空间等首招没有D1前招时走此入口，避免前置循环。无伤害辅助技用真实净化、有效感知、受益恢复等事件核验，不能要求它造成伤害。\n\n小成需1种实战记录、精通2种、大成对应挑战、圆满综合试炼；达到经验只解锁确认。书籍学习、境界研习、五阶掌握三者分开，不能为了一个技能重复购买同一阶三次。全部已学技能可永久保存，出战仍受2主动/2被动/武器战技槽限制。\n\n## 5. 命中类型与可反制性\n\n|代码|类型|能否用移动躲开|有效反制|\n|---|---|---|---|\n|H1|近战弧/刺|能，离开扫掠体积|距离、侧闪、格挡、打断|\n|H2|定向弹体/射线预瞄|能，弹体存在速度或射线前摇|掩体、侧移、拦截|\n|H3|地面/空中预告范围|能，离开范围|位移、打断施法、离开高度层|\n|H4|可追踪弹体|能，转弯上限/射程明确|绕障、诱导、拦截，非无限追踪|\n|H5|锁定结算|锁定完成后普通移动不能躲|在锁定前遮挡/超距/打断；锁定后护盾、解印或类型防御|\n|H6|自身/友方增益、护盾、治疗|不适用|敌方可打断起手/驱散允许的状态|\n|H7|持续区域/阵线|能离开，但已命中的持续效果仍有效|离区、净化、毁阵眼|\n\nH5必须先有可见标记、至少0.8秒锁定、施放时视线与射程合法；不能隔墙点名字杀人。锁定后的迟滞确认最多0.2秒，伤害事件到期即结算，不无限追踪出地图。技能击杀不了已救援/离开实例的对象；其余普通位移不会让合法锁定落空。H5伤害预算通常低于同冷却可躲技能，且不可附加长硬控。H5不等于直伤，H2也可有少量直伤，命中方式和防御类型是两条维度。\n\n## 6. 统一伤害管线\n\n1. 校验施放资格、资源、状态和技能版本；提交施放ID，起手扣资源；中断默认不返还已释放消耗，未开始则不扣。\n2. 起手快照来源A/S、技能t/k、属性加成；持续招式默认同一快照，换装不能使旧弹体突然变强。命中时读取目标当前抗性/护盾。\n3. 计算卡片原始伤害与同类造成伤害加成桶：`X=raw×(1+min(.75,同类增伤合计))`。弱点属于这个桶，默认+25%，不再沿用旧+35%另乘；无默认随机暴击。\n4. 如果有实际几何屏障，按命中方向和类型先扣屏障强度。该屏障承受的是本阶段入射伤害，不再享受人物护甲；溢出才进入人物防御。\n5. 物理用物防，灵术用对应元素灵抗；直伤跳过这两类抗性，但仍受合法屏障、通用减伤和个人盾影响，本作不沿用别的游戏“真伤一定穿所有盾”的规则。\n6. 计算目标受伤增幅与常规减伤：易伤同桶相加上限+50%；独立减伤合成 `1−Π(1−di)`，上限60%。抗性与通用减伤合计最多85%，不把多项百分比直接相减到无敌。\n7. 扣个人护盾（有类型过滤），剩余伤害扣生命；吸血/反伤按实际扣除生命值计，不能反伤再触发反伤。\n8. 记录hitId、来源、分量、屏障/盾消耗、生命损失、破势/状态和击倒事件。每个技能每目标的合法命中次数写在定义，帧率不改变次数。\n\n## 7. 破防计算顺序\n\n`D1=max(0,Dtarget−固定减防合计)`；`D2=D1×(1−min(.5,百分比减防合计))`；`D3=D2×(1−min(.5,来源百分比穿透))`；`Deff=max(0,D3−来源固定穿透)`。\n\n减防作用于目标，可让队友受益；穿透只属于攻击者。不同ID减防在桶内加，同ID取最强刷新时长；不能每段伤害新叠一层。负护甲不额外增伤，穿透超出部分无收益。\n\n`K=40×6^目标境界`，`抗性减伤=min(.8,Deff/(Deff+K))`；灵术将Deff换成对应元素有效灵抗，使用同K。新常数40替代旧20，必须重调怪物白盒，不把历史测试通过当新平衡通过。\n\n## 8. 属性体系与状态\n\n物理和灵术为伤害通道，元素为灵术子类：金、木、水、火、土、风、雷、冰、光、暗、毒、空间、神识。通用灵抗R可加该元素专抗，但多个元素命中是分量相加，不把最高穿透用于全部通道。\n\n状态采用可解释有限组合：灼烧/中毒每秒最多一次共4跳；同来源刷新不叠伤，跨来源最多2份；潮湿＋雷击可额外造成一次卡片标注的10%增量，3秒内同目标一次；冰缓与潮湿不自动无限冻结。最终普通减速最多50%、眩晕/击飞单次≤1.2秒，5秒内首次全时长、第二次半时长、之后不再完整硬控；首领硬控转破势，不能永久控死。技能/宠物/阵法共用该抗控账本。\n\n治疗公式与护盾公式都在卡片明示。实际治疗=min(缺失生命，基础治疗×治疗掌握M×(1+min(.5,受疗增益合计))×(1−min(.5,治疗抑制合计)))；不能给满血目标刷熟练。护盾只乘盾掌握M，不乘受疗倍率；同名取更高剩余值，不叠加；异名个人盾合计最高目标最大生命60%，几何阵盾独立但有阵眼/能量弱点。阵法与宠物恢复不复制丹药效果，所有来源都遵守上限。\n\n防御阶段的精确表达为：个人盾前伤害=几何屏障溢出×(1+易伤桶)×max(.15,(1−抗性减伤)×(1−通用减伤))；直伤的抗性减伤取0。减伤不会反过来增加几何屏障耐久。五秒抗控窗口第三次及以后硬控时长为0，仅保留合法削韧，不用“不是完整控制”含糊地继续无限短控。\n\n## 9. 可手算示例\n\n输入：A=200，S=160，t=0，技能12/1.2/.4，精通M=1.40；同类增伤20%＋15%，对方境界R1、物防300、固定减防30、减防20%、穿透25%、固定穿透42，几何屏障100、个人盾50、易伤10%、通用减伤20%。\n\n- raw=(12+1.2×200+.4×160)×1.4=442.4；增伤先加：442.4×1.35=597.24。\n- 几何屏障挡100，剩497.24。\n- Deff=((300−30)×.8)×.75−42=120；K=240；抗性减伤=1/3。\n- 人物承伤=497.24×(2/3)×1.10×.80=291.714133333…；个人盾挡50，生命损失最后向下取整为241。\n\n反例：同桶20%与15%不能乘成1.2×1.15；M不能在每段施放外再乘一遍；个人盾50不能在护甲前后各扣一次。\n\n内部建议固定精度万分数与明确取整，单次伤害最后截断；多段总量按权重与余数分配，避免十段都最少1点导致高防目标反而怕碎粒子。R9高数值乘固定精度可能超JS安全整数，中间乘法用BigInt定点并在可视化层转换，不能只说整数就安全。\n\n## 10. 验收\n\n要求保存五阶伤害/盾/控制向量、正反手算样例、零防/超额穿透、同名状态、目标换盾、来源换装、H5锁定前后遮挡、跨实例、低帧率多段、宠物/阵法共同抗控、高阶整数溢出，以及UI显示与实际战斗日志一致。先做R0—R2验证，不以数值表代替实机打击感。\n","html":"\u003ch1>D3-19 · 属性、伤害顺序与五阶掌握\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-19-v001.svg\" alt=\"伤害按什么顺序计算\">\u003c/p>\u003cp>\u003cem>图解：示例：597.24入射 → 几何盾100 → 防御后291.714… → 个人盾50 → 掉血241。\u003c/em>\u003c/p>\u003cp>2026-09-12；拟实现数值基准。覆盖D3-02旧“所有技能只乘攻击”的伤害草案；人物十境基础值仍由D3-01提供。武技见\u003ca href=\"#20_PLAYER_MARTIAL_ARTS_60.md\">20\u003c/a>，宠技见\u003ca href=\"#21_PET_SKILLS_33.md\">21\u003c/a>，3D见\u003ca href=\"#22_COMBAT_3D_AND_ANIMATION.md\">22\u003c/a>。\u003c/p>\u003ch2>1. 参考边界\u003c/h2>\u003cp>参考动作对战游戏把基础伤害、属性加成、护盾和命中条件明示给玩家的表达方式。例如\u003ca href=\"https://pvp.qq.com/web201605/herodetail/123.shtml\">王者荣耀官方吕布技能页\u003c/a>分别列技能基础值、额外攻击加成和护盾条件。本作不复制该角色技能、倍率或其护甲公式；以下常数、抗性、境界缩放和反制均为本作设计，需白盒测试调参。\u003c/p>\u003ch2>2. 属性从哪里来：先加再乘，避免重复\u003c/h2>\u003cp>角色基础仍为 \u003ccode>B=6^r×(1+0.18×(l−1))\u003c/code>，生命120B、攻击12B、防御10B。新增术强基础 \u003ccode>Sbase=10B\u003c/code>，灵抗基础 \u003ccode>Rbase=8B\u003c/code>；R0通过科技电容驱动术式，R1起转真气，但不能同时扣两种资源。\u003c/p>\u003cp>对生命H、攻击A、术强S、物防D、灵抗R分别计算：\u003c/p>\u003cp>\u003ccode>最终属性 = max(0,(境界基础值 + 装备固定值 + 限时固定值) × (1+体质百分比合计) × 功法常驻倍率 × 装备常驻倍率 × 临时属性倍率)\u003c/code>。\u003c/p>\u003cul>\u003cli>同类体质百分比先相加，总上限+80%，保留旧境界体质槽规则。\u003c/li>\u003cli>主修/辅修对同属性常驻加成先合并成一个倍率，最高1.8；装备同属性倍率最高1.8。不能每件装备各乘1.8。\u003c/li>\u003cli>装备固定值与装备百分比是独立词条，同一词条只能选一个入口。品质影响锻造时生成词条，伤害结算不再乘一次Q。\u003c/li>\u003cli>燃血/逆脉保留第12的“攻击×1.45/1.70”，只进入临时攻击属性倍率，不再进入造成伤害加成桶；术强不随攻击丹自动提高。其他明确写“造成伤害提高”的效果才进入后述增伤桶。\u003c/li>\u003cli>普通显示属性可四舍五入，内部保留固定精度。货物负重/移速公式仍由D3-10/13负责，不让伤害模块再缩放速度。\u003c/li>\u003c/ul>\u003cp>主修功法的五阶常驻倍率建议1.00/1.08/1.16/1.25/1.35。Q1—Q6只放大“超出1的增量”，系数0.8/0.9/1/1.1/1.2/1.3，再与辅修合并并封顶1.8。主动武技不以书籍Q直接二次乘伤害；高品质秘籍通过更好学习效率、合法招式选项与专长配置体现。\u003c/p>\u003ch2>3. 技能数值写法\u003c/h2>\u003cp>新增\u003ca href=\"#26_HEAVEN_DEFYING_LEGACIES.md\">26\u003c/a>的天命核心是本章普通上限的有名例外：普通常驻属性算完后进入单一核心覆盖，再建立施法快照；核心倍率与攻击丹取最高，不再次加入普通伤害桶。双分身、临时生命层、直伤分量必须各自记来源，不能递归复制核心。\u003c/p>\u003cp>卡片的\u003ccode>C,a,b\u003c/code>表示：\u003ccode>原始总伤害 = (C×6^t + a×A + b×S) × M(k)\u003c/code>，t为该技能当前已学习的层级版本，不能直接取目标境界；t≤施放者r，默认t为卡片的最低境界。随境升阶需有对应层级研习，不能用R0书固定值自动变成道源固定值；A/S本身会随人物成长。\u003c/p>\u003cp>主文档的卡片统一用 \u003ccode>C/a/b\u003c/code> 缩写，例如 \u003ccode>12/1.2/.4\u003c/code>。物理系卡片通常b=0，灵术a=0或混合，但最终按指定伤害类别处理，不能同一段伤害同时享受双份穿透。“物水”等表示物理通道和水的招式主题，除非技能明写状态，不自动附加水术伤害或潮湿。\u003c/p>\u003cp>五阶掌握保持：\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>k\u003c/th>\u003cth>掌握程度\u003c/th>\u003cth>伤害M\u003c/th>\u003cth>治疗/护盾M\u003c/th>\u003cth>非伤害控制时长M\u003c/th>\u003cth>学习累计熟练度标尺\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>入门\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>小成\u003c/td>\u003ctd>1.18\u003c/td>\u003ctd>1.10\u003c/td>\u003ctd>1.05\u003c/td>\u003ctd>100×难度系数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>精通\u003c/td>\u003ctd>1.40\u003c/td>\u003ctd>1.22\u003c/td>\u003ctd>1.10\u003c/td>\u003ctd>350×难度系数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>大成\u003c/td>\u003ctd>1.68\u003c/td>\u003ctd>1.36\u003c/td>\u003ctd>1.15\u003c/td>\u003ctd>800×难度系数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>圆满\u003c/td>\u003ctd>2.00\u003c/td>\u003ctd>1.50\u003c/td>\u003ctd>1.20\u003c/td>\u003ctd>1,500×难度系数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>卡片标注的多段/持续伤害是整次总量，按命中份额拆分，不能每一段都发全额。控制、距离和数量不跟伤害M一起翻倍；冷却、消耗默认五阶不变，改变必须在专属突破项写出。护盾/治疗用各自M，不再乘伤害M。\u003c/p>\u003ch2>4. 学习难度与进阶\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>难度\u003c/th>\u003cth>系数\u003c/th>\u003cth>入门学习前置\u003c/th>\u003cth>累计有效练习目标（不含找书）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>D1 易学\u003c/td>\u003ctd>1.0\u003c/td>\u003ctd>基础教学＋3次正确演示\u003c/td>\u003ctd>约1—2小时可达精通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D2 常规\u003c/td>\u003ctd>1.5\u003c/td>\u003ctd>同系一项入门或该系基础导引教学＋5次演示\u003c/td>\u003ctd>约2—4小时可达精通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D3 艰深\u003c/td>\u003ctd>2.3\u003c/td>\u003ctd>同系精通或宗门试炼＋8次演示\u003c/td>\u003ctd>约4—6小时可达精通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D4 绝学\u003c/td>\u003ctd>3.5\u003c/td>\u003ctd>专属传承＋两类实战验证\u003c/td>\u003ctd>约6—10小时可达精通\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D5 秘传\u003c/td>\u003ctd>5.0\u003c/td>\u003ctd>唯一/稀有知识＋综合试炼\u003c/td>\u003ctd>约10小时以上，按体验调参\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>时间是有效练习调参目标，不能用现实挂机硬锁。一次有效命中/防御/避险普通给5、精确处理给10，同事件只取最高，独特试炼一次给30；无生命木桩仅满足入门教学，不产熟练刷满。防守技能以真实拦截结算，不要求挨打次数与进攻命中一样多。\u003c/p>\u003cp>基础导引是可重复的安全教学挑战，不额外赠送一招战斗技能；冰、毒、空间等首招没有D1前招时走此入口，避免前置循环。无伤害辅助技用真实净化、有效感知、受益恢复等事件核验，不能要求它造成伤害。\u003c/p>\u003cp>小成需1种实战记录、精通2种、大成对应挑战、圆满综合试炼；达到经验只解锁确认。书籍学习、境界研习、五阶掌握三者分开，不能为了一个技能重复购买同一阶三次。全部已学技能可永久保存，出战仍受2主动/2被动/武器战技槽限制。\u003c/p>\u003ch2>5. 命中类型与可反制性\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>代码\u003c/th>\u003cth>类型\u003c/th>\u003cth>能否用移动躲开\u003c/th>\u003cth>有效反制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>H1\u003c/td>\u003ctd>近战弧/刺\u003c/td>\u003ctd>能，离开扫掠体积\u003c/td>\u003ctd>距离、侧闪、格挡、打断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H2\u003c/td>\u003ctd>定向弹体/射线预瞄\u003c/td>\u003ctd>能，弹体存在速度或射线前摇\u003c/td>\u003ctd>掩体、侧移、拦截\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H3\u003c/td>\u003ctd>地面/空中预告范围\u003c/td>\u003ctd>能，离开范围\u003c/td>\u003ctd>位移、打断施法、离开高度层\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H4\u003c/td>\u003ctd>可追踪弹体\u003c/td>\u003ctd>能，转弯上限/射程明确\u003c/td>\u003ctd>绕障、诱导、拦截，非无限追踪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H5\u003c/td>\u003ctd>锁定结算\u003c/td>\u003ctd>锁定完成后普通移动不能躲\u003c/td>\u003ctd>在锁定前遮挡/超距/打断；锁定后护盾、解印或类型防御\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H6\u003c/td>\u003ctd>自身/友方增益、护盾、治疗\u003c/td>\u003ctd>不适用\u003c/td>\u003ctd>敌方可打断起手/驱散允许的状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H7\u003c/td>\u003ctd>持续区域/阵线\u003c/td>\u003ctd>能离开，但已命中的持续效果仍有效\u003c/td>\u003ctd>离区、净化、毁阵眼\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>H5必须先有可见标记、至少0.8秒锁定、施放时视线与射程合法；不能隔墙点名字杀人。锁定后的迟滞确认最多0.2秒，伤害事件到期即结算，不无限追踪出地图。技能击杀不了已救援/离开实例的对象；其余普通位移不会让合法锁定落空。H5伤害预算通常低于同冷却可躲技能，且不可附加长硬控。H5不等于直伤，H2也可有少量直伤，命中方式和防御类型是两条维度。\u003c/p>\u003ch2>6. 统一伤害管线\u003c/h2>\u003col>\u003cli>校验施放资格、资源、状态和技能版本；提交施放ID，起手扣资源；中断默认不返还已释放消耗，未开始则不扣。\u003c/li>\u003cli>起手快照来源A/S、技能t/k、属性加成；持续招式默认同一快照，换装不能使旧弹体突然变强。命中时读取目标当前抗性/护盾。\u003c/li>\u003cli>计算卡片原始伤害与同类造成伤害加成桶：\u003ccode>X=raw×(1+min(.75,同类增伤合计))\u003c/code>。弱点属于这个桶，默认+25%，不再沿用旧+35%另乘；无默认随机暴击。\u003c/li>\u003cli>如果有实际几何屏障，按命中方向和类型先扣屏障强度。该屏障承受的是本阶段入射伤害，不再享受人物护甲；溢出才进入人物防御。\u003c/li>\u003cli>物理用物防，灵术用对应元素灵抗；直伤跳过这两类抗性，但仍受合法屏障、通用减伤和个人盾影响，本作不沿用别的游戏“真伤一定穿所有盾”的规则。\u003c/li>\u003cli>计算目标受伤增幅与常规减伤：易伤同桶相加上限+50%；独立减伤合成 \u003ccode>1−Π(1−di)\u003c/code>，上限60%。抗性与通用减伤合计最多85%，不把多项百分比直接相减到无敌。\u003c/li>\u003cli>扣个人护盾（有类型过滤），剩余伤害扣生命；吸血/反伤按实际扣除生命值计，不能反伤再触发反伤。\u003c/li>\u003cli>记录hitId、来源、分量、屏障/盾消耗、生命损失、破势/状态和击倒事件。每个技能每目标的合法命中次数写在定义，帧率不改变次数。\u003c/li>\u003c/ol>\u003ch2>7. 破防计算顺序\u003c/h2>\u003cp>\u003ccode>D1=max(0,Dtarget−固定减防合计)\u003c/code>；\u003ccode>D2=D1×(1−min(.5,百分比减防合计))\u003c/code>；\u003ccode>D3=D2×(1−min(.5,来源百分比穿透))\u003c/code>；\u003ccode>Deff=max(0,D3−来源固定穿透)\u003c/code>。\u003c/p>\u003cp>减防作用于目标，可让队友受益；穿透只属于攻击者。不同ID减防在桶内加，同ID取最强刷新时长；不能每段伤害新叠一层。负护甲不额外增伤，穿透超出部分无收益。\u003c/p>\u003cp>\u003ccode>K=40×6^目标境界\u003c/code>，\u003ccode>抗性减伤=min(.8,Deff/(Deff+K))\u003c/code>；灵术将Deff换成对应元素有效灵抗，使用同K。新常数40替代旧20，必须重调怪物白盒，不把历史测试通过当新平衡通过。\u003c/p>\u003ch2>8. 属性体系与状态\u003c/h2>\u003cp>物理和灵术为伤害通道，元素为灵术子类：金、木、水、火、土、风、雷、冰、光、暗、毒、空间、神识。通用灵抗R可加该元素专抗，但多个元素命中是分量相加，不把最高穿透用于全部通道。\u003c/p>\u003cp>状态采用可解释有限组合：灼烧/中毒每秒最多一次共4跳；同来源刷新不叠伤，跨来源最多2份；潮湿＋雷击可额外造成一次卡片标注的10%增量，3秒内同目标一次；冰缓与潮湿不自动无限冻结。最终普通减速最多50%、眩晕/击飞单次≤1.2秒，5秒内首次全时长、第二次半时长、之后不再完整硬控；首领硬控转破势，不能永久控死。技能/宠物/阵法共用该抗控账本。\u003c/p>\u003cp>治疗公式与护盾公式都在卡片明示。实际治疗=min(缺失生命，基础治疗×治疗掌握M×(1+min(.5,受疗增益合计))×(1−min(.5,治疗抑制合计)))；不能给满血目标刷熟练。护盾只乘盾掌握M，不乘受疗倍率；同名取更高剩余值，不叠加；异名个人盾合计最高目标最大生命60%，几何阵盾独立但有阵眼/能量弱点。阵法与宠物恢复不复制丹药效果，所有来源都遵守上限。\u003c/p>\u003cp>防御阶段的精确表达为：个人盾前伤害=几何屏障溢出×(1+易伤桶)×max(.15,(1−抗性减伤)×(1−通用减伤))；直伤的抗性减伤取0。减伤不会反过来增加几何屏障耐久。五秒抗控窗口第三次及以后硬控时长为0，仅保留合法削韧，不用“不是完整控制”含糊地继续无限短控。\u003c/p>\u003ch2>9. 可手算示例\u003c/h2>\u003cp>输入：A=200，S=160，t=0，技能12/1.2/.4，精通M=1.40；同类增伤20%＋15%，对方境界R1、物防300、固定减防30、减防20%、穿透25%、固定穿透42，几何屏障100、个人盾50、易伤10%、通用减伤20%。\u003c/p>\u003cul>\u003cli>raw=(12+1.2×200+.4×160)×1.4=442.4；增伤先加：442.4×1.35=597.24。\u003c/li>\u003cli>几何屏障挡100，剩497.24。\u003c/li>\u003cli>Deff=((300−30)×.8)×.75−42=120；K=240；抗性减伤=1/3。\u003c/li>\u003cli>人物承伤=497.24×(2/3)×1.10×.80=291.714133333…；个人盾挡50，生命损失最后向下取整为241。\u003c/li>\u003c/ul>\u003cp>反例：同桶20%与15%不能乘成1.2×1.15；M不能在每段施放外再乘一遍；个人盾50不能在护甲前后各扣一次。\u003c/p>\u003cp>内部建议固定精度万分数与明确取整，单次伤害最后截断；多段总量按权重与余数分配，避免十段都最少1点导致高防目标反而怕碎粒子。R9高数值乘固定精度可能超JS安全整数，中间乘法用BigInt定点并在可视化层转换，不能只说整数就安全。\u003c/p>\u003ch2>10. 验收\u003c/h2>\u003cp>要求保存五阶伤害/盾/控制向量、正反手算样例、零防/超额穿透、同名状态、目标换盾、来源换装、H5锁定前后遮挡、跨实例、低帧率多段、宠物/阵法共同抗控、高阶整数溢出，以及UI显示与实际战斗日志一致。先做R0—R2验证，不以数值表代替实机打击感。\u003c/p>"},{"file":"20_PLAYER_MARTIAL_ARTS_60.md","title":"20 · 人物武技60式","text":"# 20 · 人物武技60式\n\n\u003c!-- illustrated-overview:start -->\n![60式武技怎么读](media/diagram-20-v001.svg)\n\n*图解：可躲技能与锁定技能不同；锁定仍有破线、打断、盾和解印反制。*\n\u003c!-- illustrated-overview:end -->\n\n设计稿，尚未实装。计算顺序与五阶掌握以[19](19_DAMAGE_ATTRIBUTES_AND_MASTERY.md)为准，表现以[22](22_COMBAT_3D_AND_ANIMATION.md)为准。所有数值为首轮平衡起点。\n\n## 读表与学习\n\n共20武器技、26属性术、14身法/防护技。表中 `C/a/b` 是一次完整施放总预算 `(C×6^t+a×攻击+b×术强)×掌握系数`，多段必须分摊总额。未写治疗/护盾即伤害；物=物理防御，术=对应元素灵抗。t初始为要求境界；升阶需该境传承页和一次实战验证，不能随敌人自动提升。无攻击公式的辅助技不得额外附带隐藏伤害。\n\n门槛栏为最低境界/难度D1—D5，难度对应第19的前置和熟练度倍率；要求只用已学技能完成。D1由N06教学；D2由战斗任务或书商；D3由对应宗门或同境遗迹传承；D4由宗门试炼或散修挑战；D5由稀有传承，另有高阶长线研究保底（20次不同遗迹研究记录可选一本，不能刷同实例）。不以随机天赋锁死武器职业。\n\n耗能是当前境界基础资源池百分比，基准 `Q0=R0时100，否则100×2^r×(1+.08×(l−1))`，装备扩池不增加施法成本。表中前/后摇、CD均为秒，距离为米。R0使用电容/体能的科技动作，R1后使用真气；身法移动仍同时受负重和碰撞约束。普通攻击不耗真气。\n\nH1近战、H2直射、H3预警范围、H4有限追踪、H5锁定结算、H6自身/友方、H7持续场的反制详见19。H5锁定至少0.8秒，锁定完成前能破视线、离距或打断；完成后普通走位不能躲，仍可盾挡或解印。\n\n## 武器技（绑定对应武器，不改变十大分类）\n\n本章60式为常规可成长目录。第26的六式MYA禁传武技独立计数，来源为极稀有机缘，不在D5研究保底或宗门日常兑换中；仍使用本章已定义的两个主动槽与伤害合同。\n\n|ID 名称|武器/属性|门槛|总预算|距离/形状；命中|前/后摇；CD/耗能%|独有效果与反制|3D谱系/专属形状|\n|- 2>读表与学习\u003c/h2>\u003cp>共20武器技、26属性术、14身法/防护技。表中 \u003ccode>C/a/b\u003c/code> 是一次完整施放总预算 \u003ccode>(C×6^t+a×攻击+b×术强)×掌握系数\u003c/code>，多段必须分摊总额。未写治疗/护盾即伤害；物=物理防御，术=对应元素灵抗。t初始为要求境界；升阶需该境传承页和一次实战验证，不能随敌人自动提升。无攻击公式的辅助技不得额外附带隐藏伤害。\u003c/p>\u003cp>门槛栏为最低境界/难度D1—D5，难度对应第19的前置和熟练度倍率；要求只用已学技能完成。D1由N06教学；D2由战斗任务或书商；D3由对应宗门或同境遗迹传承；D4由宗门试炼或散修挑战；D5由稀有传承，另有高阶长线研究保底（20次不同遗迹研究记录可选一本，不能刷同实例）。不以随机天赋锁死武器职业。\u003c/p>\u003cp>耗能是当前境界基础资源池百分比，基准 \u003ccode>Q0=R0时100，否则100×2^r×(1+.08×(l−1))\u003c/code>，装备扩池不增加施法成本。表中前/后摇、CD均为秒，距离为米。R0使用电容/体能的科技动作，R1后使用真气；身法移动仍同时受负重和碰撞约束。普通攻击不耗真气。\u003c/p>\u003cp>H1近战、H2直射、H3预警范围、H4有限追踪、H5锁定结算、H6自身/友方、H7持续场的反制详见19。H5锁定至少0.8秒，锁定完成前能破视线、离距或打断；完成后普通走位不能躲，仍可盾挡或解印。\u003c/p>\u003ch2>武器技（绑定对应武器，不改变十大分类）\u003c/h2>\u003cp>本章60式为常规可成长目录。第26的六式MYA禁传武技独立计数，来源为极稀有机缘，不在D5研究保底或宗门日常兑换中；仍使用本章已定义的两个主动槽与伤害合同。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 名称\u003c/th>\u003cth>武器/属性\u003c/th>\u003cth>门槛\u003c/th>\u003cth>总预算\u003c/th>\u003cth>距离/形状；命中\u003c/th>\u003cth>前/后摇；CD/耗能%\u003c/th>\u003cth>独有效果与反制\u003c/th>\u003cth>3D谱系/专属形状\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>WS01 断浪斩\u003c/td>\u003ctd>刀/物水\u003c/td>\u003ctd>R0/D1\u003c/td>\u003ctd>6/1.3/0\u003c/td>\u003ctd>3/100°扇；H1\u003c/td>\u003ctd>0.35/0.4；5/6\u003c/td>\u003ctd>削韧20，后撤避开\u003c/td>\u003ctd>VF01/单刃水弧\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WS02 回峰三叠\u003c/td>\u003ctd>刀/物金\u003c/td>\u003ctd>R2/D3\u003c/td>\u003ctd>12/2.1/0.2\u003c/td>\u003ctd>3/三连；H1\u003c/td>\u003ctd>0.5/0.7；12/15\u003c/td>\u003ctd>三段25/30/45%，末段可打断\u003c/td>\u003ctd>VF01/三道折峰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WS03 点星刺\u003c/td>\u003ctd>剑/物金\u003c/td>\u003ctd>R0/D1\u003c/td>\u003ctd>4/1.15/0\u003c/td>\u003ctd>3/窄刺；H1\u003c/td>\u003ctd>0.2/0.3；4/5\u003c/td>\u003ctd>弱点只走统一加成桶\u003c/td>\u003ctd>VF01/剑尖星点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WS04 御剑归线\u003c/td>\u003ctd>剑/术风\u003c/td>\u003ctd>R3/D3\u003c/td>\u003ctd>10/0.9/1.1\u003c/td>\u003ctd>18/往返线；H2\u003c/td>\u003ctd>0.6/0.5；14/16\u0 0/0/1.3\u003c/td>\u003ctd>自身；H6\u003c/td>\u003ctd>1/0.8；60/30\u003c/td>\u003ctd>3秒盾；不免死、不复活，不能脱离剧情边界\u003c/td>\u003ctd>VF04/胸口九瓣印\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>五阶落实及配装\u003c/h2>\u003cp>每条伤害技五阶预算等于表值×1/1.18/1.40/1.68/2；治疗护盾×1/1.10/1.22/1.36/1.50。例如WS01在A=12、t=0时五阶为21.6/25.488/30.24/36.288/43.2，最终掉血另算防御。控制按19上限缩放；纯辅助百分比、位移、时长不随伤害倍率翻倍。HS02例外保留\u003ca href=\"../SKILL_PROGRESSION_SPEC.md\">原五阶身法\u003c/a>的4米、转向和串行储备，不叠加新位移倍率。\u003c/p>\u003cp>每招视觉由“表中专属形状＋VF五阶模板”唯一确定；低阶看得见实质动作，圆满增加细节与收势，不偷偷扩大攻击盒。纯辅助技能升级改善提示和施法稳定表现，其已有数值之外不自动加隐形属性。\u003c/p>\u003cp>普通连击/重击是武器基础动作；WS可装1个武器技槽，ES/HS装原有2主动槽，保留2被动和主辅功法。HS02仍使用E核心闪避，Q扫描，不占1/2；拥有相同技能不能双槽刷新CD。F交互、V视角、Z趴下保留。右键格挡/瞄准、R重击，武器技默认鼠标中键且允许重绑，驾驶时改由载具输入层接管。\u003c/p>\u003cp>HS07只可落地静止引导，期间停止其他真气自然恢复；不能一边御空消耗一边使用无成本回元永续飞行。无伤害辅助技能按成功避险、实际净化/发现/恢复事件增长熟练，次数与第19统一去重。\u003c/p>\u003cp>安全区训练显示每段系数/命中/被吸收/掉血和五阶对照；实战只显示简明结果。任一新技能交付必须同时有学习来源、资源闭环、真实动画和命中证据，不先做无法使用的60个按钮。\u003c/p>"},{"file":"21_PET_SKILLS_33.md","title":"21 · 33种宠物专属技能","text":"# 21 · 33种宠物专属技能\n\n\u003c!-- illustrated-overview:start -->\n![每只宠物都有自己的打法](media/diagram-21-v001.svg)\n\n*图解：33种：66主动+33天赋；宠物不复制主人的攻击面板。*\n\u003c!-- illustrated-overview:end -->\n\n设计稿。与[15成长](15_PET_PROGRESSION_AND_BOND.md)、[16谱系](16_PET_BESTIARY_33.md)、[17空战](17_PET_3D_FLIGHT_AND_ASSETS.md)共同使用；不是已制作66项技能。每种两主动、一血脉天赋，保留其原谱系招牌并细化为主动动作。天赋不与原描述重复领取。\n\n## 统一合同\n\n宠物独立计算属性，不复制主人攻击。沿用15的生命90B、攻击6B、防御7B，补充术强5B、灵抗6B。以下给出全部33种的初始种族系数，顺序H/A/D/S/灵抗；每项只乘一次，血脉/兽诀在其后各自进入单一加成桶。没有表外的隐藏“神兽全属性翻倍”。\n\n|定位|种族系数H/A/D/S/灵抗|适用PET编号|\n|---|---|---|\n|突击|1/1.2/0.9/0.8/0.9|03、12、17、19、21、23、24、28|\n|术攻|0.85/0.8/0.8/1.2/1.1|01、02、07、08、09、13、14、16、31|\n|守护|1.3/0.9/1.2/0.85/1.1|04、11、20、22、25、29、30|\n|辅援|1/0.8/1/1.1/1.2|05、06、10、15、18、26、27、32、33|\n\nA主动：宠物小等级3解锁，羁绊30；B主动：宠物R1且羁绊60解锁。获得时已达条件仍需一次教学。血脉天赋B2、羁绊60解锁；低血脉同种也能正常战斗。两主动分别保留入门/小成/精通/大成/圆满，倍率同19，难度A=D1、B=D3；天赋固定一级，不重复吃五阶伤害倍率。技能升阶t需与主人无关的本境兽诀页和宠物实战记录，t≤宠物境界。\n\n表内伤害/治疗/盾 `C/a/b` 代入宠物A/S，完整施放多段总预算；H和VF见19/22。格式：`公式；射程m/命中；前摇秒/CD秒/基础灵力池消耗%`。未列后摇默认0.5秒，扑击0.7秒；每次动作从真实口/角/爪/翼发出。费用基准为15的80×2^r×(1+.08×(l−1))，不是扩容后的池。持续伤害4次均摊，所有光环最多主人和自身两个目标。\n\n## 技能清单\n\n|谱系|A主动（唯一ID）|B主动（唯一ID）|血脉天赋（唯一ID）|3D专属表现|\n|---|---|---|---|---|\n|PET01 青龙|PET01-A 雷木龙息：6/0.2/1.3；12/H2；0.6/9/10；雷术直线，削甲0.1S持续3秒|PET01-B 云根护主：个人盾6/0/1.2；8/H6；0.8/24/20；4秒|PET01-T 雷鳞：受雷伤后雷抗+10%3秒，内置12秒|VF02龙须雷枝/VF04木鳞盾|\n|PET02 朱雀|PET02-A 灼羽火域：8/0/1.5；12半径2/H7；0.8/14/15；火术4秒|PET02-B 赤羽掠击：6/0.8/0.5；8/H2；0.6/12/13；低空掠过，落点安全才施放|PET02-T 余烬：自身施加灼烧时回基础灵力2%，内置10秒|VF07羽形火地/VF06赤翼轨|\n|PET03 白虎|PET03-A 裂金扑：8/1.5/0；6/H1；0.6/10/10；物金削韧30|PET03-B 啸锋震：5/0.4/0.6；6锥/H1；0.7/18/15；打断0.4秒|PET03-T 猎势：首次命中未交战目标伤害桶+10%，同目标30秒|VF06虎扑/VF09金声波|\n|PET04 玄武|PET04-A 龟蛇护阵：几何盾10/0/1.5；前方宽4/H6；0.8/22/20；4秒|PET04-B 寒潮缠足：6/0.2/1.0；10半径2/H3；0.9/14/13；水术减速25%2秒|PET04-T 稳甲：静止2秒获得削韧抗性20%，移动消失|VF04龟甲蛇环/VF03龟纹水圈|\n|PET05 凤凰|PET05-A 回护羽：治疗8/0/1.0；8/H6；1/22/18；4秒恢复|PET05-B 涅羽援护：个人盾8/0/1.3；8/H6；0.8/60/25；主人低于30%可自动施放，不复活|PET05-T 留温：自身受疗+10%，不增加输出伤害|VF08羽心回流/VF04护心火羽|\n|PET06 麒麟|PET06-A 瑞泽踏：5/0.6/0.6；3圆/H3；0.6/12/12；术土削韧15|PET06-B 清瑞息：治疗5/0/0.7；8/H6；0.8/26/20；净化一项可解减益|PET06-T 瑞步：地面负面区域减速强度−15%，不免疫伤害|VF03蹄下祥云/VF08角端露光|\n|PET07 应龙|PET07-A 风翼截击：8/1.0/0.5；10/H2；0.8/14/15；物风俯冲，可侧移|PET07-B 降雨幕：无伤害；8半径3/H7；0.8/25/18；4秒雨幕使穿过火弹伤害−15%，同弹一次|PET07-T 翼稳：被击飞位移减少15%，不免硬控|VF06双翼风叉/VF07细雨幕|\n|PET08 烛龙|PET08-A 昼晦息：6/0/1.2；10锥/H1；0.7/12/12；术暗|PET08-B 烛目封印：4/0/0.6；10/H5；1.2/24/18；术光、治疗受益−15%3秒|PET08-T 明晦辨：自己视线内隐匿单位提示距离+20%，不穿墙|VF09明暗吐息/VF05竖瞳印|\n|PET09 九尾狐|PET09-A 幻步诱影：无伤害；原地/H6；0.4/20/15；假影2秒，可被识破|PET09-B 狐火追珠：6/0/1.2；14/H4；0.6/11/11；术火，45°/秒追踪|PET09-T 心契：主人有效净化宠物后双方真气各回基础2%，内置20秒|VF10九尾残影/VF02尾尖狐珠|\n|PET10 白泽|PET10-A 识妖眸：无伤害；12/H5；0.9/20/12；3秒标出已观察到弱点，不增加弱点倍率|PET10-B 辟邪言：5/0/1.1；10锥/H1；0.7/14/13；术光，命中驱散目标一个可驱散增益|PET10-T 博闻：首次观察新种奖励研究记录，无重复刷资源|VF05额目框/VF09文字形声波|\n|PET11 貔貅|PET11-A 吞煞护：几何盾8/0/1.3；前方2/H6；0.5/18/16；3秒吸弹，不能吞人物/道具|PET11-B 吐金丸：6/0.5/0.8；15/H2；0.6/12/12；术金，与吸弹量无关|PET11-T 守财：背包物品散落标记持续时间+30%，不增掉率|VF04口前涡盾/VF02金丸|\n|PET12 獬豸|PET12-A 定势角：6/1.3/0；5/H1；0.6/10/10；物金打断0.4秒|PET12-B 正法印：4/0/0.6；10/H5；1/22/16；术光，目标造成伤害−8%3秒|PE 定的情绪小特效，禁止视觉卖萌偷偷治疗。收宠、改名、变迷你不重置冷却、伤势或混沌缓冲债务。\n\n验收：33种均有A/B/T唯一ID；每个技能至少录制命中、落空/被挡、打断三段；检查66主动五阶表现、33天赋触发间隔；骑乘和迷你模式分别验证。当前只完成设计，资产状态仍为planned。\n","html":"\u003ch1>21 · 33种宠物专属技能\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-21-v001.svg\" alt=\"每只宠物都有自己的打法\">\u003c/p>\u003cp>\u003cem>图解：33种：66主动+33天赋；宠物不复制主人的攻击面板。\u003c/em>\u003c/p>\u003cp>设计稿。与\u003ca href=\"#15_PET_PROGRESSION_AND_BOND.md\">15成长\u003c/a>、\u003ca href=\"#16_PET_BESTIARY_33.md\">16谱系\u003c/a>、\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">17空战\u003c/a>共同使用；不是已制作66项技能。每种两主动、一血脉天赋，保留其原谱系招牌并细化为主动动作。天赋不与原描述重复领取。\u003c/p>\u003ch2>统一合同\u003c/h2>\u003cp>宠物独立计算属性，不复制主人攻击。沿用15的生命90B、攻击6B、防御7B，补充术强5B、灵抗6B。以下给出全部33种的初始种族系数，顺序H/A/D/S/灵抗；每项只乘一次，血脉/兽诀在其后各自进入单一加成桶。没有表外的隐藏“神兽全属性翻倍”。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>定位\u003c/th>\u003cth>种族系数H/A/D/S/灵抗\u003c/th>\u003cth>适用PET编号\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>突击\u003c/td>\u003ctd>1/1.2/0.9/0.8/0.9\u003c/td>\u003ctd>03、12、17、19、21、23、24、28\u003c/td>\u003c/tr>\u003ctr>\u003ctd>术攻\u003c/td>\u003ctd>0.85/0.8/0.8/1.2/1.1\u003c/td>\u003ctd>01、02、07、08、09、13、14、16、31\u003c/td>\u003c/tr>\u003ctr>\u003ctd>守护\u003c/td>\u003ctd>1.3/0.9/1.2/0.85/1.1\u003c/td>\u003ctd>04、11、20、22、25、29、30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>辅援\u003c/td>\u003ctd>1/0.8/1/1.1/1.2\u003c/td>\u003ctd>05、06、10、15、18、26、27、32、33\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A主动：宠物小等级3解锁，羁绊30；B主动：宠物R1且羁绊60解锁。获得时已达条件仍需一次教学。血脉天赋B2、羁绊60解锁；低血脉同种也能正常战斗。两主动分别保留入门/小成/精通/大成/圆满，倍率同19，难度A=D1、B=D3；天赋固定一级，不重复吃五阶伤害倍率。技能升阶t需与主人无关的本境兽诀页和宠物实战记录，t≤宠物境界。\u003c/p>\u003cp>表内伤害/治疗/盾 \u003ccode>C/a/b\u003c/code> 代入宠物A/S，完整施放多段总预算；H和VF见19/22。格式：\u003ccode>公式；射程m/命中；前摇秒/CD秒/基础灵力池消耗%\u003c/code>。未列后摇默认0.5秒，扑击0.7秒；每次动作从真实口/角/爪/翼发出。费用基准为15的80×2^r×(1+.08×(l−1))，不是扩容后的池。持续伤害4次均摊，所有光环最多主人和自身两个目标。\u003c/p>\u003ch2>技能清单\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>谱系\u003c/th>\u003cth>A >\u003ctr>\u003ctd>PET31 帝江\u003c/td>\u003ctd>PET31-A 四翼移阵：无伤害；自身位移5/H6；0.3/16/14；不是跨墙传送\u003c/td>\u003ctd>PET31-B 空鼓震：7/0/1.25；8半径2/H3；0.8/15/14；术空间，预警鼓面\u003c/td>\u003ctd>PET31-T 翼律：完成有效闪避后下一主动耗能−10%，12秒内一次\u003c/td>\u003ctd>VF06四翼折迹/VF03无面鼓波\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET32 精卫\u003c/td>\u003ctd>PET32-A 衔石点击：4/0.8/0.4；15/H2；0.4/7/7；物土，三石总额\u003c/td>\u003ctd>PET32-B 填隙石幕：几何盾5/0/1.0；前方宽2/H6；0.7/20/16；3秒悬石不生成永久地形\u003c/td>\u003ctd>PET32-T 不倦：有效采集陪伴后饱足消耗−10%60秒，内置120秒\u003c/td>\u003ctd>VF02喙衔三石/VF04小石拼幕\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PET33 乘黄\u003c/td>\u003ctd>PET33-A 引风驰：无伤害；自身与主人8/H6；0.5/24/16；地速+10%4秒入移动上限\u003c/td>\u003ctd>PET33-B 黄光角：6/0.8/0.6；8/H2；0.6/12/12；术光窄线\u003c/td>\u003ctd>PET33-T 伴行：脱战同行时主人奔跑体力消耗−5%，不影响飞行权限\u003c/td>\u003ctd>VF06白尾黄风/VF02角端弧光\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>自动战斗、空战和情绪交互\u003c/h2>\u003cp>第26的MYP01—06是本33种中的极稀有异格，不增加常规物种数。其专属能力占原羁绊协同槽，不额外复制A/B/T；原先护主破限5%稀有分支仍保留，与新增逆天分支互斥。\u003c/p>\u003cp>战宠每1秒评估一次高层意图，逐帧只执行运动/动画；优先躲危险、保护主人，再使用技能。自动H5须自身有视线，AI不能提前知道玩家输入。主人可选择主动/护卫/跟随/停留，并手动优先施放A/B；默认宠物轮盘召出后点击，避免占用人物Q/E、1/2。手动指令不跳过资源、距离、冷却与前摇。两主动共用0.8秒施法间隔；冷却从成功开始扣费时计，打断不返全资源。\u003c/p>\u003cp>扑击、地面阵、落地震波只有找到合法地表才施放。空中使用吐息/弹体/空域锥；骑乘时不自动发动造成乘客无法控制的俯冲，先显示意图并由玩家确认。高空失能进入17的滑翔/救援规则，不能通过技能令低阶骑手获得星空生存能力。\u003c/p>\u003cp>一只战宠的持续输出目标为同境、同品质参考人物的25—45%，治疗/坦克取低端；测试固定60秒和180秒遭遇，计入冷却、耗灵、追敌、空放与防御时间，不能用单次倍率宣称达标。基础普攻暂定1.0A每2秒，攻击动画与距离影响实际频率；超标优先调CD、基础普攻频率和系数，不偷偷把主人属性复制给宠物。极少数护主破限事件允许超越主人，沿用15的稀有条件，不人为削成同阶。\u003c/p>\u003cp>同一只随行宠物切到日常迷你模式时停止战斗技能；切回完整战斗模式使用原A/B/T与原冷却，不另召一只宠物。保留每种尾/耳/翼、蹭手、睡觉、被夸奖等动作。表中3D形状可缩为无判定的情绪小特效，禁止视觉卖萌偷偷治疗。收宠、改名、变迷你不重置冷却、伤势或混沌缓冲债务。\u003c/p>\u003cp>验收：33种均有A/B/T唯一ID；每个技能至少录制命中、落空/被挡、打断三段；检查66主动五阶表现、33天赋触发间隔；骑乘和迷你模式分别验证。当前只完成设计，资产状态仍为planned。\u003c/p>"},{"file":"22_COMBAT_3D_AND_ANIMATION.md","title":"22 · 武技、宠物、阵法的3D与动画制作合同","text":"# 22 · 武技、宠物、阵法的3D与动画制作合同\n\n\u003c!-- illustrated-overview:start -->\n![从概念到能玩的3D](media/diagram-22-v001.svg)\n\n*图解：概念画不是模型，展示视频不是引擎命中证据。*\n\u003c!-- illustrated-overview:end -->\n\n设计稿；本轮没有生成新图片、视频或3D资产，也没有消耗Aholo积分。资产继续按[17](17_PET_3D_FLIGHT_AND_ASSETS.md)保存源文件、导出文件、预览、校验和与独立备份状态。\n\n## 1. 五阶效果的可制作定义\n\n[20人物](20_PLAYER_MARTIAL_ARTS_60.md)、[21宠物](21_PET_SKILLS_33.md)每招的“专属形状”是不可替换的轮廓身份，以下VF是制作结构而非把所有技能换颜色。每个技能都导出K1—K5五个表现配置；粒子和纹样升级不改变没有写入技能表的判定半径、弹体数或距离。\n\n|谱系|入门K1|小成K2|精通K3|大成K4|圆满K5|\n|---|---|---|---|---|---|\n|VF01 近战轨迹|武器/肢体真实扫掠+短单轨|轨迹边缘清晰、击点碎屑|专属纹样沿轨流动|前摇亮起纹样，命中形成短内环|纹样完整闭合后收束回武器；不额外判一次|\n|VF02 弹体射线|实体弹核+短尾迹|增加外壳与方向箭纹|专属内核旋转、碰撞破裂|双层尾迹、起手聚能|完整纹样绕核、终点消散；装饰卫星不造成伤害|\n|VF03 落点/震波|清晰边界预警+一层冲击|加边界倒计时刻度|地表专属裂纹/符号|立体预警轮廓与分段到达提示|内外纹样贯通，收势回流；所有层仍同一事件预算|\n|VF04 护盾/招架|可读薄面+受击点|厚度边缘与剩余强度裂纹|分片受击光，背侧不伪装防护|专属结构分区开合|完整结构及破碎收束；低血盾仍能看出快碎|\n|VF05 锁定印|目标脚下与身体印记+倒计时|增加来源连线|专属锁扣逐段闭合|断锁时清晰分裂反馈|完整印面/极短结算闪光；锁定时间不缩短|\n|VF06 位移/扑击|起步、接触地面、刹停三动作|专属尾迹与制动碎屑|路径曲率连续，身体倾斜更自然|起终点纹样呼应|完整短轨收束；不复制实体/增加无敌帧|\n|VF07 持续场|实际边界+核心|每次结算脉冲|显示剩余时间与可破坏核心|专属立体低矮构件|层次完整但视线中央留空；不得扩大安全/危险边界|\n|VF08 治疗/恢复|源到目标柔和流线|目标受益点有专属纹样|逐次恢复脉冲|纹样顺经脉/毛羽展开|完整回路后熄灭；不做持续满屏绿光|\n|VF09 声波/感知|方向锥/环短暂可见|分清源方向和受影响点|专属声纹带清晰节奏|多层细纹呈现传播|完整声纹回收；不能显示未感知敌人|\n|VF10 姿态/假影|真实姿态改变/一个标明的假影|皮肤/装备局部纹样|启动与结束独立动画|专属纹样短暂连贯|完整姿态演出，保留轮廓和反制提示|\n\n例如WS01五阶一直是刀刃带水弧，WS02一直是三道折峰，不共用同一刀光贴图代替差异。PET01雷枝从龙须与口发出，PET02火域按羽形向地面铺开；两者即使同属弹体也不同源骨骼、模型、动画、音色和末端碎片。技能强度通过命中反馈与数值共同表达，不靠无限增大人物或光柱。\n\n## 2. 动画与判定时间轴\n\n每套技能资源包包含概念正/侧视图、起手/命中/收势分镜、Blender源、带骨骼GLB、动画事件表、材质/贴图、五阶VFX配置、第一/第三人称验收视频。视频必须录真实可运行模型，不能用概念视频替代引擎验收。\n\n统一状态：Idle→Anticipation→Release/Active→Recovery→Locomotion；Interrupt、Blocked、OutOfResource各有退出。技能表前摇p对应Release时刻；后摇q为最后有效帧后的恢复时间。多段技能在自己的activeDuration内分段，持续场由场实体计时，人物完成释放后可移动。脚底贴地、重心、骨盆转动、肩肘跟随必须由骨骼与IK实现；不能把整人刚体向前平移当出拳。\n\n近战以上一帧至当前帧武器/爪尖扫掠体命中，去重键为castId+segmentId+targetId。投射物从真实发射挂点生成，枪口/口部到初始弹点做短射线，贴墙不能越墙出生。左右手切换、骑宠、趴下、第一人称镜头都不能改变服务器意义上的发射来源。\n\n施放中何时可转向/移动固定配置：近战前摇允许转向最多90°/秒，生效帧最多30°/秒；定向射线在释放前0.15秒冻结方向；H5开始锁定后移动速度50%，需要持续视线，完成后至结算不超过0.2秒。恢复期前50%不能接攻击，后50%可用闪避取消，已扣费用/冷却不退。按技能明确例外，不能以帧率改变取消窗口。\n\nH3至少0.6秒有效预警，表内更长者沿用；H5至少0.8秒，印记颜色加形状/音效双重编码，色盲模式可辨。多段预警按真实到达次序播放；地面坡度使用地形投影，不能悬空贴一张平面图掩盖碰撞误差。\n\n## 3. 双视角、宠物与空战\n\n未单列的弹体默认：H2速度24米/秒、碰撞半径0.15米；H4速度14米/秒、碰撞半径0.2米、最大转向45°/秒（WS19例外60°/秒）；最大路程为表中射程，耗尽即销毁。射线按卡片射线标记使用释放帧射线，不能同时生成第二份弹伤。H1默认最多4目标，H3/H7默认最多4目标且按离中心距离选择；友方默认单目标，明确光环才两目标。未写圆半径的锥为60°，未写线宽为0.6米。制作时不能靠视觉大小自行猜判定。\n\n第一人称模型显示实际装备：空手时无默认道具；扫描有取出/扫描/收起，剑技用剑，御法用手印，骑乘时双手随缰绳/鞍具。采用共享世界骨架加近景手臂层，遮挡处理不删除第三人称武器。施法镜头不强行夺取鼠标；可选轻微后坐与震动，可关闭。\n\n第三人称要看得见足步、髋肩扭转、武器重心和收势；宠物由真实四足/双足/翼/蛇形骨架驱动。朱雀与凤凰在羽冠、尾型、飞行节奏区分；青龙与应龙在翼和躯干结构区分；九尾狐尾巴数量不等于命中数量。迷你形态独立比例和碰撞，不能直接把成熟模型等比缩成难看的小点。\n\n骑宠空战：乘客、鞍座、宠物身体三个层级；俯仰滚转有舒适镜头限制，身体仍表现真实转向。地面专属招式在无合法地表时显示原因，提供可用空中技，不自动转换成未定义攻击。下宠后清除骑乘输入所有权和自由观察锁，验证鼠标不需要再按Alt才能控制方向。\n\n## 4. 首轮性能预算与资源目录\n\n预算是待实测目标：1080p中档单机同时8战斗单位，最多12高优先技能效果；总可见透明粒子≤4000，透明层叠主要区域≤4，动态技能灯≤4、投影阴影灯≤1。超过预算优先裁剪远处装饰尾迹，必须保留危险边界、锁印、弹核与核心；多人预算另行测定，不把此数当普适硬件保证。\n\nLOD0角色轮廓/骨架细节完整；LOD1减细分和装饰骨，LOD2烘焙次要材质并简化动画更新。近战命中永远用物理代理，不能因低LOD失去攻击；物理代理误差验收：近景攻击边界与画面主要轮廓差距≤0.15米或该招半径5%中较大者。\n\n建议 `assets/combat/{skillId}/v001/{source,concept,model,textures,animations,vfx,preview,manifest}`。manifest包含skillDefinitionVersion、skeletonVersion、五阶effectVariant、许可证、输入参考hash、生成任务ID、源/导出hash、验收视频路径。密钥不得进入清单；不要覆盖v001重做。项目引用具体发布版本，不引用下载临时目录。\n\n## 5. 开发顺序与验收\n\n先WS01、WS03、ES05、ES13、HS04、HS06六个人物样板；PET03/PET04/PET05三只宠物覆盖扑击/护盾/治疗；AR01/AR02覆盖告警与几何阵盾。每个样板先用真实3D白盒验证动作，再做概念批准和精模，最终五阶同镜头对照。确认原型乐趣与预算后扩展126主动配置，不能一次买完全部资产。\n\n逐招检查：命中/落空/挡住/打断/资源不足；五阶真实掉血与表一致；1/3视角、趴下、骑乘、空中、贴墙；30/60/120FPS判定一致；低特效模式仍看见危险；中文技能详情与兑换按钮不重叠。保存场景种子、版本、录屏与报告；当前文档审计不能替代这些未来引擎验收。\n","html":"\u003ch1>22 · 武技、宠物、阵法的3D与动画制作合同\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-22-v001.svg\" alt=\"从概念到能玩的3D\">\u003c/p>\u003cp>\u003cem>图解：概念画不是模型，展示视频不是引擎命中证据。\u003c/em>\u003c/p>\u003cp>设计稿；本轮没有生成新图片、视频或3D资产，也没有消耗Aholo积分。资产继续按\u003ca href=\"#17_PET_3D_FLIGHT_AND_ASSETS.md\">17\u003c/a>保存源文件、导出文件、预览、校验和与独立备份状态。\u003c/p>\u003ch2>1. 五阶效果的可制作定义\u003c/h2>\u003cp>\u003ca href=\"#20_PLAYER_MARTIAL_ARTS_60.md\">20人物\u003c/a>、\u003ca href=\"#21_PET_SKILLS_33.md\">21宠物\u003c/a>每招的“专属形状”是不可替换的轮廓身份，以下VF是制作结构而非把所有技能换颜色。每个技能都导出K1—K5五个表现配置；粒子和纹样升级不改变没有写入技能表的判定半径、弹体数或距离。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>谱系\u003c/th>\u003cth>入门K1\u003c/th>\u003cth>小成K2\u003c/th>\u003cth>精通K3\u003c/th>\u003cth>大成K4\u003c/th>\u003cth>圆满K5\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VF01 近战轨迹\u003c/td>\u003ctd>武器/肢体真实扫掠+短单轨\u003c/td>\u003ctd>轨迹边缘清晰、击点碎屑\u003c/td>\u003ctd>专属纹样沿轨流动\u003c/td>\u003ctd>前摇亮起纹样，命中形成短内环\u003c/td>\u003ctd>纹样完整闭合后收束回武器；不额外判一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF02 弹体射线\u003c/td>\u003ctd>实体弹核+短尾迹\u003c/td>\u003ctd>增加外壳与方向箭纹\u003c/td>\u003ctd>专属内核旋转、碰撞破裂\u003c/td>\u003ctd>双层尾迹、起手聚能\u003c/td>\u003ctd>完整纹样绕核、终点消散；装饰卫星不造成伤害\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF03 落点/震波\u003c/td>\u003ctd>清晰边界预警+一层冲击\u003c/td>\u003ctd>加边界倒计时刻度\u003c/td>\u003ctd>地表专属裂纹/符号\u003c/td>\u003ctd>立体预警轮廓与分段到达提示\u003c/td>\u003ctd>内外纹样贯通，收势回流；所有层仍同一事件预算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF04 护盾/招架\u003c/td>\u003ctd>可读薄面+受击点\u003c/td>\u003ctd>厚度边缘与剩余强度裂纹\u003c/td>\u003ctd>分片受击光，背侧不伪装防护\u003c/td>\u003ctd>专属结构分区开合\u003c/td>\u003ctd>完整结构及破碎收束；低血盾仍能看出快碎\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF05 锁定印\u003c/td>\u003ctd>目标脚下与身体印记+倒计时\u003c/td>\u003ctd>增加来源连线\u003c/td>\u003ctd>专属锁扣逐段闭合\u003c/td>\u003ctd>断锁时清晰分裂反馈\u003c/td>\u003ctd>完整印面/极短结算闪光；锁定时间不缩短\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF06 位移/扑击\u003c/td>\u003ctd>起步、接触地面、刹停三动作\u003c/td>\u003ctd>专属尾迹与制动碎屑\u003c/td>\u003ctd>路径曲率连续，身体倾斜更自然\u003c/td>\u003ctd>起终点纹样呼应\u003c/td>\u003ctd>完整短轨收束；不复制实体/增加无敌帧\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF07 持续场\u003c/td>\u003ctd>实际边界+核心\u003c/td>\u003ctd>每次结算脉冲\u003c/td>\u003ctd>显示剩余时间与可破坏核心\u003c/td>\u003ctd>专属立体低矮构件\u003c/td>\u003ctd>层次完整但视线中央留空；不得扩大安全/危险边界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF08 治疗/恢复\u003c/td>\u003ctd>源到目标柔和流线\u003c/td>\u003ctd>目标受益点有专属纹样\u003c/td>\u003ctd>逐次恢复脉冲\u003c/td>\u003ctd>纹样顺经脉/毛羽展开\u003c/td>\u003ctd>完整回路后熄灭；不做持续满屏绿光\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF09 声波/感知\u003c/td>\u003ctd>方向锥/环短暂可见\u003c/td>\u003ctd>分清源方向和受影响点\u003c/td>\u003ctd>专属声纹带清晰节奏\u003c/td>\u003ctd>多层细纹呈现传播\u003c/td>\u003ctd>完整声纹回收；不能显示未感知敌人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VF10 姿态/假影\u003c/td>\u003ctd>真实姿态改变/一个标明的假影\u003c/td>\u003ctd>皮肤/装备局部纹样\u003c/td>\u003ctd>启动与结束独立动画\u003c/td>\u003ctd>专属纹样短暂连贯\u003c/td>\u003ctd>完整姿态演出，保留轮廓和反制提示\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>例如WS01五阶一直是刀刃带水弧，WS02一直是三道折峰，不共用同一刀光贴图代替差异。PET01雷枝从龙须与口发出，PET02火域按羽形向地面铺开；两者即使同属弹体也不同源骨骼、模型、动画、音色和末端碎片。技能强度通过命中反馈与数值共同表达，不靠无限增大人物或光柱。\u003c/p>\u003ch2>2. 动画与判定时间轴\u003c/h2>\u003cp>每套技能资源包包含概念正/侧视图、起手/命中/收势分镜、Blender源、带骨骼GLB、动画事件表、材质/贴图、五阶VFX配置、第一/第三人称验收视频。视频必须录真实可运行模型，不能用概念视频替代引擎验收。\u003c/p>\u003cp>统一状态：Idle→Anticipation→Release/Active→Recovery→Locomotion；Interrupt、Blocked、OutOfResource各有退出。技能表前摇p对应Release时刻；后摇q为最后有效帧后的恢复时间。多段技能在自己的activeDuration内分段，持续场由场实体计时，人物完成释放后可移动。脚底贴地、重心、骨盆转动、肩肘跟随必须由骨骼与IK实现；不能把整人刚体向前平移当出拳。\u003c/p>\u003cp>近战以上一帧至当前帧武器/爪尖扫掠体命中，去重键为castId+segmentId+targetId。投射物从真实发射挂点生成，枪口/口部到初始弹点做短射线，贴墙不能越墙出生。左右手切换、骑宠、趴下、第一人称镜头都不能改变服务器意义上的发射来源。\u003c/p>\u003cp>施放中何时可转向/移动固定配置：近战前摇允许转向最多90°/秒，生效帧最多30°/秒；定向射线在释放前0.15秒冻结方向；H5开始锁定后移动速度50%，需要持续视线，完成后至结算不超过0.2秒。恢复期前50%不能接攻击，后50%可用闪避取消，已扣费用/冷却不退。按技能明确例外，不能以帧率改变取消窗口。\u003c/p>\u003cp>H3至少0.6秒有效预警，表内更长者沿用；H5至少0.8秒，印记颜色加形状/音效双重编码，色盲模式可辨。多段预警按真实到达次序播放；地面坡度使用地形投影，不能悬空贴一张平面图掩盖碰撞误差。\u003c/p>\u003ch2>3. 双视角、宠物与空战\u003c/h2>\u003cp>未单列的弹体默认：H2速度24米/秒、碰撞半径0.15米；H4速度14米/秒、碰撞半径0.2米、最大转向45°/秒（WS19例外60°/秒）；最大路程为表中射程，耗尽即销毁。射线按卡片射线标记使用释放帧射线，不能同时生成第二份弹伤。H1默认最多4目标，H3/H7默认最多4目标且按离中心距离选择；友方默认单目标，明确光环才两目标。未写圆半径的锥为60°，未写线宽为0.6米。制作时不能靠视觉大小自行猜判定。\u003c/p>\u003cp>第一人称模型显示实际装备：空手时无默认道具；扫描有取出/扫描/收起，剑技用剑，御法用手印，骑乘时双手随缰绳/鞍具。采用共享世界骨架加近景手臂层，遮挡处理不删除第三人称武器。施法镜头不强行夺取鼠标；可选轻微后坐与震动，可关闭。\u003c/p>\u003cp>第三人称要看得见足步、髋肩扭转、武器重心和收势；宠物由真实四足/双足/翼/蛇形骨架驱动。朱雀与凤凰在羽冠、尾型、飞行节奏区分；青龙与应龙在翼和躯干结构区分；九尾狐尾巴数量不等于命中数量。迷你形态独立比例和碰撞，不能直接把成熟模型等比缩成难看的小点。\u003c/p>\u003cp>骑宠空战：乘客、鞍座、宠物身体三个层级；俯仰滚转有舒适镜头限制，身体仍表现真实转向。地面专属招式在无合法地表时显示原因，提供可用空中技，不自动转换成未定义攻击。下宠后清除骑乘输入所有权和自由观察锁，验证鼠标不需要再按Alt才能控制方向。\u003c/p>\u003ch2>4. 首轮性能预算与资源目录\u003c/h2>\u003cp>预算是待实测目标：1080p中档单机同时8战斗单位，最多12高优先技能效果；总可见透明粒子≤4000，透明层叠主要区域≤4，动态技能灯≤4、投影阴影灯≤1。超过预算优先裁剪远处装饰尾迹，必须保留危险边界、锁印、弹核与核心；多人预算另行测定，不把此数当普适硬件保证。\u003c/p>\u003cp>LOD0角色轮廓/骨架细节完整；LOD1减细分和装饰骨，LOD2烘焙次要材质并简化动画更新。近战命中永远用物理代理，不能因低LOD失去攻击；物理代理误差验收：近景攻击边界与画面主要轮廓差距≤0.15米或该招半径5%中较大者。\u003c/p>\u003cp>建议 \u003ccode>assets/combat/{skillId}/v001/{source,concept,model,textures,animations,vfx,preview,manifest}\u003c/code>。manifest包含skillDefinitionVersion、skeletonVersion、五阶effectVariant、许可证、输入参考hash、生成任务ID、源/导出hash、验收视频路径。密钥不得进入清单；不要覆盖v001重做。项目引用具体发布版本，不引用下载临时目录。\u003c/p>\u003ch2>5. 开发顺序与验收\u003c/h2>\u003cp>先WS01、WS03、ES05、ES13、HS04、HS06六个人物样板；PET03/PET04/PET05三只宠物覆盖扑击/护盾/治疗；AR01/AR02覆盖告警与几何阵盾。每个样板先用真实3D白盒验证动作，再做概念批准和精模，最终五阶同镜头对照。确认原型乐趣与预算后扩展126主动配置，不能一次买完全部资产。\u003c/p>\u003cp>逐招检查：命中/落空/挡住/打断/资源不足；五阶真实掉血与表一致；1/3视角、趴下、骑乘、空中、贴墙；30/60/120FPS判定一致；低特效模式仍看见危险；中文技能详情与兑换按钮不重叠。保存场景种子、版本、录屏与报告；当前文档审计不能替代这些未来引擎验收。\u003c/p>"},{"file":"23_SECTS_NPCS_MISSIONS_AND_DUELS.md","title":"23 · 宗门、NPC、任务兑换与比武","text":"# 23 · 宗门、NPC、任务兑换与比武\n\n\u003c!-- illustrated-overview:start -->\n![加入宗门后做什么](media/diagram-23-v001.svg)\n\n*图解：6宗门、12委托模板、20兑换项；必须给贡献实际用途。*\n\u003c!-- illustrated-overview:end -->\n\n设计稿；沿用单机优先，[14](14_OFFLINE_AND_ONLINE_BOUNDARY.md)定义后续联网归属。六个宗门不是六个必须依次加入的职业，科技营地始终保留医治、维修、基础教学和救援。\n\n## 1. 发现与加入\n\n世界上层新增一神国、二洞天、三学府、四圣地，六宗门的上层关联及个人关系分离规则见[29](29_SUPREME_FACTIONS_AND_STORY.md)。本章仍负责六个可加入宗门的前期服务，不将20个支门派直接复制成20套职业菜单。\n\n后天R0三级由N05解释“武技不是境界，传承不止科技”；地图只记录听过的传闻。六级开放武院外门试炼；正式入门一般R1起。高阶宗门可从传闻了解到，实际会面仍受星际交通与区域危险约束。接引匹配按已发现宗门、最低境界、任务信誉、玩家意向筛选，显示具体缺项，不随机抽一个决定终身路线。\n\n|ID 宗门|地区/定位|入门要求|传承与实用服务|冲突与探索线索|\n|---|---|---|---|---|\n|S01 玄衡武院|Z0边缘，科技与武修桥梁|外门R0六级完成格挡/闪避/救援；正式R1、信誉20|刀枪拳基础、训练木人、阵法入门、立宗登记|救援路线被兽潮阻断，保护归航塔|\n|S02 青岚剑宗|Z2高崖，剑/风|R1五级、信誉30、通过移动靶试剑|御剑传承、身法、轻装锻造|失落剑碑与山门风眼|\n|S03 赤炉门|Z2熔谷，器/火/金|R2、信誉30、交一次合格自采陨铁样本|陨石分级、锻造、阵器核心|矿脉争夺，熔炉污染治理|\n|S04 回春谷|Z1水林，丹/木/水|R1三级、信誉25、成功采药救人|疗伤丹、回气丹、药圃与净化|毒瘴与失传药谱|\n|S05 御灵山|Z2兽谷，灵宠/羁绊|R1、信誉25、完成非伤害安抚任务；不要求已有稀宠|兽诀、孵化、鞍具、灵兽栏|迁徙兽群和遗失兽卵|\n|S06 太虚星宫|空衡星，空间/星阵|R6、信誉50、完成安全传送测绘|空间术、跨星阵维护、星材研究|失稳星门、远古坐标与护航|\n\n信誉来自完成对应任务，普通每次+5、不同支线首次+10；达到要求只证明合作，不直接给属性。入门不收稀有内丹。一次只能有一个正式宗籍，可以访学其他宗门；访学买基础配方价格+20%，核心研究需公开试炼。退出保留学过武技、贡献和个人资产，停止仅在岗生效的设施服务；再次任职有3个有效游玩小时间隔，不靠读档反复领入门礼。入门礼按角色+宗门永久一次。\n\n宗门被毁时必要技能转由幸存导师/书商公开路线提供；第20的散修挑战和研究保底始终存在。任何必需突破材料都不能被一个可毁建筑独占。\n\n## 2. 新增12名固定NPC\n\n本章历史增补将NPC从26增至38；最新第29章再增顶层领袖10名和支门派人物20名，现固定名册68名。本章12人的编号不变。这里是详细职能，第05同步总名册，ID不复用。\n\n|NPC|所属|职务与界面|可领取的长期线|\n|---|---|---|---|\n|N27 顾行简|S01|院正/立宗登记：宗籍、试炼、宗门章程|从训练伤员到护卫一方|\n|N28 叶知锋|S01|演武执事：招式教学、贡献兑换、比武报名|六种实战情境考核|\n|N29 沈清岳|S02|传剑长老：剑风武技、进阶验证|寻找断裂剑碑|\n|N30 乔听澜|S02|巡山执事：巡逻、护送、风眼材料兑换|重建高崖索道|\n|N31 炎百炼|S03|炉主：高品质锻造研究、阵器核心|修复古炉而非无限投矿|\n|N32 罗星砂|S03|矿务执事：采矿、熔渣治理、锻材兑换|揭露矿区失衡|\n|N33 温素问|S04|谷主：功能丹谱、疑难伤势、药圃教学|净化水源三阶段|\n|N34 何采苓|S04|药圃执事：采集、疗养委托、药材兑换|按生态补种药圃|\n|N35 牧云生|S05|御灵长老：兽诀、契约、载宠训练|与成熟兽建立信任|\n|N36 鹿小满|S05|灵兽执事：饲料、走失宠救援、鞍具兑换|找回有个体身份的幼兽|\n|N37 裴观辰|S06|星阵长老：空间术、星际阵图|校准三处真实星门|\n|N38 闻星渡|S06|远征执事：星际护航、星材、比武联络|寻回失联勘探队|\n\nN25宠物医师、N26服装师继续提供通用服务，不被御灵山取代。上述NPC是固定角色；临时弟子、护卫、商旅由世界刷新系统分配实例ID，不计入38名固定剧情人物。\n\n## 3. 任务模板与奖励预算\n\n|ID|任务|真实完成事件|贡献/信誉|防重复与失败恢复|\n|---|---|---|---|---|\n|SQ01|清剿威胁|消灭指定区域3只当前合格敌人|30/+5|敌实例死亡ID去重，不刷教学怪|\n|SQ02|采集样本|上交4份任务指定普通材料|25/+5|先显示品级、重量、扣除清单|\n|SQ03|救援新手|找到伤员并护送抵安全点|40/+5|昏迷不死亡，可重新寻人|\n|SQ04|护送商队|经过3段实际路线保护货箱|45/+5|不是点击等待领奖，损坏有分档|\n|SQ05|试炼武技|对三类威胁正确运用技能|35/+5|无空挥刷进度，允许失败重试|\n|SQ06|炼制补给|炼成并交付两份指定功能丹|40/+5|同ID药品扣除，任务成本预览|\n|SQ07|锻造阵器|完成一个合格核心制作|50/+5|成品上交后不能仍留背包|\n|SQ08|灵兽安抚|合法喂养/营救三次有效事件|35/+5|不要求杀宠，不重复刷新幼兽|\n|SQ09|遗迹测绘|记录三个未归档观测点|50/+5|世界种子和观测ID保存|\n|SQ10|阵法维护|诊断并更换失效节点|40/+5|真实损耗由事件产生，不自己拆了刷|\n|SQ11|宗门防卫|一次来袭中守住/撤离核心人员|60/+5|接受事件后固定结果，杀友军不计|\n|SQ12|跨星远征|R6以上寻回遗失研究记录|80/+5|永久唯一首次奖励，无每日复制|\n\n每宗同时展示3个适合境界和生态的普通委托、最多2个长线节点；刷新依据已完成/失效事件，不靠反复打开菜单重抽。单次有效游玩日定义为累计在线3小时窗口，普通贡献满300后后续同类奖励降为25%，不同长线首次不受此限；离线不积累委托窗口。任务说明展示此规则，不能偷偷扣奖励。信誉每日重复同模板最多三次计入，长线独立。\n\n普通委托材料价值应约为该境安全远征净收益的20—40%，贡献兑换价值约等于付出时间，不让上交NPC廉价购货形成无限灵石循环。击杀掉落和任务奖励分开，后者不再次生成同一内丹。所有接取、扣料、奖励使用taskInstanceId+claimId原子事务。\n\n## 4. 贡献商店（首轮价格，非充值货币）\n\n贡献为个人在各宗的不可交易服务记录，不与灵石固定兑换。物品分阶，消耗同档材料与声望门槛；下表常规消耗品默认T1/Q3，升到Tn价格×(1+0.5×(n−1))，并要求已达Rn。高品Q5/Q6、祖脉蛋和永久机缘不进无限货架。\n\n|ID|奖励|贡献|用途/限制|\n|---|---|---|---|\n|SX01|同阶疗伤丹×2|30|伤后恢复，继承MED共享CD|\n|SX02|同阶回气丹×2|35|远征续航|\n|SX03|同阶续力丹×2|30|体力恢复|\n|SX04|解毒净化包×2|30|毒地探索|\n|SX05|普通药材选包×4|40|只选本宗当阶常见草药|\n|SX06|普通陨材×3|45|打造武器，不含稀有星核|\n|SX07|兽粮×5|35|对应FD饮食，不增加喂食次数上限|\n|SX08|孵化稳定剂×1|60|增加孵化容错，不能跳过孵化流程|\n|SX09|修理服务券×1|25|一次普通装备维护，不套现|\n|SX10|D1武技传承任选|100|目录内本宗传承，已学不可重复领补偿|\n|SX11|D2武技传承任选|180|仍需前置和验证|\n|SX12|D3研究页×1|120|三页换一本合格D3武技，保存研究ID|\n|SX13|基础兽诀PM任选|150|六PM目录，不凭空给满掌握|\n|SX14|基础阵图AR01或AR03|120|学会后自行准备材料|\n|SX15|建筑蓝图基础包|100|库房/药圃/工坊，不附免费资源|\n|SX16|普通扩容材料包|90|仅EX01/EX02，同等物料总量封顶|\n|SX17|区域传闻坐标×1|70|未完成普通机缘线索，非极品保底|\n|SX18|普通鞍具图纸|140|按17匹配体型与载重|\n|SX19|宗门装扮/宠物纹章|80|纯外观，跟个体身份绑定|\n|SX20|D4专项试炼资格|300|达到门槛后开放挑战，失败可重试|\n\n消耗品和普通材料可交易，遵循用户自由经济方向；服务、知识、资格、贡献不可转卖。实现时以商店售价、上交任务收购额度与兑换产出联合检查套利，不能为省事把全部材料绑死。每个交易预览写数量、阶品、容量、花费、到货位置；背包满可选飞行器货舱或取消，不吞物。\n\n## 5. 比武与任务对话\n\n单机先做NPC对练、宗门四强赛、跨宗八强赛三种；正式赛1v1，宠物赛另设1人1战宠组，不让纯人物赛突然出现宠物。报名展示真实实力赛/标准擂台两套规则：真实实力赛按大境界分组、小级差≤3；标准擂台统一该境三级基础属性与Q3装备预算，保留已学武技和五阶掌握，不能授予未学高阶技能。两种榜单分开，不宣称后天能公平硬打道源。\n\n三局两胜、单局180秒，60秒准备；边界清晰，出界3秒警告再判负。禁爆发后遗症丹、外部阵法和环境飞行器；比赛专用资源在每局恢复，离场恢复入场快照，不能借比武治疗实际伤势/清除丹毒。常规药品是否允许在报名规则明确，默认禁药。\n\n首胜奖励贡献40、一次赛事冠军80与外观记录；同赛事ID再战只练习，不重复领奖。没有死亡/掉级；输后显示三项实际问题（命中、无效耗气、吃到哪类预警），可直接去训练复盘。高阶比武使用安全试炼空间，毁星能力不对普通擂台生效。\n\nNPC对话页：身份/宗门关系→交谈、任务、学习、兑换、比武、离开。任务详情必须展示门槛、路线危险、贡献与材料收益、是否上交；缺项给导航“学习招式/寻材料”，不弹无法关闭的说教。创建宗门和退出宗籍必须展示具体影响并由玩家在游戏内确认。桌面1080p与1280×720验证长中文滚动、按钮固定可点，打开界面释放鼠标，关闭恢复原第一/第三人称控制状态。\n\n## 6. 战争和世界刷新接入\n\n宗门状态为繁荣/受压/戒备/战斗/破败/重建/复兴。世界刷新根据区域威胁、资源流、剧情与玩家行为安排兽潮/敌对袭击，不直接掷一次骰子删除宗门。首次攻城先有传闻、巡逻异常、至少10分钟在线准备及撤离任务；玩家未开启战争体验时只发生外围冲突。单机离线冻结破坏，不因三天没上线回来只剩废墟。\n\n建筑可毁、宗门组织可覆灭；存档仍保留历史sectId、曾任身份、已学知识、贡献债权和资产归属。幸存导师迁移到可达的营地，银行/私人仓储转为恢复凭证而非复制物品；重建恢复原账，不重新发一份。完整建造/阵法/撤离流程见[24](24_SECT_BUILDINGS_AND_FORMATIONS.md)。\n","html":"\u003ch1>23 · 宗门、NPC、任务兑换与比武\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-23-v001.svg\" alt=\"加入宗门后做什么\">\u003c/p>\u003cp>\u003cem>图解：6宗门、12委托模板、20兑换项；必须给贡献实际用途。\u003c/em>\u003c/p>\u003cp>设计稿；沿用单机优先，\u003ca href=\"#14_OFFLINE_AND_ONLINE_BOUNDARY.md\">14\u003c/a>定义后续联网归属。六个宗门不是六个必须依次加入的职业，科技营地始终保留医治、维修、基础教学和救援。\u003c/p>\u003ch2>1. 发现与加入\u003c/h2>\u003cp>世界上层新增一神国、二洞天、三学府、四圣地，六宗门的上层关联及个人关系分离规则见\u003ca href=\"#29_SUPREME_FACTIONS_AND_STORY.md\">29\u003c/a>。本章仍负责六个可加入宗门的前期服务，不将20个支门派直接复制成20套职业菜单。\u003c/p>\u003cp>后天R0三级由N05解释“武技不是境界，传承不止科技”；地图只记录听过的传闻。六级开放武院外门试炼；正式入门一般R1起。高阶宗门可从传闻了解到，实际会面仍受星际交通与区域危险约束。接引匹配按已发现宗门、最低境界、任务信誉、玩家意向筛选，显示具体缺项，不随机抽一个决定终身路线。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 宗门\u003c/th>\u003cth>地区/定位\u003c/th>\u003cth>入门要求\u003c/th>\u003cth>传承与实用服务\u003c/th>\u003cth>冲突与探索线索\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>S01 玄衡武院\u003c/td>\u003ctd>Z0边缘，科技与武修桥梁\u003c/td>\u003ctd>外门R0六级完成格挡/闪避/救援；正式R1、信誉20\u003c/td>\u003ctd>刀枪拳基础、训练木人、阵法入门、立宗登记\u003c/td>\u003ctd>救援路线被兽潮阻断，保护归航塔\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S02 青岚剑宗\u003c/td>\u003ctd>Z2高崖，剑/风\u003c/td>\u003ctd>R1五级、信誉30、通过移动靶试剑\u003c/td>\u003ctd>御剑传承、身法、轻装锻造\u003c/td>\u003ctd>失落剑碑与山门风眼\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S03 赤炉门\u003c/td>\u003ctd>Z2熔谷，器/火/金\u003c/td>\u003ctd>R2、信誉30、交一次合格自采陨铁样本\u003c/td>\u003ctd>陨石分级、锻造、阵器核心\u003c/td>\u003ctd>矿脉争夺，熔炉污染治理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S04 回春谷\u003c/td>\u003ctd>Z1水林，丹/木/水\u003c/td>\u003ctd>R1三级、信誉25、成功采药救人\u003c/td>\u003ctd>疗伤丹、回气丹、药圃与净化\u003c/td>\u003ctd>毒瘴与失传药谱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S05 御灵山\u003c/td>\u003ctd>Z2兽谷，灵宠/羁绊\u003c/td>\u003ctd>R1、信誉25、完成非伤害安抚任务；不要求已有稀宠\u003c/td>\u003ctd>兽诀、孵化、鞍具、灵兽栏\u003c/td>\u003ctd>迁徙兽群和遗失兽卵\u003c/td>\u003c/tr>\u003ctr>\u003ctd>S06 太虚星宫\u003c/td>\u003ctd>空衡星，空间/星阵\u003c/td>\u003ctd>R6、信誉50、完成安全传送测绘\u003c/td>\u003ctd>空间术、跨星阵维护、星材研究\u003c/td>\u003ctd>失稳星门、远古坐标与护航\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>信誉来自完成对应任务，普通每次+5、不同支线首次+10；达到要求只证明合作，不直接给属性。入门不收稀有内丹。一次只能有一个正式宗籍，可以访学其他宗门；访学买基础配方价格+20%，核心研究需公开试炼。退出保留学过武技、贡献和个人资产，停止仅在岗生效的设施服务；再次任职有3个有效游玩小时间隔，不靠读档反复领入门礼。入门礼按角色+宗门永久一次。\u003c/p>\u003cp>宗门被毁时必要技能转由幸存导师/书商公开路线提供；第20的散修挑战和研究保底始终存在。任何必需突破材料都不能被一个可毁建筑独占。\u003c/p>\u003ch2>2. 新增12名固定NPC\u003c/h2>\u003cp>本章历史增补将NPC从26增至38；最新第29章再增顶层领袖10名和支门派人物20名，现固定名册68名。本章12人的编号不变。这里是详细职能，第05同步总名册，ID不复用。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>NPC\u003c/th>\u003cth>所属\u003c/th>\u003cth>职务与界面\u003c/th>\u003cth>可领取的长期线\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>N27 顾行简\u003c/td>\u003ctd>S01\u003c/td>\u003ctd>院正/立宗登记：宗籍、试炼、宗门章程\u003c/td>\u003ctd>从训练伤员到护卫一方\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N28 叶知锋\u003c/td>\u003ctd>S01\u003c/td>\u003ctd>演武执事：招式教学、贡献兑换、比武报名\u003c/td>\u003ctd>六种实战情境考核\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N29 沈清岳\u003c/td>\u003ctd>S02\u003c/td>\u003ctd>传剑长老：剑风武技、进阶验证\u003c/td>\u003ctd>寻找断裂剑碑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N30 乔听澜\u003c/td>\u003ctd>S02\u003c/td>\u003ctd>巡山执事：巡逻、护送、风眼材料兑换\u003c/td>\u003ctd>重建高崖索道\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N31 炎百炼\u003c/td>\u003ctd>S03\u003c/td>\u003ctd>炉主：高品质锻造研究、阵器核心\u003c/td>\u003ctd>修复古炉而非无限投矿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N32 罗星砂\u003c/td>\u003ctd>S03\u003c/td>\u003ctd>矿务执事：采矿、熔渣治理、锻材兑换\u003c/td>\u003ctd>揭露矿区失衡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N33 温素问\u003c/td>\u003ctd>S04\u003c/td>\u003ctd>谷主：功能丹谱、疑难伤势、药圃教学\u003c/td>\u003ctd>净化水源三阶段\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N34 何采苓\u003c/td>\u003ctd>S04\u003c/td>\u003ctd>药圃执事：采集、疗养委托、药材兑换\u003c/td>\u003ctd>按生态补种药圃\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N35 牧云生\u003c/td>\u003ctd>S05\u003c/td>\u003ctd>御灵长老：兽诀、契约、载宠训练\u003c/td>\u003ctd>与成熟兽建立信任\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N36 鹿小满\u003c/td>\u003ctd>S05\u003c/td>\u003ctd>灵兽执事：饲料、走失宠救援、鞍具兑换\u003c/td>\u003ctd>找回有个体身份的幼兽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N37 裴观辰\u003c/td>\u003ctd>S06\u003c/td>\u003ctd>星阵长老：空间术、星际阵图\u003c/td>\u003ctd>校准三处真实星门\u003c/td>\u003c/tr>\u003ctr>\u003ctd>N38 闻星渡\u003c/td>\u003ctd>S06\u003c/td>\u003ctd>远征执事：星际护航、星材、比武联络\u003c/td>\u003ctd>寻回失联勘探队\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>N25宠物医师、N26服装师继续提供通用服务，不被御灵山取代。上述NPC是固定角色；临时弟子、护卫、商旅由世界刷新系统分配实例ID，不计入38名固定剧情人物。\u003c/p>\u003ch2>3. 任务模板与奖励预算\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>任务\u003c/th>\u003cth>真实完成事件\u003c/th>\u003cth>贡献/信誉\u003c/th>\u003cth>防重复与失败恢复\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SQ01\u003c/td>\u003ctd>清剿威胁\u003c/td>\u003ctd>消灭指定区域3只当前合格敌人\u003c/td>\u003ctd>30/+5\u003c/td>\u003ctd>敌实例死亡ID去重，不刷教学怪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ02\u003c/td>\u003ctd>采集样本\u003c/td>\u003ctd>上交4份任务指定普通材料\u003c/td>\u003ctd>25/+5\u003c/td>\u003ctd>先显示品级、重量、扣除清单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ03\u003c/td>\u003ctd>救援新手\u003c/td>\u003ctd>找到伤员并护送抵安全点\u003c/td>\u003ctd>40/+5\u003c/td>\u003ctd>昏迷不死亡，可重新寻人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ04\u003c/td>\u003ctd>护送商队\u003c/td>\u003ctd>经过3段实际路线保护货箱\u003c/td>\u003ctd>45/+5\u003c/td>\u003ctd>不是点击等待领奖，损坏有分档\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ05\u003c/td>\u003ctd>试炼武技\u003c/td>\u003ctd>对三类威胁正确运用技能\u003c/td>\u003ctd>35/+5\u003c/td>\u003ctd>无空挥刷进度，允许失败重试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ06\u003c/td>\u003ctd>炼制补给\u003c/td>\u003ctd>炼成并交付两份指定功能丹\u003c/td>\u003ctd>40/+5\u003c/td>\u003ctd>同ID药品扣除，任务成本预览\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ07\u003c/td>\u003ctd>锻造阵器\u003c/td>\u003ctd>完成一个合格核心制作\u003c/td>\u003ctd>50/+5\u003c/td>\u003ctd>成品上交后不能仍留背包\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ08\u003c/td>\u003ctd>灵兽安抚\u003c/td>\u003ctd>合法喂养/营救三次有效事件\u003c/td>\u003ctd>35/+5\u003c/td>\u003ctd>不要求杀宠，不重复刷新幼兽\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ09\u003c/td>\u003ctd>遗迹测绘\u003c/td>\u003ctd>记录三个未归档观测点\u003c/td>\u003ctd>50/+5\u003c/td>\u003ctd>世界种子和观测ID保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ10\u003c/td>\u003ctd>阵法维护\u003c/td>\u003ctd>诊断并更换失效节点\u003c/td>\u003ctd>40/+5\u003c/td>\u003ctd>真实损耗由事件产生，不自己拆了刷\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ11\u003c/td>\u003ctd>宗门防卫\u003c/td>\u003ctd>一次来袭中守住/撤离核心人员\u003c/td>\u003ctd>60/+5\u003c/td>\u003ctd>接受事件后固定结果，杀友军不计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SQ12\u003c/td>\u003ctd>跨星远征\u003c/td>\u003ctd>R6以上寻回遗失研究记录\u003c/td>\u003ctd>80/+5\u003c/td>\u003ctd>永久唯一首次奖励，无每日复制\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每宗同时展示3个适合境界和生态的普通委托、最多2个长线节点；刷新依据已完成/失效事件，不靠反复打开菜单重抽。单次有效游玩日定义为累计在线3小时窗口，普通贡献满300后后续同类奖励降为25%，不同长线首次不受此限；离线不积累委托窗口。任务说明展示此规则，不能偷偷扣奖励。信誉每日重复同模板最多三次计入，长线独立。\u003c/p>\u003cp>普通委托材料价值应约为该境安全远征净收益的20—40%，贡献兑换价值约等于付出时间，不让上交NPC廉价购货形成无限灵石循环。击杀掉落和任务奖励分开，后者不再次生成同一内丹。所有接取、扣料、奖励使用taskInstanceId+claimId原子事务。\u003c/p>\u003ch2>4. 贡献商店（首轮价格，非充值货币）\u003c/h2>\u003cp>贡献为个人在各宗的不可交易服务记录，不与灵石固定兑换。物品分阶，消耗同档材料与声望门槛；下表常规消耗品默认T1/Q3，升到Tn价格×(1+0.5×(n−1))，并要求已达Rn。高品Q5/Q6、祖脉蛋和永久机缘不进无限货架。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>奖励\u003c/th>\u003cth>贡献\u003c/th>\u003cth>用途/限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SX01\u003c/td>\u003ctd>同阶疗伤丹×2\u003c/td>\u003ctd>30\u003c/td>\u003ctd>伤后恢复，继承MED共享CD\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX02\u003c/td>\u003ctd>同阶回气丹×2\u003c/td>\u003ctd>35\u003c/td>\u003ctd>远征续航\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX03\u003c/td>\u003ctd>同阶续力丹×2\u003c/td>\u003ctd>30\u003c/td>\u003ctd>体力恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX04\u003c/td>\u003ctd>解毒净化包×2\u003c/td>\u003ctd>30\u003c/td>\u003ctd>毒地探索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX05\u003c/td>\u003ctd>普通药材选包×4\u003c/td>\u003ctd>40\u003c/td>\u003ctd>只选本宗当阶常见草药\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX06\u003c/td>\u003ctd>普通陨材×3\u003c/td>\u003ctd>45\u003c/td>\u003ctd>打造武器，不含稀有星核\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX07\u003c/td>\u003ctd>兽粮×5\u003c/td>\u003ctd>35\u003c/td>\u003ctd>对应FD饮食，不增加喂食次数上限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX08\u003c/td>\u003ctd>孵化稳定剂×1\u003c/td>\u003ctd>60\u003c/td>\u003ctd>增加孵化容错，不能跳过孵化流程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX09\u003c/td>\u003ctd>修理服务券×1\u003c/td>\u003ctd>25\u003c/td>\u003ctd>一次普通装备维护，不套现\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX10\u003c/td>\u003ctd>D1武技传承任选\u003c/td>\u003ctd>100\u003c/td>\u003ctd>目录内本宗传承，已学不可重复领补偿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX11\u003c/td>\u003ctd>D2武技传承任选\u003c/td>\u003ctd>180\u003c/td>\u003ctd>仍需前置和验证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX12\u003c/td>\u003ctd>D3研究页×1\u003c/td>\u003ctd>120\u003c/td>\u003ctd>三页换一本合格D3武技，保存研究ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX13\u003c/td>\u003ctd>基础兽诀PM任选\u003c/td>\u003ctd>150\u003c/td>\u003ctd>六PM目录，不凭空给满掌握\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX14\u003c/td>\u003ctd>基础阵图AR01或AR03\u003c/td>\u003ctd>120\u003c/td>\u003ctd>学会后自行准备材料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX15\u003c/td>\u003ctd>建筑蓝图基础包\u003c/td>\u003ctd>100\u003c/td>\u003ctd>库房/药圃/工坊，不附免费资源\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX16\u003c/td>\u003ctd>普通扩容材料包\u003c/td>\u003ctd>90\u003c/td>\u003ctd>仅EX01/EX02，同等物料总量封顶\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX17\u003c/td>\u003ctd>区域传闻坐标×1\u003c/td>\u003ctd>70\u003c/td>\u003ctd>未完成普通机缘线索，非极品保底\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX18\u003c/td>\u003ctd>普通鞍具图纸\u003c/td>\u003ctd>140\u003c/td>\u003ctd>按17匹配体型与载重\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX19\u003c/td>\u003ctd>宗门装扮/宠物纹章\u003c/td>\u003ctd>80\u003c/td>\u003ctd>纯外观，跟个体身份绑定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SX20\u003c/td>\u003ctd>D4专项试炼资格\u003c/td>\u003ctd>300\u003c/td>\u003ctd>达到门槛后开放挑战，失败可重试\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>消耗品和普通材料可交易，遵循用户自由经济方向；服务、知识、资格、贡献不可转卖。实现时以商店售价、上交任务收购额度与兑换产出联合检查套利，不能为省事把全部材料绑死。每个交易预览写数量、阶品、容量、花费、到货位置；背包满可选飞行器货舱或取消，不吞物。\u003c/p>\u003ch2>5. 比武与任务对话\u003c/h2>\u003cp>单机先做NPC对练、宗门四强赛、跨宗八强赛三种；正式赛1v1，宠物赛另设1人1战宠组，不让纯人物赛突然出现宠物。报名展示真实实力赛/标准擂台两套规则：真实实力赛按大境界分组、小级差≤3；标准擂台统一该境三级基础属性与Q3装备预算，保留已学武技和五阶掌握，不能授予未学高阶技能。两种榜单分开，不宣称后天能公平硬打道源。\u003c/p>\u003cp>三局两胜、单局180秒，60秒准备；边界清晰，出界3秒警告再判负。禁爆发后遗症丹、外部阵法和环境飞行器；比赛专用资源在每局恢复，离场恢复入场快照，不能借比武治疗实际伤势/清除丹毒。常规药品是否允许在报名规则明确，默认禁药。\u003c/p>\u003cp>首胜奖励贡献40、一次赛事冠军80与外观记录；同赛事ID再战只练习，不重复领奖。没有死亡/掉级；输后显示三项实际问题（命中、无效耗气、吃到哪类预警），可直接去训练复盘。高阶比武使用安全试炼空间，毁星能力不对普通擂台生效。\u003c/p>\u003cp>NPC对话页：身份/宗门关系→交谈、任务、学习、兑换、比武、离开。任务详情必须展示门槛、路线危险、贡献与材料收益、是否上交；缺项给导航“学习招式/寻材料”，不弹无法关闭的说教。创建宗门和退出宗籍必须展示具体影响并由玩家在游戏内确认。桌面1080p与1280×720验证长中文滚动、按钮固定可点，打开界面释放鼠标，关闭恢复原第一/第三人称控制状态。\u003c/p>\u003ch2>6. 战争和世界刷新接入\u003c/h2>\u003cp>宗门状态为繁荣/受压/戒备/战斗/破败/重建/复兴。世界刷新根据区域威胁、资源流、剧情与玩家行为安排兽潮/敌对袭击，不直接掷一次骰子删除宗门。首次攻城先有传闻、巡逻异常、至少10分钟在线准备及撤离任务；玩家未开启战争体验时只发生外围冲突。单机离线冻结破坏，不因三天没上线回来只剩废墟。\u003c/p>\u003cp>建筑可毁、宗门组织可覆灭；存档仍保留历史sectId、曾任身份、已学知识、贡献债权和资产归属。幸存导师迁移到可达的营地，银行/私人仓储转为恢复凭证而非复制物品；重建恢复原账，不重新发一份。完整建造/阵法/撤离流程见\u003ca href=\"#24_SECT_BUILDINGS_AND_FORMATIONS.md\">24\u003c/a>。\u003c/p>"},{"file":"24_SECT_BUILDINGS_AND_FORMATIONS.md","title":"24 · 建宗、建筑、阵法与覆灭重建","text":"# 24 · 建宗、建筑、阵法与覆灭重建\n\n\u003c!-- illustrated-overview:start -->\n![一个宗门的生命周期](media/diagram-24-v001.svg)\n\n*图解：12建筑、12阵法；离线不偷偷模拟攻城毁掉玩家家园。*\n\u003c!-- illustrated-overview:end -->\n\n设计稿；与[23宗门](23_SECTS_NPCS_MISSIONS_AND_DUELS.md)、[08世界刷新](08_WORLD_DIRECTOR.md)、[11洞府](11_CAVES_AND_FORTUNES.md)同项目维护。无需新开项目：宗门是世界中的持久实体，阵法是战斗/建筑模块，刷新系统只提出事件，不直接改库存或算伤害。\n\n## 1. 学习与创建路径\n\nR1三级可在N27学习“识阵与布基”：完成三个可重复安全练习（识别阵眼、连接两个节点、切断危险供能），收费200碎灵石，无随机失败。随后可学AR01告警和AR03净息小阵，私人洞府也能使用，不必先建宗。储物扩容仍走第10的原有基础技能，不以阵法技能替代。\n\nR2五级可申请立宗：完成一次救援、一项建设实习、识阵与布基；交立宗费用10,000碎灵石、同阶普通陨材20单位、普通木石结构料40单位。费用预览可达性与当前持有量，不要求稀有内丹。成为宗主前退出正式宗籍，可保留访学关系。单机每角色同时一处主宗址、后续最多两处不独立产贡献的分院。\n\n创建流程：选择学派→勘探候选地→检查地权/道路/生态→预览地基与预算→命名及纹章→确认投入→分阶段建设。学派为武修、丹器、御灵、守望四选一，分别给训练/工坊/灵兽栏/防御建筑建造材料−10%，不直接给全身战力乘数。转换需拆换学派核心且冷却10有效游玩小时，已造建筑不返优惠差价。\n\n首块宗址半径80米；避开固定NPC、安全救援点、主路、世界关键传送节点和受保护出生生态。世界提供按种子生成且可到达的3个候选，可自行勘探另一个合格地点；不是给玩家任意抢占安全区。显示高程/地基支撑/航路/危险范围，红色冲突处不能提交建设。\n\n## 2. 十二类建筑\n\n成本记作 `石/木石/陨材`：碎灵石、普通结构料单位、同阶普通陨材单位。表为一级地面建筑R2预算；建筑等级g=1—5，材料与耐久倍率为2^(g−1)，对应最低建造境界R(g+1)，母星最多g4(R5)。高阶g5需高级星球资源。空间类建筑还受专属前置，升级不自动创建新功能。\n\n|ID 建筑|基础成本|占地/建造有效在线分钟|实际功能|前置与防滥用|\n|---|---|---|---|---|\n|SB01 山门与界碑|800/20/4|8×6/5|记录归属、访客规则、战争告警|建宗第一项，不能堵唯一道路|\n|SB02 议事殿|1500/30/6|12×10/10|弟子岗位、事务、建设队列|SB01；不凭空生成NPC人口|\n|SB03 演武场|1000/20/4|16×12/8|木人、武技验证、比武|SB02；训练不给真实怪掉落|\n|SB04 静修室|1200/20/5|8×8/8|打坐环境+10%修为速率|沿用72小时离线封顶，不自动突破|\n|SB05 炼丹房|1500/20/8|10×8/10|已学丹方制作，保存批次队列|需会炼制的NPC/玩家，真材扣料|\n|SB06 铸器坊|1800/20/12|12×10/12|武器、鞍具、阵器维护|材料品级影响产物，不无限复制|\n|SB07 藏经阁|1200/20/6|10×8/8|传承研究与已得图纸归档|没有书不能点空菜单学绝技|\n|SB08 灵兽苑|1400/30/6|16×12/10|3只休息位、照护和训练|只收有契约宠物，不代打怪升级|\n|SB09 药圃|600/12/2|12×12/5|4个种植格、真实种苗产普通草药|只结算当前一批，离线不自动补种|\n|SB10 宗门仓库|1000/20/5|10×8/8|2000升/2000千克实体仓储|普通库不装活物；所有物品唯一ID|\n|SB11 阵枢台|2000/20/15|8×8/12|管理供能与节点，上限4座同时工作阵|至少识阵技能精通；每阵独立损坏|\n|SB12 远行台|3000/20/20|12×12/15|母星交通停靠，R6研究后可装跨星模块|前期不是跨星传送阵，不能跳过R6|\n\nSB04最多一个有效环境加成，不能叠一百房间挂机。药圃普通种苗4个每批在线60分钟产8份同阶普通药材，种子来自真实库存、需水和照料；成熟可离线一次结算但不连续播种，珍稀野生草药仍需要探索。炼丹/铸造产率与第03统一，不另给独立“宗门品质×2”。建筑等级只增加相应容量/耐久，工作效率额外每级+5%最高20%，不能把成本倍率误用成出货倍率。\n\n招募弟子由真实救援/访客/传闻事件产生。初始岗位3，SB02每级+2、最多11；每人有技能、食宿和报酬，分配后才工作。预算欠费暂停服务、不吞玩家库存；单机无离线战斗与扩张。宗门贡献是成员个人记录，宗门库的材料/灵石是组织资产，两账不能互换造钱。\n\n## 3. 十二种阵法\n\nAR是阵图ID，不是可堆无限伤害技能。学习R为最低要求；每阵初次制作需“对应阵图+同阶陨材+结构料”，表写 `陨材/结构料；布设秒；能量/秒`。初始供能晶每枚由10碎灵石充入100阵能，返还只退未使用整数阵能对应晶体余量，不生成新灵石；更高阶每阵能成本×6^(t−1)，t为阵阶、最低1。能量与灵石扣除采用整数账本，低阶阵t1。\n\n|ID 阵法|学习门槛|制作/运作预算|边界与效果|反制/限制|\n|---|---|---|---|---|\n|AR01 听风警阵|R1/D1|2/4；8；1|半径15，进入者经感知规则触发告警|破坏2节点之一失效，不穿墙定位|\n|AR02 四象壁阵|R2/D2|8/10；20；4|半径5几何罩，屏障强度40×6^t|击破核心/能量耗尽失效，不能全域无敌|\n|AR03 净息小阵|R1/D1|3/4；10；2|半径3，脱战回气速率+10%|不与同名叠加、不攻击、不越离线72小时|\n|AR04 荆棘困阵|R2/D2|5/8；15；3|半径4，入阵减速25%，最多3目标|可砍核心/离阵，减速走统一50%上限|\n|AR05 雷火杀阵|R3/D3|10/10；25；6|半径5，每3秒预警0.8秒后术雷伤10×6^t|用19灵抗计算；最多3目标，不能埋在不可见地下|\n|AR06 玄冰封阵|R3/D3|8/12；25；5|半径4，每6秒预警1秒冻0.6秒|共享控制递减，精英削韧替代|\n|AR07 回春疗阵|R2/D2|6/8；18；4|半径4，每4秒回复6×6^t生命，最多2友方|同名择强，不与宠物重复算同一次治疗|\n|AR08 藏影迷阵|R3/D3|8/10；20；4|半径5遮蔽声光，提高隐蔽但不隐身|近距观察/破妄/毁核心可破，不改玩家操作|\n|AR09 镇空阵|R4/D4|14/16；30；8|半径8高20圆柱，飞行耗能+20%、减速20%|边界提前可见，不直接关飞行使人坠死|\n|AR10 聚灵修阵|R3/D3|10/12；25；5|半径4修为速率+15%，需真实阵能|和静修室同属环境桶，环境总上限25%|\n|AR11 小界护库阵|R4/D4|16/18；40；6|保护一仓库入口，屏障60×6^t，显示能量|不是无限空间，不增加仓储容量，不吞入侵者|\n|AR12 星门定锚阵|R6/D5|30/30；60；12|校准已发现且授权的两端星门，传送另付门票|两端有效、星球权限和冷却都满足才传送|\n\n阵能表为运行最低值，AR02/11受击额外每吸收10×6^t伤害消耗1阵能，护盾每次启动满值但必须预付10阵能，停开有60秒CD，避免无成本刷盾。攻击阵按每3秒周期扣完整3秒能量后结算，不足时不发半价攻击。其他阵按一秒定步扣能，不随FPS翻倍。\n\n可携带便携阵盘，一人同时最多1座作战阵；宗址有阵枢最多4座，同名区域效果取最高，不乘算。便携预布设需要脱战，战斗中仅能启动已摆好的阵，不能随身搬杀阵追人；离开100米停止便携作战阵，不隔区自动杀怪刷材。阵阶t≤建造者境界且≤材料阶；供能品质只影响储能密度，不能暗中增加阵伤倍率。阵法掌握沿用五阶，伤害/治疗倍率同19，辅助比例不自动翻倍。\n\n节点有明确地面支撑、连线、距离上限（普通20米、星门节点40米）及所属阵ID；完整拓扑才工作。阵法力场渲染用VF07、阵盾VF04、阵攻击VF03；五阶纹样沿22，不用屏幕滤镜冒充世界3D。阵外可观察能量流，敌我都能找阵眼；队友规则写入阵的阵营快照，易主后必须停机重新授权，不能同一帧双重归属。\n\n## 4. 可破坏建筑、覆灭及救援\n\n刷新修订见[27](27_CONSUMPTION_AND_UNIQUE_WORLD.md)：完整建筑不因计时替换；无主废墟需实际清理和地权检查才允许新事件建设。玩家和宗门建筑始终用授权、扣料、施工的建设事务恢复，不进普通随机补充池，内存卸载也不算拆除。\n\n建筑一级基础耐久=600×6^建造境界，结构防御=20×6^建造境界，升级按上表；对建筑技能只有标记siegeEligible的重击、攻城器和预警阵攻击有效，普通打击也能造成低效伤害但乘0.1结构系数。使用19的物理/灵抗管线，目标境界取建造境界，不跟攻击者临时改变；建筑不吃暴击、生命偷取或宠物喂养收益。\n\n100—60%完整，60—25%明显破损，25—0%危房暂停服务，0%倒塌成可回收残骸。只生成预制破片和导航变化，不模拟每块砖无限物理体。倒塌预警至少3秒，先疏散交互/解除工作状态；玩家可能受已预警坠物伤害，但主线NPC转入伤员救援，不静默永久删除。\n\n议事殿与阵枢均失守且守军撤离才进入覆灭，不是一堵墙倒下立刻删宗门。玩家可以进攻敌对宗门，但首先获得敌意与救援后果预览；平民区/初始救援核心受剧情保护，不能摧毁唯一新手出口。R9毁星仅发生于明确允许的无人试炼星事件，不删除整个游戏存档与必需NPC。\n\n私人储物在倒塌时变为锁定废墟清单，唯一原物仍在账上；救援NPC以已记录instanceId办理找回，不能现场拾取和找回各得一份。组织公共物资可按战役预告损失上限10%，任务唯一物/宠物/个人知识不损失。普通废墟回收未损坏建材30%，主动拆除完好建筑返50%，折扣学派按实际投入返，不按原价返。\n\n重建先搭临时营地→救回导师→修仓库/山门→修议事殿→恢复服务；贡献、已做任务、历史阵图保留，不重领首建/入门奖。可选择另址复宗，sectId不变、siteId新建，旧废墟仍记录所属以供回收。主动解散需要清点私人与组织物品，显示具体处置再确认。\n\n## 5. 模块、存档与未来联网\n\n配置：SectDefinition、BuildingDefinition、FormationDefinition；实例：SectState、BuildingInstance、FormationInstance、EnergyLedger、SiegeEvent。持久键为worldId/sectId/siteId/buildingId/nodeId/ownerId；事件包含版本、时间、请求ID、已结算标记。建造先校验空间和材料→预占材料→建立施工实例→分阶段进度→竣工，取消只返未使用份额。加载后从施工实例恢复，不再扣一遍钱。\n\n世界刷新提出袭击候选→宗门系统校验剧情与准备窗口→战斗系统运行→库存系统结算→世界系统记录生态结果。暂停不推进建造、阵能或攻城；正常离线仅按已定义挂机/当前生产一批规则结算，不运行防卫模拟。加载种子不重掷是否袭击，也不复制残骸。\n\n联网以后由服务端拥有地权、阵能、战斗、宗门权限和物资事务；角色个人贡献与组织财库分权，宗主/长老/库管/成员/访客有明确权限。战争时间窗、下线保护、服务器区域分片必须另做联机设计与压力测试，不能把单机暂停保护原样带进共享世界。本地旧存档宗门与物品不直接导入正式联网经济。\n\n验收闭环：学识阵→布警阵→真实敌人进入告警→坏节点停止→修复恢复；创建宗门→扣费施工→药圃一批→真库存入库→攻城受损→救援→重建。重复保存/读档、背包满、阵能恰好不足、节点跨地形、同名阵重叠、NPC迁移、主机下线等均须单独测试。\n","html":"\u003ch1>24 · 建宗、建筑、阵法与覆灭重建\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-24-v001.svg\" alt=\"一个宗门的生命周期\">\u003c/p>\u003cp>\u003cem>图解：12建筑、12阵法；离线不偷偷模拟攻城毁掉玩家家园。\u003c/em>\u003c/p>\u003cp>设计稿；与\u003ca href=\"#23_SECTS_NPCS_MISSIONS_AND_DUELS.md\">23宗门\u003c/a>、\u003ca href=\"#08_WORLD_DIRECTOR.md\">08世界刷新\u003c/a>、\u003ca href=\"#11_CAVES_AND_FORTUNES.md\">11洞府\u003c/a>同项目维护。无需新开项目：宗门是世界中的持久实体，阵法是战斗/建筑模块，刷新系统只提出事件，不直接改库存或算伤害。\u003c/p>\u003ch2>1. 学习与创建路径\u003c/h2>\u003cp>R1三级可在N27学习“识阵与布基”：完成三个可重复安全练习（识别阵眼、连接两个节点、切断危险供能），收费200碎灵石，无随机失败。随后可学AR01告警和AR03净息小阵，私人洞府也能使用，不必先建宗。储物扩容仍走第10的原有基础技能，不以阵法技能替代。\u003c/p>\u003cp>R2五级可申请立宗：完成一次救援、一项建设实习、识阵与布基；交立宗费用10,000碎灵石、同阶普通陨材20单位、普通木石结构料40单位。费用预览可达性与当前持有量，不要求稀有内丹。成为宗主前退出正式宗籍，可保留访学关系。单机每角色同时一处主宗址、后续最多两处不独立产贡献的分院。\u003c/p>\u003cp>创建流程：选择学派→勘探候选地→检查地权/道路/生态→预览地基与预算→命名及纹章→确认投入→分阶段建设。学派为武修、丹器、御灵、守望四选一，分别给训练/工坊/灵兽栏/防御建筑建造材料−10%，不直接给全身战力乘数。转换需拆换学派核心且冷却10有效游玩小时，已造建筑不返优惠差价。\u003c/p>\u003cp>首块宗址半径80米；避开固定NPC、安全救援点、主路、世界关键传送节点和受保护出生生态。世界提供按种子生成且可到达的3个候选，可自行勘探另一个合格地点；不是给玩家任意抢占安全区。显示高程/地基支撑/航路/危险范围，红色冲突处不能提交建设。\u003c/p>\u003ch2>2. 十二类建筑\u003c/h2>\u003cp>成本记作 \u003ccode>石/木石/陨材\u003c/code>：碎灵石、普通结构料单位、同阶普通陨材单位。表为一级地面建筑R2预算；建筑等级g=1—5，材料与耐久倍率为2^(g−1)，对应最低建造境界R(g+1)，母星最多g4(R5)。高阶g5需高级星球资源。空间类建筑还受专属前置，升级不自动创建新功能。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 建筑\u003c/th>\u003cth>基础成本\u003c/th>\u003cth>占地/建造有效在线分钟\u003c/th>\u003cth>实际功能\u003c/th>\u003cth>前置与防滥用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SB01 山门与界碑\u003c/td>\u003ctd>800/20/4\u003c/td>\u003ctd>8×6/5\u003c/td>\u003ctd>记录归属、访客规则、战争告警\u003c/td>\u003ctd>建宗第一项，不能堵唯一道路\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB02 议事殿\u003c/td>\u003ctd>1500/30/6\u003c/td>\u003ctd>12×10/10\u003c/td>\u003ctd>弟子岗位、事务、建设队列\u003c/td>\u003ctd>SB01；不凭空生成NPC人口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB03 演武场\u003c/td>\u003ctd>1000/20/4\u003c/td>\u003ctd>16×12/8\u003c/td>\u003ctd>木人、武技验证、比武\u003c/td>\u003ctd>SB02；训练不给真实怪掉落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB04 静修室\u003c/td>\u003ctd>1200/20/5\u003c/td>\u003ctd>8×8/8\u003c/td>\u003ctd>打坐环境+10%修为速率\u003c/td>\u003ctd>沿用72小时离线封顶，不自动突破\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB05 炼丹房\u003c/td>\u003ctd>1500/20/8\u003c/td>\u003ctd>10×8/10\u003c/td>\u003ctd>已学丹方制作，保存批次队列\u003c/td>\u003ctd>需会炼制的NPC/玩家，真材扣料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB06 铸器坊\u003c/td>\u003ctd>1800/20/12\u003c/td>\u003ctd>12×10/12\u003c/td>\u003ctd>武器、鞍具、阵器维护\u003c/td>\u003ctd>材料品级影响产物，不无限复制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB07 藏经阁\u003c/td>\u003ctd>1200/20/6\u003c/td>\u003ctd>10×8/8\u003c/td>\u003ctd>传承研究与已得图纸归档\u003c/td>\u003ctd>没有书不能点空菜单学绝技\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB08 灵兽苑\u003c/td>\u003ctd>1400/30/6\u003c/td>\u003ctd>16×12/10\u003c/td>\u003ctd>3只休息位、照护和训练\u003c/td>\u003ctd>只收有契约宠物，不代打怪升级\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB09 药圃\u003c/td>\u003ctd>600/12/2\u003c/td>\u003ctd>12×12/5\u003c/td>\u003ctd>4个种植格、真实种苗产普通草药\u003c/td>\u003ctd>只结算当前一批，离线不自动补种\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB10 宗门仓库\u003c/td>\u003ctd>1000/20/5\u003c/td>\u003ctd>10×8/8\u003c/td>\u003ctd>2000升/2000千克实体仓储\u003c/td>\u003ctd>普通库不装活物；所有物品唯一ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB11 阵枢台\u003c/td>\u003ctd>2000/20/15\u003c/td>\u003ctd>8×8/12\u003c/td>\u003ctd>管理供能与节点，上限4座同时工作阵\u003c/td>\u003ctd>至少识阵技能精通；每阵独立损坏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SB12 远行台\u003c/td>\u003ctd>3000/20/20\u003c/td>\u003ctd>12×12/15\u003c/td>\u003ctd>母星交通停靠，R6研究后可装跨星模块\u003c/td>\u003ctd>前期不是跨星传送阵，不能跳过R6\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>SB04最多一个有效环境加成，不能叠一百房间挂机。药圃普通种苗4个每批在线60分钟产8份同阶普通药材，种子来自真实库存、需水和照料；成熟可离线一次结算但不连续播种，珍稀野生草药仍需要探索。炼丹/铸造产率与第03统一，不另给独立“宗门品质×2”。建筑等级只增加相应容量/耐久，工作效率额外每级+5%最高20%，不能把成本倍率误用成出货倍率。\u003c/p>\u003cp>招募弟子由真实救援/访客/传闻事件产生。初始岗位3，SB02每级+2、最多11；每人有技能、食宿和报酬，分配后才工作。预算欠费暂停服务、不吞玩家库存；单机无离线战斗与扩张。宗门贡献是成员个人记录，宗门库的材料/灵石是组织资产，两账不能互换造钱。\u003c/p>\u003ch2>3. 十二种阵法\u003c/h2>\u003cp>AR是阵图ID，不是可堆无限伤害技能。学习R为最低要求；每阵初次制作需“对应阵图+同阶陨材+结构料”，表写 \u003ccode>陨材/结构料；布设秒；能量/秒\u003c/code>。初始供能晶每枚由10碎灵石充入100阵能，返还只退未使用整数阵能对应晶体余量，不生成新灵石；更高阶每阵能成本×6^(t−1)，t为阵阶、最低1。能量与灵石扣除采用整数账本，低阶阵t1。\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ID 阵法\u003c/th>\u003cth>学习门槛\u003c/th>\u003cth>制作/运作预算\u003c/th>\u003cth>边界与效果\u003c/th>\u003cth>反制/限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>AR01 听风警阵\u003c/td>\u003ctd>R1/D1\u003c/td>\u003ctd>2/4；8；1\u003c/td>\u003ctd>半径15，进入者经感知规则触发告警\u003c/td>\u003ctd>破坏2节点之一失效，不穿墙定位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR02 四象壁阵\u003c/td>\u003ctd>R2/D2\u003c/td>\u003ctd>8/10；20；4\u003c/td>\u003ctd>半径5几何罩，屏障强度40×6^t\u003c/td>\u003ctd>击破核心/能量耗尽失效，不能全域无敌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR03 净息小阵\u003c/td>\u003ctd>R1/D1\u003c/td>\u003ctd>3/4；10；2\u003c/td>\u003ctd>半径3，脱战回气速率+10%\u003c/td>\u003ctd>不与同名叠加、不攻击、不越离线72小时\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR04 荆棘困阵\u003c/td>\u003ctd>R2/D2\u003c/td>\u003ctd>5/8；15；3\u003c/td>\u003ctd>半径4，入阵减速25%，最多3目标\u003c/td>\u003ctd>可砍核心/离阵，减速走统一50%上限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR05 雷火杀阵\u003c/td>\u003ctd>R3/D3\u003c/td>\u003ctd>10/10；25；6\u003c/td>\u003ctd>半径5，每3秒预警0.8秒后术雷伤10×6^t\u003c/td>\u003ctd>用19灵抗计算；最多3目标，不能埋在不可见地下\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR06 玄冰封阵\u003c/td>\u003ctd>R3/D3\u003c/td>\u003ctd>8/12；25；5\u003c/td>\u003ctd>半径4，每6秒预警1秒冻0.6秒\u003c/td>\u003ctd>共享控制递减，精英削韧替代\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR07 回春疗阵\u003c/td>\u003ctd>R2/D2\u003c/td>\u003ctd>6/8；18；4\u003c/td>\u003ctd>半径4，每4秒回复6×6^t生命，最多2友方\u003c/td>\u003ctd>同名择强，不与宠物重复算同一次治疗\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR08 藏影迷阵\u003c/td>\u003ctd>R3/D3\u003c/td>\u003ctd>8/10；20；4\u003c/td>\u003ctd>半径5遮蔽声光，提高隐蔽但不隐身\u003c/td>\u003ctd>近距观察/破妄/毁核心可破，不改玩家操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR09 镇空阵\u003c/td>\u003ctd>R4/D4\u003c/td>\u003ctd>14/16；30；8\u003c/td>\u003ctd>半径8高20圆柱，飞行耗能+20%、减速20%\u003c/td>\u003ctd>边界提前可见，不直接关飞行使人坠死\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR10 聚灵修阵\u003c/td>\u003ctd>R3/D3\u003c/td>\u003ctd>10/12；25；5\u003c/td>\u003ctd>半径4修为速率+15%，需真实阵能\u003c/td>\u003ctd>和静修室同属环境桶，环境总上限25%\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR11 小界护库阵\u003c/td>\u003ctd>R4/D4\u003c/td>\u003ctd>16/18；40；6\u003c/td>\u003ctd>保护一仓库入口，屏障60×6^t，显示能量\u003c/td>\u003ctd>不是无限空间，不增加仓储容量，不吞入侵者\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AR12 星门定锚阵\u003c/td>\u003ctd>R6/D5\u003c/td>\u003ctd>30/30；60；12\u003c/td>\u003ctd>校准已发现且授权的两端星门，传送另付门票\u003c/td>\u003ctd>两端有效、星球权限和冷却都满足才传送\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>阵能表为运行最低值，AR02/11受击额外每吸收10×6^t伤害消耗1阵能，护盾每次启动满值但必须预付10阵能，停开有60秒CD，避免无成本刷盾。攻击阵按每3秒周期扣完整3秒能量后结算，不足时不发半价攻击。其他阵按一秒定步扣能，不随FPS翻倍。\u003c/p>\u003cp>可携带便携阵盘，一人同时最多1座作战阵；宗址有阵枢最多4座，同名区域效果取最高，不乘算。便携预布设需要脱战，战斗中仅能启动已摆好的阵，不能随身搬杀阵追人；离开100米停止便携作战阵，不隔区自动杀怪刷材。阵阶t≤建造者境界且≤材料阶；供能品质只影响储能密度，不能暗中增加阵伤倍率。阵法掌握沿用五阶，伤害/治疗倍率同19，辅助比例不自动翻倍。\u003c/p>\u003cp>节点有明确地面支撑、连线、距离上限（普通20米、星门节点40米）及所属阵ID；完整拓扑才工作。阵法力场渲染用VF07、阵盾VF04、阵攻击VF03；五阶纹样沿22，不用屏幕滤镜冒充世界3D。阵外可观察能量流，敌我都能找阵眼；队友规则写入阵的阵营快照，易主后必须停机重新授权，不能同一帧双重归属。\u003c/p>\u003ch2>4. 可破坏建筑、覆灭及救援\u003c/h2>\u003cp>刷新修订见\u003ca href=\"#27_CONSUMPTION_AND_UNIQUE_WORLD.md\">27\u003c/a>：完整建筑不因计时替换；无主废墟需实际清理和地权检查才允许新事件建设。玩家和宗门建筑始终用授权、扣料、施工的建设事务恢复，不进普通随机补充池，内存卸载也不算拆除。\u003c/p>\u003cp>建筑一级基础耐久=600×6^建造境界，结构防御=20×6^建造境界，升级按上表；对建筑技能只有标记siegeEligible的重击、攻城器和预警阵攻击有效，普通打击也能造成低效伤害但乘0.1结构系数。使用19的物理/灵抗管线，目标境界取建造境界，不跟攻击者临时改变；建筑不吃暴击、生命偷取或宠物喂养收益。\u003c/p>\u003cp>100—60%完整，60—25%明显破损，25—0%危房暂停服务，0%倒塌成可回收残骸。只生成预制破片和导航变化，不模拟每块砖无限物理体。倒塌预警至少3秒，先疏散交互/解除工作状态；玩家可能受已预警坠物伤害，但主线NPC转入伤员救援，不静默永久删除。\u003c/p>\u003cp>议事殿与阵枢均失守且守军撤离才进入覆灭，不是一堵墙倒下立刻删宗门。玩家可以进攻敌对宗门，但首先获得敌意与救援后果预览；平民区/初始救援核心受剧情保护，不能摧毁唯一新手出口。R9毁星仅发生于明确允许的无人试炼星事件，不删除整个游戏存档与必需NPC。\u003c/p>\u003cp>私人储物在倒塌时变为锁定废墟清单，唯一原物仍在账上；救援NPC以已记录instanceId办理找回，不能现场拾取和找回各得一份。组织公共物资可按战役预告损失上限10%，任务唯一物/宠物/个人知识不损失。普通废墟回收未损坏建材30%，主动拆除完好建筑返50%，折扣学派按实际投入返，不按原价返。\u003c/p>\u003cp>重建先搭临时营地→救回导师→修仓库/山门→修议事殿→恢复服务；贡献、已做任务、历史阵图保留，不重领首建/入门奖。可选择另址复宗，sectId不变、siteId新建，旧废墟仍记录所属以供回收。主动解散需要清点私人与组织物品，显示具体处置再确认。\u003c/p>\u003ch2>5. 模块、存档与未来联网\u003c/h2>\u003cp>配置：SectDefinition、BuildingDefinition、FormationDefinition；实例：SectState、BuildingInstance、FormationInstance、EnergyLedger、SiegeEvent。持久键为worldId/sectId/siteId/buildingId/nodeId/ownerId；事件包含版本、时间、请求ID、已结算标记。建造先校验空间和材料→预占材料→建立施工实例→分阶段进度→竣工，取消只返未使用份额。加载后从施工实例恢复，不再扣一遍钱。\u003c/p>\u003cp>世界刷新提出袭击候选→宗门系统校验剧情与准备窗口→战斗系统运行→库存系统结算→世界系统记录生态结果。暂停不推进建造、阵能或攻城；正常离线仅按已定义挂机/当前生产一批规则结算，不运行防卫模拟。加载种子不重掷是否袭击，也不复制残骸。\u003c/p>\u003cp>联网以后由服务端拥有地权、阵能、战斗、宗门权限和物资事务；角色个人贡献与组织财库分权，宗主/长老/库管/成员/访客有明确权限。战争时间窗、下线保护、服务器区域分片必须另做联机设计与压力测试，不能把单机暂停保护原样带进共享世界。本地旧存档宗门与物品不直接导入正式联网经济。\u003c/p>\u003cp>验收闭环：学识阵→布警阵→真实敌人进入告警→坏节点停止→修复恢复；创建宗门→扣费施工→药圃一批→真库存入库→攻城受损→救援→重建。重复保存/读档、背包满、阵能恰好不足、节点跨地形、同名阵重叠、NPC迁移、主机下线等均须单独测试。\u003c/p>"},{"file":"25_ILLUSTRATED_READING_GUIDE.md","title":"25 · 图文阅读路线","text":"# 25 · 图文阅读路线\n\n\u003c!-- illustrated-overview:start -->\n![图文手册阅读路线](media/diagram-25-v001.svg)\n\n*图解：图帮助理解，实际规则以同章表格与明确例外为准。*\n\u003c!-- illustrated-overview:end -->\n\n这是一份可逐章查看的设计手册。每章开头都有一张规则概览图，详细表格仍作为制作与计算依据；概念画帮助理解气质，流程图解释规则，两者不能当作已经实现的游戏画面。\n\n![双分身、归一和隐秘遗宝](media/mythic-triptych-v001.png)\n\n**推荐直接打开[图文手册](illustrated-guide.html)**：左侧选章、搜索标题/正文，右侧看图、表与详细说明；支持离线打开，无需登录或连接游戏。手机窄屏会将目录折为上方列表，可打印当前章节。修改Markdown后执行 `node tools/build-cultivation-guide.cjs` 同步网页。\n\n## 从一个角色的一天读起\n\n|想先弄懂什么|推荐章节|看图时关注|\n|---|---|---|\n|怎么变强|01→03→19|境界基础、材料品质、同类先加再乘|\n|为什么要探索|04→08→11→26|地区危险、持久线索、普通收获与极稀有传承分开|\n|怎么打得舒服|02→13→20→22|动作、追逐、前摇、命中体积与真实3D一致|\n|宠物怎样陪伴和战斗|15→16→17→18→21|收服、个体身份、两主动、飞行权限|\n|宗门怎样成为家|05→23→24|NPC任务、有效兑换、建设、供能、防卫和重建|\n|开发怎么逐步做|07→09→14|真实小闭环、可追溯数据、单机先行|\n\n## 图例和读法\n\n- **蓝色信息块**：玩家观察、准备和操作。\n- **金色结果块**：获得收益或进入下一状态，不表示必定得到稀有物品。\n- **箭头**：合法流程；图里省略的具体前置以同章表格为准。\n- **概念插图**：表现方向；模型轮廓、动画、尺寸和碰撞需要后续3D验收。\n- **数值示例**：固定输入下的运算，不是已经验证的全局战斗平衡。\n\n## 本轮新增视觉内容\n\n各规则章01—24配独立主题SVG概览，26配三清状态图、27配消耗换代图、28配游历夺宝图、29配十方组织图；总览与本阅读页配阅读路径图，并复用一张三联概念插画。共30张规则图。SVG是可维护的矢量规则图；插画由内置imagegen生成，源提示词、SHA-256及来源记录在[媒体清单v005](media/MEDIA_MANIFEST_v005.json)，v001—v004历史清单仍保留。全部文件已存入项目，独立异地备份仍未配置。\n\n未来重点补画每种宠物与武器的正侧背面、关键动作分镜、宗门建筑俯视布局和阵眼节点。需先验证玩法样板再批量制作，避免拿大量气氛图代替可用3D资产。\n","html":"\u003ch1>25 · 图文阅读路线\u003c/h1>\u003cp>\u003cimg loading=\"lazy\" src=\"media/diagram-25-v001.svg\" alt=\"图文手册阅读路线\">\u003c/p>\u003cp>\u003cem>图解：图帮助理解，实际规则以同章表格与明确例外为准。\u003c/em>\u003c/p>\u003cp>这是一份可逐章查看的设计手册。每章开头都有一张规则概览图，详细表格仍作为制作与计算依据；概念画帮助理解气质，流程图解释规则，两者不能当作已经实现的游戏画面。\u003c/p>\u003cp>\u003cimg loading=\"lazy\" src=\"media/mythic-triptych-v001.png\" alt=\"双分身、归一和隐秘遗宝\">\u003c/p>\u003cp>\u003cstrong>推荐直接打开\u003ca href=\"illustrated-guide.html\">图文手册\u003c/a>\u003c/strong>：左侧选章、搜索标题/正文，右侧看图、表与详细说明；支持离线打开，无需登录或连接游戏。手机窄屏会将目录折为上方列表，可打印当前章节。修改Markdown后执行 \u003ccode>node tools/build-cultivation-guide.cjs\u003c/code> 同步网页。\u003c/p>\u003ch2>从一个角色的一天读起\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>想先弄懂什么\u003c/th>\u003cth>推荐章节\u003c/th>\u003cth>看图时关注\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>怎么变强\u003c/td>\u003ctd>01→03→19\u003c/td>\u003ctd>境界基础、材料品质、同类先加再乘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>为什么要探索\u003c/td>\u003ctd>04→08→11→26\u003c/td>\u003ctd>地区危险、持久线索、普通收获与极稀有传承分开\u003c/td>\u003c/tr>\u003ctr>\u003ctd>怎么打得舒服\u003c/td>\u003ctd>02→13→20→22\u003c/td>\u003ctd>动作、追逐、前摇、命中体积与真实3D一致\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宠物怎样陪伴和战斗\u003c/td>\u003ctd>15→16→17→18→21\u003c/td>\u003ctd>收服、个体身份、两主动、飞行权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宗门怎样成为家\u003c/td>\u003ctd>05→23→24\u003c/td>\u003ctd>NPC任务、有效兑换、建设、供能、防卫和重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开发怎么逐步做\u003c/td>\u003ctd>07→09→14\u003c/td>\u003ctd>真实小闭环、可追溯数据、单机先行\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>图例和读法\u003c/h2>\u003cul>\u003cli>\u003cstrong>蓝色信息块\u003c/strong>：玩家观察、准备和操作。\u003c/li>\u003cli>\u003cstrong>金色结果块\u003c/strong>：获得收益或进入下一状态，不表示必定得到稀有物品。\u003c/li>\u003cli>\u003cstrong>箭头\u003c/strong>：合法流程；图里省略的具体前置以同章表格为准。\u003c/li>\u003cli>\u003cstrong>概念插图\u003c/strong>：表现方向；模型轮廓、动画、尺寸和碰撞需要后续3D验收。\u003c/li>\u003cli>\u003cstrong>数值示例\u003c/strong>：固定输入下的运算，不是已经验证的全局战斗平衡。\u003c/li>\u003c/ul>\u003ch2>本轮新增视觉内容\u003c/h2>\u003cp>各规则章01—24配独立主题SVG概览，26配三清状态图、27配消耗换代图、28配游历夺宝图、29配十方组织图；总览与本阅读页配阅读路径图，并复用一张三联概念插画。共30张规则图。SVG是可维护的矢量规则图；插画由内置imagegen生成，源提示词、SHA-256及来源记录在\u003ca href=\"media/MEDIA_MANIFEST_v005.json\">媒体清单v005\u003c/a>，v001—v004历史清单仍保留。全部文件已存入项目，独立异地备份仍未配置。\u003c/p>\u003cp>未来重点补画每种宠物与武器的正侧背面、关键动作分镜、宗门建筑俯视布局和阵眼节点。需先验证玩法样板再批量制作，避免拿大量气氛图代替可用3D资产。\u003c/p>"},{"file":"26_HEAVEN_DEFYING_LEGACIES.md","title":"26 · 逆天传承、唯一遗兵与不可预料的机缘","text":"# 26 · 逆天传承、唯一遗兵与不可预料的机缘\n\n\u
