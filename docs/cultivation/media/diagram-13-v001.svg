<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="1120" height="510" rx="20" fill="#102c34"/><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif} .title{font-size:29px;font-weight:700;fill:#f5ecd7}.h{font-size:23px;font-weight:700;fill:#163440}.b{font-size:18px;fill:#365660}.f{font-size:16px;fill:#cee0e1}</style><text x="42" y="55" class="title">高手为何能追上新手</text><text x="42" y="83" class="f">星渊 · 设计规则概览 / DESIGN NOTE</text><rect x="42" y="112" width="500" height="126" rx="12" fill="#d9eee9"/><circle cx="77" cy="148" r="17" fill="#163440"/><text x="72" y="154" fill="white" font-size="17">1</text><text x="107" y="157" class="h">境界基础速度</text><text x="67" y="200" class="b">每境独立递增</text><rect x="572" y="112" width="500" height="126" rx="12" fill="#e3eafa"/><circle cx="607" cy="148" r="17" fill="#163440"/><text x="602" y="154" fill="white" font-size="17">2</text><text x="637" y="157" class="h">构筑与负重</text><text x="597" y="200" class="b">加成有上限 · 重物拖慢</text><rect x="42" y="264" width="500" height="126" rx="12" fill="#efe3c8"/><circle cx="77" cy="300" r="17" fill="#163440"/><text x="72" y="306" fill="white" font-size="17">3</text><text x="107" y="309" class="h">运动与地形</text><text x="67" y="352" class="b">加速 · 转弯 · 路径</text><rect x="572" y="264" width="500" height="126" rx="12" fill="#e4edd6"/><circle cx="607" cy="300" r="17" fill="#163440"/><text x="602" y="306" fill="white" font-size="17">4</text><text x="637" y="309" class="h">感知与追逐</text><text x="597" y="352" class="b">看见 → 搜索 → 脱战</text><text x="42" y="443" class="f">敌人按自身能力追击，不瞬间复制玩家速度。</text><path d="M548 176h17m-6-6 6 6-6 6M548 327h17m-6-6 6 6-6 6" stroke="#c6ad76" fill="none" stroke-width="2"/></svg>