<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="1120" height="510" rx="20" fill="#102c34"/><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif} .title{font-size:29px;font-weight:700;fill:#f5ecd7}.h{font-size:23px;font-weight:700;fill:#163440}.b{font-size:18px;fill:#365660}.f{font-size:16px;fill:#cee0e1}</style><text x="42" y="55" class="title">消耗后换代，原器永不复制</text><text x="42" y="83" class="f">星渊 · 设计规则概览 / DESIGN NOTE</text><rect x="42" y="112" width="500" height="126" rx="12" fill="#d9eee9"/><circle cx="77" cy="148" r="17" fill="#163440"/><text x="72" y="154" fill="white" font-size="17">1</text><text x="107" y="157" class="h">实际消耗提交</text><text x="67" y="200" class="b">击败 / 采尽 / 清理 / 售出</text><rect x="572" y="112" width="500" height="126" rx="12" fill="#e3eafa"/><circle cx="607" cy="148" r="17" fill="#163440"/><text x="602" y="154" fill="white" font-size="17">2</text><text x="637" y="157" class="h">空缺与冷却</text><text x="597" y="200" class="b">一个令牌只补充一代</text><rect x="42" y="264" width="500" height="126" rx="12" fill="#efe3c8"/><circle cx="77" cy="300" r="17" fill="#163440"/><text x="72" y="306" fill="white" font-size="17">3</text><text x="107" y="309" class="h">合法新组合</text><text x="67" y="352" class="b">生态不乱 · 旧物不重抽</text><rect x="572" y="264" width="500" height="126" rx="12" fill="#e4edd6"/><circle cx="607" cy="300" r="17" fill="#163440"/><text x="602" y="306" fill="white" font-size="17">4</text><text x="637" y="309" class="h">唯一账先占位</text><text x="597" y="352" class="b">交易 / 丢弃 / 换角不复位</text><text x="42" y="443" class="f">时间到不是刷新理由；玩家建筑必须真实扣料重建，原器只流转原实例。</text><path d="M548 176h17m-6-6 6 6-6 6M548 327h17m-6-6 6 6-6 6" stroke="#c6ad76" fill="none" stroke-width="2"/></svg>