<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="1120" height="510" rx="20" fill="#102c34"/><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif} .title{font-size:29px;font-weight:700;fill:#f5ecd7}.h{font-size:23px;font-weight:700;fill:#163440}.b{font-size:18px;fill:#365660}.f{font-size:16px;fill:#cee0e1}</style><text x="42" y="55" class="title">单机先行，联网留边界</text><text x="42" y="83" class="f">星渊 · 设计规则概览 / DESIGN NOTE</text><rect x="42" y="112" width="500" height="126" rx="12" fill="#d9eee9"/><circle cx="77" cy="148" r="17" fill="#163440"/><text x="72" y="154" fill="white" font-size="17">1</text><text x="107" y="157" class="h">当前单机</text><text x="67" y="200" class="b">本地世界与角色ID</text><rect x="572" y="112" width="500" height="126" rx="12" fill="#e3eafa"/><circle cx="607" cy="148" r="17" fill="#163440"/><text x="602" y="154" fill="white" font-size="17">2</text><text x="637" y="157" class="h">分离账本</text><text x="597" y="200" class="b">个人 / 宗门 / 容器</text><rect x="42" y="264" width="500" height="126" rx="12" fill="#efe3c8"/><circle cx="77" cy="300" r="17" fill="#163440"/><text x="72" y="306" fill="white" font-size="17">3</text><text x="107" y="309" class="h">未来服务端</text><text x="67" y="352" class="b">裁决交易、战斗与地权</text><rect x="572" y="264" width="500" height="126" rx="12" fill="#e4edd6"/><circle cx="607" cy="300" r="17" fill="#163440"/><text x="602" y="306" fill="white" font-size="17">4</text><text x="637" y="309" class="h">独立在线经济</text><text x="597" y="352" class="b">不直接导入本地财富</text><text x="42" y="443" class="f">本地暂停规则不能直接用在所有人共享的世界。</text><path d="M548 176h17m-6-6 6 6-6 6M548 327h17m-6-6 6 6-6 6" stroke="#c6ad76" fill="none" stroke-width="2"/></svg>